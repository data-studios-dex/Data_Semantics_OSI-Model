      - name: active_prescriber_count
        business_name: Active Prescriber Count
        description: >-
          Total number of unique active prescribers. Count of distinct prescriber_id values where active_flag = true.
          Use this metric for current prescriber network analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(DISTINCT prescriber.prescriber_id) AS active_prescriber_count
                FROM pharma_bronze.prescriber AS prescriber
                WHERE prescriber.active_flag = true
              columns_used:
                - prescriber.prescriber_id
                - prescriber.active_flag
      
      - name: average_copay_per_patient
        business_name: Average Copay per Patient
        description: >-
          Average copay amount per patient across all prescriptions. Calculated as total copay amount divided by
          distinct patient count. Use this metric to understand typical patient out-of-pocket burden.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT prescription.patient_id) = 0 THEN 0
                        ELSE SUM(prescription.copay_amount) / COUNT(DISTINCT prescription.patient_id)
                    END AS average_copay_per_patient
                FROM pharma_bronze.prescription AS prescription
              columns_used:
                - prescription.copay_amount
                - prescription.patient_id
      
      - name: prescriptions_per_patient
        business_name: Prescriptions per Patient
        description: >-
          Average number of prescriptions per patient. Calculated as total prescription count divided by
          distinct patient count. Use this metric to understand prescription utilization patterns.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT prescription.patient_id) = 0 THEN 0
                        ELSE COUNT(prescription.prescription_id)::DECIMAL / COUNT(DISTINCT prescription.patient_id)
                    END AS prescriptions_per_patient
                FROM pharma_bronze.prescription AS prescription
              columns_used:
                - prescription.prescription_id
                - prescription.patient_id
      
      - name: prescriptions_per_prescriber
        business_name: Prescriptions per Prescriber
        description: >-
          Average number of prescriptions per prescriber. Calculated as total prescription count divided by
          distinct prescriber count. Use this metric to understand prescriber productivity.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT prescription.prescriber_id) = 0 THEN 0
                        ELSE COUNT(prescription.prescription_id)::DECIMAL / COUNT(DISTINCT prescription.prescriber_id)
                    END AS prescriptions_per_prescriber
                FROM pharma_bronze.prescription AS prescription
              columns_used:
                - prescription.prescription_id
                - prescription.prescriber_id
      
      - name: average_drug_unit_price
        business_name: Average Drug Unit Price
        description: >-
          Average unit price across all drugs in the formulary. Calculated as the mean of drug.unit_price.
          Use this metric for drug pricing analysis.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(drug.unit_price) AS average_drug_unit_price
                FROM pharma_bronze.drug AS drug
              columns_used:
                - drug.unit_price
      
      - name: total_quantity_dispensed
        business_name: Total Quantity Dispensed
        description: >-
          Total number of drug units dispensed across all prescriptions. Sum of prescription.quantity.
          Use this metric for drug volume analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(prescription.quantity) AS total_quantity_dispensed
                FROM pharma_bronze.prescription AS prescription
              columns_used:
                - prescription.quantity
      
      - name: average_days_supply
        business_name: Average Days Supply
        description: >-
          Average number of days supply per prescription. Calculated as the mean of prescription.days_supply.
          Use this metric to understand typical prescription duration.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(prescription.days_supply) AS average_days_supply
                FROM pharma_bronze.prescription AS prescription
              columns_used:
                - prescription.days_supply
      
      - name: refill_rate
        business_name: Refill Rate
        description: >-
          Percentage of prescriptions that are refills (refill_number > 1) out of total prescriptions.
          Calculated as count of prescriptions with refill_number > 1 divided by total prescription count, multiplied by 100.
          Use this metric to understand prescription refill patterns and adherence.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(prescription.prescription_id) = 0 THEN 0
                        ELSE (
                            COUNT(CASE WHEN prescription.refill_number > 1 THEN 1 END)::DECIMAL
                            / COUNT(prescription.prescription_id) * 100
                        )
                    END AS refill_rate
                FROM pharma_bronze.prescription AS prescription
              columns_used:
                - prescription.prescription_id
                - prescription.refill_number
      
      - name: average_refills_allowed
        business_name: Average Refills Allowed
        description: >-
          Average number of refills authorized per prescription. Calculated as the mean of prescription.refills_allowed.
          Use this metric to understand typical refill authorization patterns.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(prescription.refills_allowed) AS average_refills_allowed
                FROM pharma_bronze.prescription AS prescription
              columns_used:
                - prescription.refills_allowed
      
      - name: revenue_per_patient
        business_name: Revenue per Patient
        description: >-
          Average prescription revenue per patient. Calculated as total prescription revenue divided by
          distinct patient count. Use this metric to understand patient-level revenue contribution.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT prescription.patient_id) = 0 THEN 0
                        ELSE SUM(prescription.total_amount) / COUNT(DISTINCT prescription.patient_id)
                    END AS revenue_per_patient
                FROM pharma_bronze.prescription AS prescription
              columns_used:
                - prescription.total_amount
                - prescription.patient_id
      
      - name: monthly_prescription_revenue
        business_name: Monthly Prescription Revenue
        description: >-
          Total prescription revenue aggregated by month. Sum of prescription.total_amount grouped by
          year and month extracted from rx_timestamp. Use this metric for monthly revenue trend analysis.
        return_type: currency_usd
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('month', prescription.rx_timestamp) AS month,
                    SUM(prescription.total_amount) AS monthly_prescription_revenue
                FROM pharma_bronze.prescription AS prescription
                GROUP BY DATE_TRUNC('month', prescription.rx_timestamp)
                ORDER BY month
              columns_used:
                - prescription.rx_timestamp
                - prescription.total_amount
      
      - name: monthly_prescription_count
        business_name: Monthly Prescription Count
        description: >-
          Total prescription count aggregated by month. Count of prescriptions grouped by
          year and month extracted from rx_timestamp. Use this metric for monthly volume trend analysis.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('month', prescription.rx_timestamp) AS month,
                    COUNT(prescription.prescription_id) AS monthly_prescription_count
                FROM pharma_bronze.prescription AS prescription
                GROUP BY DATE_TRUNC('month', prescription.rx_timestamp)
                ORDER BY month
              columns_used:
                - prescription.rx_timestamp
                - prescription.prescription_id
      
      - name: prescriptions_by_therapeutic_class
        business_name: Prescriptions by Therapeutic Class
        description: >-
          Prescription count by drug therapeutic class. Count of prescriptions grouped by drug.therapeutic_class.
          Use this metric to analyze prescription volume by therapeutic category.
        return_type: integer
        result_grain: one row per therapeutic class
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    drug.therapeutic_class,
                    COUNT(prescription.prescription_id) AS prescription_count
                FROM pharma_bronze.prescription AS prescription
                INNER JOIN pharma_bronze.drug AS drug
                    ON prescription.drug_id = drug.drug_id
                GROUP BY drug.therapeutic_class
                ORDER BY prescription_count DESC
              columns_used:
                - prescription.prescription_id
                - prescription.drug_id
                - drug.drug_id
                - drug.therapeutic_class
      
      - name: revenue_by_therapeutic_class
        business_name: Revenue by Therapeutic Class
        description: >-
          Prescription revenue by drug therapeutic class. Sum of prescription.total_amount grouped by drug.therapeutic_class.
          Use this metric to analyze revenue contribution by therapeutic category.
        return_type: currency_usd
        result_grain: one row per therapeutic class
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    drug.therapeutic_class,
                    SUM(prescription.total_amount) AS revenue
                FROM pharma_bronze.prescription AS prescription
                INNER JOIN pharma_bronze.drug AS drug
                    ON prescription.drug_id = drug.drug_id
                GROUP BY drug.therapeutic_class
                ORDER BY revenue DESC
              columns_used:
                - prescription.total_amount
                - prescription.drug_id
                - drug.drug_id
                - drug.therapeutic_class
      
      - name: prescriptions_by_specialty
        business_name: Prescriptions by Specialty
        description: >-
          Prescription count by prescriber specialty. Count of prescriptions grouped by prescriber.specialty.
          Use this metric to analyze prescribing patterns by clinical specialty.
        return_type: integer
        result_grain: one row per specialty
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    prescriber.specialty,
                    COUNT(prescription.prescription_id) AS prescription_count
                FROM pharma_bronze.prescription AS prescription
                INNER JOIN pharma_bronze.prescriber AS prescriber
                    ON prescription.prescriber_id = prescriber.prescriber_id
                GROUP BY prescriber.specialty
                ORDER BY prescription_count DESC
              columns_used:
                - prescription.prescription_id
                - prescription.prescriber_id
                - prescriber.prescriber_id
                - prescriber.specialty
      
      - name: prescriptions_by_channel
        business_name: Prescriptions by Channel
        description: >-
          Prescription count by pharmacy distribution channel. Count of prescriptions grouped by pharmacy.channel.
          Use this metric to analyze prescription volume by distribution channel (Retail, Mail Order, Specialty).
        return_type: integer
        result_grain: one row per channel
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    pharmacy.channel,
                    COUNT(prescription.prescription_id) AS prescription_count
                FROM pharma_bronze.prescription AS prescription
                INNER JOIN pharma_bronze.pharmacy AS pharmacy
                    ON prescription.pharmacy_id = pharmacy.pharmacy_id
                GROUP BY pharmacy.channel
                ORDER BY prescription_count DESC
              columns_used:
                - prescription.prescription_id
                - prescription.pharmacy_id
                - pharmacy.pharmacy_id
                - pharmacy.channel
      
      - name: prescriptions_by_insurance_type
        business_name: Prescriptions by Insurance Type
        description: >-
          Prescription count by patient insurance type. Count of prescriptions grouped by patient.insurance_type.
          Use this metric to analyze prescription volume by payer type (Commercial, Medicare, Medicaid).
        return_type: integer
        result_grain: one row per insurance type
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    patient.insurance_type,
                    COUNT(prescription.prescription_id) AS prescription_count
                FROM pharma_bronze.prescription AS prescription
                INNER JOIN pharma_bronze.patient AS patient
                    ON prescription.patient_id = patient.patient_id
                GROUP BY patient.insurance_type
                ORDER BY prescription_count DESC
              columns_used:
                - prescription.prescription_id
                - prescription.patient_id
                - patient.patient_id
                - patient.insurance_type
      
      - name: top_drugs_by_revenue
        business_name: Top Drugs by Revenue
        description: >-
          Top drugs ranked by prescription revenue. Sum of prescription.total_amount grouped by drug name,
          ordered by revenue descending. Use this metric to identify highest revenue-generating drugs.
        return_type: currency_usd
        result_grain: one row per drug
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    drug.name AS drug_name,
                    drug.generic_name,
                    SUM(prescription.total_amount) AS revenue,
                    COUNT(prescription.prescription_id) AS prescription_count
                FROM pharma_bronze.prescription AS prescription
                INNER JOIN pharma_bronze.drug AS drug
                    ON prescription.drug_id = drug.drug_id
                GROUP BY drug.name, drug.generic_name
                ORDER BY revenue DESC
              columns_used:
                - prescription.total_amount
                - prescription.prescription_id
                - prescription.drug_id
                - drug.drug_id
                - drug.name
                - drug.generic_name
      
      - name: top_prescribers_by_volume
        business_name: Top Prescribers by Volume
        description: >-
          Top prescribers ranked by prescription volume. Count of prescriptions grouped by prescriber,
          ordered by prescription count descending. Use this metric to identify most active prescribers.
        return_type: integer
        result_grain: one row per prescriber
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    prescriber.prescriber_id,
                    prescriber.specialty,
                    COUNT(prescription.prescription_id) AS prescription_count,
                    SUM(prescription.total_amount) AS total_revenue
                FROM pharma_bronze.prescription AS prescription
                INNER JOIN pharma_bronze.prescriber AS prescriber
                    ON prescription.prescriber_id = prescriber.prescriber_id
                GROUP BY prescriber.prescriber_id, prescriber.specialty
                ORDER BY prescription_count DESC
              columns_used:
                - prescription.prescription_id
                - prescription.total_amount
                - prescription.prescriber_id
                - prescriber.prescriber_id
                - prescriber.specialty
      
      - name: pharmacy_capacity_utilization
        business_name: Pharmacy Capacity Utilization
        description: >-
          Pharmacy capacity utilization rate calculated as daily prescription count divided by pharmacy daily capacity.
          Groups prescriptions by pharmacy and date, calculates daily prescription count, and divides by pharmacy.daily_capacity.
          Use this metric to identify pharmacies operating near or above capacity.
        return_type: percentage
        result_grain: one row per pharmacy per day
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    pharmacy.pharmacy_id,
                    pharmacy.name AS pharmacy_name,
                    DATE(prescription.rx_timestamp) AS prescription_date,
                    COUNT(prescription.prescription_id) AS daily_prescription_count,
                    pharmacy.daily_capacity,
                    CASE
                        WHEN pharmacy.daily_capacity = 0 THEN 0
                        ELSE (COUNT(prescription.prescription_id)::DECIMAL / pharmacy.daily_capacity * 100)
                    END AS capacity_utilization_pct
                FROM pharma_bronze.prescription AS prescription
                INNER JOIN pharma_bronze.pharmacy AS pharmacy
                    ON prescription.pharmacy_id = pharmacy.pharmacy_id
                GROUP BY pharmacy.pharmacy_id, pharmacy.name, DATE(prescription.rx_timestamp), pharmacy.daily_capacity
                ORDER BY prescription_date, capacity_utilization_pct DESC
              columns_used:
                - prescription.prescription_id
                - prescription.rx_timestamp
                - prescription.pharmacy_id
                - pharmacy.pharmacy_id
                - pharmacy.name
                - pharmacy.daily_capacity