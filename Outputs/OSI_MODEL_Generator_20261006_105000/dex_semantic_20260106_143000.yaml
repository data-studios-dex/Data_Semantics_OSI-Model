      - name: prescriber_count
        business_name: Prescriber Count
        description: >-
          Total number of unique prescribers. Count of distinct prescriber_id values.
          Use this metric for prescriber network size analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
