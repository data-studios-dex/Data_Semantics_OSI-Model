version: 1.1

comment: |-
  Databricks Unity Catalog Metric View for ecom_retail_analytics
  Generated from OSI Semantic Model version 1.0
  
  Spine: order_items (one row per order line item)
  Warehouse: dex-demo
  Schema: ecom_bronze
  
  Relationships implemented (7):
  - orders_to_customers: orders.customer_id = customers.customer_id
  - order_items_to_orders: order_items.order_id = orders.order_id
  - order_items_to_products: order_items.product_id = products.product_id
  - products_to_product_categories: products.category_id = product_categories.category_id
  - product_categories_hierarchy: product_categories.parent_category_id = parent_categories.category_id
  - payments_to_orders: payments.order_id = orders.order_id
  - shipments_to_orders: shipments.order_id = orders.order_id
  
  Grouped metric mappings:
  - revenue_by_customer: total_line_item_revenue + customer_id
  - revenue_by_product: total_line_item_revenue + product_id
  - revenue_by_category: total_line_item_revenue + category_name
  - revenue_by_sales_channel: total_line_item_revenue + sales_channel
  - revenue_by_customer_segment: total_line_item_revenue + customer_segment
  - revenue_by_payment_method: total_payment_amount + payment_method
  - orders_by_status: order_count + order_status
  - shipments_by_status: shipment_count + shipment_status
  - payments_by_status: payment_transaction_count + payment_status
  - revenue_by_month: total_line_item_revenue + order_month
  - orders_by_month: order_count + order_month
  - customers_by_month: customer_count + customer_registration_month (counts only customers who ordered)
  
  NOT REPRESENTED (require different grain or DEDUP_MODE on):
  - total_revenue (order-level, requires DEDUP_MODE on)
  - total_subtotal_revenue (order-level, requires DEDUP_MODE on)
  - total_discount_amount (order-level, requires DEDUP_MODE on)
  - total_tax_amount (order-level, requires DEDUP_MODE on)
  - total_shipping_fee (order-level, requires DEDUP_MODE on)
  - total_inventory_value (requires product grain)
  - stock_quantity (requires product grain)
  - average_cost_price (requires product grain)
  - catalog_unit_price (requires product grain)
  
  PII_MODE: restricted
  DEDUP_MODE: off

source: '`dex-demo`.ecom_bronze.order_items'

joins:
  - name: orders
    source: '`dex-demo`.ecom_bronze.orders'
    "on": source.order_id = orders.order_id
    joins:
      - name: customers
        source: '`dex-demo`.ecom_bronze.customers'
        "on": orders.customer_id = customers.customer_id
        rely:
          at_most_one_match: true
      - name: payments
        source: '`dex-demo`.ecom_bronze.payments'
        "on": orders.order_id = payments.order_id
      - name: shipments
        source: '`dex-demo`.ecom_bronze.shipments'
        "on": orders.order_id = shipments.order_id
    rely:
      at_most_one_match: true
  - name: products
    source: '`dex-demo`.ecom_bronze.products'
    "on": source.product_id = products.product_id
    joins:
      - name: product_categories
        source: '`dex-demo`.ecom_bronze.product_categories'
        "on": products.category_id = product_categories.category_id
        joins:
          - name: parent_categories
            source: '`dex-demo`.ecom_bronze.product_categories'
            "on": product_categories.parent_category_id = parent_categories.category_id
            rely:
              at_most_one_match: true
        rely:
          at_most_one_match: true
    rely:
      at_most_one_match: true

dimensions:
  - name: order_item_id
    expr: source.order_item_id
    display_name: Order Item ID
    comment: Unique identifier for an order line item.
    synonyms:
      - line item id
      - item id
  
  - name: order_id
    expr: source.order_id
    display_name: Order ID
    comment: References the related order record.
    synonyms:
      - order identifier
      - order reference
  
  - name: line_number
    expr: source.line_number
    display_name: Line Number
    comment: Sequential line number of the item within the order.
  
  - name: product_id
    expr: source.product_id
    display_name: Product ID
    comment: References the product associated with the order line item.
    synonyms:
      - product identifier
      - product reference
  
  - name: order_order_id
    expr: orders.order_id
    display_name: Order Order ID
    comment: Unique identifier for an order.
    synonyms:
      - order number id
  
  - name: order_number
    expr: orders.order_number
    display_name: Order Number
    comment: Business-facing order number used to identify the order.
    synonyms:
      - order ref
      - order code
  
  - name: customer_id
    expr: orders.customer_id
    display_name: Customer ID
    comment: References the customer who placed the order.
    synonyms:
      - customer identifier
      - customer reference
  
  - name: order_date
    expr: orders.order_date
    display_name: Order Date
    comment: Timestamp recording when the order was created.
    synonyms:
      - order timestamp
      - order created
  
  - name: order_month
    expr: DATE_TRUNC('MONTH', orders.order_date)
    display_name: Order Month
    comment: Order date truncated to month for time-series analysis.
    synonyms:
      - order period
      - order month period
  
  - name: order_status
    expr: orders.order_status
    display_name: Order Status
    comment: Indicates the current processing status of the order.
    synonyms:
      - order state
      - status
  
  - name: sales_channel
    expr: orders.sales_channel
    display_name: Sales Channel
    comment: Channel through which the order was placed, such as online store or marketplace.
    synonyms:
      - channel
      - sales source
  
  - name: order_currency
    expr: orders.currency
    display_name: Order Currency
    comment: Currency code used for the monetary amounts in the order.
    synonyms:
      - order currency code
  
  - name: customer_customer_id
    expr: orders.customers.customer_id
    display_name: Customer Customer ID
    comment: Unique identifier for a customer.
  
  - name: customer_code
    expr: orders.customers.customer_code
    display_name: Customer Code
    comment: Internal or external reference code used to identify the customer.
    synonyms:
      - customer reference
  
  - name: gender
    expr: orders.customers.gender
    display_name: Gender
    comment: Indicates the gender of the customer. PII - restrict access
  
  - name: customer_city
    expr: orders.customers.city
    display_name: Customer City
    comment: City portion of the customer's address. PII - restrict access
  
  - name: customer_state
    expr: orders.customers.state
    display_name: Customer State
    comment: State or region portion of the customer's address. PII - restrict access
  
  - name: country
    expr: orders.customers.country
    display_name: Country
    comment: Country in which the customer is located.
    synonyms:
      - customer country
  
  - name: customer_segment
    expr: orders.customers.customer_segment
    display_name: Customer Segment
    comment: Segment or classification of the customer based on behavior or value.
    synonyms:
      - segment
      - customer type
  
  - name: registration_date
    expr: orders.customers.registration_date
    display_name: Registration Date
    comment: Date when the customer registered or was created in the system.
    synonyms:
      - customer registration
  
  - name: customer_registration_month
    expr: DATE_TRUNC('MONTH', orders.customers.registration_date)
    display_name: Customer Registration Month
    comment: Customer registration date truncated to month for cohort analysis.
  
  - name: is_active
    expr: orders.customers.is_active
    display_name: Is Active
    comment: Indicates whether the customer account is currently active.
    synonyms:
      - active status
      - customer active
  
  - name: payment_id
    expr: orders.payments.payment_id
    display_name: Payment ID
    comment: Unique identifier for a payment transaction.
    synonyms:
      - payment identifier
  
  - name: payment_method
    expr: orders.payments.payment_method
    display_name: Payment Method
    comment: Method used to make the payment, such as credit card, PayPal, or bank transfer.
    synonyms:
      - payment type
  
  - name: payment_status
    expr: orders.payments.payment_status
    display_name: Payment Status
    comment: Indicates the current status of the payment transaction.
    synonyms:
      - payment state
  
  - name: payment_currency
    expr: orders.payments.currency
    display_name: Payment Currency
    comment: Currency code used for the payment amount.
  
  - name: gateway
    expr: orders.payments.gateway
    display_name: Gateway
    comment: Name of the payment gateway processing the transaction.
    synonyms:
      - payment gateway
  
  - name: paid_at
    expr: orders.payments.paid_at
    display_name: Paid At
    comment: Timestamp recording when the payment was completed.
    synonyms:
      - payment date
  
  - name: paid_month
    expr: DATE_TRUNC('MONTH', orders.payments.paid_at)
    display_name: Paid Month
    comment: Payment date truncated to month for payment timing analysis.
  
  - name: shipment_id
    expr: orders.shipments.shipment_id
    display_name: Shipment ID
    comment: Unique identifier for a shipment.
    synonyms:
      - shipment identifier
  
  - name: carrier
    expr: orders.shipments.carrier
    display_name: Carrier
    comment: Name of the shipping carrier handling the shipment.
    synonyms:
      - shipping carrier
  
  - name: shipment_status
    expr: orders.shipments.shipment_status
    display_name: Shipment Status
    comment: Indicates the current status of the shipment.
    synonyms:
      - shipment state
  
  - name: shipped_at
    expr: orders.shipments.shipped_at
    display_name: Shipped At
    comment: Timestamp recording when the shipment was dispatched.
    synonyms:
      - ship date
  
  - name: shipped_month
    expr: DATE_TRUNC('MONTH', orders.shipments.shipped_at)
    display_name: Shipped Month
    comment: Shipment date truncated to month for shipment timing analysis.
  
  - name: delivered_at
    expr: orders.shipments.delivered_at
    display_name: Delivered At
    comment: Timestamp recording when the shipment was delivered to the customer.
    synonyms:
      - delivery date
  
  - name: shipment_ship_city
    expr: orders.shipments.ship_city
    display_name: Shipment Ship City
    comment: City where the shipment is delivered. PII - restrict access
  
  - name: shipment_ship_state
    expr: orders.shipments.ship_state
    display_name: Shipment Ship State
    comment: State or region where the shipment is delivered. PII - restrict access
  
  - name: product_product_id
    expr: products.product_id
    display_name: Product Product ID
    comment: Unique identifier for a product.
  
  - name: sku
    expr: products.sku
    display_name: SKU
    comment: Stock keeping unit code used to uniquely identify the product in inventory.
    synonyms:
      - product sku
      - product code
  
  - name: product_name
    expr: products.product_name
    display_name: Product Name
    comment: Descriptive name of the product.
    synonyms:
      - product
  
  - name: category_id
    expr: products.category_id
    display_name: Category ID
    comment: References the category to which the product belongs.
    synonyms:
      - category identifier
  
  - name: product_brand
    expr: products.brand
    display_name: Product Brand
    comment: Brand name associated with the product.
    synonyms:
      - brand
  
  - name: product_currency
    expr: products.currency
    display_name: Product Currency
    comment: Currency code used for the product pricing.
  
  - name: product_is_active
    expr: products.is_active
    display_name: Product Is Active
    comment: Indicates whether the product is currently active and available for sale.
  
  - name: product_created_at
    expr: products.created_at
    display_name: Product Created At
    comment: Timestamp recording when the product record was created.
  
  - name: category_category_id
    expr: products.product_categories.category_id
    display_name: Category Category ID
    comment: Unique identifier for a product category.
  
  - name: category_name
    expr: products.product_categories.category_name
    display_name: Category Name
    comment: Descriptive name of the product category.
    synonyms:
      - category
  
  - name: parent_category_id
    expr: products.product_categories.parent_category_id
    display_name: Parent Category ID
    comment: References the parent category in the category hierarchy, if applicable. NULL indicates a root-level category.
  
  - name: category_is_active
    expr: products.product_categories.is_active
    display_name: Category Is Active
    comment: Indicates whether the product category is currently active for use.
  
  - name: parent_category_category_id
    expr: products.product_categories.parent_categories.category_id
    display_name: Parent Category Category ID
    comment: Unique identifier for the parent product category.
  
  - name: parent_category_name
    expr: products.product_categories.parent_categories.category_name
    display_name: Parent Category Name
    comment: Descriptive name of the parent product category.
    synonyms:
      - parent category

measures:
  - name: total_line_item_revenue
    expr: SUM(source.line_total)
    display_name: Total Line Item Revenue
    comment: Total revenue at the order line item level, calculated as the sum of line totals. Use this metric for product-level or category-level revenue analysis.
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - line revenue
      - item revenue
      - product revenue
  
  - name: total_units_sold
    expr: SUM(source.quantity)
    display_name: Total Units Sold
    comment: Total quantity of product units sold across all order line items.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - units sold
      - quantity sold
  
  - name: average_unit_price
    expr: AVG(source.unit_price)
    display_name: Average Unit Price
    comment: Average selling price per unit across all order line items.
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - avg unit price
      - mean unit price
  
  - name: average_discount_pct
    expr: ROUND(AVG(source.discount_pct), 2)
    display_name: Average Discount Percentage
    comment: Average discount percentage applied across all order line items.
    format:
      type: number
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - avg discount
      - mean discount
  
  - name: average_line_item_value
    expr: ROUND(MEASURE(total_line_item_revenue) / NULLIF(COUNT(source.order_item_id), 0), 2)
    display_name: Average Line Item Value
    comment: Average monetary value per order line item.
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - avg line value
  
  - name: total_cogs
    expr: SUM(source.quantity * products.cost_price)
    display_name: Total Cost of Goods Sold
    comment: Total cost of goods sold across all order line items. Lines whose product has no cost_price are excluded from COGS, which overstates gross profit.
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - cogs
      - cost of sales
  
  - name: gross_profit
    expr: MEASURE(total_line_item_revenue) - MEASURE(total_cogs)
    display_name: Gross Profit
    comment: Total gross profit calculated as line item revenue minus product cost. Lines whose product has no cost_price are excluded from COGS, which overstates gross profit.
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - profit
      - margin dollars
  
  - name: gross_margin_pct
    expr: MEASURE(gross_profit) / NULLIF(MEASURE(total_line_item_revenue), 0)
    display_name: Gross Margin Percentage
    comment: Gross profit as a percentage of revenue. This is a fraction (0.25 = 25%). Represents the percentage of revenue retained after deducting product costs.
    format:
      type: percentage
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - margin percent
      - profit margin
  
  - name: order_count
    expr: COUNT(DISTINCT orders.order_id)
    display_name: Order Count
    comment: Total number of distinct orders. Counts only orders with at least one line item.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - number of orders
      - total orders
  
  - name: average_order_value
    expr: ROUND(MEASURE(total_line_item_revenue) / NULLIF(MEASURE(order_count), 0), 2)
    display_name: Average Order Value
    comment: Average monetary value per order. Based on line item revenue, so it excludes order-level tax, shipping and order discounts.
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - aov
      - avg order value
  
  - name: average_units_per_order
    expr: ROUND(CAST(MEASURE(total_units_sold) AS DOUBLE) / NULLIF(MEASURE(order_count), 0), 2)
    display_name: Average Units Per Order
    comment: Average number of units per order.
    format:
      type: number
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - avg units per order
  
  - name: customer_count
    expr: COUNT(DISTINCT orders.customers.customer_id)
    display_name: Customer Count
    comment: Total number of distinct customers. Counts only customers that appear on one order with at least one line item.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - number of customers
      - total customers
  
  - name: active_customer_count
    expr: COUNT(DISTINCT CASE WHEN orders.customers.is_active = TRUE THEN orders.customers.customer_id END)
    display_name: Active Customer Count
    comment: Number of distinct customers with active status. Counts only customers that appear on one order with at least one line item.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - active customers
  
  - name: product_count
    expr: COUNT(DISTINCT products.product_id)
    display_name: Product Count
    comment: Total number of distinct products. Counts only products that appear on one order line item.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - number of products
      - total products
  
  - name: payment_transaction_count
    expr: COUNT(DISTINCT orders.payments.payment_id)
    display_name: Payment Transaction Count
    comment: Total number of distinct payment transactions. Payments and shipments are joined many-to-one; if an order has more than one, only the first match is used, so these undercount.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - payment count
      - number of payments
  
  - name: total_payment_amount
    expr: SUM(orders.payments.amount)
    display_name: Total Payment Amount
    comment: Total monetary amount of all payment transactions. WARNING - order payments repeat once per order line, so this total is inflated unless the query groups by order_id. Use payment_transaction_count for counts.
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - payment amount
      - total payments
  
  - name: shipment_count
    expr: COUNT(DISTINCT orders.shipments.shipment_id)
    display_name: Shipment Count
    comment: Total number of distinct shipments. Payments and shipments are joined many-to-one; if an order has more than one, only the first match is used, so these undercount.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - number of shipments
      - total shipments
  
  - name: delivery_time_days
    expr: ROUND(AVG(DATEDIFF(orders.shipments.delivered_at, orders.shipments.shipped_at)), 2)
    display_name: Delivery Time Days
    comment: Average number of days between shipment dispatch and delivery. Payments and shipments are joined many-to-one; if an order has more than one, only the first match is used, so these undercount.
    format:
      type: number
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - delivery days
      - shipping time
