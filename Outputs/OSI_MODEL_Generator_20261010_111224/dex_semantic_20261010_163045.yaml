                - audit_event.action

      - name: modifications_created_by_month
        business_name: Modifications Created by Month
        description: >-
          Count of modifications created grouped by year and month.
          This metric tracks modification creation trends over time.
        return_type: integer
        result_grain: one row per year and month
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    DATEPART(YEAR, m.created_date) AS year,
                    DATEPART(MONTH, m.created_date) AS month,
                    COUNT(m.mod_id) AS modification_count
                FROM staging.mod_record AS m
                WHERE m.created_date IS NOT NULL
                GROUP BY DATEPART(YEAR, m.created_date), DATEPART(MONTH, m.created_date)
                ORDER BY year, month
              columns_used:
                - mod_record.mod_id
                - mod_record.created_date

      - name: tasks_created_by_month
        business_name: Tasks Created by Month
        description: >-
          Count of tasks created grouped by year and month.
          This metric tracks task creation trends over time.
        return_type: integer
        result_grain: one row per year and month
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    DATEPART(YEAR, t.created_date) AS year,
                    DATEPART(MONTH, t.created_date) AS month,
                    COUNT(t.task_id) AS task_count
                FROM staging.task_record AS t
                WHERE t.created_date IS NOT NULL
                GROUP BY DATEPART(YEAR, t.created_date), DATEPART(MONTH, t.created_date)
                ORDER BY year, month
              columns_used:
                - task_record.task_id
                - task_record.created_date

      - name: audit_events_by_month
        business_name: Audit Events by Month
        description: >-
          Count of audit events grouped by year and month.
          This metric tracks audit activity trends over time.
        return_type: integer
        result_grain: one row per year and month
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    DATEPART(YEAR, a.event_ts) AS year,
                    DATEPART(MONTH, a.event_ts) AS month,
                    COUNT(a.audit_id) AS audit_event_count
                FROM staging.audit_event AS a
                WHERE a.event_ts IS NOT NULL
                GROUP BY DATEPART(YEAR, a.event_ts), DATEPART(MONTH, a.event_ts)
                ORDER BY year, month
              columns_used:
                - audit_event.audit_id
                - audit_event.event_ts

      - name: modification_update_lag_days
        business_name: Modification Update Lag Days
        description: >-
          Number of days between modification creation and last update for each modification.
          This metric measures how long after creation a modification was last updated.
        return_type: integer
        result_grain: one row per modification
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    m.mod_id,
                    m.mod_ref,
                    DATEDIFF(DAY, m.created_date, m.updated_date) AS update_lag_days
                FROM staging.mod_record AS m
                WHERE m.created_date IS NOT NULL
                  AND m.updated_date IS NOT NULL
              columns_used:
                - mod_record.mod_id
                - mod_record.mod_ref
                - mod_record.created_date
                - mod_record.updated_date

      - name: task_update_lag_days
        business_name: Task Update Lag Days
        description: >-
          Number of days between task creation and last update for each task.
          This metric measures how long after creation a task was last updated.
        return_type: integer
        result_grain: one row per task
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    t.task_id,
                    t.task_ref,
                    DATEDIFF(DAY, t.created_date, t.updated_date) AS update_lag_days
                FROM staging.task_record AS t
                WHERE t.created_date IS NOT NULL
                  AND t.updated_date IS NOT NULL
              columns_used:
                - task_record.task_id
                - task_record.task_ref
                - task_record.created_date
                - task_record.updated_date
