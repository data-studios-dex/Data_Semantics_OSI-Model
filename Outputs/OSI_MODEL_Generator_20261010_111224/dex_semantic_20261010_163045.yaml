          This metric counts all audit events across all actions.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    COUNT(a.audit_id) AS total_audit_event_count
                FROM staging.audit_event AS a
              columns_used:
                - audit_event.audit_id

      - name: audit_event_count_by_action
        business_name: Audit Event Count by Action
        description: >-
          Count of audit events grouped by action type.
          This metric shows the distribution of audit events across different action categories.
        return_type: integer
        result_grain: one row per action type
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    a.action,
                    COUNT(a.audit_id) AS audit_event_count
                FROM staging.audit_event AS a
