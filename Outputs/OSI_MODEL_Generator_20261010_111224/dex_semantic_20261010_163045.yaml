                        ELSE CAST(COUNT(i.impact_id) AS DECIMAL(10,2)) / COUNT(DISTINCT m.mod_id)
                    END AS average_impacts_per_modification
                FROM staging.mod_record AS m
                LEFT JOIN staging.impact_record AS i ON m.mod_id = i.mod_id
              columns_used:
