                        WHEN COUNT(i.impact_id) = 0 THEN 0
                        ELSE (CAST(SUM(CASE WHEN i.is_selected = 1 THEN 1 ELSE 0 END) AS DECIMAL(10,2)) / COUNT(i.impact_id)) * 100
                    END AS impact_selection_rate
                FROM staging.impact_record AS i
              columns_used:
                - impact_record.impact_id
                - impact_record.is_selected

      - name: impact_count_by_change_type
        business_name: Impact Count by Change Type
        description: >-
