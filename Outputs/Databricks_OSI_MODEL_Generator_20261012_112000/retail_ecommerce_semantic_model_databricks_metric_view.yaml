measures:
  # Order-level revenue measures (with is_first_line filter)
  - name: total_revenue
    display_name: Total Revenue
    comment: |-
      Total revenue from all orders, calculated as the sum of the final order total
      amount after discounts, taxes, and shipping fees. Uses is_first_line filter to
      prevent double-counting across order line items.
    expr: SUM(orders.total_amount) FILTER (WHERE is_first_line = 1)
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - revenue
      - total sales
      - sales revenue
      - order revenue

  - name: total_subtotal_revenue
    display_name: Total Subtotal Revenue
    comment: |-
      Total subtotal revenue from all orders before discounts, taxes, and shipping fees.
      Represents gross merchandise value. Uses is_first_line filter to prevent
      double-counting across order line items.
    expr: SUM(orders.subtotal) FILTER (WHERE is_first_line = 1)
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - subtotal revenue
      - gross merchandise value
      - gmv
      - subtotal

  - name: total_discount_amount
    display_name: Total Discount Amount
    comment: |-
      Total discount amount applied across all orders. Uses is_first_line filter to
      prevent double-counting across order line items.
    expr: SUM(orders.discount_amount) FILTER (WHERE is_first_line = 1)
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - discount amount
      - total discounts
      - discount value

  - name: total_tax_amount
    display_name: Total Tax Amount
    comment: |-
      Total tax amount collected across all orders. Uses is_first_line filter to prevent
      double-counting across order line items. Source tags this field as PII; possible
      mis-tag, confirm.
    expr: SUM(orders.tax_amount) FILTER (WHERE is_first_line = 1)
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - tax amount
      - total tax
      - tax collected

  - name: total_shipping_fee
    display_name: Total Shipping Fee
    comment: |-
      Total shipping fees collected across all orders. Uses is_first_line filter to
      prevent double-counting across order line items.
    expr: SUM(orders.shipping_fee) FILTER (WHERE is_first_line = 1)
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - shipping fee
      - total shipping
      - shipping cost
      - delivery fee

  # Line-item revenue measures (no filter needed)
  - name: total_line_item_revenue
    display_name: Total Line Item Revenue
    comment: |-
      Total revenue from all order line items after line-level discounts. This metric
      is used for product-level revenue analysis and does not require the is_first_line
      filter as it operates at the line-item grain.
    expr: SUM(source.line_total)
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - line item revenue
      - line revenue
      - product revenue
      - item revenue

  - name: total_units_sold
    display_name: Total Units Sold
    comment: |-
      Total number of product units sold across all order line items. Operates at the
      line-item grain and does not require the is_first_line filter.
    expr: SUM(source.quantity)
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - units sold
      - quantity sold
      - total quantity
      - items sold

  # Count measures
  - name: order_count
    display_name: Order Count
    comment: Total number of orders placed, calculated as the count of distinct order identifiers.
    expr: COUNT(DISTINCT orders.order_id)
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - number of orders
      - order total
      - orders

  - name: customer_count
    display_name: Customer Count
    comment: |-
      Counts customers with at least one order; customers without orders are not in
      this view.
    expr: COUNT(DISTINCT orders.customers.customer_id)
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - number of customers
      - customer total
      - customers

  - name: active_customer_count
    display_name: Active Customer Count
    comment: |-
      Counts active customers with at least one order; customers without orders are not
      in this view.
    expr: COUNT(DISTINCT orders.customers.customer_id) FILTER (WHERE orders.customers.is_active = TRUE)
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - active customers
      - number of active customers

  - name: product_count
    display_name: Product Count
    comment: Counts products that appear on at least one order line.
    expr: COUNT(DISTINCT products.product_id)
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - number of products
      - product total
      - products

  - name: payment_transaction_count
    display_name: Payment Transaction Count
    comment: Total number of payment transactions, calculated as the count of distinct payment identifiers.
    expr: COUNT(DISTINCT orders.payments.payment_id)
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - payment count
      - number of payments
      - transactions

  - name: shipment_count
    display_name: Shipment Count
    comment: Total number of shipments, calculated as the count of distinct shipment identifiers.
    expr: COUNT(DISTINCT orders.shipments.shipment_id)
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - number of shipments
      - shipment total
      - shipments

  # Average measures
  - name: average_order_value
    display_name: Average Order Value
    comment: |-
      Average order value, calculated as total revenue divided by order count. Represents
      the average amount spent per order.
    expr: MEASURE(total_revenue) / NULLIF(MEASURE(order_count), 0)
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - aov
      - avg order value
      - mean order value

  - name: average_line_item_value
    display_name: Average Line Item Value
    comment: |-
      Average line item value, calculated as total line item revenue divided by the
      number of line items.
    expr: MEASURE(total_line_item_revenue) / NULLIF(COUNT(source.order_item_id), 0)
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - avg line value
      - average item value
      - mean line value

  - name: average_units_per_order
    display_name: Average Units Per Order
    comment: |-
      Average number of units per order, calculated as total units sold divided by
      order count.
    expr: MEASURE(total_units_sold) / NULLIF(MEASURE(order_count), 0)
    format:
      type: number
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - avg units per order
      - mean units per order
      - units per order

  - name: average_unit_price
    display_name: Average Unit Price
    comment: |-
      Average selling price per unit across all order line items at the time of order.
      Operates at the line-item grain.
    expr: AVG(source.unit_price)
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - avg unit price
      - mean unit price
      - average price

  - name: average_discount_pct
    display_name: Average Discount Percentage
    comment: |-
      Average discount percentage applied to order line items. Operates at the line-item
      grain.
    expr: AVG(source.discount_pct)
    format:
      type: percentage
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - avg discount pct
      - mean discount percentage
      - average discount

  # Profit measures
  - name: total_cogs
    display_name: Total Cost of Goods Sold
    comment: |-
      Total cost of goods sold, calculated as the sum of quantity multiplied by product
      cost price. This is a supporting measure used in gross profit calculation.
    expr: SUM(source.quantity * products.cost_price)
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - cogs
      - cost of goods sold
      - total cost

  - name: gross_profit
    display_name: Gross Profit
    comment: |-
      Gross profit calculated as the difference between line item revenue and cost of
      goods sold. Represents profit before operating expenses.
    expr: MEASURE(total_line_item_revenue) - MEASURE(total_cogs)
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - profit
      - gross margin dollars
      - margin

  - name: gross_margin_pct
    display_name: Gross Margin Percentage
    comment: |-
      Gross margin percentage calculated as gross profit divided by line item revenue.
      Represents the percentage of revenue retained after deducting cost of goods sold.
      Value is expressed as a fraction (0.25 = 25%).
    expr: MEASURE(gross_profit) / NULLIF(MEASURE(total_line_item_revenue), 0)
    format:
      type: percentage
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - gross margin
      - margin percentage
      - profit margin pct

  # Payment measures
  - name: total_payment_amount
    display_name: Total Payment Amount
    comment: |-
      Total payment amount across all payment transactions. Uses is_first_line filter
      to prevent double-counting across order line items.
    expr: SUM(orders.payments.amount) FILTER (WHERE is_first_line = 1)
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - payment amount
      - total payments
      - payment value

  # Shipment measures
  - name: delivery_time_days
    display_name: Delivery Time Days
    comment: |-
      Average delivery time in days, calculated as the average difference between
      delivered timestamp and shipped timestamp for completed shipments. Only includes
      shipments with both shipped and delivered timestamps.
    expr: |-
      AVG(DATEDIFF(orders.shipments.delivered_at, orders.shipments.shipped_at))
      FILTER (WHERE orders.shipments.delivered_at IS NOT NULL
              AND orders.shipments.shipped_at IS NOT NULL)
    format:
      type: number
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - avg delivery time
      - delivery days
      - shipping time
      - transit time
