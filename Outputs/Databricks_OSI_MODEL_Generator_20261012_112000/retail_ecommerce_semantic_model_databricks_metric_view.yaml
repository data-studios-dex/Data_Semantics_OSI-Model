# ============================================================================
# Databricks Unity Catalog Metric View
# Model: retail_ecommerce_semantic_model
# Warehouse: dex-demo
# Generated from OSI Semantic Model version 1.0
# ============================================================================
#
# COVERAGE MATRIX
# ============================================================================
#
# RELATIONSHIPS (7/7):
# - orders_to_customers -> join: orders to customers on customer_id
# - order_items_to_orders -> join: order_items (source) to orders on order_id
# - order_items_to_products -> join: order_items (source) to products on product_id
# - products_to_product_categories -> join: products to product_categories on category_id
# - product_categories_hierarchy -> join: product_categories to parent_categories (self-join) on parent_category_id
# - payments_to_orders -> join: orders to payments on order_id
# - shipments_to_orders -> join: orders to shipments on order_id
#
# DATASETS (7/8):
# - customers -> dimensions: customer_id, customer_code, gender, city, state, country, customer_segment, registration_date, is_active
# - orders -> dimensions: order_id, order_number, order_date, order_status, sales_channel, ship_city, ship_state, currency
# - order_items -> source table with dimensions: order_item_id, line_number; measures: quantity, unit_price, discount_pct, line_total
# - products -> dimensions: product_id, sku, product_name, brand, currency, is_active, created_at; supporting measure: cost_price
# - product_categories -> dimensions: category_id, category_name, is_active
# - payments -> dimensions: payment_id, payment_method, payment_status, currency, gateway, paid_at; measures: amount
# - shipments -> dimensions: shipment_id, carrier, shipment_status, shipped_at, delivered_at, ship_city, ship_state; measures: delivery_time_days
# - load_audit -> EXCLUDED (ETL monitoring dataset, not part of business analytics)
#
# METRICS (48/48):
# Single-value metrics (20):
# - total_revenue -> measure: total_revenue (SUM orders.total_amount with is_first_line filter)
# - total_subtotal_revenue -> measure: total_subtotal_revenue (SUM orders.subtotal with is_first_line filter)
# - total_discount_amount -> measure: total_discount_amount (SUM orders.discount_amount with is_first_line filter)
# - total_tax_amount -> measure: total_tax_amount (SUM orders.tax_amount with is_first_line filter)
# - total_shipping_fee -> measure: total_shipping_fee (SUM orders.shipping_fee with is_first_line filter)
# - total_line_item_revenue -> measure: total_line_item_revenue (SUM source.line_total)
# - total_units_sold -> measure: total_units_sold (SUM source.quantity)
# - order_count -> measure: order_count (COUNT DISTINCT orders.order_id)
# - customer_count -> measure: customer_count (COUNT DISTINCT orders.customers.customer_id)
# - active_customer_count -> measure: active_customer_count (COUNT DISTINCT with is_active filter)
# - product_count -> measure: product_count (COUNT DISTINCT products.product_id)
# - average_order_value -> measure: average_order_value (total_revenue / order_count)
# - average_line_item_value -> measure: average_line_item_value (total_line_item_revenue / line count)
# - average_units_per_order -> measure: average_units_per_order (total_units_sold / order_count)
# - gross_profit -> measure: gross_profit (total_line_item_revenue - total_cogs)
# - gross_margin_pct -> measure: gross_margin_pct (gross_profit / total_line_item_revenue)
# - average_discount_pct -> measure: average_discount_pct (AVG source.discount_pct)
# - payment_transaction_count -> measure: payment_transaction_count (COUNT DISTINCT payments.payment_id)
# - total_payment_amount -> measure: total_payment_amount (SUM payments.amount with is_first_line filter)
# - shipment_count -> measure: shipment_count (COUNT DISTINCT shipments.shipment_id)
# - delivery_time_days -> measure: delivery_time_days (AVG DATEDIFF with filters)
# - total_cogs -> measure: total_cogs (supporting measure for gross_profit calculation)
# - average_unit_price -> measure: average_unit_price (AVG source.unit_price)
#
# Grouped metrics (dimension + measure pairings) (12):
# - revenue_by_customer -> measure: total_revenue + dimension: customer_id, customer_code
# - revenue_by_product -> measure: total_line_item_revenue + dimension: product_id, sku, product_name
# - revenue_by_category -> measure: total_line_item_revenue + dimension: category_name
# - revenue_by_sales_channel -> measure: total_revenue + dimension: sales_channel
# - revenue_by_customer_segment -> measure: total_revenue + dimension: customer_segment
# - revenue_by_payment_method -> measure: total_payment_amount + dimension: payment_method
# - orders_by_status -> measure: order_count + dimension: order_status
# - shipments_by_status -> measure: shipment_count + dimension: shipment_status
# - payments_by_status -> measure: payment_transaction_count + dimension: payment_status
# - revenue_by_month -> measure: total_revenue + dimension: order_month
# - orders_by_month -> measure: order_count + dimension: order_month
# - customers_by_month -> measure: customer_count + dimension: customer_registration_month
#
# NOT REPRESENTED (4 metrics require product-grain view):
# - total_inventory_value -> Reason: Requires products table as row grain; would be multiplied by number of order lines in this order_items-grain view
# - total_stock_quantity -> Reason: Same as above; products.stock_quantity would be duplicated per order line
# - average_cost_price -> Reason: Same as above; product-level aggregation incompatible with order_items grain
# - average_catalog_unit_price -> Reason: Same as above; product-level aggregation incompatible with order_items grain
#
# PII FIELDS:
# - customers.first_name -> NOT EXPOSED (PII)
# - customers.last_name -> NOT EXPOSED (PII)
# - customers.email -> NOT EXPOSED (PII)
# - customers.phone -> NOT EXPOSED (PII)
# - customers.date_of_birth -> NOT EXPOSED (PII)
# - customers.postal_code -> NOT EXPOSED (PII)
# - customers.gender -> EXPOSED with warning (categorical PII - restrict access)
# - customers.city -> EXPOSED with warning (categorical PII - restrict access)
# - customers.state -> EXPOSED with warning (categorical PII - restrict access)
# - orders.ship_postal_code -> NOT EXPOSED (PII)
# - orders.ship_city -> EXPOSED with warning (categorical PII - restrict access)
# - orders.ship_state -> EXPOSED with warning (categorical PII - restrict access)
# - orders.tax_amount -> EXPOSED in measure total_tax_amount (possible mis-tag, confirm)
# - payments.transaction_ref -> NOT EXPOSED (PII)
# - shipments.tracking_number -> NOT EXPOSED (PII)
# - shipments.ship_postal_code -> NOT EXPOSED (PII)
# - shipments.ship_city -> EXPOSED with warning (categorical PII - restrict access)
# - shipments.ship_state -> EXPOSED with warning (categorical PII - restrict access)
#
# NOTES:
# - Payments and shipments are one-to-many per order. Sums are de-duplicated with
#   is_first_line and are attributed to the first line of each order, so slicing a
#   payment or order total by product attributes is not meaningful. Querying payment
#   and shipment measures together can multiply rows.
# - Candidate filters: Consider filtering by customers.is_active, products.is_active,
#   or product_categories.is_active for active-only analysis.
# - All monetary amounts are in USD currency.
#
# COUNTS: relationships 7/7, datasets 7/8, metrics 48/48
# ============================================================================

version: 1.1

source: |-
  SELECT oi.*,
         CASE WHEN ROW_NUMBER() OVER (
                PARTITION BY oi.order_id
                ORDER BY oi.line_number, oi.order_item_id) = 1
              THEN 1 ELSE 0 END AS is_first_line
  FROM `dex-demo`.ecom_bronze.order_items oi

joins:
  - name: orders
    source: '`dex-demo`.ecom_bronze.orders'
    "on": source.order_id = orders.order_id
    rely:
      at_most_one_match: true
    joins:
      - name: customers
        source: '`dex-demo`.ecom_bronze.customers'
        "on": orders.customer_id = customers.customer_id
        rely:
          at_most_one_match: true
      - name: payments
        source: '`dex-demo`.ecom_bronze.payments'
        "on": orders.order_id = payments.order_id
      - name: shipments
        source: '`dex-demo`.ecom_bronze.shipments'
        "on": orders.order_id = shipments.order_id
  - name: products
    source: '`dex-demo`.ecom_bronze.products'
    "on": source.product_id = products.product_id
    rely:
      at_most_one_match: true
    joins:
      - name: product_categories
        source: '`dex-demo`.ecom_bronze.product_categories'
        "on": products.category_id = product_categories.category_id
        rely:
          at_most_one_match: true
        joins:
          - name: parent_categories
            source: '`dex-demo`.ecom_bronze.product_categories'
            "on": product_categories.parent_category_id = parent_categories.category_id
            rely:
              at_most_one_match: true

comment: |-
  Comprehensive metric view for retail e-commerce analytics. This view uses order_items
  as the spine (one row per order line item) and joins all related datasets through a
  hierarchical join tree. The is_first_line flag is used to de-duplicate order-level,
  payment-level, and shipment-level measures to prevent double-counting when aggregating
  across line items. All table references use the dex-demo catalog prefix.

