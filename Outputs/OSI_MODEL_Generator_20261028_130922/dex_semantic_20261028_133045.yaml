    relationships:
      - name: orders_to_customers
        left_dataset: orders
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Each order is placed by exactly one customer. Multiple orders can be
          placed by the same customer. Join orders to customers using customer_id
          to retrieve customer attributes for order analysis.

      - name: orders_to_restaurants
        left_dataset: orders
        right_dataset: restaurants
        relationship_type: many_to_one
        join:
          left:
            - restaurant_id
          right:
            - restaurant_id
        join_type: many_to_one
        resolution: >-
          Each order is fulfilled by exactly one restaurant. Multiple orders can
          be fulfilled by the same restaurant. Join orders to restaurants using
          restaurant_id to retrieve restaurant attributes for order analysis.

      - name: order_items_to_orders
        left_dataset: order_items
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Each order item belongs to exactly one order. Multiple items can belong
          to the same order. Join order_items to orders using order_id. CRITICAL:
          Do not sum order-level amounts (orders.subtotal, orders.total_amount,
          orders.delivery_fee, orders.tax, orders.tip) after this join as it will
          cause double counting. Use order_items.line_total for item-level revenue
          analysis.

      - name: order_items_to_menu_items
        left_dataset: order_items
        right_dataset: menu_items
        relationship_type: many_to_one
        join:
          left:
            - item_id
          right:
            - item_id
        join_type: many_to_one
        resolution: >-
          Each order item references exactly one menu item. Multiple order items
          can reference the same menu item. Join order_items to menu_items using
          item_id to retrieve menu item attributes for product analysis.

      - name: order_promotions_to_orders
        left_dataset: order_promotions
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Each order promotion application belongs to exactly one order. Multiple
          promotions can be applied to the same order. Join order_promotions to
