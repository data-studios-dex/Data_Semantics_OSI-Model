version: "1.0"

semantic_model:
  - name: food_delivery_semantic_model
    description: >-
      Comprehensive semantic model for the food delivery platform analytics.
      This model represents the complete analytical ecosystem including customers,
      orders, restaurants, menu items, deliveries, agents, payments, promotions,
      reviews, and support operations. The model supports analytical queries across
      customer behavior, order fulfillment, restaurant performance, delivery operations,
      financial transactions, and customer satisfaction metrics.
    
    ai_context:
      instructions: >-
        This semantic model represents a food delivery platform with 18 interconnected datasets.
        
        
        DATASET GRAIN DEFINITIONS:
        
        - customers: One row per customer (grain: customer_id)
        
        - customer_addresses: One row per customer address (grain: address_id)
        
        - orders: One row per order (grain: order_id)
        
        - order_items: One row per item within an order (grain: order_item_id)
        
        - order_promotions: One row per promotion applied to an order (grain: order_promotion_id)
        
        - restaurants: One row per restaurant (grain: restaurant_id)
        
        - restaurant_categories: One row per restaurant category (grain: category_id)
        
        - restaurant_category_map: One row per restaurant-category assignment (grain: mapping_id)
        
        - menu_sections: One row per menu section within a restaurant (grain: section_id)
        
        - menu_items: One row per menu item (grain: item_id)
        
        - operating_hours: One row per restaurant day-of-week operating hours (grain: hours_id)
        
        - deliveries: One row per delivery (grain: delivery_id)
        
        - delivery_agents: One row per delivery agent (grain: agent_id)
        
        - agent_payouts: One row per agent payout (grain: payout_id)
        
        - payments: One row per payment transaction (grain: payment_id)
        
        - promotions: One row per promotion definition (grain: promotion_id)
        
        - reviews: One row per customer review (grain: review_id)
        
        - support_tickets: One row per support ticket (grain: ticket_id)
        
        
        CRITICAL GRAIN RELATIONSHIPS AND DOUBLE-COUNTING PREVENTION:
        
        
        Orders vs Order Items:
        
        - orders contains one row per order with order-level aggregates (subtotal, delivery_fee, tax, tip, total_amount)
        
        - order_items contains multiple rows per order, one per menu item ordered
        
        - NEVER sum orders.subtotal, orders.total_amount, orders.delivery_fee, orders.tax, or orders.tip after joining orders to order_items
        
        - For order-level revenue analysis, use orders.total_amount directly from the orders dataset
        
        - For item-level revenue analysis, use order_items.line_total from the order_items dataset
        
        - For product-level analysis, always aggregate from order_items, not orders
        
        
        Deliveries vs Orders:
        
        - Each order has at most one delivery
        
        - deliveries.delivery_id references orders.order_id via FK
        
        - Delivery metrics (distance, time, status) should be analyzed from the deliveries dataset
        
        - When joining orders to deliveries, the relationship is one-to-one
        
        
        Agent Payouts vs Deliveries:
        
        - Each delivery may have one payout
        
        - agent_payouts.delivery_id references deliveries.delivery_id
        
        - Payout amounts (base_pay, distance_bonus, tip_amount, total_payout) are delivery-level measures
        
        - Do not sum payout amounts after joining to order_items
        
        
        Reviews:
        
        - reviews can reference orders, customers, restaurants, and agents
        
        - Each review is associated with one order
        
        - When analyzing ratings, ensure the grain matches the analytical question
        
        
        Payments vs Orders:
        
        - Each order has one payment
        
        - payments.order_id references orders.order_id
        
        - Payment amount should match orders.total_amount
        
        
        TIME DIMENSION GUIDANCE:
        
        
        Primary Date Fields for Analysis:
        
        - orders.ordered_at: Use for order placement time-series analysis
        
        - orders.delivered_at: Use for order fulfillment time-series analysis
        
        - deliveries.pickup_time: Use for restaurant pickup time analysis
        
        - deliveries.delivered_time: Use for delivery completion time analysis
        
        - payments.processed_at: Use for payment transaction time analysis
        
        - agent_payouts.payout_date: Use for agent payout time analysis
        
        - reviews.reviewed_at: Use for review submission time analysis
        
        - support_tickets.created_at: Use for support ticket creation time analysis
        
        - customers.registered_at: Use for customer acquisition time analysis
        
        - delivery_agents.joined_at: Use for agent onboarding time analysis
        
        
        For revenue time-series analysis, use orders.ordered_at as the primary date dimension.
        
        For delivery performance time-series, use deliveries.delivered_time.
        
        For customer satisfaction trends, use reviews.reviewed_at.
        
        
        RELATIONSHIP GUIDANCE:
        
        
        Customer Relationships:
        
        - customers → orders (one-to-many via customer_id)
        
        - customers → customer_addresses (one-to-many via customer_id)
        
        - customers → reviews (one-to-many via customer_id)
        
        - customers → support_tickets (one-to-many via customer_id)
        
        
        Order Relationships:
        
        - orders → customers (many-to-one via customer_id)
        
        - orders → restaurants (many-to-one via restaurant_id)
        
        - orders → order_items (one-to-many via order_id)
        
        - orders → order_promotions (one-to-many via order_id)
        
        - orders → deliveries (one-to-one via order_id)
        
        - orders → payments (one-to-one via order_id)
        
        - orders → reviews (one-to-one via order_id)
        
        - orders → support_tickets (one-to-many via order_id)
        
        
        Restaurant Relationships:
        
        - restaurants → orders (one-to-many via restaurant_id)
        
        - restaurants → menu_sections (one-to-many via restaurant_id)
        
        - restaurants → menu_items (one-to-many via restaurant_id)
        
        - restaurants → operating_hours (one-to-many via restaurant_id)
        
        - restaurants → restaurant_category_map (one-to-many via restaurant_id)
        
        - restaurants → reviews (one-to-many via restaurant_id)
        
        
        Menu Relationships:
        
        - menu_sections → menu_items (one-to-many via section_id)
        
        - menu_items → order_items (one-to-many via item_id)
        
        
        Delivery Relationships:
        
        - deliveries → orders (one-to-one via order_id)
        
        - deliveries → delivery_agents (many-to-one via agent_id)
        
        - deliveries → agent_payouts (one-to-one via delivery_id)
        
        
        Agent Relationships:
        
        - delivery_agents → deliveries (one-to-many via agent_id)
        
        - delivery_agents → agent_payouts (one-to-many via agent_id)
        
        - delivery_agents → reviews (one-to-many via agent_id)
        
        
        Promotion Relationships:
        
        - promotions → order_promotions (one-to-many via promotion_id)
        
        
        Category Relationships:
        
        - restaurant_categories → restaurant_category_map (one-to-many via category_id)
        
        - restaurant_category_map acts as a many-to-many bridge between restaurants and categories
        
        
        METRIC CALCULATION GUIDANCE:
        
        
        Revenue Metrics:
        
        - Total Revenue: Sum orders.total_amount from the orders dataset
        
        - Subtotal Revenue: Sum orders.subtotal from the orders dataset
        
        - Item Revenue: Sum order_items.line_total from the order_items dataset
        
        - Delivery Fee Revenue: Sum orders.delivery_fee from the orders dataset
        
        - Tax Revenue: Sum orders.tax from the orders dataset
        
        - Tip Revenue: Sum orders.tip from the orders dataset
        
        - Average Order Value: Total Revenue / Order Count
        
        - Revenue per Customer: Total Revenue / Customer Count
        
        
        Order Metrics:
        
        - Order Count: Count distinct orders.order_id
        
        - Completed Order Count: Count orders where order_status = 'Delivered'
        
        - Cancelled Order Count: Count orders where order_status = 'Cancelled'
        
        - Average Items per Order: Count order_items / Count orders
        
        
        Customer Metrics:
        
        - Customer Count: Count distinct customers.customer_id
        
        - Active Customer Count: Count customers where is_active = true
        
        - Premium Customer Count: Count customers where is_premium = true
        
        - Orders per Customer: Order Count / Customer Count
        
        
        Restaurant Metrics:
        
        - Restaurant Count: Count distinct restaurants.restaurant_id
        
        - Active Restaurant Count: Count restaurants where is_active = true
        
        - Average Restaurant Rating: Average of restaurants.avg_rating
        
        - Orders per Restaurant: Order Count / Restaurant Count
        
        
        Delivery Metrics:
        
        - Delivery Count: Count distinct deliveries.delivery_id
        
        - Completed Delivery Count: Count deliveries where delivery_status = 'Delivered'
        
        - Average Delivery Distance: Average of deliveries.distance_km
        
        - Average Delivery Time: Average of deliveries.actual_time_min
        
        - On-Time Delivery Rate: Count deliveries where actual_time_min <= estimated_time_min / Total Delivery Count
        
        - Delayed Delivery Count: Count deliveries where actual_time_min > estimated_time_min
        
        
        Agent Metrics:
        
        - Agent Count: Count distinct delivery_agents.agent_id
        
        - Active Agent Count: Count agents where is_active = true
        
        - Average Agent Rating: Average of delivery_agents.avg_rating
        
        - Total Agent Payout: Sum agent_payouts.total_payout
        
        - Average Payout per Delivery: Total Agent Payout / Delivery Count
        
        
        Payment Metrics:
        
        - Payment Count: Count distinct payments.payment_id
        
        - Settled Payment Count: Count payments where payment_status = 'Settled'
        
        - Total Payment Amount: Sum payments.amount
        
        
        Promotion Metrics:
        
        - Promotion Count: Count distinct promotions.promotion_id
        
        - Active Promotion Count: Count promotions where is_active = true
        
        - Total Discount Amount: Sum order_promotions.discount_amount
        
        - Average Discount per Order: Total Discount Amount / Order Count with promotions
        
        - Promotion Usage Rate: Count orders with promotions / Total Order Count
        
        
        Review Metrics:
        
        - Review Count: Count distinct reviews.review_id
        
        - Average Food Rating: Average of reviews.food_rating
        
        - Average Delivery Rating: Average of reviews.delivery_rating
        
        - Average Overall Rating: Average of reviews.overall_rating
        
        
        Support Metrics:
        
        - Support Ticket Count: Count distinct support_tickets.ticket_id
        
        - Resolved Ticket Count: Count tickets where status = 'Resolved'
        
        - Open Ticket Count: Count tickets where status = 'Open'
        
        - Average Resolution Time: Average of (resolved_at - created_at)
        
        
        QUERY RESTRICTIONS AND IMPORTANT NOTES:
        
        
        1. Always verify the analytical grain before aggregating measures
        
        2. Use the appropriate date field for the analytical question
        
        3. Be cautious when joining orders to order_items - do not sum order-level amounts after the join
        
        4. For customer lifetime value, aggregate all orders per customer from the orders dataset
        
        5. For product performance, aggregate from order_items, not orders
        
        6. For delivery performance, use the deliveries dataset with appropriate date filters
        
        7. For agent performance, join deliveries to delivery_agents and aggregate appropriately
        
        8. For promotion effectiveness, join orders to order_promotions and compare with non-promoted orders
        
        9. For restaurant performance, aggregate orders by restaurant_id
        
        10. For time-series analysis, use the appropriate timestamp field and truncate to the desired grain (day, week, month, quarter, year)
        
        11. When calculating percentages and rates, always use safe division to avoid division by zero
        
        12. For customer segmentation, use customer attributes such as is_premium, preferred_language, and behavioral metrics
        
        13. For geographic analysis, use city and state fields from customers, customer_addresses, restaurants, and delivery_agents
        
        14. For menu analysis, join menu_items to menu_sections to restaurants
        
        15. For operating hours analysis, use the operating_hours dataset with day_of_week filtering

    datasets:
      - name: customers
        business_name: Customers
        description: >-
          Contains customer master data. Each row represents one unique customer
          registered on the food delivery platform. This dataset includes customer
          identification, contact information, registration details, account status,
          premium membership status, and language preferences. Grain: one row per customer_id.
        source: food_delivery.customers
        primary_key:
          - customer_id
        fields:
          - name: customer_id
            business_name: Customer Identifier
            description: Unique identifier for a customer.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - PRIMARY KEY
          
          - name: first_name
            business_name: First Name
            description: Given name of the customer.
            sql_type: STRING(255)
            constraints:
              - PII
          
          - name: last_name
            business_name: Last Name
            description: Family name of the customer.
            sql_type: STRING(255)
            constraints:
              - PII
          
          - name: email
            business_name: Email
            description: Email address used to contact or authenticate the customer.
            sql_type: STRING(255)
            constraints:
              - PII
          
          - name: phone
            business_name: Phone
            description: Phone number used to contact the customer.
            sql_type: STRING(255)
            constraints:
              - PII
          
          - name: date_of_birth
            business_name: Date Of Birth
            description: Date of birth of the customer.
            sql_type: DATE
            constraints:
              - PII
          
          - name: registered_at
            business_name: Registered At
            description: Timestamp recording when the customer registered for the service.
            sql_type: TIMESTAMP(29,9)
            dimension:
              is_time: true
          
          - name: is_active
            business_name: Is Active
            description: Indicates whether the customer account is currently active.
            sql_type: BOOLEAN
            dimension:
              is_dimension: true
          
          - name: is_premium
            business_name: Is Premium
            description: Indicates whether the customer is enrolled in a premium program.
            sql_type: BOOLEAN
            dimension:
              is_dimension: true
          
          - name: preferred_language
            business_name: Preferred Language
            description: Language preference used for communications with the customer.
            sql_type: STRING(255)
            dimension:
              is_dimension: true

      - name: customer_addresses
        business_name: Customer Addresses
        description: >-
          Contains customer delivery addresses. Each row represents one address
          associated with a customer. Customers may have multiple addresses for
          different delivery locations. Includes address type, geographic coordinates,
          and default address indicator. Grain: one row per address_id.
        source: food_delivery.customer_addresses
        primary_key:
          - address_id
        fields:
          - name: address_id
            business_name: Address Identifier
            description: Unique identifier for a customer address record.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - PRIMARY KEY
          
          - name: customer_id
            business_name: Customer Reference
            description: References the customer associated with the address.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: address_type
            business_name: Address Type
            description: Indicates the type of address, such as Home or Work.
            sql_type: STRING(255)
            dimension:
              is_dimension: true
          
          - name: street_address
            business_name: Street Address
            description: Street address where the customer receives deliveries.
            sql_type: STRING(255)
            constraints:
              - PII
          
          - name: apt_unit
            business_name: Apartment Unit
            description: Apartment, unit, or suite designation for the customer address.
            sql_type: STRING(255)
            constraints:
              - PII
          
          - name: city
            business_name: City
            description: City where the customer address is located.
            sql_type: STRING(255)
            dimension:
              is_dimension: true
          
          - name: state
            business_name: State
            description: State or region where the customer address is located.
            sql_type: STRING(255)
            dimension:
              is_dimension: true
          
          - name: zip_code
            business_name: Zip Code
            description: Postal or ZIP code for the customer address.
            sql_type: STRING(255)
          
          - name: latitude
            business_name: Latitude
            description: Geographic latitude coordinate of the customer address.
            sql_type: DOUBLE
          
          - name: longitude
            business_name: Longitude
            description: Geographic longitude coordinate of the customer address.
            sql_type: DOUBLE
          
          - name: is_default
            business_name: Is Default
            description: Indicates whether this is the customer's default delivery address.
            sql_type: BOOLEAN
            dimension:
              is_dimension: true

      - name: orders
        business_name: Orders
        description: >-
          Contains customer order transactions. Each row represents one complete
          order placed by a customer at a restaurant. Includes order status, financial
          amounts (subtotal, fees, tax, tip, total), payment method, timestamps for
          order lifecycle events, cancellation information, scheduling indicator, and
          order channel. This is the primary fact table for order-level revenue analysis.
          Grain: one row per order_id.
        source: food_delivery.orders
        primary_key:
          - order_id
        fields:
          - name: order_id
            business_name: Order Identifier
            description: Unique identifier for a customer order.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - PRIMARY KEY
          
          - name: customer_id
            business_name: Customer Reference
            description: References the customer who placed the order.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: restaurant_id
            business_name: Restaurant Reference
            description: References the restaurant fulfilling the order.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: order_status
            business_name: Order Status
            description: Indicates the current status of the order, such as Placed, Delivered, or Cancelled.
            sql_type: STRING(255)
            dimension:
              is_dimension: true
          
          - name: subtotal
            business_name: Subtotal
            description: Monetary subtotal of the order before fees, taxes, and tips.
            sql_type: DOUBLE
            measure:
              aggregation: SUM
          
          - name: delivery_fee
            business_name: Delivery Fee
            description: Monetary fee charged for delivery.
            sql_type: DOUBLE
            measure:
              aggregation: SUM
          
          - name: tax
            business_name: Tax
            description: Monetary amount of tax applied to the order.
            sql_type: DOUBLE
            constraints:
              - PII
            measure:
              aggregation: SUM
          
          - name: tip
            business_name: Tip
            description: Monetary amount of tip provided by the customer.
            sql_type: DOUBLE
            constraints:
              - PII
            measure:
              aggregation: SUM
          
          - name: total_amount
            business_name: Total Amount
            description: Total monetary amount charged for the order including all fees, taxes, and tips.
            sql_type: DOUBLE
            constraints:
              - PII
            measure:
              aggregation: SUM
          
          - name: payment_method
            business_name: Payment Method
            description: Payment method used for the order, such as Credit Card or Digital Wallet.
            sql_type: STRING(255)
            constraints:
              - PII
            dimension:
              is_dimension: true
          
          - name: ordered_at
            business_name: Ordered At
            description: Timestamp recording when the order was placed.
            sql_type: TIMESTAMP(29,9)
            dimension:
              is_time: true
          
          - name: estimated_delivery_at
            business_name: Estimated Delivery At
            description: Timestamp indicating the estimated delivery time communicated to the customer.
            sql_type: TIMESTAMP(29,9)
            dimension:
              is_time: true
          
          - name: delivered_at
            business_name: Delivered At
            description: Timestamp recording when the order was actually delivered.
            sql_type: TIMESTAMP(29,9)
            dimension:
              is_time: true
          
          - name: cancelled_at
            business_name: Cancelled At
            description: Timestamp recording when the order was cancelled, if applicable.
            sql_type: TIMESTAMP(29,9)
            dimension:
              is_time: true
          
          - name: cancellation_reason
            business_name: Cancellation Reason
            description: Text describing the reason the order was cancelled.
            sql_type: STRING(255)
            dimension:
              is_dimension: true
          
          - name: is_scheduled
            business_name: Is Scheduled
            description: Indicates whether the order was scheduled for a future time.
            sql_type: BOOLEAN
            dimension:
              is_dimension: true
          
          - name: channel
            business_name: Channel
            description: Order channel used, such as Mobile App, Web, or Partner Platform.
            sql_type: STRING(255)
            dimension:
              is_dimension: true

      - name: order_items
        business_name: Order Items
        description: >-
          Contains individual line items within customer orders. Each row represents
          one menu item included in an order. Multiple items can belong to the same
          order. Includes item identification, quantity, unit price, line total, and
          special instructions. This is the primary fact table for item-level and
          product-level revenue analysis. Grain: one row per order_item_id.
        source: food_delivery.order_items
        primary_key:
          - order_item_id
        fields:
          - name: order_item_id
            business_name: Order Item Identifier
            description: Unique identifier for an item within a customer order.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - PRIMARY KEY
          
          - name: order_id
            business_name: Order Reference
            description: References the order that the item belongs to.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: item_id
            business_name: Item Reference
            description: References the menu item included in the order.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: item_name
            business_name: Item Name
            description: Name of the item as recorded on the order.
            sql_type: STRING(255)
          
          - name: quantity
            business_name: Quantity
            description: Number of units of the item ordered.
            sql_type: BIGINT
            measure:
              aggregation: SUM
          
          - name: unit_price
            business_name: Unit Price
            description: Monetary price per unit of the item at the time of order.
            sql_type: DOUBLE
          
          - name: line_total
            business_name: Line Total
            description: Total monetary amount for the item line, including quantity.
            sql_type: DOUBLE
            measure:
              aggregation: SUM
          
          - name: special_instructions
            business_name: Special Instructions
            description: Customer-provided special instructions for preparing or delivering the item.
            sql_type: STRING(255)

      - name: order_promotions
        business_name: Order Promotions
        description: >-
          Contains promotions applied to orders. Each row represents one promotion
          applied to a specific order. Multiple promotions may be applied to the same
          order. Includes promotion reference, discount amount, and application timestamp.
          Grain: one row per order_promotion_id.
        source: food_delivery.order_promotions
        primary_key:
          - order_promotion_id
        fields:
          - name: order_promotion_id
            business_name: Order Promotion Identifier
            description: Unique identifier for a promotion applied to an order.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - PRIMARY KEY
          
          - name: order_id
            business_name: Order Reference
            description: References the order to which the promotion was applied.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: promotion_id
            business_name: Promotion Reference
            description: References the promotion definition that was used.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: discount_amount
            business_name: Discount Amount
            description: Monetary value of the discount applied to the order.
            sql_type: DOUBLE
            measure:
              aggregation: SUM
          
          - name: applied_at
            business_name: Applied At
            description: Timestamp recording when the promotion was applied to the order.
            sql_type: TIMESTAMP(29,9)
            dimension:
              is_time: true

      - name: restaurants
        business_name: Restaurants
        description: >-
          Contains restaurant master data. Each row represents one restaurant
          partner on the food delivery platform. Includes restaurant identification,
          contact information, location, ratings, delivery performance metrics,
          order requirements, fees, and account status. Grain: one row per restaurant_id.
        source: food_delivery.restaurants
        primary_key:
          - restaurant_id
        fields:
          - name: restaurant_id
            business_name: Restaurant Identifier
            description: Unique identifier for a restaurant.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - PRIMARY KEY
          
          - name: name
            business_name: Name
            description: Display name of the restaurant.
            sql_type: STRING(255)
          
          - name: description
            business_name: Description
            description: Text description of the restaurant and its offerings.
            sql_type: STRING(255)
          
          - name: phone
            business_name: Phone
            description: Contact phone number for the restaurant.
            sql_type: STRING(255)
            constraints:
              - PII
          
          - name: email
            business_name: Email
            description: Contact email address for the restaurant.
            sql_type: STRING(255)
            constraints:
              - PII
          
          - name: street_address
            business_name: Street Address
            description: Street address where the restaurant is located.
            sql_type: STRING(255)
            constraints:
              - PII
          
          - name: city
            business_name: City
            description: City where the restaurant operates.
            sql_type: STRING(255)
            dimension:
              is_dimension: true
          
          - name: state
            business_name: State
            description: State or region where the restaurant operates.
            sql_type: STRING(255)
            dimension:
              is_dimension: true
          
          - name: zip_code
            business_name: Zip Code
            description: Postal or ZIP code for the restaurant location.
            sql_type: STRING(255)
          
          - name: latitude
            business_name: Latitude
            description: Geographic latitude coordinate of the restaurant location.
            sql_type: DOUBLE
          
          - name: longitude
            business_name: Longitude
            description: Geographic longitude coordinate of the restaurant location.
            sql_type: DOUBLE
          
          - name: avg_rating
            business_name: Average Rating
            description: Average rating the restaurant has received from customer reviews.
            sql_type: DOUBLE
          
          - name: total_reviews
            business_name: Total Reviews
            description: Total number of reviews the restaurant has received.
            sql_type: BIGINT
            measure:
              aggregation: SUM
          
          - name: avg_delivery_time_min
            business_name: Average Delivery Time Minutes
            description: Average delivery time in minutes for orders fulfilled by the restaurant.
            sql_type: BIGINT
          
          - name: min_order_amount
            business_name: Minimum Order Amount
            description: Minimum monetary order amount required by the restaurant.
            sql_type: DOUBLE
          
          - name: delivery_fee
            business_name: Delivery Fee
            description: Standard delivery fee charged by the restaurant.
            sql_type: DOUBLE
          
          - name: is_active
