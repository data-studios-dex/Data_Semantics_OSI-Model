      - name: operating_hours_to_restaurants
        left_dataset: operating_hours
        right_dataset: restaurants
        relationship_type: many_to_one
        join:
          left:
            - restaurant_id
          right:
            - restaurant_id
        join_type: many_to_one
        resolution: >-
          Each operating hours record belongs to exactly one restaurant. Multiple
          operating hours records (one per day of week) belong to the same restaurant.
          Join operating_hours to restaurants using restaurant_id to retrieve
          restaurant attributes.

      - name: deliveries_to_orders
        left_dataset: deliveries
        right_dataset: orders
        relationship_type: one_to_one
