      - name: reviews_to_delivery_agents
        left_dataset: reviews
        right_dataset: delivery_agents
        relationship_type: many_to_one
        join:
          left:
            - agent_id
          right:
            - agent_id
        join_type: many_to_one
        resolution: >-
          Each review evaluates exactly one delivery agent. Multiple reviews can
