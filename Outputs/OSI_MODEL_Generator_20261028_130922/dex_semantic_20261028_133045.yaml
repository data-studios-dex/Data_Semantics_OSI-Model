      - name: restaurant_category_map_to_restaurant_categories
        left_dataset: restaurant_category_map
        right_dataset: restaurant_categories
        relationship_type: many_to_one
        join:
          left:
            - category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Each restaurant-category mapping references exactly one category. Multiple
          mappings can reference the same category. Join restaurant_category_map
          to restaurant_categories using category_id to retrieve category attributes.

    metrics:
      - name: total_revenue
        business_name: Total Revenue
        description: >-
          Total revenue generated from all orders including subtotal, delivery fees,
          taxes, and tips. This is the sum of the total_amount field from the orders
          dataset. Use this metric for order-level revenue analysis.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.total_amount) AS total_revenue
                FROM food_delivery.orders AS orders
              columns_used:
                - orders.total_amount

      - name: subtotal_revenue
        business_name: Subtotal Revenue
        description: >-
          Total subtotal revenue from all orders before delivery fees, taxes, and
          tips. This is the sum of the subtotal field from the orders dataset.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.subtotal) AS subtotal_revenue
                FROM food_delivery.orders AS orders
              columns_used:
                - orders.subtotal

      - name: delivery_fee_revenue
        business_name: Delivery Fee Revenue
        description: >-
          Total revenue generated from delivery fees charged to customers. This is
          the sum of the delivery_fee field from the orders dataset.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.delivery_fee) AS delivery_fee_revenue
                FROM food_delivery.orders AS orders
              columns_used:
                - orders.delivery_fee

      - name: tax_revenue
        business_name: Tax Revenue
        description: >-
          Total tax amount collected from all orders. This is the sum of the tax
          field from the orders dataset.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.tax) AS tax_revenue
                FROM food_delivery.orders AS orders
              columns_used:
                - orders.tax

      - name: tip_revenue
        business_name: Tip Revenue
        description: >-
          Total tip amount provided by customers. This is the sum of the tip field
          from the orders dataset.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.tip) AS tip_revenue
                FROM food_delivery.orders AS orders
              columns_used:
                - orders.tip

      - name: order_count
        business_name: Order Count
        description: >-
          Total number of orders placed on the platform. This is the count of
          distinct order_id values from the orders dataset.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT orders.order_id) AS order_count
                FROM food_delivery.orders AS orders
              columns_used:
                - orders.order_id

      - name: completed_order_count
        business_name: Completed Order Count
        description: >-
          Total number of orders that have been successfully delivered. This is
          the count of orders where order_status equals 'Delivered'.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT orders.order_id) AS completed_order_count
                FROM food_delivery.orders AS orders
                WHERE orders.order_status = 'Delivered'
              columns_used:
                - orders.order_id
                - orders.order_status

      - name: cancelled_order_count
        business_name: Cancelled Order Count
        description: >-
          Total number of orders that have been cancelled. This is the count of
          orders where order_status equals 'Cancelled'.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT orders.order_id) AS cancelled_order_count
                FROM food_delivery.orders AS orders
                WHERE orders.order_status = 'Cancelled'
              columns_used:
                - orders.order_id
                - orders.order_status

      - name: average_order_value
        business_name: Average Order Value
        description: >-
          Average monetary value per order. This is calculated as total revenue
          divided by order count. Uses safe division to avoid division by zero.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT orders.order_id) = 0 THEN 0
                    ELSE SUM(orders.total_amount) / COUNT(DISTINCT orders.order_id)
                  END AS average_order_value
                FROM food_delivery.orders AS orders
              columns_used:
                - orders.order_id
                - orders.total_amount

      - name: customer_count
        business_name: Customer Count
        description: >-
          Total number of unique customers registered on the platform. This is
          the count of distinct customer_id values from the customers dataset.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT customers.customer_id) AS customer_count
                FROM food_delivery.customers AS customers
              columns_used:
                - customers.customer_id

      - name: active_customer_count
        business_name: Active Customer Count
        description: >-
          Total number of customers with active accounts. This is the count of
          customers where is_active equals true.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT customers.customer_id) AS active_customer_count
                FROM food_delivery.customers AS customers
                WHERE customers.is_active = true
              columns_used:
                - customers.customer_id
                - customers.is_active

      - name: premium_customer_count
        business_name: Premium Customer Count
        description: >-
          Total number of customers enrolled in the premium program. This is the
          count of customers where is_premium equals true.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT customers.customer_id) AS premium_customer_count
                FROM food_delivery.customers AS customers
                WHERE customers.is_premium = true
              columns_used:
                - customers.customer_id
                - customers.is_premium

      - name: orders_per_customer
        business_name: Orders per Customer
        description: >-
          Average number of orders per customer. This is calculated as total order
          count divided by total customer count. Uses safe division to avoid division
          by zero.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT customers.customer_id) = 0 THEN 0
                    ELSE CAST(COUNT(DISTINCT orders.order_id) AS DOUBLE) / COUNT(DISTINCT customers.customer_id)
                  END AS orders_per_customer
                FROM food_delivery.orders AS orders
                INNER JOIN food_delivery.customers AS customers
                  ON orders.customer_id = customers.customer_id
              columns_used:
                - orders.order_id
                - customers.customer_id

      - name: revenue_per_customer
        business_name: Revenue per Customer
        description: >-
          Average revenue generated per customer. This is calculated as total
          revenue divided by total customer count. Uses safe division to avoid
          division by zero.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT customers.customer_id) = 0 THEN 0
                    ELSE SUM(orders.total_amount) / COUNT(DISTINCT customers.customer_id)
                  END AS revenue_per_customer
                FROM food_delivery.orders AS orders
                INNER JOIN food_delivery.customers AS customers
                  ON orders.customer_id = customers.customer_id
              columns_used:
                - orders.total_amount
                - customers.customer_id

      - name: restaurant_count
        business_name: Restaurant Count
        description: >-
          Total number of restaurants registered on the platform. This is the
          count of distinct restaurant_id values from the restaurants dataset.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT restaurants.restaurant_id) AS restaurant_count
                FROM food_delivery.restaurants AS restaurants
              columns_used:
                - restaurants.restaurant_id

      - name: active_restaurant_count
        business_name: Active Restaurant Count
        description: >-
          Total number of restaurants currently active on the platform. This is
          the count of restaurants where is_active equals true.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT restaurants.restaurant_id) AS active_restaurant_count
                FROM food_delivery.restaurants AS restaurants
                WHERE restaurants.is_active = true
              columns_used:
                - restaurants.restaurant_id
                - restaurants.is_active

      - name: orders_per_restaurant
        business_name: Orders per Restaurant
        description: >-
          Average number of orders per restaurant. This is calculated as total
          order count divided by total restaurant count. Uses safe division to
          avoid division by zero.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT restaurants.restaurant_id) = 0 THEN 0
                    ELSE CAST(COUNT(DISTINCT orders.order_id) AS DOUBLE) / COUNT(DISTINCT restaurants.restaurant_id)
                  END AS orders_per_restaurant
                FROM food_delivery.orders AS orders
                INNER JOIN food_delivery.restaurants AS restaurants
                  ON orders.restaurant_id = restaurants.restaurant_id
              columns_used:
                - orders.order_id
                - restaurants.restaurant_id

      - name: item_revenue
        business_name: Item Revenue
        description: >-
          Total revenue from order items. This is the sum of line_total from the
          order_items dataset. Use this metric for item-level and product-level
          revenue analysis.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.line_total) AS item_revenue
                FROM food_delivery.order_items AS order_items
              columns_used:
                - order_items.line_total

      - name: total_quantity_sold
        business_name: Total Quantity Sold
        description: >-
          Total quantity of items sold across all orders. This is the sum of
          quantity from the order_items dataset.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.quantity) AS total_quantity_sold
                FROM food_delivery.order_items AS order_items
              columns_used:
                - order_items.quantity

      - name: average_items_per_order
        business_name: Average Items per Order
        description: >-
          Average number of items per order. This is calculated as total order
          item count divided by total order count. Uses safe division to avoid
          division by zero.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT orders.order_id) = 0 THEN 0
                    ELSE CAST(COUNT(DISTINCT order_items.order_item_id) AS DOUBLE) / COUNT(DISTINCT orders.order_id)
                  END AS average_items_per_order
                FROM food_delivery.order_items AS order_items
                INNER JOIN food_delivery.orders AS orders
                  ON order_items.order_id = orders.order_id
              columns_used:
                - order_items.order_item_id
                - orders.order_id

      - name: delivery_count
        business_name: Delivery Count
        description: >-
          Total number of deliveries executed on the platform. This is the count
          of distinct delivery_id values from the deliveries dataset.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT deliveries.delivery_id) AS delivery_count
                FROM food_delivery.deliveries AS deliveries
              columns_used:
                - deliveries.delivery_id

      - name: completed_delivery_count
        business_name: Completed Delivery Count
        description: >-
          Total number of deliveries that have been successfully completed. This
          is the count of deliveries where delivery_status equals 'Delivered'.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT deliveries.delivery_id) AS completed_delivery_count
                FROM food_delivery.deliveries AS deliveries
                WHERE deliveries.delivery_status = 'Delivered'
              columns_used:
                - deliveries.delivery_id
                - deliveries.delivery_status

      - name: average_delivery_distance_km
        business_name: Average Delivery Distance (km)
        description: >-
          Average distance traveled per delivery in kilometers. This is the average
          of distance_km from the deliveries dataset.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(deliveries.distance_km) AS average_delivery_distance_km
                FROM food_delivery.deliveries AS deliveries
              columns_used:
                - deliveries.distance_km

      - name: total_delivery_distance_km
        business_name: Total Delivery Distance (km)
        description: >-
          Total distance traveled across all deliveries in kilometers. This is
          the sum of distance_km from the deliveries dataset.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(deliveries.distance_km) AS total_delivery_distance_km
                FROM food_delivery.deliveries AS deliveries
              columns_used:
                - deliveries.distance_km

      - name: average_delivery_time_min
        business_name: Average Delivery Time (minutes)
        description: >-
          Average actual delivery time in minutes. This is the average of
          actual_time_min from the deliveries dataset.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(deliveries.actual_time_min) AS average_delivery_time_min
                FROM food_delivery.deliveries AS deliveries
              columns_used:
                - deliveries.actual_time_min

      - name: on_time_delivery_count
        business_name: On-Time Delivery Count
        description: >-
          Total number of deliveries completed on time or earlier than estimated.
          This is the count of deliveries where actual_time_min is less than or
          equal to estimated_time_min.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT deliveries.delivery_id) AS on_time_delivery_count
                FROM food_delivery.deliveries AS deliveries
                WHERE deliveries.actual_time_min <= deliveries.estimated_time_min
              columns_used:
                - deliveries.delivery_id
                - deliveries.actual_time_min
                - deliveries.estimated_time_min

      - name: delayed_delivery_count
        business_name: Delayed Delivery Count
        description: >-
          Total number of deliveries completed later than estimated. This is the
          count of deliveries where actual_time_min is greater than estimated_time_min.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT deliveries.delivery_id) AS delayed_delivery_count
                FROM food_delivery.deliveries AS deliveries
                WHERE deliveries.actual_time_min > deliveries.estimated_time_min
              columns_used:
                - deliveries.delivery_id
                - deliveries.actual_time_min
                - deliveries.estimated_time_min

      - name: on_time_delivery_rate_pct
        business_name: On-Time Delivery Rate (%)
        description: >-
          Percentage of deliveries completed on time or earlier than estimated.
          This is calculated as on-time delivery count divided by total delivery
          count, multiplied by 100. Uses safe division to avoid division by zero.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT deliveries.delivery_id) = 0 THEN 0
                    ELSE (
                      CAST(COUNT(DISTINCT CASE WHEN deliveries.actual_time_min <= deliveries.estimated_time_min THEN deliveries.delivery_id END) AS DOUBLE)
                      / COUNT(DISTINCT deliveries.delivery_id)
                    ) * 100
                  END AS on_time_delivery_rate_pct
                FROM food_delivery.deliveries AS deliveries
              columns_used:
                - deliveries.delivery_id
                - deliveries.actual_time_min
                - deliveries.estimated_time_min

      - name: agent_count
        business_name: Agent Count
        description: >-
          Total number of delivery agents registered on the platform. This is the
          count of distinct agent_id values from the delivery_agents dataset.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT delivery_agents.agent_id) AS agent_count
                FROM food_delivery.delivery_agents AS delivery_agents
              columns_used:
                - delivery_agents.agent_id

      - name: active_agent_count
        business_name: Active Agent Count
        description: >-
          Total number of delivery agents currently active on the platform. This
          is the count of agents where is_active equals true.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT delivery_agents.agent_id) AS active_agent_count
                FROM food_delivery.delivery_agents AS delivery_agents
                WHERE delivery_agents.is_active = true
              columns_used:
                - delivery_agents.agent_id
                - delivery_agents.is_active

      - name: total_agent_payout
        business_name: Total Agent Payout
        description: >-
          Total monetary amount paid to delivery agents. This is the sum of
          total_payout from the agent_payouts dataset.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(agent_payouts.total_payout) AS total_agent_payout
                FROM food_delivery.agent_payouts AS agent_payouts
              columns_used:
                - agent_payouts.total_payout

      - name: total_base_pay
        business_name: Total Base Pay
        description: >-
          Total base pay amount paid to delivery agents. This is the sum of
          base_pay from the agent_payouts dataset.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(agent_payouts.base_pay) AS total_base_pay
                FROM food_delivery.agent_payouts AS agent_payouts
              columns_used:
                - agent_payouts.base_pay

      - name: total_distance_bonus
        business_name: Total Distance Bonus
        description: >-
          Total distance bonus amount paid to delivery agents. This is the sum
          of distance_bonus from the agent_payouts dataset.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(agent_payouts.distance_bonus) AS total_distance_bonus
                FROM food_delivery.agent_payouts AS agent_payouts
              columns_used:
                - agent_payouts.distance_bonus

      - name: average_payout_per_delivery
        business_name: Average Payout per Delivery
        description: >-
          Average payout amount per delivery. This is calculated as total agent
          payout divided by delivery count. Uses safe division to avoid division
          by zero.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT agent_payouts.delivery_id) = 0 THEN 0
                    ELSE SUM(agent_payouts.total_payout) / COUNT(DISTINCT agent_payouts.delivery_id)
                  END AS average_payout_per_delivery
                FROM food_delivery.agent_payouts AS agent_payouts
              columns_used:
                - agent_payouts.total_payout
                - agent_payouts.delivery_id

      - name: payment_count
        business_name: Payment Count
        description: >-
          Total number of payment transactions processed. This is the count of
          distinct payment_id values from the payments dataset.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT payments.payment_id) AS payment_count
                FROM food_delivery.payments AS payments
              columns_used:
                - payments.payment_id

      - name: settled_payment_count
        business_name: Settled Payment Count
        description: >-
          Total number of payments that have been successfully settled. This is
          the count of payments where payment_status equals 'Settled'.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT payments.payment_id) AS settled_payment_count
                FROM food_delivery.payments AS payments
                WHERE payments.payment_status = 'Settled'
              columns_used:
                - payments.payment_id
                - payments.payment_status

      - name: total_payment_amount
        business_name: Total Payment Amount
        description: >-
          Total monetary amount processed through payments. This is the sum of
          amount from the payments dataset.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(payments.amount) AS total_payment_amount
                FROM food_delivery.payments AS payments
              columns_used:
                - payments.amount

      - name: promotion_count
        business_name: Promotion Count
        description: >-
          Total number of promotions defined on the platform. This is the count
          of distinct promotion_id values from the promotions dataset.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT promotions.promotion_id) AS promotion_count
                FROM food_delivery.promotions AS promotions
              columns_used:
                - promotions.promotion_id

      - name: active_promotion_count
        business_name: Active Promotion Count
        description: >-
          Total number of promotions currently active. This is the count of
          promotions where is_active equals true.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT promotions.promotion_id) AS active_promotion_count
                FROM food_delivery.promotions AS promotions
                WHERE promotions.is_active = true
              columns_used:
                - promotions.promotion_id
                - promotions.is_active

      - name: total_discount_amount
        business_name: Total Discount Amount
        description: >-
          Total monetary discount amount applied through promotions. This is the
          sum of discount_amount from the order_promotions dataset.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_promotions.discount_amount) AS total_discount_amount
                FROM food_delivery.order_promotions AS order_promotions
              columns_used:
                - order_promotions.discount_amount

      - name: orders_with_promotion_count
        business_name: Orders with Promotion Count
        description: >-
          Total number of orders that had at least one promotion applied. This
          is the count of distinct order_id values from the order_promotions dataset.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT order_promotions.order_id) AS orders_with_promotion_count
                FROM food_delivery.order_promotions AS order_promotions
              columns_used:
                - order_promotions.order_id

      - name: promotion_usage_rate_pct
        business_name: Promotion Usage Rate (%)
        description: >-
          Percentage of orders that used at least one promotion. This is calculated
          as orders with promotion count divided by total order count, multiplied
          by 100. Uses safe division to avoid division by zero.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT orders.order_id) = 0 THEN 0
                    ELSE (
                      CAST(COUNT(DISTINCT order_promotions.order_id) AS DOUBLE)
                      / COUNT(DISTINCT orders.order_id)
                    ) * 100
                  END AS promotion_usage_rate_pct
                FROM food_delivery.orders AS orders
                LEFT JOIN food_delivery.order_promotions AS order_promotions
                  ON orders.order_id = order_promotions.order_id
              columns_used:
                - orders.order_id
                - order_promotions.order_id

      - name: average_discount_per_promoted_order
        business_name: Average Discount per Promoted Order
        description: >-
          Average discount amount per order that used a promotion. This is
          calculated as total discount amount divided by orders with promotion
          count. Uses safe division to avoid division by zero.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT order_promotions.order_id) = 0 THEN 0
                    ELSE SUM(order_promotions.discount_amount) / COUNT(DISTINCT order_promotions.order_id)
                  END AS average_discount_per_promoted_order
                FROM food_delivery.order_promotions AS order_promotions
              columns_used:
                - order_promotions.discount_amount
                - order_promotions.order_id

      - name: review_count
        business_name: Review Count
        description: >-
          Total number of reviews submitted by customers. This is the count of
          distinct review_id values from the reviews dataset.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT reviews.review_id) AS review_count
                FROM food_delivery.reviews AS reviews
              columns_used:
                - reviews.review_id

      - name: average_food_rating
        business_name: Average Food Rating
        description: >-
          Average food quality rating across all reviews. This is the average of
          food_rating from the reviews dataset.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(reviews.food_rating) AS average_food_rating
                FROM food_delivery.reviews AS reviews
              columns_used:
                - reviews.food_rating

      - name: average_delivery_rating
        business_name: Average Delivery Rating
        description: >-
          Average delivery experience rating across all reviews. This is the
          average of delivery_rating from the reviews dataset.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(reviews.delivery_rating) AS average_delivery_rating
                FROM food_delivery.reviews AS reviews
              columns_used:
                - reviews.delivery_rating

      - name: average_overall_rating
        business_name: Average Overall Rating
        description: >-
          Average overall experience rating across all reviews. This is the
          average of overall_rating from the reviews dataset.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(reviews.overall_rating) AS average_overall_rating
                FROM food_delivery.reviews AS reviews
              columns_used:
                - reviews.overall_rating

      - name: support_ticket_count
        business_name: Support Ticket Count
        description: >-
          Total number of support tickets raised by customers. This is the count
          of distinct ticket_id values from the support_tickets dataset.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT support_tickets.ticket_id) AS support_ticket_count
                FROM food_delivery.support_tickets AS support_tickets
              columns_used:
                - support_tickets.ticket_id

      - name: resolved_ticket_count
        business_name: Resolved Ticket Count
        description: >-
          Total number of support tickets that have been resolved. This is the
          count of tickets where status equals 'Resolved'.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT support_tickets.ticket_id) AS resolved_ticket_count
                FROM food_delivery.support_tickets AS support_tickets
                WHERE support_tickets.status = 'Resolved'
              columns_used:
                - support_tickets.ticket_id
                - support_tickets.status

      - name: open_ticket_count
        business_name: Open Ticket Count
        description: >-
          Total number of support tickets currently open. This is the count of
          tickets where status equals 'Open'.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT support_tickets.ticket_id) AS open_ticket_count
                FROM food_delivery.support_tickets AS support_tickets
                WHERE support_tickets.status = 'Open'
              columns_used:
                - support_tickets.ticket_id
                - support_tickets.status

      - name: ticket_resolution_rate_pct
        business_name: Ticket Resolution Rate (%)
        description: >-
          Percentage of support tickets that have been resolved. This is calculated
          as resolved ticket count divided by total ticket count, multiplied by
          100. Uses safe division to avoid division by zero.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT support_tickets.ticket_id) = 0 THEN 0
                    ELSE (
                      CAST(COUNT(DISTINCT CASE WHEN support_tickets.status = 'Resolved' THEN support_tickets.ticket_id END) AS DOUBLE)
                      / COUNT(DISTINCT support_tickets.ticket_id)
                    ) * 100
                  END AS ticket_resolution_rate_pct
                FROM food_delivery.support_tickets AS support_tickets
              columns_used:
                - support_tickets.ticket_id
                - support_tickets.status

      - name: monthly_revenue
        business_name: Monthly Revenue
        description: >-
          Total revenue aggregated by month. This metric groups orders by month
          using the ordered_at timestamp and sums the total_amount. Use this for
          monthly revenue trend analysis.
        return_type: currency_usd
        result_grain: one row per month
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  DATE_TRUNC('MONTH', orders.ordered_at) AS order_month,
                  SUM(orders.total_amount) AS monthly_revenue
                FROM food_delivery.orders AS orders
                GROUP BY DATE_TRUNC('MONTH', orders.ordered_at)
                ORDER BY order_month
              columns_used:
                - orders.ordered_at
                - orders.total_amount

      - name: monthly_order_count
        business_name: Monthly Order Count
        description: >-
          Total order count aggregated by month. This metric groups orders by
          month using the ordered_at timestamp and counts distinct order_id values.
          Use this for monthly order volume trend analysis.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  DATE_TRUNC('MONTH', orders.ordered_at) AS order_month,
                  COUNT(DISTINCT orders.order_id) AS monthly_order_count
                FROM food_delivery.orders AS orders
                GROUP BY DATE_TRUNC('MONTH', orders.ordered_at)
                ORDER BY order_month
              columns_used:
                - orders.ordered_at
                - orders.order_id

      - name: revenue_by_restaurant
        business_name: Revenue by Restaurant
        description: >-
          Total revenue aggregated by restaurant. This metric groups orders by
          restaurant_id and sums the total_amount. Use this for restaurant
          performance analysis.
        return_type: currency_usd
        result_grain: one row per restaurant
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  restaurants.restaurant_id,
                  restaurants.name AS restaurant_name,
                  SUM(orders.total_amount) AS revenue_by_restaurant
                FROM food_delivery.orders AS orders
                INNER JOIN food_delivery.restaurants AS restaurants
                  ON orders.restaurant_id = restaurants.restaurant_id
                GROUP BY restaurants.restaurant_id, restaurants.name
                ORDER BY revenue_by_restaurant DESC
              columns_used:
                - orders.restaurant_id
                - orders.total_amount
                - restaurants.restaurant_id
                - restaurants.name

      - name: revenue_by_customer
        business_name: Revenue by Customer
        description: >-
          Total revenue aggregated by customer. This metric groups orders by
          customer_id and sums the total_amount. Use this for customer lifetime
          value analysis.
        return_type: currency_usd
        result_grain: one row per customer
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  customers.customer_id,
                  customers.first_name,
                  customers.last_name,
                  SUM(orders.total_amount) AS revenue_by_customer
                FROM food_delivery.orders AS orders
                INNER JOIN food_delivery.customers AS customers
                  ON orders.customer_id = customers.customer_id
                GROUP BY customers.customer_id, customers.first_name, customers.last_name
                ORDER BY revenue_by_customer DESC
              columns_used:
                - orders.customer_id
                - orders.total_amount
                - customers.customer_id
                - customers.first_name
                - customers.last_name

      - name: revenue_by_menu_item
        business_name: Revenue by Menu Item
        description: >-
          Total revenue aggregated by menu item. This metric groups order_items
          by item_id and sums the line_total. Use this for product performance
          analysis.
        return_type: currency_usd
        result_grain: one row per menu item
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  menu_items.item_id,
                  menu_items.name AS item_name,
                  SUM(order_items.line_total) AS revenue_by_menu_item
                FROM food_delivery.order_items AS order_items
                INNER JOIN food_delivery.menu_items AS menu_items
                  ON order_items.item_id = menu_items.item_id
                GROUP BY menu_items.item_id, menu_items.name
                ORDER BY revenue_by_menu_item DESC
              columns_used:
                - order_items.item_id
                - order_items.line_total
                - menu_items.item_id
                - menu_items.name

      - name: deliveries_by_agent
        business_name: Deliveries by Agent
        description: >-
          Total delivery count aggregated by delivery agent. This metric groups
          deliveries by agent_id and counts distinct delivery_id values. Use this
          for agent performance analysis.
        return_type: integer
        result_grain: one row per agent
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  delivery_agents.agent_id,
                  delivery_agents.first_name,
                  delivery_agents.last_name,
                  COUNT(DISTINCT deliveries.delivery_id) AS deliveries_by_agent
                FROM food_delivery.deliveries AS deliveries
                INNER JOIN food_delivery.delivery_agents AS delivery_agents
                  ON deliveries.agent_id = delivery_agents.agent_id
                GROUP BY delivery_agents.agent_id, delivery_agents.first_name, delivery_agents.last_name
                ORDER BY deliveries_by_agent DESC
              columns_used:
                - deliveries.agent_id
                - deliveries.delivery_id
                - delivery_agents.agent_id
                - delivery_agents.first_name
                - delivery_agents.last_name