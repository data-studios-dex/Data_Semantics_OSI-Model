      - name: modifications_created_by_month
        business_name: Modifications Created by Month
        description: >-
          Count of modifications created grouped by month.
          Provides time-series view of modification creation activity.
          Used for trend analysis and modification volume tracking over time.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    YEAR(mr.created_date) AS year,
                    MONTH(mr.created_date) AS month,
                    COUNT(*) AS modification_count
                FROM staging.mod_record AS mr
                WHERE mr.created_date IS NOT NULL
                GROUP BY YEAR(mr.created_date), MONTH(mr.created_date)
                ORDER BY YEAR(mr.created_date), MONTH(mr.created_date)
              columns_used:
                - mod_record.created_date
                - mod_record.mod_id

      - name: tasks_created_by_month
        business_name: Tasks Created by Month
        description: >-
          Count of tasks created grouped by month.
          Provides time-series view of task creation activity.
          Used for trend analysis and task volume tracking over time.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    YEAR(tr.created_date) AS year,
                    MONTH(tr.created_date) AS month,
                    COUNT(*) AS task_count
                FROM staging.task_record AS tr
                WHERE tr.created_date IS NOT NULL
                GROUP BY YEAR(tr.created_date), MONTH(tr.created_date)
                ORDER BY YEAR(tr.created_date), MONTH(tr.created_date)
              columns_used:
                - task_record.created_date
                - task_record.task_id

      - name: audit_events_by_date
        business_name: Audit Events by Date
        description: >-
          Count of audit events grouped by date.
          Provides daily time-series view of audit activity.
          Used for audit trend analysis and daily activity monitoring.
        return_type: integer
        result_grain: one row per date
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    CAST(ae.event_ts AS DATE) AS event_date,
                    COUNT(*) AS audit_event_count
                FROM staging.audit_event AS ae
                WHERE ae.event_ts IS NOT NULL
                GROUP BY CAST(ae.event_ts AS DATE)
                ORDER BY CAST(ae.event_ts AS DATE)
              columns_used:
                - audit_event.event_ts
                - audit_event.audit_id
