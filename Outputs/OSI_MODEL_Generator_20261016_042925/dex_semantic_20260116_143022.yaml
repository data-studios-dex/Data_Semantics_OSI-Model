version: "1.0"

semantic_model:
  - name: retail_operations_semantic_model
    description: >-
      Semantic model for retail operations management covering modification tracking,
      task management, baseline documentation, impact assessment, audit logging, and
      completion verification. This model supports analytical queries across modification
      lifecycle, task execution, compliance tracking, and operational audit trails.
      
      The model is designed for retail domain operational analytics including modification
      approval workflows, task completion tracking, impact analysis, and audit event monitoring.

    ai_context:
      instructions: >-
        ## Dataset Grain Reference
        
        - **audit_event**: One row per audit event. Records individual audit actions with timestamps.
        
        - **baseline_record**: One row per baseline record. Contains baseline documentation sections.
        
        - **completion_gate**: One row per completion gate item. Tracks individual checklist items for task completion.
        
        - **impact_record**: One row per impact assessment. Documents individual impacts of modifications on baselines.
        
        - **mod_record**: One row per modification. Central entity tracking modification requests and approvals.
        
        - **subtask**: One row per subtask. Breaks down tasks into sequential steps.
        
        - **task_record**: One row per task. Tracks individual tasks associated with modifications.
        
        
        ## Relationship and Join Guidance
        
        **Primary Relationships:**
        
        1. **task_record to mod_record** (many-to-one via mod_id):
           - Multiple tasks can be associated with a single modification.
           - Join: task_record.mod_id = mod_record.mod_id
        
        2. **completion_gate to task_record** (many-to-one via task_id):
           - Multiple completion gate items can exist for a single task.
           - Join: completion_gate.task_id = task_record.task_id
        
        3. **subtask to task_record** (many-to-one via task_id):
           - Multiple subtasks can belong to a single task.
           - Join: subtask.task_id = task_record.task_id
        
        4. **impact_record to mod_record** (many-to-one via mod_id):
           - Multiple impact records can be associated with a single modification.
           - Join: impact_record.mod_id = mod_record.mod_id
        
        
        ## Double-Counting Prevention
        
        **Critical Grain Differences:**
        
        - **mod_record** is at modification grain (one row per modification).
        - **task_record** is at task grain (multiple tasks per modification).
        - **subtask** is at subtask grain (multiple subtasks per task).
        - **completion_gate** is at gate item grain (multiple gate items per task).
        - **impact_record** is at impact grain (multiple impacts per modification).
        
        **Prevention Rules:**
        
        1. When joining mod_record to task_record:
           - Do NOT aggregate modification-level fields after the join without proper grouping.
           - Use DISTINCT or GROUP BY mod_id when counting modifications.
        
        2. When joining task_record to subtask or completion_gate:
           - Do NOT aggregate task-level fields after the join without proper grouping.
           - Use DISTINCT or GROUP BY task_id when counting tasks.
        
        3. When joining mod_record to impact_record:
           - Do NOT aggregate modification-level fields after the join without proper grouping.
           - Use DISTINCT or GROUP BY mod_id when counting modifications.
        
        
        ## Time Analysis Guidance
        
        **Date Fields and Their Usage:**
        
        - **audit_event.event_ts**: Use for audit event time analysis and audit trail reporting.
        
        - **mod_record.created_date**: Use for modification creation time analysis.
        
        - **mod_record.updated_date**: Use for modification update time analysis and tracking changes over time.
        
        - **task_record.created_date**: Use for task creation time analysis.
        
        - **task_record.updated_date**: Use for task update time analysis and task lifecycle tracking.
        
        **Time-Based Analysis:**
        
        - For modification creation trends, use mod_record.created_date.
        - For task creation trends, use task_record.created_date.
        - For audit event analysis, use audit_event.event_ts.
        - For modification lifecycle analysis, compare mod_record.created_date and mod_record.updated_date.
        - For task lifecycle analysis, compare task_record.created_date and task_record.updated_date.
        
        
        ## Metric Selection Guidance
        
        **Modification Metrics:**
        
        - Use mod_record for modification counts, approval status analysis, and modification classification.
        - Filter by approval_status for approved vs pending modifications.
        - Filter by is_active for active modifications.
        - Group by mod_class for modification type analysis.
        
        **Task Metrics:**
        
        - Use task_record for task counts and status analysis.
        - Filter by status for task progress tracking.
        - Join to mod_record for task-to-modification analysis.
        
        **Completion Metrics:**
        
        - Use completion_gate for completion tracking.
        - Aggregate is_checked to calculate completion rates.
        - Join to task_record for task-level completion analysis.
        
        **Impact Metrics:**
        
        - Use impact_record for impact assessment counts.
        - Filter by is_selected for selected impacts.
        - Group by change_type for impact type analysis.
        
        **Audit Metrics:**
        
        - Use audit_event for audit trail analysis.
        - Group by action for action type analysis.
        - Use event_ts for time-based audit analysis.
        
        
        ## Query Restrictions and Considerations
        
        1. **PII Handling**: impact_record.owner_name contains PII. Apply appropriate access controls and masking.
        
        2. **Text Fields**: Several fields (details, rationale, change_desc, etc.) contain long text. Use appropriate filtering and avoid full-text aggregation without summarization.
        
        3. **Status Values**: status field in task_record contains categorical values. Validate status values before filtering.
        
        4. **Boolean Fields**: is_checked, is_selected, and is_active are BIT fields. Use appropriate boolean logic (1/0 or TRUE/FALSE depending on SQL dialect).
        
        5. **Reference Fields**: Multiple reference fields (mod_ref, task_ref, baseline_ref, etc.) are used for cross-referencing. These are business identifiers, not surrogate keys.
        
        6. **Sequence Numbers**: subtask.seq_no indicates subtask order. Use ORDER BY seq_no for sequential subtask display.

    datasets:
      - name: audit_event
        business_name: Audit Event
        description: >-
          Contains audit event records tracking system actions and changes.
          One row per audit event. Records individual audit actions with timestamps,
          action descriptions, record references, and detailed context. Used for
          audit trail analysis, compliance tracking, and change history monitoring.
        source: staging.audit_event
        primary_key:
          - audit_id
        fields:
          - name: audit_id
            business_name: Audit ID
            description: >-
              Unique identifier for the audit event record. Primary key.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - PRIMARY KEY

          - name: event_ts
            business_name: Event Timestamp
            description: >-
              Timestamp recording when the audit event occurred. Used for
              time-based audit analysis and event sequencing.
            sql_type: DATETIME
            constraints:
              - NOT NULL
            dimension:
              is_time: true

          - name: action
            business_name: Action
            description: >-
              Description of the action performed in the audit event.
              Examples include RECORD_UPDATED, RECORD_CREATED, RECORD_DELETED.
              Used for action type analysis and audit categorization.
            sql_type: VARCHAR(150)
            constraints:
              - NOT NULL

          - name: record_ref
            business_name: Record Reference
            description: >-
              Reference identifier of the record associated with the audit event.
              Links the audit event to the affected business record.
            sql_type: VARCHAR(150)

          - name: details
            business_name: Details
            description: >-
              Detailed description of the audit event and related context.
              Contains narrative explanation of the action and its impact.
            sql_type: TEXT

      - name: baseline_record
        business_name: Baseline Record
        description: >-
          Contains baseline documentation records. One row per baseline record.
          Stores baseline sections, titles, topics, and sensitivity classifications.
          Used for baseline reference, documentation management, and compliance tracking.
        source: staging.baseline_record
        primary_key:
          - baseline_id
        fields:
          - name: baseline_id
            business_name: Baseline ID
            description: >-
              Unique identifier for the baseline record. Primary key.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - PRIMARY KEY

          - name: section_ref
            business_name: Section Reference
            description: >-
              Reference code for the baseline section. Business identifier
              used for cross-referencing baseline sections.
            sql_type: VARCHAR(20)

          - name: title
            business_name: Title
            description: >-
              Title or short description of the baseline record.
              Provides summary identification of the baseline content.
            sql_type: VARCHAR(200)

          - name: topic
            business_name: Topic
            description: >-
              Topic or subject area covered by the baseline record.
              Used for baseline categorization and topic-based analysis.
            sql_type: VARCHAR(300)

          - name: sensitivity
            business_name: Sensitivity
            description: >-
              Sensitivity classification associated with the baseline record.
              Examples include Internal, Confidential, Public. Used for
              access control and compliance requirements.
            sql_type: VARCHAR(50)

      - name: completion_gate
        business_name: Completion Gate
        description: >-
          Contains completion gate checklist items for task verification.
          One row per completion gate item. Tracks individual checklist items
          associated with tasks, including gate names and completion status.
          Used for task completion tracking and quality assurance verification.
        source: staging.completion_gate
        primary_key:
          - gate_id
        fields:
          - name: gate_id
            business_name: Gate ID
            description: >-
              Unique identifier for the completion gate record. Primary key.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - PRIMARY KEY

          - name: task_id
            business_name: Task ID
            description: >-
              Identifier of the related task for this completion gate.
              Foreign key to task_record. Links the gate item to its parent task.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - FOREIGN KEY

          - name: gate_name
            business_name: Gate Name
            description: >-
              Name or label of the completion gate checklist item.
              Describes the specific verification or checkpoint required.
            sql_type: VARCHAR(200)

          - name: is_checked
            business_name: Is Checked
            description: >-
              Indicates whether the completion gate item has been checked.
              Boolean flag (1 = checked, 0 = not checked). Used for
              completion rate calculation and progress tracking.
            sql_type: BIT

      - name: impact_record
        business_name: Impact Record
        description: >-
          Contains impact assessment records documenting the effects of modifications
          on baselines. One row per impact assessment. Tracks modification impacts,
          rationale, change types, ownership, and selection status. Used for impact
          analysis, change management, and modification approval workflows.
        source: staging.impact_record
        primary_key:
          - impact_id
        fields:
          - name: impact_id
            business_name: Impact ID
            description: >-
              Unique identifier for the impact record. Primary key.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - PRIMARY KEY

          - name: mod_id
            business_name: Modification ID
            description: >-
              Identifier of the related modification associated with this impact.
              Foreign key to mod_record. Links the impact to its parent modification.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - FOREIGN KEY

          - name: baseline_ref
            business_name: Baseline Reference
            description: >-
              Reference code to the baseline affected by the modification.
              Business identifier linking the impact to baseline documentation.
            sql_type: VARCHAR(20)

          - name: rationale
            business_name: Rationale
            description: >-
              Narrative explanation of the reason for the change or impact.
              Provides business justification and context for the modification impact.
            sql_type: TEXT

          - name: change_type
            business_name: Change Type
            description: >-
              Type or category of change being implemented. Examples include
              Design Update, Process Change, Safety Enhancement. Used for
              change categorization and impact type analysis.
            sql_type: VARCHAR(30)

          - name: owner_name
            business_name: Owner Name
            description: >-
              Full name of the person responsible for the impact record.
              Contains PII. Requires appropriate access controls and data masking.
            sql_type: VARCHAR(150)
            constraints:
              - PII

          - name: is_selected
            business_name: Is Selected
            description: >-
              Indicates whether this impact record has been selected or approved.
              Boolean flag (1 = selected, 0 = not selected). Used for
              impact approval tracking and selection analysis.
            sql_type: BIT

      - name: mod_record
        business_name: Modification Record
        description: >-
          Contains modification records tracking change requests, approvals, and
          implementation details. One row per modification. Central entity for
          modification lifecycle management including classification, applicability,
          approval status, references, change descriptions, safety classifications,
          certification basis, release authorities, target revisions, and activity status.
          Used for modification tracking, approval workflow management, compliance
          monitoring, and change impact analysis.
        source: staging.mod_record
        primary_key:
          - mod_id
        fields:
          - name: mod_id
            business_name: Modification ID
            description: >-
              Unique identifier for the modification record. Primary key.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - PRIMARY KEY

          - name: mod_ref
            business_name: Modification Reference
            description: >-
              Reference code assigned to the modification. Business identifier
              used for cross-referencing and external communication.
            sql_type: VARCHAR(50)

          - name: title
            business_name: Title
            description: >-
              Title or short description of the modification.
              Provides summary identification of the modification purpose.
            sql_type: VARCHAR(200)

          - name: mod_class
            business_name: Modification Class
            description: >-
              Classification or category of the modification. Examples include
              Major, Minor, Emergency. Used for modification categorization,
              prioritization, and approval routing.
            sql_type: VARCHAR(50)

          - name: applicability
            business_name: Applicability
            description: >-
              Description of where or to what the modification applies.
              Defines the scope and coverage of the modification.
            sql_type: TEXT

          - name: approved_data_ref
            business_name: Approved Data Reference
            description: >-
              Reference to the approved data source or document for the modification.
              Links to supporting documentation and approval evidence.
            sql_type: VARCHAR(200)

          - name: approval_status
            business_name: Approval Status
            description: >-
              Indicates the current approval status of the modification.
              Examples include Approved, Pending, Rejected. Used for
              approval workflow tracking and status-based filtering.
            sql_type: VARCHAR(100)

          - name: drawing_ref
            business_name: Drawing Reference
            description: >-
              Reference to any associated drawing or schematic for the modification.
              Links to technical drawings and design documentation.
            sql_type: VARCHAR(200)

          - name: ica_ref
            business_name: ICA Reference
            description: >-
              Reference to any associated impact or issue control assessment (ICA) document.
              Links to impact assessment and control documentation.
            sql_type: VARCHAR(200)

          - name: change_desc
            business_name: Change Description
            description: >-
              Detailed description of the change introduced by the modification.
              Provides comprehensive explanation of the modification content and impact.
            sql_type: TEXT

          - name: safety_classification
            business_name: Safety Classification
            description: >-
              Safety classification associated with the modification.
              Examples include Safety-Critical, Safety-Related, Non-Safety.
              Used for safety analysis and compliance tracking.
            sql_type: VARCHAR(150)

          - name: cert_basis
            business_name: Certification Basis
            description: >-
              Certification basis or regulatory justification for the modification.
              Documents the regulatory and compliance foundation for the change.
            sql_type: TEXT

          - name: release_authorities
            business_name: Release Authorities
            description: >-
              Authorities or roles authorized to release the modification.
              Identifies the approval chain and release authorization.
            sql_type: VARCHAR(300)

          - name: target_revision
            business_name: Target Revision
            description: >-
              Target revision identifier that this modification aims to implement.
              Links the modification to specific revision targets.
            sql_type: VARCHAR(100)

          - name: is_active
            business_name: Is Active
            description: >-
              Indicates whether the modification is currently active.
              Boolean flag (1 = active, 0 = inactive). Used for
              filtering active modifications and lifecycle management.
            sql_type: BIT

          - name: created_date
            business_name: Created Date
            description: >-
              Datetime when the modification record was created.
              Used for creation time analysis and modification age calculation.
            sql_type: DATETIME
            dimension:
              is_time: true

          - name: updated_date
            business_name: Updated Date
            description: >-
              Datetime when the modification record was last updated.
              Used for update time analysis and modification lifecycle tracking.
            sql_type: DATETIME
            dimension:
              is_time: true

      - name: subtask
        business_name: Subtask
        description: >-
          Contains subtask records breaking down tasks into sequential steps.
          One row per subtask. Tracks individual subtask steps associated with
          parent tasks, including sequence numbers and detailed descriptions.
          Used for task decomposition, step-by-step execution tracking, and
          detailed task planning.
        source: staging.subtask
        primary_key:
          - subtask_id
        fields:
          - name: subtask_id
            business_name: Subtask ID
            description: >-
              Unique identifier for the subtask record. Primary key.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - PRIMARY KEY

          - name: task_id
            business_name: Task ID
            description: >-
              Identifier of the parent task associated with the subtask.
              Foreign key to task_record. Links the subtask to its parent task.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - FOREIGN KEY

          - name: seq_no
            business_name: Sequence Number
            description: >-
              Sequence number indicating the order of the subtask within the task.
              Used for subtask ordering and sequential execution planning.
            sql_type: BIGINT

          - name: description
            business_name: Description
            description: >-
              Detailed description of the subtask to be performed.
              Provides step-by-step instructions and subtask details.
            sql_type: TEXT

      - name: task_record
        business_name: Task Record
        description: >-
          Contains task records tracking individual tasks associated with modifications.
          One row per task. Manages task lifecycle including task references, titles,
          source references, effectivity, preliminary requirements, safety instructions,
          status, creation dates, and update dates. Used for task management, execution
          tracking, safety compliance, and modification implementation coordination.
        source: staging.task_record
        primary_key:
          - task_id
        fields:
          - name: task_id
            business_name: Task ID
            description: >-
              Unique identifier for the task record. Primary key.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - PRIMARY KEY

          - name: mod_id
            business_name: Modification ID
            description: >-
              Identifier of the related modification associated with the task.
              Foreign key to mod_record. Links the task to its parent modification.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - FOREIGN KEY

          - name: task_ref
            business_name: Task Reference
            description: >-
              Reference code assigned to the task. Business identifier
              used for cross-referencing and external communication.
            sql_type: VARCHAR(50)

          - name: title
            business_name: Title
            description: >-
              Title or short description of the task.
              Provides summary identification of the task purpose.
            sql_type: VARCHAR(300)

          - name: source_ref
            business_name: Source Reference
            description: >-
              Reference to the originating source document or requirement for the task.
              Links the task to its source documentation and requirements.
            sql_type: VARCHAR(20)

          - name: effectivity
            business_name: Effectivity
            description: >-
              Description of when or where the task is effective.
              Defines the scope, timing, and applicability of the task.
            sql_type: TEXT

          - name: preliminary_requirements
            business_name: Preliminary Requirements
            description: >-
              Preconditions and requirements that must be met before starting the task.
              Documents prerequisites and preparation steps.
            sql_type: TEXT

          - name: safety_text
            business_name: Safety Text
            description: >-
              Safety instructions or warnings associated with the task.
              Provides safety guidance and hazard warnings for task execution.
            sql_type: TEXT

          - name: status
            business_name: Status
            description: >-
              Indicates the current status of the task. Examples include
              In Progress, Completed, Pending, Cancelled. Used for
              task progress tracking and status-based filtering.
            sql_type: VARCHAR(30)

          - name: created_date
            business_name: Created Date
            description: >-
              Datetime when the task record was created.
              Used for creation time analysis and task age calculation.
            sql_type: DATETIME
            dimension:
              is_time: true

          - name: updated_date
            business_name: Updated Date
            description: >-
              Datetime when the task record was last updated.
              Used for update time analysis and task lifecycle tracking.
            sql_type: DATETIME
            dimension:
              is_time: true

    relationships:
      - name: task_to_modification
        left_dataset: task_record
        right_dataset: mod_record
        relationship_type: many_to_one
        join:
          left:
            - mod_id
          right:
            - mod_id
        join_type: many_to_one
        resolution: >-
          Multiple tasks can be associated with a single modification.
          Join task_record to mod_record using mod_id to link tasks to their
          parent modifications. This relationship supports modification-to-task
          analysis, task aggregation by modification, and modification implementation tracking.

      - name: completion_gate_to_task
        left_dataset: completion_gate
        right_dataset: task_record
        relationship_type: many_to_one
        join:
          left:
            - task_id
          right:
            - task_id
        join_type: many_to_one
        resolution: >-
          Multiple completion gate items can exist for a single task.
          Join completion_gate to task_record using task_id to link gate items
          to their parent tasks. This relationship supports task completion tracking,
          completion rate calculation, and quality gate verification.

      - name: subtask_to_task
        left_dataset: subtask
        right_dataset: task_record
        relationship_type: many_to_one
        join:
          left:
            - task_id
          right:
            - task_id
        join_type: many_to_one
        resolution: >-
          Multiple subtasks can belong to a single task.
          Join subtask to task_record using task_id to link subtasks to their
          parent tasks. This relationship supports task decomposition analysis,
          subtask aggregation by task, and detailed task execution tracking.
          Use subtask.seq_no for sequential ordering of subtasks within a task.

      - name: impact_to_modification
        left_dataset: impact_record
        right_dataset: mod_record
        relationship_type: many_to_one
        join:
          left:
            - mod_id
          right:
            - mod_id
        join_type: many_to_one
        resolution: >-
          Multiple impact records can be associated with a single modification.
          Join impact_record to mod_record using mod_id to link impacts to their
          parent modifications. This relationship supports modification impact analysis,
          impact aggregation by modification, and change assessment tracking.

    metrics:
      - name: total_audit_events
        business_name: Total Audit Events
        description: >-
          Total count of audit events recorded in the system.
          Represents the complete audit trail volume. Used for
          audit activity monitoring and system usage analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    COUNT(*) AS total_audit_events
                FROM staging.audit_event AS ae
              columns_used:
                - audit_event.audit_id

      - name: audit_events_by_action
        business_name: Audit Events by Action
        description: >-
          Count of audit events grouped by action type.
          Provides breakdown of audit activity by action category.
          Used for action type analysis and audit pattern identification.
        return_type: integer
        result_grain: one row per action
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    ae.action,
                    COUNT(*) AS audit_event_count
                FROM staging.audit_event AS ae
                GROUP BY ae.action
              columns_used:
                - audit_event.action
                - audit_event.audit_id

      - name: total_modifications
        business_name: Total Modifications
        description: >-
          Total count of modification records in the system.
          Represents the complete modification volume. Used for
          modification activity monitoring and change management analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    COUNT(*) AS total_modifications
                FROM staging.mod_record AS mr
              columns_used:
                - mod_record.mod_id

      - name: active_modifications
        business_name: Active Modifications
        description: >-
          Count of currently active modifications (is_active = 1).
          Represents modifications currently in effect. Used for
          active change tracking and current modification portfolio analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    COUNT(*) AS active_modifications
                FROM staging.mod_record AS mr
                WHERE mr.is_active = 1
              columns_used:
                - mod_record.mod_id
                - mod_record.is_active

      - name: modifications_by_approval_status
        business_name: Modifications by Approval Status
        description: >-
          Count of modifications grouped by approval status.
          Provides breakdown of modifications by approval state.
          Used for approval workflow monitoring and status distribution analysis.
        return_type: integer
        result_grain: one row per approval status
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    mr.approval_status,
                    COUNT(*) AS modification_count
                FROM staging.mod_record AS mr
                GROUP BY mr.approval_status
              columns_used:
                - mod_record.approval_status
                - mod_record.mod_id

      - name: modifications_by_class
        business_name: Modifications by Class
        description: >-
          Count of modifications grouped by modification class.
          Provides breakdown of modifications by classification type.
          Used for modification type analysis and classification distribution.
        return_type: integer
        result_grain: one row per modification class
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    mr.mod_class,
                    COUNT(*) AS modification_count
                FROM staging.mod_record AS mr
                GROUP BY mr.mod_class
              columns_used:
                - mod_record.mod_class
                - mod_record.mod_id

      - name: modifications_by_safety_classification
        business_name: Modifications by Safety Classification
        description: >-
          Count of modifications grouped by safety classification.
          Provides breakdown of modifications by safety category.
          Used for safety analysis and safety-critical modification tracking.
        return_type: integer
        result_grain: one row per safety classification
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    mr.safety_classification,
                    COUNT(*) AS modification_count
                FROM staging.mod_record AS mr
                GROUP BY mr.safety_classification
              columns_used:
                - mod_record.safety_classification
                - mod_record.mod_id

      - name: total_tasks
        business_name: Total Tasks
        description: >-
          Total count of task records in the system.
          Represents the complete task volume. Used for
          task activity monitoring and workload analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    COUNT(*) AS total_tasks
                FROM staging.task_record AS tr
              columns_used:
                - task_record.task_id

      - name: tasks_by_status
        business_name: Tasks by Status
        description: >-
          Count of tasks grouped by status.
          Provides breakdown of tasks by current state.
          Used for task progress monitoring and status distribution analysis.
        return_type: integer
        result_grain: one row per status
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    tr.status,
                    COUNT(*) AS task_count
                FROM staging.task_record AS tr
                GROUP BY tr.status
              columns_used:
                - task_record.status
                - task_record.task_id

      - name: tasks_per_modification
        business_name: Tasks per Modification
        description: >-
          Average number of tasks per modification.
          Represents the typical task breakdown per modification.
          Used for modification complexity analysis and task planning.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT tr.mod_id) = 0 THEN 0
                        ELSE CAST(COUNT(tr.task_id) AS DECIMAL(10,2)) / COUNT(DISTINCT tr.mod_id)
                    END AS tasks_per_modification
                FROM staging.task_record AS tr
              columns_used:
                - task_record.task_id
                - task_record.mod_id

      - name: total_completion_gates
        business_name: Total Completion Gates
        description: >-
          Total count of completion gate items in the system.
          Represents the complete gate item volume. Used for
          quality gate monitoring and completion tracking.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    COUNT(*) AS total_completion_gates
                FROM staging.completion_gate AS cg
              columns_used:
                - completion_gate.gate_id

      - name: checked_completion_gates
        business_name: Checked Completion Gates
        description: >-
          Count of completion gate items that have been checked (is_checked = 1).
          Represents completed gate items. Used for completion progress tracking
          and quality verification monitoring.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    COUNT(*) AS checked_completion_gates
                FROM staging.completion_gate AS cg
                WHERE cg.is_checked = 1
              columns_used:
                - completion_gate.gate_id
                - completion_gate.is_checked

      - name: completion_rate_percentage
        business_name: Completion Rate Percentage
        description: >-
          Percentage of completion gate items that have been checked.
          Calculated as (checked gates / total gates) * 100.
          Represents overall completion progress. Used for quality
          gate completion monitoring and progress tracking.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(*) = 0 THEN 0
                        ELSE (CAST(SUM(CASE WHEN cg.is_checked = 1 THEN 1 ELSE 0 END) AS DECIMAL(10,2)) / COUNT(*)) * 100
                    END AS completion_rate_percentage
                FROM staging.completion_gate AS cg
              columns_used:
                - completion_gate.gate_id
                - completion_gate.is_checked

      - name: completion_gates_per_task
        business_name: Completion Gates per Task
        description: >-
          Average number of completion gate items per task.
          Represents the typical gate item count per task.
          Used for task complexity analysis and quality gate planning.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT cg.task_id) = 0 THEN 0
                        ELSE CAST(COUNT(cg.gate_id) AS DECIMAL(10,2)) / COUNT(DISTINCT cg.task_id)
                    END AS completion_gates_per_task
                FROM staging.completion_gate AS cg
              columns_used:
                - completion_gate.gate_id
                - completion_gate.task_id

