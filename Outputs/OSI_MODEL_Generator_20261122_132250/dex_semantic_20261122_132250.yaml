version: "1.0"

semantic_model:
  - name: retail_ecommerce_semantic_model
    description: >-
      Comprehensive semantic model for retail e-commerce analytics derived from the ecom_bronze schema.
      This model supports analytical queries across customers, orders, order items, products, product categories,
      payments, and shipments. The model enables revenue analysis, customer behavior analysis, product performance
      analysis, fulfillment analysis, and payment analysis across multiple business dimensions including time,
      geography, customer segments, product categories, sales channels, and payment methods.
    
    ai_context:
      instructions: >-
        ## Dataset Grain Guide
        
        - **customers**: One row per customer. Use for customer-level analysis and customer counts.
        
        - **orders**: One row per order. Use for order-level metrics such as total order amount, order counts, 
          average order value, and order-level revenue. This is the primary fact table for order analysis.
        
        - **order_items**: One row per order line item. Use for product-level analysis within orders, 
          line-level revenue, quantity sold by product, and product mix analysis. An order may have multiple 
          order items.
        
        - **products**: One row per product. Use for product master data, product attributes, pricing, 
          and inventory levels.
        
        - **product_categories**: One row per product category. Supports hierarchical product categorization 
          through parent_category_id self-reference.
        
        - **payments**: One row per payment transaction. Use for payment analysis, payment method analysis, 
          and payment status tracking. Typically one payment per order but may support multiple payments.
        
        - **shipments**: One row per shipment. Use for fulfillment analysis, delivery performance, and 
          carrier analysis. Typically one shipment per order.
        
        
        ## Metric Selection Guide
        
        **Order-Level Revenue Metrics:**
        
        - Use `orders.total_amount` for total order revenue including all fees and taxes.
        - Use `orders.subtotal` for merchandise revenue before discounts, taxes, and shipping.
        - Use `orders.discount_amount` for total discounts applied at order level.
        - Use `orders.tax_amount` for tax amounts.
        - Use `orders.shipping_fee` for shipping revenue.
        
        **Line-Level Revenue Metrics:**
        
        - Use `order_items.line_total` for line-level revenue after line discounts.
        - Use `order_items.quantity * order_items.unit_price` for line revenue before discount.
        - Use `order_items.quantity` for units sold.
        
        **Product-Level Metrics:**
        
        - Use `products.unit_price` for current product pricing.
        - Use `products.cost_price` for product cost (restricted access).
        - Use `products.stock_quantity` for current inventory levels.
        
        **Customer Metrics:**
        
        - Use `customers.customer_id` with COUNT DISTINCT for customer counts.
        - Use `customers.is_active` to filter active customers.
        - Use `customers.customer_segment` for segmentation analysis.
        
        **Payment Metrics:**
        
        - Use `payments.amount` for payment amounts.
        - Use `payments.payment_method` for payment method analysis.
        - Use `payments.payment_status` to filter settled payments.
        
        
        ## Join Guidance
        
        **Standard Relationships:**
        
        1. **orders → customers**: Join `orders.customer_id = customers.customer_id` (many-to-one).
           Use for customer attribution of orders.
        
        2. **order_items → orders**: Join `order_items.order_id = orders.order_id` (many-to-one).
           Use for order context of line items.
        
        3. **order_items → products**: Join `order_items.product_id = products.product_id` (many-to-one).
           Use for product attributes of line items.
        
        4. **products → product_categories**: Join `products.category_id = product_categories.category_id` (many-to-one).
           Use for product categorization.
        
        5. **payments → orders**: Join `payments.order_id = orders.order_id` (many-to-one).
           Use for payment details of orders.
        
        6. **shipments → orders**: Join `shipments.order_id = orders.order_id` (many-to-one).
           Use for shipment details of orders.
        
        **Hierarchical Relationship:**
        
        - **product_categories → product_categories (parent)**: Join `product_categories.parent_category_id = parent_category.category_id`.
          This is a self-referencing hierarchy. Use recursive queries to traverse the full category hierarchy.
          A category with NULL parent_category_id is a root category.
        
        
        ## Double-Counting Prevention
        
        **Critical: Order-Level vs Line-Level Metrics**
        
        When joining `orders` to `order_items`, order-level measures will be duplicated for each line item.
        
        **INCORRECT:**
        ```sql
        SELECT SUM(orders.total_amount)
        FROM orders
        JOIN order_items ON orders.order_id = order_items.order_id
        -- This will sum orders.total_amount multiple times per order
        ```
        
        **CORRECT for order-level revenue:**
        ```sql
        SELECT SUM(orders.total_amount)
        FROM orders
        -- No join to order_items
        ```
        
        **CORRECT for line-level revenue:**
        ```sql
        SELECT SUM(order_items.line_total)
        FROM order_items
        ```
        
        **CORRECT for product revenue (via order items):**
        ```sql
        SELECT 
            products.product_name,
            SUM(order_items.line_total) AS product_revenue
        FROM order_items
        JOIN products ON order_items.product_id = products.product_id
        GROUP BY products.product_name
        ```
        
        **When you need both order and line context:**
        
        Use line-level measures and aggregate appropriately, or use window functions to avoid duplication:
        
        ```sql
        SELECT 
            orders.order_id,
            orders.total_amount,
            SUM(order_items.line_total) AS sum_line_totals
        FROM orders
        JOIN order_items ON orders.order_id = order_items.order_id
        GROUP BY orders.order_id, orders.total_amount
        ```
        
        
        ## Time Analysis Guide
        
        **Order Analysis:**
        
        - Use `orders.order_date` for order placement time analysis.
        - Use `CAST(orders.order_date AS DATE)` to truncate to date grain for daily analysis.
        - Use Databricks date functions for period grouping:
          - `DATE_TRUNC('month', orders.order_date)` for monthly analysis
          - `DATE_TRUNC('quarter', orders.order_date)` for quarterly analysis
          - `DATE_TRUNC('year', orders.order_date)` for yearly analysis
        
        **Payment Analysis:**
        
        - Use `payments.paid_at` for payment completion time analysis.
        
        **Shipment Analysis:**
        
        - Use `shipments.shipped_at` for shipment departure time analysis.
        - Use `shipments.delivered_at` for delivery completion time analysis.
        - Calculate delivery time as `DATEDIFF(shipments.delivered_at, shipments.shipped_at)`.
        
        **Customer Analysis:**
        
        - Use `customers.registration_date` for customer acquisition time analysis.
        - Use `customers.date_of_birth` for age-based segmentation (PII - restricted access).
        
        **Product Analysis:**
        
        - Use `products.created_at` for product introduction time analysis.
        
        
        ## Hierarchical Queries
        
        **Product Category Hierarchy:**
        
        The `product_categories` table contains a self-referencing hierarchy via `parent_category_id`.
        
        To traverse the full hierarchy, use a recursive CTE in Databricks:
        
        ```sql
        WITH RECURSIVE category_hierarchy AS (
          -- Anchor: root categories
          SELECT 
            category_id,
            category_name,
            parent_category_id,
            category_name AS root_category,
            1 AS level
          FROM ecom_bronze.product_categories
          WHERE parent_category_id IS NULL
          
          UNION ALL
          
          -- Recursive: child categories
          SELECT 
            c.category_id,
            c.category_name,
            c.parent_category_id,
            h.root_category,
            h.level + 1 AS level
          FROM ecom_bronze.product_categories c
          JOIN category_hierarchy h ON c.parent_category_id = h.category_id
        )
        SELECT * FROM category_hierarchy
        ```
        
        Use this pattern to:
        - Roll up product sales to parent categories
        - Analyze category depth
        - Find all descendants of a category
        - Find the root category for any product
        
        
        ## Query Restrictions and Guidance
        
        **PII Fields:**
        
        The following fields contain personally identifiable information and may require access restrictions:
        
        - `customers.first_name`, `customers.last_name`, `customers.email`, `customers.phone`
        - `customers.gender`, `customers.date_of_birth`
        - `customers.city`, `customers.state`, `customers.country`, `customers.postal_code`
        - `orders.ship_city`, `orders.ship_state`, `orders.ship_postal_code`
        - `orders.tax_amount` (may be considered sensitive)
        - `products.cost_price` (business sensitive)
        - `payments.transaction_ref` (sensitive payment data)
        - `shipments.tracking_number`, `shipments.ship_city`, `shipments.ship_state`, `shipments.ship_postal_code`
        
        Use aggregated or anonymized versions of these fields for general analytics.
        
        **Currency Handling:**
        
        All monetary amounts in this model are denominated in the currency specified in the `currency` field.
        The sample data uses USD. When aggregating across multiple currencies, convert to a common currency
        using appropriate exchange rates before summing.
        
        **Active Records:**
        
        - Filter `customers.is_active = true` for active customer analysis.
        - Filter `products.is_active = true` for active product analysis.
        - Filter `product_categories.is_active = true` for active category analysis.
        
        **Order Status:**
        
        Use `orders.order_status` to filter orders by processing stage. Common values may include:
        Pending, Processing, Completed, Cancelled, Refunded.
        
        **Payment Status:**
        
        Use `payments.payment_status` to filter payments. For revenue recognition, typically filter to
        `payment_status = 'Settled'`.
        
        **Shipment Status:**
        
        Use `shipments.shipment_status` to filter shipments. Common values may include:
        Pending, In Transit, Delivered, Returned, Failed.
        
        **Metadata Fields:**
        
        The following fields are technical metadata and should not be used for business analysis:
        - `_source_system`: Source system identifier
        - `_batch_id`: ETL batch identifier
        - `_loaded_at`: ETL load timestamp
        
        These fields are useful for data lineage and ETL troubleshooting but not for business metrics.

    datasets:
      - name: customers
        business_name: Customers
        description: >-
          Customer master data containing one row per retail customer. This dataset provides customer
          demographic information, contact details, geographic location, customer segmentation, registration
          information, and account status. Use this dataset for customer-level analysis, customer counts,
          customer segmentation analysis, and customer attribution. The grain is one row per unique customer
          identified by customer_id.
        source: ecom_bronze.customers
        primary_key:
          - customer_id
        fields:
          - name: customer_id
            business_name: Customer Identifier
            description: Unique identifier for a retail customer. Primary key.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: customer_code
            business_name: Customer Code
            description: Business-assigned code used to reference the customer. Unique business identifier.
            sql_type: STRING
            constraints:
              - NOT NULL
              - UNIQUE
          
          - name: first_name
            business_name: First Name
            description: Given first name of the customer. PII field.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: last_name
            business_name: Last Name
            description: Family or last name of the customer. PII field.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: email
            business_name: Email
            description: Email address used to contact the customer. PII field.
            sql_type: STRING
            constraints:
              - NOT NULL
              - UNIQUE
          
          - name: phone
            business_name: Phone
            description: Primary phone number for contacting the customer. PII field.
            sql_type: STRING
          
          - name: gender
            business_name: Gender
            description: Gender designation reported for the customer. PII field.
            sql_type: STRING
          
          - name: date_of_birth
            business_name: Date Of Birth
            description: Date of birth of the customer. PII field. Can be used for age-based segmentation.
            sql_type: DATE
          
          - name: city
            business_name: City
            description: City of the customer's primary address. PII field. Dimension for geographic analysis.
            sql_type: STRING
            dimension:
              is_time: false
          
          - name: state
            business_name: State
            description: State or province of the customer's primary address. PII field. Dimension for geographic analysis.
            sql_type: STRING
            dimension:
              is_time: false
          
          - name: country
            business_name: Country
            description: Country of the customer's primary address. PII field. Dimension for geographic analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: postal_code
            business_name: Postal Code
            description: Postal or ZIP code of the customer's primary address. PII field.
            sql_type: STRING
          
          - name: customer_segment
            business_name: Customer Segment
            description: >-
              Segment or classification assigned to the customer for marketing or analysis.
              Examples may include: Loyal, New, VIP, At-Risk. Use as a dimension for customer segmentation analysis.
            sql_type: STRING
            dimension:
              is_time: false
          
          - name: registration_date
            business_name: Registration Date
            description: >-
              Date when the customer first registered or was created in the system.
              Use for customer acquisition time analysis and cohort analysis.
            sql_type: DATE
            dimension:
              is_time: true
          
          - name: is_active
            business_name: Is Active
            description: >-
              Indicates whether the customer account is currently active.
              Filter to true for active customer analysis.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
          
          - name: _source_system
            business_name: Source System
            description: Identifier of the upstream source system from which the customer record was loaded.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ingestion batch that loaded the customer record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp when the customer record was loaded into the retail data platform.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

      - name: orders
        business_name: Orders
        description: >-
          Order header data containing one row per customer order. This is the primary fact table for
          order-level analysis. Contains order identification, customer reference, order timing, order status,
          sales channel, shipping destination, and complete order financial summary including subtotal, discounts,
          taxes, shipping fees, and total amount. Use this dataset for order counts, order-level revenue analysis,
          average order value, order status analysis, sales channel analysis, and time-series order analysis.
          The grain is one row per unique order identified by order_id.
        source: ecom_bronze.orders
        primary_key:
          - order_id
        fields:
          - name: order_id
            business_name: Order Identifier
            description: Unique identifier for a customer order. Primary key.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: order_number
            business_name: Order Number
            description: Business order number assigned to the customer order. Unique business identifier.
            sql_type: STRING
            constraints:
              - NOT NULL
              - UNIQUE
          
          - name: customer_id
            business_name: Customer Identifier
            description: References the customer who placed the order. Foreign key to customers.customer_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: order_date
            business_name: Order Date
            description: >-
              Timestamp when the order was created in the retail system.
              Primary time dimension for order analysis. Use for order time-series analysis,
              daily/monthly/quarterly/yearly order aggregation, and order trend analysis.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: order_status
            business_name: Order Status
            description: >-
              Indicates the current processing status of the order.
              Examples: Pending, Processing, Completed, Cancelled, Refunded.
              Use as a dimension for order status analysis and filtering.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: sales_channel
            business_name: Sales Channel
            description: >-
              Channel through which the order was placed, such as online, store, or mobile.
              Use as a dimension for sales channel analysis and channel performance comparison.
            sql_type: STRING
            dimension:
              is_time: false
          
          - name: ship_city
            business_name: Ship City
            description: City where the order is being shipped. PII field.
            sql_type: STRING
          
          - name: ship_state
            business_name: Ship State
            description: State or province where the order is being shipped. PII field.
            sql_type: STRING
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: Postal or ZIP code for the shipping address of the order. PII field.
            sql_type: STRING
          
          - name: subtotal
            business_name: Subtotal
            description: >-
              Total merchandise amount for the order before discounts, taxes, and shipping.
              Measure for merchandise revenue analysis.
            sql_type: DECIMAL
            measure:
              aggregation: SUM
          
          - name: discount_amount
            business_name: Discount Amount
            description: >-
              Total monetary value of discounts applied to the order.
              Measure for discount analysis and promotional effectiveness.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: tax_amount
            business_name: Tax Amount
            description: >-
              Total tax amount applied to the order. PII/sensitive field.
              Measure for tax analysis.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: shipping_fee
            business_name: Shipping Fee
            description: >-
              Shipping charges applied to the order.
              Measure for shipping revenue and shipping cost analysis.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: total_amount
            business_name: Total Amount
            description: >-
              Grand total amount payable for the order after all adjustments.
              Primary measure for order-level revenue analysis. Represents complete order value
              including merchandise, discounts, taxes, and shipping.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: currency
            business_name: Currency
            description: >-
              Currency code used for monetary amounts on the order.
              Dimension for currency analysis. All amounts in the order are in this currency.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: _source_system
            business_name: Source System
            description: Identifier of the upstream source system from which the order record was loaded.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ingestion batch that loaded the order record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp when the order record was loaded into the retail data platform.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

      - name: order_items
        business_name: Order Items
        description: >-
          Order line item detail containing one row per order line item. This dataset provides product-level
          detail within orders including product reference, quantity ordered, unit pricing, line-level discounts,
          and line totals. Use this dataset for product-level revenue analysis, units sold analysis, product mix
          analysis, and detailed order composition analysis. An order may contain multiple order items.
          The grain is one row per unique order line item identified by order_item_id.
        source: ecom_bronze.order_items
        primary_key:
          - order_item_id
        fields:
          - name: order_item_id
            business_name: Order Item Identifier
            description: Unique identifier for an individual order line item. Primary key.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: order_id
            business_name: Order Identifier
            description: References the related customer order record for this line item. Foreign key to orders.order_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: line_number
            business_name: Line Number
            description: Sequential line number of the item within the order. Used for line ordering.
            sql_type: INT
            constraints:
              - NOT NULL
          
          - name: product_id
            business_name: Product Identifier
            description: References the product being purchased on this line item. Foreign key to products.product_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: quantity
            business_name: Quantity
            description: >-
              Number of units of the product ordered on this line item.
              Measure for units sold analysis and quantity analysis.
            sql_type: INT
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: unit_price
            business_name: Unit Price
            description: >-
              Selling price for a single unit of the product on this line item.
              Represents the price at the time of order. Use for pricing analysis and average selling price calculation.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
          
          - name: discount_pct
            business_name: Discount Pct
            description: >-
              Percentage discount applied to the line item.
              Use for discount analysis and promotional effectiveness at line level.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
          
          - name: line_total
            business_name: Line Total
            description: >-
              Total monetary amount for the line item after discounts.
              Primary measure for line-level revenue analysis and product revenue analysis.
              Derived as: quantity * unit_price * (1 - discount_pct / 100).
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: _source_system
            business_name: Source System
            description: Identifier of the upstream source system from which the order item record was loaded.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ingestion batch that loaded the order item record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp when the order item record was loaded into the retail data platform.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

      - name: products
        business_name: Products
        description: >-
          Product master data containing one row per product. This dataset provides product identification,
          product naming, category assignment, brand information, product description, pricing information,
          cost information, inventory levels, and product status. Use this dataset for product attributes,
          product pricing analysis, inventory analysis, and product categorization. The grain is one row per
          unique product identified by product_id.
        source: ecom_bronze.products
        primary_key:
          - product_id
        fields:
          - name: product_id
            business_name: Product Identifier
            description: Unique identifier for a product. Primary key.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: sku
            business_name: Sku
            description: Stock keeping unit code assigned to the product. Unique business identifier.
            sql_type: STRING
            constraints:
              - NOT NULL
              - UNIQUE
          
          - name: product_name
            business_name: Product Name
            description: Name of the product as shown to customers. Use for product identification and reporting.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: category_id
            business_name: Category Identifier
            description: References the category to which the product belongs. Foreign key to product_categories.category_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: brand
            business_name: Brand
            description: >-
              Brand name under which the product is sold.
              Use as a dimension for brand analysis and brand performance comparison.
            sql_type: STRING
            dimension:
              is_time: false
          
          - name: description
            business_name: Description
            description: Marketing description of the product.
            sql_type: STRING
          
          - name: unit_price
            business_name: Unit Price
            description: >-
              Standard selling price for a single unit of the product.
              Represents current list price. Use for current pricing analysis.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
          
          - name: cost_price
            business_name: Cost Price
            description: >-
              Cost of goods for a single unit of the product. Business sensitive / PII field.
              Use for margin analysis and profitability analysis. Restricted access.
            sql_type: DECIMAL
          
          - name: currency
            business_name: Currency
            description: Currency code used for product pricing. Dimension for currency analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: stock_quantity
            business_name: Stock Quantity
            description: >-
              Current quantity of the product available in inventory.
              Measure for inventory analysis and stock level monitoring.
            sql_type: INT
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: is_active
            business_name: Is Active
            description: >-
              Indicates whether the product is currently active and available for sale.
              Filter to true for active product analysis.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
          
          - name: created_at
            business_name: Created At
            description: >-
              Timestamp when the product record was first created.
              Use for product introduction time analysis and product age analysis.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: _source_system
            business_name: Source System
            description: Identifier of the upstream source system from which the product record was loaded.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ingestion batch that loaded the product record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp when the product record was loaded into the retail data platform.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

      - name: product_categories
        business_name: Product Categories
        description: >-
          Product category master data containing one row per product category. This dataset provides category
          identification, category naming, hierarchical parent-child relationships through self-reference, category
          descriptions, and category status. Supports hierarchical product categorization where categories can have
          parent categories, enabling multi-level category hierarchies. Use this dataset for product categorization,
          category hierarchy traversal, and category-level analysis. The grain is one row per unique category
          identified by category_id.
        source: ecom_bronze.product_categories
        primary_key:
          - category_id
        fields:
          - name: category_id
            business_name: Category Identifier
            description: Unique identifier for a product category. Primary key.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: category_name
            business_name: Category Name
            description: >-
              Name of the product category.
              Use as a dimension for category-level analysis and reporting.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: parent_category_id
            business_name: Parent Category Identifier
            description: >-
              References the parent category to which this category belongs.
              Self-referencing foreign key to product_categories.category_id.
              NULL indicates a root-level category. Use for hierarchical category traversal.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
          
          - name: description
            business_name: Description
            description: Text description of the product category.
            sql_type: STRING
          
          - name: is_active
            business_name: Is Active
            description: >-
              Indicates whether the product category is currently active and can be used.
              Filter to true for active category analysis.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
          
          - name: _source_system
            business_name: Source System
            description: Identifier of the upstream source system from which the product category record was loaded.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ingestion batch that loaded the product category record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp when the product category record was loaded into the retail data platform.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

      - name: payments
        business_name: Payments
        description: >-
          Payment transaction data containing one row per payment transaction. This dataset provides payment
          identification, order reference, payment method, payment status, payment amount, currency, payment
          gateway information, transaction reference, and payment timing. Use this dataset for payment analysis,
          payment method analysis, payment status tracking, and revenue recognition. Typically one payment per
          order but may support multiple payments or partial payments. The grain is one row per unique payment
          transaction identified by payment_id.
        source: ecom_bronze.payments
        primary_key:
          - payment_id
        fields:
          - name: payment_id
            business_name: Payment Identifier
            description: Unique identifier for a payment transaction. Primary key.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: order_id
            business_name: Order Identifier
            description: References the order to which the payment relates. Foreign key to orders.order_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: payment_method
            business_name: Payment Method
            description: >-
              Method used to make the payment, such as card, PayPal, or bank transfer.
              Use as a dimension for payment method analysis and payment method preference analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: payment_status
            business_name: Payment Status
            description: >-
              Indicates the processing status of the payment.
              Examples: Pending, Settled, Failed, Refunded.
              Use as a dimension for payment status analysis. Filter to 'Settled' for revenue recognition.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: amount
            business_name: Amount
            description: >-
              Monetary amount paid for the order.
              Measure for payment amount analysis and revenue recognition.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: currency
            business_name: Currency
            description: Currency code used for the payment amount. Dimension for currency analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: transaction_ref
            business_name: Transaction Ref
            description: >-
              Reference identifier provided by the payment gateway for the transaction.
              PII/sensitive field. Use for payment reconciliation and dispute resolution.
            sql_type: STRING
          
          - name: gateway
            business_name: Gateway
            description: >-
              Name of the payment gateway or processor handling the transaction.
              Use as a dimension for payment gateway analysis and gateway performance comparison.
            sql_type: STRING
            dimension:
              is_time: false
          
          - name: paid_at
            business_name: Paid At
            description: >-
              Timestamp when the payment was completed.
              Time dimension for payment timing analysis and payment time-series analysis.
            sql_type: TIMESTAMP
            dimension:
              is_time: true
          
          - name: _source_system
            business_name: Source System
            description: Identifier of the upstream source system from which the payment record was loaded.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ingestion batch that loaded the payment record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp when the payment record was loaded into the retail data platform.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

      - name: shipments
        business_name: Shipments
        description: >-
          Shipment data containing one row per shipment. This dataset provides shipment identification, order
          reference, carrier information, tracking information, shipment status, shipment timing (shipped and
          delivered timestamps), and shipping destination. Use this dataset for fulfillment analysis, delivery
          performance analysis, carrier analysis, and on-time delivery tracking. Typically one shipment per order.
          The grain is one row per unique shipment identified by shipment_id.
        source: ecom_bronze.shipments
        primary_key:
          - shipment_id
        fields:
          - name: shipment_id
            business_name: Shipment Identifier
            description: Unique identifier for a shipment. Primary key.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: order_id
            business_name: Order Identifier
            description: References the order that is being shipped. Foreign key to orders.order_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: carrier
            business_name: Carrier
            description: >-
              Name of the shipping carrier handling the shipment.
              Use as a dimension for carrier analysis and carrier performance comparison.
            sql_type: STRING
            dimension:
              is_time: false
          
          - name: tracking_number
            business_name: Tracking Number
            description: >-
              Tracking number assigned by the carrier for the shipment.
              PII/sensitive field. Use for shipment tracking and customer service.
            sql_type: STRING
          
          - name: shipment_status
            business_name: Shipment Status
            description: >-
              Indicates the current status of the shipment.
              Examples: Pending, In Transit, Delivered, Returned, Failed.
              Use as a dimension for shipment status analysis and filtering.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: shipped_at
            business_name: Shipped At
            description: >-
              Timestamp when the shipment left the warehouse or fulfillment center.
              Time dimension for shipment timing analysis and shipment time-series analysis.
            sql_type: TIMESTAMP
            dimension:
              is_time: true
          
          - name: delivered_at
            business_name: Delivered At
            description: >-
              Timestamp when the shipment was delivered to the customer.
              Time dimension for delivery timing analysis. Use with shipped_at to calculate delivery time.
            sql_type: TIMESTAMP
            dimension:
              is_time: true
          
          - name: ship_city
            business_name: Ship City
            description: City to which the shipment is being delivered. PII field.
            sql_type: STRING
          
          - name: ship_state
            business_name: Ship State
            description: State or province to which the shipment is being delivered. PII field.
            sql_type: STRING
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: Postal or ZIP code for the shipment destination address. PII field.
            sql_type: STRING
          
          - name: _source_system
            business_name: Source System
            description: Identifier of the upstream source system from which the shipment record was loaded.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ingestion batch that loaded the shipment record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp when the shipment record was loaded into the retail data platform.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

    relationships:
      - name: orders_to_customers
        left_dataset: orders
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship from orders to customers. Multiple orders can belong to the same customer.
          Join orders.customer_id = customers.customer_id to attribute orders to customers and access customer
          demographic and segmentation attributes. Use for customer-level order aggregation, customer lifetime value
          analysis, and customer behavior analysis.
      
      - name: order_items_to_orders
        left_dataset: order_items
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship from order_items to orders. Multiple order items (line items) belong to
          a single order. Join order_items.order_id = orders.order_id to access order-level context for line items
          including order date, customer, order status, and sales channel. IMPORTANT: When joining order_items to
          orders, do not sum order-level measures like orders.total_amount as they will be duplicated for each line
          item. Use order_items.line_total for line-level revenue or aggregate at order level first.
      
      - name: order_items_to_products
        left_dataset: order_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship from order_items to products. Multiple order items can reference the
          same product. Join order_items.product_id = products.product_id to access product attributes including
          product name, brand, category, current pricing, and inventory levels. Use for product-level sales analysis,
          product performance analysis, and product mix analysis.
      
      - name: products_to_product_categories
        left_dataset: products
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship from products to product_categories. Multiple products can belong to
          the same category. Join products.category_id = product_categories.category_id to access category attributes
          and enable category-level product analysis. Use for product categorization, category performance analysis,
          and category hierarchy traversal.
      
      - name: product_categories_hierarchy
        left_dataset: product_categories
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - parent_category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Self-referencing hierarchical relationship within product_categories. A category can have a parent category,
          creating a multi-level category hierarchy. Join child.parent_category_id = parent.category_id to traverse
          the hierarchy. Categories with NULL parent_category_id are root categories. Use recursive CTEs to traverse
          the full hierarchy for category rollup analysis, hierarchy depth analysis, and finding all descendants or
          ancestors of a category. This is a recursive relationship requiring recursive query patterns in Databricks.
      
      - name: payments_to_orders
        left_dataset: payments
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship from payments to orders. Typically one payment per order, but the model
          supports multiple payments or partial payments for the same order. Join payments.order_id = orders.order_id
          to access order context for payments including customer, order date, and order amount. Use for payment
          reconciliation, revenue recognition analysis, and payment method analysis by order characteristics.
      
      - name: shipments_to_orders
        left_dataset: shipments
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship from shipments to orders. Typically one shipment per order. Join
          shipments.order_id = orders.order_id to access order context for shipments including customer, order date,
          and order amount. Use for fulfillment analysis, delivery performance analysis, and correlating shipment
          timing with order timing.

    metrics:
      - name: total_revenue
        business_name: Total Revenue
        description: >-
          Total revenue from all orders including merchandise, taxes, and shipping fees.
          Calculated as the sum of orders.total_amount across all orders. This is the primary
          revenue metric representing complete order value. Use for overall revenue analysis,
          revenue trending, and revenue performance tracking.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(orders.total_amount) AS total_revenue
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.total_amount
      
      - name: total_orders
        business_name: Total Orders
        description: >-
          Total count of orders. Calculated as COUNT of orders.order_id.
          Use for order volume analysis and order count trending.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(orders.order_id) AS total_orders
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.order_id
      
      - name: average_order_value
        business_name: Average Order Value
        description: >-
          Average revenue per order. Calculated as total revenue divided by total order count.
          Represents the average amount spent per order. Use for order value analysis and
          customer spending behavior analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(orders.order_id) = 0 THEN 0
                        ELSE SUM(orders.total_amount) / COUNT(orders.order_id)
                    END AS average_order_value
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.total_amount
                - orders.order_id
      
      - name: total_units_sold
        business_name: Total Units Sold
        description: >-
          Total quantity of product units sold across all order items.
          Calculated as the sum of order_items.quantity. Use for volume analysis and
          inventory planning.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(order_items.quantity) AS total_units_sold
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.quantity
      
      - name: total_line_revenue
        business_name: Total Line Revenue
        description: >-
          Total revenue from all order line items after line-level discounts.
          Calculated as the sum of order_items.line_total. Use for product-level revenue
          analysis and line-level revenue trending. This represents merchandise revenue
          at the line item grain.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(order_items.line_total) AS total_line_revenue
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.line_total
      
      - name: total_discount_amount
        business_name: Total Discount Amount
        description: >-
          Total monetary value of discounts applied at the order level.
          Calculated as the sum of orders.discount_amount. Use for discount analysis,
          promotional effectiveness analysis, and margin impact analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(orders.discount_amount) AS total_discount_amount
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.discount_amount
      
      - name: total_shipping_revenue
        business_name: Total Shipping Revenue
        description: >-
          Total shipping fees collected from orders.
          Calculated as the sum of orders.shipping_fee. Use for shipping revenue analysis
          and shipping cost recovery analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(orders.shipping_fee) AS total_shipping_revenue
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.shipping_fee
      
      - name: total_tax_amount
        business_name: Total Tax Amount
        description: >-
          Total tax collected from orders.
          Calculated as the sum of orders.tax_amount. Use for tax reporting and analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(orders.tax_amount) AS total_tax_amount
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.tax_amount
      
      - name: total_customers
        business_name: Total Customers
        description: >-
          Total count of unique customers.
          Calculated as COUNT DISTINCT of customers.customer_id. Use for customer base
          size analysis and customer growth tracking.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(DISTINCT customers.customer_id) AS total_customers
                FROM ecom_bronze.customers AS customers
              columns_used:
                - customers.customer_id
      
      - name: active_customers
        business_name: Active Customers
        description: >-
          Count of customers with active accounts.
          Calculated as COUNT DISTINCT of customers.customer_id where is_active = true.
          Use for active customer base analysis.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(DISTINCT customers.customer_id) AS active_customers
                FROM ecom_bronze.customers AS customers
                WHERE customers.is_active = true
              columns_used:
                - customers.customer_id
                - customers.is_active
      
      - name: total_products
        business_name: Total Products
        description: >-
          Total count of unique products in the catalog.
          Calculated as COUNT DISTINCT of products.product_id. Use for product catalog
          size analysis.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(DISTINCT products.product_id) AS total_products
                FROM ecom_bronze.products AS products
              columns_used:
                - products.product_id
      
      - name: active_products
        business_name: Active Products
        description: >-
          Count of products that are currently active and available for sale.
          Calculated as COUNT DISTINCT of products.product_id where is_active = true.
          Use for active product catalog analysis.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(DISTINCT products.product_id) AS active_products
                FROM ecom_bronze.products AS products
                WHERE products.is_active = true
              columns_used:
                - products.product_id
                - products.is_active
      
      - name: revenue_by_customer
        business_name: Revenue by Customer
        description: >-
          Total revenue per customer. Calculated as sum of orders.total_amount grouped by customer.
          Result grain is one row per customer. Use for customer value analysis, customer segmentation,
          and identifying high-value customers.
        return_type: DECIMAL
        result_grain: one row per customer
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    customers.customer_id,
                    customers.customer_code,
                    CONCAT(customers.first_name, ' ', customers.last_name) AS customer_name,
                    SUM(orders.total_amount) AS revenue
                FROM ecom_bronze.orders AS orders
                JOIN ecom_bronze.customers AS customers
                    ON orders.customer_id = customers.customer_id
                GROUP BY
                    customers.customer_id,
                    customers.customer_code,
                    customers.first_name,
                    customers.last_name
              columns_used:
                - orders.customer_id
                - orders.total_amount
                - customers.customer_id
                - customers.customer_code
                - customers.first_name
                - customers.last_name
      
      - name: revenue_by_product
        business_name: Revenue by Product
        description: >-
          Total line revenue per product. Calculated as sum of order_items.line_total grouped by product.
          Result grain is one row per product. Use for product performance analysis, product ranking,
          and identifying top-selling products.
        return_type: DECIMAL
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    products.product_id,
                    products.sku,
                    products.product_name,
                    SUM(order_items.line_total) AS revenue
                FROM ecom_bronze.order_items AS order_items
                JOIN ecom_bronze.products AS products
                    ON order_items.product_id = products.product_id
                GROUP BY
                    products.product_id,
                    products.sku,
                    products.product_name
              columns_used:
                - order_items.product_id
                - order_items.line_total
                - products.product_id
                - products.sku
                - products.product_name
      
      - name: revenue_by_category
        business_name: Revenue by Category
        description: >-
          Total line revenue per product category. Calculated as sum of order_items.line_total
          grouped by product category. Result grain is one row per category. Use for category
          performance analysis and category mix analysis.
        return_type: DECIMAL
        result_grain: one row per category
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    product_categories.category_id,
                    product_categories.category_name,
                    SUM(order_items.line_total) AS revenue
                FROM ecom_bronze.order_items AS order_items
                JOIN ecom_bronze.products AS products
                    ON order_items.product_id = products.product_id
                JOIN ecom_bronze.product_categories AS product_categories
                    ON products.category_id = product_categories.category_id
                GROUP BY
                    product_categories.category_id,
                    product_categories.category_name
              columns_used:
                - order_items.product_id
                - order_items.line_total
                - products.product_id
                - products.category_id
                - product_categories.category_id
                - product_categories.category_name
      
      - name: revenue_by_sales_channel
        business_name: Revenue by Sales Channel
        description: >-
          Total revenue per sales channel. Calculated as sum of orders.total_amount grouped by
          sales channel. Result grain is one row per sales channel. Use for channel performance
          analysis and channel mix analysis.
        return_type: DECIMAL
        result_grain: one row per sales channel
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    orders.sales_channel,
                    SUM(orders.total_amount) AS revenue
                FROM ecom_bronze.orders AS orders
                WHERE orders.sales_channel IS NOT NULL
                GROUP BY orders.sales_channel
              columns_used:
                - orders.sales_channel
                - orders.total_amount
      
      - name: orders_by_status
        business_name: Orders by Status
        description: >-
          Count of orders per order status. Calculated as COUNT of orders.order_id grouped by
          order status. Result grain is one row per order status. Use for order status distribution
          analysis and order processing monitoring.
        return_type: INTEGER
        result_grain: one row per order status
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    orders.order_status,
                    COUNT(orders.order_id) AS order_count
                FROM ecom_bronze.orders AS orders
                GROUP BY orders.order_status
              columns_used:
                - orders.order_status
                - orders.order_id
      
      - name: monthly_revenue
        business_name: Monthly Revenue
        description: >-
          Total revenue per month. Calculated as sum of orders.total_amount grouped by month
          of order_date. Result grain is one row per month. Use for revenue trending, seasonality
          analysis, and month-over-month growth analysis.
        return_type: DECIMAL
        result_grain: one row per month
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    DATE_TRUNC('month', orders.order_date) AS order_month,
                    SUM(orders.total_amount) AS revenue
                FROM ecom_bronze.orders AS orders
                GROUP BY DATE_TRUNC('month', orders.order_date)
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.total_amount
      
      - name: daily_revenue
        business_name: Daily Revenue
        description: >-
          Total revenue per day. Calculated as sum of orders.total_amount grouped by date
          of order_date. Result grain is one row per day. Use for daily revenue tracking,
          day-over-day analysis, and daily performance monitoring.
        return_type: DECIMAL
        result_grain: one row per day
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    CAST(orders.order_date AS DATE) AS order_date,
                    SUM(orders.total_amount) AS revenue
                FROM ecom_bronze.orders AS orders
                GROUP BY CAST(orders.order_date AS DATE)
                ORDER BY order_date
              columns_used:
                - orders.order_date
                - orders.total_amount
      
      - name: average_delivery_time_days
        business_name: Average Delivery Time (Days)
        description: >-
          Average number of days between shipment and delivery. Calculated as the average
          of DATEDIFF(delivered_at, shipped_at) for delivered shipments. Use for delivery
          performance analysis and carrier performance comparison.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    AVG(DATEDIFF(shipments.delivered_at, shipments.shipped_at)) AS avg_delivery_days
                FROM ecom_bronze.shipments AS shipments
                WHERE shipments.delivered_at IS NOT NULL
                    AND shipments.shipped_at IS NOT NULL
              columns_used:
                - shipments.delivered_at
                - shipments.shipped_at
      
      - name: total_shipments
        business_name: Total Shipments
        description: >-
          Total count of shipments. Calculated as COUNT of shipments.shipment_id.
          Use for shipment volume analysis and fulfillment tracking.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(shipments.shipment_id) AS total_shipments
                FROM ecom_bronze.shipments AS shipments
              columns_used:
                - shipments.shipment_id
      
      - name: delivered_shipments
        business_name: Delivered Shipments
        description: >-
          Count of shipments that have been delivered. Calculated as COUNT of shipments.shipment_id
          where shipment_status = 'Delivered'. Use for delivery completion tracking.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(shipments.shipment_id) AS delivered_shipments
                FROM ecom_bronze.shipments AS shipments
                WHERE shipments.shipment_status = 'Delivered'
              columns_used:
                - shipments.shipment_id
                - shipments.shipment_status
      
      - name: shipments_by_carrier
        business_name: Shipments by Carrier
        description: >-
          Count of shipments per carrier. Calculated as COUNT of shipments.shipment_id grouped
          by carrier. Result grain is one row per carrier. Use for carrier volume analysis and
          carrier selection optimization.
        return_type: INTEGER
        result_grain: one row per carrier
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    shipments.carrier,
                    COUNT(shipments.shipment_id) AS shipment_count
                FROM ecom_bronze.shipments AS shipments
                WHERE shipments.carrier IS NOT NULL
                GROUP BY shipments.carrier
              columns_used:
                - shipments.carrier
                - shipments.shipment_id
      
      - name: total_payments
        business_name: Total Payments
        description: >-
          Total count of payment transactions. Calculated as COUNT of payments.payment_id.
          Use for payment transaction volume analysis.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(payments.payment_id) AS total_payments
                FROM ecom_bronze.payments AS payments
              columns_used:
                - payments.payment_id
      
      - name: settled_payment_amount
        business_name: Settled Payment Amount
        description: >-
          Total amount of settled payments. Calculated as sum of payments.amount where
          payment_status = 'Settled'. Use for revenue recognition and cash flow analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(payments.amount) AS settled_payment_amount
                FROM ecom_bronze.payments AS payments
                WHERE payments.payment_status = 'Settled'
              columns_used:
                - payments.amount
                - payments.payment_status
      
      - name: payments_by_method
        business_name: Payments by Method
        description: >-
          Count of payments per payment method. Calculated as COUNT of payments.payment_id
          grouped by payment method. Result grain is one row per payment method. Use for
          payment method preference analysis and payment method mix analysis.
        return_type: INTEGER
        result_grain: one row per payment method
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    payments.payment_method,
                    COUNT(payments.payment_id) AS payment_count
                FROM ecom_bronze.payments AS payments
                GROUP BY payments.payment_method
              columns_used:
                - payments.payment_method
                - payments.payment_id
      
      - name: revenue_by_customer_segment
        business_name: Revenue by Customer Segment
        description: >-
          Total revenue per customer segment. Calculated as sum of orders.total_amount grouped
          by customer segment. Result grain is one row per customer segment. Use for customer
          segment performance analysis and segment value comparison.
        return_type: DECIMAL
        result_grain: one row per customer segment
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    customers.customer_segment,
                    SUM(orders.total_amount) AS revenue
                FROM ecom_bronze.orders AS orders
                JOIN ecom_bronze.customers AS customers
                    ON orders.customer_id = customers.customer_id
                WHERE customers.customer_segment IS NOT NULL
                GROUP BY customers.customer_segment
              columns_used:
                - orders.customer_id
                - orders.total_amount
                - customers.customer_id
                - customers.customer_segment
      
      - name: orders_per_customer
        business_name: Orders per Customer
        description: >-
          Average number of orders per customer. Calculated as total order count divided by
          total customer count. Use for customer engagement analysis and repeat purchase behavior.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT orders.customer_id) = 0 THEN 0
                        ELSE CAST(COUNT(orders.order_id) AS DECIMAL) / COUNT(DISTINCT orders.customer_id)
                    END AS orders_per_customer
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.order_id
                - orders.customer_id
      
      - name: average_units_per_order
        business_name: Average Units per Order
        description: >-
          Average number of product units per order. Calculated as total units sold divided by
          total order count. Use for order size analysis and basket size tracking.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT order_items.order_id) = 0 THEN 0
                        ELSE CAST(SUM(order_items.quantity) AS DECIMAL) / COUNT(DISTINCT order_items.order_id)
                    END AS avg_units_per_order
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.quantity
                - order_items.order_id
      
      - name: total_inventory_value
        business_name: Total Inventory Value
        description: >-
          Total value of current inventory at unit price. Calculated as sum of
          (products.stock_quantity * products.unit_price) for active products.
          Use for inventory valuation and working capital analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(products.stock_quantity * products.unit_price) AS total_inventory_value
                FROM ecom_bronze.products AS products
                WHERE products.is_active = true
              columns_used:
                - products.stock_quantity
                - products.unit_price
                - products.is_active