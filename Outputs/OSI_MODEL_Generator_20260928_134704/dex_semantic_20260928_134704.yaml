      - name: modifications_by_month
        business_name: Modifications by Month
        description: >-
          Count of modification records grouped by creation month. This time-series metric shows
          modification creation volume over time. Use this for trend analysis and capacity planning.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('month', mod_record.created_date) AS month,
                    COUNT(DISTINCT mod_record.mod_id) AS modifications_by_month
                FROM transformed.mod_record AS mod_record
                GROUP BY DATE_TRUNC('month', mod_record.created_date)
                ORDER BY month
              columns_used:
                - mod_record.created_date
                - mod_record.mod_id
      
      - name: tasks_by_month
        business_name: Tasks by Month
        description: >-
          Count of task records grouped by creation month. This time-series metric shows task creation
          volume over time. Use this for workload trend analysis and resource planning.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('month', task_record.created_date) AS month,
                    COUNT(DISTINCT task_record.task_id) AS tasks_by_month
                FROM transformed.task_record AS task_record
                GROUP BY DATE_TRUNC('month', task_record.created_date)
                ORDER BY month
              columns_used:
                - task_record.created_date
                - task_record.task_id
      
      - name: audit_events_by_day
        business_name: Audit Events by Day
        description: >-
          Count of audit event records grouped by event day. This time-series metric shows daily
          audit activity volume. Use this for audit trail monitoring and anomaly detection.
        return_type: integer
        result_grain: one row per day
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('day', audit_event.event_ts) AS day,
                    COUNT(DISTINCT audit_event.audit_id) AS audit_events_by_day
                FROM transformed.audit_event AS audit_event
                GROUP BY DATE_TRUNC('day', audit_event.event_ts)
                ORDER BY day
              columns_used:
                - audit_event.event_ts
                - audit_event.audit_id
      
      - name: modification_count_by_approval_status
        business_name: Modification Count by Approval Status
        description: >-
          Count of modification records grouped by approval status. This metric shows the distribution
          of modifications across approval workflow stages. Use this for workflow bottleneck analysis.
        return_type: integer
        result_grain: one row per approval status
        expression:
          dialects:
