              expression: |
                SELECT
                    COUNT(DISTINCT task_record.task_id) AS draft_tasks
                FROM transformed.task_record AS task_record
                WHERE task_record.status = 'Draft'
              columns_used:
                - task_record.task_id
                - task_record.status
      
      - name: tasks_per_modification
        business_name: Tasks per Modification
        description: >-
          Average number of task records per modification. Calculated as the ratio of total tasks
