                FROM transformed.audit_event AS audit_event
                GROUP BY audit_event.action
                ORDER BY audit_event_count DESC
              columns_used:
                - audit_event.action
                - audit_event.audit_id
      
      - name: modifications_with_most_impacts
        business_name: Modifications with Most Impacts
        description: >-
          Modification records ranked by impact count. This metric identifies modifications with the
          highest number of associated impact assessments. Use this to identify complex modifications
          requiring elevated attention.
        return_type: integer
        result_grain: one row per modification
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    mod_record.mod_id,
                    mod_record.mod_ref,
                    mod_record.title,
                    COUNT(DISTINCT impact_record.impact_id) AS impact_count
                FROM transformed.mod_record AS mod_record
                LEFT JOIN transformed.impact_record AS impact_record
                    ON mod_record.mod_id = impact_record.mod_id
                GROUP BY mod_record.mod_id, mod_record.mod_ref, mod_record.title
                ORDER BY impact_count DESC
              columns_used:
                - mod_record.mod_id
                - mod_record.mod_ref
                - mod_record.title
                - impact_record.impact_id
      
      - name: modifications_with_most_tasks
        business_name: Modifications with Most Tasks
        description: >-
          Modification records ranked by task count. This metric identifies modifications with the
          highest number of associated tasks. Use this to identify complex modifications requiring
          significant execution effort.
        return_type: integer
        result_grain: one row per modification
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    mod_record.mod_id,
                    mod_record.mod_ref,
                    mod_record.title,
                    COUNT(DISTINCT task_record.task_id) AS task_count
                FROM transformed.mod_record AS mod_record
                LEFT JOIN transformed.task_record AS task_record
                    ON mod_record.mod_id = task_record.mod_id
                GROUP BY mod_record.mod_id, mod_record.mod_ref, mod_record.title
                ORDER BY task_count DESC
              columns_used:
                - mod_record.mod_id
                - mod_record.mod_ref
                - mod_record.title
                - task_record.task_id
      
      - name: baseline_sections_with_most_impacts
        business_name: Baseline Sections with Most Impacts
        description: >-
          Baseline section records ranked by impact count. This metric identifies baseline sections
          that are most frequently impacted by modifications. Use this to identify high-change baseline
          requirements requiring stability analysis.
        return_type: integer
        result_grain: one row per baseline section
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    baseline_record.baseline_id,
                    baseline_record.section_ref,
                    baseline_record.title,
                    baseline_record.sensitivity,
                    COUNT(DISTINCT impact_record.impact_id) AS impact_count
                FROM transformed.baseline_record AS baseline_record
                LEFT JOIN transformed.impact_record AS impact_record
                    ON baseline_record.section_ref = impact_record.baseline_ref
                GROUP BY baseline_record.baseline_id, baseline_record.section_ref, baseline_record.title, baseline_record.sensitivity
                ORDER BY impact_count DESC
              columns_used:
                - baseline_record.baseline_id
                - baseline_record.section_ref
                - baseline_record.title
                - baseline_record.sensitivity
                - impact_record.impact_id
