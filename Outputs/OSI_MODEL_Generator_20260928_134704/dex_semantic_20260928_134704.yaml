                            / NULLIF(COUNT(DISTINCT mod_record.mod_id), 0)
                    END AS tasks_per_modification
                FROM transformed.mod_record AS mod_record
                LEFT JOIN transformed.task_record AS task_record
                    ON mod_record.mod_id = task_record.mod_id
              columns_used:
                - mod_record.mod_id
                - task_record.task_id
      
      - name: total_audit_events
        business_name: Total Audit Events
        description: >-
          Total count of audit event records. This metric counts all audit events regardless of action type.
          Use this for overall audit activity volume analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(DISTINCT audit_event.audit_id) AS total_audit_events
                FROM transformed.audit_event AS audit_event
              columns_used:
                - audit_event.audit_id
      
      - name: total_baseline_sections
        business_name: Total Baseline Sections
        description: >-
          Total count of baseline section records. This metric counts all baseline sections regardless
