      - name: modifications_created_by_month
        business_name: Modifications Created by Month
        description: >-
          Count of modifications grouped by creation month. This metric provides a time-series
          view of modification creation activity. Result grain is one row per month.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    YEAR(mod_record.created_date) AS creation_year,
                    MONTH(mod_record.created_date) AS creation_month,
                    COUNT(mod_record.mod_id) AS modification_count
                FROM staging.mod_record AS mod_record
                GROUP BY YEAR(mod_record.created_date), MONTH(mod_record.created_date)
                ORDER BY creation_year, creation_month
              columns_used:
                - mod_record.mod_id
                - mod_record.created_date
      
      - name: tasks_created_by_month
        business_name: Tasks Created by Month
        description: >-
          Count of tasks grouped by creation month. This metric provides a time-series view
          of task creation activity. Result grain is one row per month.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    YEAR(task_record.created_date) AS creation_year,
                    MONTH(task_record.created_date) AS creation_month,
                    COUNT(task_record.task_id) AS task_count
                FROM staging.task_record AS task_record
                GROUP BY YEAR(task_record.created_date), MONTH(task_record.created_date)
                ORDER BY creation_year, creation_month
              columns_used:
                - task_record.task_id
                - task_record.created_date
      
      - name: audit_events_by_month
        business_name: Audit Events by Month
        description: >-
          Count of audit events grouped by event month. This metric provides a time-series
          view of audit event activity. Result grain is one row per month.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    YEAR(audit_event.event_ts) AS event_year,
                    MONTH(audit_event.event_ts) AS event_month,
                    COUNT(audit_event.audit_id) AS event_count
                FROM staging.audit_event AS audit_event
                GROUP BY YEAR(audit_event.event_ts), MONTH(audit_event.event_ts)
                ORDER BY event_year, event_month
              columns_used:
                - audit_event.audit_id
                - audit_event.event_ts
