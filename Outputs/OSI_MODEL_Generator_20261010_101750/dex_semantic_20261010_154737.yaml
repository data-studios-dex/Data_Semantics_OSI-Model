      - name: total_audit_events
        business_name: Total Audit Events
        description: >-
          Total count of audit event records in the system. This metric counts all audit events
          for compliance and traceability analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    COUNT(audit_event.audit_id) AS total_audit_events
