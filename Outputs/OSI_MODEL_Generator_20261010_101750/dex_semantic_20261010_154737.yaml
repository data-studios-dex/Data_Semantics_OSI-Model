      - name: tasks_per_modification
        business_name: Tasks per Modification
        description: >-
          Average number of tasks per modification. Calculated as total tasks divided by total
          modifications. Returns 0 if no modifications exist. This metric measures the average
          work complexity per modification.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT mod_record.mod_id) = 0 THEN 0
                        ELSE
                            CAST(COUNT(task_record.task_id) AS DECIMAL(18,2))
                            / CAST(COUNT(DISTINCT mod_record.mod_id) AS DECIMAL(18,2))
                    END AS tasks_per_modification
                FROM staging.mod_record AS mod_record
                LEFT JOIN staging.task_record AS task_record
                    ON mod_record.mod_id = task_record.mod_id
              columns_used:
                - mod_record.mod_id
                - task_record.task_id
      
      - name: subtasks_per_task
        business_name: Subtasks per Task
        description: >-
          Average number of subtasks per task. Calculated as total subtasks divided by total
          tasks. Returns 0 if no tasks exist. This metric measures the average granularity of
          task breakdown.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT task_record.task_id) = 0 THEN 0
                        ELSE
                            CAST(COUNT(subtask.subtask_id) AS DECIMAL(18,2))
                            / CAST(COUNT(DISTINCT task_record.task_id) AS DECIMAL(18,2))
                    END AS subtasks_per_task
                FROM staging.task_record AS task_record
                LEFT JOIN staging.subtask AS subtask
                    ON task_record.task_id = subtask.task_id
              columns_used:
                - task_record.task_id
                - subtask.subtask_id
      
      - name: completion_gates_per_task
        business_name: Completion Gates per Task
        description: >-
          Average number of completion gates per task. Calculated as total completion gates
          divided by total tasks. Returns 0 if no tasks exist. This metric measures the average
          number of quality checkpoints per task.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT task_record.task_id) = 0 THEN 0
                        ELSE
                            CAST(COUNT(completion_gate.gate_id) AS DECIMAL(18,2))
                            / CAST(COUNT(DISTINCT task_record.task_id) AS DECIMAL(18,2))
                    END AS completion_gates_per_task
                FROM staging.task_record AS task_record
                LEFT JOIN staging.completion_gate AS completion_gate
                    ON task_record.task_id = completion_gate.task_id
              columns_used:
                - task_record.task_id
                - completion_gate.gate_id
      
      - name: impact_records_per_modification
        business_name: Impact Records per Modification
        description: >-
