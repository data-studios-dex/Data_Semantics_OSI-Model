                - products.is_active
      
      - name: total_stock_quantity
        business_name: Total Stock Quantity
        description: >-
          Total inventory quantity across all products. Calculated as the sum of product stock quantities.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
