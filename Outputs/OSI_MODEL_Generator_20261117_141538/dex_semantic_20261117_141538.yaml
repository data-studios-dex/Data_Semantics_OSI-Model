version: "1.0"

semantic_model:
  - name: ecommerce_retail_analytics
    description: >-
      Comprehensive semantic model for retail e-commerce analytics covering customers, orders, 
      order items, products, product categories, payments, and shipments. This model supports 
      revenue analysis, customer behavior analysis, product performance analysis, fulfillment 
      analytics, and payment transaction analysis across the retail business domain.
    
    ai_context:
      instructions: >-
        ## Dataset Grain and Analytical Context
        
        
        **CUSTOMERS** - One row per customer. Contains customer demographic and registration information.
        Use customer_id as the primary identifier. Customer segment analysis should be performed at this grain.
        
        
        **ORDERS** - One row per order. Contains order header information including totals, dates, status, and shipping address.
        Use order_id as the primary identifier. Order-level revenue metrics (subtotal, discount_amount, tax_amount, 
        shipping_fee, total_amount) should be used at order grain only.
        
        
        **ORDER_ITEMS** - One row per order line item. Contains product-level order details including quantity, 
        unit price, discount, and line total. Use order_item_id as the primary identifier. Product-level revenue 
        analysis must use order_items.line_total, not orders.total_amount.
        
        
        **PRODUCTS** - One row per product. Contains product master data including SKU, name, category, brand, 
        pricing, and inventory. Use product_id as the primary identifier.
        
        
        **PRODUCT_CATEGORIES** - One row per product category. Contains category hierarchy with self-referencing 
        parent_category_id enabling recursive category tree traversal. Use category_id as the primary identifier.
        
        
        **PAYMENTS** - One row per payment transaction. Contains payment method, status, amount, gateway, and 
        transaction reference. Use payment_id as the primary identifier. Payment amounts should be analyzed at 
        payment transaction grain.
        
        
        **SHIPMENTS** - One row per shipment. Contains shipment tracking, carrier, status, and delivery timestamps.
        Use shipment_id as the primary identifier. Shipment-level fulfillment metrics should be analyzed at this grain.
        
        
        ## Critical Join Guidance
        
        
        **Customer to Orders**: Join customers.customer_id = orders.customer_id (one-to-many). 
        A customer can have multiple orders.
        
        
        **Orders to Order Items**: Join orders.order_id = order_items.order_id (one-to-many). 
        An order contains multiple line items.
        
        
        **Order Items to Products**: Join order_items.product_id = products.product_id (many-to-one). 
        Multiple order items can reference the same product.
        
        
        **Products to Product Categories**: Join products.category_id = product_categories.category_id (many-to-one). 
        Multiple products belong to the same category.
        
        
        **Product Categories Hierarchy**: Join product_categories.parent_category_id = product_categories.category_id 
        (self-referencing). This enables recursive category hierarchy traversal.
        
        
        **Orders to Payments**: Join orders.order_id = payments.order_id (one-to-many). 
        An order may have multiple payment transactions (partial payments, refunds).
        
        
        **Orders to Shipments**: Join orders.order_id = shipments.order_id (one-to-many). 
        An order may have multiple shipments (split shipments).
        
        
        ## Double-Counting Prevention
        
        
        **CRITICAL**: When joining ORDERS to ORDER_ITEMS, do NOT sum order-level measures after the join.
        
        
        - Use **orders.total_amount** for order-level revenue analysis (without joining to order_items)
        - Use **orders.subtotal** for order-level subtotal analysis (without joining to order_items)
        - Use **orders.discount_amount** for order-level discount analysis (without joining to order_items)
        - Use **orders.tax_amount** for order-level tax analysis (without joining to order_items)
        - Use **orders.shipping_fee** for order-level shipping analysis (without joining to order_items)
        
        
        - Use **order_items.line_total** for product-level or line-item-level revenue analysis
        - Use **order_items.quantity** for product-level quantity analysis
        - Use **order_items.unit_price** for product-level pricing analysis
        
        
        If you need both order-level and line-level metrics in the same query, use window functions or 
        subqueries to prevent duplication of order-level amounts.
        
        
        **CRITICAL**: When joining ORDERS to PAYMENTS, do NOT sum orders.total_amount after the join if 
        multiple payments exist per order. Use payments.amount for payment transaction analysis.
        
        
        **CRITICAL**: When joining ORDERS to SHIPMENTS, do NOT sum orders.total_amount after the join if 
        multiple shipments exist per order.
        
        
        ## Time-Based Analysis Guidance
        
        
        **Order Analysis by Time**: Use **orders.order_date** for order placement time analysis, revenue trends, 
        and period-over-period comparisons.
        
        
        **Customer Registration Analysis**: Use **customers.registration_date** for customer acquisition analysis 
        and cohort analysis.
        
        
        **Payment Analysis by Time**: Use **payments.paid_at** for payment transaction time analysis and 
        cash flow analysis.
        
        
        **Shipment Analysis by Time**: Use **shipments.shipped_at** for shipment fulfillment time analysis and 
        **shipments.delivered_at** for delivery performance analysis.
        
        
        **Product Creation Analysis**: Use **products.created_at** for product launch and catalog expansion analysis.
        
        
        ## Metric Selection Guidance
        
        
        **Revenue Metrics**:
        - Total Order Revenue → SUM(orders.total_amount) at order grain
        - Total Line Revenue → SUM(order_items.line_total) at order item grain
        - Subtotal Revenue → SUM(orders.subtotal) at order grain
        - Payment Revenue → SUM(payments.amount) at payment grain
        
        
        **Cost and Profit Metrics**:
        - Product Cost → products.cost_price (unit cost)
        - Line Cost → order_items.quantity * products.cost_price (requires join)
        - Gross Profit → Revenue - Cost (grain-dependent)
        
        
        **Discount Metrics**:
        - Order Discount → SUM(orders.discount_amount) at order grain
        - Line Discount → order_items.quantity * order_items.unit_price * (order_items.discount_pct / 100) at line grain
        
        
        **Quantity Metrics**:
        - Units Sold → SUM(order_items.quantity) at order item grain
        - Stock Quantity → SUM(products.stock_quantity) at product grain
        
        
        **Count Metrics**:
        - Order Count → COUNT(DISTINCT orders.order_id)
        - Customer Count → COUNT(DISTINCT customers.customer_id)
        - Product Count → COUNT(DISTINCT products.product_id)
        - Payment Count → COUNT(DISTINCT payments.payment_id)
        - Shipment Count → COUNT(DISTINCT shipments.shipment_id)
        
        
        ## Hierarchical Relationship Guidance
        
        
        **Product Category Hierarchy**: The product_categories table contains a self-referencing hierarchy via 
        parent_category_id. To traverse the complete category tree, use recursive CTEs:
        
        
        ```sql
        WITH RECURSIVE category_hierarchy AS (
          SELECT 
            category_id,
            category_name,
            parent_category_id,
            0 AS level,
            CAST(category_name AS STRING) AS path
          FROM ecom_bronze.product_categories
          WHERE parent_category_id IS NULL
          
          UNION ALL
          
          SELECT 
            c.category_id,
            c.category_name,
            c.parent_category_id,
            ch.level + 1,
            CONCAT(ch.path, ' > ', c.category_name)
          FROM ecom_bronze.product_categories c
          INNER JOIN category_hierarchy ch ON c.parent_category_id = ch.category_id
        )
        SELECT * FROM category_hierarchy
        ```
        
        
        ## Status and Segment Analysis Guidance
        
        
        **Order Status**: Use orders.order_status to filter or segment orders by processing state 
        (e.g., Completed, Pending, Cancelled).
        
        
        **Payment Status**: Use payments.payment_status to analyze payment transaction outcomes 
        (e.g., Captured, Failed, Refunded).
        
        
        **Shipment Status**: Use shipments.shipment_status to analyze fulfillment progress 
        (e.g., In Transit, Delivered, Returned).
        
        
        **Customer Segment**: Use customers.customer_segment to analyze customer value tiers 
        (e.g., Premium, Standard, Basic).
        
        
        **Active Status**: Use customers.is_active, products.is_active, and product_categories.is_active 
        to filter active records.
        
        
        ## Channel and Method Analysis Guidance
        
        
        **Sales Channel**: Use orders.sales_channel to analyze revenue by channel (e.g., Online, Marketplace, Retail).
        
        
        **Payment Method**: Use payments.payment_method to analyze payment preferences 
        (e.g., Credit Card, PayPal, Bank Transfer).
        
        
        **Carrier**: Use shipments.carrier to analyze shipment distribution by carrier (e.g., UPS, FedEx, USPS).
        
        
        ## Geographic Analysis Guidance
        
        
        **Customer Geography**: Use customers.city, customers.state, customers.country for customer location analysis.
        
        
        **Order Shipping Geography**: Use orders.ship_city, orders.ship_state for order destination analysis.
        
        
        **Shipment Geography**: Use shipments.ship_city, shipments.ship_state for shipment destination analysis.
        
        
        ## Currency Handling
        
        
        All monetary amounts in orders, order_items, products, and payments use the currency field. 
        The sample data shows USD. For multi-currency analysis, always group or filter by currency 
        to avoid mixing currencies in aggregations.
        
        
        ## Query Restrictions and Limitations
        
        
        - PII fields are marked and should be handled according to data governance policies
        - Cost price (products.cost_price) is sensitive and may have restricted access
        - Payment transaction references and tracking numbers are sensitive identifiers
        - Always respect the grain differences between orders and order_items when aggregating
        - When calculating delivery delays, handle NULL delivered_at values appropriately
        - When analyzing payment amounts vs order amounts, account for partial payments and refunds

    datasets:
      - name: customers
        business_name: Customers
        description: >-
          Customer master data containing one row per customer. Includes customer demographics, 
          contact information, geographic location, customer segment classification, registration date, 
          and active status. This dataset represents the analytical grain of one row per unique customer 
          and serves as the primary dimension for customer-centric analysis.
        source: ecom_bronze.customers
        primary_key:
          - customer_id
        fields:
          - name: customer_id
            business_name: Customer Identifier
            description: >-
              Unique identifier for a customer. Primary key for the customers dataset.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: customer_code
            business_name: Customer Code
            description: >-
              Business-assigned code used to reference the customer in source systems. 
              Unique business identifier.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
              - UNIQUE
          
          - name: first_name
            business_name: First Name
            description: >-
              Given name of the customer. PII field.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: last_name
            business_name: Last Name
            description: >-
              Family or surname of the customer. PII field.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: email
            business_name: Email
            description: >-
              Email address used to contact the customer. PII field. Unique constraint ensures 
              one email per customer.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
              - UNIQUE
          
          - name: phone
            business_name: Phone
            description: >-
              Primary phone number for contacting the customer. PII field.
            sql_type: STRING(255)
          
          - name: gender
            business_name: Gender
            description: >-
              Indicates the gender of the customer as recorded in the source system. PII field. 
              Categorical dimension for demographic analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: date_of_birth
            business_name: Date Of Birth
            description: >-
              Date of birth of the customer. PII field. Can be used to derive age-based segments.
            sql_type: DATE
          
          - name: city
            business_name: City
            description: >-
              City where the customer resides. PII field. Geographic dimension for location-based analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: state
            business_name: State
            description: >-
              State or province where the customer resides. PII field. Geographic dimension for 
              regional analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: country
            business_name: Country
            description: >-
              Country where the customer resides. PII field. Geographic dimension for country-level analysis.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: postal_code
            business_name: Postal Code
            description: >-
              Postal or ZIP code of the customer address. PII field.
            sql_type: STRING(255)
          
          - name: customer_segment
            business_name: Customer Segment
            description: >-
              Segment classification assigned to the customer based on behavior or value. 
              Categorical dimension for customer segmentation analysis (e.g., Premium, Standard, Basic).
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: registration_date
            business_name: Registration Date
            description: >-
              Date when the customer registered or was first created in the system. 
              Time dimension for customer acquisition and cohort analysis.
            sql_type: DATE
            dimension:
              is_time: true
          
          - name: is_active
            business_name: Is Active
            description: >-
              Indicates whether the customer account is currently active. Boolean dimension for 
              filtering active vs inactive customers.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: >-
              Identifier of the source system from which the customer record was loaded.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ingestion batch that loaded the customer record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp when the customer record was loaded into the data platform.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: orders
        business_name: Orders
        description: >-
          Order header data containing one row per order. Includes order identification, customer reference, 
          order date, status, sales channel, shipping address, and order-level financial totals including 
          subtotal, discount, tax, shipping fee, and total amount. This dataset represents the analytical 
          grain of one row per unique order and serves as the primary fact table for order-level revenue analysis.
        source: ecom_bronze.orders
        primary_key:
          - order_id
        fields:
          - name: order_id
            business_name: Order Identifier
            description: >-
              Unique identifier for a customer order. Primary key for the orders dataset.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: order_number
            business_name: Order Number
            description: >-
              Business order reference number visible to customers and operations. Unique business identifier.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
              - UNIQUE
          
          - name: customer_id
            business_name: Customer Identifier
            description: >-
              References the related customer record that placed the order. Foreign key to customers.customer_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: order_date
            business_name: Order Date
            description: >-
              Timestamp recording when the order was placed. Primary time dimension for order and revenue 
              time-series analysis.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: order_status
            business_name: Order Status
            description: >-
              Indicates the current processing status of the order (e.g., Completed, Pending, Cancelled). 
              Categorical dimension for order status analysis.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: sales_channel
            business_name: Sales Channel
            description: >-
              Channel through which the order was placed, such as online store or marketplace. 
              Categorical dimension for channel analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: ship_city
            business_name: Ship City
            description: >-
              City portion of the shipping address for the order. PII field. Geographic dimension.
            sql_type: STRING(255)
          
          - name: ship_state
            business_name: Ship State
            description: >-
              State or province portion of the shipping address for the order. PII field. Geographic dimension.
            sql_type: STRING(255)
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: >-
              Postal or ZIP code portion of the shipping address for the order. PII field.
            sql_type: STRING(255)
          
          - name: subtotal
            business_name: Subtotal
            description: >-
              Total amount of the order items before discounts, taxes, and shipping. Order-level measure. 
              Should be aggregated at order grain only.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: discount_amount
            business_name: Discount Amount
            description: >-
              Total monetary discount applied to the order. Order-level measure. Should be aggregated 
              at order grain only.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: tax_amount
            business_name: Tax Amount
            description: >-
              Total tax amount applied to the order. Order-level measure. PII field. Should be aggregated 
              at order grain only.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: shipping_fee
            business_name: Shipping Fee
            description: >-
              Shipping charges applied to the order. Order-level measure. Should be aggregated at 
              order grain only.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: total_amount
            business_name: Total Amount
            description: >-
              Final total amount payable for the order including discounts, tax, and shipping. 
              Order-level measure. Primary revenue measure at order grain. Should be aggregated at 
              order grain only. Do not sum after joining to order_items.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: currency
            business_name: Currency
            description: >-
              Currency code used for the order amounts (e.g., USD). Categorical dimension for 
              multi-currency analysis.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: >-
              Identifier of the source system from which the order record was loaded.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ingestion batch that loaded the order record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp when the order record was loaded into the data platform.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: order_items
        business_name: Order Items
        description: >-
          Order line item data containing one row per order line item. Includes order reference, line number, 
          product reference, quantity, unit price, discount percentage, and line total. This dataset represents 
          the analytical grain of one row per unique order line item and serves as the primary fact table for 
          product-level and line-level revenue analysis.
        source: ecom_bronze.order_items
        primary_key:
          - order_item_id
        fields:
          - name: order_item_id
            business_name: Order Item Identifier
            description: >-
              Unique identifier for an order line item. Primary key for the order_items dataset.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: order_id
            business_name: Order Identifier
            description: >-
              References the related order record. Foreign key to orders.order_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: line_number
            business_name: Line Number
            description: >-
              Sequential line number of the item within the order. Used for ordering and display.
            sql_type: INT
            constraints:
              - NOT NULL
          
          - name: product_id
            business_name: Product Identifier
            description: >-
              References the related product record. Foreign key to products.product_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: quantity
            business_name: Quantity
            description: >-
              Number of units of the product ordered on this line. Line-level measure for quantity analysis.
            sql_type: INT
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: unit_price
            business_name: Unit Price
            description: >-
              Selling price per unit of the product at the time of order. Line-level measure for 
              pricing analysis.
            sql_type: DECIMAL(12,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
          
          - name: discount_pct
            business_name: Discount Pct
            description: >-
              Percentage discount applied to the line item. Line-level measure for discount analysis.
            sql_type: DECIMAL(5,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
          
          - name: line_total
            business_name: Line Total
            description: >-
              Monetary amount representing the total value of the line item after discounts. 
              Line-level measure. Primary revenue measure at order item grain. Use this for 
              product-level revenue analysis.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: _source_system
            business_name: Source System
            description: >-
              Identifier of the source system from which the order item record was loaded.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ingestion batch that loaded the order item record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp when the order item record was loaded into the data platform.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: products
        business_name: Products
        description: >-
          Product master data containing one row per product. Includes product identification, SKU, name, 
          category reference, brand, description, pricing (unit price and cost price), currency, inventory 
          quantity, active status, and creation timestamp. This dataset represents the analytical grain of 
          one row per unique product and serves as the primary dimension for product-centric analysis.
        source: ecom_bronze.products
        primary_key:
          - product_id
        fields:
          - name: product_id
            business_name: Product Identifier
            description: >-
              Unique identifier for a product. Primary key for the products dataset.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: sku
            business_name: Sku
            description: >-
              Stock keeping unit code used to uniquely identify the product in inventory systems. 
              Unique business identifier.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
              - UNIQUE
          
          - name: product_name
            business_name: Product Name
            description: >-
              Name of the product as displayed to customers. Primary product descriptor.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: category_id
            business_name: Category Identifier
            description: >-
              References the category to which the product belongs. Foreign key to product_categories.category_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: brand
            business_name: Brand
            description: >-
              Brand name associated with the product. Categorical dimension for brand analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: description
            business_name: Description
            description: >-
              Marketing or technical description of the product.
            sql_type: STRING(255)
          
          - name: unit_price
            business_name: Unit Price
            description: >-
              Standard selling price per unit of the product. Product-level measure for pricing analysis.
            sql_type: DECIMAL(12,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
          
          - name: cost_price
            business_name: Cost Price
            description: >-
              Unit cost at which the business acquires the product. PII field. Product-level measure 
              for cost and margin analysis. Sensitive field with restricted access.
            sql_type: DECIMAL(12,2)
            measure:
              aggregation: AVG
          
          - name: currency
            business_name: Currency
            description: >-
              Currency code used for the product prices (e.g., USD). Categorical dimension for 
              multi-currency analysis.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: stock_quantity
            business_name: Stock Quantity
            description: >-
              Current on-hand inventory quantity of the product. Product-level measure for inventory analysis.
            sql_type: INT
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: is_active
            business_name: Is Active
            description: >-
              Indicates whether the product is currently active and available for sale. Boolean dimension 
              for filtering active vs inactive products.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: created_at
            business_name: Created At
            description: >-
              Timestamp when the product record was created in the source system. Time dimension for 
              product launch and catalog expansion analysis.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: _source_system
            business_name: Source System
            description: >-
              Identifier of the source system from which the product record was loaded.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ingestion batch that loaded the product record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp when the product record was loaded into the data platform.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: product_categories
        business_name: Product Categories
        description: >-
          Product category master data containing one row per product category. Includes category identification, 
          name, parent category reference (enabling hierarchical category tree), description, and active status. 
          This dataset represents the analytical grain of one row per unique product category and supports 
          recursive hierarchical category analysis via the self-referencing parent_category_id field.
        source: ecom_bronze.product_categories
        primary_key:
          - category_id
        fields:
          - name: category_id
            business_name: Category Identifier
            description: >-
              Unique identifier for a product category. Primary key for the product_categories dataset.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: category_name
            business_name: Category Name
            description: >-
              Name of the product category. Primary category descriptor. Categorical dimension for 
              category analysis.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: parent_category_id
            business_name: Parent Category Identifier
            description: >-
              References the parent category in the category hierarchy, if applicable. Self-referencing 
              foreign key to product_categories.category_id. Enables recursive category tree traversal.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
          
          - name: description
            business_name: Description
            description: >-
              Text description of the product category.
            sql_type: STRING(255)
          
          - name: is_active
            business_name: Is Active
            description: >-
              Indicates whether the product category is currently active for use. Boolean dimension for 
              filtering active vs inactive categories.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: >-
              Identifier of the source system from which the product category record was loaded.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ingestion batch that loaded the product category record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp when the product category record was loaded into the data platform.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: payments
        business_name: Payments
        description: >-
          Payment transaction data containing one row per payment transaction. Includes payment identification, 
          order reference, payment method, status, amount, currency, transaction reference, gateway, and 
          payment timestamp. This dataset represents the analytical grain of one row per unique payment 
          transaction and serves as the primary fact table for payment and cash flow analysis.
        source: ecom_bronze.payments
        primary_key:
          - payment_id
        fields:
          - name: payment_id
            business_name: Payment Identifier
            description: >-
              Unique identifier for a payment transaction. Primary key for the payments dataset.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: order_id
            business_name: Order Identifier
            description: >-
              References the related order that the payment applies to. Foreign key to orders.order_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: payment_method
            business_name: Payment Method
            description: >-
              Payment method used, such as credit card, PayPal, or bank transfer. PII field. 
              Categorical dimension for payment method analysis.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: payment_status
            business_name: Payment Status
            description: >-
              Indicates the current status of the payment transaction (e.g., Captured, Failed, Refunded). 
              Categorical dimension for payment status analysis.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: amount
            business_name: Amount
            description: >-
              Monetary amount of the payment. PII field. Payment-level measure. Primary payment amount 
              measure at payment transaction grain.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: currency
            business_name: Currency
            description: >-
              Currency code used for the payment amount (e.g., USD). Categorical dimension for 
              multi-currency analysis.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: transaction_ref
            business_name: Transaction Ref
            description: >-
              Reference code or identifier provided by the payment gateway for this transaction. 
              PII field. Sensitive identifier.
            sql_type: STRING(255)
          
          - name: gateway
            business_name: Gateway
            description: >-
              Name of the payment gateway or processor handling the transaction (e.g., Stripe, PayPal). 
              Categorical dimension for gateway analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: paid_at
            business_name: Paid At
            description: >-
              Timestamp recording when the payment was completed. Time dimension for payment transaction 
              time analysis and cash flow analysis.
            sql_type: TIMESTAMP(29,9)
            dimension:
              is_time: true
          
          - name: _source_system
            business_name: Source System
            description: >-
              Identifier of the source system from which the payment record was loaded.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ingestion batch that loaded the payment record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp when the payment record was loaded into the data platform.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: shipments
        business_name: Shipments
        description: >-
          Shipment tracking data containing one row per shipment. Includes shipment identification, order reference, 
          carrier, tracking number, status, shipped and delivered timestamps, and delivery address. This dataset 
          represents the analytical grain of one row per unique shipment and serves as the primary fact table for 
          fulfillment and delivery performance analysis.
        source: ecom_bronze.shipments
        primary_key:
          - shipment_id
        fields:
          - name: shipment_id
            business_name: Shipment Identifier
            description: >-
              Unique identifier for a shipment. Primary key for the shipments dataset.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: order_id
            business_name: Order Identifier
            description: >-
              References the related order that the shipment fulfills. Foreign key to orders.order_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: carrier
            business_name: Carrier
            description: >-
              Name of the shipping carrier handling the shipment (e.g., UPS, FedEx, USPS). 
              Categorical dimension for carrier analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: tracking_number
            business_name: Tracking Number
            description: >-
              Tracking number assigned by the carrier for shipment tracking. PII field. Sensitive identifier.
            sql_type: STRING(255)
          
          - name: shipment_status
            business_name: Shipment Status
            description: >-
              Indicates the current status of the shipment (e.g., In Transit, Delivered, Returned). 
              Categorical dimension for shipment status analysis.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: shipped_at
            business_name: Shipped At
            description: >-
              Timestamp recording when the shipment left the fulfillment location. Time dimension for 
              shipment fulfillment time analysis.
            sql_type: TIMESTAMP(29,9)
            dimension:
              is_time: true
          
          - name: delivered_at
            business_name: Delivered At
            description: >-
              Timestamp recording when the shipment was delivered to the customer. Time dimension for 
              delivery performance analysis. May be NULL for shipments not yet delivered.
            sql_type: TIMESTAMP(29,9)
            dimension:
              is_time: true
          
          - name: ship_city
            business_name: Ship City
            description: >-
              City portion of the shipment delivery address. PII field. Geographic dimension.
            sql_type: STRING(255)
          
          - name: ship_state
            business_name: Ship State
            description: >-
              State or province portion of the shipment delivery address. PII field. Geographic dimension.
            sql_type: STRING(255)
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: >-
              Postal or ZIP code portion of the shipment delivery address. PII field.
            sql_type: STRING(255)
          
          - name: _source_system
            business_name: Source System
            description: >-
              Identifier of the source system from which the shipment record was loaded.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ingestion batch that loaded the shipment record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp when the shipment record was loaded into the data platform.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

    relationships:
      - name: orders_to_customers
        left_dataset: orders
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Many orders can belong to one customer. Join orders.customer_id to customers.customer_id 
          to associate orders with customer demographics, segment, and registration information. 
          This is a standard many-to-one relationship based on the foreign key constraint.
      
      - name: order_items_to_orders
        left_dataset: order_items
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Many order items belong to one order. Join order_items.order_id to orders.order_id to 
          associate line items with order header information. CRITICAL: Do not sum order-level 
          measures (orders.total_amount, orders.subtotal, orders.discount_amount, orders.tax_amount, 
          orders.shipping_fee) after this join as it will cause duplication. Use order_items.line_total 
          for product-level revenue analysis.
      
      - name: order_items_to_products
        left_dataset: order_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        resolution: >-
          Many order items can reference one product. Join order_items.product_id to products.product_id 
          to associate line items with product details including name, brand, category, and pricing. 
          This enables product-level sales and revenue analysis.
      
      - name: products_to_product_categories
        left_dataset: products
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Many products belong to one product category. Join products.category_id to 
          product_categories.category_id to associate products with category information. 
          This enables category-level product and sales analysis.
      
      - name: product_categories_hierarchy
        left_dataset: product_categories
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - parent_category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Self-referencing hierarchical relationship. Many child categories can belong to one parent category. 
          Join product_categories.parent_category_id to product_categories.category_id to traverse the 
          category hierarchy. Use recursive CTEs to build the complete category tree. Root categories have 
          NULL parent_category_id. This enables hierarchical category rollup and drill-down analysis.
      
      - name: payments_to_orders
        left_dataset: payments
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Many payments can apply to one order (e.g., partial payments, refunds). Join payments.order_id 
          to orders.order_id to associate payment transactions with order information. CRITICAL: Do not 
          sum orders.total_amount after this join if multiple payments exist per order as it will cause 
          duplication. Use payments.amount for payment transaction analysis.
      
      - name: shipments_to_orders
        left_dataset: shipments
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Many shipments can fulfill one order (e.g., split shipments). Join shipments.order_id to 
          orders.order_id to associate shipments with order information. CRITICAL: Do not sum 
          orders.total_amount after this join if multiple shipments exist per order as it will cause 
          duplication. Use shipment-level measures for fulfillment analysis.

    metrics:
      - name: total_order_revenue
        business_name: Total Order Revenue
        description: >-
          Total revenue from all orders calculated as the sum of order total amounts. This metric 
          represents the final order value including discounts, taxes, and shipping fees. Should be 
          calculated at order grain without joining to order_items to avoid duplication.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.total_amount) AS total_order_revenue
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.total_amount
      
      - name: total_line_revenue
        business_name: Total Line Revenue
        description: >-
          Total revenue from all order line items calculated as the sum of line totals. This metric 
          represents product-level revenue after line-item discounts. Use this metric for product-level 
          revenue analysis rather than orders.total_amount.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.line_total) AS total_line_revenue
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.line_total
      
      - name: total_subtotal
        business_name: Total Subtotal
        description: >-
          Total order subtotal before discounts, taxes, and shipping. Calculated as the sum of order 
          subtotals at order grain.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.subtotal) AS total_subtotal
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.subtotal
      
      - name: total_discount_amount
        business_name: Total Discount Amount
        description: >-
          Total monetary discount applied across all orders. Calculated as the sum of order-level 
          discount amounts at order grain.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.discount_amount) AS total_discount_amount
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.discount_amount
      
      - name: total_tax_amount
        business_name: Total Tax Amount
        description: >-
          Total tax amount collected across all orders. Calculated as the sum of order-level tax amounts 
          at order grain.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.tax_amount) AS total_tax_amount
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.tax_amount
      
      - name: total_shipping_fee
        business_name: Total Shipping Fee
        description: >-
          Total shipping charges collected across all orders. Calculated as the sum of order-level 
          shipping fees at order grain.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.shipping_fee) AS total_shipping_fee
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.shipping_fee
      
      - name: total_payment_amount
        business_name: Total Payment Amount
        description: >-
          Total payment amount received across all payment transactions. Calculated as the sum of 
          payment amounts at payment transaction grain. Use this for cash flow analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(payments.amount) AS total_payment_amount
                FROM ecom_bronze.payments AS payments
              columns_used:
                - payments.amount
      
      - name: total_units_sold
        business_name: Total Units Sold
        description: >-
          Total quantity of product units sold across all order line items. Calculated as the sum of 
          order item quantities at order item grain.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.quantity) AS total_units_sold
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.quantity
      
      - name: order_count
        business_name: Order Count
        description: >-
          Total number of distinct orders. Calculated as the count of unique order identifiers.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT orders.order_id) AS order_count
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.order_id
      
      - name: customer_count
        business_name: Customer Count
        description: >-
          Total number of distinct customers. Calculated as the count of unique customer identifiers.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT customers.customer_id) AS customer_count
                FROM ecom_bronze.customers AS customers
              columns_used:
                - customers.customer_id
      
      - name: product_count
        business_name: Product Count
        description: >-
          Total number of distinct products. Calculated as the count of unique product identifiers.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT products.product_id) AS product_count
                FROM ecom_bronze.products AS products
              columns_used:
                - products.product_id
      
      - name: payment_count
        business_name: Payment Count
        description: >-
          Total number of distinct payment transactions. Calculated as the count of unique payment identifiers.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT payments.payment_id) AS payment_count
                FROM ecom_bronze.payments AS payments
              columns_used:
                - payments.payment_id
      
      - name: shipment_count
        business_name: Shipment Count
        description: >-
          Total number of distinct shipments. Calculated as the count of unique shipment identifiers.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT shipments.shipment_id) AS shipment_count
                FROM ecom_bronze.shipments AS shipments
              columns_used:
                - shipments.shipment_id
      
      - name: average_order_value
        business_name: Average Order Value
        description: >-
          Average order value calculated as total order revenue divided by order count. Represents the 
          average amount spent per order. Uses safe division to handle zero order count.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT orders.order_id) = 0 THEN 0
                    ELSE SUM(orders.total_amount) / COUNT(DISTINCT orders.order_id)
                  END AS average_order_value
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.total_amount
                - orders.order_id
      
      - name: average_line_value
        business_name: Average Line Value
        description: >-
          Average line item value calculated as total line revenue divided by the count of order items. 
          Represents the average revenue per order line. Uses safe division to handle zero line count.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT order_items.order_item_id) = 0 THEN 0
                    ELSE SUM(order_items.line_total) / COUNT(DISTINCT order_items.order_item_id)
                  END AS average_line_value
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.line_total
                - order_items.order_item_id
      
      - name: average_unit_price
        business_name: Average Unit Price
        description: >-
          Weighted average unit price across all order line items. Calculated as total line revenue 
          divided by total units sold. Represents the average selling price per unit. Uses safe division 
          to handle zero quantity.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN SUM(order_items.quantity) = 0 THEN 0
                    ELSE SUM(order_items.line_total) / SUM(order_items.quantity)
                  END AS average_unit_price
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.line_total
                - order_items.quantity
      
      - name: average_discount_percentage
        business_name: Average Discount Percentage
        description: >-
          Average discount percentage applied across all order line items. Calculated as the simple 
          average of line-item discount percentages.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(order_items.discount_pct) AS average_discount_percentage
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.discount_pct
      
      - name: discount_rate
        business_name: Discount Rate
        description: >-
          Overall discount rate calculated as total discount amount divided by total subtotal. 
          Represents the percentage of subtotal given as discount. Uses safe division to handle 
          zero subtotal.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN SUM(orders.subtotal) = 0 THEN 0
                    ELSE (SUM(orders.discount_amount) / SUM(orders.subtotal)) * 100
                  END AS discount_rate
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.discount_amount
                - orders.subtotal
      
      - name: orders_per_customer
        business_name: Orders Per Customer
        description: >-
          Average number of orders per customer. Calculated as total order count divided by total 
          customer count. Uses safe division to handle zero customer count.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT customers.customer_id) = 0 THEN 0
                    ELSE CAST(COUNT(DISTINCT orders.order_id) AS DECIMAL) / COUNT(DISTINCT customers.customer_id)
                  END AS orders_per_customer
                FROM ecom_bronze.orders AS orders
                INNER JOIN ecom_bronze.customers AS customers
                  ON orders.customer_id = customers.customer_id
              columns_used:
                - orders.order_id
                - orders.customer_id
                - customers.customer_id
      
      - name: revenue_per_customer
        business_name: Revenue Per Customer
        description: >-
          Average revenue per customer. Calculated as total order revenue divided by total customer count. 
          Uses safe division to handle zero customer count.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT customers.customer_id) = 0 THEN 0
                    ELSE SUM(orders.total_amount) / COUNT(DISTINCT customers.customer_id)
                  END AS revenue_per_customer
                FROM ecom_bronze.orders AS orders
                INNER JOIN ecom_bronze.customers AS customers
                  ON orders.customer_id = customers.customer_id
              columns_used:
                - orders.total_amount
                - orders.customer_id
                - customers.customer_id
      
      - name: product_revenue_by_product
        business_name: Product Revenue By Product
        description: >-
          Total revenue for each product. Calculated as the sum of line totals grouped by product. 
          Result grain is one row per product.
        return_type: DECIMAL
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  products.product_id,
                  products.product_name,
                  SUM(order_items.line_total) AS product_revenue
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
                GROUP BY products.product_id, products.product_name
              columns_used:
                - order_items.product_id
                - order_items.line_total
                - products.product_id
                - products.product_name
      
      - name: product_units_sold_by_product
        business_name: Product Units Sold By Product
        description: >-
          Total units sold for each product. Calculated as the sum of order item quantities grouped 
          by product. Result grain is one row per product.
        return_type: INTEGER
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  products.product_id,
                  products.product_name,
                  SUM(order_items.quantity) AS units_sold
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
                GROUP BY products.product_id, products.product_name
              columns_used:
                - order_items.product_id
                - order_items.quantity
                - products.product_id
                - products.product_name
      
      - name: revenue_by_category
        business_name: Revenue By Category
        description: >-
          Total revenue for each product category. Calculated as the sum of line totals grouped by 
          product category. Result grain is one row per category.
        return_type: DECIMAL
        result_grain: one row per category
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  product_categories.category_id,
                  product_categories.category_name,
                  SUM(order_items.line_total) AS category_revenue
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
                INNER JOIN ecom_bronze.product_categories AS product_categories
                  ON products.category_id = product_categories.category_id
                GROUP BY product_categories.category_id, product_categories.category_name
              columns_used:
                - order_items.product_id
                - order_items.line_total
                - products.product_id
                - products.category_id
                - product_categories.category_id
                - product_categories.category_name
      
