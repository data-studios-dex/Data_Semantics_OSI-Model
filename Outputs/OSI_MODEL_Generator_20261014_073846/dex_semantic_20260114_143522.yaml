              columns_used:
                - completion_gate.gate_id
      
      - name: checked_gate_count
        business_name: Checked Gate Count
        description: >-
          Count of completion gates that have been checked (is_checked = 1).
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    COUNT(DISTINCT completion_gate.gate_id) AS checked_gate_count
                FROM staging.completion_gate AS completion_gate
                WHERE completion_gate.is_checked = 1
              columns_used:
                - completion_gate.gate_id
                - completion_gate.is_checked
      
      - name: gate_completion_rate
        business_name: Gate Completion Rate
        description: >-
          Percentage of completion gates that have been checked.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT completion_gate.gate_id) = 0 THEN 0
                        ELSE (CAST(COUNT(DISTINCT CASE WHEN completion_gate.is_checked = 1 THEN completion_gate.gate_id END) AS DECIMAL(10,2)) 
                              / NULLIF(COUNT(DISTINCT completion_gate.gate_id), 0)) * 100
                    END AS gate_completion_rate
                FROM staging.completion_gate AS completion_gate
              columns_used:
                - completion_gate.gate_id
                - completion_gate.is_checked
      
