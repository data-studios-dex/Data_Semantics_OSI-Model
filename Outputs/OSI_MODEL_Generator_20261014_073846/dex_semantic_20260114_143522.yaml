                - task_record.status
      
      - name: task_count_by_modification
        business_name: Task Count by Modification
        description: >-
          Count of tasks grouped by modification.
        return_type: integer
        result_grain: one row per modification
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    task_record.mod_id,
                    COUNT(DISTINCT task_record.task_id) AS task_count
                FROM staging.task_record AS task_record
                GROUP BY task_record.mod_id
              columns_used:
                - task_record.task_id
