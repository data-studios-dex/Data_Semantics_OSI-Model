      - name: average_task_per_modification
        business_name: Average Task per Modification
        description: >-
          Average number of tasks per modification.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT task_record.mod_id) = 0 THEN 0
                        ELSE CAST(COUNT(DISTINCT task_record.task_id) AS DECIMAL(10,2)) / COUNT(DISTINCT task_record.mod_id)
                    END AS average_task_per_modification
                FROM staging.task_record AS task_record
              columns_used:
                - task_record.task_id
                - task_record.mod_id
      
