      - name: total_shipment_weight
        business_name: Total Shipment Weight
        description: >-
          Total weight across all shipments.
          Calculated as the sum of shipment.weight across all shipments.
          Used for logistics and freight analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(sh.weight) AS total_shipment_weight
                FROM ecom_bronze.shipment AS sh
              columns_used:
                - shipment.weight
      
      - name: average_delivery_days
        business_name: Average Delivery Days
        description: >-
          Average number of days between shipment dispatch and arrival.
          Calculated as the average difference between shipment.arrival_date and shipment.dispatch_date.
          This metric represents shipment delivery performance.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(sh.arrival_date - sh.dispatch_date) AS average_delivery_days
                FROM ecom_bronze.shipment AS sh
                WHERE sh.arrival_date IS NOT NULL
                  AND sh.dispatch_date IS NOT NULL
              columns_used:
                - shipment.arrival_date
                - shipment.dispatch_date
      
