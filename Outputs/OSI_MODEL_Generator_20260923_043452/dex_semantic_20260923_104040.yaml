                - shipment.status
      
      - name: monthly_revenue
        business_name: Monthly Revenue
        description: >-
          Total revenue grouped by month.
          Calculated as the sum of order_tbl.total grouped by month extracted from order_tbl.timestamp.
          This metric enables time-series revenue analysis.
        return_type: currency_usd
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('month', o.timestamp) AS order_month,
                    SUM(o.total) AS revenue
                FROM ecom_bronze.order_tbl AS o
                GROUP BY DATE_TRUNC('month', o.timestamp)
                ORDER BY order_month
              columns_used:
                - order_tbl.timestamp
                - order_tbl.total
      
      - name: monthly_order_count
        business_name: Monthly Order Count
        description: >-
          Number of orders grouped by month.
          Calculated as the count of order_id grouped by month extracted from order_tbl.timestamp.
          This metric enables time-series order volume analysis.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('month', o.timestamp) AS order_month,
                    COUNT(o.order_id) AS order_count
                FROM ecom_bronze.order_tbl AS o
                GROUP BY DATE_TRUNC('month', o.timestamp)
                ORDER BY order_month
              columns_used:
                - order_tbl.timestamp
                - order_tbl.order_id
      
