      - name: shipment_count_by_status
        business_name: Shipment Count by Status
        description: >-
          Number of shipments grouped by shipment status.
          Calculated as the count of shipment_id grouped by shipment.status.
          This metric enables shipment tracking and status analysis.
        return_type: integer
        result_grain: one row per shipment status
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    sh.status,
