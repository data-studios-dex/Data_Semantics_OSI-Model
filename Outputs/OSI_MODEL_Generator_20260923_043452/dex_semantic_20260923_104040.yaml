      - name: revenue_by_loyalty_tier
        business_name: Revenue by Loyalty Tier
        description: >-
          Total revenue grouped by customer loyalty tier.
          Calculated as the sum of order_tbl.total grouped by customer.loyalty_tier.
          This metric enables loyalty tier performance analysis.
        return_type: currency_usd
        result_grain: one row per loyalty tier
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    c.loyalty_tier,
                    SUM(o.total) AS revenue
                FROM ecom_bronze.order_tbl AS o
                INNER JOIN ecom_bronze.customer AS c
                    ON o.customer_id = c.customer_id
                GROUP BY c.loyalty_tier
              columns_used:
                - order_tbl.total
                - order_tbl.customer_id
                - customer.customer_id
                - customer.loyalty_tier
      
      - name: revenue_by_store
        business_name: Revenue by Store
        description: >-
          Total revenue grouped by store.
          Calculated as the sum of order_tbl.total grouped by store.name.
          This metric enables store performance comparison.
        return_type: currency_usd
        result_grain: one row per store
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    s.name AS store_name,
                    SUM(o.total) AS revenue
                FROM ecom_bronze.order_tbl AS o
                INNER JOIN ecom_bronze.store AS s
                    ON o.store_id = s.store_id
                GROUP BY s.name
              columns_used:
                - order_tbl.total
                - order_tbl.store_id
                - store.store_id
                - store.name
      
      - name: revenue_by_payment_method
        business_name: Revenue by Payment Method
        description: >-
          Total revenue grouped by payment method.
          Calculated as the sum of order_tbl.total grouped by order_tbl.payment_method.
          This metric enables payment method preference analysis.
        return_type: currency_usd
        result_grain: one row per payment method
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    o.payment_method,
                    SUM(o.total) AS revenue
                FROM ecom_bronze.order_tbl AS o
                GROUP BY o.payment_method
              columns_used:
                - order_tbl.total
                - order_tbl.payment_method
      
      - name: product_count_by_category
        business_name: Product Count by Category
        description: >-
          Number of products grouped by product category.
          Calculated as the count of product_id grouped by product.category.
          This metric enables product catalog analysis by category.
        return_type: integer
