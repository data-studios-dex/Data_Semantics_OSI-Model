version: 1.1

comment: |-
  Databricks Unity Catalog Metric View for Food Delivery Platform Analytics
  
  Generated from OSI Semantic Model: food_delivery_semantic_model (version 1.0)
  Catalog: dex-demo
  Schema: food_delivery
  Spine Dataset: order_items
  PII Mode: restricted
  Deduplication Mode: off
  
  RELATIONSHIPS REPRESENTED:
  This metric view represents the following relationships from the source semantic model:
  1. order_items_to_orders: Each order item belongs to exactly one order
  2. orders_to_customers: Each order is placed by exactly one customer
  3. orders_to_restaurants: Each order is fulfilled by exactly one restaurant
  4. order_items_to_menu_items: Each order item references exactly one menu item
  5. deliveries_to_orders: Each delivery is associated with exactly one order
  6. deliveries_to_delivery_agents: Each delivery is handled by exactly one delivery agent
  7. payments_to_orders: Each payment is associated with exactly one order
  
  GROUPED METRICS (Metric + Dimension Pairings):
  - revenue_by_customer: total_line_item_revenue + customer_id
  - revenue_by_restaurant: total_line_item_revenue + restaurant_id
  - revenue_by_menu_item: total_line_item_revenue + item_name
  - revenue_by_channel: total_line_item_revenue + order_channel
  - orders_by_status: order_count + order_status
  - deliveries_by_status: delivery_count + delivery_status
  - payments_by_status: payment_transaction_count + payment_status
  - revenue_by_month: total_line_item_revenue + order_month
  - orders_by_month: order_count + order_month
  
  METRICS NOT REPRESENTED (require different grain or unavailable in dedup_mode off):
  - total_order_revenue: Requires order-level grain with deduplication (available in dedup_mode on)
  - total_delivery_fee: Requires order-level grain with deduplication (available in dedup_mode on)
  - total_tax: Requires order-level grain with deduplication (available in dedup_mode on)
  - total_tip: Requires order-level grain with deduplication (available in dedup_mode on)
  - total_order_subtotal: Requires order-level grain with deduplication (available in dedup_mode on)
  - restaurant_menu_metrics: Require restaurant or menu_item grain as spine

source: '`dex-demo`.food_delivery.order_items'

joins:
  - name: orders
    source: '`dex-demo`.food_delivery.orders'
    "on": source.order_id = orders.order_id
    joins:
      - name: customers
        source: '`dex-demo`.food_delivery.customers'
        "on": orders.customer_id = customers.customer_id
        rely:
          at_most_one_match: true
      - name: restaurants
        source: '`dex-demo`.food_delivery.restaurants'
        "on": orders.restaurant_id = restaurants.restaurant_id
        rely:
          at_most_one_match: true
      - name: payments
        source: '`dex-demo`.food_delivery.payments'
        "on": orders.order_id = payments.order_id
      - name: deliveries
        source: '`dex-demo`.food_delivery.deliveries'
        "on": orders.order_id = deliveries.order_id
        joins:
          - name: delivery_agents
            source: '`dex-demo`.food_delivery.delivery_agents'
            "on": deliveries.agent_id = delivery_agents.agent_id
            rely:
              at_most_one_match: true
    rely:
      at_most_one_match: true
  - name: menu_items
    source: '`dex-demo`.food_delivery.menu_items'
    "on": source.item_id = menu_items.item_id
    joins:
      - name: menu_sections
        source: '`dex-demo`.food_delivery.menu_sections'
        "on": menu_items.section_id = menu_sections.section_id
        rely:
          at_most_one_match: true
    rely:
      at_most_one_match: true

dimensions:
  - name: order_item_id
    expr: source.order_item_id
    display_name: Order Item ID
    comment: Unique identifier for an item within a customer order.
    synonyms:
      - line item id
      - item id
      - order line id

  - name: order_id
    expr: source.order_id
    display_name: Order ID
    comment: References the order that the item belongs to.
    synonyms:
      - order number
      - order reference

  - name: item_id
    expr: source.item_id
    display_name: Menu Item ID
    comment: References the menu item included in the order.
    synonyms:
      - menu item id
      - product id

  - name: item_name
    expr: source.item_name
    display_name: Item Name
    comment: Name of the item as recorded on the order.
    synonyms:
      - product name
      - menu item name
      - dish name

  - name: customer_id
    expr: orders.customers.customer_id
    display_name: Customer ID
    comment: Unique identifier for a customer.
    synonyms:
      - customer number
      - customer reference

  - name: customer_registered_at
    expr: orders.customers.registered_at
    display_name: Customer Registered At
    comment: Timestamp recording when the customer registered for the service.

  - name: customer_registration_month
    expr: DATE_TRUNC('MONTH', orders.customers.registered_at)
    display_name: Customer Registration Month
    comment: Month when the customer registered, derived from registration timestamp.
    synonyms:
      - registration month
      - signup month

  - name: customer_is_active
    expr: orders.customers.is_active
    display_name: Customer Is Active
    comment: Indicates whether the customer account is currently active.
    synonyms:
      - active customer
      - customer active status

  - name: customer_is_premium
    expr: orders.customers.is_premium
    display_name: Customer Is Premium
    comment: Indicates whether the customer is enrolled in a premium program.
    synonyms:
      - premium customer
      - premium member

  - name: customer_preferred_language
    expr: orders.customers.preferred_language
    display_name: Customer Preferred Language
    comment: Language preference used for communications with the customer.
    synonyms:
      - language preference
      - preferred language

  - name: restaurant_id
    expr: orders.restaurants.restaurant_id
    display_name: Restaurant ID
    comment: Unique identifier for a restaurant.
    synonyms:
      - restaurant number
      - restaurant reference

  - name: restaurant_name
    expr: orders.restaurants.name
    display_name: Restaurant Name
    comment: Display name of the restaurant.
    synonyms:
      - restaurant
      - vendor name

  - name: restaurant_city
    expr: orders.restaurants.city
    display_name: Restaurant City
    comment: City where the restaurant operates. PII - restrict access
    synonyms:
      - restaurant location

  - name: restaurant_state
    expr: orders.restaurants.state
    display_name: Restaurant State
    comment: State or region where the restaurant operates. PII - restrict access

  - name: restaurant_is_active
    expr: orders.restaurants.is_active
    display_name: Restaurant Is Active
    comment: Indicates whether the restaurant is currently active on the platform.
    synonyms:
      - active restaurant

  - name: restaurant_created_at
    expr: orders.restaurants.created_at
    display_name: Restaurant Created At
    comment: Timestamp recording when the restaurant record was created on the platform.

  - name: order_status
    expr: orders.order_status
    display_name: Order Status
    comment: Indicates the current status of the order, such as Placed, Delivered, or Cancelled.
    synonyms:
      - status
      - order state

  - name: order_payment_method
    expr: orders.payment_method
    display_name: Order Payment Method
    comment: Payment method used for the order, such as Credit Card or Digital Wallet. PII - restrict access
    synonyms:
      - payment method
      - payment type

  - name: order_ordered_at
    expr: orders.ordered_at
    display_name: Order Ordered At
    comment: Timestamp recording when the order was placed.
    synonyms:
      - order date
      - order time

  - name: order_month
    expr: DATE_TRUNC('MONTH', orders.ordered_at)
    display_name: Order Month
    comment: Month when the order was placed, derived from order timestamp.
    synonyms:
      - order period
      - order month

  - name: order_estimated_delivery_at
    expr: orders.estimated_delivery_at
    display_name: Order Estimated Delivery At
    comment: Timestamp indicating the estimated delivery time communicated to the customer.

  - name: order_delivered_at
    expr: orders.delivered_at
    display_name: Order Delivered At
    comment: Timestamp recording when the order was actually delivered.

  - name: order_cancelled_at
    expr: orders.cancelled_at
    display_name: Order Cancelled At
    comment: Timestamp recording when the order was cancelled, if applicable.

  - name: order_cancellation_reason
    expr: orders.cancellation_reason
    display_name: Order Cancellation Reason
    comment: Text describing the reason the order was cancelled.
    synonyms:
      - cancellation reason

  - name: order_is_scheduled
    expr: orders.is_scheduled
    display_name: Order Is Scheduled
    comment: Indicates whether the order was scheduled for a future time.
    synonyms:
      - scheduled order

  - name: order_channel
    expr: orders.channel
    display_name: Order Channel
    comment: Order channel used, such as Mobile App, Web, or Partner Platform.
    synonyms:
      - channel
      - sales channel
      - order source

  - name: payment_id
    expr: orders.payments.payment_id
    display_name: Payment ID
    comment: Unique identifier for a payment transaction.
    synonyms:
      - payment number
      - transaction id

  - name: payment_method
    expr: orders.payments.payment_method
    display_name: Payment Method
    comment: Payment method used for the transaction, such as Credit Card or PayPal. PII - restrict access
    synonyms:
      - payment type

  - name: payment_status
    expr: orders.payments.payment_status
    display_name: Payment Status
    comment: Indicates the current status of the payment, such as Authorized or Settled.
    synonyms:
      - payment state

  - name: payment_processed_at
    expr: orders.payments.processed_at
    display_name: Payment Processed At
    comment: Timestamp recording when the payment was processed.

  - name: paid_month
    expr: DATE_TRUNC('MONTH', orders.payments.processed_at)
    display_name: Paid Month
    comment: Month when the payment was processed, derived from payment timestamp.
    synonyms:
      - payment month

  - name: delivery_id
    expr: orders.deliveries.delivery_id
    display_name: Delivery ID
    comment: Unique identifier for a delivery.
    synonyms:
      - delivery number

  - name: delivery_status
    expr: orders.deliveries.delivery_status
    display_name: Delivery Status
    comment: Indicates the current status of the delivery, such as In Transit or Delivered.
    synonyms:
      - delivery state

  - name: delivery_pickup_time
    expr: orders.deliveries.pickup_time
    display_name: Delivery Pickup Time
    comment: Timestamp recording when the agent picked up the order from the restaurant.

  - name: delivery_delivered_time
    expr: orders.deliveries.delivered_time
    display_name: Delivery Delivered Time
    comment: Timestamp recording when the order was delivered to the customer.

  - name: delivered_month
    expr: DATE_TRUNC('MONTH', orders.deliveries.delivered_time)
    display_name: Delivered Month
    comment: Month when the delivery was completed, derived from delivery timestamp.
    synonyms:
      - delivery month

  - name: agent_id
    expr: orders.deliveries.delivery_agents.agent_id
    display_name: Agent ID
    comment: Unique identifier for a delivery agent.
    synonyms:
      - delivery agent id
      - driver id

  - name: agent_vehicle_type
    expr: orders.deliveries.delivery_agents.vehicle_type
    display_name: Agent Vehicle Type
    comment: Type of vehicle used by the delivery agent, such as Bike or Car.
    synonyms:
      - vehicle type
      - delivery vehicle

  - name: agent_city
    expr: orders.deliveries.delivery_agents.city
    display_name: Agent City
    comment: City where the delivery agent primarily operates. PII - restrict access

  - name: agent_state
    expr: orders.deliveries.delivery_agents.state
    display_name: Agent State
    comment: State or region where the delivery agent primarily operates. PII - restrict access

  - name: agent_is_active
    expr: orders.deliveries.delivery_agents.is_active
    display_name: Agent Is Active
    comment: Indicates whether the delivery agent is currently active on the platform.
    synonyms:
      - active agent

  - name: agent_joined_at
    expr: orders.deliveries.delivery_agents.joined_at
    display_name: Agent Joined At
    comment: Timestamp recording when the delivery agent joined the platform.

  - name: menu_item_id
    expr: menu_items.item_id
    display_name: Menu Item ID
    comment: Unique identifier for a menu item.

  - name: menu_item_name
    expr: menu_items.name
    display_name: Menu Item Name
    comment: Display name of the menu item shown to customers.
    synonyms:
      - dish name
      - product name

  - name: menu_item_is_vegetarian
    expr: menu_items.is_vegetarian
    display_name: Menu Item Is Vegetarian
    comment: Indicates whether the menu item is suitable for vegetarians.
    synonyms:
      - vegetarian

  - name: menu_item_is_vegan
    expr: menu_items.is_vegan
    display_name: Menu Item Is Vegan
    comment: Indicates whether the menu item is suitable for vegans.
    synonyms:
      - vegan

  - name: menu_item_is_gluten_free
    expr: menu_items.is_gluten_free
    display_name: Menu Item Is Gluten Free
    comment: Indicates whether the menu item is gluten free.
    synonyms:
      - gluten free

  - name: menu_item_spice_level
    expr: menu_items.spice_level
    display_name: Menu Item Spice Level
    comment: Indicates the spice level of the menu item, such as Mild or Spicy.
    synonyms:
      - spice level
      - heat level

  - name: menu_item_is_available
    expr: menu_items.is_available
    display_name: Menu Item Is Available
    comment: Indicates whether the menu item is currently available to order.
    synonyms:
      - available

  - name: menu_item_is_popular
    expr: menu_items.is_popular
    display_name: Menu Item Is Popular
    comment: Indicates whether the menu item is marked as popular based on demand.
    synonyms:
      - popular item

  - name: menu_section_id
    expr: menu_items.menu_sections.section_id
    display_name: Menu Section ID
    comment: Unique identifier for a menu section.

  - name: menu_section_name
    expr: menu_items.menu_sections.name
    display_name: Menu Section Name
    comment: Display name of the menu section, such as Appetizers or Desserts.
    synonyms:
      - section name
      - menu category

  - name: menu_section_is_available
    expr: menu_items.menu_sections.is_available
    display_name: Menu Section Is Available
    comment: Indicates whether the menu section is currently available.

measures:
  - name: total_line_item_revenue
    expr: SUM(source.line_total)
    display_name: Total Line Item Revenue
    comment: Total revenue from all order line items. This is the sum of line_total from order_items and represents item-level revenue.
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - item revenue
      - line revenue
      - product revenue

  - name: total_units_sold
    expr: SUM(source.quantity)
    display_name: Total Units Sold
    comment: Total quantity of items sold across all orders.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - quantity sold
      - items sold
      - units ordered

  - name: average_unit_price
    expr: AVG(source.unit_price)
    display_name: Average Unit Price
    comment: Average price per unit across all order items.
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - avg unit price
      - mean unit price

  - name: average_line_item_value
    expr: ROUND(MEASURE(total_line_item_revenue) / NULLIF(COUNT(source.order_item_id), 0), 2)
    display_name: Average Line Item Value
    comment: Average revenue per order line item. Calculated as total line item revenue divided by the count of order items.
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - avg line value
      - average item value

  - name: order_count
    expr: COUNT(DISTINCT orders.order_id)
    display_name: Order Count
    comment: Counts only orders with at least one line item.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - number of orders
      - total orders
      - order volume

  - name: average_order_value
    expr: ROUND(MEASURE(total_line_item_revenue) / NULLIF(MEASURE(order_count), 0), 2)
    display_name: Average Order Value
    comment: Based on line item revenue, so it excludes order-level tax, shipping and order discounts.
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - AOV
      - avg order value
      - mean order value

  - name: average_units_per_order
    expr: ROUND(CAST(MEASURE(total_units_sold) AS DOUBLE) / NULLIF(MEASURE(order_count), 0), 2)
    display_name: Average Units per Order
    comment: Average number of items per order. Calculated as total units sold divided by order count.
    format:
      type: number
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - avg items per order
      - items per order

  - name: customer_count
    expr: COUNT(DISTINCT orders.customers.customer_id)
    display_name: Customer Count
    comment: Counts only customers that appear on one order with at least one line item.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - number of customers
      - total customers

  - name: active_customer_count
    expr: COUNT(DISTINCT CASE WHEN orders.customers.is_active = TRUE THEN orders.customers.customer_id END)
    display_name: Active Customer Count
    comment: Counts only active customers that appear on one order with at least one line item.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - active customers

  - name: restaurant_count
    expr: COUNT(DISTINCT orders.restaurants.restaurant_id)
    display_name: Restaurant Count
    comment: Counts only restaurants that appear on one order with at least one line item.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - number of restaurants
      - total restaurants

  - name: menu_item_count
    expr: COUNT(DISTINCT menu_items.item_id)
    display_name: Menu Item Count
    comment: Counts only menu items that appear on one order line item.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - product count
      - item count

  - name: payment_transaction_count
    expr: COUNT(DISTINCT orders.payments.payment_id)
    display_name: Payment Transaction Count
    comment: Payments are joined many-to-one; if an order has more than one, only the first match is used, so these undercount.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - payment count
      - transaction count

  - name: total_payment_amount
    expr: SUM(orders.payments.amount)
    display_name: Total Payment Amount
    comment: WARNING - order payments repeat once per order line, so this total is inflated unless the query groups by order_id. Use payment_transaction_count for counts.
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - payment amount
      - payment total

  - name: delivery_count
    expr: COUNT(DISTINCT orders.deliveries.delivery_id)
    display_name: Delivery Count
    comment: Deliveries are joined many-to-one; if an order has more than one, only the first match is used, so these undercount.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - number of deliveries
      - total deliveries

  - name: delivery_time_minutes
    expr: ROUND(AVG(orders.deliveries.actual_time_min), 2)
    display_name: Delivery Time (Minutes)
    comment: Average actual delivery time in minutes. Deliveries are joined many-to-one; if an order has more than one, only the first match is used, so these undercount.
    format:
      type: number
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - avg delivery time
      - delivery duration

  - name: delivery_distance_km
    expr: ROUND(AVG(orders.deliveries.distance_km), 2)
    display_name: Delivery Distance (km)
    comment: Average delivery distance in kilometers. Deliveries are joined many-to-one; if an order has more than one, only the first match is used, so these undercount.
    format:
      type: number
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - avg delivery distance
      - distance traveled
