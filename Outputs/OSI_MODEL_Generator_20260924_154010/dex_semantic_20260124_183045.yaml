      - name: monthly_revenue
        business_name: Monthly Revenue
        description: >-
          Total revenue per month. This metric sums order total amounts grouped by month extracted from the order 
          timestamp to analyze revenue trends over time. Use this metric for monthly revenue trending, seasonal 
          analysis, and time-series revenue forecasting. The result grain is one row per month.
        return_type: decimal
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('month', order_tbl.timestamp) AS order_month,
                    SUM(order_tbl.total) AS monthly_revenue
                FROM ecom_bronze.order_tbl AS order_tbl
                GROUP BY DATE_TRUNC('month', order_tbl.timestamp)
                ORDER BY order_month
              columns_used:
                - order_tbl.timestamp
                - order_tbl.total

      - name: monthly_order_count
        business_name: Monthly Order Count
        description: >-
          Number of orders per month. This metric counts orders grouped by month extracted from the order timestamp 
          to analyze order volume trends over time. Use this metric for monthly order trending, seasonal order 
          patterns, and order velocity analysis. The result grain is one row per month.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('month', order_tbl.timestamp) AS order_month,
                    COUNT(order_tbl.order_id) AS monthly_order_count
                FROM ecom_bronze.order_tbl AS order_tbl
                GROUP BY DATE_TRUNC('month', order_tbl.timestamp)
                ORDER BY order_month
              columns_used:
                - order_tbl.timestamp
                - order_tbl.order_id