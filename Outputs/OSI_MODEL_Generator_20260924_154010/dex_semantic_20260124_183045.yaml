      - name: revenue_by_customer
        business_name: Revenue by Customer
        description: >-
          Total revenue per customer. This metric sums order total amounts grouped by customer to calculate 
          customer-level revenue. Use this metric for customer revenue ranking, high-value customer identification, 
          and customer segmentation by revenue. The result grain is one row per customer.
        return_type: decimal
        result_grain: one row per customer
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    customer.customer_id,
                    customer.name AS customer_name,
                    SUM(order_tbl.total) AS revenue_by_customer
                FROM ecom_bronze.order_tbl AS order_tbl
                INNER JOIN ecom_bronze.customer AS customer
                    ON order_tbl.customer_id = customer.customer_id
                GROUP BY customer.customer_id, customer.name
              columns_used:
                - order_tbl.total
                - customer.customer_id
                - customer.name

      - name: revenue_by_store
        business_name: Revenue by Store
        description: >-
          Total revenue per store. This metric sums order total amounts grouped by store to calculate store-level 
          revenue. Use this metric for store revenue ranking, store performance comparison, and geographic revenue 
          analysis. The result grain is one row per store.
        return_type: decimal
        result_grain: one row per store
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    store.store_id,
                    store.name AS store_name,
                    SUM(order_tbl.total) AS revenue_by_store
                FROM ecom_bronze.order_tbl AS order_tbl
                INNER JOIN ecom_bronze.store AS store
                    ON order_tbl.store_id = store.store_id
                GROUP BY store.store_id, store.name
              columns_used:
