        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    COUNT(DISTINCT completion_gate.gate_id) AS total_completion_gate_count
                FROM staging.completion_gate AS completion_gate
              columns_used:
                - completion_gate.gate_id

      - name: checked_completion_gate_count
        business_name: Checked Completion Gate Count
        description: >-
          Count of completion gate records that have been checked (is_checked = 1).
          Represents gate checkpoints that have been verified and completed.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    COUNT(DISTINCT completion_gate.gate_id) AS checked_completion_gate_count
                FROM staging.completion_gate AS completion_gate
                WHERE completion_gate.is_checked = 1
              columns_used:
                - completion_gate.gate_id
                - completion_gate.is_checked

      - name: completion_gate_check_rate
        business_name: Completion Gate Check Rate
        description: >-
          Percentage of completion gates that have been checked. Calculated as the count
          of checked gates divided by the total count of gates, expressed as a percentage.
          Measures gate completion progress.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT completion_gate.gate_id) = 0 THEN 0
