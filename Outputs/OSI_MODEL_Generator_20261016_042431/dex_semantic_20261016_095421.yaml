      - name: impact_selection_rate
        business_name: Impact Selection Rate
        description: >-
          Percentage of impact records that have been selected or approved. Calculated as
          the count of selected impacts divided by the total count of impacts, expressed
          as a percentage. Measures impact approval efficiency.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT impact_record.impact_id) = 0 THEN 0
