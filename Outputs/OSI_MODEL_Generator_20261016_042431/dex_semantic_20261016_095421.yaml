                                SUM(CASE WHEN completion_gate.is_checked = 1 THEN 1 ELSE 0 END) AS DECIMAL(18,2)
                            ) / CAST(COUNT(DISTINCT completion_gate.gate_id) AS DECIMAL(18,2)) * 100
                    END AS completion_gate_check_rate
                FROM staging.completion_gate AS completion_gate
              columns_used:
                - completion_gate.gate_id
                - completion_gate.is_checked

      - name: average_gates_per_task
        business_name: Average Gates Per Task
        description: >-
          Average number of completion gates associated with each task. Calculated as the
          total count of gates divided by the total count of tasks. Measures gate checkpoint
          granularity per task.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT task_record.task_id) = 0 THEN 0
                        ELSE
                            CAST(COUNT(DISTINCT completion_gate.gate_id) AS DECIMAL(18,2))
                            / CAST(COUNT(DISTINCT task_record.task_id) AS DECIMAL(18,2))
                    END AS average_gates_per_task
                FROM staging.completion_gate AS completion_gate
                INNER JOIN staging.task_record AS task_record
                    ON completion_gate.task_id = task_record.task_id
              columns_used:
                - completion_gate.gate_id
                - completion_gate.task_id
                - task_record.task_id

      - name: total_audit_event_count
        business_name: Total Audit Event Count
        description: >-
          Total count of all audit event records in the system. Represents the complete
          audit trail of system activity.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    COUNT(DISTINCT audit_event.audit_id) AS total_audit_event_count
                FROM staging.audit_event AS audit_event
              columns_used:
                - audit_event.audit_id

      - name: total_baseline_count
        business_name: Total Baseline Count
        description: >-
          Total count of all baseline records in the system. Represents the complete
          inventory of baseline reference documentation.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    COUNT(DISTINCT baseline_record.baseline_id) AS total_baseline_count
                FROM staging.baseline_record AS baseline_record
              columns_used:
                - baseline_record.baseline_id

      - name: modification_count_by_class
        business_name: Modification Count By Class
        description: >-
          Count of modifications grouped by modification class. Returns one row per
          modification class showing the distribution of modifications across classification
          categories (e.g., Major, Minor).
        return_type: integer
        result_grain: one row per modification class
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    mod_record.mod_class,
                    COUNT(DISTINCT mod_record.mod_id) AS modification_count
                FROM staging.mod_record AS mod_record
                GROUP BY mod_record.mod_class
              columns_used:
                - mod_record.mod_class
                - mod_record.mod_id

      - name: modification_count_by_approval_status
        business_name: Modification Count By Approval Status
        description: >-
          Count of modifications grouped by approval status. Returns one row per approval
          status showing the distribution of modifications across workflow states
          (e.g., Approved, Pending, Rejected).
        return_type: integer
        result_grain: one row per approval status
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    mod_record.approval_status,
                    COUNT(DISTINCT mod_record.mod_id) AS modification_count
                FROM staging.mod_record AS mod_record
                GROUP BY mod_record.approval_status
              columns_used:
                - mod_record.approval_status
                - mod_record.mod_id

      - name: modification_count_by_safety_classification
        business_name: Modification Count By Safety Classification
        description: >-
          Count of modifications grouped by safety classification. Returns one row per
          safety classification showing the distribution of modifications across safety
          criticality levels.
        return_type: integer
        result_grain: one row per safety classification
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    mod_record.safety_classification,
                    COUNT(DISTINCT mod_record.mod_id) AS modification_count
                FROM staging.mod_record AS mod_record
                GROUP BY mod_record.safety_classification
              columns_used:
                - mod_record.safety_classification
                - mod_record.mod_id

      - name: task_count_by_status
        business_name: Task Count By Status
        description: >-
          Count of tasks grouped by task status. Returns one row per task status showing
          the distribution of tasks across execution states (e.g., In Progress, Completed,
          Open, Blocked).
        return_type: integer
        result_grain: one row per task status
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    task_record.status,
                    COUNT(DISTINCT task_record.task_id) AS task_count
                FROM staging.task_record AS task_record
                GROUP BY task_record.status
              columns_used:
                - task_record.status
                - task_record.task_id

      - name: impact_count_by_change_type
        business_name: Impact Count By Change Type
        description: >-
          Count of impact records grouped by change type. Returns one row per change type
          showing the distribution of impacts across change categories (e.g., Design Update,
          Process Change).
        return_type: integer
        result_grain: one row per change type
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    impact_record.change_type,
                    COUNT(DISTINCT impact_record.impact_id) AS impact_count
                FROM staging.impact_record AS impact_record
                GROUP BY impact_record.change_type
              columns_used:
                - impact_record.change_type
                - impact_record.impact_id

      - name: audit_event_count_by_action
        business_name: Audit Event Count By Action
        description: >-
          Count of audit events grouped by action type. Returns one row per action showing
          the distribution of audit events across event types (e.g., RECORD_UPDATED,
          RECORD_CREATED, RECORD_DELETED).
        return_type: integer
        result_grain: one row per action type
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    audit_event.action,
                    COUNT(DISTINCT audit_event.audit_id) AS audit_event_count
                FROM staging.audit_event AS audit_event
                GROUP BY audit_event.action
              columns_used:
                - audit_event.action
                - audit_event.audit_id

      - name: baseline_count_by_topic
        business_name: Baseline Count By Topic
        description: >-
          Count of baseline records grouped by topic. Returns one row per topic showing
          the distribution of baseline documentation across subject areas.
        return_type: integer
        result_grain: one row per topic
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    baseline_record.topic,
                    COUNT(DISTINCT baseline_record.baseline_id) AS baseline_count
                FROM staging.baseline_record AS baseline_record
                GROUP BY baseline_record.topic
              columns_used:
                - baseline_record.topic
                - baseline_record.baseline_id

      - name: modification_count_by_created_month
        business_name: Modification Count By Created Month
        description: >-
          Count of modifications grouped by creation month. Returns one row per month
          showing the time-series distribution of modification creation activity.
          Uses created_date for temporal grouping.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    YEAR(mod_record.created_date) AS created_year,
                    MONTH(mod_record.created_date) AS created_month,
                    COUNT(DISTINCT mod_record.mod_id) AS modification_count
                FROM staging.mod_record AS mod_record
                GROUP BY YEAR(mod_record.created_date), MONTH(mod_record.created_date)
                ORDER BY created_year, created_month
              columns_used:
                - mod_record.created_date
                - mod_record.mod_id

      - name: task_count_by_created_month
        business_name: Task Count By Created Month
        description: >-
          Count of tasks grouped by creation month. Returns one row per month showing
          the time-series distribution of task creation activity. Uses created_date
          for temporal grouping.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    YEAR(task_record.created_date) AS created_year,
                    MONTH(task_record.created_date) AS created_month,
                    COUNT(DISTINCT task_record.task_id) AS task_count
                FROM staging.task_record AS task_record
                GROUP BY YEAR(task_record.created_date), MONTH(task_record.created_date)
                ORDER BY created_year, created_month
              columns_used:
                - task_record.created_date
                - task_record.task_id

      - name: audit_event_count_by_event_date
        business_name: Audit Event Count By Event Date
        description: >-
          Count of audit events grouped by event date. Returns one row per date showing
          the daily distribution of audit activity. Uses event_ts for temporal grouping.
        return_type: integer
        result_grain: one row per date
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    CAST(audit_event.event_ts AS DATE) AS event_date,
                    COUNT(DISTINCT audit_event.audit_id) AS audit_event_count
                FROM staging.audit_event AS audit_event
                GROUP BY CAST(audit_event.event_ts AS DATE)
                ORDER BY event_date
              columns_used:
                - audit_event.event_ts
                - audit_event.audit_id
