                                SUM(CASE WHEN impact_record.is_selected = 1 THEN 1 ELSE 0 END) AS DECIMAL(18,2)
                            ) / CAST(COUNT(DISTINCT impact_record.impact_id) AS DECIMAL(18,2)) * 100
                    END AS impact_selection_rate
                FROM staging.impact_record AS impact_record
              columns_used:
                - impact_record.impact_id
                - impact_record.is_selected

      - name: average_impacts_per_modification
        business_name: Average Impacts Per Modification
        description: >-
          Average number of impact records associated with each modification. Calculated as
          the total count of impacts divided by the total count of modifications. Measures
          impact assessment granularity per modification.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT mod_record.mod_id) = 0 THEN 0
                        ELSE
                            CAST(COUNT(DISTINCT impact_record.impact_id) AS DECIMAL(18,2))
                            / CAST(COUNT(DISTINCT mod_record.mod_id) AS DECIMAL(18,2))
                    END AS average_impacts_per_modification
                FROM staging.impact_record AS impact_record
                INNER JOIN staging.mod_record AS mod_record
                    ON impact_record.mod_id = mod_record.mod_id
              columns_used:
                - impact_record.impact_id
                - impact_record.mod_id
                - mod_record.mod_id

      - name: total_completion_gate_count
        business_name: Total Completion Gate Count
        description: >-
          Total count of all completion gate records in the system. Represents the complete
