version: "1.0"

semantic_model:
  - name: pharma_healthcare_analytics
    description: >-
      Comprehensive semantic model for pharmaceutical healthcare analytics covering drugs, patients, prescribers, 
      pharmacies, prescriptions, and products. This model supports analytical queries across prescription fulfillment, 
      patient care, prescriber behavior, pharmacy operations, drug utilization, and financial performance.
    
    ai_context:
      instructions: >-
        ## Dataset Grain Reference
        
        - **drug**: One row per drug. Grain = drug_id. Contains drug master data including pricing, classification, and manufacturer.
        - **patient**: One row per patient. Grain = patient_id. Contains patient demographics, insurance, and total copay paid.
        - **pharmacy**: One row per pharmacy. Grain = pharmacy_id. Contains pharmacy location, channel, capacity, and operational data.
        - **prescriber**: One row per prescriber. Grain = prescriber_id. Contains prescriber credentials, specialty, and experience.
        - **prescription**: One row per prescription transaction. Grain = prescription_id. Contains prescription details including drug, patient, prescriber, pharmacy, quantities, amounts, and status.
        - **product**: One row per product. Grain = product_id. Contains supplemental product data including category, price, and supplier.
        
        ## Relationship Graph
        
        The prescription dataset is the central fact table connecting:
        - prescription.patient_id → patient.patient_id (many-to-one)
        - prescription.prescriber_id → prescriber.prescriber_id (many-to-one)
        - prescription.drug_id → drug.drug_id (many-to-one)
        - prescription.pharmacy_id → pharmacy.pharmacy_id (many-to-one)
        
        ## Metric Selection Guidance
        
        **Prescription Volume Metrics**: Use prescription dataset with COUNT(prescription_id) or COUNT DISTINCT.
        
        **Financial Metrics**: 
        - Total prescription revenue: SUM(prescription.total_amount)
        - Total copay collected: SUM(prescription.copay_amount)
        - Average prescription value: AVG(prescription.total_amount) or ratio of total amount to prescription count
        - Patient total copay: Use patient.total_copay_paid for patient-level aggregated copay
        
        **Drug Metrics**: 
        - Units prescribed: SUM(prescription.quantity)
        - Average drug price: Use drug.unit_price (master data) or calculate from prescription amounts
        
        **Patient Metrics**: 
        - Patient count: COUNT DISTINCT(patient.patient_id)
        - Prescriptions per patient: COUNT(prescription_id) / COUNT DISTINCT(patient_id)
        
        **Prescriber Metrics**: 
        - Prescriber count: COUNT DISTINCT(prescriber.prescriber_id)
        - Prescriptions per prescriber: COUNT(prescription_id) / COUNT DISTINCT(prescriber_id)
        
        **Pharmacy Metrics**: 
        - Pharmacy count: COUNT DISTINCT(pharmacy.pharmacy_id)
        - Prescriptions per pharmacy: COUNT(prescription_id) / COUNT DISTINCT(pharmacy_id)
        - Pharmacy utilization: Compare prescription volume to pharmacy.daily_capacity
        
        ## Join Guidance
        
        **Standard Joins**: All relationships from prescription to dimension tables (patient, prescriber, drug, pharmacy) are standard many-to-one equality joins.
        
        **Avoid Double Counting**: 
        - When joining prescription to patient, prescriber, drug, or pharmacy, prescription-level measures (total_amount, copay_amount, quantity) can be safely aggregated.
        - Patient-level aggregated measure patient.total_copay_paid should NOT be summed after joining from prescription to patient, as this would duplicate the patient's total across all their prescriptions.
        - To analyze patient.total_copay_paid, query directly from the patient dataset or use it in patient-grain queries only.
        
        ## Time Analysis
        
        **Prescription Timestamp**: Use prescription.rx_timestamp for time-based analysis of prescription creation, volume trends, and temporal patterns.
        
        **Patient Registration Date**: Use patient.registration_date for patient acquisition analysis and cohort analysis.
        
        **Pharmacy Open Date**: Use pharmacy.open_date for pharmacy operational history and tenure analysis.
        
        **Time Dimensions**: 
        - prescription.rx_timestamp is the primary time dimension for prescription transaction analysis.
        - Extract day, month, quarter, year from rx_timestamp for period-based aggregations.
        
        ## Dimensional Analysis
        
        **Drug Dimensions**: 
        - drug.therapeutic_class: Analyze prescriptions by therapeutic category
        - drug.form: Analyze by dosage form (Tablet, Capsule, etc.)
        - drug.schedule: Analyze controlled substance prescriptions
        - drug.manufacturer: Analyze by drug manufacturer
        
        **Patient Dimensions**: 
        - patient.gender: Analyze prescriptions by patient gender
        - patient.insurance_type: Analyze by insurance coverage type
        - patient.chronic_condition: Analyze prescriptions for patients with specific chronic conditions
        
        **Prescriber Dimensions**: 
        - prescriber.specialty: Analyze prescriptions by prescriber clinical specialty
        - prescriber.license_state: Analyze by prescriber jurisdiction
        - prescriber.active_flag: Filter for active prescribers
        
        **Pharmacy Dimensions**: 
        - pharmacy.city: Analyze prescriptions by pharmacy city
        - pharmacy.state: Analyze prescriptions by pharmacy state
        - pharmacy.channel: Analyze by distribution channel (Retail, Mail Order, etc.)
        
        **Prescription Dimensions**: 
        - prescription.status: Analyze by prescription status (Filled, Pending, Cancelled, etc.)
        
        ## Query Restrictions and Considerations
        
        **PII Handling**: Many fields are marked as PII (patient identifiers, patient names, patient contact info, patient health conditions, prescriber identifiers, prescriber names, prescriber NPI, copay amounts). Ensure appropriate access controls and anonymization when querying PII fields.
        
        **Refill Logic**: prescription.refill_number indicates the current refill sequence. prescription.refills_allowed indicates total authorized refills. Analyze refill patterns by comparing refill_number to refills_allowed.
        
        **Days Supply**: prescription.days_supply indicates the intended duration. Use this to calculate adherence metrics or project refill dates.
        
        **Prior Authorization**: drug.requires_prior_auth indicates drugs requiring payer authorization. Use this to analyze prior auth impact on prescription patterns.
        
        **Pharmacy Capacity**: pharmacy.daily_capacity represents maximum daily prescription processing capacity. Compare actual prescription volume to capacity to identify utilization and bottlenecks.
        
        **Prescriber Experience**: prescriber.years_experience can be used to analyze prescription patterns by prescriber tenure.
        
        **Product Dataset**: The product dataset appears to contain supplemental product data (supplements, non-prescription items) and is not directly linked to the prescription dataset via explicit foreign keys. Use product data independently for product catalog analysis.

    datasets:
      - name: drug
        business_name: Drug Master
        description: >-
          Drug master dataset containing one row per drug. Includes drug identification, brand and generic names, 
          therapeutic classification, dosage form and strength, unit pricing, controlled substance schedule, 
          manufacturer information, and prior authorization requirements. This dataset serves as the drug dimension 
          for prescription analysis.
        source: pharma_bronze.drug
        primary_key:
          - drug_id
        fields:
          - name: drug_id
            business_name: Drug Identifier
            description: Unique identifier for the drug record.
            sql_type: VARCHAR(50)
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: name
            business_name: Drug Brand Name
            description: Brand name of the drug.
            sql_type: VARCHAR(200)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: generic_name
            business_name: Generic Drug Name
            description: Generic or non-branded name of the drug.
            sql_type: VARCHAR(200)
            dimension:
              is_categorical: true
          
          - name: therapeutic_class
            business_name: Therapeutic Class
            description: >-
              Therapeutic class or category describing the drug's primary clinical use. 
              Key dimension for analyzing prescriptions by therapeutic area.
            sql_type: VARCHAR(100)
            dimension:
              is_categorical: true
          
          - name: form
            business_name: Dosage Form
            description: >-
              Dosage form in which the drug is administered (e.g., Tablet, Capsule, Injection, Liquid). 
              Key dimension for analyzing prescription patterns by administration method.
            sql_type: pharma_bronze.drug_form_enum
            dimension:
              is_categorical: true
          
          - name: strength
            business_name: Drug Strength
            description: Concentration or strength of the drug dose (e.g., 20 mg, 500 mg).
            sql_type: VARCHAR(50)
            dimension:
              is_categorical: true
          
          - name: unit_price
            business_name: Drug Unit Price
            description: >-
              Monetary amount representing the price per unit of the drug. 
              This is the master drug price and should be used for drug-level pricing analysis.
            sql_type: NUMERIC(10,2)
            measure:
              aggregation: AVG
          
          - name: schedule
            business_name: Controlled Substance Schedule
            description: >-
              Controlled substance schedule classification for the drug (e.g., Schedule II, Schedule III, Non-controlled). 
              Key dimension for analyzing controlled substance prescriptions and regulatory compliance.
            sql_type: pharma_bronze.drug_schedule_enum
            dimension:
              is_categorical: true
          
          - name: manufacturer
            business_name: Drug Manufacturer
            description: >-
              Name of the organization that manufactures the drug. 
              Key dimension for analyzing prescriptions by manufacturer.
            sql_type: VARCHAR(200)
            dimension:
              is_categorical: true
          
          - name: requires_prior_auth
            business_name: Requires Prior Authorization
            description: >-
              Indicates whether the drug requires prior authorization from the payer. 
              Key dimension for analyzing prior authorization impact on prescription fulfillment.
            sql_type: BOOLEAN
            constraints:
              - DEFAULT true
            dimension:
              is_categorical: true

      - name: patient
        business_name: Patient Master
        description: >-
          Patient master dataset containing one row per patient. Includes patient identification, demographics 
          (name, date of birth, gender), contact information (email, phone), insurance type, registration date, 
          chronic condition information, and total copay paid. This dataset serves as the patient dimension for 
          prescription analysis. Note: Many fields are marked as PII and require appropriate access controls.
        source: pharma_bronze.patient
        primary_key:
          - patient_id
        fields:
          - name: patient_id
            business_name: Patient Identifier
            description: Unique identifier for the patient. PII field.
            sql_type: VARCHAR(50)
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - PII
          
          - name: name
            business_name: Patient Name
            description: Full name of the patient. PII field.
            sql_type: VARCHAR(200)
            constraints:
              - NOT NULL
              - PII
          
          - name: dob
            business_name: Date of Birth
            description: Date of birth of the patient. PII field.
            sql_type: DATE
            constraints:
              - PII
            dimension:
              is_time: true
          
          - name: gender
            business_name: Patient Gender
            description: >-
              Recorded gender of the patient. PII field. 
              Key dimension for analyzing prescription patterns by patient gender.
            sql_type: pharma_bronze.gender_enum
            constraints:
              - PII
            dimension:
              is_categorical: true
          
          - name: email
            business_name: Patient Email
            description: Email address used to contact the patient. PII field.
            sql_type: VARCHAR(255)
            constraints:
              - PII
          
          - name: phone
            business_name: Patient Phone
            description: Phone number used to contact the patient. PII field.
            sql_type: VARCHAR(30)
            constraints:
              - PII
          
          - name: insurance_type
            business_name: Insurance Type
            description: >-
              Type of insurance coverage associated with the patient (e.g., Commercial, Medicare, Medicaid). PII field. 
              Key dimension for analyzing prescription patterns and financial metrics by insurance type.
            sql_type: pharma_bronze.insurance_type_enum
            constraints:
              - PII
            dimension:
              is_categorical: true
          
          - name: registration_date
            business_name: Patient Registration Date
            description: >-
              Date when the patient was registered in the system. PII field. 
              Use this date for patient acquisition analysis and cohort analysis.
            sql_type: DATE
            constraints:
              - PII
            dimension:
              is_time: true
          
          - name: chronic_condition
            business_name: Chronic Condition
            description: >-
              Description of any primary chronic medical condition recorded for the patient. PII field. 
              Key dimension for analyzing prescriptions for patients with specific chronic conditions.
            sql_type: VARCHAR(100)
            constraints:
              - PII
            dimension:
              is_categorical: true
          
          - name: total_copay_paid
            business_name: Total Patient Copay Paid
            description: >-
              Total monetary amount of copays paid by the patient across all prescriptions. PII field. 
              This is a patient-level aggregated measure. Do NOT sum this field after joining from prescription to patient, 
              as this would duplicate the patient's total across all their prescriptions. Use this field only in patient-grain queries.
            sql_type: NUMERIC(12,2)
            constraints:
              - DEFAULT 0
              - PII
            measure:
              aggregation: SUM
              aggregation_note: Use only at patient grain to avoid double counting

      - name: pharmacy
        business_name: Pharmacy Master
        description: >-
          Pharmacy master dataset containing one row per pharmacy. Includes pharmacy identification, legal name, 
          location (city, state), distribution channel, operational start date, and daily processing capacity. 
          This dataset serves as the pharmacy dimension for prescription fulfillment analysis.
        source: pharma_bronze.pharmacy
        primary_key:
          - pharmacy_id
        fields:
          - name: pharmacy_id
            business_name: Pharmacy Identifier
            description: Unique identifier for the pharmacy.
            sql_type: VARCHAR(50)
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: name
            business_name: Pharmacy Name
            description: Legal or trading name of the pharmacy.
            sql_type: VARCHAR(200)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: city
            business_name: Pharmacy City
            description: >-
              City where the pharmacy is located. 
              Key dimension for geographic analysis of prescription fulfillment.
            sql_type: VARCHAR(100)
            dimension:
              is_categorical: true
          
          - name: state
            business_name: Pharmacy State
            description: >-
              State or province where the pharmacy is located. 
              Key dimension for geographic analysis of prescription fulfillment.
            sql_type: VARCHAR(10)
            dimension:
              is_categorical: true
          
          - name: channel
            business_name: Distribution Channel
            description: >-
              Distribution channel classification for the pharmacy (e.g., Retail, Mail Order, Specialty). 
              Key dimension for analyzing prescription fulfillment by channel.
            sql_type: pharma_bronze.channel_enum
            dimension:
              is_categorical: true
          
          - name: open_date
            business_name: Pharmacy Open Date
            description: >-
              Date when the pharmacy began operations. 
              Use this date for pharmacy operational history and tenure analysis.
            sql_type: DATE
            dimension:
              is_time: true
          
          - name: daily_capacity
            business_name: Daily Prescription Capacity
            description: >-
              Maximum number of prescriptions the pharmacy can process per day. 
              Use this to calculate pharmacy utilization by comparing actual prescription volume to capacity.
            sql_type: INTEGER
            measure:
              aggregation: SUM

      - name: prescriber
        business_name: Prescriber Master
        description: >-
          Prescriber master dataset containing one row per prescriber. Includes prescriber identification, name, 
          clinical specialty, National Provider Identifier (NPI), license state, years of experience, and active status. 
          This dataset serves as the prescriber dimension for prescription analysis. Note: Many fields are marked as PII.
        source: pharma_bronze.prescriber
        primary_key:
          - prescriber_id
        fields:
          - name: prescriber_id
            business_name: Prescriber Identifier
            description: Unique identifier for the prescriber. PII field.
            sql_type: VARCHAR(50)
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - PII
          
          - name: name
            business_name: Prescriber Name
            description: Full name of the prescriber. PII field.
            sql_type: VARCHAR(200)
            constraints:
              - NOT NULL
              - PII
          
          - name: specialty
            business_name: Prescriber Specialty
            description: >-
              Clinical specialty area of the prescriber (e.g., Cardiology, Endocrinology, Family Medicine). PII field. 
              Key dimension for analyzing prescription patterns by prescriber specialty.
            sql_type: pharma_bronze.specialty_enum
            constraints:
              - PII
            dimension:
              is_categorical: true
          
          - name: npi_number
            business_name: National Provider Identifier
            description: >-
              National Provider Identifier assigned to the prescriber. PII field. 
              Unique healthcare provider identifier used for regulatory and billing purposes.
            sql_type: VARCHAR(20)
            constraints:
              - PII
          
          - name: license_state
            business_name: Prescriber License State
            description: >-
              State or jurisdiction where the prescriber is licensed. PII field. 
              Key dimension for analyzing prescriptions by prescriber jurisdiction.
            sql_type: VARCHAR(10)
            constraints:
              - PII
            dimension:
              is_categorical: true
          
          - name: years_experience
            business_name: Years of Experience
            description: >-
              Number of years of professional experience the prescriber has. 
              Use this to analyze prescription patterns by prescriber tenure and experience level.
            sql_type: INTEGER
            measure:
              aggregation: AVG
          
          - name: active_flag
            business_name: Prescriber Active Flag
            description: >-
              Indicates whether the prescriber is currently active. 
              Use this to filter for active prescribers in prescription analysis.
            sql_type: BOOLEAN
            constraints:
              - DEFAULT true
            dimension:
              is_categorical: true

      - name: prescription
        business_name: Prescription Transactions
        description: >-
          Prescription transaction dataset containing one row per prescription. This is the central fact table 
          connecting patients, prescribers, drugs, and pharmacies. Includes prescription identification, timestamp, 
          foreign key references to patient, prescriber, drug, and pharmacy, quantity and days supply, refill information, 
          financial amounts (total amount and copay), and prescription status. This dataset is the primary source for 
          prescription volume, financial, and operational metrics.
        source: pharma_bronze.prescription
        primary_key:
          - prescription_id
        fields:
          - name: prescription_id
            business_name: Prescription Identifier
            description: Unique identifier for the prescription record.
            sql_type: VARCHAR(50)
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: rx_timestamp
            business_name: Prescription Timestamp
            description: >-
              Timestamp recording when the prescription was created or written. 
              This is the primary time dimension for prescription transaction analysis. 
              Use this field for time-based analysis of prescription volume, trends, and temporal patterns.
            sql_type: TIMESTAMP
            dimension:
              is_time: true
          
          - name: patient_id
            business_name: Patient Reference
            description: >-
              References the related patient record for whom the prescription is written. 
              Foreign key to patient.patient_id. PII field.
            sql_type: VARCHAR(50)
            constraints:
              - FOREIGN KEY
              - PII
          
          - name: prescriber_id
            business_name: Prescriber Reference
            description: >-
              References the related prescriber who authored the prescription. 
              Foreign key to prescriber.prescriber_id. PII field.
            sql_type: VARCHAR(50)
            constraints:
              - FOREIGN KEY
              - PII
          
          - name: drug_id
            business_name: Drug Reference
            description: >-
              References the related drug that is prescribed. 
              Foreign key to drug.drug_id.
            sql_type: VARCHAR(50)
            constraints:
              - FOREIGN KEY
          
          - name: pharmacy_id
            business_name: Pharmacy Reference
            description: >-
              References the pharmacy that will dispense the prescription. 
              Foreign key to pharmacy.pharmacy_id.
            sql_type: VARCHAR(50)
            constraints:
              - FOREIGN KEY
          
          - name: quantity
            business_name: Prescription Quantity
            description: >-
              Number of units of the drug prescribed. 
              Key measure for analyzing prescription volume and drug utilization.
            sql_type: INTEGER
            measure:
              aggregation: SUM
          
          - name: days_supply
            business_name: Days Supply
            description: >-
              Number of days the prescribed quantity is intended to cover. 
              Use this to calculate adherence metrics or project refill dates.
            sql_type: INTEGER
            measure:
              aggregation: AVG
          
          - name: refills_allowed
            business_name: Refills Allowed
            description: >-
              Total number of refills authorized for the prescription. 
              Use this with refill_number to analyze refill patterns and authorization limits.
            sql_type: INTEGER
            measure:
              aggregation: AVG
          
          - name: refill_number
            business_name: Refill Number
            description: >-
              Sequence number of the current refill for the prescription. 
              Use this with refills_allowed to analyze refill patterns and identify initial fills vs. refills.
            sql_type: INTEGER
            measure:
              aggregation: AVG
          
          - name: total_amount
            business_name: Total Prescription Amount
            description: >-
              Monetary amount representing the total cost of the prescription. 
              Key measure for prescription revenue and financial analysis. 
              This is a prescription-level measure and can be safely aggregated after joining to dimension tables.
            sql_type: NUMERIC(10,2)
            measure:
              aggregation: SUM
          
          - name: copay_amount
            business_name: Prescription Copay Amount
            description: >-
              Monetary amount representing the patient's copay for the prescription. PII field. 
              Key measure for patient out-of-pocket cost analysis. 
              This is a prescription-level measure and can be safely aggregated after joining to dimension tables.
            sql_type: NUMERIC(10,2)
            constraints:
              - PII
            measure:
              aggregation: SUM
          
          - name: status
            business_name: Prescription Status
            description: >-
              Indicates the current processing status of the prescription (e.g., Filled, Pending, Cancelled). 
              Key dimension for analyzing prescription fulfillment and operational metrics.
            sql_type: pharma_bronze.rx_status_enum
            dimension:
              is_categorical: true

      - name: product
        business_name: Product Catalog
        description: >-
          Product catalog dataset containing one row per product. Includes product identification, name, category, 
          price, origin, organic certification, and supplier reference. This dataset appears to contain supplemental 
          product data (supplements, non-prescription items) and is not directly linked to the prescription dataset. 
          Use this dataset independently for product catalog analysis.
        source: pharma_bronze.product
        fields:
          - name: product_id
            business_name: Product Identifier
            description: Identifier for the product record.
            sql_type: TEXT
          
          - name: name
            business_name: Product Name
            description: Descriptive name of the product.
            sql_type: TEXT
            dimension:
              is_categorical: true
          
          - name: category
            business_name: Product Category
            description: >-
              Product category used for classification and reporting (e.g., Supplements, Vitamins, Personal Care). 
              Key dimension for product catalog analysis.
            sql_type: TEXT
            dimension:
              is_categorical: true
          
          - name: price
            business_name: Product Price
            description: Monetary amount representing the unit price of the product.
            sql_type: FLOAT
            measure:
              aggregation: AVG
          
          - name: origin
            business_name: Product Origin
            description: >-
              Country or region where the product originates or is manufactured. 
              Key dimension for analyzing products by origin.
            sql_type: TEXT
            dimension:
              is_categorical: true
          
          - name: is_organic
            business_name: Organic Certification
            description: Indicates whether the product is certified organic.
            sql_type: BOOLEAN
            dimension:
              is_categorical: true
          
          - name: supplier_id
            business_name: Supplier Identifier
            description: Identifier for the supplier providing the product.
            sql_type: TEXT

    relationships:
      - name: prescription_to_patient
        left_dataset: prescription
        right_dataset: patient
        relationship_type: many_to_one
        join:
          left:
            - patient_id
          right:
            - patient_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship from prescription to patient. Each prescription is written for exactly one patient. 
          A patient may have multiple prescriptions over time. Join on prescription.patient_id = patient.patient_id. 
          When aggregating prescription-level measures (total_amount, copay_amount, quantity) after this join, aggregation is safe. 
          However, do NOT sum patient.total_copay_paid after this join, as this would duplicate the patient's total copay across 
          all their prescriptions.

      - name: prescription_to_prescriber
        left_dataset: prescription
        right_dataset: prescriber
        relationship_type: many_to_one
        join:
          left:
            - prescriber_id
          right:
            - prescriber_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship from prescription to prescriber. Each prescription is authored by exactly one prescriber. 
          A prescriber may author multiple prescriptions. Join on prescription.prescriber_id = prescriber.prescriber_id. 
          Prescription-level measures can be safely aggregated after this join.

      - name: prescription_to_drug
        left_dataset: prescription
        right_dataset: drug
        relationship_type: many_to_one
        join:
          left:
            - drug_id
          right:
            - drug_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship from prescription to drug. Each prescription prescribes exactly one drug. 
          A drug may be prescribed in multiple prescriptions. Join on prescription.drug_id = drug.drug_id. 
          Prescription-level measures can be safely aggregated after this join. Use drug.unit_price for drug master pricing 
          and prescription.total_amount for actual prescription pricing.

      - name: prescription_to_pharmacy
        left_dataset: prescription
        right_dataset: pharmacy
        relationship_type: many_to_one
        join:
          left:
            - pharmacy_id
          right:
            - pharmacy_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship from prescription to pharmacy. Each prescription is dispensed by exactly one pharmacy. 
          A pharmacy may dispense multiple prescriptions. Join on prescription.pharmacy_id = pharmacy.pharmacy_id. 
          Prescription-level measures can be safely aggregated after this join. Use pharmacy.daily_capacity to calculate 
          pharmacy utilization metrics.

    metrics:
      - name: total_prescription_count
        business_name: Total Prescription Count
        description: >-
          Total number of prescription transactions. Counts all prescription records regardless of status. 
          Use this metric for overall prescription volume analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(prescription.prescription_id) AS total_prescription_count
                FROM pharma_bronze.prescription AS prescription
              columns_used:
                - prescription.prescription_id

      - name: total_prescription_revenue
        business_name: Total Prescription Revenue
        description: >-
          Total monetary amount of all prescriptions. Sums the total_amount field across all prescription records. 
          This represents the total prescription revenue including both patient copay and insurance payment.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(prescription.total_amount) AS total_prescription_revenue
                FROM pharma_bronze.prescription AS prescription
              columns_used:
                - prescription.total_amount

      - name: total_copay_collected
        business_name: Total Copay Collected
        description: >-
          Total monetary amount of patient copays collected across all prescriptions. Sums the copay_amount field 
          from prescription records. This represents the total out-of-pocket cost paid by patients.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(prescription.copay_amount) AS total_copay_collected
                FROM pharma_bronze.prescription AS prescription
              columns_used:
                - prescription.copay_amount

      - name: total_units_prescribed
        business_name: Total Units Prescribed
        description: >-
          Total number of drug units prescribed across all prescriptions. Sums the quantity field from prescription records. 
          Use this metric for drug utilization and inventory analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(prescription.quantity) AS total_units_prescribed
                FROM pharma_bronze.prescription AS prescription
              columns_used:
                - prescription.quantity

      - name: average_prescription_value
        business_name: Average Prescription Value
        description: >-
          Average monetary value per prescription. Calculated as the ratio of total prescription revenue to total prescription count. 
          Use this metric to analyze average prescription pricing and trends.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(prescription.prescription_id) = 0 THEN 0
                        ELSE SUM(prescription.total_amount) / COUNT(prescription.prescription_id)
                    END AS average_prescription_value
                FROM pharma_bronze.prescription AS prescription
              columns_used:
                - prescription.prescription_id
                - prescription.total_amount

      - name: average_copay_amount
        business_name: Average Copay Amount
        description: >-
          Average patient copay per prescription. Calculated as the ratio of total copay collected to total prescription count. 
          Use this metric to analyze average patient out-of-pocket costs.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(prescription.prescription_id) = 0 THEN 0
                        ELSE SUM(prescription.copay_amount) / COUNT(prescription.prescription_id)
                    END AS average_copay_amount
                FROM pharma_bronze.prescription AS prescription
              columns_used:
                - prescription.prescription_id
                - prescription.copay_amount

      - name: patient_count
        business_name: Total Patient Count
        description: >-
          Total number of unique patients. Counts distinct patient_id values from the patient dataset. 
          Use this metric for patient population analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(DISTINCT patient.patient_id) AS patient_count
                FROM pharma_bronze.patient AS patient
              columns_used:
                - patient.patient_id

      - name: prescriber_count
        business_name: Total Prescriber Count
        description: >-
          Total number of unique prescribers. Counts distinct prescriber_id values from the prescriber dataset. 
          Use this metric for prescriber network analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(DISTINCT prescriber.prescriber_id) AS prescriber_count
                FROM pharma_bronze.prescriber AS prescriber
              columns_used:
                - prescriber.prescriber_id

      - name: pharmacy_count
        business_name: Total Pharmacy Count
        description: >-
          Total number of unique pharmacies. Counts distinct pharmacy_id values from the pharmacy dataset. 
          Use this metric for pharmacy network analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(DISTINCT pharmacy.pharmacy_id) AS pharmacy_count
                FROM pharma_bronze.pharmacy AS pharmacy
              columns_used:
                - pharmacy.pharmacy_id

      - name: drug_count
        business_name: Total Drug Count
        description: >-
          Total number of unique drugs in the drug master. Counts distinct drug_id values from the drug dataset. 
          Use this metric for drug formulary analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(DISTINCT drug.drug_id) AS drug_count
                FROM pharma_bronze.drug AS drug
              columns_used:
                - drug.drug_id

      - name: prescriptions_per_patient
        business_name: Average Prescriptions per Patient
        description: >-
          Average number of prescriptions per patient. Calculated as the ratio of total prescription count to 
          distinct patient count from prescriptions. Use this metric to analyze patient prescription frequency and engagement.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT prescription.patient_id) = 0 THEN 0
                        ELSE COUNT(prescription.prescription_id)::DECIMAL / COUNT(DISTINCT prescription.patient_id)
                    END AS prescriptions_per_patient
                FROM pharma_bronze.prescription AS prescription
              columns_used:
                - prescription.prescription_id
                - prescription.patient_id

      - name: prescriptions_per_prescriber
        business_name: Average Prescriptions per Prescriber
        description: >-
          Average number of prescriptions per prescriber. Calculated as the ratio of total prescription count to 
          distinct prescriber count from prescriptions. Use this metric to analyze prescriber productivity and activity.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT prescription.prescriber_id) = 0 THEN 0
                        ELSE COUNT(prescription.prescription_id)::DECIMAL / COUNT(DISTINCT prescription.prescriber_id)
                    END AS prescriptions_per_prescriber
                FROM pharma_bronze.prescription AS prescription
              columns_used:
                - prescription.prescription_id
                - prescription.prescriber_id

      - name: prescriptions_per_pharmacy
        business_name: Average Prescriptions per Pharmacy
        description: >-
          Average number of prescriptions per pharmacy. Calculated as the ratio of total prescription count to 
          distinct pharmacy count from prescriptions. Use this metric to analyze pharmacy workload and distribution.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT prescription.pharmacy_id) = 0 THEN 0
                        ELSE COUNT(prescription.prescription_id)::DECIMAL / COUNT(DISTINCT prescription.pharmacy_id)
                    END AS prescriptions_per_pharmacy
                FROM pharma_bronze.prescription AS prescription
              columns_used:
                - prescription.prescription_id
                - prescription.pharmacy_id

      - name: filled_prescription_count
        business_name: Filled Prescription Count
        description: >-
          Total number of prescriptions with status 'Filled'. Counts prescription records where status equals 'Filled'. 
          Use this metric to analyze successfully fulfilled prescriptions.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(prescription.prescription_id) AS filled_prescription_count
                FROM pharma_bronze.prescription AS prescription
                WHERE prescription.status = 'Filled'
              columns_used:
                - prescription.prescription_id
                - prescription.status

      - name: average_days_supply
        business_name: Average Days Supply
        description: >-
          Average number of days supply per prescription. Calculates the mean of days_supply across all prescriptions. 
          Use this metric to analyze prescription duration patterns.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(prescription.days_supply) AS average_days_supply
                FROM pharma_bronze.prescription AS prescription
              columns_used:
                - prescription.days_supply

      - name: average_refills_allowed
        business_name: Average Refills Allowed
        description: >-
          Average number of refills allowed per prescription. Calculates the mean of refills_allowed across all prescriptions. 
          Use this metric to analyze refill authorization patterns.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(prescription.refills_allowed) AS average_refills_allowed
                FROM pharma_bronze.prescription AS prescription
              columns_used:
                - prescription.refills_allowed

      - name: total_pharmacy_capacity
        business_name: Total Pharmacy Capacity
        description: >-
          Total daily prescription processing capacity across all pharmacies. Sums the daily_capacity field from pharmacy records. 
          Use this metric to analyze network capacity and compare to actual prescription volume.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(pharmacy.daily_capacity) AS total_pharmacy_capacity
                FROM pharma_bronze.pharmacy AS pharmacy
              columns_used:
                - pharmacy.daily_capacity

      - name: average_drug_unit_price
        business_name: Average Drug Unit Price
        description: >-
          Average unit price across all drugs in the drug master. Calculates the mean of unit_price from drug records. 
          Use this metric to analyze drug pricing trends at the formulary level.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(drug.unit_price) AS average_drug_unit_price
                FROM pharma_bronze.drug AS drug
              columns_used:
                - drug.unit_price

      - name: active_prescriber_count
        business_name: Active Prescriber Count
        description: >-
          Total number of active prescribers. Counts prescribers where active_flag is true. 
          Use this metric to analyze the active prescriber network.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(prescriber.prescriber_id) AS active_prescriber_count
                FROM pharma_bronze.prescriber AS prescriber
                WHERE prescriber.active_flag = true
              columns_used:
                - prescriber.prescriber_id
                - prescriber.active_flag

      - name: average_prescriber_experience
        business_name: Average Prescriber Experience
        description: >-
          Average years of experience across all prescribers. Calculates the mean of years_experience from prescriber records. 
          Use this metric to analyze prescriber network experience and tenure.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(prescriber.years_experience) AS average_prescriber_experience
                FROM pharma_bronze.prescriber AS prescriber
              columns_used:
                - prescriber.years_experience

      - name: prescription_revenue_by_month
        business_name: Monthly Prescription Revenue
        description: >-
          Total prescription revenue aggregated by month. Groups prescriptions by month extracted from rx_timestamp 
          and sums total_amount. Use this metric for time-series revenue analysis and trend identification.
        return_type: currency_usd
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('month', prescription.rx_timestamp) AS month,
                    SUM(prescription.total_amount) AS prescription_revenue_by_month
                FROM pharma_bronze.prescription AS prescription
                GROUP BY DATE_TRUNC('month', prescription.rx_timestamp)
                ORDER BY month
              columns_used:
                - prescription.rx_timestamp
                - prescription.total_amount

      - name: prescription_count_by_therapeutic_class
        business_name: Prescription Count by Therapeutic Class
        description: >-
          Total prescription count grouped by drug therapeutic class. Joins prescription to drug and groups by 
          drug.therapeutic_class. Use this metric to analyze prescription volume by therapeutic area.
        return_type: integer
        result_grain: one row per therapeutic class
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    drug.therapeutic_class,
                    COUNT(prescription.prescription_id) AS prescription_count_by_therapeutic_class
                FROM pharma_bronze.prescription AS prescription
                INNER JOIN pharma_bronze.drug AS drug
                    ON prescription.drug_id = drug.drug_id
                GROUP BY drug.therapeutic_class
                ORDER BY prescription_count_by_therapeutic_class DESC
              columns_used:
                - prescription.prescription_id
                - prescription.drug_id
                - drug.drug_id
                - drug.therapeutic_class

      - name: prescription_revenue_by_insurance_type
        business_name: Prescription Revenue by Insurance Type
        description: >-
          Total prescription revenue grouped by patient insurance type. Joins prescription to patient and groups by 
          patient.insurance_type. Use this metric to analyze revenue distribution across insurance types.
        return_type: currency_usd
        result_grain: one row per insurance type
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    patient.insurance_type,
                    SUM(prescription.total_amount) AS prescription_revenue_by_insurance_type
                FROM pharma_bronze.prescription AS prescription
                INNER JOIN pharma_bronze.patient AS patient
                    ON prescription.patient_id = patient.patient_id
                GROUP BY patient.insurance_type
                ORDER BY prescription_revenue_by_insurance_type DESC
              columns_used:
                - prescription.patient_id
                - prescription.total_amount
                - patient.patient_id
                - patient.insurance_type

      - name: prescription_count_by_prescriber_specialty
        business_name: Prescription Count by Prescriber Specialty
        description: >-
          Total prescription count grouped by prescriber specialty. Joins prescription to prescriber and groups by 
          prescriber.specialty. Use this metric to analyze prescription volume by prescriber clinical specialty.
        return_type: integer
        result_grain: one row per prescriber specialty
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    prescriber.specialty,
                    COUNT(prescription.prescription_id) AS prescription_count_by_prescriber_specialty
                FROM pharma_bronze.prescription AS prescription
                INNER JOIN pharma_bronze.prescriber AS prescriber
                    ON prescription.prescriber_id = prescriber.prescriber_id
                GROUP BY prescriber.specialty
                ORDER BY prescription_count_by_prescriber_specialty DESC
              columns_used:
                - prescription.prescription_id
                - prescription.prescriber_id
                - prescriber.prescriber_id
                - prescriber.specialty

      - name: prescription_count_by_pharmacy_channel
        business_name: Prescription Count by Pharmacy Channel
        description: >-
          Total prescription count grouped by pharmacy distribution channel. Joins prescription to pharmacy and groups by 
          pharmacy.channel. Use this metric to analyze prescription fulfillment volume by channel (Retail, Mail Order, etc.).
        return_type: integer
        result_grain: one row per pharmacy channel
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    pharmacy.channel,
                    COUNT(prescription.prescription_id) AS prescription_count_by_pharmacy_channel
                FROM pharma_bronze.prescription AS prescription
                INNER JOIN pharma_bronze.pharmacy AS pharmacy
                    ON prescription.pharmacy_id = pharmacy.pharmacy_id
                GROUP BY pharmacy.channel
                ORDER BY prescription_count_by_pharmacy_channel DESC
              columns_used:
                - prescription.prescription_id
                - prescription.pharmacy_id
                - pharmacy.pharmacy_id
                - pharmacy.channel

      - name: prescription_count_by_state
        business_name: Prescription Count by State
        description: >-
          Total prescription count grouped by pharmacy state. Joins prescription to pharmacy and groups by 
          pharmacy.state. Use this metric for geographic analysis of prescription fulfillment.
        return_type: integer
        result_grain: one row per state
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    pharmacy.state,
                    COUNT(prescription.prescription_id) AS prescription_count_by_state
                FROM pharma_bronze.prescription AS prescription
                INNER JOIN pharma_bronze.pharmacy AS pharmacy
                    ON prescription.pharmacy_id = pharmacy.pharmacy_id
                GROUP BY pharmacy.state
                ORDER BY prescription_count_by_state DESC
              columns_used:
                - prescription.prescription_id
                - prescription.pharmacy_id
                - pharmacy.pharmacy_id
                - pharmacy.state

      - name: copay_percentage
        business_name: Copay Percentage of Total
        description: >-
          Percentage of total prescription amount represented by patient copay. Calculated as the ratio of total copay 
          collected to total prescription revenue, expressed as a percentage. Use this metric to analyze patient 
          out-of-pocket burden relative to total prescription cost.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN SUM(prescription.total_amount) = 0 THEN 0
                        ELSE (SUM(prescription.copay_amount) / SUM(prescription.total_amount)) * 100
                    END AS copay_percentage
                FROM pharma_bronze.prescription AS prescription
              columns_used:
                - prescription.total_amount
                - prescription.copay_amount
