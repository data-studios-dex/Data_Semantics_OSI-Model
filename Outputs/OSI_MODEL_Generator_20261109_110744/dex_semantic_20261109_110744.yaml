version: "1.0"

semantic_model:
  - name: ecom_retail_analytics
    description: >-
      Comprehensive semantic model for retail e-commerce analytics covering customers, orders, 
      products, payments, and shipments. This model supports revenue analysis, customer behavior 
      analysis, product performance tracking, order fulfillment metrics, and payment processing analytics.
      
      The model is designed for analytical queries across customer segments, product categories, 
      sales channels, order statuses, and time-based analysis.
    
    ai_context:
      instructions: >-
        ## Dataset Grain Reference
        
        - **customers**: One row per customer. Use for customer-level analysis and customer counts.
        
        - **orders**: One row per order. Use for order-level metrics such as order count, total order amount, 
          average order value, and order-level revenue analysis.
        
        - **order_items**: One row per order line item. Multiple rows per order. Use for product-level 
          analysis, line-item revenue, and detailed product sales analysis.
        
        - **products**: One row per product. Use for product catalog analysis and product attributes.
        
        - **product_categories**: One row per product category. Contains hierarchical category structure 
          with parent_category_id enabling category hierarchy traversal.
        
        - **payments**: One row per payment transaction. Multiple payments may exist per order. 
          Use for payment method analysis and payment status tracking.
        
        - **shipments**: One row per shipment. Use for fulfillment analysis and delivery performance tracking.
        
        
        ## Critical Double-Counting Prevention
        
        **Order-Level vs Line-Item-Level Revenue:**
        
        - Use `orders.total_amount` for order-level revenue analysis. This represents the complete order value.
        
        - Use `order_items.line_total` for line-item-level or product-level revenue analysis.
        
        - **NEVER** sum `orders.total_amount` after joining orders to order_items. This will multiply 
          the order total by the number of line items and produce incorrect results.
        
        - When analyzing revenue by product, use `order_items.line_total`.
        
        - When analyzing revenue by customer or by order date without product detail, use `orders.total_amount`.
        
        
        **Order-Level Amounts:**
        
        The orders table contains these order-level monetary fields:
        
        - `subtotal`: Total of item prices before discounts and taxes
        
        - `discount_amount`: Total discounts applied to the order
        
        - `tax_amount`: Taxes applied to the order
        
        - `shipping_fee`: Shipping charges
        
        - `total_amount`: Final order total
        
        These fields represent order-level aggregates. Do not sum them after joining to order_items.
        
        
        **Payment Analysis:**
        
        - Multiple payments may exist for a single order.
        
        - When analyzing payment amounts, use the payments table directly.
        
        - When comparing order totals to payment totals, aggregate payments by order_id.
        
        
        ## Join Guidance
        
        **Standard Relationships:**
        
        - `orders.customer_id = customers.customer_id` (many orders to one customer)
        
        - `order_items.order_id = orders.order_id` (many items to one order)
        
        - `order_items.product_id = products.product_id` (many items to one product)
        
        - `products.category_id = product_categories.category_id` (many products to one category)
        
        - `payments.order_id = orders.order_id` (many payments to one order)
        
        - `shipments.order_id = orders.order_id` (many shipments to one order)
        
        
        **Hierarchical Category Relationship:**
        
        - `product_categories.parent_category_id = product_categories.category_id` (self-referencing hierarchy)
        
        - This enables category hierarchy traversal for multi-level category analysis.
        
        - Use recursive queries to traverse the complete category tree.
        
        
        ## Time Analysis Guidance
        
        **Order Analysis:**
        
        - Use `orders.order_date` for order placement time analysis.
        
        - This is the primary date for revenue trending, order volume analysis, and time-based sales metrics.
        
        
        **Customer Registration:**
        
        - Use `customers.registration_date` for customer acquisition analysis and cohort analysis.
        
        
        **Payment Timing:**
        
        - Use `payments.paid_at` for payment processing time analysis.
        
        - Compare with `orders.order_date` to analyze payment processing delays.
        
        
        **Shipment Timing:**
        
        - Use `shipments.shipped_at` for shipment dispatch analysis.
        
        - Use `shipments.delivered_at` for delivery completion analysis.
        
        - Calculate delivery time by comparing `delivered_at` with `shipped_at`.
        
        - Calculate order-to-ship time by comparing `shipped_at` with `orders.order_date`.
        
        
        ## Metric Selection Guidance
        
        **Revenue Metrics:**
        
        - For total revenue by time period, customer, or sales channel: use `SUM(orders.total_amount)` 
          from the orders table.
        
        - For revenue by product or category: use `SUM(order_items.line_total)` from order_items 
          joined to products.
        
        - For average order value: use `AVG(orders.total_amount)` or `SUM(orders.total_amount) / COUNT(DISTINCT orders.order_id)`.
        
        
        **Product Metrics:**
        
        - For units sold: use `SUM(order_items.quantity)`.
        
        - For product revenue: use `SUM(order_items.line_total)`.
        
        - For average selling price: use `SUM(order_items.line_total) / SUM(order_items.quantity)` 
          (weighted average, not simple AVG).
        
        
        **Customer Metrics:**
        
        - For customer count: use `COUNT(DISTINCT customers.customer_id)`.
        
        - For active customers: filter by `customers.is_active = true`.
        
        - For orders per customer: use `COUNT(orders.order_id) / COUNT(DISTINCT orders.customer_id)`.
        
        
        **Discount Analysis:**
        
        - Order-level discount: use `orders.discount_amount`.
        
        - Line-item discount percentage: use `order_items.discount_pct`.
        
        - Average discount percentage at order level: calculate from `discount_amount / subtotal * 100`.
        
        
        ## Query Restrictions and Important Notes
        
        - The data model uses Databricks SQL dialect.
        
        - All monetary amounts are stored in the currency specified in the currency field (typically USD).
        
        - PII fields are redacted in sample values but contain actual data in the source system.
        
        - Metadata fields (_source_system, _batch_id, _loaded_at) track data lineage and should not 
          be used for business analysis.
        
        - Product cost_price is marked as PII and may have restricted access.
        
        - Multiple shipments may exist per order for partial fulfillment scenarios.
        
        - Order status and shipment status should be analyzed together for complete fulfillment tracking.
        
        - Payment status should be verified before considering revenue as captured.
    
    datasets:
      - name: customers
        business_name: Customers
        description: >-
          Customer master data containing one row per customer. Includes customer identification, 
          contact information, demographic attributes, address details, customer segmentation, 
          registration information, and account status. This dataset is the primary source for 
          customer-level analysis and customer dimension attributes.
        source: ecom_bronze.customers
        primary_key:
          - customer_id
        fields:
          - name: customer_id
            business_name: Customer Identifier
            description: >-
              Unique identifier for a customer. Primary key for the customers table.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: customer_code
            business_name: Customer Code
            description: >-
              Business-assigned code used to uniquely identify the customer in source systems.
            sql_type: VARCHAR(255)
            constraints:
              - NOT NULL
              - UNIQUE
          
          - name: first_name
            business_name: First Name
            description: >-
              Given name of the customer. PII field.
            sql_type: VARCHAR(255)
            constraints:
              - NOT NULL
          
          - name: last_name
            business_name: Last Name
            description: >-
              Family name of the customer. PII field.
            sql_type: VARCHAR(255)
            constraints:
              - NOT NULL
          
          - name: email
            business_name: Email
            description: >-
              Email address of the customer used for communication and notifications. PII field.
            sql_type: VARCHAR(255)
            constraints:
              - NOT NULL
              - UNIQUE
          
          - name: phone
            business_name: Phone
            description: >-
              Primary phone number of the customer. PII field.
            sql_type: VARCHAR(255)
          
          - name: gender
            business_name: Gender
            description: >-
              Self-identified gender of the customer. PII field. Candidate dimension for demographic analysis.
            sql_type: VARCHAR(255)
            dimension:
              is_categorical: true
          
          - name: date_of_birth
            business_name: Date Of Birth
            description: >-
              Date of birth of the customer. PII field. Can be used to derive age-based segments.
            sql_type: DATE
          
          - name: city
            business_name: City
            description: >-
              City component of the customer's address. PII field. Candidate dimension for geographic analysis.
            sql_type: VARCHAR(255)
            dimension:
              is_categorical: true
          
          - name: state
            business_name: State
            description: >-
              State or region component of the customer's address. PII field. Candidate dimension for 
              geographic analysis.
            sql_type: VARCHAR(255)
            dimension:
              is_categorical: true
          
          - name: country
            business_name: Country
            description: >-
              Country associated with the customer's address. PII field. Candidate dimension for 
              geographic analysis.
            sql_type: VARCHAR(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: postal_code
            business_name: Postal Code
            description: >-
              Postal or ZIP code for the customer's address. PII field.
            sql_type: VARCHAR(255)
          
          - name: customer_segment
            business_name: Customer Segment
            description: >-
              Marketing or behavioral segment classification of the customer. Candidate dimension for 
              customer segmentation analysis.
            sql_type: VARCHAR(255)
            dimension:
              is_categorical: true
          
          - name: registration_date
            business_name: Registration Date
            description: >-
              Date when the customer registered or was first created in the system. Use for customer 
              acquisition analysis and cohort analysis.
            sql_type: DATE
            dimension:
              is_time: true
          
          - name: is_active
            business_name: Is Active
            description: >-
              Indicates whether the customer account is currently active. Use to filter active customers.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: >-
              Identifier of the source system from which the customer record was ingested. 
              Metadata field for data lineage.
            sql_type: VARCHAR(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ingestion batch that loaded the customer record. Metadata field for 
              data lineage.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp indicating when the customer record was loaded into the platform. Metadata field 
              for data lineage.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: orders
        business_name: Orders
        description: >-
          Order header data containing one row per customer order. Includes order identification, 
          customer reference, order timing, order status, sales channel, shipping address, and order-level 
          monetary amounts including subtotal, discounts, taxes, shipping fees, and total amount. 
          This is the primary dataset for order-level revenue analysis and order volume metrics.
        source: ecom_bronze.orders
        primary_key:
          - order_id
        fields:
          - name: order_id
            business_name: Order Identifier
            description: >-
              Unique identifier for a customer order. Primary key for the orders table.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: order_number
            business_name: Order Number
            description: >-
              Business-facing order number used to track the order.
            sql_type: VARCHAR(255)
            constraints:
              - NOT NULL
              - UNIQUE
          
          - name: customer_id
            business_name: Customer Identifier
            description: >-
              References the customer who placed the order. Foreign key to customers table.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: order_date
            business_name: Order Date
            description: >-
              Timestamp recording when the order was placed. Primary date dimension for order and 
              revenue time-series analysis.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: order_status
            business_name: Order Status
            description: >-
              Indicates the current processing status of the order. Candidate dimension for order 
              status analysis.
            sql_type: VARCHAR(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: sales_channel
            business_name: Sales Channel
            description: >-
              Sales channel through which the order was placed, such as online store or marketplace. 
              Candidate dimension for sales channel analysis.
            sql_type: VARCHAR(255)
            dimension:
              is_categorical: true
          
          - name: ship_city
            business_name: Ship City
            description: >-
              City for the shipping address associated with the order. PII field.
            sql_type: VARCHAR(255)
          
          - name: ship_state
            business_name: Ship State
            description: >-
              State or region for the shipping address associated with the order. PII field.
            sql_type: VARCHAR(255)
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: >-
              Postal or ZIP code for the shipping address associated with the order. PII field.
            sql_type: VARCHAR(255)
          
          - name: subtotal
            business_name: Subtotal
            description: >-
              Monetary amount representing the total of item prices before discounts and taxes. 
              Order-level measure.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: discount_amount
            business_name: Discount Amount
            description: >-
              Monetary amount representing total discounts applied to the order. Order-level measure.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: tax_amount
            business_name: Tax Amount
            description: >-
              Monetary amount representing taxes applied to the order. Order-level measure. PII field.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: shipping_fee
            business_name: Shipping Fee
            description: >-
              Monetary amount charged for shipping the order. Order-level measure.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: total_amount
            business_name: Total Amount
            description: >-
              Monetary amount representing the overall total charged for the order. This is the primary 
              order-level revenue measure. Use for order-level revenue analysis. Do not sum after joining 
              to order_items.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: currency
            business_name: Currency
            description: >-
              Currency code used for monetary values in the order. Candidate dimension.
            sql_type: VARCHAR(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: >-
              Identifier of the source system from which the order record was ingested. Metadata field.
            sql_type: VARCHAR(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ingestion batch that loaded the order record. Metadata field.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp indicating when the order record was loaded into the platform. Metadata field.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: order_items
        business_name: Order Items
        description: >-
          Order line item detail containing one row per order line item. Multiple rows exist per order. 
          Includes line number, product reference, quantity, unit price, discount percentage, and line total. 
          This is the primary dataset for product-level revenue analysis and detailed order composition analysis.
        source: ecom_bronze.order_items
        primary_key:
          - order_item_id
        fields:
          - name: order_item_id
            business_name: Order Item Identifier
            description: >-
              Unique identifier for an order line item. Primary key for the order_items table.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: order_id
            business_name: Order Identifier
            description: >-
              References the related order record. Foreign key to orders table.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: line_number
            business_name: Line Number
            description: >-
              Sequential line number of the item within the order.
            sql_type: INT
            constraints:
              - NOT NULL
          
          - name: product_id
            business_name: Product Identifier
            description: >-
              References the related product record. Foreign key to products table.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: quantity
            business_name: Quantity
            description: >-
              Number of units of the product ordered on this line. Use for units sold analysis.
            sql_type: INT
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: unit_price
            business_name: Unit Price
            description: >-
              Monetary amount representing the price per unit of the product at the time of order.
            sql_type: DECIMAL(12,2)
            constraints:
              - NOT NULL
          
          - name: discount_pct
            business_name: Discount Pct
            description: >-
              Percentage discount applied to the line item.
            sql_type: DECIMAL(5,2)
            constraints:
              - NOT NULL
          
          - name: line_total
            business_name: Line Total
            description: >-
              Monetary amount representing the total value of the line item after discounts. 
              This is the primary line-item-level revenue measure. Use for product-level revenue analysis.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: _source_system
            business_name: Source System
            description: >-
              Identifier of the source system from which the order item record was ingested. Metadata field.
            sql_type: VARCHAR(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ingestion batch that loaded the order item record. Metadata field.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp indicating when the order item record was loaded into the platform. Metadata field.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: products
        business_name: Products
        description: >-
          Product master data containing one row per product. Includes product identification, SKU, 
          product name, category reference, brand, description, pricing information, cost, inventory levels, 
          and product status. This is the primary source for product dimension attributes and product catalog analysis.
        source: ecom_bronze.products
        primary_key:
          - product_id
        fields:
          - name: product_id
            business_name: Product Identifier
            description: >-
              Unique identifier for a product. Primary key for the products table.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: sku
            business_name: Sku
            description: >-
              Stock keeping unit code used to uniquely identify the product in inventory systems.
            sql_type: VARCHAR(255)
            constraints:
              - NOT NULL
              - UNIQUE
          
          - name: product_name
            business_name: Product Name
            description: >-
              Name or title of the product. Primary product descriptor.
            sql_type: VARCHAR(255)
            constraints:
              - NOT NULL
          
          - name: category_id
            business_name: Category Identifier
            description: >-
              References the category to which the product belongs. Foreign key to product_categories table.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: brand
            business_name: Brand
            description: >-
              Brand name associated with the product. Candidate dimension for brand analysis.
            sql_type: VARCHAR(255)
            dimension:
              is_categorical: true
          
          - name: description
            business_name: Description
            description: >-
              Marketing or technical description of the product.
            sql_type: VARCHAR(255)
          
          - name: unit_price
            business_name: Unit Price
            description: >-
              Standard selling price per unit of the product.
            sql_type: DECIMAL(12,2)
            constraints:
              - NOT NULL
          
          - name: cost_price
            business_name: Cost Price
            description: >-
              Cost per unit incurred by the retailer for the product. PII field with restricted access.
            sql_type: DECIMAL(12,2)
          
          - name: currency
            business_name: Currency
            description: >-
              Currency code used for product pricing values.
            sql_type: VARCHAR(255)
            constraints:
              - NOT NULL
          
          - name: stock_quantity
            business_name: Stock Quantity
            description: >-
              Current quantity of the product available in inventory. Use for inventory analysis.
            sql_type: INT
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: is_active
            business_name: Is Active
            description: >-
              Indicates whether the product is currently active and available for sale.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: created_at
            business_name: Created At
            description: >-
              Timestamp when the product record was created in the source system.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
          
          - name: _source_system
            business_name: Source System
            description: >-
              Identifier of the source system from which the product record was ingested. Metadata field.
            sql_type: VARCHAR(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ingestion batch that loaded the product record. Metadata field.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp indicating when the product record was loaded into the platform. Metadata field.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: product_categories
        business_name: Product Categories
        description: >-
          Product category master data containing one row per product category. Includes category identification, 
          category name, parent category reference for hierarchical structure, category description, and 
          category status. The parent_category_id enables recursive category hierarchy traversal for 
          multi-level category analysis.
        source: ecom_bronze.product_categories
        primary_key:
          - category_id
        fields:
          - name: category_id
            business_name: Category Identifier
            description: >-
              Unique identifier for a product category. Primary key for the product_categories table.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: category_name
            business_name: Category Name
            description: >-
              Name of the product category. Primary category descriptor.
            sql_type: VARCHAR(255)
            constraints:
              - NOT NULL
          
          - name: parent_category_id
            business_name: Parent Category Identifier
            description: >-
              References the parent category in the category hierarchy. Self-referencing foreign key 
              enabling recursive category hierarchy traversal.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
          
          - name: description
            business_name: Description
            description: >-
              Text description of the product category.
            sql_type: VARCHAR(255)
          
          - name: is_active
            business_name: Is Active
            description: >-
              Indicates whether the product category is currently active and in use.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: >-
              Identifier of the source system from which the product category record was ingested. 
              Metadata field.
            sql_type: VARCHAR(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ingestion batch that loaded the product category record. Metadata field.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp indicating when the product category record was loaded into the platform. 
              Metadata field.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: payments
        business_name: Payments
        description: >-
          Payment transaction data containing one row per payment transaction. Multiple payments may exist 
          per order. Includes payment identification, order reference, payment method, payment status, 
          payment amount, currency, transaction reference, gateway information, and payment timestamp. 
          Use for payment method analysis and payment processing analytics.
        source: ecom_bronze.payments
        primary_key:
          - payment_id
        fields:
          - name: payment_id
            business_name: Payment Identifier
            description: >-
              Unique identifier for a payment transaction. Primary key for the payments table.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: order_id
            business_name: Order Identifier
            description: >-
              References the order to which the payment applies. Foreign key to orders table.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: payment_method
            business_name: Payment Method
            description: >-
              Method used to make the payment, such as credit card, PayPal, or bank transfer. 
              Candidate dimension for payment method analysis.
            sql_type: VARCHAR(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: payment_status
            business_name: Payment Status
            description: >-
              Indicates the current status of the payment transaction. Candidate dimension for 
              payment status analysis.
            sql_type: VARCHAR(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: amount
            business_name: Amount
            description: >-
              Monetary amount of the payment. Use for payment amount analysis.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: currency
            business_name: Currency
            description: >-
              Currency code used for the payment amount.
            sql_type: VARCHAR(255)
            constraints:
              - NOT NULL
          
          - name: transaction_ref
            business_name: Transaction Ref
            description: >-
              Reference identifier provided by the payment gateway for the transaction. PII field.
            sql_type: VARCHAR(255)
          
          - name: gateway
            business_name: Gateway
            description: >-
              Name of the payment gateway or processor handling the transaction. Candidate dimension.
            sql_type: VARCHAR(255)
            dimension:
              is_categorical: true
          
          - name: paid_at
            business_name: Paid At
            description: >-
              Timestamp recording when the payment was completed. Use for payment timing analysis.
            sql_type: TIMESTAMP
            dimension:
              is_time: true
          
          - name: _source_system
            business_name: Source System
            description: >-
              Identifier of the source system from which the payment record was ingested. Metadata field.
            sql_type: VARCHAR(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ingestion batch that loaded the payment record. Metadata field.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp indicating when the payment record was loaded into the platform. Metadata field.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: shipments
        business_name: Shipments
        description: >-
          Shipment tracking data containing one row per shipment. Multiple shipments may exist per order 
          for partial fulfillment scenarios. Includes shipment identification, order reference, carrier 
          information, tracking number, shipment status, shipment and delivery timestamps, and destination 
          address. Use for fulfillment analysis and delivery performance tracking.
        source: ecom_bronze.shipments
        primary_key:
          - shipment_id
        fields:
          - name: shipment_id
            business_name: Shipment Identifier
            description: >-
              Unique identifier for a shipment. Primary key for the shipments table.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: order_id
            business_name: Order Identifier
            description: >-
              References the order associated with the shipment. Foreign key to orders table.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: carrier
            business_name: Carrier
            description: >-
              Name of the shipping carrier handling the shipment. Candidate dimension for carrier analysis.
            sql_type: VARCHAR(255)
            dimension:
              is_categorical: true
          
          - name: tracking_number
            business_name: Tracking Number
            description: >-
              Tracking number assigned by the carrier to monitor the shipment. PII field.
            sql_type: VARCHAR(255)
          
          - name: shipment_status
            business_name: Shipment Status
            description: >-
              Indicates the current status of the shipment. Candidate dimension for shipment status analysis.
            sql_type: VARCHAR(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: shipped_at
            business_name: Shipped At
            description: >-
              Timestamp recording when the shipment was dispatched. Use for shipment dispatch timing analysis.
            sql_type: TIMESTAMP
            dimension:
              is_time: true
          
          - name: delivered_at
            business_name: Delivered At
            description: >-
              Timestamp recording when the shipment was delivered to the customer. Use for delivery 
              completion analysis.
            sql_type: TIMESTAMP
            dimension:
              is_time: true
          
          - name: ship_city
            business_name: Ship City
            description: >-
              City for the destination shipping address of the shipment. PII field.
            sql_type: VARCHAR(255)
          
          - name: ship_state
            business_name: Ship State
            description: >-
              State or region for the destination shipping address of the shipment. PII field.
            sql_type: VARCHAR(255)
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: >-
              Postal or ZIP code for the destination shipping address of the shipment. PII field.
            sql_type: VARCHAR(255)
          
          - name: _source_system
            business_name: Source System
            description: >-
              Identifier of the source system from which the shipment record was ingested. Metadata field.
            sql_type: VARCHAR(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ingestion batch that loaded the shipment record. Metadata field.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp indicating when the shipment record was loaded into the platform. Metadata field.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
    
    relationships:
      - name: orders_to_customers
        left_dataset: orders
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Many orders belong to one customer. Join orders to customers using customer_id to enrich 
          order data with customer attributes such as customer segment, registration date, geographic 
          location, and demographic information.
      
      - name: order_items_to_orders
        left_dataset: order_items
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Many order line items belong to one order. Join order_items to orders using order_id to 
          enrich line item data with order-level attributes such as order date, customer reference, 
          order status, and sales channel. CRITICAL: Do not sum order-level monetary fields 
          (total_amount, subtotal, discount_amount, tax_amount, shipping_fee) after this join, 
          as this will multiply order totals by the number of line items.
      
      - name: order_items_to_products
        left_dataset: order_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        resolution: >-
          Many order line items reference one product. Join order_items to products using product_id 
          to enrich line item data with product attributes such as product name, brand, category, 
          and pricing information.
      
      - name: products_to_product_categories
        left_dataset: products
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Many products belong to one product category. Join products to product_categories using 
          category_id to enrich product data with category attributes such as category name and 
          category description.
      
      - name: payments_to_orders
        left_dataset: payments
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Many payment transactions may apply to one order. Join payments to orders using order_id 
          to analyze payment methods, payment status, and payment timing in relation to order data. 
          When aggregating payment amounts by order, use SUM(payments.amount) grouped by order_id.
      
      - name: shipments_to_orders
        left_dataset: shipments
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Many shipments may be associated with one order for partial fulfillment scenarios. 
          Join shipments to orders using order_id to analyze shipment status, carrier performance, 
          and delivery timing in relation to order data.
      
      - name: product_categories_hierarchy
        left_dataset: product_categories
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - parent_category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Self-referencing hierarchical relationship enabling category hierarchy traversal. 
          Each category may have a parent category referenced by parent_category_id. Use recursive 
          common table expressions (CTEs) to traverse the complete category tree for multi-level 
          category analysis. Example recursive query pattern:
          
          WITH RECURSIVE category_hierarchy AS (
            SELECT 
              category_id,
              category_name,
              parent_category_id,
              category_name AS root_category,
              0 AS level
            FROM ecom_bronze.product_categories
            WHERE parent_category_id IS NULL
            
            UNION ALL
            
            SELECT 
              c.category_id,
              c.category_name,
              c.parent_category_id,
              ch.root_category,
              ch.level + 1
            FROM ecom_bronze.product_categories c
            INNER JOIN category_hierarchy ch 
              ON c.parent_category_id = ch.category_id
          )
          SELECT * FROM category_hierarchy;
    
    metrics:
      - name: total_revenue
        business_name: Total Revenue
        description: >-
          Total revenue from all orders calculated as the sum of order total amounts. This represents 
          the complete revenue including products, taxes, shipping fees, and after discounts. 
          Use for overall revenue analysis and revenue trending by time period, customer segment, 
          sales channel, or geographic region.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.total_amount) AS total_revenue
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.total_amount
      
      - name: total_orders
        business_name: Total Orders
        description: >-
          Total count of orders. Use for order volume analysis and order trending by time period, 
          customer segment, sales channel, or geographic region.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(orders.order_id) AS total_orders
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.order_id
      
      - name: average_order_value
        business_name: Average Order Value
        description: >-
          Average monetary value per order calculated as total revenue divided by total order count. 
          This metric represents the typical order size and is useful for analyzing customer purchasing 
          behavior and order value trends.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(orders.order_id) = 0 THEN 0
                    ELSE SUM(orders.total_amount) / COUNT(orders.order_id)
                  END AS average_order_value
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.total_amount
                - orders.order_id
      
      - name: total_customers
        business_name: Total Customers
        description: >-
          Total count of distinct customers. Use for customer base size analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT customers.customer_id) AS total_customers
                FROM ecom_bronze.customers AS customers
              columns_used:
                - customers.customer_id
      
      - name: active_customers
        business_name: Active Customers
        description: >-
          Count of customers with active account status. Use for active customer base analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT customers.customer_id) AS active_customers
                FROM ecom_bronze.customers AS customers
                WHERE customers.is_active = true
              columns_used:
                - customers.customer_id
                - customers.is_active
      
      - name: total_units_sold
        business_name: Total Units Sold
        description: >-
          Total quantity of product units sold across all order line items. Use for unit volume 
          analysis and inventory planning.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.quantity) AS total_units_sold
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.quantity
      
      - name: product_revenue
        business_name: Product Revenue
        description: >-
          Total revenue from product sales calculated as the sum of order line item totals. 
          This is the line-item-level revenue measure used for product-level and category-level 
          revenue analysis. Use when analyzing revenue by product, brand, or category.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.line_total) AS product_revenue
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.line_total
      
      - name: average_selling_price
        business_name: Average Selling Price
        description: >-
          Weighted average selling price per unit calculated as total line item revenue divided by 
          total units sold. This represents the actual average price paid per unit after discounts 
          and is more accurate than a simple average of unit prices.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN SUM(order_items.quantity) = 0 THEN 0
                    ELSE SUM(order_items.line_total) / SUM(order_items.quantity)
                  END AS average_selling_price
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.line_total
                - order_items.quantity
      
      - name: total_discount_amount
        business_name: Total Discount Amount
        description: >-
          Total monetary amount of discounts applied to orders. Use for discount impact analysis 
          and promotional effectiveness tracking.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.discount_amount) AS total_discount_amount
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.discount_amount
      
      - name: average_discount_percentage
        business_name: Average Discount Percentage
        description: >-
          Average discount percentage calculated as total discount amount divided by total subtotal 
          before discounts, expressed as a percentage. This metric shows the overall discount rate 
          applied across all orders.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN SUM(orders.subtotal) = 0 THEN 0
                    ELSE (SUM(orders.discount_amount) / SUM(orders.subtotal)) * 100
                  END AS average_discount_percentage
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.discount_amount
                - orders.subtotal
      
      - name: total_shipping_revenue
        business_name: Total Shipping Revenue
        description: >-
          Total revenue from shipping fees charged to customers. Use for shipping revenue analysis 
          and shipping cost recovery tracking.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.shipping_fee) AS total_shipping_revenue
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.shipping_fee
      
      - name: total_tax_collected
        business_name: Total Tax Collected
        description: >-
          Total tax amount collected from orders. Use for tax reporting and tax revenue analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.tax_amount) AS total_tax_collected
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.tax_amount
      
      - name: orders_per_customer
        business_name: Orders Per Customer
        description: >-
          Average number of orders per customer calculated as total order count divided by distinct 
          customer count. This metric indicates customer purchase frequency and repeat purchase behavior.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT orders.customer_id) = 0 THEN 0
                    ELSE CAST(COUNT(orders.order_id) AS DECIMAL) / COUNT(DISTINCT orders.customer_id)
                  END AS orders_per_customer
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.order_id
                - orders.customer_id
      
      - name: revenue_per_customer
        business_name: Revenue Per Customer
        description: >-
          Average revenue per customer calculated as total revenue divided by distinct customer count. 
          This metric indicates customer value and is useful for customer segmentation and lifetime 
          value analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT orders.customer_id) = 0 THEN 0
                    ELSE SUM(orders.total_amount) / COUNT(DISTINCT orders.customer_id)
                  END AS revenue_per_customer
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.total_amount
                - orders.customer_id
      
      - name: total_shipments
        business_name: Total Shipments
        description: >-
          Total count of shipments. Use for shipment volume analysis and fulfillment tracking.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(shipments.shipment_id) AS total_shipments
                FROM ecom_bronze.shipments AS shipments
              columns_used:
                - shipments.shipment_id
      
      - name: delivered_shipments
        business_name: Delivered Shipments
        description: >-
          Count of shipments that have been delivered (where delivered_at timestamp is not null). 
          Use for delivery completion tracking and fulfillment rate analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(shipments.shipment_id) AS delivered_shipments
                FROM ecom_bronze.shipments AS shipments
                WHERE shipments.delivered_at IS NOT NULL
              columns_used:
                - shipments.shipment_id
                - shipments.delivered_at
      
      - name: delivery_rate
        business_name: Delivery Rate
        description: >-
          Percentage of shipments that have been delivered calculated as delivered shipment count 
          divided by total shipment count. This metric indicates fulfillment completion rate and 
          delivery performance.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(shipments.shipment_id) = 0 THEN 0
                    ELSE (
                      CAST(COUNT(CASE WHEN shipments.delivered_at IS NOT NULL THEN 1 END) AS DECIMAL) 
                      / COUNT(shipments.shipment_id)
                    ) * 100
                  END AS delivery_rate
                FROM ecom_bronze.shipments AS shipments
              columns_used:
                - shipments.shipment_id
                - shipments.delivered_at
      
      - name: average_delivery_time_days
        business_name: Average Delivery Time Days
        description: >-
          Average number of days between shipment dispatch and delivery calculated as the average 
          difference between delivered_at and shipped_at timestamps. This metric measures delivery 
          speed and carrier performance. Only includes completed deliveries.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(
                    DATEDIFF(
                      CAST(shipments.delivered_at AS DATE),
                      CAST(shipments.shipped_at AS DATE)
                    )
                  ) AS average_delivery_time_days
                FROM ecom_bronze.shipments AS shipments
                WHERE shipments.shipped_at IS NOT NULL
                  AND shipments.delivered_at IS NOT NULL
              columns_used:
                - shipments.delivered_at
                - shipments.shipped_at
      
      - name: total_payment_amount
        business_name: Total Payment Amount
        description: >-
          Total amount of payments processed. Use for payment processing analysis and payment 
          reconciliation with order totals.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(payments.amount) AS total_payment_amount
                FROM ecom_bronze.payments AS payments
              columns_used:
                - payments.amount
      
      - name: captured_payment_amount
        business_name: Captured Payment Amount
        description: >-
          Total amount of payments with captured status. This represents successfully processed 
          and confirmed payments. Use for actual revenue recognition and payment success analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(payments.amount) AS captured_payment_amount
                FROM ecom_bronze.payments AS payments
                WHERE payments.payment_status = 'Captured'
              columns_used:
                - payments.amount
                - payments.payment_status
      
      - name: total_products
        business_name: Total Products
        description: >-
          Total count of products in the product catalog. Use for product catalog size analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(products.product_id) AS total_products
                FROM ecom_bronze.products AS products
              columns_used:
                - products.product_id
      
      - name: active_products
        business_name: Active Products
        description: >-
          Count of products with active status that are currently available for sale. Use for 
          active product catalog analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(products.product_id) AS active_products
                FROM ecom_bronze.products AS products
                WHERE products.is_active = true
              columns_used:
                - products.product_id
                - products.is_active
      
      - name: total_inventory_value
        business_name: Total Inventory Value
        description: >-
          Total value of inventory on hand calculated as the sum of stock quantity multiplied by 
          unit price for all products. This represents the retail value of current inventory.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(products.stock_quantity * products.unit_price) AS total_inventory_value
                FROM ecom_bronze.products AS products
              columns_used:
                - products.stock_quantity
                - products.unit_price
      
      - name: revenue_by_month
        business_name: Revenue By Month
        description: >-
          Monthly revenue calculated as the sum of order total amounts grouped by order month. 
          Use for revenue trending and time-series analysis. Result grain is one row per month.
        return_type: decimal
        result_grain: one row per month
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  DATE_TRUNC('MONTH', orders.order_date) AS order_month,
                  SUM(orders.total_amount) AS monthly_revenue
                FROM ecom_bronze.orders AS orders
                GROUP BY DATE_TRUNC('MONTH', orders.order_date)
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.total_amount
      
      - name: orders_by_month
        business_name: Orders By Month
        description: >-
          Monthly order count grouped by order month. Use for order volume trending and 
          time-series analysis. Result grain is one row per month.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  DATE_TRUNC('MONTH', orders.order_date) AS order_month,
                  COUNT(orders.order_id) AS monthly_orders
                FROM ecom_bronze.orders AS orders
                GROUP BY DATE_TRUNC('MONTH', orders.order_date)
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.order_id
      
      - name: revenue_by_customer_segment
        business_name: Revenue By Customer Segment
        description: >-
          Revenue by customer segment calculated by joining orders to customers and grouping by 
          customer segment. Use for customer segment performance analysis. Result grain is one 
          row per customer segment.
        return_type: decimal
        result_grain: one row per customer segment
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  customers.customer_segment,
                  SUM(orders.total_amount) AS segment_revenue
                FROM ecom_bronze.orders AS orders
                INNER JOIN ecom_bronze.customers AS customers
                  ON orders.customer_id = customers.customer_id
                GROUP BY customers.customer_segment
                ORDER BY segment_revenue DESC
              columns_used:
                - orders.total_amount
                - orders.customer_id
                - customers.customer_id
                - customers.customer_segment
      
      - name: revenue_by_sales_channel
        business_name: Revenue By Sales Channel
        description: >-
          Revenue by sales channel grouped by the sales channel field. Use for sales channel 
          performance analysis. Result grain is one row per sales channel.
        return_type: decimal
        result_grain: one row per sales channel
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  orders.sales_channel,
                  SUM(orders.total_amount) AS channel_revenue
                FROM ecom_bronze.orders AS orders
                GROUP BY orders.sales_channel
                ORDER BY channel_revenue DESC
              columns_used:
                - orders.sales_channel
                - orders.total_amount
      
      - name: revenue_by_product
        business_name: Revenue By Product
        description: >-
          Revenue by product calculated by joining order items to products and grouping by product. 
          Uses line item totals for accurate product-level revenue. Result grain is one row per product.
        return_type: decimal
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  products.product_id,
                  products.product_name,
                  SUM(order_items.line_total) AS product_revenue
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
                GROUP BY products.product_id, products.product_name
                ORDER BY product_revenue DESC
              columns_used:
                - order_items.line_total
                - order_items.product_id
                - products.product_id
                - products.product_name
      
      - name: revenue_by_category
        business_name: Revenue By Category
        description: >-
          Revenue by product category calculated by joining order items through products to 
          product categories and grouping by category. Uses line item totals for accurate 
          category-level revenue. Result grain is one row per category.
        return_type: decimal
        result_grain: one row per category
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  product_categories.category_id,
                  product_categories.category_name,
                  SUM(order_items.line_total) AS category_revenue
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
                INNER JOIN ecom_bronze.product_categories AS product_categories
                  ON products.category_id = product_categories.category_id
                GROUP BY product_categories.category_id, product_categories.category_name
                ORDER BY category_revenue DESC
              columns_used:
                - order_items.line_total
                - order_items.product_id
                - products.product_id
                - products.category_id
                - product_categories.category_id
                - product_categories.category_name
      
      - name: revenue_by_brand
        business_name: Revenue By Brand
        description: >-
          Revenue by product brand calculated by joining order items to products and grouping by 
          brand. Uses line item totals for accurate brand-level revenue. Result grain is one row 
          per brand.
        return_type: decimal
        result_grain: one row per brand
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  products.brand,
                  SUM(order_items.line_total) AS brand_revenue
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
                WHERE products.brand IS NOT NULL
                GROUP BY products.brand
                ORDER BY brand_revenue DESC
              columns_used:
                - order_items.line_total
                - order_items.product_id
                - products.product_id
                - products.brand
      
      - name: orders_by_status
        business_name: Orders By Status
        description: >-
          Order count by order status grouped by the order status field. Use for order status 
          distribution analysis and order pipeline tracking. Result grain is one row per order status.
        return_type: integer
        result_grain: one row per order status
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  orders.order_status,
                  COUNT(orders.order_id) AS status_order_count
                FROM ecom_bronze.orders AS orders
                GROUP BY orders.order_status
                ORDER BY status_order_count DESC
              columns_used:
                - orders.order_status
                - orders.order_id
      
      - name: payments_by_method
        business_name: Payments By Method
        description: >-
          Payment count and total payment amount by payment method grouped by the payment method 
          field. Use for payment method preference analysis. Result grain is one row per payment method.
        return_type: decimal
        result_grain: one row per payment method
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  payments.payment_method,
                  COUNT(payments.payment_id) AS payment_count,
                  SUM(payments.amount) AS total_payment_amount
                FROM ecom_bronze.payments AS payments
                GROUP BY payments.payment_method
                ORDER BY total_payment_amount DESC
              columns_used:
                - payments.payment_method
                - payments.payment_id
                - payments.amount
      
      - name: shipments_by_carrier
        business_name: Shipments By Carrier
        description: >-
          Shipment count by carrier grouped by the carrier field. Use for carrier volume analysis 
          and carrier performance comparison. Result grain is one row per carrier.
        return_type: integer
        result_grain: one row per carrier
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  shipments.carrier,
                  COUNT(shipments.shipment_id) AS carrier_shipment_count
                FROM ecom_bronze.shipments AS shipments
                WHERE shipments.carrier IS NOT NULL
                GROUP BY shipments.carrier
                ORDER BY carrier_shipment_count DESC
              columns_used:
                - shipments.carrier
                - shipments.shipment_id
      
      - name: top_customers_by_revenue
        business_name: Top Customers By Revenue
        description: >-
          Customer ranking by total revenue calculated by joining orders to customers, aggregating 
          revenue by customer, and ranking customers by revenue. Use for top customer identification 
          and customer value analysis. Result grain is one row per customer with revenue ranking.
        return_type: decimal
        result_grain: one row per customer
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  customers.customer_id,
                  customers.customer_code,
                  customers.customer_segment,
                  SUM(orders.total_amount) AS customer_revenue,
                  RANK() OVER (ORDER BY SUM(orders.total_amount) DESC) AS revenue_rank
                FROM ecom_bronze.orders AS orders
                INNER JOIN ecom_bronze.customers AS customers
                  ON orders.customer_id = customers.customer_id
                GROUP BY 
                  customers.customer_id,
                  customers.customer_code,
                  customers.customer_segment
                ORDER BY customer_revenue DESC
              columns_used:
                - orders.total_amount
                - orders.customer_id
                - customers.customer_id
                - customers.customer_code
                - customers.customer_segment
      
      - name: top_products_by_units_sold
        business_name: Top Products By Units Sold
        description: >-
          Product ranking by total units sold calculated by joining order items to products, 
          aggregating quantity by product, and ranking products by units sold. Use for top-selling 
          product identification and inventory planning. Result grain is one row per product with 
          units sold ranking.
        return_type: integer
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  products.product_id,
                  products.product_name,
                  products.brand,
                  SUM(order_items.quantity) AS units_sold,
                  RANK() OVER (ORDER BY SUM(order_items.quantity) DESC) AS units_rank
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
                GROUP BY 
                  products.product_id,
                  products.product_name,
                  products.brand
                ORDER BY units_sold DESC
              columns_used:
                - order_items.quantity
                - order_items.product_id
                - products.product_id
                - products.product_name
                - products.brand