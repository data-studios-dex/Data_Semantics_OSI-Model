version: "1.0"

semantic_model:
  - name: ecom_retail_analytics
    description: >-
      Comprehensive semantic model for retail e-commerce analytics covering customers, orders, 
      order items, products, product categories, payments, and shipments. This model supports 
      analytical queries across customer behavior, order fulfillment, product performance, 
      payment processing, and logistics operations.
    
    ai_context:
      instructions: >-
        ## Dataset Grain Reference
        
        - **customers**: One row per customer. Use for customer-level analysis.
        - **orders**: One row per order. Use for order-level revenue, discount, tax, and shipping analysis.
        - **order_items**: One row per order line item. Use for product-level and line-item-level analysis.
        - **products**: One row per product. Use for product catalog and inventory analysis.
        - **product_categories**: One row per product category. Contains hierarchical parent-child relationships.
        - **payments**: One row per payment transaction. Use for payment method and transaction analysis.
        - **shipments**: One row per shipment. Use for logistics and delivery performance analysis.
        
        ## Critical Double-Counting Prevention
        
        **IMPORTANT**: The orders and order_items tables have different grains.
        
        - **orders.subtotal**, **orders.discount_amount**, **orders.tax_amount**, **orders.shipping_fee**, 
          and **orders.total_amount** are ORDER-LEVEL aggregates.
        - **order_items.line_total** is a LINE-ITEM-LEVEL measure.
        
        **DO NOT** sum order-level amounts after joining orders to order_items, as this will multiply 
        the order totals by the number of line items.
        
        **Correct approach**:
        - For order-level revenue: Use `SUM(orders.total_amount)` without joining to order_items.
        - For line-item revenue: Use `SUM(order_items.line_total)`.
        - For product-level revenue: Join order_items to products and use `SUM(order_items.line_total)`.
        
        ## Relationship Navigation
        
        **Customer to Orders**: One customer can have many orders (one-to-many).
        
        **Orders to Order Items**: One order contains many line items (one-to-many).
        
        **Products to Order Items**: One product appears in many order items (one-to-many).
        
        **Product Categories Hierarchy**: Categories have a self-referencing parent-child relationship 
        via parent_category_id. Use recursive queries to traverse the full category hierarchy.
        
        **Orders to Payments**: One order can have multiple payment transactions (one-to-many).
        
        **Orders to Shipments**: One order can have multiple shipments (one-to-many).
        
        ## Time-Based Analysis
        
        - **Customer registration analysis**: Use customers.registration_date
        - **Order transaction analysis**: Use orders.order_date
        - **Payment transaction analysis**: Use payments.paid_at
        - **Shipment dispatch analysis**: Use shipments.shipped_at
        - **Delivery analysis**: Use shipments.delivered_at
        
        ## Hierarchical Category Analysis
        
        The product_categories table contains a self-referencing hierarchy via parent_category_id.
        To analyze the full category hierarchy, use recursive CTEs in Databricks SQL:
        
        ```sql
        WITH RECURSIVE category_hierarchy AS (
          SELECT category_id, category_name, parent_category_id, 1 as level
          FROM ecom_bronze.product_categories
          WHERE parent_category_id IS NULL
          UNION ALL
          SELECT c.category_id, c.category_name, c.parent_category_id, ch.level + 1
          FROM ecom_bronze.product_categories c
          INNER JOIN category_hierarchy ch ON c.parent_category_id = ch.category_id
        )
        SELECT * FROM category_hierarchy
        ```
        
        ## Metric Selection Guidance
        
        - **Total Revenue**: Use orders.total_amount for complete order revenue including tax and shipping.
        - **Subtotal Revenue**: Use orders.subtotal for pre-tax, pre-shipping revenue.
        - **Line Item Revenue**: Use order_items.line_total for product-level revenue analysis.
        - **Discount Analysis**: Use orders.discount_amount for order-level discounts, or calculate from 
          order_items using quantity * unit_price * (discount_pct / 100).
        - **Product Performance**: Join order_items to products and aggregate order_items.line_total.
        - **Customer Lifetime Value**: Aggregate orders.total_amount grouped by customer_id.
        
        ## Delivery Performance Analysis
        
        To calculate delivery time, use:
        ```sql
        DATEDIFF(shipments.delivered_at, shipments.shipped_at)
        ```
        
        Only include shipments where both shipped_at and delivered_at are not null.
        
        ## Payment Analysis
        
        Payments are linked to orders via order_id. Multiple payments can exist for a single order.
        To analyze payment completion rates, filter by payment_status = 'Completed'.
        
        ## Active vs Inactive Records
        
        - Customers: Filter by is_active = true for active customers only.
        - Products: Filter by is_active = true for products currently available for sale.
        - Product Categories: Filter by is_active = true for active categories.
        
        ## Currency Handling
        
        All monetary amounts in orders, order_items, products, and payments use currency codes.
        The primary currency is USD. For multi-currency analysis, join to an exchange rate table 
        using the currency code and transaction date.
        
        ## PII Data Handling
        
        The following fields contain PII and should be handled according to data privacy policies:
        - customers: first_name, last_name, email, phone, date_of_birth
        - payments: transaction_ref
        
        ## Query Restrictions
        
        - Always filter by _source_system when analyzing data quality or source-specific patterns.
        - Use _loaded_at for incremental data processing and freshness analysis.
        - Use _batch_id to track ETL batch lineage.

    datasets:
      - name: customers
        business_name: Customers
        description: >-
          Contains customer master data including demographic information, contact details, 
          segmentation, and registration information. Grain: One row per customer. 
          Primary key: customer_id.
        source: ecom_bronze.customers
        primary_key:
          - customer_id
        fields:
          - name: customer_id
            business_name: Customer Identifier
            description: Unique identifier for a customer.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: customer_code
            business_name: Customer Code
            description: Business reference code assigned to the customer.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: first_name
            business_name: First Name
            description: First name of the customer. Contains PII.
            sql_type: STRING
            constraints:
              - NOT NULL
              - PII
          
          - name: last_name
            business_name: Last Name
            description: Last name of the customer. Contains PII.
            sql_type: STRING
            constraints:
              - NOT NULL
              - PII
          
          - name: email
            business_name: Email
            description: Email address of the customer. Contains PII.
            sql_type: STRING
            constraints:
              - NOT NULL
              - PII
          
          - name: phone
            business_name: Phone
            description: Phone number of the customer. Contains PII.
            sql_type: STRING
            constraints:
              - PII
          
          - name: gender
            business_name: Gender
            description: Gender of the customer.
            sql_type: STRING
            dimension:
              is_time: false
          
          - name: date_of_birth
            business_name: Date Of Birth
            description: Date of birth of the customer. Contains PII.
            sql_type: DATE
            constraints:
              - PII
            dimension:
              is_time: true
          
          - name: city
            business_name: City
            description: City where the customer resides.
            sql_type: STRING
            dimension:
              is_time: false
          
          - name: state
            business_name: State
            description: State or province where the customer resides.
            sql_type: STRING
            dimension:
              is_time: false
          
          - name: country
            business_name: Country
            description: Country where the customer resides.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: postal_code
            business_name: Postal Code
            description: Postal or ZIP code of the customer's address.
            sql_type: STRING
          
          - name: customer_segment
            business_name: Customer Segment
            description: Indicates the current segment classification of the customer.
            sql_type: STRING
            dimension:
              is_time: false
          
          - name: registration_date
            business_name: Registration Date
            description: Date when the customer registered.
            sql_type: DATE
            dimension:
              is_time: true
          
          - name: is_active
            business_name: Is Active
            description: Indicates whether the customer account is currently active.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

      - name: orders
        business_name: Orders
        description: >-
          Contains order header information including customer reference, order timing, status, 
          shipping destination, and financial totals. Grain: One row per order. 
          Primary key: order_id. Order-level financial measures include subtotal, discount_amount, 
          tax_amount, shipping_fee, and total_amount.
        source: ecom_bronze.orders
        primary_key:
          - order_id
        fields:
          - name: order_id
            business_name: Order Identifier
            description: Unique identifier for an order.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_number
            business_name: Order Number
            description: Business reference number assigned to the order.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: customer_id
            business_name: Customer ID
            description: References the related customer record.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: order_date
            business_name: Order Date
            description: Timestamp recording when the order was placed.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: order_status
            business_name: Order Status
            description: Indicates the current status of the order.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: sales_channel
            business_name: Sales Channel
            description: Indicates the channel through which the order was placed.
            sql_type: STRING
            dimension:
              is_time: false
          
          - name: ship_city
            business_name: Ship City
            description: City to which the order is shipped.
            sql_type: STRING
            dimension:
              is_time: false
          
          - name: ship_state
            business_name: Ship State
            description: State or province to which the order is shipped.
            sql_type: STRING
            dimension:
              is_time: false
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: Postal or ZIP code to which the order is shipped.
            sql_type: STRING
          
          - name: subtotal
            business_name: Subtotal
            description: Monetary amount representing the order subtotal before discounts and taxes.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: discount_amount
            business_name: Discount Amount
            description: Monetary amount representing the total discount applied to the order.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: tax_amount
            business_name: Tax Amount
            description: Monetary amount representing the tax charged on the order.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
              - PII
            measure:
              aggregation: SUM
          
          - name: shipping_fee
            business_name: Shipping Fee
            description: Monetary amount representing the shipping cost for the order.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: total_amount
            business_name: Total Amount
            description: Monetary amount representing the final total of the order.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: currency
            business_name: Currency
            description: Currency code for the order amounts.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

      - name: order_items
        business_name: Order Items
        description: >-
          Contains order line item details including product reference, quantity, pricing, 
          discounts, and line totals. Grain: One row per order line item. 
          Primary key: order_item_id. Line-level financial measure is line_total.
        source: ecom_bronze.order_items
        primary_key:
          - order_item_id
        fields:
          - name: order_item_id
            business_name: Order Item Identifier
            description: Unique identifier for an order line item.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: References the related order record.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: line_number
            business_name: Line Number
            description: Sequential line number within the order.
            sql_type: INT
            constraints:
              - NOT NULL
          
          - name: product_id
            business_name: Product ID
            description: References the related product record.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: quantity
            business_name: Quantity
            description: Number of units ordered for this line item.
            sql_type: INT
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: unit_price
            business_name: Unit Price
            description: Monetary amount representing the price per unit.
            sql_type: DECIMAL(12,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
          
          - name: discount_pct
            business_name: Discount Pct
            description: Percentage discount applied to the line item.
            sql_type: DECIMAL(5,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
          
          - name: line_total
            business_name: Line Total
            description: Monetary amount representing the total for this line item.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

      - name: products
        business_name: Products
        description: >-
          Contains product master data including SKU, product name, category reference, 
          brand, pricing, cost, and inventory information. Grain: One row per product. 
          Primary key: product_id.
        source: ecom_bronze.products
        primary_key:
          - product_id
        fields:
          - name: product_id
            business_name: Product Identifier
            description: Unique identifier for a product.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: sku
            business_name: Sku
            description: Stock keeping unit code for the product.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: product_name
            business_name: Product Name
            description: Name of the product.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: category_id
            business_name: Category ID
            description: References the related product category record.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: brand
            business_name: Brand
            description: Brand name of the product.
            sql_type: STRING
            dimension:
              is_time: false
          
          - name: description
            business_name: Description
            description: Detailed description of the product.
            sql_type: STRING
          
          - name: unit_price
            business_name: Unit Price
            description: Monetary amount representing the selling price per unit.
            sql_type: DECIMAL(12,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
          
          - name: cost_price
            business_name: Cost Price
            description: Monetary amount representing the cost per unit.
            sql_type: DECIMAL(12,2)
            measure:
              aggregation: AVG
          
          - name: currency
            business_name: Currency
            description: Currency code for the product prices.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: stock_quantity
            business_name: Stock Quantity
            description: Current inventory quantity available for the product.
            sql_type: INT
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: is_active
            business_name: Is Active
            description: Indicates whether the product is currently active for sale.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: created_at
            business_name: Created At
            description: Timestamp recording when the product was created in the system.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

      - name: product_categories
        business_name: Product Categories
        description: >-
          Contains product category master data with hierarchical parent-child relationships. 
          Grain: One row per product category. Primary key: category_id. 
          Contains self-referencing foreign key parent_category_id for category hierarchy.
        source: ecom_bronze.product_categories
        primary_key:
          - category_id
        fields:
          - name: category_id
            business_name: Category Identifier
            description: Unique identifier for a product category.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: category_name
            business_name: Category Name
            description: Name of the product category.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: parent_category_id
            business_name: Parent Category ID
            description: References the parent category in the hierarchy.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
          
          - name: description
            business_name: Description
            description: Detailed description of the product category.
            sql_type: STRING
          
          - name: is_active
            business_name: Is Active
            description: Indicates whether the category is currently active.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

      - name: payments
        business_name: Payments
        description: >-
          Contains payment transaction data including payment method, status, amount, 
          and gateway information. Grain: One row per payment transaction. 
          Primary key: payment_id. Multiple payments can exist for a single order.
        source: ecom_bronze.payments
        primary_key:
          - payment_id
        fields:
          - name: payment_id
            business_name: Payment Identifier
            description: Unique identifier for a payment transaction.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: References the related order record.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: payment_method
            business_name: Payment Method
            description: Indicates the method used for payment.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: payment_status
            business_name: Payment Status
            description: Indicates the current status of the payment.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: amount
            business_name: Amount
            description: Monetary amount representing the payment value.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: currency
            business_name: Currency
            description: Currency code for the payment amount.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: transaction_ref
            business_name: Transaction Ref
            description: External reference number for the payment transaction. Contains PII.
            sql_type: STRING
            constraints:
              - PII
          
          - name: gateway
            business_name: Gateway
            description: Name of the payment gateway used to process the transaction.
            sql_type: STRING
            dimension:
              is_time: false
          
          - name: paid_at
            business_name: Paid At
            description: Timestamp recording when the payment was completed.
            sql_type: TIMESTAMP
            dimension:
              is_time: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

      - name: shipments
        business_name: Shipments
        description: >-
          Contains shipment tracking data including carrier, tracking number, status, 
          and timing information. Grain: One row per shipment. Primary key: shipment_id. 
          Multiple shipments can exist for a single order.
        source: ecom_bronze.shipments
        primary_key:
          - shipment_id
        fields:
          - name: shipment_id
            business_name: Shipment Identifier
            description: Unique identifier for a shipment.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: References the related order record.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: carrier
            business_name: Carrier
            description: Name of the shipping carrier handling the shipment.
            sql_type: STRING
            dimension:
              is_time: false
          
          - name: tracking_number
            business_name: Tracking Number
            description: Tracking number assigned by the carrier for the shipment.
            sql_type: STRING
          
          - name: shipment_status
            business_name: Shipment Status
            description: Indicates the current status of the shipment.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: shipped_at
            business_name: Shipped At
            description: Timestamp recording when the shipment was dispatched.
            sql_type: TIMESTAMP
            dimension:
              is_time: true
          
          - name: delivered_at
            business_name: Delivered At
            description: Timestamp recording when the shipment was delivered.
            sql_type: TIMESTAMP
            dimension:
              is_time: true
          
          - name: ship_city
            business_name: Ship City
            description: City to which the shipment is being sent.
            sql_type: STRING
            dimension:
              is_time: false
          
          - name: ship_state
            business_name: Ship State
            description: State or province to which the shipment is being sent.
            sql_type: STRING
            dimension:
              is_time: false
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: Postal or ZIP code to which the shipment is being sent.
            sql_type: STRING
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

    relationships:
      - name: orders_to_customers
        left_dataset: orders
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Each order is placed by exactly one customer. Multiple orders can belong to the same customer.
          Join orders.customer_id to customers.customer_id to retrieve customer demographic and 
          segmentation information for order analysis.

      - name: order_items_to_orders
        left_dataset: order_items
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Each order line item belongs to exactly one order. An order contains one or more line items.
          Join order_items.order_id to orders.order_id to retrieve order header information.
          CRITICAL: Do not sum order-level amounts (subtotal, discount_amount, tax_amount, shipping_fee, 
          total_amount) after this join, as it will multiply order totals by the number of line items.

      - name: order_items_to_products
        left_dataset: order_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        resolution: >-
          Each order line item references exactly one product. A product can appear in many order line items.
          Join order_items.product_id to products.product_id to retrieve product details including 
          product name, brand, category, and pricing information.

      - name: products_to_product_categories
        left_dataset: products
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Each product belongs to exactly one product category. A category can contain many products.
          Join products.category_id to product_categories.category_id to retrieve category information.

      - name: product_categories_hierarchy
        left_dataset: product_categories
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - parent_category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Self-referencing hierarchical relationship. Each category can have a parent category, 
          forming a category hierarchy tree. Root categories have parent_category_id = NULL.
          To traverse the full hierarchy, use recursive CTEs in Databricks SQL.
          Example recursive query:
          WITH RECURSIVE category_hierarchy AS (
            SELECT category_id, category_name, parent_category_id, 1 as level
            FROM ecom_bronze.product_categories
            WHERE parent_category_id IS NULL
            UNION ALL
            SELECT c.category_id, c.category_name, c.parent_category_id, ch.level + 1
            FROM ecom_bronze.product_categories c
            INNER JOIN category_hierarchy ch ON c.parent_category_id = ch.category_id
          )
          SELECT * FROM category_hierarchy

      - name: payments_to_orders
        left_dataset: payments
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Each payment transaction is associated with exactly one order. An order can have multiple 
          payment transactions. Join payments.order_id to orders.order_id to retrieve order information 
          for payment analysis.

      - name: shipments_to_orders
        left_dataset: shipments
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Each shipment is associated with exactly one order. An order can have multiple shipments.
          Join shipments.order_id to orders.order_id to retrieve order information for logistics analysis.

    metrics:
      - name: total_revenue
        business_name: Total Revenue
        description: >-
          Total revenue from all orders including tax and shipping fees. Calculated as the sum of 
          orders.total_amount. This is an order-level metric and should not be calculated after 
          joining to order_items.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.total_amount) AS total_revenue
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.total_amount

      - name: total_subtotal_revenue
        business_name: Total Subtotal Revenue
        description: >-
          Total subtotal revenue from all orders before discounts, taxes, and shipping fees. 
          Calculated as the sum of orders.subtotal. This is an order-level metric.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.subtotal) AS total_subtotal_revenue
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.subtotal

      - name: total_discount_amount
        business_name: Total Discount Amount
        description: >-
          Total discount amount applied across all orders. Calculated as the sum of 
          orders.discount_amount. This is an order-level metric.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.discount_amount) AS total_discount_amount
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.discount_amount

      - name: total_tax_amount
        business_name: Total Tax Amount
        description: >-
          Total tax amount collected across all orders. Calculated as the sum of orders.tax_amount.
          This is an order-level metric.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.tax_amount) AS total_tax_amount
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.tax_amount

      - name: total_shipping_fees
        business_name: Total Shipping Fees
        description: >-
          Total shipping fees collected across all orders. Calculated as the sum of 
          orders.shipping_fee. This is an order-level metric.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.shipping_fee) AS total_shipping_fees
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.shipping_fee

      - name: order_count
        business_name: Order Count
        description: >-
          Total number of orders. Calculated as the count of distinct order_id values.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT orders.order_id) AS order_count
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.order_id

      - name: customer_count
        business_name: Customer Count
        description: >-
          Total number of customers. Calculated as the count of distinct customer_id values.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT customers.customer_id) AS customer_count
                FROM ecom_bronze.customers AS customers
              columns_used:
                - customers.customer_id

      - name: active_customer_count
        business_name: Active Customer Count
        description: >-
          Total number of active customers. Calculated as the count of distinct customer_id values 
          where is_active = true.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT customers.customer_id) AS active_customer_count
                FROM ecom_bronze.customers AS customers
                WHERE customers.is_active = true
              columns_used:
                - customers.customer_id
                - customers.is_active

      - name: product_count
        business_name: Product Count
        description: >-
          Total number of products. Calculated as the count of distinct product_id values.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT products.product_id) AS product_count
                FROM ecom_bronze.products AS products
              columns_used:
                - products.product_id

      - name: active_product_count
        business_name: Active Product Count
        description: >-
          Total number of active products available for sale. Calculated as the count of distinct 
          product_id values where is_active = true.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT products.product_id) AS active_product_count
                FROM ecom_bronze.products AS products
                WHERE products.is_active = true
              columns_used:
                - products.product_id
                - products.is_active

      - name: units_sold
        business_name: Units Sold
        description: >-
          Total number of units sold across all order line items. Calculated as the sum of 
          order_items.quantity.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.quantity) AS units_sold
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.quantity

      - name: line_item_revenue
        business_name: Line Item Revenue
        description: >-
          Total revenue calculated at the order line item level. Calculated as the sum of 
          order_items.line_total. Use this metric for product-level revenue analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.line_total) AS line_item_revenue
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.line_total

      - name: average_order_value
        business_name: Average Order Value
        description: >-
          Average revenue per order. Calculated as total revenue divided by the number of orders.
          Uses orders.total_amount and order count.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT orders.order_id) = 0 THEN 0
                    ELSE SUM(orders.total_amount) / COUNT(DISTINCT orders.order_id)
                  END AS average_order_value
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.order_id
                - orders.total_amount

      - name: average_discount_percentage
        business_name: Average Discount Percentage
        description: >-
          Average discount percentage across all orders. Calculated as total discount amount 
          divided by total subtotal, expressed as a percentage.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN SUM(orders.subtotal) = 0 THEN 0
                    ELSE (SUM(orders.discount_amount) / SUM(orders.subtotal)) * 100
                  END AS average_discount_percentage
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.discount_amount
                - orders.subtotal

      - name: average_units_per_order
        business_name: Average Units Per Order
        description: >-
          Average number of units per order. Calculated as total units sold divided by the number 
          of distinct orders.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT order_items.order_id) = 0 THEN 0
                    ELSE CAST(SUM(order_items.quantity) AS DECIMAL) / COUNT(DISTINCT order_items.order_id)
                  END AS average_units_per_order
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.order_id
                - order_items.quantity

      - name: orders_per_customer
        business_name: Orders Per Customer
        description: >-
          Average number of orders per customer. Calculated as total order count divided by 
          the number of distinct customers who have placed orders.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT orders.customer_id) = 0 THEN 0
                    ELSE CAST(COUNT(DISTINCT orders.order_id) AS DECIMAL) / COUNT(DISTINCT orders.customer_id)
                  END AS orders_per_customer
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.order_id
                - orders.customer_id

      - name: revenue_per_customer
        business_name: Revenue Per Customer
        description: >-
          Average revenue per customer. Calculated as total revenue divided by the number of 
          distinct customers who have placed orders.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT orders.customer_id) = 0 THEN 0
                    ELSE SUM(orders.total_amount) / COUNT(DISTINCT orders.customer_id)
                  END AS revenue_per_customer
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.total_amount
                - orders.customer_id

      - name: payment_count
        business_name: Payment Count
        description: >-
          Total number of payment transactions. Calculated as the count of distinct payment_id values.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT payments.payment_id) AS payment_count
                FROM ecom_bronze.payments AS payments
              columns_used:
                - payments.payment_id

      - name: completed_payment_count
        business_name: Completed Payment Count
        description: >-
          Total number of completed payment transactions. Calculated as the count of distinct 
          payment_id values where payment_status = 'Completed'.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT payments.payment_id) AS completed_payment_count
                FROM ecom_bronze.payments AS payments
                WHERE payments.payment_status = 'Completed'
              columns_used:
                - payments.payment_id
                - payments.payment_status

      - name: total_payment_amount
        business_name: Total Payment Amount
        description: >-
          Total payment amount across all payment transactions. Calculated as the sum of 
          payments.amount.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(payments.amount) AS total_payment_amount
                FROM ecom_bronze.payments AS payments
              columns_used:
                - payments.amount

      - name: shipment_count
        business_name: Shipment Count
        description: >-
          Total number of shipments. Calculated as the count of distinct shipment_id values.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT shipments.shipment_id) AS shipment_count
                FROM ecom_bronze.shipments AS shipments
              columns_used:
                - shipments.shipment_id

      - name: delivered_shipment_count
        business_name: Delivered Shipment Count
        description: >-
          Total number of delivered shipments. Calculated as the count of distinct shipment_id 
          values where delivered_at is not null.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT shipments.shipment_id) AS delivered_shipment_count
                FROM ecom_bronze.shipments AS shipments
                WHERE shipments.delivered_at IS NOT NULL
              columns_used:
                - shipments.shipment_id
                - shipments.delivered_at

      - name: average_delivery_days
        business_name: Average Delivery Days
        description: >-
          Average number of days between shipment dispatch and delivery. Calculated using 
          DATEDIFF between delivered_at and shipped_at for shipments where both timestamps are available.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(DATEDIFF(shipments.delivered_at, shipments.shipped_at)) AS average_delivery_days
                FROM ecom_bronze.shipments AS shipments
                WHERE shipments.shipped_at IS NOT NULL
                  AND shipments.delivered_at IS NOT NULL
              columns_used:
                - shipments.shipped_at
                - shipments.delivered_at

      - name: product_revenue_by_product
        business_name: Product Revenue By Product
        description: >-
          Revenue by product. Calculated as the sum of order_items.line_total grouped by product.
          Requires joining order_items to products.
        return_type: DECIMAL
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  products.product_id,
                  products.product_name,
                  SUM(order_items.line_total) AS product_revenue
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
                GROUP BY products.product_id, products.product_name
              columns_used:
                - order_items.product_id
                - order_items.line_total
                - products.product_id
                - products.product_name

      - name: revenue_by_customer_segment
        business_name: Revenue By Customer Segment
        description: >-
          Revenue by customer segment. Calculated as the sum of orders.total_amount grouped by 
          customer segment. Requires joining orders to customers.
        return_type: DECIMAL
        result_grain: one row per customer segment
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  customers.customer_segment,
                  SUM(orders.total_amount) AS segment_revenue
                FROM ecom_bronze.orders AS orders
                INNER JOIN ecom_bronze.customers AS customers
                  ON orders.customer_id = customers.customer_id
                GROUP BY customers.customer_segment
              columns_used:
                - orders.customer_id
                - orders.total_amount
                - customers.customer_id
                - customers.customer_segment

      - name: revenue_by_sales_channel
        business_name: Revenue By Sales Channel
        description: >-
          Revenue by sales channel. Calculated as the sum of orders.total_amount grouped by 
          sales channel.
        return_type: DECIMAL
        result_grain: one row per sales channel
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  orders.sales_channel,
                  SUM(orders.total_amount) AS channel_revenue
                FROM ecom_bronze.orders AS orders
                GROUP BY orders.sales_channel
              columns_used:
                - orders.sales_channel
                - orders.total_amount

      - name: monthly_revenue
        business_name: Monthly Revenue
        description: >-
          Revenue by month. Calculated as the sum of orders.total_amount grouped by month 
          extracted from orders.order_date.
        return_type: DECIMAL
        result_grain: one row per month
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  DATE_TRUNC('MONTH', orders.order_date) AS order_month,
                  SUM(orders.total_amount) AS monthly_revenue
                FROM ecom_bronze.orders AS orders
                GROUP BY DATE_TRUNC('MONTH', orders.order_date)
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.total_amount

      - name: revenue_by_product_category
        business_name: Revenue By Product Category
        description: >-
          Revenue by product category. Calculated as the sum of order_items.line_total grouped by 
          product category. Requires joining order_items to products to product_categories.
        return_type: DECIMAL
        result_grain: one row per product category
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  product_categories.category_id,
                  product_categories.category_name,
                  SUM(order_items.line_total) AS category_revenue
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
                INNER JOIN ecom_bronze.product_categories AS product_categories
                  ON products.category_id = product_categories.category_id
                GROUP BY product_categories.category_id, product_categories.category_name
              columns_used:
                - order_items.product_id
                - order_items.line_total
                - products.product_id
                - products.category_id
                - product_categories.category_id
                - product_categories.category_name

      - name: revenue_by_payment_method
        business_name: Revenue By Payment Method
        description: >-
          Revenue by payment method. Calculated as the sum of payments.amount grouped by 
          payment method for completed payments.
        return_type: DECIMAL
        result_grain: one row per payment method
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  payments.payment_method,
                  SUM(payments.amount) AS payment_method_revenue
                FROM ecom_bronze.payments AS payments
                WHERE payments.payment_status = 'Completed'
                GROUP BY payments.payment_method
              columns_used:
                - payments.payment_method
                - payments.amount
                - payments.payment_status

      - name: total_inventory_value
        business_name: Total Inventory Value
        description: >-
          Total inventory value across all products. Calculated as the sum of 
          (stock_quantity * cost_price) for all products where cost_price is available.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(products.stock_quantity * products.cost_price) AS total_inventory_value
                FROM ecom_bronze.products AS products
                WHERE products.cost_price IS NOT NULL
              columns_used:
                - products.stock_quantity
                - products.cost_price

      - name: product_profit_margin
        business_name: Product Profit Margin
        description: >-
          Profit margin percentage by product. Calculated as ((unit_price - cost_price) / unit_price) * 100
          for products where both unit_price and cost_price are available.
        return_type: DECIMAL
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  products.product_id,
                  products.product_name,
                  CASE
                    WHEN products.unit_price = 0 THEN 0
                    ELSE ((products.unit_price - products.cost_price) / products.unit_price) * 100
                  END AS profit_margin_pct
                FROM ecom_bronze.products AS products
                WHERE products.unit_price IS NOT NULL
                  AND products.cost_price IS NOT NULL
              columns_used:
                - products.product_id
                - products.product_name
                - products.unit_price
                - products.cost_price
