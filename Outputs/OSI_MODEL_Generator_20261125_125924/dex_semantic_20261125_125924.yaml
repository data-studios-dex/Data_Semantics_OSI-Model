version: "1.0"

semantic_model:
  - name: ecom_retail_analytics
    description: >-
      Comprehensive semantic model for e-commerce retail analytics derived from the ecom_bronze schema.
      This model supports analytical queries across customers, orders, products, payments, and shipments.
      The model includes customer segmentation analysis, order fulfillment tracking, product performance metrics,
      payment processing analytics, and shipment delivery monitoring.
    
    ai_context:
      instructions: >-
        ## Dataset Grain Reference
        
        - **customers**: One row per customer. Contains customer demographic and registration information.
        
        - **orders**: One row per order. Contains order header information including totals, dates, and shipping details.
        
        - **order_items**: One row per order line item. Contains product-level detail for each order with quantities and pricing.
        
        - **products**: One row per product. Contains product catalog information including pricing and inventory.
        
        - **product_categories**: One row per product category. Contains hierarchical category structure with self-referencing parent relationships.
        
        - **payments**: One row per payment transaction. Contains payment method, status, and transaction details for orders.
        
        - **shipments**: One row per shipment. Contains carrier, tracking, and delivery information for orders.
        
        
        ## Critical Grain and Double-Counting Prevention
        
        **IMPORTANT**: The orders and order_items datasets have different grains that can cause measure duplication if not handled correctly.
        
        - **orders** = one row per order
        - **order_items** = multiple rows per order (one per line item)
        
        **Revenue Analysis Rules**:
        
        1. For **order-level revenue analysis**, use measures from the **orders** dataset:
           - orders.subtotal
           - orders.discount_amount
           - orders.tax_amount
           - orders.shipping_fee
           - orders.total_amount
        
        2. For **product-level or line-item revenue analysis**, use measures from the **order_items** dataset:
           - order_items.quantity
           - order_items.unit_price
           - order_items.discount_pct
           - order_items.line_total
        
        3. **NEVER sum order-level measures after joining orders to order_items** without proper aggregation handling.
           This will duplicate order totals by the number of line items in each order.
        
        4. When analyzing by product, category, or line-item attributes, aggregate from order_items.
        
        5. When analyzing by customer, order date, order status, or sales channel, you may aggregate from orders
           OR from order_items with appropriate distinct counting of orders.
        
        
        ## Relationship and Join Guidance
        
        **Customer to Orders** (one-to-many):
        - Join: customers.customer_id = orders.customer_id
        - A customer can have multiple orders over time.
        - Use orders.order_date for time-series customer analysis.
        
        **Orders to Order Items** (one-to-many):
        - Join: orders.order_id = order_items.order_id
        - Each order contains one or more line items.
        - **WARNING**: Joining orders to order_items will multiply order-level measures by the number of line items.
        - Use order_items for product-level analysis.
        - Use orders for order-level analysis.
        
        **Order Items to Products** (many-to-one):
        - Join: order_items.product_id = products.product_id
        - Multiple order items can reference the same product.
        - Use for product performance and inventory analysis.
        
        **Products to Product Categories** (many-to-one):
        - Join: products.category_id = product_categories.category_id
        - Multiple products belong to the same category.
        - Use for category-level aggregation and analysis.
        
        **Product Categories Hierarchy** (self-referencing):
        - Join: product_categories.parent_category_id = product_categories.category_id
        - Categories form a hierarchical tree structure.
        - Use recursive queries to traverse the full category hierarchy.
        - A category with NULL parent_category_id is a root category.
        
        **Orders to Payments** (one-to-one or one-to-many):
        - Join: orders.order_id = payments.order_id
        - Typically one payment per order, but multiple payments are possible.
        - Use for payment method analysis and payment status tracking.
        
        **Orders to Shipments** (one-to-one or one-to-many):
        - Join: orders.order_id = shipments.order_id
        - Typically one shipment per order, but multiple shipments are possible for split orders.
        - Use for delivery performance and carrier analysis.
        
        
        ## Time Dimension Guidance
        
        **Order Analysis**:
        - Primary date: orders.order_date (when the order was placed)
        - Use for revenue trends, order volume, and customer purchase patterns.
        
        **Payment Analysis**:
        - Primary date: payments.paid_at (when payment was completed)
        - Use for cash flow analysis and payment processing metrics.
        
        **Shipment Analysis**:
        - Shipped date: shipments.shipped_at (when shipment was dispatched)
        - Delivered date: shipments.delivered_at (when shipment was delivered)
        - Use for delivery performance, carrier performance, and fulfillment metrics.
        
        **Customer Analysis**:
        - Registration date: customers.registration_date (when customer registered)
        - Use for customer acquisition trends and cohort analysis.
        
        **Product Analysis**:
        - Created date: products.created_at (when product was added to catalog)
        - Use for product lifecycle and catalog growth analysis.
        
        
        ## Metric Selection and Calculation Guidance
        
        **Revenue Metrics**:
        - Total Revenue: SUM(orders.total_amount) - use orders dataset
        - Subtotal: SUM(orders.subtotal) - use orders dataset
        - Line Item Revenue: SUM(order_items.line_total) - use order_items dataset
        - Average Order Value: SUM(orders.total_amount) / COUNT(DISTINCT orders.order_id)
        
        **Cost and Profit Metrics**:
        - Product Cost: SUM(order_items.quantity * products.cost_price) - requires join to products
        - Gross Profit: SUM(orders.total_amount) - SUM(order_items.quantity * products.cost_price)
        - Gross Margin %: (Gross Profit / Total Revenue) * 100
        
        **Discount Metrics**:
        - Total Discount: SUM(orders.discount_amount) - use orders dataset
        - Average Discount %: (SUM(orders.discount_amount) / SUM(orders.subtotal)) * 100
        
        **Volume Metrics**:
        - Order Count: COUNT(DISTINCT orders.order_id)
        - Line Item Count: COUNT(order_items.order_item_id)
        - Units Sold: SUM(order_items.quantity)
        
        **Customer Metrics**:
        - Customer Count: COUNT(DISTINCT customers.customer_id)
        - Active Customer Count: COUNT(DISTINCT customers.customer_id) WHERE customers.is_active = true
        - Orders per Customer: COUNT(DISTINCT orders.order_id) / COUNT(DISTINCT customers.customer_id)
        
        **Product Metrics**:
        - Product Count: COUNT(DISTINCT products.product_id)
        - Average Unit Price: SUM(order_items.quantity * order_items.unit_price) / SUM(order_items.quantity)
        - Products Sold: COUNT(DISTINCT order_items.product_id)
        
        **Payment Metrics**:
        - Payment Count: COUNT(payments.payment_id)
        - Completed Payment Amount: SUM(payments.amount) WHERE payments.payment_status = 'Completed'
        
        **Shipment Metrics**:
        - Shipment Count: COUNT(shipments.shipment_id)
        - Delivered Shipment Count: COUNT(shipments.shipment_id) WHERE shipments.delivered_at IS NOT NULL
        - Average Delivery Time: AVG(DATEDIFF(day, shipments.shipped_at, shipments.delivered_at))
        
        
        ## Hierarchical Query Guidance
        
        **Product Category Hierarchy**:
        
        The product_categories table contains a self-referencing relationship via parent_category_id.
        
        To traverse the full category hierarchy, use a recursive common table expression (CTE):
        
        ```sql
        WITH RECURSIVE category_hierarchy AS (
          -- Anchor: root categories
          SELECT 
            category_id,
            category_name,
            parent_category_id,
            category_name AS category_path,
            0 AS level
          FROM ecom_bronze.product_categories
          WHERE parent_category_id IS NULL
          
          UNION ALL
          
          -- Recursive: child categories
          SELECT 
            c.category_id,
            c.category_name,
            c.parent_category_id,
            h.category_path || ' > ' || c.category_name AS category_path,
            h.level + 1 AS level
          FROM ecom_bronze.product_categories c
          INNER JOIN category_hierarchy h ON c.parent_category_id = h.category_id
        )
        SELECT * FROM category_hierarchy;
        ```
        
        Use this pattern to:
        - Roll up product sales to parent categories
        - Calculate category depth
        - Find all descendants of a category
        - Build category navigation paths
        
        
        ## Query Restrictions and Limitations
        
        1. **PII Fields**: The following fields contain personally identifiable information and are redacted in samples:
           - customers.first_name
           - customers.last_name
           - customers.email
           - customers.phone
           - customers.date_of_birth
           - orders.tax_amount
           - payments.transaction_ref
        
        2. **Currency**: All monetary amounts are in USD unless otherwise specified. The currency field is available for multi-currency support.
        
        3. **Active Records**: Use is_active flags to filter for current/active records:
           - customers.is_active
           - products.is_active
           - product_categories.is_active
        
        4. **Status Fields**: Filter by status for operational analysis:
           - orders.order_status (e.g., 'Shipped', 'Pending', 'Delivered', 'Cancelled')
           - payments.payment_status (e.g., 'Completed', 'Pending', 'Failed')
           - shipments.shipment_status (e.g., 'In Transit', 'Delivered', 'Pending')
        
        5. **Null Handling**: Some fields may be NULL:
           - shipments.delivered_at (NULL if not yet delivered)
           - payments.paid_at (NULL if payment not completed)
           - product_categories.parent_category_id (NULL for root categories)
           - Various optional fields
        
        6. **ETL Metadata**: All tables contain ETL tracking fields:
           - _source_system: Source system name
           - _batch_id: ETL batch identifier
           - _loaded_at: Load timestamp
           These fields are useful for data lineage but not typically used in business analytics.

    datasets:
      - name: customers
        business_name: Customers
        description: >-
          Contains customer master data including demographic information, contact details, and account status.
          Grain: One row per customer.
          This dataset represents the customer dimension for analytical queries and supports customer segmentation,
          demographic analysis, and customer lifecycle tracking.
        source: ecom_bronze.customers
        primary_key:
          - customer_id
        fields:
          - name: customer_id
            business_name: Customer Identifier
            description: Unique identifier for a customer.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: customer_code
            business_name: Customer Code
            description: Business reference code assigned to the customer.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: first_name
            business_name: First Name
            description: First name of the customer. Contains PII.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_pii: true
          
          - name: last_name
            business_name: Last Name
            description: Last name of the customer. Contains PII.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_pii: true
          
          - name: email
            business_name: Email
            description: Email address of the customer. Contains PII.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_pii: true
          
          - name: phone
            business_name: Phone
            description: Phone number of the customer. Contains PII.
            sql_type: STRING(255)
            dimension:
              is_pii: true
          
          - name: gender
            business_name: Gender
            description: Gender of the customer. Analytical dimension for demographic segmentation.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: date_of_birth
            business_name: Date Of Birth
            description: Date of birth of the customer. Contains PII. Can be used to derive age segments.
            sql_type: DATE
            dimension:
              is_pii: true
              is_time: true
          
          - name: city
            business_name: City
            description: City where the customer resides. Geographic dimension for location-based analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: state
            business_name: State
            description: State or province where the customer resides. Geographic dimension for regional analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: country
            business_name: Country
            description: Country where the customer resides. Geographic dimension for international analysis.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: postal_code
            business_name: Postal Code
            description: Postal or ZIP code of the customer's address. Geographic dimension for micro-location analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: customer_segment
            business_name: Customer Segment
            description: >-
              Indicates the current segment classification of the customer (e.g., Premium, Standard, Basic).
              Key dimension for customer segmentation analysis and targeted marketing.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: registration_date
            business_name: Registration Date
            description: >-
              Date when the customer registered. Time dimension for customer acquisition analysis and cohort tracking.
            sql_type: DATE
            dimension:
              is_time: true
          
          - name: is_active
            business_name: Is Active
            description: >-
              Indicates whether the customer account is currently active. Boolean dimension for filtering active customers.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: orders
        business_name: Orders
        description: >-
          Contains order header information including order totals, dates, status, and shipping details.
          Grain: One row per order.
          This dataset represents the order fact table for analytical queries and supports order volume analysis,
          revenue tracking, and order fulfillment monitoring. Contains order-level financial measures including
          subtotal, discounts, taxes, shipping fees, and total amount.
        source: ecom_bronze.orders
        primary_key:
          - order_id
        fields:
          - name: order_id
            business_name: Order Identifier
            description: Unique identifier for an order.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_number
            business_name: Order Number
            description: Business reference number assigned to the order.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: customer_id
            business_name: Customer ID
            description: References the related customer record. Foreign key to customers.customer_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: order_date
            business_name: Order Date
            description: >-
              Timestamp recording when the order was placed. Primary time dimension for order and revenue analysis.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: order_status
            business_name: Order Status
            description: >-
              Indicates the current status of the order (e.g., Shipped, Pending, Delivered, Cancelled).
              Key dimension for order lifecycle and fulfillment analysis.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: sales_channel
            business_name: Sales Channel
            description: >-
              Indicates the channel through which the order was placed (e.g., Online, Mobile, In-Store).
              Key dimension for channel performance analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: ship_city
            business_name: Ship City
            description: City to which the order is shipped. Geographic dimension for shipping analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: ship_state
            business_name: Ship State
            description: State or province to which the order is shipped. Geographic dimension for regional shipping analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: Postal or ZIP code to which the order is shipped. Geographic dimension for shipping analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: subtotal
            business_name: Subtotal
            description: >-
              Monetary amount representing the order subtotal before discounts and taxes.
              Base measure for order-level revenue analysis.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: discount_amount
            business_name: Discount Amount
            description: >-
              Monetary amount representing the total discount applied to the order.
              Measure for discount analysis and promotional effectiveness.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: tax_amount
            business_name: Tax Amount
            description: >-
              Monetary amount representing the tax charged on the order. Contains PII.
              Measure for tax analysis and compliance reporting.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              is_pii: true
          
          - name: shipping_fee
            business_name: Shipping Fee
            description: >-
              Monetary amount representing the shipping cost for the order.
              Measure for shipping cost analysis and logistics optimization.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: total_amount
            business_name: Total Amount
            description: >-
              Monetary amount representing the final total of the order.
              Primary measure for order-level revenue analysis. Represents the complete order value including all charges.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: currency
            business_name: Currency
            description: Currency code for the order amounts (e.g., USD, EUR, GBP).
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: order_items
        business_name: Order Items
        description: >-
          Contains order line item details including product, quantity, pricing, and discounts.
          Grain: One row per order line item.
          This dataset represents the order line item fact table for analytical queries and supports product-level
          revenue analysis, quantity tracking, and discount analysis. Each order can have multiple line items.
          Contains line-level measures that should be used for product and SKU analysis.
        source: ecom_bronze.order_items
        primary_key:
          - order_item_id
        fields:
          - name: order_item_id
            business_name: Order Item Identifier
            description: Unique identifier for an order line item.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: References the related order record. Foreign key to orders.order_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: line_number
            business_name: Line Number
            description: Sequential line number within the order. Used for ordering and display purposes.
            sql_type: INT
            constraints:
              - NOT NULL
          
          - name: product_id
            business_name: Product ID
            description: References the related product record. Foreign key to products.product_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: quantity
            business_name: Quantity
            description: >-
              Number of units ordered for this line item.
              Measure for volume analysis and inventory planning.
            sql_type: INT
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: unit_price
            business_name: Unit Price
            description: >-
              Monetary amount representing the price per unit.
              Measure for pricing analysis. Use with quantity for revenue calculations.
            sql_type: DECIMAL(12,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
          
          - name: discount_pct
            business_name: Discount Pct
            description: >-
              Percentage discount applied to the line item.
              Measure for discount analysis. Represents the discount rate applied to this line.
            sql_type: DECIMAL(5,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
          
          - name: line_total
            business_name: Line Total
            description: >-
              Monetary amount representing the total for this line item.
              Primary measure for line-level revenue analysis. Represents quantity * unit_price after discount.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: products
        business_name: Products
        description: >-
          Contains product catalog information including SKU, name, category, brand, pricing, and inventory.
          Grain: One row per product.
          This dataset represents the product dimension for analytical queries and supports product performance analysis,
          inventory management, and pricing strategy. Contains both selling price and cost price for margin analysis.
        source: ecom_bronze.products
        primary_key:
          - product_id
        fields:
          - name: product_id
            business_name: Product Identifier
            description: Unique identifier for a product.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: sku
            business_name: Sku
            description: Stock keeping unit code for the product. Business identifier for product tracking.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: product_name
            business_name: Product Name
            description: Name of the product. Primary display name for product identification.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: category_id
            business_name: Category ID
            description: References the related product category record. Foreign key to product_categories.category_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: brand
            business_name: Brand
            description: Brand name of the product. Dimension for brand performance analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: description
            business_name: Description
            description: Detailed description of the product.
            sql_type: STRING(255)
          
          - name: unit_price
            business_name: Unit Price
            description: >-
              Monetary amount representing the selling price per unit.
              Measure for pricing analysis and revenue calculations.
            sql_type: DECIMAL(12,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
          
          - name: cost_price
            business_name: Cost Price
            description: >-
              Monetary amount representing the cost per unit.
              Measure for cost analysis and margin calculations.
            sql_type: DECIMAL(12,2)
            measure:
              aggregation: AVG
          
          - name: currency
            business_name: Currency
            description: Currency code for the product prices (e.g., USD, EUR, GBP).
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: stock_quantity
            business_name: Stock Quantity
            description: >-
              Current inventory quantity available for the product.
              Measure for inventory analysis and stock management.
            sql_type: INT
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: is_active
            business_name: Is Active
            description: >-
              Indicates whether the product is currently active for sale.
              Boolean dimension for filtering active products.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: created_at
            business_name: Created At
            description: >-
              Timestamp recording when the product was created in the system.
              Time dimension for product lifecycle and catalog growth analysis.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: product_categories
        business_name: Product Categories
        description: >-
          Contains product category hierarchy with self-referencing parent relationships.
          Grain: One row per product category.
          This dataset represents the product category dimension for analytical queries and supports hierarchical
          category analysis, category performance tracking, and category-based product grouping.
          The parent_category_id creates a recursive hierarchy allowing multi-level category structures.
        source: ecom_bronze.product_categories
        primary_key:
          - category_id
        fields:
          - name: category_id
            business_name: Category Identifier
            description: Unique identifier for a product category.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: category_name
            business_name: Category Name
            description: Name of the product category. Primary display name for category identification.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: parent_category_id
            business_name: Parent Category ID
            description: >-
              References the parent category in the hierarchy. Foreign key to product_categories.category_id.
              NULL for root categories. Creates a self-referencing hierarchical relationship.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
          
          - name: description
            business_name: Description
            description: Detailed description of the product category.
            sql_type: STRING(255)
          
          - name: is_active
            business_name: Is Active
            description: >-
              Indicates whether the category is currently active.
              Boolean dimension for filtering active categories.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: payments
        business_name: Payments
        description: >-
          Contains payment transaction information including payment method, status, amount, and gateway details.
          Grain: One row per payment transaction.
          This dataset represents the payment fact table for analytical queries and supports payment processing analysis,
          payment method performance, and cash flow tracking. Typically one payment per order but multiple payments possible.
        source: ecom_bronze.payments
        primary_key:
          - payment_id
        fields:
          - name: payment_id
            business_name: Payment Identifier
            description: Unique identifier for a payment transaction.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: References the related order record. Foreign key to orders.order_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: payment_method
            business_name: Payment Method
            description: >-
              Indicates the method used for payment (e.g., Credit Card, PayPal, Bank Transfer).
              Key dimension for payment method analysis and payment preference tracking.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: payment_status
            business_name: Payment Status
            description: >-
              Indicates the current status of the payment (e.g., Completed, Pending, Failed).
              Key dimension for payment processing analysis and failure tracking.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: amount
            business_name: Amount
            description: >-
              Monetary amount representing the payment value.
              Primary measure for payment analysis and cash flow tracking.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: currency
            business_name: Currency
            description: Currency code for the payment amount (e.g., USD, EUR, GBP).
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: transaction_ref
            business_name: Transaction Ref
            description: External reference number for the payment transaction. Contains PII.
            sql_type: STRING(255)
            dimension:
              is_pii: true
          
          - name: gateway
            business_name: Gateway
            description: >-
              Name of the payment gateway used to process the transaction (e.g., Stripe, PayPal).
              Dimension for payment gateway performance analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: paid_at
            business_name: Paid At
            description: >-
              Timestamp recording when the payment was completed.
              Time dimension for payment timing analysis and cash flow tracking.
            sql_type: TIMESTAMP(29,9)
            dimension:
              is_time: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: shipments
        business_name: Shipments
        description: >-
          Contains shipment tracking information including carrier, tracking number, status, and delivery timestamps.
          Grain: One row per shipment.
          This dataset represents the shipment fact table for analytical queries and supports delivery performance analysis,
          carrier performance tracking, and fulfillment monitoring. Typically one shipment per order but multiple shipments
          possible for split orders.
        source: ecom_bronze.shipments
        primary_key:
          - shipment_id
        fields:
          - name: shipment_id
            business_name: Shipment Identifier
            description: Unique identifier for a shipment.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: References the related order record. Foreign key to orders.order_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: carrier
            business_name: Carrier
            description: >-
              Name of the shipping carrier handling the shipment (e.g., FedEx, UPS, USPS).
              Dimension for carrier performance analysis and logistics optimization.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: tracking_number
            business_name: Tracking Number
            description: Tracking number assigned by the carrier for the shipment.
            sql_type: STRING(255)
          
          - name: shipment_status
            business_name: Shipment Status
            description: >-
              Indicates the current status of the shipment (e.g., In Transit, Delivered, Pending).
              Key dimension for shipment lifecycle and delivery tracking.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: shipped_at
            business_name: Shipped At
            description: >-
              Timestamp recording when the shipment was dispatched.
              Time dimension for shipment timing analysis and fulfillment performance.
            sql_type: TIMESTAMP(29,9)
            dimension:
              is_time: true
          
          - name: delivered_at
            business_name: Delivered At
            description: >-
              Timestamp recording when the shipment was delivered. NULL if not yet delivered.
              Time dimension for delivery timing analysis and delivery performance tracking.
            sql_type: TIMESTAMP(29,9)
            dimension:
              is_time: true
          
          - name: ship_city
            business_name: Ship City
            description: City to which the shipment is being sent. Geographic dimension for delivery analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: ship_state
            business_name: Ship State
            description: State or province to which the shipment is being sent. Geographic dimension for regional delivery analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: Postal or ZIP code to which the shipment is being sent. Geographic dimension for delivery analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

    relationships:
      - name: customers_to_orders
        left_dataset: customers
        right_dataset: orders
        relationship_type: one_to_many
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: one_to_many
        description: >-
          A customer can place multiple orders over time. This relationship connects customer demographic
          and segmentation data with order transactions for customer behavior analysis.
        resolution: >-
          Join customers to orders using customer_id. Each customer record can match multiple order records.
          Use this relationship for customer lifetime value analysis, customer purchase patterns, and segmentation-based
          revenue analysis. Filter by customers.is_active to analyze only active customers.

      - name: orders_to_order_items
        left_dataset: orders
        right_dataset: order_items
        relationship_type: one_to_many
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: one_to_many
        description: >-
          Each order contains one or more line items. This relationship connects order header information
          with product-level line item details. CRITICAL: This join will multiply order-level measures by the
          number of line items per order. Use order_items measures for product analysis and orders measures
          for order-level analysis.
        resolution: >-
          Join orders to order_items using order_id. Each order record can match multiple order_item records.
          WARNING: Do not sum order-level measures (orders.total_amount, orders.subtotal, orders.discount_amount,
          orders.tax_amount, orders.shipping_fee) after this join without proper aggregation handling.
          For product-level revenue analysis, use order_items.line_total.
          For order-level revenue analysis, use orders.total_amount with DISTINCT order_id counting.

      - name: order_items_to_products
        left_dataset: order_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        description: >-
          Multiple order line items can reference the same product. This relationship connects order line items
          with product catalog information for product performance analysis, inventory tracking, and margin calculations.
        resolution: >-
          Join order_items to products using product_id. Multiple order_item records can match the same product record.
          Use this relationship for product revenue analysis, product popularity tracking, and margin analysis
          by combining order_items.quantity with products.cost_price.

      - name: products_to_product_categories
        left_dataset: products
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - category_id
          right:
            - category_id
        join_type: many_to_one
        description: >-
          Multiple products belong to the same category. This relationship connects products with their
          category classification for category-level aggregation and hierarchical analysis.
        resolution: >-
          Join products to product_categories using category_id. Multiple product records can match the same
          category record. Use this relationship for category performance analysis and category-based product grouping.

      - name: product_categories_hierarchy
        left_dataset: product_categories
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - parent_category_id
          right:
            - category_id
        join_type: recursive
        description: >-
          Product categories form a hierarchical tree structure through self-referencing parent relationships.
          A category can have a parent category, and root categories have NULL parent_category_id.
          This recursive relationship enables multi-level category hierarchy traversal.
        resolution: >-
          Self-join product_categories using parent_category_id = category_id. Categories with NULL parent_category_id
          are root categories. Use recursive common table expressions (CTEs) to traverse the full hierarchy:
          
          WITH RECURSIVE category_hierarchy AS (
            SELECT category_id, category_name, parent_category_id, category_name AS path, 0 AS level
            FROM ecom_bronze.product_categories
            WHERE parent_category_id IS NULL
            UNION ALL
            SELECT c.category_id, c.category_name, c.parent_category_id,
                   h.path || ' > ' || c.category_name AS path, h.level + 1 AS level
            FROM ecom_bronze.product_categories c
            INNER JOIN category_hierarchy h ON c.parent_category_id = h.category_id
          )
          SELECT * FROM category_hierarchy;
          
          Use this pattern to roll up product sales to parent categories, calculate category depth,
          and build category navigation paths.

      - name: orders_to_payments
        left_dataset: orders
        right_dataset: payments
        relationship_type: one_to_many
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: one_to_many
        description: >-
          An order can have one or more payment transactions. Typically one payment per order, but multiple
          payments are possible for split payments or payment retries. This relationship connects orders with
          payment processing information for payment method analysis and cash flow tracking.
        resolution: >-
          Join orders to payments using order_id. Each order record can match one or more payment records.
          Filter by payments.payment_status = 'Completed' to analyze only successful payments.
          Use payments.paid_at for cash flow timing analysis.

      - name: orders_to_shipments
        left_dataset: orders
        right_dataset: shipments
        relationship_type: one_to_many
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: one_to_many
        description: >-
          An order can have one or more shipments. Typically one shipment per order, but multiple shipments
          are possible for split shipments or partial fulfillment. This relationship connects orders with
          shipment tracking information for delivery performance analysis and carrier tracking.
        resolution: >-
          Join orders to shipments using order_id. Each order record can match one or more shipment records.
          Use shipments.delivered_at IS NOT NULL to filter for delivered shipments.
          Calculate delivery time using DATEDIFF between shipments.shipped_at and shipments.delivered_at.

    metrics:
      - name: total_revenue
        business_name: Total Revenue
        description: >-
          Total revenue from all orders. Represents the sum of order total amounts including all charges.
          This is the primary revenue metric for order-level analysis. Use orders.total_amount for accurate
          order-level revenue without double counting.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.total_amount) AS total_revenue
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.total_amount

      - name: total_subtotal
        business_name: Total Subtotal
        description: >-
          Total order subtotal before discounts and taxes. Represents the base order value before any adjustments.
          Use for analyzing gross order value trends.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.subtotal) AS total_subtotal
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.subtotal

      - name: total_discount
        business_name: Total Discount
        description: >-
          Total discount amount applied to all orders. Represents the sum of all order-level discounts.
          Use for promotional effectiveness analysis and discount impact tracking.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.discount_amount) AS total_discount
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.discount_amount

      - name: total_tax
        business_name: Total Tax
        description: >-
          Total tax amount charged on all orders. Represents the sum of all order-level taxes.
          Use for tax compliance reporting and tax burden analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.tax_amount) AS total_tax
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.tax_amount

      - name: total_shipping_fee
        business_name: Total Shipping Fee
        description: >-
          Total shipping fees charged on all orders. Represents the sum of all order-level shipping costs.
          Use for logistics cost analysis and shipping strategy optimization.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.shipping_fee) AS total_shipping_fee
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.shipping_fee

      - name: order_count
        business_name: Order Count
        description: >-
          Total number of orders. Represents the count of distinct orders for volume analysis.
          Use for order volume trends and order frequency tracking.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT orders.order_id) AS order_count
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.order_id

      - name: average_order_value
        business_name: Average Order Value
        description: >-
          Average revenue per order. Calculated as total revenue divided by order count.
          Key metric for understanding typical order size and customer spending patterns.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT orders.order_id) = 0 THEN 0
                    ELSE SUM(orders.total_amount) / COUNT(DISTINCT orders.order_id)
                  END AS average_order_value
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.total_amount
                - orders.order_id

      - name: average_discount_percentage
        business_name: Average Discount Percentage
        description: >-
          Average discount percentage across all orders. Calculated as total discount divided by total subtotal.
          Use for understanding overall discount intensity and promotional impact.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN SUM(orders.subtotal) = 0 THEN 0
                    ELSE (SUM(orders.discount_amount) / SUM(orders.subtotal)) * 100
                  END AS average_discount_percentage
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.discount_amount
                - orders.subtotal

      - name: units_sold
        business_name: Units Sold
        description: >-
          Total number of product units sold across all order line items. Represents the sum of quantities
          from order items. Use for volume analysis and inventory planning.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.quantity) AS units_sold
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.quantity

      - name: line_item_count
        business_name: Line Item Count
        description: >-
          Total number of order line items. Represents the count of distinct order line items.
          Use for understanding order complexity and average items per order.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(order_items.order_item_id) AS line_item_count
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.order_item_id

      - name: line_item_revenue
        business_name: Line Item Revenue
        description: >-
          Total revenue from order line items. Represents the sum of line totals from order items.
          Use for product-level revenue analysis. This should match total_revenue when aggregated at order level.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.line_total) AS line_item_revenue
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.line_total

      - name: average_unit_price
        business_name: Average Unit Price
        description: >-
          Average selling price per unit across all order line items. Calculated as weighted average
          using quantity as weight. Use for pricing trend analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN SUM(order_items.quantity) = 0 THEN 0
                    ELSE SUM(order_items.quantity * order_items.unit_price) / SUM(order_items.quantity)
                  END AS average_unit_price
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.quantity
                - order_items.unit_price

      - name: product_cost
        business_name: Product Cost
        description: >-
          Total product cost for all units sold. Calculated by multiplying order item quantities
          by product cost prices. Use for cost analysis and margin calculations. Requires join to products.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.quantity * products.cost_price) AS product_cost
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
              columns_used:
                - order_items.quantity
                - products.cost_price

      - name: gross_profit
        business_name: Gross Profit
        description: >-
          Gross profit calculated as total revenue minus product cost. Represents the profit before
          operating expenses. Use for profitability analysis and margin tracking.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.total_amount) - SUM(order_items.quantity * products.cost_price) AS gross_profit
                FROM ecom_bronze.orders AS orders
                INNER JOIN ecom_bronze.order_items AS order_items
                  ON orders.order_id = order_items.order_id
                INNER JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
              columns_used:
                - orders.total_amount
                - order_items.quantity
                - products.cost_price

      - name: gross_margin_percentage
        business_name: Gross Margin Percentage
        description: >-
          Gross margin percentage calculated as gross profit divided by total revenue.
          Key profitability metric representing the percentage of revenue retained after product costs.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN SUM(orders.total_amount) = 0 THEN 0
                    ELSE (
                      (SUM(orders.total_amount) - SUM(order_items.quantity * products.cost_price))
                      / SUM(orders.total_amount)
                    ) * 100
                  END AS gross_margin_percentage
                FROM ecom_bronze.orders AS orders
                INNER JOIN ecom_bronze.order_items AS order_items
                  ON orders.order_id = order_items.order_id
                INNER JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
              columns_used:
                - orders.total_amount
                - order_items.quantity
                - products.cost_price

      - name: customer_count
        business_name: Customer Count
        description: >-
          Total number of customers. Represents the count of distinct customers in the customer base.
          Use for customer base size tracking and growth analysis.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT customers.customer_id) AS customer_count
                FROM ecom_bronze.customers AS customers
              columns_used:
                - customers.customer_id

      - name: active_customer_count
        business_name: Active Customer Count
        description: >-
          Number of active customers. Represents the count of customers with is_active = true.
          Use for active customer base tracking and retention analysis.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT customers.customer_id) AS active_customer_count
                FROM ecom_bronze.customers AS customers
                WHERE customers.is_active = true
              columns_used:
                - customers.customer_id
                - customers.is_active

      - name: orders_per_customer
        business_name: Orders Per Customer
        description: >-
          Average number of orders per customer. Calculated as total orders divided by total customers.
          Use for customer engagement and purchase frequency analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT customers.customer_id) = 0 THEN 0
                    ELSE CAST(COUNT(DISTINCT orders.order_id) AS DECIMAL) / COUNT(DISTINCT customers.customer_id)
                  END AS orders_per_customer
                FROM ecom_bronze.customers AS customers
                LEFT JOIN ecom_bronze.orders AS orders
                  ON customers.customer_id = orders.customer_id
              columns_used:
                - customers.customer_id
                - orders.order_id

      - name: revenue_per_customer
        business_name: Revenue Per Customer
        description: >-
          Average revenue per customer. Calculated as total revenue divided by total customers.
          Key metric for understanding customer value and lifetime value trends.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT customers.customer_id) = 0 THEN 0
                    ELSE SUM(orders.total_amount) / COUNT(DISTINCT customers.customer_id)
                  END AS revenue_per_customer
                FROM ecom_bronze.customers AS customers
                LEFT JOIN ecom_bronze.orders AS orders
                  ON customers.customer_id = orders.customer_id
              columns_used:
                - customers.customer_id
                - orders.total_amount

      - name: product_count
        business_name: Product Count
        description: >-
          Total number of products in the catalog. Represents the count of distinct products.
          Use for catalog size tracking and product portfolio analysis.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT products.product_id) AS product_count
                FROM ecom_bronze.products AS products
              columns_used:
                - products.product_id

      - name: active_product_count
        business_name: Active Product Count
        description: >-
          Number of active products available for sale. Represents the count of products with is_active = true.
          Use for active catalog tracking and product availability analysis.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT products.product_id) AS active_product_count
                FROM ecom_bronze.products AS products
                WHERE products.is_active = true
              columns_used:
                - products.product_id
                - products.is_active

      - name: products_sold
        business_name: Products Sold
        description: >-
          Number of distinct products that have been sold. Represents the count of distinct products
          appearing in order items. Use for product performance and sell-through analysis.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT order_items.product_id) AS products_sold
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.product_id

      - name: total_inventory_value
        business_name: Total Inventory Value
        description: >-
          Total value of current inventory at cost price. Calculated as sum of stock quantity
          multiplied by cost price for all products. Use for inventory valuation and working capital analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(products.stock_quantity * products.cost_price) AS total_inventory_value
                FROM ecom_bronze.products AS products
              columns_used:
                - products.stock_quantity
                - products.cost_price

      - name: payment_count
        business_name: Payment Count
        description: >-
          Total number of payment transactions. Represents the count of all payment records.
          Use for payment volume tracking and payment processing analysis.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(payments.payment_id) AS payment_count
                FROM ecom_bronze.payments AS payments
              columns_used:
                - payments.payment_id

      - name: completed_payment_amount
        business_name: Completed Payment Amount
        description: >-
          Total amount of completed payments. Represents the sum of payment amounts with status = 'Completed'.
          Use for cash flow analysis and successful payment tracking.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(payments.amount) AS completed_payment_amount
                FROM ecom_bronze.payments AS payments
                WHERE payments.payment_status = 'Completed'
              columns_used:
                - payments.amount
                - payments.payment_status

      - name: shipment_count
        business_name: Shipment Count
        description: >-
          Total number of shipments. Represents the count of all shipment records.
          Use for shipment volume tracking and fulfillment analysis.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(shipments.shipment_id) AS shipment_count
                FROM ecom_bronze.shipments AS shipments
              columns_used:
                - shipments.shipment_id

      - name: delivered_shipment_count
        business_name: Delivered Shipment Count
        description: >-
          Number of delivered shipments. Represents the count of shipments with non-null delivered_at timestamp.
          Use for delivery completion tracking and fulfillment success analysis.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(shipments.shipment_id) AS delivered_shipment_count
                FROM ecom_bronze.shipments AS shipments
                WHERE shipments.delivered_at IS NOT NULL
              columns_used:
                - shipments.shipment_id
                - shipments.delivered_at

      - name: average_delivery_time_days
        business_name: Average Delivery Time Days
        description: >-
          Average delivery time in days from shipment to delivery. Calculated as the average difference
          between delivered_at and shipped_at for completed shipments. Use for delivery performance tracking
          and carrier performance analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(DATEDIFF(shipments.delivered_at, shipments.shipped_at)) AS average_delivery_time_days
                FROM ecom_bronze.shipments AS shipments
                WHERE shipments.shipped_at IS NOT NULL
                  AND shipments.delivered_at IS NOT NULL
              columns_used:
                - shipments.shipped_at
                - shipments.delivered_at

      - name: on_time_delivery_rate
        business_name: On Time Delivery Rate
        description: >-
          Percentage of shipments delivered within expected timeframe. Calculated as the percentage of
          delivered shipments. Use for delivery performance monitoring and SLA tracking.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(shipments.shipment_id) = 0 THEN 0
                    ELSE (
                      CAST(COUNT(CASE WHEN shipments.delivered_at IS NOT NULL THEN 1 END) AS DECIMAL)
                      / COUNT(shipments.shipment_id)
                    ) * 100
                  END AS on_time_delivery_rate
                FROM ecom_bronze.shipments AS shipments
              columns_used:
                - shipments.shipment_id
                - shipments.delivered_at

      - name: revenue_by_month
        business_name: Revenue By Month
        description: >-
          Monthly revenue aggregated by order date. Represents total revenue grouped by month.
          Use for revenue trend analysis and seasonal pattern identification.
        return_type: DECIMAL
        result_grain: one row per month
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  DATE_TRUNC('MONTH', orders.order_date) AS order_month,
                  SUM(orders.total_amount) AS monthly_revenue
                FROM ecom_bronze.orders AS orders
                GROUP BY DATE_TRUNC('MONTH', orders.order_date)
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.total_amount

      - name: orders_by_month
        business_name: Orders By Month
        description: >-
          Monthly order count aggregated by order date. Represents order volume grouped by month.
          Use for order volume trend analysis and demand forecasting.
        return_type: INTEGER
        result_grain: one row per month
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  DATE_TRUNC('MONTH', orders.order_date) AS order_month,
                  COUNT(DISTINCT orders.order_id) AS monthly_orders
                FROM ecom_bronze.orders AS orders
                GROUP BY DATE_TRUNC('MONTH', orders.order_date)
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.order_id

      - name: revenue_by_customer_segment
        business_name: Revenue By Customer Segment
        description: >-
          Revenue aggregated by customer segment. Represents total revenue grouped by customer segment
          classification. Use for segment performance analysis and targeted strategy development.
        return_type: DECIMAL
        result_grain: one row per customer segment
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  customers.customer_segment,
                  SUM(orders.total_amount) AS segment_revenue
                FROM ecom_bronze.customers AS customers
                INNER JOIN ecom_bronze.orders AS orders
                  ON customers.customer_id = orders.customer_id
                GROUP BY customers.customer_segment
                ORDER BY segment_revenue DESC
              columns_used:
                - customers.customer_segment
                - orders.total_amount

      - name: revenue_by_sales_channel
        business_name: Revenue By Sales Channel
        description: >-
          Revenue aggregated by sales channel. Represents total revenue grouped by sales channel.
          Use for channel performance analysis and omnichannel strategy optimization.
        return_type: DECIMAL
        result_grain: one row per sales channel
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  orders.sales_channel,
                  SUM(orders.total_amount) AS channel_revenue
                FROM ecom_bronze.orders AS orders
                GROUP BY orders.sales_channel
                ORDER BY channel_revenue DESC
              columns_used:
                - orders.sales_channel
                - orders.total_amount

      - name: revenue_by_product
        business_name: Revenue By Product
        description: >-
          Revenue aggregated by product. Represents total line item revenue grouped by product.
          Use for product performance analysis and product portfolio optimization.
        return_type: DECIMAL
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  products.product_id,
                  products.product_name,
                  SUM(order_items.line_total) AS product_revenue
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
                GROUP BY products.product_id, products.product_name
                ORDER BY product_revenue DESC
              columns_used:
                - products.product_id
                - products.product_name
                - order_items.line_total

      - name: revenue_by_category
        business_name: Revenue By Category
        description: >-
          Revenue aggregated by product category. Represents total line item revenue grouped by category.
          Use for category performance analysis and category-level strategy development.
        return_type: DECIMAL
        result_grain: one row per category
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  product_categories.category_id,
                  product_categories.category_name,
                  SUM(order_items.line_total) AS category_revenue
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
                INNER JOIN ecom_bronze.product_categories AS product_categories
                  ON products.category_id = product_categories.category_id
                GROUP BY product_categories.category_id, product_categories.category_name
                ORDER BY category_revenue DESC
              columns_used:
                - product_categories.category_id
                - product_categories.category_name
                - order_items.line_total

      - name: top_customers_by_revenue
        business_name: Top Customers By Revenue
        description: >-
          Customers ranked by total revenue. Represents customers ordered by their total purchase value.
          Use for identifying high-value customers and VIP customer analysis.
        return_type: DECIMAL
        result_grain: one row per customer
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  customers.customer_id,
                  customers.customer_code,
                  customers.customer_segment,
                  SUM(orders.total_amount) AS customer_revenue,
                  RANK() OVER (ORDER BY SUM(orders.total_amount) DESC) AS revenue_rank
                FROM ecom_bronze.customers AS customers
                INNER JOIN ecom_bronze.orders AS orders
                  ON customers.customer_id = orders.customer_id
                GROUP BY customers.customer_id, customers.customer_code, customers.customer_segment
                ORDER BY customer_revenue DESC
              columns_used:
                - customers.customer_id
                - customers.customer_code
                - customers.customer_segment
                - orders.total_amount

      - name: top_products_by_units_sold
        business_name: Top Products By Units Sold
        description: >-
          Products ranked by total units sold. Represents products ordered by their total quantity sold.
          Use for identifying best-selling products and inventory planning.
        return_type: INTEGER
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  products.product_id,
                  products.product_name,
                  products.brand,
                  SUM(order_items.quantity) AS units_sold,
                  RANK() OVER (ORDER BY SUM(order_items.quantity) DESC) AS units_rank
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
                GROUP BY products.product_id, products.product_name, products.brand
                ORDER BY units_sold DESC
              columns_used:
                - products.product_id
                - products.product_name
                - products.brand
                - order_items.quantity
