version: "1.0"

semantic_model:
  - name: ecom_retail_analytics
    description: >-
      Comprehensive semantic model for retail e-commerce analytics covering customers, orders, products, 
      payments, and shipments. This model supports revenue analysis, customer segmentation, product performance, 
      order fulfillment, and payment processing analytics.
    
    ai_context:
      instructions: >-
        ## Dataset Grain Reference
        
        - **customers**: One row per customer. Contains customer demographic and registration information.
        - **orders**: One row per order. Contains order header information including totals, dates, and shipping details.
        - **order_items**: One row per order line item. Contains product-level detail for each order with quantities and pricing.
        - **products**: One row per product. Contains product catalog information including pricing and inventory.
        - **product_categories**: One row per product category. Contains category hierarchy with self-referencing parent relationships.
        - **payments**: One row per payment transaction. Contains payment method, status, and transaction details.
        - **shipments**: One row per shipment. Contains shipping carrier, tracking, and delivery information.
        
        ## Critical Grain Differences and Double-Counting Prevention
        
        **IMPORTANT**: The orders and order_items datasets have different grains that can cause double-counting if not handled correctly.
        
        - **orders** contains one row per order with order-level totals (subtotal, discount_amount, tax_amount, shipping_fee, total_amount)
        - **order_items** contains multiple rows per order (one per product line item) with line-level amounts (unit_price, discount_pct, line_total)
        
        ### Double-Counting Rules:
        
        1. **For order-level revenue analysis**: Use orders.total_amount, orders.subtotal, orders.discount_amount, orders.tax_amount, orders.shipping_fee
           - DO NOT join to order_items and sum these fields
           - These are already aggregated at order level
        
        2. **For product-level or line-item revenue analysis**: Use order_items.line_total, order_items.quantity, order_items.unit_price
           - Join orders to order_items when analyzing by product
           - Sum order_items.line_total for product revenue
        
        3. **For customer-level metrics**: 
           - Use orders dataset for order counts and order-level revenue
           - Use order_items dataset for product purchase patterns
           - Never sum orders.total_amount after joining to order_items
        
        4. **For time-series analysis**:
           - Use orders.order_date for order-level time analysis
           - Join to order_items only when product dimension is required
        
        ## Relationship Navigation
        
        ### Standard Relationships:
        
        - **customers → orders**: One customer can have many orders (one-to-many)
        - **orders → order_items**: One order can have many line items (one-to-many)
        - **orders → payments**: One order can have many payments (one-to-many)
        - **orders → shipments**: One order can have many shipments (one-to-many)
        - **products → order_items**: One product can appear in many order items (one-to-many)
        - **product_categories → products**: One category can contain many products (one-to-many)
        
        ### Hierarchical Relationship:
        
        - **product_categories → product_categories (self-referencing)**: Categories form a hierarchy through parent_category_id
          - Use recursive queries to traverse the full category hierarchy
          - A category can have one parent and multiple children
        
        ## Time Dimension Guidance
        
        ### Primary Date Fields:
        
        - **orders.order_date**: Use for order placement analysis, sales trends, revenue by period
        - **customers.registration_date**: Use for customer acquisition analysis, cohort analysis
        - **payments.paid_at**: Use for payment processing analysis, cash flow analysis
        - **shipments.shipped_at**: Use for fulfillment analysis, shipping performance
        - **shipments.delivered_at**: Use for delivery performance, customer satisfaction analysis
        - **products.created_at**: Use for product launch analysis, catalog growth
        
        ### Time-Based Analysis:
        
        - For revenue trends: Use orders.order_date
        - For customer acquisition: Use customers.registration_date
        - For fulfillment metrics: Use shipments.shipped_at and shipments.delivered_at
        - For payment timing: Use payments.paid_at
        
        ## Metric Selection Guidance
        
        ### Revenue Metrics:
        - Use orders.total_amount for total order revenue
        - Use orders.subtotal for pre-tax, pre-shipping revenue
        - Use order_items.line_total for product-level revenue
        - Never mix order-level and line-level revenue in the same aggregation without proper grain handling
        
        ### Customer Metrics:
        - Count distinct customers.customer_id for customer counts
        - Use orders dataset joined to customers for customer order patterns
        - Use customers.customer_segment for segmentation analysis
        
        ### Product Metrics:
        - Use order_items.quantity for units sold
        - Use order_items.line_total for product revenue
        - Join to products for product attributes (brand, category)
        - Join to product_categories for category analysis
        
        ### Fulfillment Metrics:
        - Use shipments dataset for shipping analysis
        - Calculate delivery time as delivered_at - shipped_at
        - Join shipments to orders for order fulfillment analysis
        
        ## Join Guidance
        
        ### Safe Joins:
        
        1. **customers ← orders**: Safe to aggregate order metrics by customer
        2. **orders ← order_items**: Safe for product-level analysis, but DO NOT sum order-level amounts
        3. **products ← order_items**: Safe to aggregate line_total by product
        4. **product_categories ← products**: Safe to aggregate product metrics by category
        5. **orders ← payments**: Safe to analyze payment patterns by order
        6. **orders ← shipments**: Safe to analyze shipment patterns by order
        
        ### Complex Joins:
        
        1. **Category Hierarchy**: Use recursive CTE to traverse product_categories.parent_category_id
        2. **Customer → Order → Order Items**: Multi-level join for customer product purchase analysis
        3. **Order → Shipments (multiple)**: One order may have multiple shipments
        
        ## Query Restrictions and Warnings
        
        1. **Never sum order-level amounts after joining to order_items** - this will multiply the amounts by the number of line items
        2. **Category hierarchy requires recursive queries** - use WITH RECURSIVE in Databricks SQL
        3. **Multiple shipments per order** - use appropriate aggregation when joining orders to shipments
        4. **PII fields are redacted** - first_name, last_name, email, phone, date_of_birth, transaction_ref contain redacted values
        5. **Currency handling** - all amounts are in the currency specified in the currency field (primarily USD)
        6. **Active status filtering** - consider is_active flags on customers, products, and categories for current state analysis
        
        ## Analytical Use Cases
        
        1. **Revenue Analysis**: Use orders dataset with order_date for time-series revenue
        2. **Product Performance**: Use order_items joined to products for product sales analysis
        3. **Customer Segmentation**: Use customers.customer_segment with order aggregations
        4. **Fulfillment Performance**: Use shipments with delivered_at - shipped_at for delivery time
        5. **Payment Analysis**: Use payments dataset for payment method and status analysis
        6. **Category Performance**: Use product_categories hierarchy with product sales
        7. **Geographic Analysis**: Use ship_city, ship_state, country dimensions from orders or customers
        8. **Channel Analysis**: Use orders.sales_channel for channel performance

    datasets:
      - name: customers
        business_name: Customers
        description: >-
          Contains customer master data including demographic information, contact details, and segmentation.
          Grain: One row per customer. Each customer is uniquely identified by customer_id.
        source: ecom_bronze.customers
        primary_key:
          - customer_id
        fields:
          - name: customer_id
            business_name: Customer Identifier
            description: Unique identifier for a customer.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: customer_code
            business_name: Customer Code
            description: Business reference code assigned to the customer.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: first_name
            business_name: First Name
            description: First name of the customer. PII field with redacted values.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: last_name
            business_name: Last Name
            description: Last name of the customer. PII field with redacted values.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: email
            business_name: Email
            description: Email address of the customer. PII field with redacted values.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: phone
            business_name: Phone
            description: Phone number of the customer. PII field with redacted values.
            sql_type: STRING
          
          - name: gender
            business_name: Gender
            description: Gender of the customer. Analytical dimension for demographic segmentation.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: date_of_birth
            business_name: Date Of Birth
            description: Date of birth of the customer. PII field with redacted values.
            sql_type: DATE
          
          - name: city
            business_name: City
            description: City where the customer resides. Geographic dimension for location-based analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: state
            business_name: State
            description: State or province where the customer resides. Geographic dimension for regional analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: country
            business_name: Country
            description: Country where the customer resides. Geographic dimension for country-level analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: postal_code
            business_name: Postal Code
            description: Postal or ZIP code of the customer's address.
            sql_type: STRING
          
          - name: customer_segment
            business_name: Customer Segment
            description: >-
              Indicates the current segment classification of the customer (e.g., Premium, Standard).
              Key dimension for customer segmentation analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: registration_date
            business_name: Registration Date
            description: Date when the customer registered. Time dimension for customer acquisition analysis.
            sql_type: DATE
            dimension:
              is_time: true
          
          - name: is_active
            business_name: Is Active
            description: Indicates whether the customer account is currently active.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

      - name: orders
        business_name: Orders
        description: >-
          Contains order header information including order totals, dates, status, and shipping details.
          Grain: One row per order. Each order is uniquely identified by order_id.
          IMPORTANT: Order-level amounts (total_amount, subtotal, discount_amount, tax_amount, shipping_fee) 
          are already aggregated and should not be summed after joining to order_items.
        source: ecom_bronze.orders
        primary_key:
          - order_id
        fields:
          - name: order_id
            business_name: Order Identifier
            description: Unique identifier for an order.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_number
            business_name: Order Number
            description: Business reference number assigned to the order.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: customer_id
            business_name: Customer ID
            description: References the related customer record. Foreign key to customers.customer_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: order_date
            business_name: Order Date
            description: >-
              Timestamp recording when the order was placed. Primary time dimension for order and revenue analysis.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: order_status
            business_name: Order Status
            description: >-
              Indicates the current status of the order (e.g., Shipped, Delivered, Cancelled).
              Key dimension for order lifecycle analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: sales_channel
            business_name: Sales Channel
            description: >-
              Indicates the channel through which the order was placed (e.g., Online, Mobile, Store).
              Key dimension for channel performance analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: ship_city
            business_name: Ship City
            description: City to which the order is shipped. Geographic dimension.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: ship_state
            business_name: Ship State
            description: State or province to which the order is shipped. Geographic dimension.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: Postal or ZIP code to which the order is shipped.
            sql_type: STRING
          
          - name: subtotal
            business_name: Subtotal
            description: >-
              Monetary amount representing the order subtotal before discounts and taxes.
              Order-level measure. Do not sum after joining to order_items.
            sql_type: DECIMAL
            measure:
              aggregation: SUM
              is_additive: true
          
          - name: discount_amount
            business_name: Discount Amount
            description: >-
              Monetary amount representing the total discount applied to the order.
              Order-level measure. Do not sum after joining to order_items.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              is_additive: true
          
          - name: tax_amount
            business_name: Tax Amount
            description: >-
              Monetary amount representing the tax charged on the order.
              Order-level measure. Do not sum after joining to order_items.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              is_additive: true
          
          - name: shipping_fee
            business_name: Shipping Fee
            description: >-
              Monetary amount representing the shipping cost for the order.
              Order-level measure. Do not sum after joining to order_items.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              is_additive: true
          
          - name: total_amount
            business_name: Total Amount
            description: >-
              Monetary amount representing the final total of the order.
              Order-level measure representing complete order revenue. Do not sum after joining to order_items.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              is_additive: true
          
          - name: currency
            business_name: Currency
            description: Currency code for the order amounts (e.g., USD, EUR).
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

      - name: order_items
        business_name: Order Items
        description: >-
          Contains order line item details including product, quantity, pricing, and line totals.
          Grain: One row per order line item. Each line item is uniquely identified by order_item_id.
          Use this dataset for product-level revenue analysis.
        source: ecom_bronze.order_items
        primary_key:
          - order_item_id
        fields:
          - name: order_item_id
            business_name: Order Item Identifier
            description: Unique identifier for an order line item.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: References the related order record. Foreign key to orders.order_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: line_number
            business_name: Line Number
            description: Sequential line number within the order.
            sql_type: INT
            constraints:
              - NOT NULL
          
          - name: product_id
            business_name: Product ID
            description: References the related product record. Foreign key to products.product_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: quantity
            business_name: Quantity
            description: Number of units ordered for this line item. Line-level measure for units sold.
            sql_type: INT
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              is_additive: true
          
          - name: unit_price
            business_name: Unit Price
            description: Monetary amount representing the price per unit for this line item.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
          
          - name: discount_pct
            business_name: Discount Pct
            description: Percentage discount applied to the line item.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
          
          - name: line_total
            business_name: Line Total
            description: >-
              Monetary amount representing the total for this line item.
              Line-level measure for product revenue analysis. Derived from quantity * unit_price * (1 - discount_pct/100).
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              is_additive: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

      - name: products
        business_name: Products
        description: >-
          Contains product catalog information including SKU, pricing, inventory, and category assignment.
          Grain: One row per product. Each product is uniquely identified by product_id.
        source: ecom_bronze.products
        primary_key:
          - product_id
        fields:
          - name: product_id
            business_name: Product Identifier
            description: Unique identifier for a product.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: sku
            business_name: SKU
            description: Stock keeping unit code for the product.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: product_name
            business_name: Product Name
            description: Name of the product. Key dimension for product analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: category_id
            business_name: Category ID
            description: References the related product category record. Foreign key to product_categories.category_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: brand
            business_name: Brand
            description: Brand name of the product. Key dimension for brand analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: description
            business_name: Description
            description: Detailed description of the product.
            sql_type: STRING
          
          - name: unit_price
            business_name: Unit Price
            description: Monetary amount representing the selling price per unit.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
          
          - name: cost_price
            business_name: Cost Price
            description: Monetary amount representing the cost per unit.
            sql_type: DECIMAL
          
          - name: currency
            business_name: Currency
            description: Currency code for the product prices.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: stock_quantity
            business_name: Stock Quantity
            description: Current inventory quantity available for the product.
            sql_type: INT
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              is_additive: true
          
          - name: is_active
            business_name: Is Active
            description: Indicates whether the product is currently active for sale.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
          
          - name: created_at
            business_name: Created At
            description: Timestamp recording when the product was created in the system.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

      - name: product_categories
        business_name: Product Categories
        description: >-
          Contains product category hierarchy with self-referencing parent relationships.
          Grain: One row per product category. Each category is uniquely identified by category_id.
          Categories form a hierarchy through parent_category_id enabling multi-level category analysis.
        source: ecom_bronze.product_categories
        primary_key:
          - category_id
        fields:
          - name: category_id
            business_name: Category Identifier
            description: Unique identifier for a product category.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: category_name
            business_name: Category Name
            description: Name of the product category. Key dimension for category analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: parent_category_id
            business_name: Parent Category ID
            description: >-
              References the parent category in the hierarchy. Self-referencing foreign key to product_categories.category_id.
              Enables hierarchical category analysis using recursive queries.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
          
          - name: description
            business_name: Description
            description: Detailed description of the product category.
            sql_type: STRING
          
          - name: is_active
            business_name: Is Active
            description: Indicates whether the category is currently active.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

      - name: payments
        business_name: Payments
        description: >-
          Contains payment transaction information including payment method, status, amount, and gateway details.
          Grain: One row per payment transaction. Each payment is uniquely identified by payment_id.
          An order may have multiple payment transactions.
        source: ecom_bronze.payments
        primary_key:
          - payment_id
        fields:
          - name: payment_id
            business_name: Payment Identifier
            description: Unique identifier for a payment transaction.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: References the related order record. Foreign key to orders.order_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: payment_method
            business_name: Payment Method
            description: >-
              Indicates the method used for payment (e.g., Credit Card, PayPal, Bank Transfer).
              Key dimension for payment method analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: payment_status
            business_name: Payment Status
            description: >-
              Indicates the current status of the payment (e.g., Completed, Pending, Failed).
              Key dimension for payment processing analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: amount
            business_name: Amount
            description: Monetary amount representing the payment value.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              is_additive: true
          
          - name: currency
            business_name: Currency
            description: Currency code for the payment amount.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: transaction_ref
            business_name: Transaction Ref
            description: External reference number for the payment transaction. PII field with redacted values.
            sql_type: STRING
          
          - name: gateway
            business_name: Gateway
            description: >-
              Name of the payment gateway used to process the transaction (e.g., Stripe, PayPal).
              Dimension for payment gateway analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: paid_at
            business_name: Paid At
            description: Timestamp recording when the payment was completed. Time dimension for payment timing analysis.
            sql_type: TIMESTAMP
            dimension:
              is_time: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

      - name: shipments
        business_name: Shipments
        description: >-
          Contains shipment information including carrier, tracking, status, and delivery timestamps.
          Grain: One row per shipment. Each shipment is uniquely identified by shipment_id.
          An order may have multiple shipments.
        source: ecom_bronze.shipments
        primary_key:
          - shipment_id
        fields:
          - name: shipment_id
            business_name: Shipment Identifier
            description: Unique identifier for a shipment.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: References the related order record. Foreign key to orders.order_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: carrier
            business_name: Carrier
            description: >-
              Name of the shipping carrier handling the shipment (e.g., FedEx, UPS, USPS).
              Key dimension for carrier performance analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: tracking_number
            business_name: Tracking Number
            description: Tracking number assigned by the carrier for the shipment.
            sql_type: STRING
          
          - name: shipment_status
            business_name: Shipment Status
            description: >-
              Indicates the current status of the shipment (e.g., In Transit, Delivered, Delayed).
              Key dimension for shipment lifecycle analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: shipped_at
            business_name: Shipped At
            description: >-
              Timestamp recording when the shipment was dispatched.
              Time dimension for fulfillment timing analysis.
            sql_type: TIMESTAMP
            dimension:
              is_time: true
          
          - name: delivered_at
            business_name: Delivered At
            description: >-
              Timestamp recording when the shipment was delivered.
              Time dimension for delivery performance analysis.
            sql_type: TIMESTAMP
            dimension:
              is_time: true
          
          - name: ship_city
            business_name: Ship City
            description: City to which the shipment is being sent. Geographic dimension.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: ship_state
            business_name: Ship State
            description: State or province to which the shipment is being sent. Geographic dimension.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: Postal or ZIP code to which the shipment is being sent.
            sql_type: STRING
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

    relationships:
      - name: orders_to_customers
        left_dataset: orders
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        description: >-
          Each order belongs to one customer. A customer can have multiple orders.
          Use this relationship to analyze order patterns by customer, customer segment, or customer demographics.
        resolution: >-
          Standard foreign key relationship. Join orders.customer_id = customers.customer_id.
          Safe to aggregate order metrics by customer dimensions.

      - name: order_items_to_orders
        left_dataset: order_items
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        description: >-
          Each order line item belongs to one order. An order can have multiple line items.
          CRITICAL: Do not sum order-level amounts (total_amount, subtotal, discount_amount, tax_amount, shipping_fee) 
          after this join as it will cause double-counting. Use order_items.line_total for product-level revenue.
        resolution: >-
          Standard foreign key relationship. Join order_items.order_id = orders.order_id.
          When analyzing by product, use order_items.line_total. When analyzing order-level metrics, 
          use orders dataset directly without joining to order_items.

      - name: order_items_to_products
        left_dataset: order_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        description: >-
          Each order line item references one product. A product can appear in multiple order line items.
          Use this relationship to analyze product sales performance, product revenue, and units sold by product attributes.
        resolution: >-
          Standard foreign key relationship. Join order_items.product_id = products.product_id.
          Safe to aggregate order_items.line_total and order_items.quantity by product dimensions.

      - name: products_to_product_categories
        left_dataset: products
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - category_id
          right:
            - category_id
        join_type: many_to_one
        description: >-
          Each product belongs to one category. A category can contain multiple products.
          Use this relationship to analyze product performance by category.
        resolution: >-
          Standard foreign key relationship. Join products.category_id = product_categories.category_id.
          Safe to aggregate product metrics by category dimensions.

      - name: product_categories_hierarchy
        left_dataset: product_categories
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - parent_category_id
          right:
            - category_id
        join_type: many_to_one
        description: >-
          Self-referencing hierarchical relationship. Each category can have one parent category.
          A parent category can have multiple child categories. This enables multi-level category hierarchy traversal.
        resolution: >-
          Recursive relationship. Join product_categories.parent_category_id = product_categories.category_id.
          Use recursive CTEs (WITH RECURSIVE) in Databricks SQL to traverse the full category hierarchy.
          Example: Find all descendant categories, calculate category depth, or aggregate metrics across hierarchy levels.

      - name: payments_to_orders
        left_dataset: payments
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        description: >-
          Each payment transaction belongs to one order. An order can have multiple payment transactions.
          Use this relationship to analyze payment patterns, payment methods, and payment status by order characteristics.
        resolution: >-
          Standard foreign key relationship. Join payments.order_id = orders.order_id.
          When aggregating payment amounts by order, be aware that multiple payments may exist per order.

      - name: shipments_to_orders
        left_dataset: shipments
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        description: >-
          Each shipment belongs to one order. An order can have multiple shipments.
          Use this relationship to analyze fulfillment performance, delivery times, and carrier performance by order characteristics.
        resolution: >-
          Standard foreign key relationship. Join shipments.order_id = orders.order_id.
          When aggregating shipment metrics by order, be aware that multiple shipments may exist per order.

    metrics:
      - name: total_revenue
        business_name: Total Revenue
        description: >-
          Total revenue from all orders calculated as the sum of order total amounts.
          This represents the complete order value including products, taxes, and shipping.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.total_amount) AS total_revenue
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.total_amount

      - name: total_order_subtotal
        business_name: Total Order Subtotal
        description: >-
          Total order subtotal before taxes and shipping fees.
          Represents the sum of product values before additional charges.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.subtotal) AS total_order_subtotal
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.subtotal

      - name: total_discount_amount
        business_name: Total Discount Amount
        description: >-
          Total discount amount applied across all orders.
          Represents the sum of all order-level discounts.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.discount_amount) AS total_discount_amount
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.discount_amount

      - name: total_tax_amount
        business_name: Total Tax Amount
        description: >-
          Total tax amount collected across all orders.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.tax_amount) AS total_tax_amount
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.tax_amount

      - name: total_shipping_fees
        business_name: Total Shipping Fees
        description: >-
          Total shipping fees collected across all orders.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.shipping_fee) AS total_shipping_fees
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.shipping_fee

      - name: order_count
        business_name: Order Count
        description: >-
          Total number of orders placed.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(orders.order_id) AS order_count
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.order_id

      - name: customer_count
        business_name: Customer Count
        description: >-
          Total number of unique customers.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT customers.customer_id) AS customer_count
                FROM ecom_bronze.customers AS customers
              columns_used:
                - customers.customer_id

      - name: active_customer_count
        business_name: Active Customer Count
        description: >-
          Total number of active customers based on is_active flag.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT customers.customer_id) AS active_customer_count
                FROM ecom_bronze.customers AS customers
                WHERE customers.is_active = true
              columns_used:
                - customers.customer_id
                - customers.is_active

      - name: average_order_value
        business_name: Average Order Value
        description: >-
          Average order value calculated as total revenue divided by number of orders.
          Represents the typical order size.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(orders.order_id) = 0 THEN 0
                    ELSE SUM(orders.total_amount) / COUNT(orders.order_id)
                  END AS average_order_value
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.total_amount
                - orders.order_id

      - name: orders_per_customer
        business_name: Orders Per Customer
        description: >-
          Average number of orders per customer calculated as total orders divided by unique customers who placed orders.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT orders.customer_id) = 0 THEN 0
                    ELSE CAST(COUNT(orders.order_id) AS DECIMAL) / COUNT(DISTINCT orders.customer_id)
                  END AS orders_per_customer
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.order_id
                - orders.customer_id

      - name: revenue_per_customer
        business_name: Revenue Per Customer
        description: >-
          Average revenue per customer calculated as total revenue divided by unique customers who placed orders.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT orders.customer_id) = 0 THEN 0
                    ELSE SUM(orders.total_amount) / COUNT(DISTINCT orders.customer_id)
                  END AS revenue_per_customer
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.total_amount
                - orders.customer_id

      - name: total_units_sold
        business_name: Total Units Sold
        description: >-
          Total number of product units sold across all order line items.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.quantity) AS total_units_sold
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.quantity

      - name: product_revenue
        business_name: Product Revenue
        description: >-
          Total revenue from product line items calculated as sum of line totals.
          Use this metric for product-level revenue analysis, not order-level revenue.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.line_total) AS product_revenue
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.line_total

      - name: average_unit_price
        business_name: Average Unit Price
        description: >-
          Average unit price across all order line items weighted by quantity.
          Calculated as total line revenue divided by total units sold.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN SUM(order_items.quantity) = 0 THEN 0
                    ELSE SUM(order_items.line_total) / SUM(order_items.quantity)
                  END AS average_unit_price
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.line_total
                - order_items.quantity

      - name: average_discount_percentage
        business_name: Average Discount Percentage
        description: >-
          Average discount percentage applied across all order line items.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(order_items.discount_pct) AS average_discount_percentage
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.discount_pct

      - name: product_count
        business_name: Product Count
        description: >-
          Total number of unique products in the catalog.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT products.product_id) AS product_count
                FROM ecom_bronze.products AS products
              columns_used:
                - products.product_id

      - name: active_product_count
        business_name: Active Product Count
        description: >-
          Total number of active products available for sale based on is_active flag.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT products.product_id) AS active_product_count
                FROM ecom_bronze.products AS products
                WHERE products.is_active = true
              columns_used:
                - products.product_id
                - products.is_active

      - name: total_inventory_value
        business_name: Total Inventory Value
        description: >-
          Total value of current inventory calculated as sum of (stock_quantity * cost_price) for all products.
          Only includes products where cost_price is available.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(products.stock_quantity * products.cost_price) AS total_inventory_value
                FROM ecom_bronze.products AS products
                WHERE products.cost_price IS NOT NULL
              columns_used:
                - products.stock_quantity
                - products.cost_price

      - name: payment_count
        business_name: Payment Count
        description: >-
          Total number of payment transactions.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(payments.payment_id) AS payment_count
                FROM ecom_bronze.payments AS payments
              columns_used:
                - payments.payment_id

      - name: completed_payment_count
        business_name: Completed Payment Count
        description: >-
          Total number of completed payment transactions.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(payments.payment_id) AS completed_payment_count
                FROM ecom_bronze.payments AS payments
                WHERE payments.payment_status = 'Completed'
              columns_used:
                - payments.payment_id
                - payments.payment_status

      - name: total_payment_amount
        business_name: Total Payment Amount
        description: >-
          Total payment amount across all payment transactions.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(payments.amount) AS total_payment_amount
                FROM ecom_bronze.payments AS payments
              columns_used:
                - payments.amount

      - name: shipment_count
        business_name: Shipment Count
        description: >-
          Total number of shipments.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(shipments.shipment_id) AS shipment_count
                FROM ecom_bronze.shipments AS shipments
              columns_used:
                - shipments.shipment_id

      - name: delivered_shipment_count
        business_name: Delivered Shipment Count
        description: >-
          Total number of delivered shipments where delivered_at timestamp is recorded.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(shipments.shipment_id) AS delivered_shipment_count
                FROM ecom_bronze.shipments AS shipments
                WHERE shipments.delivered_at IS NOT NULL
              columns_used:
                - shipments.shipment_id
                - shipments.delivered_at

      - name: average_delivery_time_days
        business_name: Average Delivery Time (Days)
        description: >-
          Average delivery time in days calculated as the difference between delivered_at and shipped_at timestamps.
          Only includes shipments where both timestamps are recorded.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(
                    DATEDIFF(
                      CAST(shipments.delivered_at AS DATE),
                      CAST(shipments.shipped_at AS DATE)
                    )
                  ) AS average_delivery_time_days
                FROM ecom_bronze.shipments AS shipments
                WHERE shipments.shipped_at IS NOT NULL
                  AND shipments.delivered_at IS NOT NULL
              columns_used:
                - shipments.delivered_at
                - shipments.shipped_at

      - name: revenue_by_customer_segment
        business_name: Revenue By Customer Segment
        description: >-
          Total revenue aggregated by customer segment.
          Shows revenue distribution across customer segments (e.g., Premium, Standard).
        return_type: DECIMAL
        result_grain: one row per customer segment
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  customers.customer_segment,
                  SUM(orders.total_amount) AS revenue
                FROM ecom_bronze.orders AS orders
                INNER JOIN ecom_bronze.customers AS customers
                  ON orders.customer_id = customers.customer_id
                GROUP BY customers.customer_segment
              columns_used:
                - orders.total_amount
                - orders.customer_id
                - customers.customer_id
                - customers.customer_segment

      - name: revenue_by_sales_channel
        business_name: Revenue By Sales Channel
        description: >-
          Total revenue aggregated by sales channel.
          Shows revenue distribution across channels (e.g., Online, Mobile, Store).
        return_type: DECIMAL
        result_grain: one row per sales channel
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  orders.sales_channel,
                  SUM(orders.total_amount) AS revenue
                FROM ecom_bronze.orders AS orders
                GROUP BY orders.sales_channel
              columns_used:
                - orders.total_amount
                - orders.sales_channel

      - name: revenue_by_product
        business_name: Revenue By Product
        description: >-
          Total product revenue aggregated by product.
          Uses order_items.line_total for accurate product-level revenue.
        return_type: DECIMAL
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  products.product_id,
                  products.product_name,
                  SUM(order_items.line_total) AS revenue
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
                GROUP BY products.product_id, products.product_name
              columns_used:
                - order_items.line_total
                - order_items.product_id
                - products.product_id
                - products.product_name

      - name: units_sold_by_product
        business_name: Units Sold By Product
        description: >-
          Total units sold aggregated by product.
        return_type: BIGINT
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  products.product_id,
                  products.product_name,
                  SUM(order_items.quantity) AS units_sold
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
                GROUP BY products.product_id, products.product_name
              columns_used:
                - order_items.quantity
                - order_items.product_id
                - products.product_id
                - products.product_name

      - name: revenue_by_category
        business_name: Revenue By Category
        description: >-
          Total product revenue aggregated by product category.
          Joins order_items to products to product_categories.
        return_type: DECIMAL
        result_grain: one row per category
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  product_categories.category_id,
                  product_categories.category_name,
                  SUM(order_items.line_total) AS revenue
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
                INNER JOIN ecom_bronze.product_categories AS product_categories
                  ON products.category_id = product_categories.category_id
                GROUP BY product_categories.category_id, product_categories.category_name
              columns_used:
                - order_items.line_total
                - order_items.product_id
                - products.product_id
                - products.category_id
                - product_categories.category_id
                - product_categories.category_name

      - name: revenue_by_brand
        business_name: Revenue By Brand
        description: >-
          Total product revenue aggregated by product brand.
        return_type: DECIMAL
        result_grain: one row per brand
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  products.brand,
                  SUM(order_items.line_total) AS revenue
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
                WHERE products.brand IS NOT NULL
                GROUP BY products.brand
              columns_used:
                - order_items.line_total
                - order_items.product_id
                - products.product_id
                - products.brand

      - name: monthly_revenue
        business_name: Monthly Revenue
        description: >-
          Total revenue aggregated by month based on order_date.
          Provides time-series revenue trend analysis.
        return_type: DECIMAL
        result_grain: one row per month
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  DATE_TRUNC('MONTH', orders.order_date) AS order_month,
                  SUM(orders.total_amount) AS revenue
                FROM ecom_bronze.orders AS orders
                GROUP BY DATE_TRUNC('MONTH', orders.order_date)
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.total_amount

      - name: monthly_order_count
        business_name: Monthly Order Count
        description: >-
          Total number of orders aggregated by month based on order_date.
        return_type: BIGINT
        result_grain: one row per month
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  DATE_TRUNC('MONTH', orders.order_date) AS order_month,
                  COUNT(orders.order_id) AS order_count
                FROM ecom_bronze.orders AS orders
                GROUP BY DATE_TRUNC('MONTH', orders.order_date)
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.order_id

      - name: revenue_by_order_status
        business_name: Revenue By Order Status
        description: >-
          Total revenue aggregated by order status.
          Shows revenue distribution across order lifecycle stages.
        return_type: DECIMAL
        result_grain: one row per order status
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  orders.order_status,
                  SUM(orders.total_amount) AS revenue
                FROM ecom_bronze.orders AS orders
                GROUP BY orders.order_status
              columns_used:
                - orders.order_status
                - orders.total_amount

      - name: orders_by_payment_method
        business_name: Orders By Payment Method
        description: >-
          Number of orders aggregated by payment method.
          Shows payment method preference distribution.
        return_type: BIGINT
        result_grain: one row per payment method
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  payments.payment_method,
                  COUNT(DISTINCT payments.order_id) AS order_count
                FROM ecom_bronze.payments AS payments
                GROUP BY payments.payment_method
              columns_used:
                - payments.payment_method
                - payments.order_id

      - name: shipments_by_carrier
        business_name: Shipments By Carrier
        description: >-
          Number of shipments aggregated by carrier.
          Shows carrier usage distribution.
        return_type: BIGINT
        result_grain: one row per carrier
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  shipments.carrier,
                  COUNT(shipments.shipment_id) AS shipment_count
                FROM ecom_bronze.shipments AS shipments
                WHERE shipments.carrier IS NOT NULL
                GROUP BY shipments.carrier
              columns_used:
                - shipments.carrier
                - shipments.shipment_id

      - name: average_delivery_time_by_carrier
        business_name: Average Delivery Time By Carrier
        description: >-
          Average delivery time in days aggregated by carrier.
          Shows carrier performance comparison.
        return_type: DECIMAL
        result_grain: one row per carrier
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  shipments.carrier,
                  AVG(
                    DATEDIFF(
                      CAST(shipments.delivered_at AS DATE),
                      CAST(shipments.shipped_at AS DATE)
                    )
                  ) AS average_delivery_time_days
                FROM ecom_bronze.shipments AS shipments
                WHERE shipments.carrier IS NOT NULL
                  AND shipments.shipped_at IS NOT NULL
                  AND shipments.delivered_at IS NOT NULL
                GROUP BY shipments.carrier
              columns_used:
                - shipments.carrier
                - shipments.delivered_at
                - shipments.shipped_at

      - name: revenue_by_country
        business_name: Revenue By Country
        description: >-
          Total revenue aggregated by customer country.
          Shows geographic revenue distribution.
        return_type: DECIMAL
        result_grain: one row per country
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  customers.country,
                  SUM(orders.total_amount) AS revenue
                FROM ecom_bronze.orders AS orders
                INNER JOIN ecom_bronze.customers AS customers
                  ON orders.customer_id = customers.customer_id
                GROUP BY customers.country
              columns_used:
                - orders.total_amount
                - orders.customer_id
                - customers.customer_id
                - customers.country

      - name: revenue_by_state
        business_name: Revenue By State
        description: >-
          Total revenue aggregated by customer state.
          Shows state-level revenue distribution.
        return_type: DECIMAL
        result_grain: one row per state
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  customers.state,
                  SUM(orders.total_amount) AS revenue
                FROM ecom_bronze.orders AS orders
                INNER JOIN ecom_bronze.customers AS customers
                  ON orders.customer_id = customers.customer_id
                WHERE customers.state IS NOT NULL
                GROUP BY customers.state
              columns_used:
                - orders.total_amount
                - orders.customer_id
                - customers.customer_id
                - customers.state

      - name: customer_acquisition_by_month
        business_name: Customer Acquisition By Month
        description: >-
          Number of new customers registered aggregated by month based on registration_date.
          Shows customer acquisition trends over time.
        return_type: BIGINT
        result_grain: one row per month
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  DATE_TRUNC('MONTH', customers.registration_date) AS registration_month,
                  COUNT(customers.customer_id) AS new_customers
                FROM ecom_bronze.customers AS customers
                WHERE customers.registration_date IS NOT NULL
                GROUP BY DATE_TRUNC('MONTH', customers.registration_date)
                ORDER BY registration_month
              columns_used:
                - customers.registration_date
                - customers.customer_id