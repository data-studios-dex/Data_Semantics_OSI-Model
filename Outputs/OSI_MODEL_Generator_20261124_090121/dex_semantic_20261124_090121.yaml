version: "1.0"

semantic_model:
  - name: retail_analytics_model
    description: >-
      Comprehensive retail analytics semantic model derived from the retail data glossary.
      This model supports end-to-end retail analytics including customer relationship management,
      sales transactions, order fulfillment, payment processing, product catalog management,
      and shipment logistics. The model enables analytical queries across customer behavior,
      sales performance, product performance, payment analytics, and fulfillment operations.
    
    ai_context:
      instructions: >-
        ## Dataset Grain Reference
        
        - CUSTOMERS: One row per customer. Contains customer profile and demographic information.
        - ORDERS: One row per order. Contains order header information including totals and shipping details.
        - ORDER_ITEMS: One row per order line item. Contains product-level order details.
        - PRODUCTS: One row per product. Contains product catalog information.
        - PRODUCT_CATEGORIES: One row per product category. Contains hierarchical category structure.
        - PAYMENTS: One row per payment transaction. Contains payment processing details.
        - SHIPMENTS: One row per shipment. Contains shipment tracking and delivery information.
        
        ## Metric Selection Guidance
        
        ### Order-Level Metrics
        Use ORDERS dataset for order-level analysis:
        - Total order amount (orders.total_amount)
        - Order subtotal (orders.subtotal)
        - Order discount (orders.discount_amount)
        - Order tax (orders.tax_amount)
        - Shipping fees (orders.shipping_fee)
        - Order count (COUNT of orders.order_id)
        
        ### Order-Item-Level Metrics
        Use ORDER_ITEMS dataset for product-level order analysis:
        - Line item total (order_items.line_total)
        - Unit price (order_items.unit_price)
        - Quantity sold (order_items.quantity)
        - Line-level discount (order_items.discount_pct)
        
        ### Product-Level Metrics
        Use PRODUCTS dataset for product catalog analysis:
        - Product unit price (products.unit_price)
        - Product cost price (products.cost_price)
        - Product margin (unit_price - cost_price)
        - Stock quantity (products.stock_quantity)
        
        ### Payment Metrics
        Use PAYMENTS dataset for payment analysis:
        - Payment amount (payments.amount)
        - Payment count (COUNT of payments.payment_id)
        
        ## Join Guidance
        
        ### Standard Relationships
        
        1. ORDERS to CUSTOMERS (many-to-one):
           - Join: orders.customer_id = customers.customer_id
           - Use for customer-level order analysis
        
        2. ORDER_ITEMS to ORDERS (many-to-one):
           - Join: order_items.order_id = orders.order_id
           - Use for order line item analysis
        
        3. ORDER_ITEMS to PRODUCTS (many-to-one):
           - Join: order_items.product_id = products.product_id
           - Use for product sales analysis
        
        4. PRODUCTS to PRODUCT_CATEGORIES (many-to-one):
           - Join: products.category_id = product_categories.category_id
           - Use for category-level product analysis
        
        5. PAYMENTS to ORDERS (many-to-one):
           - Join: payments.order_id = orders.order_id
           - Use for payment analysis by order
        
        6. SHIPMENTS to ORDERS (many-to-one):
           - Join: shipments.order_id = orders.order_id
           - Use for shipment tracking and delivery analysis
        
        ### Hierarchical Relationship
        
        PRODUCT_CATEGORIES has a self-referencing hierarchy:
        - Join: product_categories.parent_category_id = product_categories.category_id
        - Use recursive queries to traverse the full category hierarchy
        - Supports multi-level category rollups
        
        ## Double-Counting Prevention
        
        ### Critical: Order-Level vs Order-Item-Level Measures
        
        NEVER sum order-level measures after joining ORDERS to ORDER_ITEMS.
        
        Example of INCORRECT query:
        ```
        SELECT SUM(orders.total_amount)
        FROM orders
        JOIN order_items ON orders.order_id = order_items.order_id
        -- This will duplicate order totals for each line item
        ```
        
        Correct approaches:
        
        1. For order-level revenue, query ORDERS directly:
        ```
        SELECT SUM(orders.total_amount) AS total_revenue
        FROM orders
        ```
        
        2. For product-level revenue, use ORDER_ITEMS:
        ```
        SELECT 
          products.product_name,
          SUM(order_items.line_total) AS product_revenue
        FROM order_items
        JOIN products ON order_items.product_id = products.product_id
        GROUP BY products.product_name
        ```
        
        3. For combined order and product analysis, use subqueries or CTEs:
        ```
        WITH order_summary AS (
          SELECT 
            order_id,
            total_amount,
            order_date
          FROM orders
        )
        SELECT 
          products.product_name,
          COUNT(DISTINCT os.order_id) AS order_count,
          SUM(oi.line_total) AS product_revenue
        FROM order_items oi
        JOIN products ON oi.product_id = products.product_id
        JOIN order_summary os ON oi.order_id = os.order_id
        GROUP BY products.product_name
        ```
        
        ### Order-Level Measures That Must Not Be Summed After JOIN to ORDER_ITEMS:
        - orders.total_amount
        - orders.subtotal
        - orders.discount_amount
        - orders.tax_amount
        - orders.shipping_fee
        
        ### Safe Measures at ORDER_ITEMS Grain:
        - order_items.line_total
        - order_items.quantity
        - order_items.unit_price
        
        ## Time Analysis Guidance
        
        ### Order Date (orders.order_date)
        Primary date for sales and revenue analysis:
        - Use for revenue trends
        - Use for order volume analysis
        - Use for customer purchase patterns
        - Use for period-over-period comparisons
        
        ### Shipment Dates
        - shipped_at: Use for fulfillment performance analysis
        - delivered_at: Use for delivery performance and customer satisfaction analysis
        
        ### Payment Date (payments.paid_at)
        Use for cash flow and payment processing analysis
        
        ### Customer Registration Date (customers.registration_date)
        Use for customer acquisition and cohort analysis
        
        ### Product Created Date (products.created_at)
        Use for product lifecycle and catalog growth analysis
        
        ## Hierarchical Query Guidance
        
        ### Product Category Hierarchy
        
        The PRODUCT_CATEGORIES table contains a self-referencing hierarchy via parent_category_id.
        
        To query the full category hierarchy in Databricks:
        
        ```
        WITH RECURSIVE category_hierarchy AS (
          -- Base case: root categories (no parent)
          SELECT 
            category_id,
            category_name,
            parent_category_id,
            category_name AS category_path,
            0 AS level
          FROM product_categories
          WHERE parent_category_id IS NULL
          
          UNION ALL
          
          -- Recursive case: child categories
          SELECT 
            pc.category_id,
            pc.category_name,
            pc.parent_category_id,
            CONCAT(ch.category_path, ' > ', pc.category_name) AS category_path,
            ch.level + 1 AS level
          FROM product_categories pc
          JOIN category_hierarchy ch ON pc.parent_category_id = ch.category_id
        )
        SELECT * FROM category_hierarchy
        ORDER BY category_path
        ```
        
        Use this pattern for:
        - Category rollup analysis
        - Multi-level category reporting
        - Category tree visualization
        
        ## Query Restrictions and Limitations
        
        ### PII Data Handling
        The following fields contain PII and are restricted:
        - customers.first_name
        - customers.last_name
        - customers.email
        - customers.phone
        - customers.date_of_birth
        - orders.tax_amount
        - payments.transaction_ref
        
        When querying PII fields:
        - Ensure proper access controls are enforced
        - Consider data masking for non-privileged users
        - Follow organizational data governance policies
        
        ### Currency Handling
        All monetary amounts are stored in their respective currency codes:
        - orders.currency (default: USD)
        - products.currency (default: USD)
        - payments.currency (default: USD)
        
        For multi-currency analysis, implement currency conversion logic using appropriate exchange rates.
        
        ### Status Field Values
        
        Order Status (orders.order_status):
        - Pending
        - Processing
        - Shipped
        - Delivered
        - Cancelled
        - Returned
        
        Payment Status (payments.payment_status):
        - Pending
        - Completed
        - Failed
        - Refunded
        
        Shipment Status (shipments.shipment_status):
        - Pending
        - In Transit
        - Delivered
        - Returned
        - Failed
        
        ### Active Record Filtering
        
        Several tables include is_active flags:
        - customers.is_active: Filter for active customer accounts
        - products.is_active: Filter for products currently available for sale
        - product_categories.is_active: Filter for active categories
        
        For current-state analysis, always filter by is_active = true.
        For historical analysis, include all records regardless of active status.
    
    datasets:
      - name: customers
        business_name: Customers
        description: >-
          Contains comprehensive customer profiles including personal information, contact details,
          demographic data, and account status. Each row represents a unique customer.
          Grain: One row per customer.
        source: CRM_PROD
        primary_key:
          - customer_id
        fields:
          - name: customer_id
            business_name: Customer Identifier
            description: Unique identifier for a customer.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: customer_code
            business_name: Customer Code
            description: Business reference code assigned to the customer.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: first_name
            business_name: First Name
            description: First name of the customer. Contains PII.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_pii: true
          
          - name: last_name
            business_name: Last Name
            description: Last name of the customer. Contains PII.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_pii: true
          
          - name: email
            business_name: Email
            description: Email address of the customer. Contains PII.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_pii: true
          
          - name: phone
            business_name: Phone
            description: Phone number of the customer. Contains PII.
            sql_type: STRING(255)
            dimension:
              is_pii: true
          
          - name: gender
            business_name: Gender
            description: Gender of the customer.
            sql_type: STRING(255)
            dimension:
              is_dimension: true
          
          - name: date_of_birth
            business_name: Date Of Birth
            description: Date of birth of the customer. Contains PII.
            sql_type: DATE
            dimension:
              is_pii: true
          
          - name: city
            business_name: City
            description: City where the customer resides.
            sql_type: STRING(255)
            dimension:
              is_dimension: true
          
          - name: state
            business_name: State
            description: State or province where the customer resides.
            sql_type: STRING(255)
            dimension:
              is_dimension: true
          
          - name: country
            business_name: Country
            description: Country where the customer resides.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_dimension: true
          
          - name: postal_code
            business_name: Postal Code
            description: Postal or ZIP code of the customer's address.
            sql_type: STRING(255)
            dimension:
              is_dimension: true
          
          - name: customer_segment
            business_name: Customer Segment
            description: Indicates the current segment classification of the customer.
            sql_type: STRING(255)
            dimension:
              is_dimension: true
          
          - name: registration_date
            business_name: Registration Date
            description: Date when the customer registered.
            sql_type: DATE
            dimension:
              is_time: true
          
          - name: is_active
            business_name: Is Active
            description: Indicates whether the customer account is currently active.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_dimension: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: orders
        business_name: Orders
        description: >-
          Records end-to-end sales transactions at the order header level. Contains order-level
          totals, customer references, shipping information, and order status. Each row represents
          a unique order.
          Grain: One row per order.
        source: ORDER_MGMT
        primary_key:
          - order_id
        fields:
          - name: order_id
            business_name: Order Identifier
            description: Unique identifier for an order.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_number
            business_name: Order Number
            description: Business reference number assigned to the order.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: customer_id
            business_name: Customer ID
            description: References the related customer record.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: order_date
            business_name: Order Date
            description: Timestamp recording when the order was placed.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: order_status
            business_name: Order Status
            description: Indicates the current status of the order.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_dimension: true
          
          - name: sales_channel
            business_name: Sales Channel
            description: Indicates the channel through which the order was placed.
            sql_type: STRING(255)
            dimension:
              is_dimension: true
          
          - name: ship_city
            business_name: Ship City
            description: City to which the order is shipped.
            sql_type: STRING(255)
            dimension:
              is_dimension: true
          
          - name: ship_state
            business_name: Ship State
            description: State or province to which the order is shipped.
            sql_type: STRING(255)
            dimension:
              is_dimension: true
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: Postal or ZIP code to which the order is shipped.
            sql_type: STRING(255)
            dimension:
              is_dimension: true
          
          - name: subtotal
            business_name: Subtotal
            description: Monetary amount representing the order subtotal before discounts and taxes.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: discount_amount
            business_name: Discount Amount
            description: Monetary amount representing the total discount applied to the order.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: tax_amount
            business_name: Tax Amount
            description: Monetary amount representing the tax charged on the order. Contains PII.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              is_pii: true
          
          - name: shipping_fee
            business_name: Shipping Fee
            description: Monetary amount representing the shipping cost for the order.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: total_amount
            business_name: Total Amount
            description: Monetary amount representing the final total of the order.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: currency
            business_name: Currency
            description: Currency code for the order amounts.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_dimension: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: order_items
        business_name: Order Items
        description: >-
          Records individual line items within orders. Contains product-level order details
          including quantity, pricing, and line-level discounts. Each row represents a unique
          order line item.
          Grain: One row per order line item.
        source: ORDER_MGMT
        primary_key:
          - order_item_id
        fields:
          - name: order_item_id
            business_name: Order Item Identifier
            description: Unique identifier for an order line item.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: References the related order record.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: line_number
            business_name: Line Number
            description: Sequential line number within the order.
            sql_type: INT
            constraints:
              - NOT NULL
          
          - name: product_id
            business_name: Product ID
            description: References the related product record.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: quantity
            business_name: Quantity
            description: Number of units ordered for this line item.
            sql_type: INT
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: unit_price
            business_name: Unit Price
            description: Monetary amount representing the price per unit.
            sql_type: DECIMAL(12,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
          
          - name: discount_pct
            business_name: Discount Pct
            description: Percentage discount applied to the line item.
            sql_type: DECIMAL(5,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
          
          - name: line_total
            business_name: Line Total
            description: Monetary amount representing the total for this line item.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: products
        business_name: Products
        description: >-
          Contains product catalog information including product specifications, pricing,
          inventory levels, and category assignments. Each row represents a unique product.
          Grain: One row per product.
        source: PRODUCT_CATALOG
        primary_key:
          - product_id
        fields:
          - name: product_id
            business_name: Product Identifier
            description: Unique identifier for a product.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: sku
            business_name: Sku
            description: Stock keeping unit code for the product.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: product_name
            business_name: Product Name
            description: Name of the product.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_dimension: true
          
          - name: category_id
            business_name: Category ID
            description: References the related product category record.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: brand
            business_name: Brand
            description: Brand name of the product.
            sql_type: STRING(255)
            dimension:
              is_dimension: true
          
          - name: description
            business_name: Description
            description: Detailed description of the product.
            sql_type: STRING(255)
          
          - name: unit_price
            business_name: Unit Price
            description: Monetary amount representing the selling price per unit.
            sql_type: DECIMAL(12,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
          
          - name: cost_price
            business_name: Cost Price
            description: Monetary amount representing the cost per unit.
            sql_type: DECIMAL(12,2)
            measure:
              aggregation: AVG
          
          - name: currency
            business_name: Currency
            description: Currency code for the product prices.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_dimension: true
          
          - name: stock_quantity
            business_name: Stock Quantity
            description: Current inventory quantity available for the product.
            sql_type: INT
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: is_active
            business_name: Is Active
            description: Indicates whether the product is currently active for sale.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_dimension: true
          
          - name: created_at
            business_name: Created At
            description: Timestamp recording when the product was created in the system.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: product_categories
        business_name: Product Categories
        description: >-
          Contains product category definitions with hierarchical structure. Supports multi-level
          category hierarchies through self-referencing parent relationships. Each row represents
          a unique product category.
          Grain: One row per product category.
        source: PRODUCT_CATALOG
        primary_key:
          - category_id
        fields:
          - name: category_id
            business_name: Category Identifier
            description: Unique identifier for a product category.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: category_name
            business_name: Category Name
            description: Name of the product category.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_dimension: true
          
          - name: parent_category_id
            business_name: Parent Category ID
            description: References the parent category in the hierarchy.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
          
          - name: description
            business_name: Description
            description: Detailed description of the product category.
            sql_type: STRING(255)
          
          - name: is_active
            business_name: Is Active
            description: Indicates whether the category is currently active.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_dimension: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: payments
        business_name: Payments
        description: >-
          Contains payment transaction records including payment method, status, and processing
          details. Each row represents a unique payment transaction.
          Grain: One row per payment transaction.
        source: PAYMENT_SYS
        primary_key:
          - payment_id
        fields:
          - name: payment_id
            business_name: Payment Identifier
            description: Unique identifier for a payment transaction.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: References the related order record.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: payment_method
            business_name: Payment Method
            description: Indicates the method used for payment.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_dimension: true
          
          - name: payment_status
            business_name: Payment Status
            description: Indicates the current status of the payment.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_dimension: true
          
          - name: amount
            business_name: Amount
            description: Monetary amount representing the payment value.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: currency
            business_name: Currency
            description: Currency code for the payment amount.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_dimension: true
          
          - name: transaction_ref
            business_name: Transaction Ref
            description: External reference number for the payment transaction. Contains PII.
            sql_type: STRING(255)
            dimension:
              is_pii: true
          
          - name: gateway
            business_name: Gateway
            description: Name of the payment gateway used to process the transaction.
            sql_type: STRING(255)
            dimension:
              is_dimension: true
          
          - name: paid_at
            business_name: Paid At
            description: Timestamp recording when the payment was completed.
            sql_type: TIMESTAMP
            dimension:
              is_time: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: shipments
        business_name: Shipments
        description: >-
          Contains shipment tracking and delivery information including carrier details, tracking
          numbers, and delivery timestamps. Each row represents a unique shipment.
          Grain: One row per shipment.
        source: LOGISTICS_SYS
        primary_key:
          - shipment_id
        fields:
          - name: shipment_id
            business_name: Shipment Identifier
            description: Unique identifier for a shipment.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: References the related order record.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: carrier
            business_name: Carrier
            description: Name of the shipping carrier handling the shipment.
            sql_type: STRING(255)
            dimension:
              is_dimension: true
          
          - name: tracking_number
            business_name: Tracking Number
            description: Tracking number assigned by the carrier for the shipment.
            sql_type: STRING(255)
          
          - name: shipment_status
            business_name: Shipment Status
            description: Indicates the current status of the shipment.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_dimension: true
          
          - name: shipped_at
            business_name: Shipped At
            description: Timestamp recording when the shipment was dispatched.
            sql_type: TIMESTAMP
            dimension:
              is_time: true
          
          - name: delivered_at
            business_name: Delivered At
            description: Timestamp recording when the shipment was delivered.
            sql_type: TIMESTAMP
            dimension:
              is_time: true
          
          - name: ship_city
            business_name: Ship City
            description: City to which the shipment is being sent.
            sql_type: STRING(255)
            dimension:
              is_dimension: true
          
          - name: ship_state
            business_name: Ship State
            description: State or province to which the shipment is being sent.
            sql_type: STRING(255)
            dimension:
              is_dimension: true
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: Postal or ZIP code to which the shipment is being sent.
            sql_type: STRING(255)
            dimension:
              is_dimension: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
    
    relationships:
      - name: orders_to_customers
        left_dataset: orders
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Each order is placed by exactly one customer. Multiple orders can be placed by the same customer.
          Join orders to customers to analyze customer-level order patterns, customer lifetime value,
          and customer segmentation analysis.
      
      - name: order_items_to_orders
        left_dataset: order_items
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Each order line item belongs to exactly one order. Each order can contain multiple line items.
          Join order_items to orders to access order-level attributes such as order_date, customer_id,
          and shipping information. CRITICAL: Do not sum order-level measures (total_amount, subtotal,
          discount_amount, tax_amount, shipping_fee) after this join as it will cause double-counting.
      
      - name: order_items_to_products
        left_dataset: order_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        resolution: >-
          Each order line item references exactly one product. The same product can appear in multiple
          order line items. Join order_items to products to analyze product sales performance, product
          revenue, and product-level metrics.
      
      - name: products_to_product_categories
        left_dataset: products
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Each product belongs to exactly one category. Multiple products can belong to the same category.
          Join products to product_categories to analyze category-level product performance and enable
          category-based filtering and grouping.
      
      - name: payments_to_orders
        left_dataset: payments
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Each payment transaction is associated with exactly one order. An order may have multiple
          payment transactions (e.g., partial payments, refunds). Join payments to orders to analyze
          payment patterns, payment method preferences, and payment status by order attributes.
      
      - name: shipments_to_orders
        left_dataset: shipments
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Each shipment is associated with exactly one order. An order may have multiple shipments
          if items are shipped separately. Join shipments to orders to analyze fulfillment performance,
          delivery times, and shipment status by order attributes.
      
      - name: product_categories_hierarchy
        left_dataset: product_categories
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - parent_category_id
          right:
            - category_id
        join_type: recursive
        resolution: >-
          Product categories form a hierarchical structure where each category may have a parent category.
          This is a self-referencing relationship that enables multi-level category hierarchies.
          Use recursive queries to traverse the full category tree. Root categories have NULL parent_category_id.
          To query the full hierarchy in Databricks, use recursive CTEs with the pattern:
          
          WITH RECURSIVE category_hierarchy AS (
            SELECT category_id, category_name, parent_category_id, 0 AS level
            FROM product_categories
            WHERE parent_category_id IS NULL
            UNION ALL
            SELECT pc.category_id, pc.category_name, pc.parent_category_id, ch.level + 1
            FROM product_categories pc
            JOIN category_hierarchy ch ON pc.parent_category_id = ch.category_id
          )
          SELECT * FROM category_hierarchy
    
    metrics:
      - name: total_revenue
        business_name: Total Revenue
        description: >-
          Total revenue from all orders. Calculated as the sum of order total amounts.
          This metric represents the final revenue after all discounts, taxes, and fees.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.total_amount) AS total_revenue
                FROM orders
              columns_used:
                - orders.total_amount
      
      - name: total_orders
        business_name: Total Orders
        description: >-
          Total count of orders. Each order is counted once regardless of the number of line items.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(orders.order_id) AS total_orders
                FROM orders
              columns_used:
                - orders.order_id
      
      - name: total_customers
        business_name: Total Customers
        description: >-
          Total count of unique customers in the system.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(customers.customer_id) AS total_customers
                FROM customers
              columns_used:
                - customers.customer_id
      
      - name: active_customers
        business_name: Active Customers
        description: >-
          Count of customers with active accounts. Filters for customers where is_active = true.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(customers.customer_id) AS active_customers
                FROM customers
                WHERE customers.is_active = true
              columns_used:
                - customers.customer_id
                - customers.is_active
      
      - name: average_order_value
        business_name: Average Order Value
        description: >-
          Average revenue per order. Calculated as total revenue divided by total order count.
          Uses safe division to handle zero orders.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(orders.order_id) = 0 THEN 0
                    ELSE SUM(orders.total_amount) / COUNT(orders.order_id)
                  END AS average_order_value
                FROM orders
              columns_used:
                - orders.order_id
                - orders.total_amount
      
      - name: total_units_sold
        business_name: Total Units Sold
        description: >-
          Total quantity of product units sold across all order line items.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.quantity) AS total_units_sold
                FROM order_items
              columns_used:
                - order_items.quantity
      
      - name: total_discount_amount
        business_name: Total Discount Amount
        description: >-
          Total monetary discount amount applied across all orders.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.discount_amount) AS total_discount_amount
                FROM orders
              columns_used:
                - orders.discount_amount
      
      - name: total_shipping_fees
        business_name: Total Shipping Fees
        description: >-
          Total shipping fees collected across all orders.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.shipping_fee) AS total_shipping_fees
                FROM orders
              columns_used:
                - orders.shipping_fee
      
      - name: revenue_by_customer
        business_name: Revenue By Customer
        description: >-
          Total revenue generated by each customer. Aggregates order totals at the customer level.
        return_type: DECIMAL
        result_grain: one row per customer
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  customers.customer_id,
                  customers.first_name,
                  customers.last_name,
                  SUM(orders.total_amount) AS revenue_by_customer
                FROM orders
                JOIN customers ON orders.customer_id = customers.customer_id
                GROUP BY customers.customer_id, customers.first_name, customers.last_name
              columns_used:
                - orders.customer_id
                - orders.total_amount
                - customers.customer_id
                - customers.first_name
                - customers.last_name
      
      - name: revenue_by_product
        business_name: Revenue By Product
        description: >-
          Total revenue generated by each product. Aggregates line totals at the product level.
          Uses order_items.line_total to avoid double-counting.
        return_type: DECIMAL
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  products.product_id,
                  products.product_name,
                  SUM(order_items.line_total) AS revenue_by_product
                FROM order_items
                JOIN products ON order_items.product_id = products.product_id
                GROUP BY products.product_id, products.product_name
              columns_used:
                - order_items.product_id
                - order_items.line_total
                - products.product_id
                - products.product_name
      
      - name: revenue_by_category
        business_name: Revenue By Category
        description: >-
          Total revenue generated by each product category. Aggregates line totals at the category level.
        return_type: DECIMAL
        result_grain: one row per category
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  product_categories.category_id,
                  product_categories.category_name,
                  SUM(order_items.line_total) AS revenue_by_category
                FROM order_items
                JOIN products ON order_items.product_id = products.product_id
                JOIN product_categories ON products.category_id = product_categories.category_id
                GROUP BY product_categories.category_id, product_categories.category_name
              columns_used:
                - order_items.product_id
                - order_items.line_total
                - products.product_id
                - products.category_id
                - product_categories.category_id
                - product_categories.category_name
      
      - name: orders_by_status
        business_name: Orders By Status
        description: >-
          Count of orders grouped by order status. Enables analysis of order pipeline and fulfillment.
        return_type: INTEGER
        result_grain: one row per order status
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  orders.order_status,
                  COUNT(orders.order_id) AS orders_by_status
                FROM orders
                GROUP BY orders.order_status
              columns_used:
                - orders.order_id
                - orders.order_status
      
      - name: orders_by_channel
        business_name: Orders By Channel
        description: >-
          Count of orders grouped by sales channel. Enables channel performance analysis.
        return_type: INTEGER
        result_grain: one row per sales channel
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  orders.sales_channel,
                  COUNT(orders.order_id) AS orders_by_channel
                FROM orders
                GROUP BY orders.sales_channel
              columns_used:
                - orders.order_id
                - orders.sales_channel
      
      - name: revenue_by_month
        business_name: Revenue By Month
        description: >-
          Total revenue aggregated by month. Uses order_date for time-based aggregation.
        return_type: DECIMAL
        result_grain: one row per month
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  DATE_TRUNC('MONTH', orders.order_date) AS order_month,
                  SUM(orders.total_amount) AS revenue_by_month
                FROM orders
                GROUP BY DATE_TRUNC('MONTH', orders.order_date)
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.total_amount
      
      - name: orders_per_customer
        business_name: Orders Per Customer
        description: >-
          Average number of orders per customer. Calculated as total orders divided by total customers.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT orders.customer_id) = 0 THEN 0
                    ELSE CAST(COUNT(orders.order_id) AS DECIMAL) / COUNT(DISTINCT orders.customer_id)
                  END AS orders_per_customer
                FROM orders
              columns_used:
                - orders.order_id
                - orders.customer_id
      
      - name: product_margin
        business_name: Product Margin
        description: >-
          Gross margin per product calculated as unit price minus cost price. Represents profit per unit.
        return_type: DECIMAL
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  products.product_id,
                  products.product_name,
                  products.unit_price - COALESCE(products.cost_price, 0) AS product_margin
                FROM products
              columns_used:
                - products.product_id
                - products.product_name
                - products.unit_price
                - products.cost_price
      
      - name: total_payment_amount
        business_name: Total Payment Amount
        description: >-
          Total amount of completed payments. Filters for payments with status = 'Completed'.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(payments.amount) AS total_payment_amount
                FROM payments
                WHERE payments.payment_status = 'Completed'
              columns_used:
                - payments.amount
                - payments.payment_status
      
      - name: payments_by_method
        business_name: Payments By Method
        description: >-
          Count and total amount of payments grouped by payment method.
        return_type: DECIMAL
        result_grain: one row per payment method
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  payments.payment_method,
                  COUNT(payments.payment_id) AS payment_count,
                  SUM(payments.amount) AS total_amount
                FROM payments
                GROUP BY payments.payment_method
              columns_used:
                - payments.payment_id
                - payments.payment_method
                - payments.amount
      
      - name: shipments_by_status
        business_name: Shipments By Status
        description: >-
          Count of shipments grouped by shipment status. Enables fulfillment performance tracking.
        return_type: INTEGER
        result_grain: one row per shipment status
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  shipments.shipment_status,
                  COUNT(shipments.shipment_id) AS shipments_by_status
                FROM shipments
                GROUP BY shipments.shipment_status
              columns_used:
                - shipments.shipment_id
                - shipments.shipment_status
      
      - name: average_delivery_time
        business_name: Average Delivery Time
        description: >-
          Average time in days between shipment dispatch and delivery. Calculated for delivered shipments only.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(DATEDIFF(shipments.delivered_at, shipments.shipped_at)) AS average_delivery_time_days
                FROM shipments
                WHERE shipments.delivered_at IS NOT NULL
                  AND shipments.shipped_at IS NOT NULL
              columns_used:
                - shipments.shipped_at
                - shipments.delivered_at
      
      - name: customers_by_segment
        business_name: Customers By Segment
        description: >-
          Count of customers grouped by customer segment. Enables segment-based analysis.
        return_type: INTEGER
        result_grain: one row per customer segment
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  customers.customer_segment,
                  COUNT(customers.customer_id) AS customers_by_segment
                FROM customers
                GROUP BY customers.customer_segment
              columns_used:
                - customers.customer_id
                - customers.customer_segment
      
      - name: revenue_by_customer_segment
        business_name: Revenue By Customer Segment
        description: >-
          Total revenue grouped by customer segment. Enables segment performance analysis.
        return_type: DECIMAL
        result_grain: one row per customer segment
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  customers.customer_segment,
                  SUM(orders.total_amount) AS revenue_by_segment
                FROM orders
                JOIN customers ON orders.customer_id = customers.customer_id
                GROUP BY customers.customer_segment
              columns_used:
                - orders.customer_id
                - orders.total_amount
                - customers.customer_id
                - customers.customer_segment
      
      - name: total_inventory_value
        business_name: Total Inventory Value
        description: >-
          Total value of current inventory. Calculated as sum of (stock_quantity * cost_price) for all products.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(products.stock_quantity * COALESCE(products.cost_price, 0)) AS total_inventory_value
                FROM products
                WHERE products.is_active = true
              columns_used:
                - products.stock_quantity
                - products.cost_price
                - products.is_active
      
      - name: products_by_brand
        business_name: Products By Brand
        description: >-
          Count of products grouped by brand. Enables brand portfolio analysis.
        return_type: INTEGER
        result_grain: one row per brand
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  products.brand,
                  COUNT(products.product_id) AS products_by_brand
                FROM products
                WHERE products.is_active = true
                GROUP BY products.brand
              columns_used:
                - products.product_id
                - products.brand
                - products.is_active
      
      - name: average_discount_percentage
        business_name: Average Discount Percentage
        description: >-
          Average discount percentage applied to order line items. Weighted by line totals.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN SUM(order_items.line_total) = 0 THEN 0
                    ELSE SUM(order_items.discount_pct * order_items.line_total) / SUM(order_items.line_total)
                  END AS average_discount_percentage
                FROM order_items
              columns_used:
                - order_items.discount_pct
                - order_items.line_total