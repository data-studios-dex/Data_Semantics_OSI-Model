                FROM staging.audit_event AS ae
                GROUP BY ae.action
              columns_used:
                - audit_event.audit_id
                - audit_event.action

      - name: modification_count_by_month
        business_name: Modification Count By Month
        description: >-
          Count of modifications created, grouped by month.
          This metric provides monthly modification creation trends.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    YEAR(mr.created_date) AS year,
                    MONTH(mr.created_date) AS month,
                    COUNT(*) AS modification_count
                FROM staging.mod_record AS mr
                WHERE mr.created_date IS NOT NULL
                GROUP BY YEAR(mr.created_date), MONTH(mr.created_date)
                ORDER BY YEAR(mr.created_date), MONTH(mr.created_date)
              columns_used:
                - mod_record.mod_id
                - mod_record.created_date

      - name: task_count_by_month
        business_name: Task Count By Month
        description: >-
          Count of tasks created, grouped by month.
          This metric provides monthly task creation trends.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    YEAR(tr.created_date) AS year,
                    MONTH(tr.created_date) AS month,
                    COUNT(*) AS task_count
                FROM staging.task_record AS tr
                WHERE tr.created_date IS NOT NULL
                GROUP BY YEAR(tr.created_date), MONTH(tr.created_date)
                ORDER BY YEAR(tr.created_date), MONTH(tr.created_date)
              columns_used:
                - task_record.task_id
                - task_record.created_date

      - name: audit_event_count_by_day
        business_name: Audit Event Count By Day
        description: >-
          Count of audit events, grouped by day.
          This metric provides daily audit event trends.
        return_type: integer
        result_grain: one row per day
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    CAST(ae.event_ts AS DATE) AS event_date,
                    COUNT(*) AS audit_event_count
                FROM staging.audit_event AS ae
                WHERE ae.event_ts IS NOT NULL
                GROUP BY CAST(ae.event_ts AS DATE)
                ORDER BY CAST(ae.event_ts AS DATE)
              columns_used:
                - audit_event.audit_id
                - audit_event.event_ts
