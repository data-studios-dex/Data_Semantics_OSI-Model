version: "1.0"

semantic_model:
  - name: retail_analytics_model
    description: >-
      Comprehensive semantic model for retail analytics covering customer relationship management,
      sales transactions, product catalog, inventory, payments, and shipment operations.
      This model supports end-to-end retail analytics from customer acquisition through order
      fulfillment and payment processing.
    
    ai_context:
      instructions: >-
        ## Dataset Grain and Usage
        
        **CUSTOMERS**: One row per customer. Use for customer-level analysis and customer demographics.
        Primary key: customer_id. Contains customer profile, contact details, and segmentation.
        
        **ORDERS**: One row per order. Use for order-level analysis and order metrics.
        Primary key: order_id. Contains order header information including dates, status, channel, and totals.
        
        **ORDER_ITEMS**: One row per order line item. Use for product-level sales analysis.
        Primary key: order_item_id. Contains line-level details including product, quantity, pricing, and discounts.
        
        **PRODUCTS**: One row per product. Use for product catalog analysis and product attributes.
        Primary key: product_id. Contains product specifications, pricing, and inventory levels.
        
        **PRODUCT_CATEGORIES**: One row per product category. Use for category-level analysis.
        Primary key: category_id. Contains hierarchical category structure with parent-child relationships.
        
        **PAYMENTS**: One row per payment transaction. Use for payment analysis and reconciliation.
        Primary key: payment_id. Contains payment method, status, and transaction details.
        
        **SHIPMENTS**: One row per shipment. Use for fulfillment and logistics analysis.
        Primary key: shipment_id. Contains carrier, tracking, and delivery information.
        
        ## Critical Join Guidance
        
        **Customer to Orders**: Join customers.customer_id = orders.customer_id (one-to-many).
        Use for customer order history and customer lifetime value analysis.
        
        **Orders to Order Items**: Join orders.order_id = order_items.order_id (one-to-many).
        IMPORTANT: Do not sum order-level amounts (subtotal, discount_amount, tax_amount, shipping_fee, total_amount)
        after joining to order_items as this will cause double-counting. Use order-level amounts only when
        analyzing at order grain. Use order_items.line_total for product-level revenue analysis.
        
        **Order Items to Products**: Join order_items.product_id = products.product_id (many-to-one).
        Use for product sales analysis and product performance metrics.
        
        **Products to Categories**: Join products.category_id = product_categories.category_id (many-to-one).
        Use for category-level product analysis and category performance.
        
        **Category Hierarchy**: Join product_categories.parent_category_id = product_categories.category_id (self-referencing).
        This is a recursive relationship for navigating the category hierarchy. Use recursive queries
        to traverse the full category tree.
        
        **Orders to Payments**: Join orders.order_id = payments.order_id (one-to-many).
        Use for payment reconciliation and payment method analysis.
        
        **Orders to Shipments**: Join orders.order_id = shipments.order_id (one-to-many).
        Use for fulfillment analysis and delivery performance.
        
        ## Double-Counting Prevention
        
        **Order-Level vs Line-Level Revenue**:
        - Use orders.total_amount for order-level revenue analysis
        - Use orders.subtotal for order subtotal before fees and taxes
        - Use order_items.line_total for product-level or line-level revenue analysis
        - NEVER sum orders.total_amount after joining orders to order_items
        - NEVER sum orders.subtotal after joining orders to order_items
        
        **Order-Level Fees and Discounts**:
        - orders.discount_amount is order-level discount (do not sum after joining to order_items)
        - orders.tax_amount is order-level tax (do not sum after joining to order_items)
        - orders.shipping_fee is order-level shipping (do not sum after joining to order_items)
        - order_items.discount_pct is line-level discount percentage
        
        **Correct Aggregation Patterns**:
        - Order count: COUNT(DISTINCT orders.order_id)
        - Customer count: COUNT(DISTINCT customers.customer_id)
        - Product count: COUNT(DISTINCT products.product_id)
        - Total revenue from orders: SUM(orders.total_amount) without joining to order_items
        - Total revenue from order items: SUM(order_items.line_total)
        - Units sold: SUM(order_items.quantity)
        
        ## Time-Based Analysis
        
        **Order Date**: Use orders.order_date for order placement analysis and sales trends.
        This is the primary date for sales analytics.
        
        **Registration Date**: Use customers.registration_date for customer acquisition analysis.
        
        **Payment Date**: Use payments.paid_at for payment timing analysis.
        
        **Shipment Dates**: Use shipments.shipped_at and shipments.delivered_at for fulfillment analysis.
        Calculate delivery time as delivered_at - shipped_at.
        Calculate order-to-ship time as shipped_at - order_date.
        
        **Product Creation**: Use products.created_at for product lifecycle analysis.
        
        ## Metric Calculation Guidance
        
        **Revenue Metrics**:
        - Total Revenue: SUM(orders.total_amount) at order grain
        - Line Revenue: SUM(order_items.line_total) at line grain
        - Subtotal: SUM(orders.subtotal) at order grain
        
        **Discount Metrics**:
        - Total Discount Amount: SUM(orders.discount_amount) at order grain
        - Average Discount Percentage: Weighted average using line totals
        
        **Profitability**:
        - Line Cost: order_items.quantity * products.cost_price
        - Line Profit: order_items.line_total - (order_items.quantity * products.cost_price)
        - Profit Margin: (Line Profit / order_items.line_total) * 100
        
        **Customer Metrics**:
        - Customer Count: COUNT(DISTINCT customers.customer_id)
        - Active Customers: COUNT(DISTINCT customers.customer_id) WHERE customers.is_active = true
        - Orders per Customer: COUNT(orders.order_id) / COUNT(DISTINCT customers.customer_id)
        - Revenue per Customer: SUM(orders.total_amount) / COUNT(DISTINCT customers.customer_id)
        
        **Product Metrics**:
        - Units Sold: SUM(order_items.quantity)
        - Average Selling Price: SUM(order_items.line_total) / SUM(order_items.quantity)
        - Products Sold: COUNT(DISTINCT order_items.product_id)
        
        **Fulfillment Metrics**:
        - Shipment Count: COUNT(shipments.shipment_id)
        - Delivered Shipments: COUNT(shipments.shipment_id) WHERE shipments.delivered_at IS NOT NULL
        - Delivery Rate: (Delivered Shipments / Total Shipments) * 100
        
        ## Hierarchical Relationships
        
        **Product Category Hierarchy**: product_categories has a self-referencing relationship via
        parent_category_id. Use recursive CTEs to traverse the full hierarchy. Root categories
        have parent_category_id IS NULL.
        
        ## Status and Filtering
        
        **Active Records**:
        - Filter customers by customers.is_active = true for active customers
        - Filter products by products.is_active = true for active products
        - Filter categories by product_categories.is_active = true for active categories
        
        **Order Status**: Use orders.order_status to filter by order state (e.g., 'Shipped', 'Pending', 'Cancelled')
        
        **Payment Status**: Use payments.payment_status to filter by payment state (e.g., 'Completed', 'Pending', 'Failed')
        
        **Shipment Status**: Use shipments.shipment_status to filter by shipment state (e.g., 'In Transit', 'Delivered')
        
        ## Currency Handling
        
        All monetary amounts in orders, order_items, products, and payments use the currency field.
        The sample data shows USD as the primary currency. For multi-currency analysis, ensure
        proper currency conversion using the currency field.
        
        ## Safe Division
        
        Always use NULLIF or CASE statements to prevent division by zero in calculated metrics:
        - Margin %: Use NULLIF(revenue, 0) in denominator
        - Average metrics: Use NULLIF(count, 0) in denominator
        - Rate calculations: Use NULLIF(total, 0) in denominator

    datasets:
      - name: customers
        business_name: Customers
        description: >-
          Customer master dataset containing one row per customer. Stores comprehensive customer profiles
          including personal information, contact details, geographic location, customer segmentation,
          and account status. This is the authoritative source for customer demographics and customer
          relationship management. Grain: One row per customer identified by customer_id.
        source: CRM_PROD
        primary_key:
          - customer_id
        fields:
          - name: customer_id
            business_name: Customer Identifier
            description: >-
              Unique identifier for a customer. Primary key for the customers dataset.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: customer_code
            business_name: Customer Code
            description: >-
              Business reference code assigned to the customer for external identification and reporting.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: first_name
            business_name: First Name
            description: >-
              First name of the customer. Contains personally identifiable information (PII).
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: last_name
            business_name: Last Name
            description: >-
              Last name of the customer. Contains personally identifiable information (PII).
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: email
            business_name: Email
            description: >-
              Email address of the customer. Contains personally identifiable information (PII).
              Used for customer communication and account identification.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: phone
            business_name: Phone
            description: >-
              Phone number of the customer. Contains personally identifiable information (PII).
            sql_type: STRING(255)
          
          - name: gender
            business_name: Gender
            description: >-
              Gender of the customer. Categorical dimension for demographic analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: date_of_birth
            business_name: Date Of Birth
            description: >-
              Date of birth of the customer. Contains personally identifiable information (PII).
              Can be used to calculate customer age and age segments.
            sql_type: DATE
          
          - name: city
            business_name: City
            description: >-
              City where the customer resides. Geographic dimension for location-based analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: state
            business_name: State
            description: >-
              State or province where the customer resides. Geographic dimension for regional analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: country
            business_name: Country
            description: >-
              Country where the customer resides. Geographic dimension for country-level analysis.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: postal_code
            business_name: Postal Code
            description: >-
              Postal or ZIP code of the customer's address. Used for geographic segmentation.
            sql_type: STRING(255)
          
          - name: customer_segment
            business_name: Customer Segment
            description: >-
              Indicates the current segment classification of the customer (e.g., Premium, Standard, Basic).
              Business dimension for customer segmentation analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: registration_date
            business_name: Registration Date
            description: >-
              Date when the customer registered. Time dimension for customer acquisition analysis
              and cohort analysis.
            sql_type: DATE
            dimension:
              is_time: true
          
          - name: is_active
            business_name: Is Active
            description: >-
              Indicates whether the customer account is currently active. Boolean flag for filtering
              active vs inactive customers.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
          
          - name: _source_system
            business_name: Source System
            description: >-
              Name of the source system from which the record originated. Metadata field for data lineage.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ETL batch that loaded this record. Metadata field for ETL tracking.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp recording when the record was loaded into the table. Metadata field for data freshness tracking.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: orders
        business_name: Orders
        description: >-
          Order header dataset containing one row per order. Records end-to-end sales transactions
          including order dates, customer references, order status, sales channel, shipping destination,
          and order-level financial totals (subtotal, discounts, taxes, shipping fees, and total amount).
          This is the primary dataset for order-level sales analysis. Grain: One row per order identified by order_id.
        source: ORDER_MGMT
        primary_key:
          - order_id
        fields:
          - name: order_id
            business_name: Order Identifier
            description: >-
              Unique identifier for an order. Primary key for the orders dataset.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_number
            business_name: Order Number
            description: >-
              Business reference number assigned to the order for external identification and customer communication.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: customer_id
            business_name: Customer ID
            description: >-
              References the related customer record. Foreign key to customers.customer_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: order_date
            business_name: Order Date
            description: >-
              Timestamp recording when the order was placed. Primary time dimension for sales analysis
              and order trends. Use this date for sales reporting and time-series analysis.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: order_status
            business_name: Order Status
            description: >-
              Indicates the current status of the order (e.g., Shipped, Pending, Cancelled, Delivered).
              Business dimension for order lifecycle analysis.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: sales_channel
            business_name: Sales Channel
            description: >-
              Indicates the channel through which the order was placed (e.g., Online, Store, Mobile, Phone).
              Business dimension for channel analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: ship_city
            business_name: Ship City
            description: >-
              City to which the order is shipped. Geographic dimension for shipping destination analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: ship_state
            business_name: Ship State
            description: >-
              State or province to which the order is shipped. Geographic dimension for regional shipping analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: >-
              Postal or ZIP code to which the order is shipped. Used for geographic shipping analysis.
            sql_type: STRING(255)
          
          - name: subtotal
            business_name: Subtotal
            description: >-
              Monetary amount representing the order subtotal before discounts and taxes.
              Order-level measure. Do not sum after joining to order_items.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              aggregation_grain: order
          
          - name: discount_amount
            business_name: Discount Amount
            description: >-
              Monetary amount representing the total discount applied to the order.
              Order-level measure. Do not sum after joining to order_items.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              aggregation_grain: order
          
          - name: tax_amount
            business_name: Tax Amount
            description: >-
              Monetary amount representing the tax charged on the order.
              Order-level measure. Do not sum after joining to order_items.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              aggregation_grain: order
          
          - name: shipping_fee
            business_name: Shipping Fee
            description: >-
              Monetary amount representing the shipping cost for the order.
              Order-level measure. Do not sum after joining to order_items.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              aggregation_grain: order
          
          - name: total_amount
            business_name: Total Amount
            description: >-
              Monetary amount representing the final total of the order including all fees, taxes, and discounts.
              Order-level measure. This is the primary revenue measure at order grain. Do not sum after joining to order_items.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              aggregation_grain: order
          
          - name: currency
            business_name: Currency
            description: >-
              Currency code for the order amounts (e.g., USD, EUR, GBP). Used for multi-currency analysis.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: >-
              Name of the source system from which the record originated. Metadata field for data lineage.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ETL batch that loaded this record. Metadata field for ETL tracking.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp recording when the record was loaded into the table. Metadata field for data freshness tracking.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: order_items
        business_name: Order Items
        description: >-
          Order line item dataset containing one row per order line item. Records detailed line-level
          information for each product ordered including product reference, quantity, unit pricing,
          line-level discounts, and line totals. This is the primary dataset for product-level sales
          analysis and detailed order composition. Grain: One row per order line item identified by order_item_id.
        source: ORDER_MGMT
        primary_key:
          - order_item_id
        fields:
          - name: order_item_id
            business_name: Order Item Identifier
            description: >-
              Unique identifier for an order line item. Primary key for the order_items dataset.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: >-
              References the related order record. Foreign key to orders.order_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: line_number
            business_name: Line Number
            description: >-
              Sequential line number within the order. Used for ordering and identifying line items within an order.
            sql_type: INT
            constraints:
              - NOT NULL
          
          - name: product_id
            business_name: Product ID
            description: >-
              References the related product record. Foreign key to products.product_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: quantity
            business_name: Quantity
            description: >-
              Number of units ordered for this line item. Quantitative measure for units sold analysis.
            sql_type: INT
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: unit_price
            business_name: Unit Price
            description: >-
              Monetary amount representing the price per unit before discounts. Used for pricing analysis.
            sql_type: DECIMAL(12,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
          
          - name: discount_pct
            business_name: Discount Pct
            description: >-
              Percentage discount applied to the line item. Line-level discount for discount analysis.
            sql_type: DECIMAL(5,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
          
          - name: line_total
            business_name: Line Total
            description: >-
              Monetary amount representing the total for this line item after applying discounts.
              This is the primary revenue measure at line item grain. Use for product-level revenue analysis.
              Formula: quantity * unit_price * (1 - discount_pct / 100).
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              aggregation_grain: order_item
          
          - name: _source_system
            business_name: Source System
            description: >-
              Name of the source system from which the record originated. Metadata field for data lineage.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ETL batch that loaded this record. Metadata field for ETL tracking.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp recording when the record was loaded into the table. Metadata field for data freshness tracking.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: products
        business_name: Products
        description: >-
          Product master dataset containing one row per product. Contains definitions and specifications
          of product stock, catalog items, pricing structures, brand information, and inventory levels.
          This is the authoritative source for product attributes and product catalog information.
          Grain: One row per product identified by product_id.
        source: PRODUCT_CATALOG
        primary_key:
          - product_id
        fields:
          - name: product_id
            business_name: Product Identifier
            description: >-
              Unique identifier for a product. Primary key for the products dataset.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: sku
            business_name: Sku
            description: >-
              Stock keeping unit code for the product. Business identifier for product tracking and inventory management.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: product_name
            business_name: Product Name
            description: >-
              Name of the product. Primary product descriptor for reporting and analysis.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: category_id
            business_name: Category ID
            description: >-
              References the related product category record. Foreign key to product_categories.category_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: brand
            business_name: Brand
            description: >-
              Brand name of the product. Business dimension for brand analysis and brand performance.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: description
            business_name: Description
            description: >-
              Detailed description of the product. Contains product specifications and features.
            sql_type: STRING(255)
          
          - name: unit_price
            business_name: Unit Price
            description: >-
              Monetary amount representing the selling price per unit. Current list price for the product.
            sql_type: DECIMAL(12,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
          
          - name: cost_price
            business_name: Cost Price
            description: >-
              Monetary amount representing the cost per unit. Used for profitability analysis and margin calculations.
            sql_type: DECIMAL(12,2)
            measure:
              aggregation: AVG
          
          - name: currency
            business_name: Currency
            description: >-
              Currency code for the product prices (e.g., USD, EUR, GBP). Used for multi-currency analysis.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: stock_quantity
            business_name: Stock Quantity
            description: >-
              Current inventory quantity available for the product. Measure for inventory analysis.
            sql_type: INT
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: is_active
            business_name: Is Active
            description: >-
              Indicates whether the product is currently active for sale. Boolean flag for filtering active products.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
          
          - name: created_at
            business_name: Created At
            description: >-
              Timestamp recording when the product was created in the system. Time dimension for product lifecycle analysis.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: _source_system
            business_name: Source System
            description: >-
              Name of the source system from which the record originated. Metadata field for data lineage.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ETL batch that loaded this record. Metadata field for ETL tracking.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp recording when the record was loaded into the table. Metadata field for data freshness tracking.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: product_categories
        business_name: Product Categories
        description: >-
          Product category master dataset containing one row per product category. Contains hierarchical
          category structure with parent-child relationships enabling multi-level category analysis.
          This dataset supports category-level product organization and hierarchical category navigation.
          Grain: One row per product category identified by category_id.
        source: PRODUCT_CATALOG
        primary_key:
          - category_id
        fields:
          - name: category_id
            business_name: Category Identifier
            description: >-
              Unique identifier for a product category. Primary key for the product_categories dataset.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: category_name
            business_name: Category Name
            description: >-
              Name of the product category. Primary category descriptor for reporting and analysis.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: parent_category_id
            business_name: Parent Category ID
            description: >-
              References the parent category in the hierarchy. Foreign key to product_categories.category_id.
              Self-referencing relationship for hierarchical category structure. NULL for root categories.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
          
          - name: description
            business_name: Description
            description: >-
              Detailed description of the product category. Contains category definition and scope.
            sql_type: STRING(255)
          
          - name: is_active
            business_name: Is Active
            description: >-
              Indicates whether the category is currently active. Boolean flag for filtering active categories.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
          
          - name: _source_system
            business_name: Source System
            description: >-
              Name of the source system from which the record originated. Metadata field for data lineage.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ETL batch that loaded this record. Metadata field for ETL tracking.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp recording when the record was loaded into the table. Metadata field for data freshness tracking.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: payments
        business_name: Payments
        description: >-
          Payment transaction dataset containing one row per payment transaction. Records payment method,
          payment status, transaction amounts, payment gateway information, and payment timestamps.
          This dataset supports payment reconciliation, payment method analysis, and payment processing analytics.
          Grain: One row per payment transaction identified by payment_id.
        source: PAYMENT_SYS
        primary_key:
          - payment_id
        fields:
          - name: payment_id
            business_name: Payment Identifier
            description: >-
              Unique identifier for a payment transaction. Primary key for the payments dataset.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: >-
              References the related order record. Foreign key to orders.order_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: payment_method
            business_name: Payment Method
            description: >-
              Indicates the method used for payment (e.g., Credit Card, Debit Card, PayPal, Bank Transfer).
              Business dimension for payment method analysis.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: payment_status
            business_name: Payment Status
            description: >-
              Indicates the current status of the payment (e.g., Completed, Pending, Failed, Refunded).
              Business dimension for payment lifecycle analysis.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: amount
            business_name: Amount
            description: >-
              Monetary amount representing the payment value. Measure for payment analysis.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: currency
            business_name: Currency
            description: >-
              Currency code for the payment amount (e.g., USD, EUR, GBP). Used for multi-currency analysis.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: transaction_ref
            business_name: Transaction Ref
            description: >-
              External reference number for the payment transaction. Contains personally identifiable information (PII).
              Used for payment reconciliation with external systems.
            sql_type: STRING(255)
          
          - name: gateway
            business_name: Gateway
            description: >-
              Name of the payment gateway used to process the transaction (e.g., Stripe, PayPal, Square).
              Business dimension for gateway analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: paid_at
            business_name: Paid At
            description: >-
              Timestamp recording when the payment was completed. Time dimension for payment timing analysis.
            sql_type: TIMESTAMP(29,9)
            dimension:
              is_time: true
          
          - name: _source_system
            business_name: Source System
            description: >-
              Name of the source system from which the record originated. Metadata field for data lineage.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ETL batch that loaded this record. Metadata field for ETL tracking.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp recording when the record was loaded into the table. Metadata field for data freshness tracking.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: shipments
        business_name: Shipments
        description: >-
          Shipment dataset containing one row per shipment. Records shipping carrier information,
          tracking numbers, shipment status, shipping timestamps, and delivery destination.
          This dataset supports fulfillment analysis, delivery performance tracking, and logistics analytics.
          Grain: One row per shipment identified by shipment_id.
        source: LOGISTICS_SYS
        primary_key:
          - shipment_id
        fields:
          - name: shipment_id
            business_name: Shipment Identifier
            description: >-
              Unique identifier for a shipment. Primary key for the shipments dataset.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: >-
              References the related order record. Foreign key to orders.order_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: carrier
            business_name: Carrier
            description: >-
              Name of the shipping carrier handling the shipment (e.g., FedEx, UPS, USPS, DHL).
              Business dimension for carrier analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: tracking_number
            business_name: Tracking Number
            description: >-
              Tracking number assigned by the carrier for the shipment. Used for shipment tracking and customer service.
            sql_type: STRING(255)
          
          - name: shipment_status
            business_name: Shipment Status
            description: >-
              Indicates the current status of the shipment (e.g., In Transit, Delivered, Pending, Returned).
              Business dimension for shipment lifecycle analysis.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: shipped_at
            business_name: Shipped At
            description: >-
              Timestamp recording when the shipment was dispatched. Time dimension for shipment timing analysis.
            sql_type: TIMESTAMP(29,9)
            dimension:
              is_time: true
          
          - name: delivered_at
            business_name: Delivered At
            description: >-
              Timestamp recording when the shipment was delivered. Time dimension for delivery analysis.
              NULL if not yet delivered.
            sql_type: TIMESTAMP(29,9)
            dimension:
              is_time: true
          
          - name: ship_city
            business_name: Ship City
            description: >-
              City to which the shipment is being sent. Geographic dimension for shipping destination analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: ship_state
            business_name: Ship State
            description: >-
              State or province to which the shipment is being sent. Geographic dimension for regional shipping analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: >-
              Postal or ZIP code to which the shipment is being sent. Used for geographic shipping analysis.
            sql_type: STRING(255)
          
          - name: _source_system
            business_name: Source System
            description: >-
              Name of the source system from which the record originated. Metadata field for data lineage.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ETL batch that loaded this record. Metadata field for ETL tracking.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp recording when the record was loaded into the table. Metadata field for data freshness tracking.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

    relationships:
      - name: customers_to_orders
        left_dataset: customers
        right_dataset: orders
        relationship_type: one_to_many
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: left
        resolution: >-
          One-to-many relationship from customers to orders. Each customer can have multiple orders.
          Join customers.customer_id = orders.customer_id. Use for customer order history analysis,
          customer lifetime value calculations, and customer behavior analysis.

      - name: orders_to_order_items
        left_dataset: orders
        right_dataset: order_items
        relationship_type: one_to_many
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: left
        resolution: >-
          One-to-many relationship from orders to order_items. Each order can have multiple line items.
          Join orders.order_id = order_items.order_id. CRITICAL: Do not sum order-level amounts
          (orders.total_amount, orders.subtotal, orders.discount_amount, orders.tax_amount, orders.shipping_fee)
          after this join as it will cause double-counting. Use order-level amounts only when analyzing
          at order grain. Use order_items.line_total for product-level revenue analysis.

      - name: order_items_to_products
        left_dataset: order_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: left
        resolution: >-
          Many-to-one relationship from order_items to products. Multiple order line items can reference
          the same product. Join order_items.product_id = products.product_id. Use for product sales analysis,
          product performance metrics, and product attribute enrichment.

      - name: products_to_product_categories
        left_dataset: products
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - category_id
          right:
            - category_id
        join_type: left
        resolution: >-
          Many-to-one relationship from products to product_categories. Multiple products can belong to
          the same category. Join products.category_id = product_categories.category_id. Use for
          category-level product analysis and category performance metrics.

      - name: product_categories_hierarchy
        left_dataset: product_categories
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - parent_category_id
          right:
            - category_id
        join_type: left
        resolution: >-
          Self-referencing hierarchical relationship within product_categories. Each category can have
          a parent category, forming a category hierarchy tree. Join product_categories.parent_category_id =
          product_categories.category_id. Root categories have parent_category_id IS NULL. Use recursive
          common table expressions (CTEs) to traverse the full category hierarchy. This enables multi-level
          category rollup analysis and hierarchical category navigation.

      - name: orders_to_payments
        left_dataset: orders
        right_dataset: payments
        relationship_type: one_to_many
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: left
        resolution: >-
          One-to-many relationship from orders to payments. Each order can have multiple payment transactions
          (e.g., partial payments, refunds, payment retries). Join orders.order_id = payments.order_id.
          Use for payment reconciliation, payment method analysis, and payment status tracking.

      - name: orders_to_shipments
        left_dataset: orders
        right_dataset: shipments
        relationship_type: one_to_many
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: left
        resolution: >-
          One-to-many relationship from orders to shipments. Each order can have multiple shipments
          (e.g., split shipments, partial fulfillment). Join orders.order_id = shipments.order_id.
          Use for fulfillment analysis, delivery performance tracking, and logistics metrics.

    metrics:
      - name: total_revenue
        business_name: Total Revenue
        description: >-
          Total revenue from all orders calculated as the sum of order total amounts.
          This is the primary revenue metric at order grain. Represents the complete order value
          including all fees, taxes, and discounts.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.total_amount) AS total_revenue
                FROM orders
              columns_used:
                - orders.total_amount

      - name: total_orders
        business_name: Total Orders
        description: >-
          Total count of orders. Represents the number of distinct orders placed.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(orders.order_id) AS total_orders
                FROM orders
              columns_used:
                - orders.order_id

      - name: total_customers
        business_name: Total Customers
        description: >-
          Total count of distinct customers. Represents the number of unique customers in the system.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT customers.customer_id) AS total_customers
                FROM customers
              columns_used:
                - customers.customer_id

      - name: active_customers
        business_name: Active Customers
        description: >-
          Count of customers with active accounts. Filters customers where is_active = true.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT customers.customer_id) AS active_customers
                FROM customers
                WHERE customers.is_active = true
              columns_used:
                - customers.customer_id
                - customers.is_active

      - name: total_units_sold
        business_name: Total Units Sold
        description: >-
          Total quantity of units sold across all order line items. Represents the sum of quantities
          from all order items.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.quantity) AS total_units_sold
                FROM order_items
              columns_used:
                - order_items.quantity

      - name: average_order_value
        business_name: Average Order Value
        description: >-
          Average order value calculated as total revenue divided by total number of orders.
          Represents the average monetary value per order.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(orders.order_id) = 0 THEN 0
                    ELSE SUM(orders.total_amount) / COUNT(orders.order_id)
                  END AS average_order_value
                FROM orders
              columns_used:
                - orders.order_id
                - orders.total_amount

      - name: total_discount_amount
        business_name: Total Discount Amount
        description: >-
          Total discount amount applied across all orders. Represents the sum of order-level discounts.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.discount_amount) AS total_discount_amount
                FROM orders
              columns_used:
                - orders.discount_amount

      - name: total_tax_amount
        business_name: Total Tax Amount
        description: >-
          Total tax amount collected across all orders. Represents the sum of order-level taxes.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.tax_amount) AS total_tax_amount
                FROM orders
              columns_used:
                - orders.tax_amount

      - name: total_shipping_fees
        business_name: Total Shipping Fees
        description: >-
          Total shipping fees collected across all orders. Represents the sum of order-level shipping costs.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.shipping_fee) AS total_shipping_fees
                FROM orders
              columns_used:
                - orders.shipping_fee

      - name: line_item_revenue
        business_name: Line Item Revenue
        description: >-
          Total revenue from order line items calculated as the sum of line totals.
          This is the primary revenue metric at line item grain. Use for product-level revenue analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.line_total) AS line_item_revenue
                FROM order_items
              columns_used:
                - order_items.line_total

      - name: average_unit_price
        business_name: Average Unit Price
        description: >-
          Average selling price per unit calculated as total line revenue divided by total units sold.
          Represents the weighted average price across all line items.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN SUM(order_items.quantity) = 0 THEN 0
                    ELSE SUM(order_items.line_total) / SUM(order_items.quantity)
                  END AS average_unit_price
                FROM order_items
              columns_used:
                - order_items.line_total
                - order_items.quantity

      - name: orders_per_customer
        business_name: Orders Per Customer
        description: >-
          Average number of orders per customer calculated as total orders divided by total customers.
          Represents customer order frequency.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT customers.customer_id) = 0 THEN 0
                    ELSE CAST(COUNT(orders.order_id) AS DECIMAL) / COUNT(DISTINCT customers.customer_id)
                  END AS orders_per_customer
                FROM customers
                LEFT JOIN orders ON customers.customer_id = orders.customer_id
              columns_used:
                - customers.customer_id
                - orders.order_id

      - name: revenue_per_customer
        business_name: Revenue Per Customer
        description: >-
          Average revenue per customer calculated as total revenue divided by total customers.
          Represents customer lifetime value proxy.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT customers.customer_id) = 0 THEN 0
                    ELSE SUM(orders.total_amount) / COUNT(DISTINCT customers.customer_id)
                  END AS revenue_per_customer
                FROM customers
                LEFT JOIN orders ON customers.customer_id = orders.customer_id
              columns_used:
                - customers.customer_id
                - orders.total_amount

      - name: total_products
        business_name: Total Products
        description: >-
          Total count of distinct products in the catalog. Represents the size of the product catalog.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT products.product_id) AS total_products
                FROM products
              columns_used:
                - products.product_id

      - name: active_products
        business_name: Active Products
        description: >-
          Count of products that are currently active for sale. Filters products where is_active = true.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT products.product_id) AS active_products
                FROM products
                WHERE products.is_active = true
              columns_used:
                - products.product_id
                - products.is_active

      - name: total_inventory_value
        business_name: Total Inventory Value
        description: >-
          Total value of current inventory calculated as sum of (stock_quantity * cost_price) for all products.
          Represents the total cost value of inventory on hand.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(products.stock_quantity * products.cost_price) AS total_inventory_value
                FROM products
              columns_used:
                - products.stock_quantity
                - products.cost_price

      - name: line_item_cost
        business_name: Line Item Cost
        description: >-
          Total cost of goods sold at line item level calculated as sum of (quantity * cost_price).
          Represents the total cost for all units sold.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.quantity * products.cost_price) AS line_item_cost
                FROM order_items
                INNER JOIN products ON order_items.product_id = products.product_id
              columns_used:
                - order_items.quantity
                - products.cost_price

      - name: gross_profit
        business_name: Gross Profit
        description: >-
          Gross profit calculated as line item revenue minus line item cost.
          Represents the profit before operating expenses at line item grain.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.line_total) - SUM(order_items.quantity * products.cost_price) AS gross_profit
                FROM order_items
                INNER JOIN products ON order_items.product_id = products.product_id
              columns_used:
                - order_items.line_total
                - order_items.quantity
                - products.cost_price

      - name: gross_margin_pct
        business_name: Gross Margin Percentage
        description: >-
          Gross margin percentage calculated as (gross profit / line item revenue) * 100.
          Represents the profitability ratio as a percentage.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN SUM(order_items.line_total) = 0 THEN 0
                    ELSE (
                      (SUM(order_items.line_total) - SUM(order_items.quantity * products.cost_price))
                      / SUM(order_items.line_total)
                    ) * 100
                  END AS gross_margin_pct
                FROM order_items
                INNER JOIN products ON order_items.product_id = products.product_id
              columns_used:
                - order_items.line_total
                - order_items.quantity
                - products.cost_price

      - name: total_payments
        business_name: Total Payments
        description: >-
          Total count of payment transactions. Represents the number of payment records.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(payments.payment_id) AS total_payments
                FROM payments
              columns_used:
                - payments.payment_id

      - name: completed_payments
        business_name: Completed Payments
        description: >-
          Count of completed payment transactions. Filters payments where payment_status = 'Completed'.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(payments.payment_id) AS completed_payments
                FROM payments
                WHERE payments.payment_status = 'Completed'
              columns_used:
                - payments.payment_id
                - payments.payment_status

      - name: total_payment_amount
        business_name: Total Payment Amount
        description: >-
          Total payment amount received across all payment transactions.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(payments.amount) AS total_payment_amount
                FROM payments
              columns_used:
                - payments.amount

      - name: total_shipments
        business_name: Total Shipments
        description: >-
          Total count of shipments. Represents the number of shipment records.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(shipments.shipment_id) AS total_shipments
                FROM shipments
              columns_used:
                - shipments.shipment_id

      - name: delivered_shipments
        business_name: Delivered Shipments
        description: >-
          Count of shipments that have been delivered. Filters shipments where delivered_at IS NOT NULL.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(shipments.shipment_id) AS delivered_shipments
                FROM shipments
                WHERE shipments.delivered_at IS NOT NULL
              columns_used:
                - shipments.shipment_id
                - shipments.delivered_at

      - name: delivery_rate_pct
        business_name: Delivery Rate Percentage
        description: >-
          Percentage of shipments that have been delivered calculated as (delivered shipments / total shipments) * 100.
          Represents the fulfillment completion rate.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(shipments.shipment_id) = 0 THEN 0
                    ELSE (
                      CAST(COUNT(CASE WHEN shipments.delivered_at IS NOT NULL THEN 1 END) AS DECIMAL)
                      / COUNT(shipments.shipment_id)
                    ) * 100
                  END AS delivery_rate_pct
                FROM shipments
              columns_used:
                - shipments.shipment_id
                - shipments.delivered_at

      - name: revenue_by_customer_segment
        business_name: Revenue By Customer Segment
        description: >-
          Total revenue grouped by customer segment. Provides revenue breakdown by customer segmentation.
        return_type: DECIMAL
        result_grain: one row per customer segment
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  customers.customer_segment,
                  SUM(orders.total_amount) AS revenue
                FROM customers
                INNER JOIN orders ON customers.customer_id = orders.customer_id
                GROUP BY customers.customer_segment
              columns_used:
                - customers.customer_segment
                - orders.total_amount

      - name: revenue_by_sales_channel
        business_name: Revenue By Sales Channel
        description: >-
          Total revenue grouped by sales channel. Provides revenue breakdown by order channel.
        return_type: DECIMAL
        result_grain: one row per sales channel
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  orders.sales_channel,
                  SUM(orders.total_amount) AS revenue
                FROM orders
                GROUP BY orders.sales_channel
              columns_used:
                - orders.sales_channel
                - orders.total_amount

      - name: revenue_by_product_category
        business_name: Revenue By Product Category
        description: >-
          Total revenue grouped by product category. Provides revenue breakdown by product category.
        return_type: DECIMAL
        result_grain: one row per product category
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  product_categories.category_name,
                  SUM(order_items.line_total) AS revenue
                FROM order_items
                INNER JOIN products ON order_items.product_id = products.product_id
                INNER JOIN product_categories ON products.category_id = product_categories.category_id
                GROUP BY product_categories.category_name
              columns_used:
                - product_categories.category_name
                - order_items.line_total

      - name: revenue_by_brand
        business_name: Revenue By Brand
        description: >-
          Total revenue grouped by product brand. Provides revenue breakdown by brand.
        return_type: DECIMAL
        result_grain: one row per brand
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  products.brand,
                  SUM(order_items.line_total) AS revenue
                FROM order_items
                INNER JOIN products ON order_items.product_id = products.product_id
                WHERE products.brand IS NOT NULL
                GROUP BY products.brand
              columns_used:
                - products.brand
                - order_items.line_total

      - name: orders_by_status
        business_name: Orders By Status
        description: >-
          Count of orders grouped by order status. Provides order distribution by status.
        return_type: BIGINT
        result_grain: one row per order status
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  orders.order_status,
                  COUNT(orders.order_id) AS order_count
                FROM orders
                GROUP BY orders.order_status
              columns_used:
                - orders.order_status
                - orders.order_id

      - name: monthly_revenue
        business_name: Monthly Revenue
        description: >-
          Total revenue grouped by month. Provides time-series revenue analysis by month.
        return_type: DECIMAL
        result_grain: one row per month
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  DATE_TRUNC('MONTH', orders.order_date) AS order_month,
                  SUM(orders.total_amount) AS revenue
                FROM orders
                GROUP BY DATE_TRUNC('MONTH', orders.order_date)
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.total_amount

      - name: monthly_order_count
        business_name: Monthly Order Count
        description: >-
          Count of orders grouped by month. Provides time-series order volume analysis by month.
        return_type: BIGINT
        result_grain: one row per month
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  DATE_TRUNC('MONTH', orders.order_date) AS order_month,
                  COUNT(orders.order_id) AS order_count
                FROM orders
                GROUP BY DATE_TRUNC('MONTH', orders.order_date)
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.order_id

      - name: customer_acquisition_by_month
        business_name: Customer Acquisition By Month
        description: >-
          Count of new customers grouped by registration month. Provides customer acquisition trends.
        return_type: BIGINT
        result_grain: one row per month
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  DATE_TRUNC('MONTH', customers.registration_date) AS registration_month,
                  COUNT(customers.customer_id) AS new_customers
                FROM customers
                GROUP BY DATE_TRUNC('MONTH', customers.registration_date)
                ORDER BY registration_month
              columns_used:
                - customers.registration_date
                - customers.customer_id
