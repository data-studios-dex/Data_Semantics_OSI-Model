version: "1.0"

semantic_model:
  - name: ecom_retail_analytics
    description: >-
      Comprehensive semantic model for retail e-commerce analytics covering customers, orders, products, 
      payments, and shipments. This model supports analytical queries across customer behavior, order fulfillment, 
      product performance, payment processing, and logistics operations. The model is designed for Databricks 
      SQL dialect and includes complete relationship mapping, hierarchical structures, and business metrics 
      for retail analytics.
    
    ai_context:
      instructions: >-
        ## Dataset Grain Reference
        
        - **customers**: One row per customer. Contains customer demographic and account information.
        - **orders**: One row per order. Contains order header information including totals, dates, and shipping details.
        - **order_items**: One row per order line item. Multiple rows per order. Contains product-level order details.
        - **products**: One row per product. Contains product catalog information including pricing and inventory.
        - **product_categories**: One row per product category. Supports hierarchical category structure via parent_category_id.
        - **payments**: One row per payment transaction. Multiple payments may exist per order.
        - **shipments**: One row per shipment. Contains shipping and delivery tracking information.
        
        ## Metric Selection Guidance
        
        ### Order-Level Metrics
        Use these fields from the **orders** dataset for order-level analysis:
        - `subtotal`: Order subtotal before discounts and taxes
        - `discount_amount`: Total discount applied to the order
        - `tax_amount`: Tax charged on the order
        - `shipping_fee`: Shipping cost for the order
        - `total_amount`: Final order total
        
        ### Order-Item-Level Metrics
        Use these fields from the **order_items** dataset for product-level or line-item analysis:
        - `quantity`: Units ordered per line item
        - `unit_price`: Price per unit for the line item
        - `discount_pct`: Percentage discount on the line item
        - `line_total`: Total for the line item
        
        ### Product-Level Metrics
        Use these fields from the **products** dataset for product profitability analysis:
        - `unit_price`: Selling price per unit
        - `cost_price`: Cost per unit
        - Profit per unit = `unit_price` - `cost_price`
        
        ## Join Guidance
        
        ### Standard Relationships
        - **customers → orders**: Join on `customer_id`. One customer can have many orders (one-to-many).
        - **orders → order_items**: Join on `order_id`. One order can have many line items (one-to-many).
        - **order_items → products**: Join on `product_id`. Many order items reference one product (many-to-one).
        - **products → product_categories**: Join on `category_id`. Many products belong to one category (many-to-one).
        - **orders → payments**: Join on `order_id`. One order can have multiple payments (one-to-many).
        - **orders → shipments**: Join on `order_id`. One order can have multiple shipments (one-to-many).
        
        ### Hierarchical Relationship
        - **product_categories → product_categories (parent)**: Self-referencing join on `parent_category_id = category_id`.
          This creates a category hierarchy. Use recursive queries to traverse the full hierarchy tree.
        
        ## Double-Counting Prevention
        
        ### Critical: Order-Level vs Order-Item-Level Aggregation
        
        **NEVER sum order-level amounts after joining orders to order_items.**
        
        The **orders** dataset contains one row per order with aggregated totals:
        - `orders.subtotal`
        - `orders.discount_amount`
        - `orders.tax_amount`
        - `orders.shipping_fee`
        - `orders.total_amount`
        
        The **order_items** dataset contains multiple rows per order (one per line item).
        
        **Incorrect Query Pattern:**
        ```sql
        SELECT SUM(orders.total_amount)
        FROM orders
        JOIN order_items ON orders.order_id = order_items.order_id
        -- This will duplicate order totals for each line item!
        ```
        
        **Correct Query Patterns:**
        
        For order-level revenue:
        ```sql
        SELECT SUM(orders.total_amount) AS total_revenue
        FROM orders
        -- No join to order_items
        ```
        
        For product-level revenue:
        ```sql
        SELECT 
          products.product_name,
          SUM(order_items.line_total) AS product_revenue
        FROM order_items
        JOIN products ON order_items.product_id = products.product_id
        GROUP BY products.product_name
        ```
        
        For combined order and product analysis, use subqueries or window functions:
        ```sql
        SELECT 
          orders.order_id,
          orders.total_amount,
          order_items.product_id,
          order_items.line_total
        FROM orders
        JOIN order_items ON orders.order_id = order_items.order_id
        -- Use order_items.line_total for product-level aggregation
        -- Reference orders.total_amount for display only, not for SUM
        ```
        
        ### Payment and Shipment Joins
        
        Similar caution applies when joining **orders** to **payments** or **shipments**:
        - Multiple payments or shipments per order will duplicate order-level amounts
        - Aggregate payment amounts separately from order amounts
        - Use subqueries or CTEs to pre-aggregate before joining
        
        ## Time Analysis Guidance
        
        ### Date Fields by Business Context
        
        - **Order Analysis**: Use `orders.order_date` for order placement timing
        - **Payment Analysis**: Use `payments.paid_at` for payment completion timing
        - **Shipment Analysis**: Use `shipments.shipped_at` for dispatch timing and `shipments.delivered_at` for delivery timing
        - **Customer Registration**: Use `customers.registration_date` for customer acquisition analysis
        - **Product Creation**: Use `products.created_at` for product catalog history
        
        ### Time-Based Metrics
        
        When calculating time-series metrics:
        - Use `DATE_TRUNC()` or `DATE()` functions to group by day, month, quarter, or year
        - For period-over-period comparisons, use `LAG()` window function
        - For running totals, use `SUM() OVER (ORDER BY date_field)`
        - For delivery time analysis, calculate `DATEDIFF(day, shipped_at, delivered_at)`
        
        ## Hierarchical Category Analysis
        
        The **product_categories** table contains a self-referencing hierarchy via `parent_category_id`.
        
        To query the full category hierarchy, use a recursive CTE:
        
        ```sql
        WITH RECURSIVE category_hierarchy AS (
          -- Base case: root categories (no parent)
          SELECT 
            category_id,
            category_name,
            parent_category_id,
            category_name AS full_path,
            0 AS level
          FROM product_categories
          WHERE parent_category_id IS NULL
          
          UNION ALL
          
          -- Recursive case: child categories
          SELECT 
            c.category_id,
            c.category_name,
            c.parent_category_id,
            CONCAT(ch.full_path, ' > ', c.category_name) AS full_path,
            ch.level + 1 AS level
          FROM product_categories c
          JOIN category_hierarchy ch ON c.parent_category_id = ch.category_id
        )
        SELECT * FROM category_hierarchy
        ```
        
        ## Metric Interpretation
        
        ### Revenue Metrics
        - **Total Revenue**: Sum of `orders.total_amount` across all orders
        - **Gross Revenue**: Sum of `orders.subtotal` before discounts
        - **Net Revenue**: Sum of `orders.total_amount` (includes discounts, taxes, shipping)
        - **Product Revenue**: Sum of `order_items.line_total` by product
        
        ### Profitability Metrics
        - **Gross Profit**: Revenue minus cost. Calculate using `order_items.line_total` and product cost.
        - **Gross Margin %**: (Gross Profit / Revenue) * 100
        - **Average Order Value**: Total revenue / order count
        
        ### Customer Metrics
        - **Customer Count**: COUNT(DISTINCT customer_id)
        - **Active Customers**: Customers with `is_active = true`
        - **Orders per Customer**: Total orders / customer count
        - **Revenue per Customer**: Total revenue / customer count
        
        ### Product Metrics
        - **Units Sold**: Sum of `order_items.quantity`
        - **Average Selling Price**: Weighted average using quantity and unit_price
        - **Product Margin**: (unit_price - cost_price) / unit_price * 100
        
        ### Fulfillment Metrics
        - **Delivery Time**: Days between `shipped_at` and `delivered_at`
        - **On-Time Delivery**: Percentage of shipments delivered within expected timeframe
        - **Shipment Count**: COUNT of shipments by status
        
        ## Query Restrictions and Considerations
        
        ### Data Quality
        - Some optional fields may contain NULL values (e.g., phone, date_of_birth, cost_price)
        - Use COALESCE() or NULL-safe operations when aggregating optional fields
        - PII fields are redacted in sample data; handle appropriately in production
        
        ### Currency Handling
        - All monetary amounts are in the currency specified in the `currency` field
        - Current data shows USD as the primary currency
        - For multi-currency analysis, implement currency conversion logic
        
        ### Status Fields
        - **order_status**: Indicates order lifecycle (e.g., Shipped, Delivered, Cancelled)
        - **payment_status**: Indicates payment state (e.g., Completed, Pending, Failed)
        - **shipment_status**: Indicates shipment state (e.g., In Transit, Delivered)
        - Filter by status when calculating operational metrics
        
        ### Discount Calculations
        - Order-level discounts: `orders.discount_amount` (absolute amount)
        - Line-level discounts: `order_items.discount_pct` (percentage)
        - Line total already includes discount: `line_total = quantity * unit_price * (1 - discount_pct/100)`
        
        ### Inventory Analysis
        - Current inventory: `products.stock_quantity`
        - Track inventory changes over time using `_loaded_at` timestamp
        - Consider products with `is_active = false` as discontinued
    
    datasets:
      - name: customers
        business_name: Customers
        description: >-
          Customer master dataset containing one row per customer. Includes customer demographic information,
          contact details, geographic location, customer segmentation, registration date, and account status.
          This dataset serves as the primary reference for customer-related analytics and supports customer
          segmentation, geographic analysis, and customer lifecycle tracking.
        source: ecom_bronze.customers
        primary_key:
          - customer_id
        fields:
          - name: customer_id
            business_name: Customer Identifier
            description: Unique identifier for a customer.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: customer_code
            business_name: Customer Code
            description: Business reference code assigned to the customer.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: first_name
            business_name: First Name
            description: First name of the customer. PII field.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: last_name
            business_name: Last Name
            description: Last name of the customer. PII field.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: email
            business_name: Email
            description: Email address of the customer. PII field.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: phone
            business_name: Phone
            description: Phone number of the customer. PII field.
            sql_type: STRING
            constraints: []
          
          - name: gender
            business_name: Gender
            description: Gender of the customer. Analytical dimension for demographic segmentation.
            sql_type: STRING
            constraints: []
            dimension:
              is_categorical: true
          
          - name: date_of_birth
            business_name: Date Of Birth
            description: Date of birth of the customer. PII field. Can be used to calculate customer age.
            sql_type: DATE
            constraints: []
          
          - name: city
            business_name: City
            description: City where the customer resides. Geographic dimension for location-based analysis.
            sql_type: STRING
            constraints: []
            dimension:
              is_categorical: true
          
          - name: state
            business_name: State
            description: State or province where the customer resides. Geographic dimension for regional analysis.
            sql_type: STRING
            constraints: []
            dimension:
              is_categorical: true
          
          - name: country
            business_name: Country
            description: Country where the customer resides. Geographic dimension for international analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: postal_code
            business_name: Postal Code
            description: Postal or ZIP code of the customer's address.
            sql_type: STRING
            constraints: []
          
          - name: customer_segment
            business_name: Customer Segment
            description: >-
              Indicates the current segment classification of the customer (e.g., Premium, Standard, Basic).
              Key dimension for customer segmentation analysis and targeted marketing.
            sql_type: STRING
            constraints: []
            dimension:
              is_categorical: true
          
          - name: registration_date
            business_name: Registration Date
            description: >-
              Date when the customer registered. Time dimension for customer acquisition analysis
              and cohort tracking.
            sql_type: DATE
            constraints: []
            dimension:
              is_time: true
          
          - name: is_active
            business_name: Is Active
            description: >-
              Indicates whether the customer account is currently active. Boolean dimension for
              filtering active vs inactive customers.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
            constraints: []
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: orders
        business_name: Orders
        description: >-
          Order header dataset containing one row per order. Includes order identification, customer reference,
          order timing, status, sales channel, shipping destination, and financial totals (subtotal, discounts,
          taxes, shipping fees, and final total). This dataset represents the analytical grain for order-level
          metrics and supports order fulfillment, revenue, and customer purchase behavior analysis.
        source: ecom_bronze.orders
        primary_key:
          - order_id
        fields:
          - name: order_id
            business_name: Order Identifier
            description: Unique identifier for an order.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_number
            business_name: Order Number
            description: Business reference number assigned to the order.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: customer_id
            business_name: Customer ID
            description: References the related customer record. Foreign key to customers.customer_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: order_date
            business_name: Order Date
            description: >-
              Timestamp recording when the order was placed. Primary time dimension for order analysis,
              revenue trending, and time-series metrics.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: order_status
            business_name: Order Status
            description: >-
              Indicates the current status of the order (e.g., Shipped, Delivered, Cancelled, Pending).
              Key dimension for order lifecycle analysis and operational metrics.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: sales_channel
            business_name: Sales Channel
            description: >-
              Indicates the channel through which the order was placed (e.g., Online, Mobile, In-Store).
              Dimension for channel performance analysis.
            sql_type: STRING
            constraints: []
            dimension:
              is_categorical: true
          
          - name: ship_city
            business_name: Ship City
            description: City to which the order is shipped. Geographic dimension for shipping analysis.
            sql_type: STRING
            constraints: []
            dimension:
              is_categorical: true
          
          - name: ship_state
            business_name: Ship State
            description: State or province to which the order is shipped. Geographic dimension for regional shipping analysis.
            sql_type: STRING
            constraints: []
            dimension:
              is_categorical: true
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: Postal or ZIP code to which the order is shipped.
            sql_type: STRING
            constraints: []
          
          - name: subtotal
            business_name: Subtotal
            description: >-
              Monetary amount representing the order subtotal before discounts and taxes.
              Base measure for gross revenue calculation.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: discount_amount
            business_name: Discount Amount
            description: >-
              Monetary amount representing the total discount applied to the order.
              Measure for discount analysis and promotional effectiveness.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: tax_amount
            business_name: Tax Amount
            description: >-
              Monetary amount representing the tax charged on the order.
              Measure for tax analysis and compliance reporting.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: shipping_fee
            business_name: Shipping Fee
            description: >-
              Monetary amount representing the shipping cost for the order.
              Measure for shipping cost analysis and logistics optimization.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: total_amount
            business_name: Total Amount
            description: >-
              Monetary amount representing the final total of the order (subtotal - discount + tax + shipping).
              Primary measure for order-level revenue analysis.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: currency
            business_name: Currency
            description: Currency code for the order amounts (e.g., USD, EUR, GBP).
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
            constraints: []
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: order_items
        business_name: Order Items
        description: >-
          Order line item dataset containing one row per order line item. Multiple rows exist per order.
          Includes product reference, quantity, unit pricing, line-level discounts, and line totals.
          This dataset represents the analytical grain for product-level order analysis and supports
          product performance, inventory movement, and detailed revenue attribution.
        source: ecom_bronze.order_items
        primary_key:
          - order_item_id
        fields:
          - name: order_item_id
            business_name: Order Item Identifier
            description: Unique identifier for an order line item.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: References the related order record. Foreign key to orders.order_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: line_number
            business_name: Line Number
            description: Sequential line number within the order.
            sql_type: INT
            constraints:
              - NOT NULL
          
          - name: product_id
            business_name: Product ID
            description: References the related product record. Foreign key to products.product_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: quantity
            business_name: Quantity
            description: >-
              Number of units ordered for this line item. Measure for units sold and inventory movement analysis.
            sql_type: INT
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: unit_price
            business_name: Unit Price
            description: >-
              Monetary amount representing the price per unit for this line item.
              Used for average selling price calculation.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
          
          - name: discount_pct
            business_name: Discount Pct
            description: >-
              Percentage discount applied to the line item. Used for line-level discount analysis.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
          
          - name: line_total
            business_name: Line Total
            description: >-
              Monetary amount representing the total for this line item after discount.
              Calculated as: quantity * unit_price * (1 - discount_pct / 100).
              Primary measure for product-level revenue analysis.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
            constraints: []
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: products
        business_name: Products
        description: >-
          Product catalog dataset containing one row per product. Includes product identification, SKU,
          product name, category reference, brand, description, pricing (unit price and cost price),
          currency, current inventory, and active status. This dataset supports product performance analysis,
          profitability analysis, and inventory management.
        source: ecom_bronze.products
        primary_key:
          - product_id
        fields:
          - name: product_id
            business_name: Product Identifier
            description: Unique identifier for a product.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: sku
            business_name: Sku
            description: Stock keeping unit code for the product. Business identifier for inventory management.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: product_name
            business_name: Product Name
            description: Name of the product. Primary dimension for product analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: category_id
            business_name: Category ID
            description: References the related product category record. Foreign key to product_categories.category_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: brand
            business_name: Brand
            description: Brand name of the product. Dimension for brand performance analysis.
            sql_type: STRING
            constraints: []
            dimension:
              is_categorical: true
          
          - name: description
            business_name: Description
            description: Detailed description of the product.
            sql_type: STRING
            constraints: []
          
          - name: unit_price
            business_name: Unit Price
            description: >-
              Monetary amount representing the selling price per unit. Used for revenue and pricing analysis.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
          
          - name: cost_price
            business_name: Cost Price
            description: >-
              Monetary amount representing the cost per unit. Used for profitability and margin analysis.
            sql_type: DECIMAL
            constraints: []
          
          - name: currency
            business_name: Currency
            description: Currency code for the product prices (e.g., USD, EUR, GBP).
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: stock_quantity
            business_name: Stock Quantity
            description: >-
              Current inventory quantity available for the product. Measure for inventory analysis.
            sql_type: INT
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: is_active
            business_name: Is Active
            description: >-
              Indicates whether the product is currently active for sale. Boolean dimension for
              filtering active vs discontinued products.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: created_at
            business_name: Created At
            description: >-
              Timestamp recording when the product was created in the system. Time dimension for
              product catalog history analysis.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
            constraints: []
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: product_categories
        business_name: Product Categories
        description: >-
          Product category dataset containing one row per product category. Supports hierarchical category
          structure through self-referencing parent_category_id. Includes category identification, category name,
          parent category reference, description, and active status. This dataset enables category hierarchy
          traversal and category-based product analysis.
        source: ecom_bronze.product_categories
        primary_key:
          - category_id
        fields:
          - name: category_id
            business_name: Category Identifier
            description: Unique identifier for a product category.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: category_name
            business_name: Category Name
            description: Name of the product category. Primary dimension for category analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: parent_category_id
            business_name: Parent Category ID
            description: >-
              References the parent category in the hierarchy. Self-referencing foreign key to
              product_categories.category_id. NULL for root-level categories.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
          
          - name: description
            business_name: Description
            description: Detailed description of the product category.
            sql_type: STRING
            constraints: []
          
          - name: is_active
            business_name: Is Active
            description: >-
              Indicates whether the category is currently active. Boolean dimension for filtering
              active vs inactive categories.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
            constraints: []
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: payments
        business_name: Payments
        description: >-
          Payment transaction dataset containing one row per payment transaction. Multiple payments may exist
          per order. Includes payment identification, order reference, payment method, payment status, amount,
          currency, transaction reference, gateway, and payment timestamp. This dataset supports payment
          processing analysis, payment method performance, and financial reconciliation.
        source: ecom_bronze.payments
        primary_key:
          - payment_id
        fields:
          - name: payment_id
            business_name: Payment Identifier
            description: Unique identifier for a payment transaction.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: References the related order record. Foreign key to orders.order_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: payment_method
            business_name: Payment Method
            description: >-
              Indicates the method used for payment (e.g., Credit Card, Debit Card, PayPal, Bank Transfer).
              Dimension for payment method analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: payment_status
            business_name: Payment Status
            description: >-
              Indicates the current status of the payment (e.g., Completed, Pending, Failed, Refunded).
              Dimension for payment processing analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: amount
            business_name: Amount
            description: >-
              Monetary amount representing the payment value. Measure for payment analysis and reconciliation.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: currency
            business_name: Currency
            description: Currency code for the payment amount (e.g., USD, EUR, GBP).
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: transaction_ref
            business_name: Transaction Ref
            description: External reference number for the payment transaction. PII field.
            sql_type: STRING
            constraints: []
          
          - name: gateway
            business_name: Gateway
            description: >-
              Name of the payment gateway used to process the transaction (e.g., Stripe, PayPal, Square).
              Dimension for gateway performance analysis.
            sql_type: STRING
            constraints: []
            dimension:
              is_categorical: true
          
          - name: paid_at
            business_name: Paid At
            description: >-
              Timestamp recording when the payment was completed. Time dimension for payment timing analysis.
            sql_type: TIMESTAMP
            constraints: []
            dimension:
              is_time: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
            constraints: []
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: shipments
        business_name: Shipments
        description: >-
          Shipment dataset containing one row per shipment. Multiple shipments may exist per order.
          Includes shipment identification, order reference, carrier, tracking number, shipment status,
          shipping and delivery timestamps, and destination address. This dataset supports logistics analysis,
          delivery performance tracking, and carrier performance evaluation.
        source: ecom_bronze.shipments
        primary_key:
          - shipment_id
        fields:
          - name: shipment_id
            business_name: Shipment Identifier
            description: Unique identifier for a shipment.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: References the related order record. Foreign key to orders.order_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: carrier
            business_name: Carrier
            description: >-
              Name of the shipping carrier handling the shipment (e.g., FedEx, UPS, USPS, DHL).
              Dimension for carrier performance analysis.
            sql_type: STRING
            constraints: []
            dimension:
              is_categorical: true
          
          - name: tracking_number
            business_name: Tracking Number
            description: Tracking number assigned by the carrier for the shipment.
            sql_type: STRING
            constraints: []
          
          - name: shipment_status
            business_name: Shipment Status
            description: >-
              Indicates the current status of the shipment (e.g., In Transit, Delivered, Delayed, Returned).
              Dimension for shipment lifecycle analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: shipped_at
            business_name: Shipped At
            description: >-
              Timestamp recording when the shipment was dispatched. Time dimension for shipping timing analysis.
            sql_type: TIMESTAMP
            constraints: []
            dimension:
              is_time: true
          
          - name: delivered_at
            business_name: Delivered At
            description: >-
              Timestamp recording when the shipment was delivered. Time dimension for delivery timing analysis.
            sql_type: TIMESTAMP
            constraints: []
            dimension:
              is_time: true
          
          - name: ship_city
            business_name: Ship City
            description: City to which the shipment is being sent. Geographic dimension for shipping analysis.
            sql_type: STRING
            constraints: []
            dimension:
              is_categorical: true
          
          - name: ship_state
            business_name: Ship State
            description: State or province to which the shipment is being sent. Geographic dimension for regional shipping analysis.
            sql_type: STRING
            constraints: []
            dimension:
              is_categorical: true
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: Postal or ZIP code to which the shipment is being sent.
            sql_type: STRING
            constraints: []
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
            constraints: []
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
    
    relationships:
      - name: orders_to_customers
        left_dataset: orders
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each order is placed by exactly one customer.
          One customer can place multiple orders. Join on customer_id to associate orders
          with customer demographic and segmentation data.
      
      - name: order_items_to_orders
        left_dataset: order_items
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each order line item belongs to exactly one order.
          One order can contain multiple line items. Join on order_id to associate line items
          with order header information. CRITICAL: When aggregating order-level amounts (subtotal,
          discount_amount, tax_amount, shipping_fee, total_amount), do NOT sum after this join
          as it will duplicate order totals for each line item.
      
      - name: order_items_to_products
        left_dataset: order_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each order line item references exactly one product.
          One product can appear in multiple order line items. Join on product_id to associate
          line items with product catalog information including product name, brand, category,
          and pricing.
      
      - name: products_to_product_categories
        left_dataset: products
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each product belongs to exactly one category.
          One category can contain multiple products. Join on category_id to associate products
          with category information and enable category-based product analysis.
      
      - name: product_categories_hierarchy
        left_dataset: product_categories
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - parent_category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Self-referencing hierarchical relationship. Each category may have a parent category,
          creating a category hierarchy tree. Root-level categories have NULL parent_category_id.
          To traverse the full hierarchy, use a recursive CTE. This enables multi-level category
          rollup analysis and hierarchical category reporting. Example: Electronics > Computers > Laptops.
      
      - name: payments_to_orders
        left_dataset: payments
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each payment transaction is associated with exactly one order.
          One order may have multiple payment transactions (e.g., split payments, partial payments, refunds).
          Join on order_id to associate payments with order information. CAUTION: When aggregating order-level
          amounts after this join, be aware that multiple payments per order will duplicate order totals.
      
      - name: shipments_to_orders
        left_dataset: shipments
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each shipment is associated with exactly one order.
          One order may have multiple shipments (e.g., partial shipments, split shipments).
          Join on order_id to associate shipments with order information. CAUTION: When aggregating
          order-level amounts after this join, be aware that multiple shipments per order will
          duplicate order totals.
    
    metrics:
      - name: total_revenue
        business_name: Total Revenue
        description: >-
          Total revenue across all orders, calculated as the sum of order total amounts.
          This represents the final revenue including discounts, taxes, and shipping fees.
          Use this metric for overall revenue analysis at the order level.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.total_amount) AS total_revenue
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.total_amount
      
      - name: gross_revenue
        business_name: Gross Revenue
        description: >-
          Gross revenue before discounts, calculated as the sum of order subtotals.
          This represents the revenue before any discounts are applied, excluding taxes and shipping.
          Use this metric to understand revenue before promotional impacts.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.subtotal) AS gross_revenue
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.subtotal
      
      - name: total_discount_amount
        business_name: Total Discount Amount
        description: >-
          Total discount amount applied across all orders. This represents the total value
          of discounts given to customers and can be used to measure promotional effectiveness.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.discount_amount) AS total_discount_amount
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.discount_amount
      
      - name: total_tax_amount
        business_name: Total Tax Amount
        description: >-
          Total tax amount collected across all orders. This represents the total tax revenue
          and can be used for tax reporting and compliance analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.tax_amount) AS total_tax_amount
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.tax_amount
      
      - name: total_shipping_fees
        business_name: Total Shipping Fees
        description: >-
          Total shipping fees collected across all orders. This represents the total shipping
          revenue and can be used for logistics cost recovery analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.shipping_fee) AS total_shipping_fees
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.shipping_fee
      
      - name: order_count
        business_name: Order Count
        description: >-
          Total number of orders. This represents the count of distinct orders and is used
          for order volume analysis and average order value calculations.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(orders.order_id) AS order_count
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.order_id
      
      - name: average_order_value
        business_name: Average Order Value
        description: >-
          Average order value calculated as total revenue divided by order count.
          This metric represents the average amount spent per order and is a key indicator
          of customer purchase behavior and pricing effectiveness.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(orders.order_id) = 0 THEN 0
                    ELSE SUM(orders.total_amount) / COUNT(orders.order_id)
                  END AS average_order_value
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.total_amount
                - orders.order_id
      
      - name: customer_count
        business_name: Customer Count
        description: >-
          Total number of distinct customers. This represents the count of unique customers
          and is used for customer base analysis and customer-level metrics.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT customers.customer_id) AS customer_count
                FROM ecom_bronze.customers AS customers
              columns_used:
                - customers.customer_id
      
      - name: active_customer_count
        business_name: Active Customer Count
        description: >-
          Number of customers with active accounts. This represents customers where is_active = true
          and is used for active customer base analysis.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(customers.customer_id) AS active_customer_count
                FROM ecom_bronze.customers AS customers
                WHERE customers.is_active = true
              columns_used:
                - customers.customer_id
                - customers.is_active
      
      - name: revenue_per_customer
        business_name: Revenue Per Customer
        description: >-
          Average revenue per customer calculated as total revenue divided by distinct customer count.
          This metric represents the average lifetime value contribution per customer and is used
          for customer value analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT orders.customer_id) = 0 THEN 0
                    ELSE SUM(orders.total_amount) / COUNT(DISTINCT orders.customer_id)
                  END AS revenue_per_customer
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.total_amount
                - orders.customer_id
      
      - name: orders_per_customer
        business_name: Orders Per Customer
        description: >-
          Average number of orders per customer calculated as total order count divided by
          distinct customer count. This metric represents customer purchase frequency.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT orders.customer_id) = 0 THEN 0
                    ELSE CAST(COUNT(orders.order_id) AS DECIMAL) / COUNT(DISTINCT orders.customer_id)
                  END AS orders_per_customer
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.order_id
                - orders.customer_id
      
      - name: product_revenue
        business_name: Product Revenue
        description: >-
          Total revenue by product calculated as the sum of line totals from order items.
          This metric provides product-level revenue analysis and should be used when analyzing
          revenue at the product grain rather than order grain.
        return_type: DECIMAL
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  order_items.product_id,
                  products.product_name,
                  SUM(order_items.line_total) AS product_revenue
                FROM ecom_bronze.order_items AS order_items
                JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
                GROUP BY order_items.product_id, products.product_name
              columns_used:
                - order_items.product_id
                - order_items.line_total
                - products.product_name
      
      - name: units_sold
        business_name: Units Sold
        description: >-
          Total number of units sold across all order line items. This represents the sum
          of quantities ordered and is used for inventory movement and product demand analysis.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.quantity) AS units_sold
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.quantity
      
      - name: units_sold_by_product
        business_name: Units Sold By Product
        description: >-
          Number of units sold by product. This metric provides product-level unit sales
          analysis and is used for product demand and inventory planning.
        return_type: BIGINT
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  order_items.product_id,
                  products.product_name,
                  SUM(order_items.quantity) AS units_sold
                FROM ecom_bronze.order_items AS order_items
                JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
                GROUP BY order_items.product_id, products.product_name
              columns_used:
                - order_items.product_id
                - order_items.quantity
                - products.product_name
      
      - name: average_selling_price
        business_name: Average Selling Price
        description: >-
          Weighted average selling price calculated as total line revenue divided by total units sold.
          This represents the average price per unit across all sales and accounts for quantity weighting.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN SUM(order_items.quantity) = 0 THEN 0
                    ELSE SUM(order_items.line_total) / SUM(order_items.quantity)
                  END AS average_selling_price
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.line_total
                - order_items.quantity
      
      - name: product_profit
        business_name: Product Profit
        description: >-
          Total profit by product calculated as the difference between line revenue and line cost.
          Line cost is derived as quantity * cost_price. This metric requires products.cost_price
          to be available and is used for product profitability analysis.
        return_type: DECIMAL
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  order_items.product_id,
                  products.product_name,
                  SUM(order_items.line_total) - SUM(order_items.quantity * products.cost_price) AS product_profit
                FROM ecom_bronze.order_items AS order_items
                JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
                WHERE products.cost_price IS NOT NULL
                GROUP BY order_items.product_id, products.product_name
              columns_used:
                - order_items.product_id
                - order_items.line_total
                - order_items.quantity
                - products.product_name
                - products.cost_price
      
      - name: product_margin_pct
        business_name: Product Margin Percentage
        description: >-
          Product margin percentage calculated as (product profit / product revenue) * 100.
          This metric represents the profitability margin for each product and is used for
          pricing strategy and product mix optimization.
        return_type: DECIMAL
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  order_items.product_id,
                  products.product_name,
                  CASE
                    WHEN SUM(order_items.line_total) = 0 THEN 0
                    ELSE (
                      SUM(order_items.line_total) - SUM(order_items.quantity * products.cost_price)
                    ) / SUM(order_items.line_total) * 100
                  END AS product_margin_pct
                FROM ecom_bronze.order_items AS order_items
                JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
                WHERE products.cost_price IS NOT NULL
                GROUP BY order_items.product_id, products.product_name
              columns_used:
                - order_items.product_id
                - order_items.line_total
                - order_items.quantity
                - products.product_name
                - products.cost_price
      
      - name: revenue_by_customer_segment
        business_name: Revenue By Customer Segment
        description: >-
          Total revenue by customer segment. This metric provides segment-level revenue analysis
          and is used for customer segmentation strategy and targeted marketing effectiveness.
        return_type: DECIMAL
        result_grain: one row per customer segment
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  customers.customer_segment,
                  SUM(orders.total_amount) AS revenue
                FROM ecom_bronze.orders AS orders
                JOIN ecom_bronze.customers AS customers
                  ON orders.customer_id = customers.customer_id
                GROUP BY customers.customer_segment
              columns_used:
                - orders.total_amount
                - customers.customer_segment
      
      - name: revenue_by_sales_channel
        business_name: Revenue By Sales Channel
        description: >-
          Total revenue by sales channel. This metric provides channel-level revenue analysis
          and is used for omnichannel strategy and channel performance evaluation.
        return_type: DECIMAL
        result_grain: one row per sales channel
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  orders.sales_channel,
                  SUM(orders.total_amount) AS revenue
                FROM ecom_bronze.orders AS orders
                GROUP BY orders.sales_channel
              columns_used:
                - orders.sales_channel
                - orders.total_amount
      
      - name: revenue_by_order_status
        business_name: Revenue By Order Status
        description: >-
          Total revenue by order status. This metric provides status-level revenue analysis
          and is used for order fulfillment tracking and operational performance monitoring.
        return_type: DECIMAL
        result_grain: one row per order status
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  orders.order_status,
                  SUM(orders.total_amount) AS revenue
                FROM ecom_bronze.orders AS orders
                GROUP BY orders.order_status
              columns_used:
                - orders.order_status
                - orders.total_amount
      
      - name: payment_count
        business_name: Payment Count
        description: >-
          Total number of payment transactions. This represents the count of all payment
          records and is used for payment processing volume analysis.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(payments.payment_id) AS payment_count
                FROM ecom_bronze.payments AS payments
              columns_used:
                - payments.payment_id
      
      - name: total_payment_amount
        business_name: Total Payment Amount
        description: >-
          Total payment amount across all payment transactions. This represents the sum of
          all payment values and is used for payment reconciliation and financial analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(payments.amount) AS total_payment_amount
                FROM ecom_bronze.payments AS payments
              columns_used:
                - payments.amount
      
      - name: payment_amount_by_method
        business_name: Payment Amount By Method
        description: >-
          Total payment amount by payment method. This metric provides payment-method-level
          analysis and is used for payment method preference and gateway performance evaluation.
        return_type: DECIMAL
        result_grain: one row per payment method
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  payments.payment_method,
                  SUM(payments.amount) AS payment_amount
                FROM ecom_bronze.payments AS payments
                GROUP BY payments.payment_method
              columns_used:
                - payments.payment_method
                - payments.amount
      
      - name: payment_count_by_status
        business_name: Payment Count By Status
        description: >-
          Number of payments by payment status. This metric provides payment-status-level
          analysis and is used for payment processing success rate and failure analysis.
        return_type: BIGINT
        result_grain: one row per payment status
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  payments.payment_status,
                  COUNT(payments.payment_id) AS payment_count
                FROM ecom_bronze.payments AS payments
                GROUP BY payments.payment_status
              columns_used:
                - payments.payment_status
                - payments.payment_id
      
      - name: shipment_count
        business_name: Shipment Count
        description: >-
          Total number of shipments. This represents the count of all shipment records
          and is used for logistics volume analysis.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(shipments.shipment_id) AS shipment_count
                FROM ecom_bronze.shipments AS shipments
              columns_used:
                - shipments.shipment_id
      
      - name: shipment_count_by_status
        business_name: Shipment Count By Status
        description: >-
          Number of shipments by shipment status. This metric provides shipment-status-level
          analysis and is used for logistics performance tracking and delivery monitoring.
        return_type: BIGINT
        result_grain: one row per shipment status
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  shipments.shipment_status,
                  COUNT(shipments.shipment_id) AS shipment_count
                FROM ecom_bronze.shipments AS shipments
                GROUP BY shipments.shipment_status
              columns_used:
                - shipments.shipment_status
                - shipments.shipment_id
      
      - name: shipment_count_by_carrier
        business_name: Shipment Count By Carrier
        description: >-
          Number of shipments by carrier. This metric provides carrier-level volume analysis
          and is used for carrier performance evaluation and logistics optimization.
        return_type: BIGINT
        result_grain: one row per carrier
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  shipments.carrier,
                  COUNT(shipments.shipment_id) AS shipment_count
                FROM ecom_bronze.shipments AS shipments
                GROUP BY shipments.carrier
              columns_used:
                - shipments.carrier
                - shipments.shipment_id
      
      - name: average_delivery_time_days
        business_name: Average Delivery Time Days
        description: >-
          Average delivery time in days calculated as the difference between delivered_at and shipped_at.
          This metric represents the average time from shipment dispatch to delivery and is used for
          logistics performance analysis. Only includes shipments with both shipped_at and delivered_at timestamps.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(DATEDIFF(day, shipments.shipped_at, shipments.delivered_at)) AS average_delivery_time_days
                FROM ecom_bronze.shipments AS shipments
                WHERE shipments.shipped_at IS NOT NULL
                  AND shipments.delivered_at IS NOT NULL
              columns_used:
                - shipments.shipped_at
                - shipments.delivered_at
      
      - name: monthly_revenue
        business_name: Monthly Revenue
        description: >-
          Total revenue by month calculated from order_date. This time-series metric provides
          monthly revenue trending and is used for revenue forecasting and seasonality analysis.
        return_type: DECIMAL
        result_grain: one row per month
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  DATE_TRUNC('month', orders.order_date) AS order_month,
                  SUM(orders.total_amount) AS monthly_revenue
                FROM ecom_bronze.orders AS orders
                GROUP BY DATE_TRUNC('month', orders.order_date)
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.total_amount
      
      - name: monthly_order_count
        business_name: Monthly Order Count
        description: >-
          Number of orders by month calculated from order_date. This time-series metric provides
          monthly order volume trending and is used for demand forecasting and capacity planning.
        return_type: BIGINT
        result_grain: one row per month
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  DATE_TRUNC('month', orders.order_date) AS order_month,
                  COUNT(orders.order_id) AS monthly_order_count
                FROM ecom_bronze.orders AS orders
                GROUP BY DATE_TRUNC('month', orders.order_date)
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.order_id
      
      - name: revenue_growth_mom
        business_name: Revenue Growth Month-over-Month
        description: >-
          Month-over-month revenue growth calculated as the percentage change from the previous month.
          This time-series metric uses LAG window function to compare current month revenue with
          prior month revenue and is used for growth trend analysis.
        return_type: DECIMAL
        result_grain: one row per month
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                WITH monthly_revenue AS (
                  SELECT
                    DATE_TRUNC('month', orders.order_date) AS order_month,
                    SUM(orders.total_amount) AS revenue
                  FROM ecom_bronze.orders AS orders
                  GROUP BY DATE_TRUNC('month', orders.order_date)
                )
                SELECT
                  order_month,
                  revenue,
                  LAG(revenue) OVER (ORDER BY order_month) AS prior_month_revenue,
                  CASE
                    WHEN LAG(revenue) OVER (ORDER BY order_month) = 0 THEN NULL
                    WHEN LAG(revenue) OVER (ORDER BY order_month) IS NULL THEN NULL
                    ELSE (revenue - LAG(revenue) OVER (ORDER BY order_month)) 
                         / LAG(revenue) OVER (ORDER BY order_month) * 100
                  END AS revenue_growth_mom_pct
                FROM monthly_revenue
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.total_amount
      
      - name: running_total_revenue
        business_name: Running Total Revenue
        description: >-
          Running total of revenue over time calculated using cumulative sum window function.
          This time-series metric provides cumulative revenue tracking and is used for
          year-to-date and cumulative performance analysis.
        return_type: DECIMAL
        result_grain: one row per order date
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  DATE(orders.order_date) AS order_date,
                  SUM(orders.total_amount) AS daily_revenue,
                  SUM(SUM(orders.total_amount)) OVER (ORDER BY DATE(orders.order_date)) AS running_total_revenue
                FROM ecom_bronze.orders AS orders
                GROUP BY DATE(orders.order_date)
                ORDER BY order_date
              columns_used:
                - orders.order_date
                - orders.total_amount
      
      - name: product_revenue_rank
        business_name: Product Revenue Rank
        description: >-
          Ranking of products by revenue using DENSE_RANK window function. This metric provides
          product performance ranking and is used for top product identification and product
          portfolio analysis.
        return_type: BIGINT
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                WITH product_revenue AS (
                  SELECT
                    order_items.product_id,
                    products.product_name,
                    SUM(order_items.line_total) AS revenue
                  FROM ecom_bronze.order_items AS order_items
                  JOIN ecom_bronze.products AS products
                    ON order_items.product_id = products.product_id
                  GROUP BY order_items.product_id, products.product_name
                )
                SELECT
                  product_id,
                  product_name,
                  revenue,
                  DENSE_RANK() OVER (ORDER BY revenue DESC) AS revenue_rank
                FROM product_revenue
                ORDER BY revenue_rank
              columns_used:
                - order_items.product_id
                - order_items.line_total
                - products.product_name
      
      - name: customer_revenue_rank
        business_name: Customer Revenue Rank
        description: >-
          Ranking of customers by total revenue using DENSE_RANK window function. This metric
          provides customer value ranking and is used for top customer identification and
          customer segmentation.
        return_type: BIGINT
        result_grain: one row per customer
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                WITH customer_revenue AS (
                  SELECT
                    orders.customer_id,
                    customers.customer_code,
                    SUM(orders.total_amount) AS revenue
                  FROM ecom_bronze.orders AS orders
                  JOIN ecom_bronze.customers AS customers
                    ON orders.customer_id = customers.customer_id
                  GROUP BY orders.customer_id, customers.customer_code
                )
                SELECT
                  customer_id,
                  customer_code,
                  revenue,
                  DENSE_RANK() OVER (ORDER BY revenue DESC) AS revenue_rank
                FROM customer_revenue
                ORDER BY revenue_rank
              columns_used:
                - orders.customer_id
                - orders.total_amount
                - customers.customer_code
      
      - name: category_revenue
        business_name: Category Revenue
        description: >-
          Total revenue by product category. This metric provides category-level revenue analysis
          and is used for category performance evaluation and product mix optimization.
        return_type: DECIMAL
        result_grain: one row per category
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  product_categories.category_id,
                  product_categories.category_name,
                  SUM(order_items.line_total) AS category_revenue
                FROM ecom_bronze.order_items AS order_items
                JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
                JOIN ecom_bronze.product_categories AS product_categories
                  ON products.category_id = product_categories.category_id
                GROUP BY product_categories.category_id, product_categories.category_name
              columns_used:
                - order_items.line_total
                - products.product_id
                - products.category_id
                - product_categories.category_id
                - product_categories.category_name
      
      - name: total_inventory_value
        business_name: Total Inventory Value
        description: >-
          Total inventory value calculated as sum of (stock_quantity * unit_price) across all products.
          This metric represents the total value of current inventory at selling price and is used
          for inventory valuation and working capital analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(products.stock_quantity * products.unit_price) AS total_inventory_value
                FROM ecom_bronze.products AS products
                WHERE products.is_active = true
              columns_used:
                - products.stock_quantity
                - products.unit_price
                - products.is_active
      
      - name: discount_rate_pct
        business_name: Discount Rate Percentage
        description: >-
          Overall discount rate calculated as (total discount amount / gross revenue) * 100.
          This metric represents the average discount percentage applied across all orders
          and is used for pricing strategy and promotional effectiveness analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN SUM(orders.subtotal) = 0 THEN 0
                    ELSE SUM(orders.discount_amount) / SUM(orders.subtotal) * 100
                  END AS discount_rate_pct
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.discount_amount
                - orders.subtotal