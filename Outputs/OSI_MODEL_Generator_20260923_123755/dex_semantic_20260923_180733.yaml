        result_grain: one row per store
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                  store.store_id,
                  store.name AS store_name,
                  COUNT(shipment.shipment_id) AS shipments_by_store
                FROM ecom_bronze.shipment AS shipment
                INNER JOIN ecom_bronze.store AS store
                  ON shipment.store_id = store.store_id
                GROUP BY store.store_id, store.name
              columns_used:
                - shipment.shipment_id
                - shipment.store_id
                - store.store_id
                - store.name

      - name: customers_by_loyalty_tier
        business_name: Customers by Loyalty Tier
        description: >-
          Customer count grouped by loyalty tier. Represents customer segmentation distribution. 
          Result grain: one row per loyalty tier.
        return_type: integer
        result_grain: one row per loyalty tier
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                  customer.loyalty_tier,
                  COUNT(customer.customer_id) AS customers_by_loyalty_tier
                FROM ecom_bronze.customer AS customer
                GROUP BY customer.loyalty_tier
              columns_used:
                - customer.customer_id
                - customer.loyalty_tier

      - name: monthly_order_revenue
        business_name: Monthly Order Revenue
        description: >-
          Total order revenue grouped by month. Represents monthly revenue trend. 
          Measured in currency units (USD). Result grain: one row per month.
        return_type: currency_usd
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                  DATE_TRUNC('month', order_tbl.timestamp) AS order_month,
                  SUM(order_tbl.total) AS monthly_order_revenue
                FROM ecom_bronze.order_tbl AS order_tbl
                GROUP BY DATE_TRUNC('month', order_tbl.timestamp)
                ORDER BY order_month
              columns_used:
                - order_tbl.timestamp
                - order_tbl.total

      - name: monthly_order_count
        business_name: Monthly Order Count
        description: >-
          Order count grouped by month. Represents monthly order volume trend. 
          Result grain: one row per month.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                  DATE_TRUNC('month', order_tbl.timestamp) AS order_month,
                  COUNT(order_tbl.order_id) AS monthly_order_count
                FROM ecom_bronze.order_tbl AS order_tbl
                GROUP BY DATE_TRUNC('month', order_tbl.timestamp)
                ORDER BY order_month
              columns_used:
                - order_tbl.timestamp
                - order_tbl.order_id

      - name: suppliers_by_country
        business_name: Suppliers by Country
        description: >-
          Supplier count grouped by country. Represents supplier geographic distribution. 
          Result grain: one row per country.
        return_type: integer
        result_grain: one row per country
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                  supplier.country,
                  COUNT(supplier.supplier_id) AS suppliers_by_country
                FROM ecom_bronze.supplier AS supplier
                GROUP BY supplier.country
              columns_used:
                - supplier.supplier_id
                - supplier.country

      - name: stores_by_state
        business_name: Stores by State
        description: >-
          Store count grouped by state. Represents store geographic distribution. 
          Result grain: one row per state.
        return_type: integer
        result_grain: one row per state
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                  store.state,
                  COUNT(store.store_id) AS stores_by_state
                FROM ecom_bronze.store AS store
                GROUP BY store.state
              columns_used:
                - store.store_id
                - store.state
