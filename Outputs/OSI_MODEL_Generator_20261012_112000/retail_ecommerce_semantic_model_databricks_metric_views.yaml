# view: shipments_metrics
# target: dex-demo.ecom_bronze.shipments_metrics
# grain: one row per shipment
version: 1.1

source:
  table: dex-demo.ecom_bronze.shipments
  comment: >-
    Shipment tracking metrics for retail e-commerce analytics. One row per shipment.
    Use for delivery performance analysis and carrier tracking. Includes order and customer
    attributes via joins.

joins:
  - alias: orders
    source: dex-demo.ecom_bronze.orders
    on:
      - source.order_id = orders.order_id
    rely:
      at_most_one_match: true
    joins:
      - alias: customers
        source: dex-demo.ecom_bronze.customers
        on:
          - orders.customer_id = customers.customer_id
        rely:
          at_most_one_match: true

dimensions:
  - name: Shipment Identifier
    expr: shipment_id
    display_name: Shipment Identifier
    comment: Unique identifier for a shipment record.

  - name: Order Identifier
    expr: order_id
    display_name: Order Identifier
    comment: References the order associated with the shipment.

  - name: Carrier
    expr: carrier
    display_name: Carrier
    comment: Name of the shipping carrier handling the shipment.
    synonyms:
      - Shipping Carrier
      - Shipper

  - name: Shipment Status
    expr: shipment_status
    display_name: Shipment Status
    comment: Indicates the current delivery status of the shipment.
    synonyms:
      - Status
      - Delivery Status

  - name: Shipped At
    expr: shipped_at
    display_name: Shipped At
    comment: Timestamp when the shipment left the fulfillment location.

  - name: Shipped Month
    expr: DATE_TRUNC('MONTH', shipped_at)
    display_name: Shipped Month
    comment: Month when the shipment was dispatched, derived from shipped_at for monthly analysis.

  - name: Delivered At
    expr: delivered_at
    display_name: Delivered At
    comment: Timestamp when the shipment was delivered to the customer.

  - name: Shipment City
    expr: ship_city
    display_name: Shipment City
    comment: City component of the shipment destination address. PII - restrict access.

  - name: Shipment State
    expr: ship_state
    display_name: Shipment State
    comment: State or province component of the shipment destination address. PII - restrict access.

  - name: Order Date
    expr: orders.order_date
    display_name: Order Date
    comment: Timestamp recording when the order was placed.

  - name: Order Status
    expr: orders.order_status
    display_name: Order Status
    comment: Indicates the current lifecycle status of the order.

  - name: Sales Channel
    expr: orders.sales_channel
    display_name: Sales Channel
    comment: Channel through which the order was placed, such as online or store.

  - name: Customer Identifier
    expr: orders.customer_id
    display_name: Customer Identifier
    comment: References the customer who placed the order.

  - name: Customer Segment
    expr: customers.customer_segment
    display_name: Customer Segment
    comment: Marketing or business segment classification of the customer.

  - name: Customer Country
    expr: customers.country
    display_name: Customer Country
    comment: Country of the customer's primary address.

measures:
  - name: Shipment Count
    display_name: Shipment Count
    expr: COUNT(DISTINCT shipment_id)
    comment: Total number of shipments, calculated as the count of distinct shipment identifiers.
    synonyms:
      - Shipments
      - Number of Shipments
    format:
      type: number
      decimal_places:
        type: exact
        places: 0

  - name: Delivery Time Days
    display_name: Delivery Time Days
    expr: AVG(DATEDIFF(delivered_at, shipped_at)) FILTER (WHERE delivered_at IS NOT NULL AND shipped_at IS NOT NULL)
    comment: >-
      Average delivery time in days, calculated as the average difference between delivered
      timestamp and shipped timestamp for completed shipments.
    synonyms:
      - Avg Delivery Time
      - Delivery Days
    format:
      type: number
      decimal_places:
        type: exact
        places: 2

---
# view: products_metrics
# target: dex-demo.ecom_bronze.products_metrics
# grain: one row per product
version: 1.1

source:
  table: dex-demo.ecom_bronze.products
  comment: >-
    Product catalog metrics for retail e-commerce analytics. One row per product.
    Use for product catalog analysis and inventory. Includes category and parent category
    attributes via joins. Category hierarchy limited to one parent level.

joins:
  - alias: product_categories
    source: dex-demo.ecom_bronze.product_categories
    on:
      - source.category_id = product_categories.category_id
    rely:
      at_most_one_match: true
    joins:
      - alias: parent_category
        source: dex-demo.ecom_bronze.product_categories
        on:
          - product_categories.parent_category_id = parent_category.category_id
        rely:
          at_most_one_match: true

dimensions:
  - name: Product Identifier
    expr: product_id
    display_name: Product Identifier
    comment: Unique identifier for a product.

  - name: Product SKU
    expr: sku
    display_name: Product SKU
    comment: Stock keeping unit code used to uniquely identify the product.

  - name: Product Name
    expr: product_name
    display_name: Product Name
    comment: Descriptive name of the product.

  - name: Category Identifier
    expr: category_id
    display_name: Category Identifier
    comment: References the category under which the product is classified.

  - name: Product Brand
    expr: brand
    display_name: Product Brand
    comment: Brand or manufacturer of the product.
    synonyms:
      - Brand

  - name: Product Currency
    expr: currency
    display_name: Product Currency
    comment: Currency code in which product prices are denominated.

  - name: Product Is Active
    expr: is_active
    display_name: Product Is Active
    comment: Indicates whether the product is currently active for sale.

  - name: Product Created At
    expr: created_at
    display_name: Product Created At
    comment: Timestamp when the product record was initially created.

  - name: Category Name
    expr: product_categories.category_name
    display_name: Category Name
    comment: Descriptive name of the product category.

  - name: Category Is Active
    expr: product_categories.is_active
    display_name: Category Is Active
    comment: Indicates whether the product category is currently active for use.

  - name: Parent Category Name
    expr: parent_category.category_name
    display_name: Parent Category Name
    comment: Descriptive name of the parent product category in the hierarchy.

measures:
  - name: Product Count
    display_name: Product Count
    expr: COUNT(DISTINCT product_id)
    comment: >-
      Total number of products in the catalog, calculated as the count of distinct
      product identifiers.
    synonyms:
      - Products
      - Number of Products
    format:
      type: number
      decimal_places:
        type: exact
        places: 0

  - name: Average Unit Price
    display_name: Average Unit Price
    expr: AVG(unit_price)
    comment: Average standard selling price per unit of the product.
    synonyms:
      - Avg Unit Price
      - Unit Price
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2

  - name: Average Cost Price
    display_name: Average Cost Price
    expr: AVG(cost_price)
    comment: Average internal cost price per unit used for margin calculation.
    synonyms:
      - Avg Cost Price
      - Cost Price
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2

  - name: Total Stock Quantity
    display_name: Total Stock Quantity
    expr: SUM(stock_quantity)
    comment: Total current on-hand inventory quantity across all products.
    synonyms:
      - Stock Quantity
      - Inventory Quantity
    format:
      type: number
      decimal_places:
        type: exact
        places: 0

  - name: Total Inventory Value
    display_name: Total Inventory Value
    expr: SUM(stock_quantity * cost_price)
    comment: >-
      Total inventory value, calculated as the sum of stock quantity multiplied by
      cost price for all products.
    synonyms:
      - Inventory Value
      - Stock Value
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2

---
# view: customers_metrics
# target: dex-demo.ecom_bronze.customers_metrics
# grain: one row per customer
version: 1.1

source:
  table: dex-demo.ecom_bronze.customers
  comment: >-
    Customer master data metrics for retail e-commerce analytics. One row per customer.
    Use for customer-level analysis and customer counts. Filter candidates: is_active, customer_segment.

dimensions:
  - name: Customer Identifier
    expr: customer_id
    display_name: Customer Identifier
    comment: Unique identifier for a retail customer.

  - name: Customer Code
    expr: customer_code
    display_name: Customer Code
    comment: Business-defined code used to uniquely reference the customer.

  - name: Customer Gender
    expr: gender
    display_name: Customer Gender
    comment: Indicates the gender of the customer as provided. PII - restrict access.

  - name: Customer City
    expr: city
    display_name: Customer City
    comment: City of the customer's primary address. PII - restrict access.

  - name: Customer State
    expr: state
    display_name: Customer State
    comment: State or province of the customer's primary address. PII - restrict access.

  - name: Customer Country
    expr: country
    display_name: Customer Country
    comment: Country of the customer's primary address.

  - name: Customer Segment
    expr: customer_segment
    display_name: Customer Segment
    comment: Marketing or business segment classification of the customer.
    synonyms:
      - Segment

  - name: Registration Date
    expr: registration_date
    display_name: Registration Date
    comment: Date when the customer registered with the retail channel.

  - name: Registration Month
    expr: DATE_TRUNC('MONTH', registration_date)
    display_name: Registration Month
    comment: Month when the customer registered, derived from registration_date for monthly analysis.

  - name: Customer Is Active
    expr: is_active
    display_name: Customer Is Active
    comment: Indicates whether the customer account is currently active.

measures:
  - name: Customer Count
    display_name: Customer Count
    expr: COUNT(DISTINCT customer_id)
    comment: >-
      Total number of customers, calculated as the count of distinct customer identifiers.
    synonyms:
      - Customers
      - Number of Customers
      - Total Customers
    format:
      type: number
      decimal_places:
        type: exact
        places: 0

  - name: Active Customer Count
    display_name: Active Customer Count
    expr: COUNT(DISTINCT customer_id) FILTER (WHERE is_active = TRUE)
    comment: >-
      Total number of active customers, calculated as the count of distinct customer
      identifiers where the customer account is currently active.
    synonyms:
      - Active Customers
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
