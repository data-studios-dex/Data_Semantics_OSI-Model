# view: payments_metrics
# target: dex-demo.ecom_bronze.payments_metrics
# grain: one row per payment transaction
version: 1.1

source:
  table: dex-demo.ecom_bronze.payments
  comment: >-
    Payment transaction metrics for retail e-commerce analytics. One row per payment transaction.
    Use for payment method analysis and payment status tracking. Includes order and customer
    attributes via joins.

joins:
  - alias: orders
    source: dex-demo.ecom_bronze.orders
    on:
      - source.order_id = orders.order_id
    rely:
      at_most_one_match: true
    joins:
      - alias: customers
        source: dex-demo.ecom_bronze.customers
        on:
          - orders.customer_id = customers.customer_id
        rely:
          at_most_one_match: true

dimensions:
  - name: Payment Identifier
    expr: payment_id
    display_name: Payment Identifier
    comment: Unique identifier for a payment transaction.

  - name: Order Identifier
    expr: order_id
    display_name: Order Identifier
    comment: References the order to which the payment applies.

  - name: Payment Method
    expr: payment_method
    display_name: Payment Method
    comment: Method used to settle the payment, such as card or PayPal.
    synonyms:
      - Method
      - Pay Method

  - name: Payment Status
    expr: payment_status
    display_name: Payment Status
    comment: Indicates the current processing status of the payment.
    synonyms:
      - Status
      - Payment State

  - name: Payment Currency
    expr: currency
    display_name: Payment Currency
    comment: Currency code in which the payment amount is denominated.

  - name: Payment Gateway
    expr: gateway
    display_name: Payment Gateway
    comment: Name of the payment gateway or processor handling the transaction.
    synonyms:
      - Gateway
      - Processor

  - name: Paid At
    expr: paid_at
    display_name: Paid At
    comment: Timestamp when the payment was captured or confirmed.

  - name: Paid Month
    expr: DATE_TRUNC('MONTH', paid_at)
    display_name: Paid Month
    comment: Month when the payment was captured, derived from paid_at for monthly analysis.

  - name: Order Date
    expr: orders.order_date
    display_name: Order Date
    comment: Timestamp recording when the order was placed.

  - name: Order Status
    expr: orders.order_status
    display_name: Order Status
    comment: Indicates the current lifecycle status of the order.

  - name: Sales Channel
    expr: orders.sales_channel
    display_name: Sales Channel
    comment: Channel through which the order was placed, such as online or store.

  - name: Customer Identifier
    expr: orders.customer_id
    display_name: Customer Identifier
    comment: References the customer who placed the order.

  - name: Customer Segment
    expr: customers.customer_segment
    display_name: Customer Segment
    comment: Marketing or business segment classification of the customer.

  - name: Customer Country
    expr: customers.country
    display_name: Customer Country
    comment: Country of the customer's primary address.

measures:
  - name: Payment Amount
    display_name: Payment Amount
    expr: SUM(amount)
    comment: >-
      Total monetary amount of payment transactions, calculated as the sum of payment amounts.
      Use for payment method and payment status analysis.
    synonyms:
      - Total Payments
      - Payment Total
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2

  - name: Payment Count
    display_name: Payment Count
    expr: COUNT(DISTINCT payment_id)
    comment: Total number of payment transactions, calculated as the count of distinct payment identifiers.
    synonyms:
      - Payments
      - Number of Payments
    format:
      type: number
      decimal_places:
        type: exact
        places: 0

