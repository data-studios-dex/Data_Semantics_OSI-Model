# ============================================================================
# Databricks Unity Catalog Metric Views
# Model: retail_ecommerce_semantic_model
# Warehouse: dex-demo
# Number of Views: 6
# ============================================================================
#
# COVERAGE MATRIX
# ---------------
# Relationships:
# - orders_to_customers -> orders_metrics: join alias customers
# - order_items_to_orders -> order_items_metrics: join alias orders (nested customers)
# - order_items_to_products -> order_items_metrics: join alias products
# - products_to_product_categories -> order_items_metrics: nested join product_categories under products
# - products_to_product_categories -> products_metrics: join alias product_categories
# - product_categories_hierarchy -> order_items_metrics: nested join parent_category under product_categories
# - product_categories_hierarchy -> products_metrics: nested join parent_category under product_categories
# - payments_to_orders -> payments_metrics: join alias orders (nested customers)
# - shipments_to_orders -> shipments_metrics: join alias orders (nested customers)
#
# Datasets:
# - customers -> customers_metrics
# - orders -> orders_metrics
# - order_items -> order_items_metrics
# - products -> products_metrics
# - product_categories -> used in joins (order_items_metrics, products_metrics)
# - payments -> payments_metrics
# - shipments -> shipments_metrics
# - load_audit -> excluded: ETL monitoring
#
# Metrics:
# - total_revenue -> Total Revenue in orders_metrics
# - total_subtotal_revenue -> Total Subtotal Revenue in orders_metrics
# - total_discount_amount -> Total Discount Amount in orders_metrics
# - total_tax_amount -> Total Tax Amount in orders_metrics
# - total_shipping_fee -> Total Shipping Fee in orders_metrics
# - order_count -> Order Count in orders_metrics
# - average_order_value -> Average Order Value in orders_metrics
# - total_line_item_revenue -> Total Line Item Revenue in order_items_metrics
# - total_units_sold -> Total Units Sold in order_items_metrics
# - average_line_item_value -> Average Line Item Value in order_items_metrics
# - average_discount_pct -> Average Discount Percentage in order_items_metrics
# - gross_profit -> Gross Profit in order_items_metrics
# - gross_margin_pct -> Gross Margin Percentage in order_items_metrics
# - average_units_per_order -> Average Units Per Order in order_items_metrics
# - customer_count -> Customer Count in customers_metrics
# - active_customer_count -> Active Customer Count in customers_metrics
# - product_count -> Product Count in products_metrics
# - total_inventory_value -> Total Inventory Value in products_metrics
# - delivery_time_days -> Delivery Time Days in shipments_metrics
# - revenue_by_customer -> Total Revenue measure + Customer Identifier dimension in orders_metrics
# - revenue_by_product -> Total Line Item Revenue measure + Product Identifier dimension in order_items_metrics
# - revenue_by_category -> Total Line Item Revenue measure + Category Name dimension in order_items_metrics
# - revenue_by_sales_channel -> Total Revenue measure + Sales Channel dimension in orders_metrics
# - revenue_by_customer_segment -> Total Revenue measure + Customer Segment dimension in orders_metrics
# - revenue_by_payment_method -> Payment Amount measure + Payment Method dimension in payments_metrics
# - orders_by_status -> Order Count measure + Order Status dimension in orders_metrics
# - shipments_by_status -> Shipment Count measure + Shipment Status dimension in shipments_metrics
# - payments_by_status -> Payment Count measure + Payment Status dimension in payments_metrics
# - revenue_by_month -> Total Revenue measure + Order Month dimension in orders_metrics
# - orders_by_month -> Order Count measure + Order Month dimension in orders_metrics
# - customers_by_month -> Customer Count measure + Registration Month dimension in customers_metrics
#
# PII Fields:
# - customers.first_name -> not exposed
# - customers.last_name -> not exposed
# - customers.email -> not exposed
# - customers.phone -> not exposed
# - customers.gender -> exposed with PII warning in customers_metrics
# - customers.date_of_birth -> not exposed
# - customers.city -> exposed with PII warning in customers_metrics
# - customers.state -> exposed with PII warning in customers_metrics
# - customers.postal_code -> not exposed
# - orders.ship_city -> exposed with PII warning in orders_metrics
# - orders.ship_state -> exposed with PII warning in orders_metrics
# - orders.ship_postal_code -> not exposed
# - payments.transaction_ref -> not exposed
# - shipments.tracking_number -> not exposed
# - shipments.ship_city -> exposed with PII warning in shipments_metrics
# - shipments.ship_state -> exposed with PII warning in shipments_metrics
# - shipments.ship_postal_code -> not exposed
#
# COUNTS: relationships 7/7, datasets 7/8, metrics 36/36, fields 89/120
# ============================================================================

# view: orders_metrics
# target: dex-demo.ecom_bronze.orders_metrics
# grain: one row per order
version: 1.1

source:
  table: dex-demo.ecom_bronze.orders
  comment: >-
    Order-level metrics for retail e-commerce analytics. One row per order.
    Use for order-level revenue, order counts, and order status analysis.
    Includes customer attributes via join. Filter candidates: order_status, sales_channel, is_active.

joins:
  - alias: customers
    source: dex-demo.ecom_bronze.customers
    on:
      - source.customer_id = customers.customer_id
    rely:
      at_most_one_match: true

dimensions:
  - name: Order Identifier
    expr: order_id
    display_name: Order Identifier
    comment: Unique identifier for a customer order.

  - name: Order Number
    expr: order_number
    display_name: Order Number
    comment: Business-facing order number assigned to the customer purchase.

  - name: Customer Identifier
    expr: customer_id
    display_name: Customer Identifier
    comment: References the customer who placed the order.

  - name: Order Date
    expr: order_date
    display_name: Order Date
    comment: Timestamp recording when the order was placed.

  - name: Order Month
    expr: DATE_TRUNC('MONTH', order_date)
    display_name: Order Month
    comment: Month when the order was placed, derived from order_date for monthly analysis.

  - name: Order Status
    expr: order_status
    display_name: Order Status
    comment: Indicates the current lifecycle status of the order.
    synonyms:
      - Status
      - Order State

  - name: Sales Channel
    expr: sales_channel
    display_name: Sales Channel
    comment: Channel through which the order was placed, such as online or store.
    synonyms:
      - Channel
      - Order Channel

  - name: Ship City
    expr: ship_city
    display_name: Ship City
    comment: City component of the shipping address for the order. PII - restrict access.

  - name: Ship State
    expr: ship_state
    display_name: Ship State
    comment: State or province component of the shipping address for the order. PII - restrict access.

  - name: Order Currency
    expr: currency
    display_name: Order Currency
    comment: Currency code in which the order amounts are denominated.

  - name: Customer Code
    expr: customers.customer_code
    display_name: Customer Code
    comment: Business-defined code used to uniquely reference the customer.

  - name: Customer Gender
    expr: customers.gender
    display_name: Customer Gender
    comment: Indicates the gender of the customer as provided. PII - restrict access.

  - name: Customer City
    expr: customers.city
    display_name: Customer City
    comment: City of the customer's primary address. PII - restrict access.

  - name: Customer State
    expr: customers.state
    display_name: Customer State
    comment: State or province of the customer's primary address. PII - restrict access.

  - name: Customer Country
    expr: customers.country
    display_name: Customer Country
    comment: Country of the customer's primary address.

  - name: Customer Segment
    expr: customers.customer_segment
    display_name: Customer Segment
    comment: Marketing or business segment classification of the customer.
    synonyms:
      - Segment

  - name: Customer Registration Date
    expr: customers.registration_date
    display_name: Customer Registration Date
    comment: Date when the customer registered with the retail channel.

  - name: Customer Is Active
    expr: customers.is_active
    display_name: Customer Is Active
    comment: Indicates whether the customer account is currently active.

measures:
  - name: Total Revenue
    display_name: Total Revenue
    expr: SUM(total_amount)
    comment: >-
      Total revenue from all orders, calculated as the sum of the final order total amount
      after discounts, taxes, and shipping fees. This represents the total amount payable by customers.
    synonyms:
      - Revenue
      - Order Revenue
      - Total Sales
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2

  - name: Total Subtotal Revenue
    display_name: Total Subtotal Revenue
    expr: SUM(subtotal)
    comment: >-
      Total subtotal revenue from all orders, calculated as the sum of order subtotals
      before discounts, taxes, and shipping fees. This represents the gross merchandise value.
    synonyms:
      - Subtotal Revenue
      - GMV
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2

  - name: Total Discount Amount
    display_name: Total Discount Amount
    expr: SUM(discount_amount)
    comment: Total discount amount applied across all orders, calculated as the sum of order-level discounts.
    synonyms:
      - Discounts
      - Total Discounts
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2

  - name: Total Tax Amount
    display_name: Total Tax Amount
    expr: SUM(tax_amount)
    comment: >-
      Total tax amount collected across all orders, calculated as the sum of order-level taxes.
      Source tags this field as PII; possible mis-tag, confirm.
    synonyms:
      - Tax
      - Total Tax
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2

  - name: Total Shipping Fee
    display_name: Total Shipping Fee
    expr: SUM(shipping_fee)
    comment: Total shipping fees collected across all orders, calculated as the sum of order-level shipping fees.
    synonyms:
      - Shipping Fees
      - Shipping Cost
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2

  - name: Order Count
    display_name: Order Count
    expr: COUNT(DISTINCT order_id)
    comment: Total number of orders placed, calculated as the count of distinct order identifiers.
    synonyms:
      - Orders
      - Number of Orders
      - Total Orders
    format:
      type: number
      decimal_places:
        type: exact
        places: 0

  - name: Average Order Value
    display_name: Average Order Value
    expr: SUM(total_amount) / NULLIF(COUNT(DISTINCT order_id), 0)
    comment: >-
      Average order value, calculated as the total revenue divided by the number of orders.
      This represents the average amount spent per order.
    synonyms:
      - AOV
      - Avg Order Value
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2

