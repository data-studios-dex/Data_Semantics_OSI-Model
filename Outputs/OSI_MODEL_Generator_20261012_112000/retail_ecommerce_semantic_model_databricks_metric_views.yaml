# view: order_items_metrics
# target: dex-demo.ecom_bronze.order_items_metrics
# grain: one row per order line item
version: 1.1

source:
  table: dex-demo.ecom_bronze.order_items
  comment: >-
    Order line item metrics for retail e-commerce analytics. One row per order line item.
    Use for product-level analysis within orders and line-item revenue. Includes product,
    category, and customer attributes via joins. Category hierarchy limited to one parent level.

joins:
  - alias: orders
    source: dex-demo.ecom_bronze.orders
    on:
      - source.order_id = orders.order_id
    rely:
      at_most_one_match: true
    joins:
      - alias: customers
        source: dex-demo.ecom_bronze.customers
        on:
          - orders.customer_id = customers.customer_id
        rely:
          at_most_one_match: true

  - alias: products
    source: dex-demo.ecom_bronze.products
    on:
      - source.product_id = products.product_id
    rely:
      at_most_one_match: true
    joins:
      - alias: product_categories
        source: dex-demo.ecom_bronze.product_categories
        on:
          - products.category_id = product_categories.category_id
        rely:
          at_most_one_match: true
        joins:
          - alias: parent_category
            source: dex-demo.ecom_bronze.product_categories
            on:
              - product_categories.parent_category_id = parent_category.category_id
            rely:
              at_most_one_match: true

dimensions:
  - name: Order Item Identifier
    expr: order_item_id
    display_name: Order Item Identifier
    comment: Unique identifier for an order line item.

  - name: Order Identifier
    expr: order_id
    display_name: Order Identifier
    comment: References the related customer order record.

  - name: Line Number
    expr: line_number
    display_name: Line Number
    comment: Sequential line number of the item within the order.

  - name: Product Identifier
    expr: product_id
    display_name: Product Identifier
    comment: References the product associated with the order line.

  - name: Order Date
    expr: orders.order_date
    display_name: Order Date
    comment: Timestamp recording when the order was placed.

  - name: Order Month
    expr: DATE_TRUNC('MONTH', orders.order_date)
    display_name: Order Month
    comment: Month when the order was placed, derived from order_date for monthly analysis.

  - name: Order Status
    expr: orders.order_status
    display_name: Order Status
    comment: Indicates the current lifecycle status of the order.

  - name: Sales Channel
    expr: orders.sales_channel
    display_name: Sales Channel
    comment: Channel through which the order was placed, such as online or store.

  - name: Order Currency
    expr: orders.currency
    display_name: Order Currency
    comment: Currency code in which the order amounts are denominated.

  - name: Customer Identifier
    expr: orders.customer_id
    display_name: Customer Identifier
    comment: References the customer who placed the order.

  - name: Customer Segment
    expr: customers.customer_segment
    display_name: Customer Segment
    comment: Marketing or business segment classification of the customer.

  - name: Customer Country
    expr: customers.country
    display_name: Customer Country
    comment: Country of the customer's primary address.

  - name: Product SKU
    expr: products.sku
    display_name: Product SKU
    comment: Stock keeping unit code used to uniquely identify the product.

  - name: Product Name
    expr: products.product_name
    display_name: Product Name
    comment: Descriptive name of the product.

  - name: Product Brand
    expr: products.brand
    display_name: Product Brand
    comment: Brand or manufacturer of the product.
    synonyms:
      - Brand

  - name: Product Currency
    expr: products.currency
    display_name: Product Currency
    comment: Currency code in which product prices are denominated.

  - name: Product Is Active
    expr: products.is_active
    display_name: Product Is Active
    comment: Indicates whether the product is currently active for sale.

  - name: Product Created At
    expr: products.created_at
    display_name: Product Created At
    comment: Timestamp when the product record was initially created.

  - name: Category Identifier
    expr: products.category_id
    display_name: Category Identifier
    comment: References the category under which the product is classified.

  - name: Category Name
    expr: product_categories.category_name
    display_name: Category Name
    comment: Descriptive name of the product category.

  - name: Category Is Active
    expr: product_categories.is_active
    display_name: Category Is Active
    comment: Indicates whether the product category is currently active for use.

  - name: Parent Category Name
    expr: parent_category.category_name
    display_name: Parent Category Name
    comment: Descriptive name of the parent product category in the hierarchy.

measures:
  - name: Total Line Item Revenue
    display_name: Total Line Item Revenue
    expr: SUM(line_total)
    comment: >-
      Total revenue from all order line items, calculated as the sum of line totals
      after line-level discounts. This metric is used for product-level revenue analysis.
    synonyms:
      - Line Item Revenue
      - Product Revenue
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2

  - name: Total Units Sold
    display_name: Total Units Sold
    expr: SUM(quantity)
    comment: >-
      Total number of product units sold across all order line items,
      calculated as the sum of quantities.
    synonyms:
      - Units Sold
      - Quantity Sold
      - Total Quantity
    format:
      type: number
      decimal_places:
        type: exact
        places: 0

  - name: Average Unit Price
    display_name: Average Unit Price
    expr: AVG(unit_price)
    comment: Average selling price per unit of the product at the time of order.
    synonyms:
      - Avg Unit Price
      - Unit Price
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2

  - name: Average Discount Percentage
    display_name: Average Discount Percentage
    expr: AVG(discount_pct)
    comment: >-
      Average discount percentage applied to order line items, calculated as the average
      of line-level discount percentages. Value is already multiplied by 100.
    synonyms:
      - Avg Discount
      - Discount Pct
    format:
      type: number
      decimal_places:
        type: exact
        places: 2

  - name: Average Line Item Value
    display_name: Average Line Item Value
    expr: SUM(line_total) / NULLIF(COUNT(order_item_id), 0)
    comment: >-
      Average line item value, calculated as the total line item revenue
      divided by the number of line items.
    synonyms:
      - Avg Line Value
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2

  - name: Gross Profit
    display_name: Gross Profit
    expr: SUM(line_total) - SUM(quantity * products.cost_price)
    comment: >-
      Gross profit calculated as the difference between line item revenue and line item cost.
      Line item cost is derived as quantity multiplied by product cost price.
    synonyms:
      - Profit
      - Margin
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2

  - name: Gross Margin Percentage
    display_name: Gross Margin Percentage
    expr: (SUM(line_total) - SUM(quantity * products.cost_price)) / NULLIF(SUM(line_total), 0) * 100
    comment: >-
      Gross margin percentage calculated as gross profit divided by line item revenue,
      expressed as a percentage. This represents the percentage of revenue retained after
      deducting cost of goods sold. Value is already multiplied by 100.
    synonyms:
      - Margin Pct
      - Gross Margin
    format:
      type: number
      decimal_places:
        type: exact
        places: 2

  - name: Average Units Per Order
    display_name: Average Units Per Order
    expr: SUM(quantity) / NULLIF(COUNT(DISTINCT order_id), 0)
    comment: >-
      Average number of units per order, calculated as the total units sold
      divided by the number of orders.
    synonyms:
      - Avg Units Per Order
      - Units Per Order
    format:
      type: number
      decimal_places:
        type: exact
        places: 2

