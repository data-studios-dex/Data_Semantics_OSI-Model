      - name: monthly_order_revenue
        business_name: Monthly Order Revenue
        description: >-
          Total order revenue aggregated by month. Represents the total revenue generated each month. 
          Use for monthly revenue trending and time-series revenue analysis.
        return_type: decimal
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('month', order_tbl.timestamp) AS order_month,
                    SUM(order_tbl.total) AS monthly_order_revenue
                FROM ecom_bronze.order_tbl AS order_tbl
                GROUP BY DATE_TRUNC('month', order_tbl.timestamp)
                ORDER BY order_month
              columns_used:
                - order_tbl.timestamp
                - order_tbl.total
      
      - name: monthly_order_count
        business_name: Monthly Order Count
        description: >-
          Count of orders aggregated by month. Represents the number of orders placed each month. 
          Use for monthly order volume trending and time-series order analysis.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('month', order_tbl.timestamp) AS order_month,
                    COUNT(order_tbl.order_id) AS monthly_order_count
                FROM ecom_bronze.order_tbl AS order_tbl
                GROUP BY DATE_TRUNC('month', order_tbl.timestamp)
                ORDER BY order_month
              columns_used:
                - order_tbl.timestamp
                - order_tbl.order_id
      
      - name: monthly_customer_acquisition
        business_name: Monthly Customer Acquisition
        description: >-
          Count of customers who joined aggregated by month. Represents the number of new customers acquired each month. 
          Use for customer acquisition trending and customer growth analysis.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('month', customer.join_date) AS join_month,
                    COUNT(customer.customer_id) AS monthly_customer_acquisition
                FROM ecom_bronze.customer AS customer
                GROUP BY DATE_TRUNC('month', customer.join_date)
                ORDER BY join_month
              columns_used:
                - customer.join_date
                - customer.customer_id