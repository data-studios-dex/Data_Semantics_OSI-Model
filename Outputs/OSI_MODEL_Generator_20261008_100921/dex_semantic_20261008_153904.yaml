      - name: delivery_time_days
        business_name: Delivery Time Days
        description: >-
          Average delivery time in days from dispatch to arrival.
          Calculated as the average difference between shipment.arrival_date and shipment.dispatch_date.
          Represents typical shipment duration.
          Only includes shipments where both dispatch and arrival dates are available.
        return_type: NUMERIC
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(shipment.arrival_date - shipment.dispatch_date) AS delivery_time_days
                FROM ecom_bronze.shipment AS shipment
                WHERE shipment.dispatch_date IS NOT NULL
                  AND shipment.arrival_date IS NOT NULL
              columns_used:
                - shipment.arrival_date
                - shipment.dispatch_date
      
      - name: revenue_by_customer
        business_name: Revenue by Customer
        description: >-
          Total order revenue grouped by customer.
          Calculated as the sum of order_tbl.total for each customer.
          Represents customer-level order revenue (not cumulative spend).
        return_type: NUMERIC
        result_grain: one row per customer
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    order_tbl.customer_id,
                    customer.name AS customer_name,
                    SUM(order_tbl.total) AS revenue_by_customer
                FROM ecom_bronze.order_tbl AS order_tbl
                INNER JOIN ecom_bronze.customer AS customer
                    ON order_tbl.customer_id = customer.customer_id
                GROUP BY order_tbl.customer_id, customer.name
              columns_used:
                - order_tbl.customer_id
                - order_tbl.total
                - customer.customer_id
                - customer.name
      
      - name: revenue_by_store
        business_name: Revenue by Store
        description: >-
          Total order revenue grouped by store.
          Calculated as the sum of order_tbl.total for each store.
          Represents store-level sales performance.
        return_type: NUMERIC
        result_grain: one row per store
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    order_tbl.store_id,
                    store.name AS store_name,
                    SUM(order_tbl.total) AS revenue_by_store
                FROM ecom_bronze.order_tbl AS order_tbl
                INNER JOIN ecom_bronze.store AS store
                    ON order_tbl.store_id = store.store_id
                GROUP BY order_tbl.store_id, store.name
              columns_used:
                - order_tbl.store_id
                - order_tbl.total
                - store.store_id
                - store.name
      
