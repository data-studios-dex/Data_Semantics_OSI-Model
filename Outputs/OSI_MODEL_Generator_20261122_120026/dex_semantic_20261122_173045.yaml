version: "1.0"

semantic_model:
  - name: ecom_retail_semantic_model
    description: >-
      Comprehensive semantic model for the e-commerce retail data domain.
      This model represents customer transactions, product catalog, order fulfillment,
      and shipment tracking across the retail business.
      
      The model supports analytical queries across customers, orders, order items,
      products, product categories, and shipments with complete relationship mapping
      and business metric calculations.
    
    ai_context:
      instructions: >-
        ## Dataset Grain Reference
        
        - **customers**: One row per customer. Primary key: customer_id.
        
        - **orders**: One row per order. Primary key: order_id. Each order belongs to one customer.
        
        - **order_items**: One row per order line item. Primary key: order_item_id. Multiple items per order.
        
        - **products**: One row per product. Primary key: product_id.
        
        - **product_categories**: One row per product category. Primary key: category_id. Supports hierarchical parent-child relationships.
        
        - **shipments**: One row per shipment. Primary key: shipment_id. Each shipment is associated with one order.
        
        
        ## Join Guidance
        
        ### Standard Relationships
        
        - Join **orders** to **customers** using orders.customer_id = customers.customer_id (many-to-one).
        
        - Join **order_items** to **orders** using order_items.order_id = orders.order_id (many-to-one).
        
        - Join **order_items** to **products** using order_items.product_id = products.product_id (many-to-one).
        
        - Join **products** to **product_categories** using products.category_id = product_categories.category_id (many-to-one).
        
        - Join **shipments** to **orders** using shipments.order_id = orders.order_id (many-to-one).
        
        
        ### Hierarchical Relationship
        
        - **product_categories** contains a self-referencing hierarchy via parent_category_id.
        
        - To traverse the category hierarchy, join product_categories.parent_category_id = product_categories.category_id.
        
        - Use recursive queries when analyzing multi-level category hierarchies.
        
        
        ## Double-Counting Prevention
        
        ### Order-Level vs Order-Item-Level Measures
        
        **Critical**: orders and order_items have different grains.
        
        - **Order-level measures** (from orders table):
          - orders.subtotal
          - orders.discount_amount
          - orders.tax_amount
          - orders.shipping_fee
          - orders.total_amount
        
        - **Order-item-level measures** (from order_items table):
          - order_items.quantity
          - order_items.unit_price
          - order_items.discount_pct
          - order_items.line_total
        
        **Do NOT sum order-level measures after joining orders to order_items.**
        
        When analyzing by product or order line:
        - Use order_items.line_total for line-level revenue.
        - Use order_items.quantity for units sold.
        
        When analyzing by order or customer:
        - Use orders.total_amount for order-level revenue.
        - Use orders.subtotal, orders.discount_amount, orders.tax_amount, orders.shipping_fee.
        
        **Example incorrect query**:
        ```
        SELECT SUM(orders.total_amount)
        FROM orders
        JOIN order_items ON orders.order_id = order_items.order_id
        -- This will duplicate order totals for each order item
        ```
        
        **Example correct query for order-level revenue**:
        ```
        SELECT SUM(orders.total_amount)
        FROM orders
        ```
        
        **Example correct query for product-level revenue**:
        ```
        SELECT 
          products.product_name,
          SUM(order_items.line_total) AS product_revenue
        FROM order_items
        JOIN products ON order_items.product_id = products.product_id
        GROUP BY products.product_name
        ```
        
        
        ## Time Analysis Guidance
        
        ### Date Fields
        
        - **customers.registration_date**: Use for customer acquisition analysis and cohort analysis.
        
        - **orders.order_date**: Use for order transaction time-series analysis, revenue trends, and sales performance.
        
        - **shipments.shipped_at**: Use for shipment dispatch analysis.
        
        - **shipments.delivered_at**: Use for delivery performance analysis and delivery time calculations.
        
        - **products.created_at**: Use for product launch analysis.
        
        
        ### Time-Based Metrics
        
        When calculating period-over-period metrics, month-over-month growth, or year-over-year comparisons:
        - Use orders.order_date for revenue and sales metrics.
        - Use customers.registration_date for customer acquisition metrics.
        - Use shipments.delivered_at for delivery performance metrics.
        
        
        ## Metric Interpretation
        
        ### Revenue Metrics
        
        - **Total Revenue**: Sum of orders.total_amount across all orders.
        
        - **Total Line Revenue**: Sum of order_items.line_total across all order items.
        
        - **Subtotal**: Sum of orders.subtotal (before discounts and taxes).
        
        - **Discount Amount**: Sum of orders.discount_amount.
        
        - **Tax Amount**: Sum of orders.tax_amount.
        
        - **Shipping Fee**: Sum of orders.shipping_fee.
        
        
        ### Product Metrics
        
        - **Units Sold**: Sum of order_items.quantity.
        
        - **Average Selling Price**: Calculated as SUM(order_items.line_total) / SUM(order_items.quantity).
        
        - **Product Margin**: Calculated as (unit_price - cost_price) / unit_price when analyzing product profitability.
        
        
        ### Customer Metrics
        
        - **Customer Count**: COUNT(DISTINCT customers.customer_id).
        
        - **Active Customer Count**: COUNT(DISTINCT customers.customer_id) WHERE customers.is_active = true.
        
        - **Orders per Customer**: COUNT(orders.order_id) / COUNT(DISTINCT customers.customer_id).
        
        - **Average Order Value**: SUM(orders.total_amount) / COUNT(orders.order_id).
        
        
        ### Shipment Metrics
        
        - **Delivery Time**: Calculate as delivered_at - shipped_at when both timestamps are available.
        
        - **On-Time Delivery**: Requires business rule definition for expected delivery time.
        
        
        ## Hierarchical Analysis
        
        ### Product Category Hierarchy
        
        The product_categories table supports parent-child relationships via parent_category_id.
        
        To analyze revenue by category hierarchy:
        1. Join products to product_categories.
        2. Use recursive CTE to traverse parent categories.
        3. Aggregate metrics at each hierarchy level.
        
        Example recursive query pattern:
        ```
        WITH RECURSIVE category_hierarchy AS (
          SELECT 
            category_id,
            category_name,
            parent_category_id,
            0 AS level
          FROM product_categories
          WHERE parent_category_id IS NULL
          
          UNION ALL
          
          SELECT 
            pc.category_id,
            pc.category_name,
            pc.parent_category_id,
            ch.level + 1
          FROM product_categories pc
          JOIN category_hierarchy ch ON pc.parent_category_id = ch.category_id
        )
        SELECT * FROM category_hierarchy
        ```
        
        
        ## Query Restrictions
        
        - PII fields are redacted in sample values. Ensure proper data governance when querying PII fields.
        
        - Currency is stored as 'USD' for orders and products. Multi-currency analysis requires currency conversion logic.
        
        - Shipment delivery times can only be calculated when both shipped_at and delivered_at are populated.
        
        - Product stock_quantity represents current inventory and may not reflect historical stock levels.
        
        - Order status and shipment status are categorical fields that should be filtered appropriately for analytical queries.

    datasets:
      - name: customers
        business_name: Customers
        description: >-
          Contains customer master data including customer identifiers, contact information,
          demographic attributes, address details, customer segmentation, and registration information.
          
          Grain: One row per customer.
          
          Primary key: customer_id.
        source: ecom_bronze.customers
        primary_key:
          - customer_id
        fields:
          - name: customer_id
            business_name: Customer Identifier
            description: Unique identifier for a customer.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: customer_code
            business_name: Customer Code
            description: Business-defined code used to reference the customer.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
              - UNIQUE
          
          - name: first_name
            business_name: First Name
            description: Given name of the customer.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: last_name
            business_name: Last Name
            description: Family name of the customer.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: email
            business_name: Email
            description: Email address used to contact the customer.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
              - UNIQUE
          
          - name: phone
            business_name: Phone
            description: Telephone number used to contact the customer.
            sql_type: STRING(255)
          
          - name: gender
            business_name: Gender
            description: Indicates the gender of the customer.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: date_of_birth
            business_name: Date Of Birth
            description: Date of birth of the customer.
            sql_type: DATE
          
          - name: city
            business_name: City
            description: City component of the customer's address.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: state
            business_name: State
            description: State or province component of the customer's address.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: country
            business_name: Country
            description: Country component of the customer's address.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: postal_code
            business_name: Postal Code
            description: Postal or ZIP code of the customer's address.
            sql_type: STRING(255)
          
          - name: customer_segment
            business_name: Customer Segment
            description: Marketing or business segment classification for the customer.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: registration_date
            business_name: Registration Date
            description: Date when the customer registered with the retail platform.
            sql_type: DATE
            dimension:
              is_time: true
          
          - name: is_active
            business_name: Is Active
            description: Indicates whether the customer account is currently active.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: Identifier of the source system from which the customer record was loaded.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the data load batch that included this customer record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp when the customer record was ingested into the data platform.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: orders
        business_name: Orders
        description: >-
          Contains order transaction data including order identifiers, customer references,
          order timing, order status, sales channel, shipping address, and financial amounts
          (subtotal, discounts, taxes, shipping fees, and total amount).
          
          Grain: One row per order.
          
          Primary key: order_id.
        source: ecom_bronze.orders
        primary_key:
          - order_id
        fields:
          - name: order_id
            business_name: Order Identifier
            description: Unique identifier for a customer order.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: order_number
            business_name: Order Number
            description: Business-facing order number used to track the customer order.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
              - UNIQUE
          
          - name: customer_id
            business_name: Customer Reference
            description: References the customer who placed the order.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: order_date
            business_name: Order Date
            description: Timestamp recording when the order was placed.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: order_status
            business_name: Order Status
            description: Indicates the current processing status of the order.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: sales_channel
            business_name: Sales Channel
            description: Channel through which the order was placed, such as online or in-store.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: ship_city
            business_name: Ship City
            description: City component of the shipping address for the order.
            sql_type: STRING(255)
          
          - name: ship_state
            business_name: Ship State
            description: State or province component of the shipping address for the order.
            sql_type: STRING(255)
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: Postal or ZIP code of the shipping address for the order.
            sql_type: STRING(255)
          
          - name: subtotal
            business_name: Subtotal
            description: Monetary amount representing the total of item prices before discounts and taxes.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: discount_amount
            business_name: Discount Amount
            description: Total monetary discount applied to the order.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: tax_amount
            business_name: Tax Amount
            description: Total tax charged on the order.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: shipping_fee
            business_name: Shipping Fee
            description: Monetary amount representing the shipping charges for the order.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: total_amount
            business_name: Total Amount
            description: Monetary amount representing the total payable value of the order.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: currency
            business_name: Currency
            description: Currency code used for the financial amounts on the order.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: Identifier of the source system from which the order record was loaded.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the data load batch that included this order record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp when the order record was ingested into the data platform.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: order_items
        business_name: Order Items
        description: >-
          Contains order line item data representing individual products within orders.
          Includes line-level details such as product reference, quantity, unit price,
          discount percentage, and line total.
          
          Grain: One row per order line item.
          
          Primary key: order_item_id.
        source: ecom_bronze.order_items
        primary_key:
          - order_item_id
        fields:
          - name: order_item_id
            business_name: Order Item Identifier
            description: Unique identifier for an order line item.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: order_id
            business_name: Order Reference
            description: References the related order record.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: line_number
            business_name: Line Number
            description: Sequential line number of the item within the order.
            sql_type: INT
            constraints:
              - NOT NULL
          
          - name: product_id
            business_name: Product Reference
            description: References the product associated with this order line item.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: quantity
            business_name: Quantity
            description: Number of product units ordered on this line item.
            sql_type: INT
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: unit_price
            business_name: Unit Price
            description: Selling price per unit of the product on this order line.
            sql_type: DECIMAL(12,2)
            constraints:
              - NOT NULL
          
          - name: discount_pct
            business_name: Discount Percentage
            description: Percentage discount applied to this order line item.
            sql_type: DECIMAL(5,2)
            constraints:
              - NOT NULL
          
          - name: line_total
            business_name: Line Total
            description: Monetary amount representing the total value of the order line after discounts.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: _source_system
            business_name: Source System
            description: Identifier of the source system from which the order item record was loaded.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the data load batch that included this order item record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp when the order item record was ingested into the data platform.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: products
        business_name: Products
        description: >-
          Contains product master data including product identifiers, SKU, product name,
          category reference, brand, description, pricing (unit price and cost price),
          currency, current stock quantity, active status, and creation timestamp.
          
          Grain: One row per product.
          
          Primary key: product_id.
        source: ecom_bronze.products
        primary_key:
          - product_id
        fields:
          - name: product_id
            business_name: Product Identifier
            description: Unique identifier for a product.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: sku
            business_name: SKU
            description: Stock keeping unit code used to uniquely identify the product in inventory.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
              - UNIQUE
          
          - name: product_name
            business_name: Product Name
            description: Name of the product as presented to customers.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: category_id
            business_name: Category Reference
            description: References the product category to which the product belongs.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: brand
            business_name: Brand
            description: Brand or manufacturer associated with the product.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: description
            business_name: Description
            description: Marketing description or details about the product.
            sql_type: STRING(255)
          
          - name: unit_price
            business_name: Unit Price
            description: Standard selling price per unit of the product.
            sql_type: DECIMAL(12,2)
            constraints:
              - NOT NULL
          
          - name: cost_price
            business_name: Cost Price
            description: Cost price per unit of the product used for margin calculations.
            sql_type: DECIMAL(12,2)
          
          - name: currency
            business_name: Currency
            description: Currency code used for the product prices.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: stock_quantity
            business_name: Stock Quantity
            description: Current quantity of the product available in stock.
            sql_type: INT
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: is_active
            business_name: Is Active
            description: Indicates whether the product is currently active for sale.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: created_at
            business_name: Created At
            description: Timestamp when the product record was created in the source system.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: _source_system
            business_name: Source System
            description: Identifier of the source system from which the product record was loaded.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the data load batch that included this product record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp when the product record was ingested into the data platform.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: product_categories
        business_name: Product Categories
        description: >-
          Contains product category master data including category identifiers, category name,
          parent category reference for hierarchical relationships, description, and active status.
          
          Grain: One row per product category.
          
          Primary key: category_id.
          
          Supports hierarchical parent-child relationships via parent_category_id.
        source: ecom_bronze.product_categories
        primary_key:
          - category_id
        fields:
          - name: category_id
            business_name: Category Identifier
            description: Unique identifier for a product category.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: category_name
            business_name: Category Name
            description: Name of the product category.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: parent_category_id
            business_name: Parent Category Reference
            description: References the parent category in the category hierarchy.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
          
          - name: description
            business_name: Description
            description: Text description of the product category.
            sql_type: STRING(255)
          
          - name: is_active
            business_name: Is Active
            description: Indicates whether the product category is currently active.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: Identifier of the source system from which the product category record was loaded.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the data load batch that included this product category record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp when the product category record was ingested into the data platform.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: shipments
        business_name: Shipments
        description: >-
          Contains shipment data including shipment identifiers, order reference, carrier information,
          tracking number, shipment status, shipment and delivery timestamps, and destination address.
          
          Grain: One row per shipment.
          
          Primary key: shipment_id.
        source: ecom_bronze.shipments
        primary_key:
          - shipment_id
        fields:
          - name: shipment_id
            business_name: Shipment Identifier
            description: Unique identifier for a shipment.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: order_id
            business_name: Order Reference
            description: References the order associated with the shipment.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: carrier
            business_name: Carrier
            description: Name of the shipping carrier handling the shipment.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: tracking_number
            business_name: Tracking Number
            description: Tracking number assigned by the carrier for shipment tracking.
            sql_type: STRING(255)
          
          - name: shipment_status
            business_name: Shipment Status
            description: Indicates the current status of the shipment.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: shipped_at
            business_name: Shipped At
            description: Timestamp when the shipment was dispatched.
            sql_type: TIMESTAMP(29,9)
            dimension:
              is_time: true
          
          - name: delivered_at
            business_name: Delivered At
            description: Timestamp when the shipment was delivered to the customer.
            sql_type: TIMESTAMP(29,9)
            dimension:
              is_time: true
          
          - name: ship_city
            business_name: Ship City
            description: City component of the shipment destination address.
            sql_type: STRING(255)
          
          - name: ship_state
            business_name: Ship State
            description: State or province component of the shipment destination address.
            sql_type: STRING(255)
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: Postal or ZIP code of the shipment destination address.
            sql_type: STRING(255)
          
          - name: _source_system
            business_name: Source System
            description: Identifier of the source system from which the shipment record was loaded.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the data load batch that included this shipment record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp when the shipment record was ingested into the data platform.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

    relationships:
      - name: orders_to_customers
        left_dataset: orders
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Each order belongs to exactly one customer.
          Join orders.customer_id to customers.customer_id to retrieve customer attributes
          for order analysis.
      
      - name: order_items_to_orders
        left_dataset: order_items
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Each order item belongs to exactly one order.
          An order can contain multiple order items.
          Join order_items.order_id to orders.order_id to retrieve order-level attributes
          such as order_date, customer_id, order_status, and order-level financial amounts.
          
          IMPORTANT: Do not sum order-level measures (orders.total_amount, orders.subtotal,
          orders.discount_amount, orders.tax_amount, orders.shipping_fee) after joining
          to order_items, as this will cause duplication.
      
      - name: order_items_to_products
        left_dataset: order_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        resolution: >-
          Each order item references exactly one product.
          Join order_items.product_id to products.product_id to retrieve product attributes
          such as product_name, brand, category_id, unit_price, and cost_price for
          product-level sales analysis.
      
      - name: products_to_product_categories
        left_dataset: products
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Each product belongs to exactly one product category.
          Join products.category_id to product_categories.category_id to retrieve
          category attributes such as category_name and parent_category_id for
          category-level analysis.
      
      - name: shipments_to_orders
        left_dataset: shipments
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Each shipment is associated with exactly one order.
          Join shipments.order_id to orders.order_id to retrieve order attributes
          for shipment and delivery analysis.
      
      - name: product_categories_hierarchy
        left_dataset: product_categories
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - parent_category_id
          right:
            - category_id
        join_type: recursive
        resolution: >-
          Product categories support hierarchical parent-child relationships.
          A category can reference a parent category via parent_category_id.
          
          To traverse the category hierarchy, join product_categories.parent_category_id
          to product_categories.category_id.
          
          Use recursive common table expressions (CTEs) to analyze multi-level category
          hierarchies and aggregate metrics across category levels.
          
          Example recursive query:
          
          WITH RECURSIVE category_hierarchy AS (
            SELECT 
              category_id,
              category_name,
              parent_category_id,
              0 AS level
            FROM product_categories
            WHERE parent_category_id IS NULL
            
            UNION ALL
            
            SELECT 
              pc.category_id,
              pc.category_name,
              pc.parent_category_id,
              ch.level + 1
            FROM product_categories pc
            JOIN category_hierarchy ch ON pc.parent_category_id = ch.category_id
          )
          SELECT * FROM category_hierarchy;

    metrics:
      - name: total_revenue
        business_name: Total Revenue
        description: >-
          Total revenue across all orders, calculated as the sum of the total_amount
          field from the orders table. This represents the complete payable value
          including subtotal, taxes, shipping fees, and after discounts.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.total_amount) AS total_revenue
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.total_amount
      
      - name: total_subtotal
        business_name: Total Subtotal
        description: >-
          Total subtotal across all orders before discounts and taxes, calculated as
          the sum of the subtotal field from the orders table.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.subtotal) AS total_subtotal
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.subtotal
      
      - name: total_discount_amount
        business_name: Total Discount Amount
        description: >-
          Total discount amount applied across all orders, calculated as the sum
          of the discount_amount field from the orders table.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.discount_amount) AS total_discount_amount
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.discount_amount
      
      - name: total_tax_amount
        business_name: Total Tax Amount
        description: >-
          Total tax amount charged across all orders, calculated as the sum
          of the tax_amount field from the orders table.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.tax_amount) AS total_tax_amount
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.tax_amount
      
      - name: total_shipping_fee
        business_name: Total Shipping Fee
        description: >-
          Total shipping fees charged across all orders, calculated as the sum
          of the shipping_fee field from the orders table.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.shipping_fee) AS total_shipping_fee
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.shipping_fee
      
      - name: total_line_revenue
        business_name: Total Line Revenue
        description: >-
          Total revenue at the order line item level, calculated as the sum of
          line_total from the order_items table. This represents revenue after
          line-level discounts and is used for product-level revenue analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.line_total) AS total_line_revenue
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.line_total
      
      - name: order_count
        business_name: Order Count
        description: >-
          Total number of orders, calculated as the count of order_id from the orders table.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(orders.order_id) AS order_count
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.order_id
      
      - name: customer_count
        business_name: Customer Count
        description: >-
          Total number of unique customers, calculated as the distinct count of
          customer_id from the customers table.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT customers.customer_id) AS customer_count
                FROM ecom_bronze.customers AS customers
              columns_used:
                - customers.customer_id
      
      - name: active_customer_count
        business_name: Active Customer Count
        description: >-
          Total number of active customers, calculated as the distinct count of
          customer_id from the customers table where is_active is true.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT customers.customer_id) AS active_customer_count
                FROM ecom_bronze.customers AS customers
                WHERE customers.is_active = true
              columns_used:
                - customers.customer_id
                - customers.is_active
      
      - name: product_count
        business_name: Product Count
        description: >-
          Total number of unique products, calculated as the distinct count of
          product_id from the products table.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT products.product_id) AS product_count
                FROM ecom_bronze.products AS products
              columns_used:
                - products.product_id
      
      - name: units_sold
        business_name: Units Sold
        description: >-
          Total number of product units sold across all order items, calculated as
          the sum of quantity from the order_items table.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.quantity) AS units_sold
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.quantity
      
      - name: average_order_value
        business_name: Average Order Value
        description: >-
          Average revenue per order, calculated as the total revenue divided by
          the number of orders. This metric uses orders.total_amount and orders.order_id.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(orders.order_id) = 0 THEN 0
                    ELSE SUM(orders.total_amount) / COUNT(orders.order_id)
                  END AS average_order_value
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.total_amount
                - orders.order_id
      
      - name: average_selling_price
        business_name: Average Selling Price
        description: >-
          Average selling price per unit across all order items, calculated as
          total line revenue divided by total units sold. This uses order_items.line_total
          and order_items.quantity.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN SUM(order_items.quantity) = 0 THEN 0
                    ELSE SUM(order_items.line_total) / SUM(order_items.quantity)
                  END AS average_selling_price
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.line_total
                - order_items.quantity
      
      - name: average_discount_percentage
        business_name: Average Discount Percentage
        description: >-
          Average discount percentage applied across all order items, calculated as
          the average of discount_pct from the order_items table.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(order_items.discount_pct) AS average_discount_percentage
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.discount_pct
      
      - name: orders_per_customer
        business_name: Orders Per Customer
        description: >-
          Average number of orders per customer, calculated as the total number of
          orders divided by the number of distinct customers who placed orders.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT orders.customer_id) = 0 THEN 0
                    ELSE CAST(COUNT(orders.order_id) AS DOUBLE) / COUNT(DISTINCT orders.customer_id)
                  END AS orders_per_customer
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.order_id
                - orders.customer_id
      
      - name: revenue_per_customer
        business_name: Revenue Per Customer
        description: >-
          Average revenue per customer, calculated as total revenue divided by
          the number of distinct customers who placed orders.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT orders.customer_id) = 0 THEN 0
                    ELSE SUM(orders.total_amount) / COUNT(DISTINCT orders.customer_id)
                  END AS revenue_per_customer
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.total_amount
                - orders.customer_id
      
      - name: shipment_count
        business_name: Shipment Count
        description: >-
          Total number of shipments, calculated as the count of shipment_id from
          the shipments table.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(shipments.shipment_id) AS shipment_count
                FROM ecom_bronze.shipments AS shipments
              columns_used:
                - shipments.shipment_id
      
      - name: delivered_shipment_count
        business_name: Delivered Shipment Count
        description: >-
          Total number of shipments that have been delivered, calculated as the count
          of shipment_id from the shipments table where delivered_at is not null.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(shipments.shipment_id) AS delivered_shipment_count
                FROM ecom_bronze.shipments AS shipments
                WHERE shipments.delivered_at IS NOT NULL
              columns_used:
                - shipments.shipment_id
                - shipments.delivered_at
      
      - name: product_revenue_by_product
        business_name: Product Revenue By Product
        description: >-
          Revenue by product, calculated as the sum of line_total from order_items
          grouped by product. This metric is used for product-level revenue analysis.
        return_type: decimal
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  products.product_id,
                  products.product_name,
                  SUM(order_items.line_total) AS product_revenue
                FROM ecom_bronze.order_items AS order_items
                JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
                GROUP BY products.product_id, products.product_name
              columns_used:
                - order_items.line_total
                - order_items.product_id
                - products.product_id
                - products.product_name
      
      - name: revenue_by_customer_segment
        business_name: Revenue By Customer Segment
        description: >-
          Revenue by customer segment, calculated as the sum of total_amount from
          orders grouped by customer segment. This metric is used for customer
          segmentation analysis.
        return_type: decimal
        result_grain: one row per customer segment
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  customers.customer_segment,
                  SUM(orders.total_amount) AS segment_revenue
                FROM ecom_bronze.orders AS orders
                JOIN ecom_bronze.customers AS customers
                  ON orders.customer_id = customers.customer_id
                GROUP BY customers.customer_segment
              columns_used:
                - orders.total_amount
                - orders.customer_id
                - customers.customer_id
                - customers.customer_segment
      
      - name: revenue_by_sales_channel
        business_name: Revenue By Sales Channel
        description: >-
          Revenue by sales channel, calculated as the sum of total_amount from
          orders grouped by sales channel.
        return_type: decimal
        result_grain: one row per sales channel
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  orders.sales_channel,
                  SUM(orders.total_amount) AS channel_revenue
                FROM ecom_bronze.orders AS orders
                GROUP BY orders.sales_channel
              columns_used:
                - orders.total_amount
                - orders.sales_channel
      
      - name: monthly_revenue
        business_name: Monthly Revenue
        description: >-
          Revenue by month, calculated as the sum of total_amount from orders
          grouped by month. This metric uses the order_date field for time-series analysis.
        return_type: decimal
        result_grain: one row per month
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  DATE_TRUNC('MONTH', orders.order_date) AS order_month,
                  SUM(orders.total_amount) AS monthly_revenue
                FROM ecom_bronze.orders AS orders
                GROUP BY DATE_TRUNC('MONTH', orders.order_date)
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.total_amount
      
      - name: revenue_by_product_category
        business_name: Revenue By Product Category
        description: >-
          Revenue by product category, calculated as the sum of line_total from
          order_items joined to products and product_categories, grouped by category.
        return_type: decimal
        result_grain: one row per product category
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  product_categories.category_id,
                  product_categories.category_name,
                  SUM(order_items.line_total) AS category_revenue
                FROM ecom_bronze.order_items AS order_items
                JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
                JOIN ecom_bronze.product_categories AS product_categories
                  ON products.category_id = product_categories.category_id
                GROUP BY product_categories.category_id, product_categories.category_name
              columns_used:
                - order_items.line_total
                - order_items.product_id
                - products.product_id
                - products.category_id
                - product_categories.category_id
                - product_categories.category_name
      
      - name: units_sold_by_product
        business_name: Units Sold By Product
        description: >-
          Units sold by product, calculated as the sum of quantity from order_items
          grouped by product.
        return_type: integer
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  products.product_id,
                  products.product_name,
                  SUM(order_items.quantity) AS units_sold
                FROM ecom_bronze.order_items AS order_items
                JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
                GROUP BY products.product_id, products.product_name
              columns_used:
                - order_items.quantity
                - order_items.product_id
                - products.product_id
                - products.product_name
      
      - name: revenue_by_brand
        business_name: Revenue By Brand
        description: >-
          Revenue by product brand, calculated as the sum of line_total from
          order_items joined to products, grouped by brand.
        return_type: decimal
        result_grain: one row per brand
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  products.brand,
                  SUM(order_items.line_total) AS brand_revenue
                FROM ecom_bronze.order_items AS order_items
                JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
                GROUP BY products.brand
              columns_used:
                - order_items.line_total
                - order_items.product_id
                - products.product_id
                - products.brand
      
      - name: orders_by_status
        business_name: Orders By Status
        description: >-
          Number of orders by order status, calculated as the count of order_id
          from orders grouped by order_status.
        return_type: integer
        result_grain: one row per order status
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  orders.order_status,
                  COUNT(orders.order_id) AS order_count
                FROM ecom_bronze.orders AS orders
                GROUP BY orders.order_status
              columns_used:
                - orders.order_id
                - orders.order_status
      
      - name: shipments_by_carrier
        business_name: Shipments By Carrier
        description: >-
          Number of shipments by carrier, calculated as the count of shipment_id
          from shipments grouped by carrier.
        return_type: integer
        result_grain: one row per carrier
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  shipments.carrier,
                  COUNT(shipments.shipment_id) AS shipment_count
                FROM ecom_bronze.shipments AS shipments
                GROUP BY shipments.carrier
              columns_used:
                - shipments.shipment_id
                - shipments.carrier
      
      - name: shipments_by_status
        business_name: Shipments By Status
        description: >-
          Number of shipments by shipment status, calculated as the count of
          shipment_id from shipments grouped by shipment_status.
        return_type: integer
        result_grain: one row per shipment status
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  shipments.shipment_status,
                  COUNT(shipments.shipment_id) AS shipment_count
                FROM ecom_bronze.shipments AS shipments
                GROUP BY shipments.shipment_status
              columns_used:
                - shipments.shipment_id
                - shipments.shipment_status