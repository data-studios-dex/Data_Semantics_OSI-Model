version: "1.0"

semantic_model:
  - name: ecom_retail_semantic_model
    description: >-
      Comprehensive semantic model for the e-commerce retail data domain.
      This model represents customer transactions, orders, products, payments, and shipments
      across the retail business. The model supports analytical queries for revenue analysis,
      customer behavior, product performance, order fulfillment, and payment processing.
      
      The source data originates from multiple operational systems including CRM, Order Management,
      Product Catalog, Payment Systems, and Logistics Systems, integrated into the ecom_bronze schema.

    ai_context:
      instructions: >-
        ## Dataset Grain Reference
        
        **CUSTOMERS**: One row per customer. Use for customer-level analysis and customer counts.
        
        **ORDERS**: One row per order. Use orders.total_amount for order-level revenue.
        Use orders.subtotal, orders.discount_amount, orders.tax_amount, and orders.shipping_fee
        for order-level financial components.
        
        **ORDER_ITEMS**: One row per order line item. Multiple line items can exist per order.
        Use order_items.line_total for line-level revenue. Use order_items.quantity for units sold.
        
        **PRODUCTS**: One row per product. Use for product-level analysis and product attributes.
        
        **PRODUCT_CATEGORIES**: One row per product category. Contains hierarchical self-reference
        via parent_category_id. Use for category analysis and category hierarchy traversal.
        
        **PAYMENTS**: One row per payment transaction. Use for payment analysis. Multiple payments
        may exist per order in some scenarios.
        
        **SHIPMENTS**: One row per shipment. Use for fulfillment and delivery analysis.
        
        
        ## Double-Counting Prevention
        
        **Critical**: Do NOT sum orders.total_amount after joining orders to order_items.
        This will duplicate order-level revenue by the number of line items.
        
        - For **order-level revenue**: Use orders.total_amount directly from the orders dataset.
        - For **product-level revenue**: Use order_items.line_total from the order_items dataset.
        - For **line-item counts**: Count order_items records.
        - For **order counts**: Count orders records or use COUNT(DISTINCT orders.order_id).
        
        When analyzing revenue by product, join orders → order_items → products and aggregate
        order_items.line_total, NOT orders.total_amount.
        
        When analyzing order-level metrics (average order value, order count), use the orders
        dataset directly without joining to order_items unless filtering by product attributes.
        
        
        ## Metric Selection Guidance
        
        **Revenue Analysis**:
        - Total order revenue: SUM(orders.total_amount)
        - Product revenue: SUM(order_items.line_total)
        - Average order value: SUM(orders.total_amount) / COUNT(DISTINCT orders.order_id)
        - Revenue per customer: SUM(orders.total_amount) / COUNT(DISTINCT customers.customer_id)
        
        **Cost and Profit Analysis**:
        - Product cost is available at products.cost_price per unit
        - Line-level cost: order_items.quantity * products.cost_price
        - Gross profit: revenue - cost
        - Gross margin %: (revenue - cost) / revenue * 100
        
        **Discount Analysis**:
        - Order-level discount: orders.discount_amount
        - Line-level discount: order_items.quantity * order_items.unit_price * (order_items.discount_pct / 100)
        - Average discount %: total discount / total revenue * 100
        
        **Quantity Analysis**:
        - Units sold: SUM(order_items.quantity)
        - Average units per order: SUM(order_items.quantity) / COUNT(DISTINCT orders.order_id)
        
        
        ## Join Guidance
        
        **Standard Relationships**:
        - orders → customers: orders.customer_id = customers.customer_id (many-to-one)
        - order_items → orders: order_items.order_id = orders.order_id (many-to-one)
        - order_items → products: order_items.product_id = products.product_id (many-to-one)
        - products → product_categories: products.category_id = product_categories.category_id (many-to-one)
        - payments → orders: payments.order_id = orders.order_id (many-to-one, but may be one-to-many in some cases)
        - shipments → orders: shipments.order_id = orders.order_id (many-to-one, but may be one-to-many in some cases)
        
        **Hierarchical Relationship**:
        - product_categories → product_categories (parent): 
          product_categories.parent_category_id = parent_category.category_id
          This is a self-referencing hierarchy for category rollups.
          Use recursive queries to traverse the full category hierarchy.
        
        
        ## Time Analysis
        
        **Order Date (orders.order_date)**: Use for order placement analysis, revenue trends,
        period-over-period comparisons, and time-series analysis. This is the primary business date
        for revenue recognition.
        
        **Registration Date (customers.registration_date)**: Use for customer acquisition analysis,
        cohort analysis, and new customer trends.
        
        **Shipped Date (shipments.shipped_at)**: Use for fulfillment analysis and shipping performance.
        
        **Delivered Date (shipments.delivered_at)**: Use for delivery performance and customer
        satisfaction analysis.
        
        **Paid Date (payments.paid_at)**: Use for payment timing and cash flow analysis.
        
        **Created Date (products.created_at)**: Use for product lifecycle and catalog growth analysis.
        
        For revenue time-series analysis, always use orders.order_date as the primary date dimension.
        
        
        ## Hierarchical Queries
        
        **Product Category Hierarchy**:
        The product_categories table contains a self-referencing hierarchy via parent_category_id.
        To traverse the full hierarchy, use recursive CTEs:
        
        ```sql
        WITH RECURSIVE category_hierarchy AS (
          SELECT 
            category_id,
            category_name,
            parent_category_id,
            1 AS level,
            category_name AS path
          FROM ecom_bronze.product_categories
          WHERE parent_category_id IS NULL
          
          UNION ALL
          
          SELECT 
            c.category_id,
            c.category_name,
            c.parent_category_id,
            ch.level + 1,
            ch.path || ' > ' || c.category_name
          FROM ecom_bronze.product_categories c
          INNER JOIN category_hierarchy ch 
            ON c.parent_category_id = ch.category_id
        )
        SELECT * FROM category_hierarchy;
        ```
        
        Use this pattern for category rollup analysis and hierarchical aggregations.
        
        
        ## Query Restrictions and Considerations
        
        **Active Records**: Many tables contain is_active flags. Consider filtering by is_active = true
        for current/active analysis unless historical analysis is required.
        
        **Currency**: All monetary amounts are in the currency specified in the currency column.
        The sample data shows USD. For multi-currency analysis, ensure proper currency conversion.
        
        **PII Fields**: Several fields are marked as PII (first_name, last_name, email, phone,
        date_of_birth, transaction_ref). Apply appropriate data masking and access controls.
        
        **Order Status**: Filter by orders.order_status for specific order states (e.g., 'Shipped',
        'Completed', 'Cancelled'). Revenue analysis should typically exclude cancelled orders.
        
        **Payment Status**: Filter by payments.payment_status = 'Completed' for confirmed revenue.
        
        **Shipment Status**: Use shipments.shipment_status to analyze fulfillment pipeline and
        identify delayed or in-transit shipments.
        
        **NULL Handling**: Some optional fields may contain NULL values (e.g., parent_category_id
        for top-level categories, delivered_at for shipments not yet delivered). Use appropriate
        NULL handling in calculations and filters.

    datasets:
      - name: customers
        business_name: Customers
        description: >-
          Contains customer master data representing individual customers in the e-commerce system.
          Each row represents one unique customer identified by customer_id.
          Includes customer demographics, contact information, location, segmentation, and account status.
          Source system: CRM_PROD.
        source: ecom_bronze.customers
        primary_key:
          - customer_id
        fields:
          - name: customer_id
            business_name: Customer Identifier
            description: >-
              Unique identifier for a customer. Primary key.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL

          - name: customer_code
            business_name: Customer Code
            description: >-
              Business reference code assigned to the customer.
            sql_type: STRING(255)
            constraints:
              - NOT NULL

          - name: first_name
            business_name: First Name
            description: >-
              First name of the customer. PII field.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
              - PII

          - name: last_name
            business_name: Last Name
            description: >-
              Last name of the customer. PII field.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
              - PII

          - name: email
            business_name: Email
            description: >-
              Email address of the customer. PII field.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
              - PII

          - name: phone
            business_name: Phone
            description: >-
              Phone number of the customer. PII field.
            sql_type: STRING(255)
            constraints:
              - PII

          - name: gender
            business_name: Gender
            description: >-
              Gender of the customer. Analytical dimension for demographic analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true

          - name: date_of_birth
            business_name: Date Of Birth
            description: >-
              Date of birth of the customer. PII field. Can be used to derive age for demographic analysis.
            sql_type: DATE
            constraints:
              - PII

          - name: city
            business_name: City
            description: >-
              City where the customer resides. Geographic dimension.
            sql_type: STRING(255)
            dimension:
              is_categorical: true

          - name: state
            business_name: State
            description: >-
              State or province where the customer resides. Geographic dimension.
            sql_type: STRING(255)
            dimension:
              is_categorical: true

          - name: country
            business_name: Country
            description: >-
              Country where the customer resides. Geographic dimension.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true

          - name: postal_code
            business_name: Postal Code
            description: >-
              Postal or ZIP code of the customer's address.
            sql_type: STRING(255)

          - name: customer_segment
            business_name: Customer Segment
            description: >-
              Indicates the current segment classification of the customer (e.g., Premium, Standard).
              Business dimension for customer segmentation analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true

          - name: registration_date
            business_name: Registration Date
            description: >-
              Date when the customer registered. Time dimension for customer acquisition analysis.
            sql_type: DATE
            dimension:
              is_time: true

          - name: is_active
            business_name: Is Active
            description: >-
              Indicates whether the customer account is currently active.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL

          - name: _source_system
            business_name: Source System
            description: >-
              Name of the source system from which the record originated.
            sql_type: STRING(255)
            constraints:
              - NOT NULL

          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT

          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: orders
        business_name: Orders
        description: >-
          Contains order header data representing customer orders in the e-commerce system.
          Each row represents one unique order identified by order_id.
          Includes order details, customer reference, order status, shipping information,
          and financial totals at the order level.
          Source system: ORDER_MGMT.
          
          Use this dataset for order-level revenue analysis. Do NOT join to order_items and sum
          total_amount as this will cause double-counting.
        source: ecom_bronze.orders
        primary_key:
          - order_id
        fields:
          - name: order_id
            business_name: Order Identifier
            description: >-
              Unique identifier for an order. Primary key.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL

          - name: order_number
            business_name: Order Number
            description: >-
              Business reference number assigned to the order.
            sql_type: STRING(255)
            constraints:
              - NOT NULL

          - name: customer_id
            business_name: Customer ID
            description: >-
              References the related customer record. Foreign key to customers.customer_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL

          - name: order_date
            business_name: Order Date
            description: >-
              Timestamp recording when the order was placed.
              Primary time dimension for revenue and order analysis.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL
            dimension:
              is_time: true

          - name: order_status
            business_name: Order Status
            description: >-
              Indicates the current status of the order (e.g., Shipped, Completed, Cancelled).
              Business dimension for order pipeline analysis.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true

          - name: sales_channel
            business_name: Sales Channel
            description: >-
              Indicates the channel through which the order was placed (e.g., Online, Mobile, Store).
              Business dimension for channel analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true

          - name: ship_city
            business_name: Ship City
            description: >-
              City to which the order is shipped. Geographic dimension.
            sql_type: STRING(255)
            dimension:
              is_categorical: true

          - name: ship_state
            business_name: Ship State
            description: >-
              State or province to which the order is shipped. Geographic dimension.
            sql_type: STRING(255)
            dimension:
              is_categorical: true

          - name: ship_postal_code
            business_name: Ship Postal Code
            description: >-
              Postal or ZIP code to which the order is shipped.
            sql_type: STRING(255)

          - name: subtotal
            business_name: Subtotal
            description: >-
              Monetary amount representing the order subtotal before discounts and taxes.
              Base measure for order value analysis.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM

          - name: discount_amount
            business_name: Discount Amount
            description: >-
              Monetary amount representing the total discount applied to the order.
              Measure for discount analysis.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM

          - name: tax_amount
            business_name: Tax Amount
            description: >-
              Monetary amount representing the tax charged on the order.
              Measure for tax analysis.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM

          - name: shipping_fee
            business_name: Shipping Fee
            description: >-
              Monetary amount representing the shipping cost for the order.
              Measure for shipping cost analysis.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM

          - name: total_amount
            business_name: Total Amount
            description: >-
              Monetary amount representing the final total of the order.
              Primary revenue measure at order grain.
              Formula: subtotal - discount_amount + tax_amount + shipping_fee.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              is_derived: true

          - name: currency
            business_name: Currency
            description: >-
              Currency code for the order amounts (e.g., USD).
            sql_type: STRING(255)
            constraints:
              - NOT NULL

          - name: _source_system
            business_name: Source System
            description: >-
              Name of the source system from which the record originated.
            sql_type: STRING(255)
            constraints:
              - NOT NULL

          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT

          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: order_items
        business_name: Order Items
        description: >-
          Contains order line item data representing individual products within customer orders.
          Each row represents one unique order line item identified by order_item_id.
          Multiple line items can exist per order.
          Includes product reference, quantity, pricing, discounts, and line-level totals.
          Source system: ORDER_MGMT.
          
          Use this dataset for product-level revenue analysis and units sold.
        source: ecom_bronze.order_items
        primary_key:
          - order_item_id
        fields:
          - name: order_item_id
            business_name: Order Item Identifier
            description: >-
              Unique identifier for an order line item. Primary key.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL

          - name: order_id
            business_name: Order ID
            description: >-
              References the related order record. Foreign key to orders.order_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL

          - name: line_number
            business_name: Line Number
            description: >-
              Sequential line number within the order.
            sql_type: INT
            constraints:
              - NOT NULL

          - name: product_id
            business_name: Product ID
            description: >-
              References the related product record. Foreign key to products.product_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL

          - name: quantity
            business_name: Quantity
            description: >-
              Number of units ordered for this line item.
              Primary measure for units sold analysis.
            sql_type: INT
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM

          - name: unit_price
            business_name: Unit Price
            description: >-
              Monetary amount representing the price per unit.
            sql_type: DECIMAL(12,2)
            constraints:
              - NOT NULL

          - name: discount_pct
            business_name: Discount Pct
            description: >-
              Percentage discount applied to the line item.
            sql_type: DECIMAL(5,2)
            constraints:
              - NOT NULL

          - name: line_total
            business_name: Line Total
            description: >-
              Monetary amount representing the total for this line item.
              Primary revenue measure at line-item grain.
              Formula: quantity * unit_price * (1 - discount_pct / 100).
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              is_derived: true

          - name: _source_system
            business_name: Source System
            description: >-
              Name of the source system from which the record originated.
            sql_type: STRING(255)
            constraints:
              - NOT NULL

          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT

          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: products
        business_name: Products
        description: >-
          Contains product master data representing individual products in the e-commerce catalog.
          Each row represents one unique product identified by product_id.
          Includes product details, category reference, brand, pricing, cost, inventory, and status.
          Source system: PRODUCT_CATALOG.
        source: ecom_bronze.products
        primary_key:
          - product_id
        fields:
          - name: product_id
            business_name: Product Identifier
            description: >-
              Unique identifier for a product. Primary key.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL

          - name: sku
            business_name: Sku
            description: >-
              Stock keeping unit code for the product.
            sql_type: STRING(255)
            constraints:
              - NOT NULL

          - name: product_name
            business_name: Product Name
            description: >-
              Name of the product.
            sql_type: STRING(255)
            constraints:
              - NOT NULL

          - name: category_id
            business_name: Category ID
            description: >-
              References the related product category record. Foreign key to product_categories.category_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL

          - name: brand
            business_name: Brand
            description: >-
              Brand name of the product. Business dimension for brand analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true

          - name: description
            business_name: Description
            description: >-
              Detailed description of the product.
            sql_type: STRING(255)

          - name: unit_price
            business_name: Unit Price
            description: >-
              Monetary amount representing the selling price per unit.
            sql_type: DECIMAL(12,2)
            constraints:
              - NOT NULL

          - name: cost_price
            business_name: Cost Price
            description: >-
              Monetary amount representing the cost per unit.
              Used for profit and margin calculations.
            sql_type: DECIMAL(12,2)

          - name: currency
            business_name: Currency
            description: >-
              Currency code for the product prices (e.g., USD).
            sql_type: STRING(255)
            constraints:
              - NOT NULL

          - name: stock_quantity
            business_name: Stock Quantity
            description: >-
              Current inventory quantity available for the product.
              Measure for inventory analysis.
            sql_type: INT
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM

          - name: is_active
            business_name: Is Active
            description: >-
              Indicates whether the product is currently active for sale.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL

          - name: created_at
            business_name: Created At
            description: >-
              Timestamp recording when the product was created in the system.
              Time dimension for product lifecycle analysis.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL
            dimension:
              is_time: true

          - name: _source_system
            business_name: Source System
            description: >-
              Name of the source system from which the record originated.
            sql_type: STRING(255)
            constraints:
              - NOT NULL

          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT

          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: product_categories
        business_name: Product Categories
        description: >-
          Contains product category master data representing the hierarchical category structure.
          Each row represents one unique product category identified by category_id.
          Includes self-referencing parent_category_id for hierarchical category relationships.
          Source system: PRODUCT_CATALOG.
        source: ecom_bronze.product_categories
        primary_key:
          - category_id
        fields:
          - name: category_id
            business_name: Category Identifier
            description: >-
              Unique identifier for a product category. Primary key.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL

          - name: category_name
            business_name: Category Name
            description: >-
              Name of the product category. Business dimension for category analysis.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true

          - name: parent_category_id
            business_name: Parent Category ID
            description: >-
              References the parent category in the hierarchy.
              Self-referencing foreign key to product_categories.category_id.
              NULL for top-level categories.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY

          - name: description
            business_name: Description
            description: >-
              Detailed description of the product category.
            sql_type: STRING(255)

          - name: is_active
            business_name: Is Active
            description: >-
              Indicates whether the category is currently active.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL

          - name: _source_system
            business_name: Source System
            description: >-
              Name of the source system from which the record originated.
            sql_type: STRING(255)
            constraints:
              - NOT NULL

          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT

          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: payments
        business_name: Payments
        description: >-
          Contains payment transaction data representing payments made for customer orders.
          Each row represents one unique payment transaction identified by payment_id.
          Includes order reference, payment method, status, amount, and transaction details.
          Source system: PAYMENT_SYS.
        source: ecom_bronze.payments
        primary_key:
          - payment_id
        fields:
          - name: payment_id
            business_name: Payment Identifier
            description: >-
              Unique identifier for a payment transaction. Primary key.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL

          - name: order_id
            business_name: Order ID
            description: >-
              References the related order record. Foreign key to orders.order_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL

          - name: payment_method
            business_name: Payment Method
            description: >-
              Indicates the method used for payment (e.g., Credit Card, PayPal, Bank Transfer).
              Business dimension for payment method analysis.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true

          - name: payment_status
            business_name: Payment Status
            description: >-
              Indicates the current status of the payment (e.g., Completed, Pending, Failed).
              Business dimension for payment pipeline analysis.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true

          - name: amount
            business_name: Amount
            description: >-
              Monetary amount representing the payment value.
              Measure for payment analysis.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM

          - name: currency
            business_name: Currency
            description: >-
              Currency code for the payment amount (e.g., USD).
            sql_type: STRING(255)
            constraints:
              - NOT NULL

          - name: transaction_ref
            business_name: Transaction Ref
            description: >-
              External reference number for the payment transaction. PII field.
            sql_type: STRING(255)
            constraints:
              - PII

          - name: gateway
            business_name: Gateway
            description: >-
              Name of the payment gateway used to process the transaction (e.g., Stripe, PayPal).
              Business dimension for gateway analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true

          - name: paid_at
            business_name: Paid At
            description: >-
              Timestamp recording when the payment was completed.
              Time dimension for payment timing analysis.
            sql_type: TIMESTAMP(29,9)
            dimension:
              is_time: true

          - name: _source_system
            business_name: Source System
            description: >-
              Name of the source system from which the record originated.
            sql_type: STRING(255)
            constraints:
              - NOT NULL

          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT

          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: shipments
        business_name: Shipments
        description: >-
          Contains shipment data representing the fulfillment and delivery of customer orders.
          Each row represents one unique shipment identified by shipment_id.
          Includes order reference, carrier, tracking, status, timing, and destination details.
          Source system: LOGISTICS_SYS.
        source: ecom_bronze.shipments
        primary_key:
          - shipment_id
        fields:
          - name: shipment_id
            business_name: Shipment Identifier
            description: >-
              Unique identifier for a shipment. Primary key.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL

          - name: order_id
            business_name: Order ID
            description: >-
              References the related order record. Foreign key to orders.order_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL

          - name: carrier
            business_name: Carrier
            description: >-
              Name of the shipping carrier handling the shipment (e.g., FedEx, UPS, USPS).
              Business dimension for carrier analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true

          - name: tracking_number
            business_name: Tracking Number
            description: >-
              Tracking number assigned by the carrier for the shipment.
            sql_type: STRING(255)

          - name: shipment_status
            business_name: Shipment Status
            description: >-
              Indicates the current status of the shipment (e.g., In Transit, Delivered, Delayed).
              Business dimension for shipment pipeline analysis.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true

          - name: shipped_at
            business_name: Shipped At
            description: >-
              Timestamp recording when the shipment was dispatched.
              Time dimension for fulfillment timing analysis.
            sql_type: TIMESTAMP(29,9)
            dimension:
              is_time: true

          - name: delivered_at
            business_name: Delivered At
            description: >-
              Timestamp recording when the shipment was delivered.
              Time dimension for delivery performance analysis.
            sql_type: TIMESTAMP(29,9)
            dimension:
              is_time: true

          - name: ship_city
            business_name: Ship City
            description: >-
              City to which the shipment is being sent. Geographic dimension.
            sql_type: STRING(255)
            dimension:
              is_categorical: true

          - name: ship_state
            business_name: Ship State
            description: >-
              State or province to which the shipment is being sent. Geographic dimension.
            sql_type: STRING(255)
            dimension:
              is_categorical: true

          - name: ship_postal_code
            business_name: Ship Postal Code
            description: >-
              Postal or ZIP code to which the shipment is being sent.
            sql_type: STRING(255)

          - name: _source_system
            business_name: Source System
            description: >-
              Name of the source system from which the record originated.
            sql_type: STRING(255)
            constraints:
              - NOT NULL

          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT

          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

    relationships:
      - name: orders_to_customers
        left_dataset: orders
        right_dataset: customers
        relationship_type: many_to_one
        description: >-
          Each order is placed by one customer. A customer may place multiple orders.
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one

      - name: order_items_to_orders
        left_dataset: order_items
        right_dataset: orders
        relationship_type: many_to_one
        description: >-
          Each order line item belongs to one order. An order may contain multiple line items.
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one

      - name: order_items_to_products
        left_dataset: order_items
        right_dataset: products
        relationship_type: many_to_one
        description: >-
          Each order line item references one product. A product may appear in multiple order line items.
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one

      - name: products_to_product_categories
        left_dataset: products
        right_dataset: product_categories
        relationship_type: many_to_one
        description: >-
          Each product belongs to one product category. A category may contain multiple products.
        join:
          left:
            - category_id
          right:
            - category_id
        join_type: many_to_one

      - name: product_categories_hierarchy
        left_dataset: product_categories
        right_dataset: product_categories
        relationship_type: many_to_one
        description: >-
          Self-referencing hierarchical relationship representing the product category hierarchy.
          Each category may have one parent category. A parent category may have multiple child categories.
          Top-level categories have NULL parent_category_id.
          Use recursive queries to traverse the full category hierarchy for rollup analysis.
        join:
          left:
            - parent_category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          This is a recursive relationship. To traverse the full hierarchy, use a recursive CTE:
          
          WITH RECURSIVE category_hierarchy AS (
            SELECT 
              category_id,
              category_name,
              parent_category_id,
              1 AS level
            FROM ecom_bronze.product_categories
            WHERE parent_category_id IS NULL
            
            UNION ALL
            
            SELECT 
              c.category_id,
              c.category_name,
              c.parent_category_id,
              ch.level + 1
            FROM ecom_bronze.product_categories c
            INNER JOIN category_hierarchy ch 
              ON c.parent_category_id = ch.category_id
          )
          SELECT * FROM category_hierarchy;

      - name: payments_to_orders
        left_dataset: payments
        right_dataset: orders
        relationship_type: many_to_one
        description: >-
          Each payment transaction is associated with one order.
          Typically one payment per order, but multiple payments may exist in some scenarios.
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one

      - name: shipments_to_orders
        left_dataset: shipments
        right_dataset: orders
        relationship_type: many_to_one
        description: >-
          Each shipment is associated with one order.
          Typically one shipment per order, but multiple shipments may exist in some scenarios.
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one

    metrics:
      - name: total_revenue
        business_name: Total Revenue
        description: >-
          Total revenue from all orders, calculated as the sum of order total amounts.
          This represents the final revenue including discounts, taxes, and shipping fees.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.total_amount) AS total_revenue
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.total_amount

      - name: total_order_subtotal
        business_name: Total Order Subtotal
        description: >-
          Total order subtotal before discounts and taxes, calculated as the sum of order subtotals.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.subtotal) AS total_order_subtotal
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.subtotal

      - name: total_discount_amount
        business_name: Total Discount Amount
        description: >-
          Total discount amount applied across all orders, calculated as the sum of order-level discounts.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.discount_amount) AS total_discount_amount
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.discount_amount

      - name: total_tax_amount
        business_name: Total Tax Amount
        description: >-
          Total tax amount charged across all orders, calculated as the sum of order-level taxes.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.tax_amount) AS total_tax_amount
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.tax_amount

      - name: total_shipping_fee
        business_name: Total Shipping Fee
        description: >-
          Total shipping fees charged across all orders, calculated as the sum of order-level shipping fees.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.shipping_fee) AS total_shipping_fee
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.shipping_fee

      - name: order_count
        business_name: Order Count
        description: >-
          Total number of orders, calculated as the count of distinct order records.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(orders.order_id) AS order_count
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.order_id

      - name: average_order_value
        business_name: Average Order Value
        description: >-
          Average revenue per order, calculated as total revenue divided by order count.
          Uses safe division to handle zero order count.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(orders.order_id) = 0 THEN 0
                    ELSE SUM(orders.total_amount) / COUNT(orders.order_id)
                  END AS average_order_value
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.total_amount
                - orders.order_id

      - name: customer_count
        business_name: Customer Count
        description: >-
          Total number of customers, calculated as the count of distinct customer records.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(customers.customer_id) AS customer_count
                FROM ecom_bronze.customers AS customers
              columns_used:
                - customers.customer_id

      - name: revenue_per_customer
        business_name: Revenue Per Customer
        description: >-
          Average revenue per customer, calculated as total revenue divided by the number of distinct customers who placed orders.
          Uses safe division to handle zero customer count.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT orders.customer_id) = 0 THEN 0
                    ELSE SUM(orders.total_amount) / COUNT(DISTINCT orders.customer_id)
                  END AS revenue_per_customer
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.total_amount
                - orders.customer_id

      - name: orders_per_customer
        business_name: Orders Per Customer
        description: >-
          Average number of orders per customer, calculated as total order count divided by the number of distinct customers who placed orders.
          Uses safe division to handle zero customer count.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT orders.customer_id) = 0 THEN 0
                    ELSE CAST(COUNT(orders.order_id) AS DECIMAL) / COUNT(DISTINCT orders.customer_id)
                  END AS orders_per_customer
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.order_id
                - orders.customer_id

      - name: product_revenue
        business_name: Product Revenue
        description: >-
          Total revenue by product, calculated as the sum of order line item totals.
          Use this metric for product-level revenue analysis.
        return_type: DECIMAL
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  order_items.product_id,
                  products.product_name,
                  SUM(order_items.line_total) AS product_revenue
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
                GROUP BY order_items.product_id, products.product_name
              columns_used:
                - order_items.product_id
                - order_items.line_total
                - products.product_name

      - name: units_sold
        business_name: Units Sold
        description: >-
          Total number of units sold across all order line items, calculated as the sum of quantities.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.quantity) AS units_sold
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.quantity

      - name: units_sold_by_product
        business_name: Units Sold By Product
        description: >-
          Total number of units sold by product, calculated as the sum of quantities grouped by product.
        return_type: INTEGER
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  order_items.product_id,
                  products.product_name,
                  SUM(order_items.quantity) AS units_sold
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
                GROUP BY order_items.product_id, products.product_name
              columns_used:
                - order_items.product_id
                - order_items.quantity
                - products.product_name

      - name: average_selling_price
        business_name: Average Selling Price
        description: >-
          Average selling price per unit, calculated as total product revenue divided by total units sold.
          This is a weighted average based on actual sales.
          Uses safe division to handle zero units sold.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN SUM(order_items.quantity) = 0 THEN 0
                    ELSE SUM(order_items.line_total) / SUM(order_items.quantity)
                  END AS average_selling_price
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.line_total
                - order_items.quantity

      - name: line_item_discount_amount
        business_name: Line Item Discount Amount
        description: >-
          Total discount amount at line-item level, calculated as quantity * unit_price * (discount_pct / 100).
          This represents the monetary value of discounts applied to individual line items.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.quantity * order_items.unit_price * (order_items.discount_pct / 100)) AS line_item_discount_amount
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.quantity
                - order_items.unit_price
                - order_items.discount_pct

      - name: average_discount_percentage
        business_name: Average Discount Percentage
        description: >-
          Average discount percentage across all orders, calculated as total discount amount divided by total order subtotal, expressed as percentage.
          Uses safe division to handle zero subtotal.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN SUM(orders.subtotal) = 0 THEN 0
                    ELSE (SUM(orders.discount_amount) / SUM(orders.subtotal)) * 100
                  END AS average_discount_percentage
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.discount_amount
                - orders.subtotal

      - name: product_cost
        business_name: Product Cost
        description: >-
          Total product cost, calculated as the sum of (quantity * cost_price) for all order line items.
          Requires joining order_items to products to access cost_price.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.quantity * products.cost_price) AS product_cost
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
              columns_used:
                - order_items.quantity
                - products.cost_price

      - name: gross_profit
        business_name: Gross Profit
        description: >-
          Gross profit calculated as total product revenue minus total product cost.
          Product revenue is from order_items.line_total.
          Product cost is calculated as order_items.quantity * products.cost_price.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.line_total) - SUM(order_items.quantity * products.cost_price) AS gross_profit
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
              columns_used:
                - order_items.line_total
                - order_items.quantity
                - products.cost_price

      - name: gross_margin_percentage
        business_name: Gross Margin Percentage
        description: >-
          Gross margin percentage calculated as (gross profit / product revenue) * 100.
          Gross profit = product revenue - product cost.
          Uses safe division to handle zero revenue.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN SUM(order_items.line_total) = 0 THEN 0
                    ELSE ((SUM(order_items.line_total) - SUM(order_items.quantity * products.cost_price)) / SUM(order_items.line_total)) * 100
                  END AS gross_margin_percentage
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
              columns_used:
                - order_items.line_total
                - order_items.quantity
                - products.cost_price

      - name: product_count
        business_name: Product Count
        description: >-
          Total number of products in the catalog, calculated as the count of distinct product records.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(products.product_id) AS product_count
                FROM ecom_bronze.products AS products
              columns_used:
                - products.product_id

      - name: payment_count
        business_name: Payment Count
        description: >-
          Total number of payment transactions, calculated as the count of payment records.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(payments.payment_id) AS payment_count
                FROM ecom_bronze.payments AS payments
              columns_used:
                - payments.payment_id

      - name: total_payment_amount
        business_name: Total Payment Amount
        description: >-
          Total payment amount across all payment transactions, calculated as the sum of payment amounts.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(payments.amount) AS total_payment_amount
                FROM ecom_bronze.payments AS payments
              columns_used:
                - payments.amount

      - name: shipment_count
        business_name: Shipment Count
        description: >-
          Total number of shipments, calculated as the count of shipment records.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(shipments.shipment_id) AS shipment_count
                FROM ecom_bronze.shipments AS shipments
              columns_used:
                - shipments.shipment_id

      - name: delivered_shipment_count
        business_name: Delivered Shipment Count
        description: >-
          Total number of delivered shipments, calculated as the count of shipment records where delivered_at is not null.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(shipments.shipment_id) AS delivered_shipment_count
                FROM ecom_bronze.shipments AS shipments
                WHERE shipments.delivered_at IS NOT NULL
              columns_used:
                - shipments.shipment_id
                - shipments.delivered_at

      - name: average_delivery_time_days
        business_name: Average Delivery Time Days
        description: >-
          Average delivery time in days, calculated as the average difference between delivered_at and shipped_at timestamps.
          Only includes shipments that have been delivered (delivered_at is not null).
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(DATEDIFF(shipments.delivered_at, shipments.shipped_at)) AS average_delivery_time_days
                FROM ecom_bronze.shipments AS shipments
                WHERE shipments.delivered_at IS NOT NULL
                  AND shipments.shipped_at IS NOT NULL
              columns_used:
                - shipments.delivered_at
                - shipments.shipped_at

      - name: revenue_by_customer_segment
        business_name: Revenue By Customer Segment
        description: >-
          Total revenue by customer segment, calculated as the sum of order total amounts grouped by customer segment.
        return_type: DECIMAL
        result_grain: one row per customer segment
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  customers.customer_segment,
                  SUM(orders.total_amount) AS revenue
                FROM ecom_bronze.orders AS orders
                INNER JOIN ecom_bronze.customers AS customers
                  ON orders.customer_id = customers.customer_id
                GROUP BY customers.customer_segment
              columns_used:
                - orders.total_amount
                - customers.customer_segment

      - name: revenue_by_sales_channel
        business_name: Revenue By Sales Channel
        description: >-
          Total revenue by sales channel, calculated as the sum of order total amounts grouped by sales channel.
        return_type: DECIMAL
        result_grain: one row per sales channel
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  orders.sales_channel,
                  SUM(orders.total_amount) AS revenue
                FROM ecom_bronze.orders AS orders
                GROUP BY orders.sales_channel
              columns_used:
                - orders.total_amount
                - orders.sales_channel

      - name: revenue_by_product_category
        business_name: Revenue By Product Category
        description: >-
          Total revenue by product category, calculated as the sum of order line item totals grouped by product category.
        return_type: DECIMAL
        result_grain: one row per product category
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  product_categories.category_name,
                  SUM(order_items.line_total) AS revenue
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
                INNER JOIN ecom_bronze.product_categories AS product_categories
                  ON products.category_id = product_categories.category_id
                GROUP BY product_categories.category_name
              columns_used:
                - order_items.line_total
                - products.category_id
                - product_categories.category_name

      - name: revenue_by_brand
        business_name: Revenue By Brand
        description: >-
          Total revenue by product brand, calculated as the sum of order line item totals grouped by product brand.
        return_type: DECIMAL
        result_grain: one row per brand
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  products.brand,
                  SUM(order_items.line_total) AS revenue
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
                GROUP BY products.brand
              columns_used:
                - order_items.line_total
                - products.brand

      - name: monthly_revenue
        business_name: Monthly Revenue
        description: >-
          Total revenue by month, calculated as the sum of order total amounts grouped by month.
          Uses order_date as the time dimension.
        return_type: DECIMAL
        result_grain: one row per month
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  DATE_TRUNC('MONTH', orders.order_date) AS order_month,
                  SUM(orders.total_amount) AS revenue
                FROM ecom_bronze.orders AS orders
                GROUP BY DATE_TRUNC('MONTH', orders.order_date)
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.total_amount

      - name: monthly_order_count
        business_name: Monthly Order Count
        description: >-
          Total order count by month, calculated as the count of orders grouped by month.
          Uses order_date as the time dimension.
        return_type: INTEGER
        result_grain: one row per month
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  DATE_TRUNC('MONTH', orders.order_date) AS order_month,
                  COUNT(orders.order_id) AS order_count
                FROM ecom_bronze.orders AS orders
                GROUP BY DATE_TRUNC('MONTH', orders.order_date)
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.order_id

      - name: revenue_growth_month_over_month
        business_name: Revenue Growth Month Over Month
        description: >-
          Month-over-month revenue growth percentage, calculated using LAG window function to compare current month revenue to previous month revenue.
          Formula: ((current_month_revenue - previous_month_revenue) / previous_month_revenue) * 100.
          Uses safe division to handle zero previous month revenue.
        return_type: DECIMAL
        result_grain: one row per month
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                WITH monthly_revenue AS (
                  SELECT
                    DATE_TRUNC('MONTH', orders.order_date) AS order_month,
                    SUM(orders.total_amount) AS revenue
                  FROM ecom_bronze.orders AS orders
                  GROUP BY DATE_TRUNC('MONTH', orders.order_date)
                )
                SELECT
                  order_month,
                  revenue,
                  LAG(revenue) OVER (ORDER BY order_month) AS previous_month_revenue,
                  CASE
                    WHEN LAG(revenue) OVER (ORDER BY order_month) = 0 OR LAG(revenue) OVER (ORDER BY order_month) IS NULL THEN NULL
                    ELSE ((revenue - LAG(revenue) OVER (ORDER BY order_month)) / LAG(revenue) OVER (ORDER BY order_month)) * 100
                  END AS revenue_growth_pct
                FROM monthly_revenue
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.total_amount

      - name: running_total_revenue
        business_name: Running Total Revenue
        description: >-
          Running total revenue over time, calculated using SUM window function ordered by order date.
          Provides cumulative revenue from the beginning of the dataset to each order date.
        return_type: DECIMAL
        result_grain: one row per order date
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                WITH daily_revenue AS (
                  SELECT
                    DATE_TRUNC('DAY', orders.order_date) AS order_day,
                    SUM(orders.total_amount) AS daily_revenue
                  FROM ecom_bronze.orders AS orders
                  GROUP BY DATE_TRUNC('DAY', orders.order_date)
                )
                SELECT
                  order_day,
                  daily_revenue,
                  SUM(daily_revenue) OVER (ORDER BY order_day ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS running_total_revenue
                FROM daily_revenue
                ORDER BY order_day
              columns_used:
                - orders.order_date
                - orders.total_amount

      - name: product_revenue_rank
        business_name: Product Revenue Rank
        description: >-
          Ranking of products by revenue, calculated using RANK window function ordered by product revenue descending.
          Products with the same revenue receive the same rank.
        return_type: INTEGER
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                WITH product_revenue AS (
                  SELECT
                    order_items.product_id,
                    products.product_name,
                    SUM(order_items.line_total) AS revenue
                  FROM ecom_bronze.order_items AS order_items
                  INNER JOIN ecom_bronze.products AS products
                    ON order_items.product_id = products.product_id
                  GROUP BY order_items.product_id, products.product_name
                )
                SELECT
                  product_id,
                  product_name,
                  revenue,
                  RANK() OVER (ORDER BY revenue DESC) AS revenue_rank
                FROM product_revenue
                ORDER BY revenue_rank
              columns_used:
                - order_items.product_id
                - order_items.line_total
                - products.product_name

      - name: customer_revenue_rank
        business_name: Customer Revenue Rank
        description: >-
          Ranking of customers by total revenue, calculated using RANK window function ordered by customer revenue descending.
          Customers with the same revenue receive the same rank.
        return_type: INTEGER
        result_grain: one row per customer
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                WITH customer_revenue AS (
                  SELECT
                    orders.customer_id,
                    customers.customer_code,
                    SUM(orders.total_amount) AS revenue
                  FROM ecom_bronze.orders AS orders
                  INNER JOIN ecom_bronze.customers AS customers
                    ON orders.customer_id = customers.customer_id
                  GROUP BY orders.customer_id, customers.customer_code
                )
                SELECT
                  customer_id,
                  customer_code,
                  revenue,
                  RANK() OVER (ORDER BY revenue DESC) AS revenue_rank
                FROM customer_revenue
                ORDER BY revenue_rank
              columns_used:
                - orders.customer_id
                - orders.total_amount
                - customers.customer_code