version: "1.0"

semantic_model:
  - name: food_delivery_semantic_model
    description: >-
      Comprehensive semantic model for the food delivery platform analytics.
      This model supports analytical queries across customers, orders, restaurants,
      deliveries, agents, payments, promotions, and support operations.
      The model enables analysis of order fulfillment, revenue, customer behavior,
      restaurant performance, delivery agent performance, and operational efficiency.
    
    ai_context:
      instructions: >-
        ## Dataset Grain Guide
        
        - CUSTOMERS: One row per customer. Use for customer-level analysis.
        - CUSTOMER_ADDRESSES: One row per customer address. Multiple addresses per customer possible.
        - ORDERS: One row per order. Use for order-level revenue and order counts.
        - ORDER_ITEMS: One row per order item (order line). Multiple items per order. Use for product-level analysis.
        - ORDER_PROMOTIONS: One row per promotion applied to an order. Multiple promotions per order possible.
        - RESTAURANTS: One row per restaurant. Use for restaurant-level analysis.
        - RESTAURANT_CATEGORIES: One row per category. Use for category-level analysis.
        - RESTAURANT_CATEGORY_MAP: Many-to-many mapping between restaurants and categories.
        - MENU_SECTIONS: One row per menu section within a restaurant.
        - MENU_ITEMS: One row per menu item. Use for item-level analysis.
        - OPERATING_HOURS: One row per restaurant per day of week.
        - DELIVERIES: One row per delivery. Use for delivery-level analysis.
        - DELIVERY_AGENTS: One row per delivery agent. Use for agent-level analysis.
        - AGENT_PAYOUTS: One row per agent payout per delivery.
        - PAYMENTS: One row per payment transaction per order.
        - REVIEWS: One row per review. Can review food, delivery, and overall experience.
        - PROMOTIONS: One row per promotion definition.
        - SUPPORT_TICKETS: One row per support ticket.
        
        ## Revenue and Cost Guidance
        
        - For order-level revenue analysis, use ORDERS.total_amount or ORDERS.subtotal.
        - For item-level revenue analysis, use ORDER_ITEMS.line_total.
        - DO NOT sum ORDERS.total_amount after joining ORDERS to ORDER_ITEMS, as this will duplicate order totals.
        - For product revenue, join ORDER_ITEMS to MENU_ITEMS and sum ORDER_ITEMS.line_total.
        - For agent payout analysis, use AGENT_PAYOUTS.total_payout.
        - For promotion discount analysis, use ORDER_PROMOTIONS.discount_amount.
        
        ## Join Guidance
        
        - ORDERS to CUSTOMERS: orders.customer_id = customers.customer_id (many-to-one)
        - ORDERS to RESTAURANTS: orders.restaurant_id = restaurants.restaurant_id (many-to-one)
        - ORDERS to ORDER_ITEMS: orders.order_id = order_items.order_id (one-to-many)
        - ORDER_ITEMS to MENU_ITEMS: order_items.item_id = menu_items.item_id (many-to-one)
        - MENU_ITEMS to MENU_SECTIONS: menu_items.section_id = menu_sections.section_id (many-to-one)
        - MENU_ITEMS to RESTAURANTS: menu_items.restaurant_id = restaurants.restaurant_id (many-to-one)
        - MENU_SECTIONS to RESTAURANTS: menu_sections.restaurant_id = restaurants.restaurant_id (many-to-one)
        - ORDERS to DELIVERIES: orders.order_id = deliveries.order_id (one-to-one)
        - DELIVERIES to DELIVERY_AGENTS: deliveries.agent_id = delivery_agents.agent_id (many-to-one)
        - DELIVERIES to AGENT_PAYOUTS: deliveries.delivery_id = agent_payouts.delivery_id (one-to-one)
        - ORDERS to PAYMENTS: orders.order_id = payments.order_id (one-to-one)
        - ORDERS to ORDER_PROMOTIONS: orders.order_id = order_promotions.order_id (one-to-many)
        - ORDER_PROMOTIONS to PROMOTIONS: order_promotions.promotion_id = promotions.promotion_id (many-to-one)
        - ORDERS to REVIEWS: orders.order_id = reviews.order_id (one-to-one)
        - REVIEWS to CUSTOMERS: reviews.customer_id = customers.customer_id (many-to-one)
        - REVIEWS to RESTAURANTS: reviews.restaurant_id = restaurants.restaurant_id (many-to-one)
        - REVIEWS to DELIVERY_AGENTS: reviews.agent_id = delivery_agents.agent_id (many-to-one)
        - ORDERS to SUPPORT_TICKETS: orders.order_id = support_tickets.order_id (one-to-many)
        - SUPPORT_TICKETS to CUSTOMERS: support_tickets.customer_id = customers.customer_id (many-to-one)
        - RESTAURANTS to RESTAURANT_CATEGORY_MAP: restaurants.restaurant_id = restaurant_category_map.restaurant_id (one-to-many)
        - RESTAURANT_CATEGORY_MAP to RESTAURANT_CATEGORIES: restaurant_category_map.category_id = restaurant_categories.category_id (many-to-one)
        - RESTAURANTS to OPERATING_HOURS: restaurants.restaurant_id = operating_hours.restaurant_id (one-to-many)
        - CUSTOMERS to CUSTOMER_ADDRESSES: customers.customer_id = customer_addresses.customer_id (one-to-many)
        
        ## Double-Counting Prevention
        
        - When analyzing order revenue by product, use ORDER_ITEMS.line_total, not ORDERS.total_amount.
        - When analyzing order counts, use COUNT(DISTINCT orders.order_id) when joining to ORDER_ITEMS.
        - When analyzing customer counts, use COUNT(DISTINCT customers.customer_id) when joining across multiple tables.
        - ORDERS.subtotal represents order subtotal before fees. ORDERS.total_amount includes delivery_fee, tax, and tip.
        - Do not sum order-level fields (subtotal, delivery_fee, tax, tip, total_amount) after joining to ORDER_ITEMS.
        
        ## Time Analysis
        
        - For order analysis, use ORDERS.ordered_at as the primary date.
        - For delivery analysis, use DELIVERIES.delivered_time or DELIVERIES.pickup_time.
        - For payment analysis, use PAYMENTS.processed_at.
        - For review analysis, use REVIEWS.reviewed_at.
        - For support ticket analysis, use SUPPORT_TICKETS.created_at or SUPPORT_TICKETS.resolved_at.
        - For agent payout analysis, use AGENT_PAYOUTS.payout_date.
        - For customer registration analysis, use CUSTOMERS.registered_at.
        - For restaurant onboarding analysis, use RESTAURANTS.created_at.
        - For promotion validity, use PROMOTIONS.start_date and PROMOTIONS.end_date.
        
        ## Status and State Guidance
        
        - ORDERS.order_status: Placed, Delivered, Cancelled
        - DELIVERIES.delivery_status: In Transit, Delivered
        - PAYMENTS.payment_status: Authorized, Settled
        - AGENT_PAYOUTS.payout_status: Pending, Completed
        - SUPPORT_TICKETS.status: Open, In Progress, Resolved
        - Use status fields to filter for completed transactions when calculating revenue.
        - Use CUSTOMERS.is_active to filter active customers.
        - Use DELIVERY_AGENTS.is_active to filter active agents.
        - Use RESTAURANTS.is_active to filter active restaurants.
        - Use MENU_ITEMS.is_available to filter available items.
        - Use PROMOTIONS.is_active to filter active promotions.
        
        ## Aggregation Guidance
        
        - Revenue, cost, fees, tips, discounts, payouts: Use SUM
        - Counts (orders, customers, items, deliveries): Use COUNT or COUNT DISTINCT
        - Ratings: Use AVG for average ratings
        - Distances, times, quantities: Use SUM for totals, AVG for averages
        - Percentages and ratios: Calculate as ratio of aggregates, not AVG of row-level percentages
        
        ## Metric Calculation Notes
        
        - Average Order Value = SUM(total_amount) / COUNT(DISTINCT order_id)
        - Gross Profit = SUM(subtotal) - SUM(item costs) where item costs would need to be derived
        - Delivery Time Variance = actual_time_min - estimated_time_min
        - On-Time Delivery % = COUNT(on-time deliveries) / COUNT(total deliveries) * 100
        - Customer Retention and Lifetime Value require temporal analysis across multiple orders
        - Agent Performance = AVG(delivery_agents.avg_rating) or analysis of delivery times
        
        ## Restaurant Performance
        
        - Restaurant revenue: Join ORDERS to RESTAURANTS, sum ORDERS.total_amount
        - Restaurant order count: Join ORDERS to RESTAURANTS, count distinct orders
        - Restaurant ratings: Use RESTAURANTS.avg_rating or aggregate REVIEWS.overall_rating
        - Popular items: Join ORDER_ITEMS to MENU_ITEMS, count item frequency
        - Category performance: Join through RESTAURANT_CATEGORY_MAP to aggregate by category
        
        ## Promotion Analysis
        
        - Total discount given: Sum ORDER_PROMOTIONS.discount_amount
        - Promotion usage: Use PROMOTIONS.times_used or count ORDER_PROMOTIONS
        - Promotion effectiveness: Compare orders with vs without promotions
        - Promotion ROI: Revenue from promoted orders vs discount cost
        
        ## Customer Segmentation
        
        - Premium vs non-premium: Use CUSTOMERS.is_premium
        - Active vs inactive: Use CUSTOMERS.is_active
        - By location: Use CUSTOMER_ADDRESSES city, state, zip_code
        - By order frequency: Count orders per customer
        - By order value: Average or total order value per customer
        
        ## Delivery Agent Analysis
        
        - Agent earnings: Sum AGENT_PAYOUTS.total_payout per agent
        - Agent performance: Use DELIVERY_AGENTS.avg_rating or analyze delivery times
        - Agent utilization: Count deliveries per agent
        - Vehicle type analysis: Group by DELIVERY_AGENTS.vehicle_type
        
        ## Support Ticket Analysis
        
        - Ticket volume: Count SUPPORT_TICKETS by category, priority, status
        - Resolution time: SUPPORT_TICKETS.resolved_at - SUPPORT_TICKETS.created_at
        - Common issues: Group by SUPPORT_TICKETS.category
        - Order-related issues: Join SUPPORT_TICKETS to ORDERS

    datasets:
      - name: customers
        business_name: Customers
        description: >-
          Contains customer master data. One row per customer.
          Includes customer profile information, registration details, and account status.
          Use this dataset for customer-level analysis and customer segmentation.
        source: food_delivery.customers
        primary_key:
          - customer_id
        fields:
          - name: customer_id
            business_name: Customer Identifier
            description: Unique identifier for a customer.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - PRIMARY KEY
          
          - name: first_name
            business_name: First Name
            description: Given name of the customer.
            sql_type: STRING
            constraints:
              - PII
          
          - name: last_name
            business_name: Last Name
            description: Family name of the customer.
            sql_type: STRING
            constraints:
              - PII
          
          - name: email
            business_name: Email
            description: Email address used to contact or authenticate the customer.
            sql_type: STRING
            constraints:
              - PII
          
          - name: phone
            business_name: Phone
            description: Phone number used to contact the customer.
            sql_type: STRING
            constraints:
              - PII
          
          - name: date_of_birth
            business_name: Date Of Birth
            description: Date of birth of the customer.
            sql_type: DATE
            constraints:
              - PII
          
          - name: registered_at
            business_name: Registered At
            description: Timestamp recording when the customer registered for the service.
            sql_type: TIMESTAMP
            dimension:
              is_time: true
          
          - name: is_active
            business_name: Is Active
            description: Indicates whether the customer account is currently active.
            sql_type: BOOLEAN
            dimension:
              is_categorical: true
          
          - name: is_premium
            business_name: Is Premium
            description: Indicates whether the customer is enrolled in a premium program.
            sql_type: BOOLEAN
            dimension:
              is_categorical: true
          
          - name: preferred_language
            business_name: Preferred Language
            description: Language preference used for communications with the customer.
            sql_type: STRING
            dimension:
              is_categorical: true
      
      - name: customer_addresses
        business_name: Customer Addresses
        description: >-
          Contains customer delivery addresses. One row per customer address.
          Multiple addresses per customer are possible.
          Use this dataset for location-based analysis and delivery routing.
        source: food_delivery.customer_addresses
        primary_key:
          - address_id
        fields:
          - name: address_id
            business_name: Address Identifier
            description: Unique identifier for a customer address record.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - PRIMARY KEY
          
          - name: customer_id
            business_name: Customer Reference
            description: References the customer associated with the address.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: address_type
            business_name: Address Type
            description: Indicates the type of address, such as Home or Work.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: street_address
            business_name: Street Address
            description: Street address where the customer receives deliveries.
            sql_type: STRING
            constraints:
              - PII
          
          - name: apt_unit
            business_name: Apartment Unit
            description: Apartment, unit, or suite designation for the customer address.
            sql_type: STRING
            constraints:
              - PII
          
          - name: city
            business_name: City
            description: City where the customer address is located.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: state
            business_name: State
            description: State or region where the customer address is located.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: zip_code
            business_name: Zip Code
            description: Postal or ZIP code for the customer address.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: latitude
            business_name: Latitude
            description: Geographic latitude coordinate of the customer address.
            sql_type: DOUBLE
          
          - name: longitude
            business_name: Longitude
            description: Geographic longitude coordinate of the customer address.
            sql_type: DOUBLE
          
          - name: is_default
            business_name: Is Default
            description: Indicates whether this is the customer's default delivery address.
            sql_type: BOOLEAN
            dimension:
              is_categorical: true
      
      - name: restaurants
        business_name: Restaurants
        description: >-
          Contains restaurant master data. One row per restaurant.
          Includes restaurant profile, location, ratings, and operational settings.
          Use this dataset for restaurant-level analysis and restaurant performance metrics.
        source: food_delivery.restaurants
        primary_key:
          - restaurant_id
        fields:
          - name: restaurant_id
            business_name: Restaurant Identifier
            description: Unique identifier for a restaurant.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - PRIMARY KEY
          
          - name: name
            business_name: Name
            description: Display name of the restaurant.
            sql_type: STRING
          
          - name: description
            business_name: Description
            description: Text description of the restaurant and its offerings.
            sql_type: STRING
          
          - name: phone
            business_name: Phone
            description: Contact phone number for the restaurant.
            sql_type: STRING
            constraints:
              - PII
          
          - name: email
            business_name: Email
            description: Contact email address for the restaurant.
            sql_type: STRING
            constraints:
              - PII
          
          - name: street_address
            business_name: Street Address
            description: Street address where the restaurant is located.
            sql_type: STRING
            constraints:
              - PII
          
          - name: city
            business_name: City
            description: City where the restaurant operates.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: state
            business_name: State
            description: State or region where the restaurant operates.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: zip_code
            business_name: Zip Code
            description: Postal or ZIP code for the restaurant location.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: latitude
            business_name: Latitude
            description: Geographic latitude coordinate of the restaurant location.
            sql_type: DOUBLE
          
          - name: longitude
            business_name: Longitude
            description: Geographic longitude coordinate of the restaurant location.
            sql_type: DOUBLE
          
          - name: avg_rating
            business_name: Average Rating
            description: Average rating the restaurant has received from customer reviews.
            sql_type: DOUBLE
            measure:
              aggregation: AVG
          
          - name: total_reviews
            business_name: Total Reviews
            description: Total number of reviews the restaurant has received.
            sql_type: BIGINT
            measure:
              aggregation: SUM
          
          - name: avg_delivery_time_min
            business_name: Average Delivery Time Minutes
            description: Average delivery time in minutes for orders fulfilled by the restaurant.
            sql_type: BIGINT
            measure:
              aggregation: AVG
          
          - name: min_order_amount
            business_name: Minimum Order Amount
            description: Minimum monetary order amount required by the restaurant.
            sql_type: DOUBLE
          
          - name: delivery_fee
            business_name: Delivery Fee
            description: Standard delivery fee charged by the restaurant.
            sql_type: DOUBLE
            measure:
              aggregation: AVG
          
          - name: is_active
            business_name: Is Active
            description: Indicates whether the restaurant is currently active on the platform.
            sql_type: BOOLEAN
            dimension:
              is_categorical: true
          
          - name: created_at
            business_name: Created At
            description: Timestamp recording when the restaurant record was created on the platform.
            sql_type: TIMESTAMP
            dimension:
              is_time: true
      
      - name: restaurant_categories
        business_name: Restaurant Categories
        description: >-
          Contains restaurant category definitions. One row per category.
          Categories classify restaurants by cuisine type or service style.
          Use this dataset for category-level analysis.
        source: food_delivery.restaurant_categories
        primary_key:
          - category_id
        fields:
          - name: category_id
            business_name: Category Identifier
            description: Unique identifier for a restaurant category.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - PRIMARY KEY
          
          - name: category_name
            business_name: Category Name
            description: Name of the restaurant category, such as Italian or Fast Food.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: description
            business_name: Description
            description: Text description of the restaurant category.
            sql_type: STRING
      
      - name: restaurant_category_map
        business_name: Restaurant Category Map
        description: >-
          Contains many-to-many mapping between restaurants and categories.
          One row per restaurant-category assignment.
          A restaurant can belong to multiple categories.
        source: food_delivery.restaurant_category_map
        primary_key:
          - mapping_id
        fields:
          - name: mapping_id
            business_name: Mapping Identifier
            description: Unique identifier for a restaurant-to-category mapping.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - PRIMARY KEY
          
          - name: restaurant_id
            business_name: Restaurant Reference
            description: References the restaurant being categorized.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: category_id
            business_name: Category Reference
            description: References the category assigned to the restaurant.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - FOREIGN KEY
      
      - name: menu_sections
        business_name: Menu Sections
        description: >-
          Contains menu sections within restaurants. One row per menu section.
          Menu sections organize menu items into logical groups like Appetizers or Entrees.
        source: food_delivery.menu_sections
        primary_key:
          - section_id
        fields:
          - name: section_id
            business_name: Section Identifier
            description: Unique identifier for a menu section.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - PRIMARY KEY
          
          - name: restaurant_id
            business_name: Restaurant Reference
            description: References the restaurant to which the menu section belongs.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: name
            business_name: Name
            description: Display name of the menu section, such as Appetizers or Desserts.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: display_order
            business_name: Display Order
            description: Numeric value indicating the order in which the section appears in the menu.
            sql_type: BIGINT
          
          - name: is_available
            business_name: Is Available
            description: Indicates whether the menu section is currently available.
            sql_type: BOOLEAN
            dimension:
              is_categorical: true
      
      - name: menu_items
        business_name: Menu Items
        description: >-
          Contains menu items offered by restaurants. One row per menu item.
          Includes item details, pricing, dietary attributes, and availability.
          Use this dataset for product-level analysis.
        source: food_delivery.menu_items
        primary_key:
          - item_id
        fields:
          - name: item_id
            business_name: Item Identifier
            description: Unique identifier for a menu item.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - PRIMARY KEY
          
          - name: section_id
            business_name: Section Reference
            description: References the menu section to which the item belongs.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: restaurant_id
            business_name: Restaurant Reference
            description: References the restaurant offering the menu item.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: name
            business_name: Name
            description: Display name of the menu item shown to customers.
            sql_type: STRING
          
          - name: description
            business_name: Description
            description: Text description of the menu item and its ingredients.
            sql_type: STRING
          
          - name: price
            business_name: Price
            description: Monetary price of the menu item.
            sql_type: DOUBLE
            measure:
              aggregation: AVG
          
          - name: is_vegetarian
            business_name: Is Vegetarian
            description: Indicates whether the menu item is suitable for vegetarians.
            sql_type: BOOLEAN
            dimension:
              is_categorical: true
          
          - name: is_vegan
            business_name: Is Vegan
            description: Indicates whether the menu item is suitable for vegans.
            sql_type: BOOLEAN
            dimension:
              is_categorical: true
          
          - name: is_gluten_free
            business_name: Is Gluten Free
            description: Indicates whether the menu item is gluten free.
            sql_type: BOOLEAN
            dimension:
              is_categorical: true
          
          - name: spice_level
            business_name: Spice Level
            description: Indicates the spice level of the menu item, such as Mild or Spicy.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: calories
            business_name: Calories
            description: Estimated number of calories contained in the menu item.
            sql_type: BIGINT
            measure:
              aggregation: AVG
          
          - name: is_available
            business_name: Is Available
            description: Indicates whether the menu item is currently available to order.
            sql_type: BOOLEAN
            dimension:
              is_categorical: true
          
          - name: is_popular
            business_name: Is Popular
            description: Indicates whether the menu item is marked as popular based on demand.
            sql_type: BOOLEAN
            dimension:
              is_categorical: true
      
      - name: operating_hours
        business_name: Operating Hours
        description: >-
          Contains restaurant operating hours by day of week. One row per restaurant per day.
          Defines when restaurants are open for orders.
        source: food_delivery.operating_hours
        primary_key:
          - hours_id
        fields:
          - name: hours_id
            business_name: Hours Identifier
            description: Unique identifier for a restaurant operating hours record.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - PRIMARY KEY
          
          - name: restaurant_id
            business_name: Restaurant Reference
            description: References the restaurant whose operating hours are defined.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: day_of_week
            business_name: Day Of Week
            description: Day of the week for the operating hours, such as Monday or Friday.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: open_time
            business_name: Open Time
            description: Local time when the restaurant opens on the specified day.
            sql_type: STRING
          
          - name: close_time
            business_name: Close Time
            description: Local time when the restaurant closes on the specified day.
            sql_type: STRING
          
          - name: is_closed
            business_name: Is Closed
            description: Indicates whether the restaurant is closed on the specified day.
            sql_type: BOOLEAN
            dimension:
              is_categorical: true
      
      - name: orders
        business_name: Orders
        description: >-
          Contains customer orders. One row per order.
          This is the primary fact table for order-level revenue analysis.
          Includes order totals, fees, taxes, tips, status, and timestamps.
          Use this dataset for order-level metrics and revenue analysis.
        source: food_delivery.orders
        primary_key:
          - order_id
        fields:
          - name: order_id
            business_name: Order Identifier
            description: Unique identifier for a customer order.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - PRIMARY KEY
          
          - name: customer_id
            business_name: Customer Reference
            description: References the customer who placed the order.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: restaurant_id
            business_name: Restaurant Reference
            description: References the restaurant fulfilling the order.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: order_status
            business_name: Order Status
            description: Indicates the current status of the order, such as Placed, Delivered, or Cancelled.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: subtotal
            business_name: Subtotal
            description: Monetary subtotal of the order before fees, taxes, and tips.
            sql_type: DOUBLE
            measure:
              aggregation: SUM
          
          - name: delivery_fee
            business_name: Delivery Fee
            description: Monetary fee charged for delivery.
            sql_type: DOUBLE
            measure:
              aggregation: SUM
          
          - name: tax
            business_name: Tax
            description: Monetary amount of tax applied to the order.
            sql_type: DOUBLE
            constraints:
              - PII
            measure:
              aggregation: SUM
          
          - name: tip
            business_name: Tip
            description: Monetary amount of tip provided by the customer.
            sql_type: DOUBLE
