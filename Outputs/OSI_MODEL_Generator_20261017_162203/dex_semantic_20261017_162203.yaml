    relationships:
      - name: orders_to_customers
        left_dataset: orders
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: inner
        resolution: >-
          Each order is placed by exactly one customer.
          Multiple orders can be placed by the same customer.
          Join orders to customers to analyze customer behavior and order patterns.
      
      - name: orders_to_restaurants
        left_dataset: orders
        right_dataset: restaurants
        relationship_type: many_to_one
        join:
          left:
            - restaurant_id
          right:
            - restaurant_id
        join_type: inner
        resolution: >-
          Each order is fulfilled by exactly one restaurant.
          Multiple orders can be fulfilled by the same restaurant.
          Join orders to restaurants to analyze restaurant performance and revenue.
      
      - name: orders_to_order_items
        left_dataset: orders
        right_dataset: order_items
        relationship_type: one_to_many
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: inner
        resolution: >-
          Each order contains one or more order items.
          When joining orders to order_items, do not sum order-level fields like total_amount,
          as this will duplicate order totals. Use order_items.line_total for item-level revenue.
      
      - name: order_items_to_menu_items
        left_dataset: order_items
        right_dataset: menu_items
        relationship_type: many_to_one
        join:
          left:
            - item_id
          right:
            - item_id
        join_type: inner
        resolution: >-
          Each order item references a specific menu item.
          Multiple order items can reference the same menu item.
          Join order_items to menu_items to analyze product performance.
      
      - name: menu_items_to_menu_sections
        left_dataset: menu_items
        right_dataset: menu_sections
        relationship_type: many_to_one
        join:
          left:
            - section_id
          right:
            - section_id
        join_type: inner
        resolution: >-
          Each menu item belongs to exactly one menu section.
          Multiple menu items can belong to the same section.
      
      - name: menu_items_to_restaurants
        left_dataset: menu_items
        right_dataset: restaurants
        relationship_type: many_to_one
        join:
          left:
            - restaurant_id
          right:
            - restaurant_id
        join_type: inner
        resolution: >-
          Each menu item is offered by exactly one restaurant.
          Multiple menu items can be offered by the same restaurant.
      
      - name: menu_sections_to_restaurants
        left_dataset: menu_sections
        right_dataset: restaurants
        relationship_type: many_to_one
        join:
          left:
            - restaurant_id
          right:
            - restaurant_id
        join_type: inner
        resolution: >-
          Each menu section belongs to exactly one restaurant.
          Multiple menu sections can belong to the same restaurant.
      
      - name: orders_to_deliveries
        left_dataset: orders
        right_dataset: deliveries
        relationship_type: one_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: left
        resolution: >-
          Each order has at most one delivery record.
          Not all orders may have delivery records if cancelled before delivery assignment.
          Use left join to preserve all orders.
      
      - name: deliveries_to_delivery_agents
        left_dataset: deliveries
        right_dataset: delivery_agents
        relationship_type: many_to_one
        join:
          left:
            - agent_id
          right:
            - agent_id
        join_type: inner
        resolution: >-
          Each delivery is handled by exactly one delivery agent.
          Multiple deliveries can be handled by the same agent.
          Join deliveries to delivery_agents to analyze agent performance.
      
      - name: deliveries_to_agent_payouts
        left_dataset: deliveries
        right_dataset: agent_payouts
        relationship_type: one_to_one
        join:
          left:
            - delivery_id
          right:
            - delivery_id
        join_type: left
        resolution: >-
          Each delivery has at most one payout record.
          Payouts may be pending or not yet created for recent deliveries.
          Use left join to preserve all deliveries.
      
      - name: agent_payouts_to_delivery_agents
        left_dataset: agent_payouts
        right_dataset: delivery_agents
        relationship_type: many_to_one
        join:
          left:
            - agent_id
          right:
            - agent_id
        join_type: inner
        resolution: >-
          Each payout is paid to exactly one delivery agent.
          Multiple payouts can be paid to the same agent.
      
      - name: orders_to_payments
        left_dataset: orders
        right_dataset: payments
        relationship_type: one_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: left
        resolution: >-
          Each order has at most one payment record.
          Cancelled orders may not have payment records.
          Use left join to preserve all orders.
      
      - name: orders_to_order_promotions
        left_dataset: orders
        right_dataset: order_promotions
        relationship_type: one_to_many
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: left
        resolution: >-
          Each order can have zero or more promotions applied.
          Multiple promotions can be applied to the same order.
          Use left join to preserve orders without promotions.
      
      - name: order_promotions_to_promotions
        left_dataset: order_promotions
        right_dataset: promotions
        relationship_type: many_to_one
        join:
          left:
            - promotion_id
          right:
            - promotion_id
        join_type: inner
        resolution: >-
          Each order promotion references a specific promotion definition.
          Multiple order promotions can reference the same promotion.
      
      - name: orders_to_reviews
        left_dataset: orders
        right_dataset: reviews
        relationship_type: one_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: left
        resolution: >-
          Each order can have at most one review.
          Not all orders are reviewed.
          Use left join to preserve all orders.
      
      - name: reviews_to_customers
        left_dataset: reviews
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: inner
        resolution: >-
          Each review is submitted by exactly one customer.
          Multiple reviews can be submitted by the same customer.
      
      - name: reviews_to_restaurants
        left_dataset: reviews
        right_dataset: restaurants
        relationship_type: many_to_one
        join:
          left:
            - restaurant_id
          right:
            - restaurant_id
        join_type: inner
        resolution: >-
          Each review evaluates exactly one restaurant.
          Multiple reviews can evaluate the same restaurant.
      
      - name: reviews_to_delivery_agents
        left_dataset: reviews
        right_dataset: delivery_agents
        relationship_type: many_to_one
        join:
          left:
            - agent_id
          right:
            - agent_id
        join_type: inner
        resolution: >-
          Each review evaluates exactly one delivery agent.
          Multiple reviews can evaluate the same agent.
      
      - name: orders_to_support_tickets
        left_dataset: orders
        right_dataset: support_tickets
        relationship_type: one_to_many
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: left
        resolution: >-
          Each order can have zero or more support tickets.
          Multiple support tickets can be raised for the same order.
          Use left join to preserve orders without support tickets.
      
      - name: support_tickets_to_customers
        left_dataset: support_tickets
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: inner
        resolution: >-
          Each support ticket is raised by exactly one customer.
          Multiple support tickets can be raised by the same customer.
      
      - name: restaurants_to_restaurant_category_map
        left_dataset: restaurants
        right_dataset: restaurant_category_map
        relationship_type: one_to_many
        join:
          left:
            - restaurant_id
          right:
            - restaurant_id
        join_type: left
        resolution: >-
          Each restaurant can be assigned to one or more categories.
          This is a many-to-many relationship implemented through a mapping table.
      
      - name: restaurant_category_map_to_restaurant_categories
        left_dataset: restaurant_category_map
        right_dataset: restaurant_categories
        relationship_type: many_to_one
        join:
          left:
            - category_id
          right:
            - category_id
        join_type: inner
        resolution: >-
          Each mapping references exactly one category.
          Multiple mappings can reference the same category.
      
      - name: restaurants_to_operating_hours
        left_dataset: restaurants
        right_dataset: operating_hours
        relationship_type: one_to_many
        join:
          left:
            - restaurant_id
          right:
            - restaurant_id
        join_type: left
        resolution: >-
          Each restaurant has operating hours defined for each day of the week.
          Multiple operating hours records exist per restaurant (one per day).
      
      - name: customers_to_customer_addresses
        left_dataset: customers
        right_dataset: customer_addresses
        relationship_type: one_to_many
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: left
        resolution: >-
          Each customer can have one or more delivery addresses.
          Multiple addresses can belong to the same customer.

    metrics:
      - name: total_order_revenue
        business_name: Total Order Revenue
        description: >-
          Total revenue from all orders including delivery fees, taxes, and tips.
          Calculated as the sum of orders.total_amount.
          Use this metric for overall revenue analysis at the order level.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.total_amount) AS total_order_revenue
                FROM food_delivery.orders AS orders
                WHERE orders.order_status = 'Delivered'
              columns_used:
                - orders.total_amount
                - orders.order_status
      
      - name: total_order_subtotal
        business_name: Total Order Subtotal
        description: >-
          Total order subtotal before delivery fees, taxes, and tips.
          Calculated as the sum of orders.subtotal.
          Use this metric to analyze base order value excluding fees.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.subtotal) AS total_order_subtotal
                FROM food_delivery.orders AS orders
                WHERE orders.order_status = 'Delivered'
              columns_used:
                - orders.subtotal
                - orders.order_status
      
      - name: total_delivery_fees
        business_name: Total Delivery Fees
        description: >-
          Total delivery fees collected from all orders.
          Calculated as the sum of orders.delivery_fee.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.delivery_fee) AS total_delivery_fees
                FROM food_delivery.orders AS orders
                WHERE orders.order_status = 'Delivered'
              columns_used:
                - orders.delivery_fee
                - orders.order_status
      
      - name: total_tax_collected
        business_name: Total Tax Collected
        description: >-
          Total tax amount collected from all orders.
          Calculated as the sum of orders.tax.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.tax) AS total_tax_collected
                FROM food_delivery.orders AS orders
                WHERE orders.order_status = 'Delivered'
              columns_used:
                - orders.tax
                - orders.order_status
      
      - name: total_tips
        business_name: Total Tips
        description: >-
          Total tip amount received from customers across all orders.
          Calculated as the sum of orders.tip.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.tip) AS total_tips
                FROM food_delivery.orders AS orders
                WHERE orders.order_status = 'Delivered'
              columns_used:
                - orders.tip
                - orders.order_status
      
      - name: total_order_count
        business_name: Total Order Count
        description: >-
          Total number of orders placed.
          Calculated as the count of distinct orders.order_id.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT orders.order_id) AS total_order_count
                FROM food_delivery.orders AS orders
              columns_used:
                - orders.order_id
      
      - name: delivered_order_count
        business_name: Delivered Order Count
        description: >-
          Total number of successfully delivered orders.
          Calculated as the count of orders where order_status = 'Delivered'.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT orders.order_id) AS delivered_order_count
                FROM food_delivery.orders AS orders
                WHERE orders.order_status = 'Delivered'
              columns_used:
                - orders.order_id
                - orders.order_status
      
      - name: cancelled_order_count
        business_name: Cancelled Order Count
        description: >-
          Total number of cancelled orders.
          Calculated as the count of orders where order_status = 'Cancelled'.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT orders.order_id) AS cancelled_order_count
                FROM food_delivery.orders AS orders
                WHERE orders.order_status = 'Cancelled'
              columns_used:
                - orders.order_id
                - orders.order_status
      
      - name: average_order_value
        business_name: Average Order Value
        description: >-
          Average total amount per delivered order.
          Calculated as total revenue divided by number of delivered orders.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT orders.order_id) = 0 THEN 0
                    ELSE SUM(orders.total_amount) / COUNT(DISTINCT orders.order_id)
                  END AS average_order_value
                FROM food_delivery.orders AS orders
                WHERE orders.order_status = 'Delivered'
              columns_used:
                - orders.total_amount
                - orders.order_id
                - orders.order_status
      
      - name: total_item_revenue
        business_name: Total Item Revenue
        description: >-
          Total revenue from order items at the item level.
          Calculated as the sum of order_items.line_total.
          Use this metric for product-level revenue analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.line_total) AS total_item_revenue
                FROM food_delivery.order_items AS order_items
                INNER JOIN food_delivery.orders AS orders
                  ON order_items.order_id = orders.order_id
                WHERE orders.order_status = 'Delivered'
              columns_used:
                - order_items.line_total
                - orders.order_status
      
      - name: total_items_sold
        business_name: Total Items Sold
        description: >-
          Total quantity of items sold across all orders.
          Calculated as the sum of order_items.quantity.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.quantity) AS total_items_sold
                FROM food_delivery.order_items AS order_items
                INNER JOIN food_delivery.orders AS orders
                  ON order_items.order_id = orders.order_id
                WHERE orders.order_status = 'Delivered'
              columns_used:
                - order_items.quantity
                - orders.order_status
      
      - name: average_items_per_order
        business_name: Average Items Per Order
        description: >-
          Average number of items per delivered order.
          Calculated as total items divided by number of delivered orders.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT orders.order_id) = 0 THEN 0
                    ELSE CAST(SUM(order_items.quantity) AS DOUBLE) / COUNT(DISTINCT orders.order_id)
                  END AS average_items_per_order
                FROM food_delivery.order_items AS order_items
                INNER JOIN food_delivery.orders AS orders
                  ON order_items.order_id = orders.order_id
                WHERE orders.order_status = 'Delivered'
              columns_used:
                - order_items.quantity
                - orders.order_id
                - orders.order_status
      
      - name: total_customer_count
        business_name: Total Customer Count
        description: >-
          Total number of registered customers.
          Calculated as the count of distinct customers.customer_id.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT customers.customer_id) AS total_customer_count
                FROM food_delivery.customers AS customers
              columns_used:
                - customers.customer_id
      
      - name: active_customer_count
        business_name: Active Customer Count
        description: >-
          Total number of active customers.
          Calculated as the count of customers where is_active = true.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT customers.customer_id) AS active_customer_count
                FROM food_delivery.customers AS customers
                WHERE customers.is_active = true
              columns_used:
                - customers.customer_id
                - customers.is_active
      
      - name: premium_customer_count
        business_name: Premium Customer Count
        description: >-
          Total number of premium customers.
          Calculated as the count of customers where is_premium = true.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT customers.customer_id) AS premium_customer_count
                FROM food_delivery.customers AS customers
                WHERE customers.is_premium = true
              columns_used:
                - customers.customer_id
                - customers.is_premium
      
      - name: total_restaurant_count
        business_name: Total Restaurant Count
        description: >-
          Total number of restaurants on the platform.
          Calculated as the count of distinct restaurants.restaurant_id.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT restaurants.restaurant_id) AS total_restaurant_count
                FROM food_delivery.restaurants AS restaurants
              columns_used:
                - restaurants.restaurant_id
      
      - name: active_restaurant_count
        business_name: Active Restaurant Count
        description: >-
          Total number of active restaurants.
          Calculated as the count of restaurants where is_active = true.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT restaurants.restaurant_id) AS active_restaurant_count
                FROM food_delivery.restaurants AS restaurants
                WHERE restaurants.is_active = true
              columns_used:
                - restaurants.restaurant_id
                - restaurants.is_active
      
      - name: total_delivery_count
        business_name: Total Delivery Count
        description: >-
          Total number of deliveries.
          Calculated as the count of distinct deliveries.delivery_id.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT deliveries.delivery_id) AS total_delivery_count
                FROM food_delivery.deliveries AS deliveries
              columns_used:
                - deliveries.delivery_id
      
      - name: completed_delivery_count
        business_name: Completed Delivery Count
        description: >-
          Total number of completed deliveries.
          Calculated as the count of deliveries where delivery_status = 'Delivered'.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT deliveries.delivery_id) AS completed_delivery_count
                FROM food_delivery.deliveries AS deliveries
                WHERE deliveries.delivery_status = 'Delivered'
              columns_used:
                - deliveries.delivery_id
                - deliveries.delivery_status
      
      - name: total_distance_delivered_km
        business_name: Total Distance Delivered (KM)
        description: >-
          Total distance in kilometers traveled across all deliveries.
          Calculated as the sum of deliveries.distance_km.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(deliveries.distance_km) AS total_distance_delivered_km
                FROM food_delivery.deliveries AS deliveries
                WHERE deliveries.delivery_status = 'Delivered'
              columns_used:
                - deliveries.distance_km
                - deliveries.delivery_status
      
      - name: average_delivery_distance_km
        business_name: Average Delivery Distance (KM)
        description: >-
          Average distance in kilometers per delivery.
          Calculated as total distance divided by number of completed deliveries.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT deliveries.delivery_id) = 0 THEN 0
                    ELSE SUM(deliveries.distance_km) / COUNT(DISTINCT deliveries.delivery_id)
                  END AS average_delivery_distance_km
                FROM food_delivery.deliveries AS deliveries
                WHERE deliveries.delivery_status = 'Delivered'
              columns_used:
                - deliveries.distance_km
                - deliveries.delivery_id
                - deliveries.delivery_status
      
      - name: average_actual_delivery_time_min
        business_name: Average Actual Delivery Time (Minutes)
        description: >-
          Average actual delivery time in minutes.
          Calculated as the average of deliveries.actual_time_min.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(deliveries.actual_time_min) AS average_actual_delivery_time_min
                FROM food_delivery.deliveries AS deliveries
                WHERE deliveries.delivery_status = 'Delivered'
              columns_used:
                - deliveries.actual_time_min
                - deliveries.delivery_status
      
      - name: average_estimated_delivery_time_min
        business_name: Average Estimated Delivery Time (Minutes)
        description: >-
          Average estimated delivery time in minutes.
          Calculated as the average of deliveries.estimated_time_min.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(deliveries.estimated_time_min) AS average_estimated_delivery_time_min
                FROM food_delivery.deliveries AS deliveries
                WHERE deliveries.delivery_status = 'Delivered'
              columns_used:
                - deliveries.estimated_time_min
                - deliveries.delivery_status
      
      - name: total_agent_payout
        business_name: Total Agent Payout
        description: >-
          Total payout amount paid to delivery agents.
          Calculated as the sum of agent_payouts.total_payout.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(agent_payouts.total_payout) AS total_agent_payout
                FROM food_delivery.agent_payouts AS agent_payouts
                WHERE agent_payouts.payout_status = 'Completed'
              columns_used:
                - agent_payouts.total_payout
                - agent_payouts.payout_status
      
      - name: total_agent_base_pay
        business_name: Total Agent Base Pay
        description: >-
          Total base pay amount paid to delivery agents.
          Calculated as the sum of agent_payouts.base_pay.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(agent_payouts.base_pay) AS total_agent_base_pay
                FROM food_delivery.agent_payouts AS agent_payouts
                WHERE agent_payouts.payout_status = 'Completed'
              columns_used:
                - agent_payouts.base_pay
                - agent_payouts.payout_status
      
      - name: total_agent_distance_bonus
        business_name: Total Agent Distance Bonus
        description: >-
          Total distance bonus paid to delivery agents.
          Calculated as the sum of agent_payouts.distance_bonus.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(agent_payouts.distance_bonus) AS total_agent_distance_bonus
                FROM food_delivery.agent_payouts AS agent_payouts
                WHERE agent_payouts.payout_status = 'Completed'
              columns_used:
                - agent_payouts.distance_bonus
                - agent_payouts.payout_status
      
      - name: total_agent_tips
        business_name: Total Agent Tips
        description: >-
          Total tip amount received by delivery agents.
          Calculated as the sum of agent_payouts.tip_amount.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(agent_payouts.tip_amount) AS total_agent_tips
                FROM food_delivery.agent_payouts AS agent_payouts
                WHERE agent_payouts.payout_status = 'Completed'
              columns_used:
                - agent_payouts.tip_amount
                - agent_payouts.payout_status
      
      - name: total_agent_count
        business_name: Total Agent Count
        description: >-
          Total number of delivery agents on the platform.
          Calculated as the count of distinct delivery_agents.agent_id.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT delivery_agents.agent_id) AS total_agent_count
                FROM food_delivery.delivery_agents AS delivery_agents
              columns_used:
                - delivery_agents.agent_id
      
      - name: active_agent_count
        business_name: Active Agent Count
        description: >-
          Total number of active delivery agents.
          Calculated as the count of agents where is_active = true.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT delivery_agents.agent_id) AS active_agent_count
                FROM food_delivery.delivery_agents AS delivery_agents
                WHERE delivery_agents.is_active = true
              columns_used:
                - delivery_agents.agent_id
                - delivery_agents.is_active
      
      - name: total_discount_amount
        business_name: Total Discount Amount
        description: >-
          Total discount amount given through promotions.
          Calculated as the sum of order_promotions.discount_amount.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_promotions.discount_amount) AS total_discount_amount
                FROM food_delivery.order_promotions AS order_promotions
              columns_used:
                - order_promotions.discount_amount
      
      - name: total_promotion_usage_count
        business_name: Total Promotion Usage Count
        description: >-
          Total number of times promotions have been applied to orders.
          Calculated as the count of order_promotions records.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(order_promotions.order_promotion_id) AS total_promotion_usage_count
                FROM food_delivery.order_promotions AS order_promotions
              columns_used:
                - order_promotions.order_promotion_id
      
      - name: average_food_rating
        business_name: Average Food Rating
        description: >-
          Average food quality rating from customer reviews.
          Calculated as the average of reviews.food_rating.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(reviews.food_rating) AS average_food_rating
                FROM food_delivery.reviews AS reviews
              columns_used:
                - reviews.food_rating
      
      - name: average_delivery_rating
        business_name: Average Delivery Rating
        description: >-
          Average delivery experience rating from customer reviews.
          Calculated as the average of reviews.delivery_rating.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(reviews.delivery_rating) AS average_delivery_rating
                FROM food_delivery.reviews AS reviews
              columns_used:
                - reviews.delivery_rating
      
      - name: average_overall_rating
        business_name: Average Overall Rating
        description: >-
          Average overall experience rating from customer reviews.
          Calculated as the average of reviews.overall_rating.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(reviews.overall_rating) AS average_overall_rating
                FROM food_delivery.reviews AS reviews
              columns_used:
                - reviews.overall_rating
      
      - name: total_review_count
        business_name: Total Review Count
        description: >-
          Total number of customer reviews submitted.
          Calculated as the count of distinct reviews.review_id.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT reviews.review_id) AS total_review_count
                FROM food_delivery.reviews AS reviews
              columns_used:
                - reviews.review_id
      
      - name: total_support_ticket_count
        business_name: Total Support Ticket Count
        description: >-
          Total number of customer support tickets created.
          Calculated as the count of distinct support_tickets.ticket_id.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT support_tickets.ticket_id) AS total_support_ticket_count
                FROM food_delivery.support_tickets AS support_tickets
              columns_used:
                - support_tickets.ticket_id
      
      - name: resolved_support_ticket_count
        business_name: Resolved Support Ticket Count
        description: >-
          Total number of resolved customer support tickets.
          Calculated as the count of tickets where status = 'Resolved'.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT support_tickets.ticket_id) AS resolved_support_ticket_count
                FROM food_delivery.support_tickets AS support_tickets
                WHERE support_tickets.status = 'Resolved'
              columns_used:
                - support_tickets.ticket_id
                - support_tickets.status
      
      - name: open_support_ticket_count
        business_name: Open Support Ticket Count
        description: >-
          Total number of open customer support tickets.
          Calculated as the count of tickets where status = 'Open'.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT support_tickets.ticket_id) AS open_support_ticket_count
                FROM food_delivery.support_tickets AS support_tickets
                WHERE support_tickets.status = 'Open'
              columns_used:
                - support_tickets.ticket_id
                - support_tickets.status
      
      - name: orders_per_customer
        business_name: Orders Per Customer
        description: >-
          Average number of orders per customer.
          Calculated as total order count divided by total customer count.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT customers.customer_id) = 0 THEN 0
                    ELSE CAST(COUNT(DISTINCT orders.order_id) AS DOUBLE) / COUNT(DISTINCT customers.customer_id)
                  END AS orders_per_customer
                FROM food_delivery.orders AS orders
                INNER JOIN food_delivery.customers AS customers
                  ON orders.customer_id = customers.customer_id
              columns_used:
                - orders.order_id
                - customers.customer_id
      
      - name: revenue_per_customer
        business_name: Revenue Per Customer
        description: >-
          Average revenue per customer.
          Calculated as total revenue divided by total customer count.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT customers.customer_id) = 0 THEN 0
                    ELSE SUM(orders.total_amount) / COUNT(DISTINCT customers.customer_id)
                  END AS revenue_per_customer
                FROM food_delivery.orders AS orders
                INNER JOIN food_delivery.customers AS customers
                  ON orders.customer_id = customers.customer_id
                WHERE orders.order_status = 'Delivered'
              columns_used:
                - orders.total_amount
                - orders.order_status
                - customers.customer_id
      
      - name: cancellation_rate_pct
        business_name: Cancellation Rate (%)
        description: >-
          Percentage of orders that were cancelled.
          Calculated as cancelled orders divided by total orders times 100.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT orders.order_id) = 0 THEN 0
                    ELSE (
                      CAST(SUM(CASE WHEN orders.order_status = 'Cancelled' THEN 1 ELSE 0 END) AS DOUBLE)
                      / COUNT(DISTINCT orders.order_id)
                    ) * 100
                  END AS cancellation_rate_pct
                FROM food_delivery.orders AS orders
              columns_used:
                - orders.order_id
                - orders.order_status