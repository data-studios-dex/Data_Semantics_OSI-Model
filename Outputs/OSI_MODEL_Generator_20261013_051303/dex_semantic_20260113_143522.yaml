                    NULLIF(COUNT(DISTINCT dp.product_id), 0) AS avg_safety_records_per_product
                FROM entyvio_bronze.drug_product AS dp
                LEFT JOIN entyvio_bronze.drug_safety_information AS dsi
                    ON dp.drug_id = dsi.drug_id
              columns_used:
                - drug_product.product_id
