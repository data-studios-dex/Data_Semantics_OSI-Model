      - name: products_with_multiple_dosage_forms
        business_name: Products with Multiple Dosage Forms
        description: >-
          Count of distinct drug products that have multiple dosage form configurations. 
          This metric identifies products with diverse formulation options for patient 
          convenience and therapeutic flexibility analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(DISTINCT dp.product_id) AS products_with_multiple_forms
                FROM entyvio_bronze.drug_product AS dp
                INNER JOIN entyvio_bronze.drug_dosage_forms AS ddf
                    ON dp.drug_id = ddf.drug_id
                GROUP BY dp.product_id
                HAVING COUNT(DISTINCT ddf.dosage_form_id) > 1
              columns_used:
                - drug_product.product_id
                - drug_product.drug_id
                - drug_dosage_forms.drug_id
                - drug_dosage_forms.dosage_form_id
                
      - name: products_with_multiple_indications
        business_name: Products with Multiple Indications
        description: >-
          Count of distinct drug products that have multiple approved indications. This 
          metric identifies products with broad therapeutic applications for portfolio 
          value and market opportunity analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(DISTINCT dp.product_id) AS products_with_multiple_indications
                FROM entyvio_bronze.drug_product AS dp
                INNER JOIN entyvio_bronze.drug_indications AS di
                    ON dp.drug_id = di.drug_id
                GROUP BY dp.product_id
                HAVING COUNT(DISTINCT di.indication_id) > 1
              columns_used:
                - drug_product.product_id
                - drug_product.drug_id
                - drug_indications.drug_id
                - drug_indications.indication_id
                
      - name: products_with_high_severity_safety_records
        business_name: Products with High Severity Safety Records
        description: >-
          Count of distinct drug products that have at least one high severity safety 
          record. This metric identifies products requiring enhanced pharmacovigilance 
          and risk management attention.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(DISTINCT dp.product_id) AS products_with_high_severity_safety
                FROM entyvio_bronze.drug_product AS dp
                INNER JOIN entyvio_bronze.drug_safety_information AS dsi
                    ON dp.drug_id = dsi.drug_id
                WHERE UPPER(dsi.severity) = 'HIGH'
              columns_used:
                - drug_product.product_id
                - drug_product.drug_id
                - drug_safety_information.drug_id
                - drug_safety_information.severity
                
      - name: average_dosage_forms_per_product
        business_name: Average Dosage Forms per Product
        description: >-
          Average number of dosage form configurations per drug product. This metric 
          provides insight into formulation diversity and product line complexity.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    CAST(COUNT(DISTINCT ddf.dosage_form_id) AS DECIMAL(10,2)) / 
                    NULLIF(COUNT(DISTINCT dp.product_id), 0) AS avg_dosage_forms_per_product
                FROM entyvio_bronze.drug_product AS dp
                LEFT JOIN entyvio_bronze.drug_dosage_forms AS ddf
                    ON dp.drug_id = ddf.drug_id
              columns_used:
                - drug_product.product_id
                - drug_product.drug_id
                - drug_dosage_forms.drug_id
                - drug_dosage_forms.dosage_form_id
                
      - name: average_indications_per_product
        business_name: Average Indications per Product
        description: >-
          Average number of approved indications per drug product. This metric provides 
          insight into therapeutic breadth and regulatory approval scope.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    CAST(COUNT(DISTINCT di.indication_id) AS DECIMAL(10,2)) / 
                    NULLIF(COUNT(DISTINCT dp.product_id), 0) AS avg_indications_per_product
                FROM entyvio_bronze.drug_product AS dp
                LEFT JOIN entyvio_bronze.drug_indications AS di
                    ON dp.drug_id = di.drug_id
              columns_used:
                - drug_product.product_id
                - drug_product.drug_id
                - drug_indications.drug_id
                - drug_indications.indication_id
                
