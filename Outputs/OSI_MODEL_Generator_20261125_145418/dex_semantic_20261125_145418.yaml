version: "1.0"

semantic_model:
  - name: ecom_retail_analytics
    description: >-
      Comprehensive semantic model for e-commerce retail analytics derived from the ecom_bronze schema.
      This model supports analytical queries across customers, orders, products, payments, and shipments.
      The model includes fact tables at multiple grains (order-level and order-item-level) and supports
      dimensional analysis across customer segments, product categories, sales channels, order status,
      payment methods, and time dimensions.
    
    ai_context:
      instructions: >-
        ## Dataset Grain Guide
        
        - **customers**: One row per customer. Use for customer-level analysis and customer counts.
        
        - **orders**: One row per order. Use for order-level metrics such as total_amount, subtotal, 
          discount_amount, tax_amount, and shipping_fee. This is the primary fact table for order-level analysis.
        
        - **order_items**: One row per order line item. Use for product-level analysis and line-item metrics.
          Each order may have multiple order items. Use line_total for line-item revenue analysis.
        
        - **products**: One row per product. Use for product master data and product attributes.
        
        - **product_categories**: One row per product category. Supports hierarchical category analysis
          via parent_category_id self-reference.
        
        - **payments**: One row per payment transaction. Use for payment-level analysis. Typically one payment
          per order, but the model supports multiple payments per order.
        
        - **shipments**: One row per shipment. Use for shipment and logistics analysis. Typically one shipment
          per order.
        
        ## Join Guidance
        
        **Standard Relationships:**
        
        - orders → customers via customer_id (many-to-one)
        - order_items → orders via order_id (many-to-one)
        - order_items → products via product_id (many-to-one)
        - products → product_categories via category_id (many-to-one)
        - payments → orders via order_id (many-to-one)
        - shipments → orders via order_id (many-to-one)
        
        **Hierarchical Relationship:**
        
        - product_categories → product_categories via parent_category_id (self-referencing hierarchy)
          Use recursive queries to traverse the complete category hierarchy.
        
        ## Double-Counting Prevention
        
        **Critical:** orders and order_items have different grains.
        
        - Use **orders.total_amount** for order-level revenue analysis.
        - Use **order_items.line_total** for line-item or product-level revenue analysis.
        - **Never sum orders.total_amount after joining orders to order_items** - this will duplicate order totals.
        - When analyzing products or categories, join through order_items, not orders directly.
        - When calculating order counts from order_items, use COUNT(DISTINCT order_id).
        
        **Example - Correct Product Revenue:**
        ```
        SELECT 
            p.product_name,
            SUM(oi.line_total) AS product_revenue
        FROM order_items oi
        JOIN products p ON oi.product_id = p.product_id
        GROUP BY p.product_name
        ```
        
        **Example - Incorrect (will duplicate):**
        ```
        SELECT 
            p.product_name,
            SUM(o.total_amount) AS product_revenue  -- WRONG: duplicates order totals
        FROM orders o
        JOIN order_items oi ON o.order_id = oi.order_id
        JOIN products p ON oi.product_id = p.product_id
        GROUP BY p.product_name
        ```
        
        ## Time Analysis
        
        - **orders.order_date**: Primary date for order placement analysis. Use for order trends, revenue over time.
        - **payments.paid_at**: Use for payment timing analysis and cash flow analysis.
        - **shipments.shipped_at**: Use for shipment dispatch analysis.
        - **shipments.delivered_at**: Use for delivery performance and fulfillment analysis.
        - **customers.registration_date**: Use for customer acquisition analysis.
        - **products.created_at**: Use for product launch and catalog growth analysis.
        
        ## Metric Selection
        
        **Order-Level Metrics** (use orders table):
        - Total Revenue: SUM(orders.total_amount)
        - Subtotal: SUM(orders.subtotal)
        - Discount Amount: SUM(orders.discount_amount)
        - Tax Amount: SUM(orders.tax_amount)
        - Shipping Fees: SUM(orders.shipping_fee)
        - Order Count: COUNT(orders.order_id) or COUNT(DISTINCT orders.order_id)
        
        **Line-Item Metrics** (use order_items table):
        - Line Item Revenue: SUM(order_items.line_total)
        - Units Sold: SUM(order_items.quantity)
        - Line Item Count: COUNT(order_items.order_item_id)
        
        **Product-Level Analysis:**
        Always join through order_items to products. Use order_items.line_total for product revenue.
        
        **Customer-Level Analysis:**
        Join orders to customers. Use orders.total_amount for customer revenue.
        
        ## Hierarchical Category Analysis
        
        product_categories contains a self-referencing hierarchy via parent_category_id.
        
        To traverse the complete hierarchy, use recursive CTEs:
        
        ```sql
        WITH RECURSIVE category_hierarchy AS (
            SELECT 
                category_id,
                category_name,
                parent_category_id,
                category_name AS root_category,
                0 AS level
            FROM product_categories
            WHERE parent_category_id IS NULL
            
            UNION ALL
            
            SELECT 
                pc.category_id,
                pc.category_name,
                pc.parent_category_id,
                ch.root_category,
                ch.level + 1
            FROM product_categories pc
            JOIN category_hierarchy ch ON pc.parent_category_id = ch.category_id
        )
        SELECT * FROM category_hierarchy
        ```
        
        ## Query Restrictions
        
        - Always filter by is_active = true when analyzing current customers, products, or categories
          unless historical analysis is explicitly required.
        - Order status values include: Shipped, Pending, Delivered, Cancelled (use exact values).
        - Payment status values include: Completed, Pending, Failed (use exact values).
        - Shipment status values include: In Transit, Delivered, Pending (use exact values).
        - Currency is stored as 3-letter code (USD). Always verify currency when aggregating amounts.
        - PII fields are redacted in sample data. Use aggregated analysis only.
        
        ## Calculated Metrics
        
        - **Gross Profit**: orders.total_amount - (order_items.quantity * products.cost_price)
          Requires joining orders → order_items → products. Aggregate at appropriate grain.
        
        - **Discount Percentage**: (orders.discount_amount / orders.subtotal) * 100
          Calculate at order level. Handle division by zero.
        
        - **Average Order Value**: SUM(orders.total_amount) / COUNT(DISTINCT orders.order_id)
        
        - **Delivery Time**: DATEDIFF(day, shipments.shipped_at, shipments.delivered_at)
          Only for delivered shipments where both timestamps exist.
    
    datasets:
      - name: customers
        business_name: Customers
        description: >-
          Customer master data containing one row per customer. Includes customer demographics,
          contact information, location, segment classification, and account status. Use this dataset
          for customer-level analysis, customer counts, and customer segmentation analysis.
          Grain: One row per customer.
        source: ecom_bronze.customers
        primary_key:
          - customer_id
        fields:
          - name: customer_id
            business_name: Customer Identifier
            description: Unique identifier for a customer. Primary key.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: customer_code
            business_name: Customer Code
            description: Business reference code assigned to the customer.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: first_name
            business_name: First Name
            description: First name of the customer. PII field.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: last_name
            business_name: Last Name
            description: Last name of the customer. PII field.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: email
            business_name: Email
            description: Email address of the customer. PII field.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: phone
            business_name: Phone
            description: Phone number of the customer. PII field.
            sql_type: STRING
            constraints: []
          
          - name: gender
            business_name: Gender
            description: Gender of the customer. Categorical dimension for demographic analysis.
            sql_type: STRING
            constraints: []
            dimension:
              is_time: false
          
          - name: date_of_birth
            business_name: Date Of Birth
            description: Date of birth of the customer. PII field. Can be used to derive age.
            sql_type: DATE
            constraints: []
          
          - name: city
            business_name: City
            description: City where the customer resides. Geographic dimension.
            sql_type: STRING
            constraints: []
            dimension:
              is_time: false
          
          - name: state
            business_name: State
            description: State or province where the customer resides. Geographic dimension.
            sql_type: STRING
            constraints: []
            dimension:
              is_time: false
          
          - name: country
            business_name: Country
            description: Country where the customer resides. Geographic dimension.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: postal_code
            business_name: Postal Code
            description: Postal or ZIP code of the customer's address. Geographic dimension.
            sql_type: STRING
            constraints: []
            dimension:
              is_time: false
          
          - name: customer_segment
            business_name: Customer Segment
            description: >-
              Indicates the current segment classification of the customer. 
              Business dimension for customer segmentation analysis.
            sql_type: STRING
            constraints: []
            dimension:
              is_time: false
          
          - name: registration_date
            business_name: Registration Date
            description: >-
              Date when the customer registered. Time dimension for customer acquisition analysis.
            sql_type: DATE
            constraints: []
            dimension:
              is_time: true
          
          - name: is_active
            business_name: Is Active
            description: >-
              Indicates whether the customer account is currently active. 
              Boolean dimension for filtering active customers.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
            constraints: []
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: orders
        business_name: Orders
        description: >-
          Order header data containing one row per order. This is the primary fact table for order-level
          analysis. Contains order totals, discounts, taxes, shipping fees, and order status. Use this
          dataset for order-level revenue metrics, order counts, and order status analysis.
          Grain: One row per order.
        source: ecom_bronze.orders
        primary_key:
          - order_id
        fields:
          - name: order_id
            business_name: Order Identifier
            description: Unique identifier for an order. Primary key.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_number
            business_name: Order Number
            description: Business reference number assigned to the order.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: customer_id
            business_name: Customer ID
            description: References the related customer record. Foreign key to customers.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: order_date
            business_name: Order Date
            description: >-
              Timestamp recording when the order was placed. Primary time dimension for order analysis.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: order_status
            business_name: Order Status
            description: >-
              Indicates the current status of the order. Business dimension for order status analysis.
              Values include: Shipped, Pending, Delivered, Cancelled.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: sales_channel
            business_name: Sales Channel
            description: >-
              Indicates the channel through which the order was placed. Business dimension for channel analysis.
            sql_type: STRING
            constraints: []
            dimension:
              is_time: false
          
          - name: ship_city
            business_name: Ship City
            description: City to which the order is shipped. Geographic dimension.
            sql_type: STRING
            constraints: []
            dimension:
              is_time: false
          
          - name: ship_state
            business_name: Ship State
            description: State or province to which the order is shipped. Geographic dimension.
            sql_type: STRING
            constraints: []
            dimension:
              is_time: false
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: Postal or ZIP code to which the order is shipped. Geographic dimension.
            sql_type: STRING
            constraints: []
            dimension:
              is_time: false
          
          - name: subtotal
            business_name: Subtotal
            description: >-
              Monetary amount representing the order subtotal before discounts and taxes.
              Order-level measure for subtotal analysis.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
          
          - name: discount_amount
            business_name: Discount Amount
            description: >-
              Monetary amount representing the total discount applied to the order.
              Order-level measure for discount analysis.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
          
          - name: tax_amount
            business_name: Tax Amount
            description: >-
              Monetary amount representing the tax charged on the order.
              Order-level measure for tax analysis.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
          
          - name: shipping_fee
            business_name: Shipping Fee
            description: >-
              Monetary amount representing the shipping cost for the order.
              Order-level measure for shipping cost analysis.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
          
          - name: total_amount
            business_name: Total Amount
            description: >-
              Monetary amount representing the final total of the order.
              Primary order-level revenue measure. Use for order-level revenue analysis.
              WARNING: Do not sum this field after joining to order_items - use order_items.line_total instead.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
          
          - name: currency
            business_name: Currency
            description: Currency code for the order amounts. Dimension for currency analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
            constraints: []
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: order_items
        business_name: Order Items
        description: >-
          Order line item data containing one row per order line item. Each order may have multiple
          line items. Use this dataset for product-level analysis, line-item revenue, and quantity analysis.
          Grain: One row per order line item.
        source: ecom_bronze.order_items
        primary_key:
          - order_item_id
        fields:
          - name: order_item_id
            business_name: Order Item Identifier
            description: Unique identifier for an order line item. Primary key.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: References the related order record. Foreign key to orders.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: line_number
            business_name: Line Number
            description: Sequential line number within the order.
            sql_type: INT
            constraints:
              - NOT NULL
          
          - name: product_id
            business_name: Product ID
            description: References the related product record. Foreign key to products.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: quantity
            business_name: Quantity
            description: >-
              Number of units ordered for this line item. Line-item measure for quantity analysis.
            sql_type: INT
            constraints:
              - NOT NULL
          
          - name: unit_price
            business_name: Unit Price
            description: >-
              Monetary amount representing the price per unit. Line-item measure for pricing analysis.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
          
          - name: discount_pct
            business_name: Discount Pct
            description: >-
              Percentage discount applied to the line item. Line-item measure for discount analysis.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
          
          - name: line_total
            business_name: Line Total
            description: >-
              Monetary amount representing the total for this line item.
              Primary line-item revenue measure. Use for product-level and line-item revenue analysis.
              This is the correct measure for product revenue analysis.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
            constraints: []
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: products
        business_name: Products
        description: >-
          Product master data containing one row per product. Includes product attributes, pricing,
          cost, inventory, and category assignment. Use this dataset for product-level analysis and
          product attribute analysis.
          Grain: One row per product.
        source: ecom_bronze.products
        primary_key:
          - product_id
        fields:
          - name: product_id
            business_name: Product Identifier
            description: Unique identifier for a product. Primary key.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: sku
            business_name: SKU
            description: Stock keeping unit code for the product.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: product_name
            business_name: Product Name
            description: Name of the product. Dimension for product analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: category_id
            business_name: Category ID
            description: References the related product category record. Foreign key to product_categories.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: brand
            business_name: Brand
            description: Brand name of the product. Dimension for brand analysis.
            sql_type: STRING
            constraints: []
            dimension:
              is_time: false
          
          - name: description
            business_name: Description
            description: Detailed description of the product.
            sql_type: STRING
            constraints: []
          
          - name: unit_price
            business_name: Unit Price
            description: >-
              Monetary amount representing the selling price per unit. Product-level measure.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
          
          - name: cost_price
            business_name: Cost Price
            description: >-
              Monetary amount representing the cost per unit. Product-level measure for cost analysis.
            sql_type: DECIMAL
            constraints: []
          
          - name: currency
            business_name: Currency
            description: Currency code for the product prices. Dimension for currency analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: stock_quantity
            business_name: Stock Quantity
            description: >-
              Current inventory quantity available for the product. Inventory measure.
            sql_type: INT
            constraints:
              - NOT NULL
          
          - name: is_active
            business_name: Is Active
            description: >-
              Indicates whether the product is currently active for sale.
              Boolean dimension for filtering active products.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: created_at
            business_name: Created At
            description: >-
              Timestamp recording when the product was created in the system.
              Time dimension for product launch analysis.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
            constraints: []
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: product_categories
        business_name: Product Categories
        description: >-
          Product category master data containing one row per product category. Supports hierarchical
          category structure via parent_category_id self-reference. Use this dataset for category-level
          analysis and hierarchical category analysis.
          Grain: One row per product category.
        source: ecom_bronze.product_categories
        primary_key:
          - category_id
        fields:
          - name: category_id
            business_name: Category Identifier
            description: Unique identifier for a product category. Primary key.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: category_name
            business_name: Category Name
            description: Name of the product category. Dimension for category analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: parent_category_id
            business_name: Parent Category ID
            description: >-
              References the parent category in the hierarchy. Foreign key to product_categories (self-reference).
              Enables hierarchical category analysis using recursive queries.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
          
          - name: description
            business_name: Description
            description: Detailed description of the product category.
            sql_type: STRING
            constraints: []
          
          - name: is_active
            business_name: Is Active
            description: >-
              Indicates whether the category is currently active.
              Boolean dimension for filtering active categories.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
            constraints: []
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: payments
        business_name: Payments
        description: >-
          Payment transaction data containing one row per payment transaction. Typically one payment
          per order, but supports multiple payments per order. Use this dataset for payment analysis,
          payment method analysis, and cash flow analysis.
          Grain: One row per payment transaction.
        source: ecom_bronze.payments
        primary_key:
          - payment_id
        fields:
          - name: payment_id
            business_name: Payment Identifier
            description: Unique identifier for a payment transaction. Primary key.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: References the related order record. Foreign key to orders.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: payment_method
            business_name: Payment Method
            description: >-
              Indicates the method used for payment. Business dimension for payment method analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: payment_status
            business_name: Payment Status
            description: >-
              Indicates the current status of the payment. Business dimension for payment status analysis.
              Values include: Completed, Pending, Failed.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: amount
            business_name: Amount
            description: >-
              Monetary amount representing the payment value. Payment-level measure.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
          
          - name: currency
            business_name: Currency
            description: Currency code for the payment amount. Dimension for currency analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: transaction_ref
            business_name: Transaction Ref
            description: External reference number for the payment transaction. PII field.
            sql_type: STRING
            constraints: []
          
          - name: gateway
            business_name: Gateway
            description: >-
              Name of the payment gateway used to process the transaction. Dimension for gateway analysis.
            sql_type: STRING
            constraints: []
            dimension:
              is_time: false
          
          - name: paid_at
            business_name: Paid At
            description: >-
              Timestamp recording when the payment was completed. Time dimension for payment timing analysis.
            sql_type: TIMESTAMP
            constraints: []
            dimension:
              is_time: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
            constraints: []
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: shipments
        business_name: Shipments
        description: >-
          Shipment data containing one row per shipment. Typically one shipment per order.
          Use this dataset for shipment analysis, delivery performance analysis, and logistics analysis.
          Grain: One row per shipment.
        source: ecom_bronze.shipments
        primary_key:
          - shipment_id
        fields:
          - name: shipment_id
            business_name: Shipment Identifier
            description: Unique identifier for a shipment. Primary key.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: References the related order record. Foreign key to orders.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: carrier
            business_name: Carrier
            description: >-
              Name of the shipping carrier handling the shipment. Dimension for carrier analysis.
            sql_type: STRING
            constraints: []
            dimension:
              is_time: false
          
          - name: tracking_number
            business_name: Tracking Number
            description: Tracking number assigned by the carrier for the shipment.
            sql_type: STRING
            constraints: []
          
          - name: shipment_status
            business_name: Shipment Status
            description: >-
              Indicates the current status of the shipment. Business dimension for shipment status analysis.
              Values include: In Transit, Delivered, Pending.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: shipped_at
            business_name: Shipped At
            description: >-
              Timestamp recording when the shipment was dispatched. Time dimension for shipment dispatch analysis.
            sql_type: TIMESTAMP
            constraints: []
            dimension:
              is_time: true
          
          - name: delivered_at
            business_name: Delivered At
            description: >-
              Timestamp recording when the shipment was delivered. Time dimension for delivery analysis.
            sql_type: TIMESTAMP
            constraints: []
            dimension:
              is_time: true
          
          - name: ship_city
            business_name: Ship City
            description: City to which the shipment is being sent. Geographic dimension.
            sql_type: STRING
            constraints: []
            dimension:
              is_time: false
          
          - name: ship_state
            business_name: Ship State
            description: State or province to which the shipment is being sent. Geographic dimension.
            sql_type: STRING
            constraints: []
            dimension:
              is_time: false
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: Postal or ZIP code to which the shipment is being sent. Geographic dimension.
            sql_type: STRING
            constraints: []
            dimension:
              is_time: false
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
            constraints: []
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
    
    relationships:
      - name: orders_to_customers
        left_dataset: orders
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship from orders to customers. Each order is placed by exactly one customer.
          Multiple orders can belong to the same customer. Join on customer_id equality.
      
      - name: order_items_to_orders
        left_dataset: order_items
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship from order_items to orders. Each order item belongs to exactly one order.
          Multiple order items can belong to the same order. Join on order_id equality.
          IMPORTANT: When joining order_items to orders, do not sum orders.total_amount as this will duplicate
          order totals. Use order_items.line_total for line-item revenue analysis.
      
      - name: order_items_to_products
        left_dataset: order_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship from order_items to products. Each order item references exactly one product.
          Multiple order items can reference the same product. Join on product_id equality.
          Use this relationship for product-level revenue analysis using order_items.line_total.
      
      - name: products_to_product_categories
        left_dataset: products
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship from products to product_categories. Each product belongs to exactly one category.
          Multiple products can belong to the same category. Join on category_id equality.
      
      - name: product_categories_hierarchy
        left_dataset: product_categories
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - parent_category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Self-referencing hierarchical relationship within product_categories. Each category may have a parent category,
          forming a category hierarchy. Categories with NULL parent_category_id are root categories.
          Use recursive CTEs to traverse the complete hierarchy. Join on parent_category_id = category_id.
          Example recursive query:
          WITH RECURSIVE category_hierarchy AS (
              SELECT category_id, category_name, parent_category_id, 0 AS level
              FROM product_categories
              WHERE parent_category_id IS NULL
              UNION ALL
              SELECT pc.category_id, pc.category_name, pc.parent_category_id, ch.level + 1
              FROM product_categories pc
              JOIN category_hierarchy ch ON pc.parent_category_id = ch.category_id
          )
          SELECT * FROM category_hierarchy
      
      - name: payments_to_orders
        left_dataset: payments
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship from payments to orders. Each payment is associated with exactly one order.
          Typically one payment per order, but multiple payments per order are supported. Join on order_id equality.
      
      - name: shipments_to_orders
        left_dataset: shipments
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship from shipments to orders. Each shipment is associated with exactly one order.
          Typically one shipment per order. Join on order_id equality.
    
    metrics:
      - name: total_revenue
        business_name: Total Revenue
        description: >-
          Total revenue from all orders. Calculated as the sum of order total amounts.
          This is an order-level metric. Use orders.total_amount for calculation.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(orders.total_amount) AS total_revenue
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.total_amount
      
      - name: total_order_count
        business_name: Total Order Count
        description: >-
          Total count of orders. Calculated as the count of distinct order IDs.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(orders.order_id) AS total_order_count
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.order_id
      
      - name: total_customer_count
        business_name: Total Customer Count
        description: >-
          Total count of customers. Calculated as the count of distinct customer IDs.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(customers.customer_id) AS total_customer_count
                FROM ecom_bronze.customers AS customers
              columns_used:
                - customers.customer_id
      
      - name: active_customer_count
        business_name: Active Customer Count
        description: >-
          Count of active customers. Calculated as the count of customers where is_active is true.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(customers.customer_id) AS active_customer_count
                FROM ecom_bronze.customers AS customers
                WHERE customers.is_active = true
              columns_used:
                - customers.customer_id
                - customers.is_active
      
      - name: total_units_sold
        business_name: Total Units Sold
        description: >-
          Total quantity of units sold across all order items. Calculated as the sum of quantity
          from order_items. This is a line-item level metric.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(order_items.quantity) AS total_units_sold
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.quantity
      
      - name: total_discount_amount
        business_name: Total Discount Amount
        description: >-
          Total discount amount applied to all orders. Calculated as the sum of discount_amount
          from orders. This is an order-level metric.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(orders.discount_amount) AS total_discount_amount
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.discount_amount
      
      - name: total_tax_amount
        business_name: Total Tax Amount
        description: >-
          Total tax amount collected from all orders. Calculated as the sum of tax_amount
          from orders. This is an order-level metric.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(orders.tax_amount) AS total_tax_amount
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.tax_amount
      
      - name: total_shipping_fees
        business_name: Total Shipping Fees
        description: >-
          Total shipping fees collected from all orders. Calculated as the sum of shipping_fee
          from orders. This is an order-level metric.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(orders.shipping_fee) AS total_shipping_fees
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.shipping_fee
      
      - name: average_order_value
        business_name: Average Order Value
        description: >-
          Average order value calculated as total revenue divided by total order count.
          This metric represents the average amount per order.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(orders.order_id) = 0 THEN 0
                        ELSE SUM(orders.total_amount) / COUNT(orders.order_id)
                    END AS average_order_value
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.total_amount
                - orders.order_id
      
      - name: average_discount_percentage
        business_name: Average Discount Percentage
        description: >-
          Average discount percentage across all orders. Calculated as the ratio of total discount amount
          to total subtotal, expressed as a percentage. Handles division by zero.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    CASE
                        WHEN SUM(orders.subtotal) = 0 THEN 0
                        ELSE (SUM(orders.discount_amount) / SUM(orders.subtotal)) * 100
                    END AS average_discount_percentage
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.discount_amount
                - orders.subtotal
      
      - name: product_revenue
        business_name: Product Revenue
        description: >-
          Revenue by product. Calculated as the sum of line_total from order_items grouped by product.
          This metric correctly calculates product-level revenue using line-item data.
          Result grain: one row per product.
        return_type: decimal
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    products.product_id,
                    products.product_name,
                    SUM(order_items.line_total) AS product_revenue
                FROM ecom_bronze.order_items AS order_items
                JOIN ecom_bronze.products AS products
                    ON order_items.product_id = products.product_id
                GROUP BY products.product_id, products.product_name
              columns_used:
                - order_items.line_total
                - order_items.product_id
                - products.product_id
                - products.product_name
      
      - name: category_revenue
        business_name: Category Revenue
        description: >-
          Revenue by product category. Calculated as the sum of line_total from order_items
          joined through products to product_categories, grouped by category.
          Result grain: one row per category.
        return_type: decimal
        result_grain: one row per category
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    pc.category_id,
                    pc.category_name,
                    SUM(oi.line_total) AS category_revenue
                FROM ecom_bronze.order_items AS oi
                JOIN ecom_bronze.products AS p
                    ON oi.product_id = p.product_id
                JOIN ecom_bronze.product_categories AS pc
                    ON p.category_id = pc.category_id
                GROUP BY pc.category_id, pc.category_name
              columns_used:
                - order_items.line_total
                - order_items.product_id
                - products.product_id
                - products.category_id
                - product_categories.category_id
                - product_categories.category_name
      
      - name: customer_revenue
        business_name: Customer Revenue
        description: >-
          Revenue by customer. Calculated as the sum of total_amount from orders grouped by customer.
          This is an order-level aggregation by customer.
          Result grain: one row per customer.
        return_type: decimal
        result_grain: one row per customer
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    customers.customer_id,
                    customers.first_name,
                    customers.last_name,
                    SUM(orders.total_amount) AS customer_revenue
                FROM ecom_bronze.orders AS orders
                JOIN ecom_bronze.customers AS customers
                    ON orders.customer_id = customers.customer_id
                GROUP BY customers.customer_id, customers.first_name, customers.last_name
              columns_used:
                - orders.total_amount
                - orders.customer_id
                - customers.customer_id
                - customers.first_name
                - customers.last_name
      
      - name: orders_per_customer
        business_name: Orders Per Customer
        description: >-
          Average number of orders per customer. Calculated as total order count divided by
          total customer count (customers who have placed at least one order).
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT orders.customer_id) = 0 THEN 0
                        ELSE CAST(COUNT(orders.order_id) AS DECIMAL) / COUNT(DISTINCT orders.customer_id)
                    END AS orders_per_customer
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.order_id
                - orders.customer_id
      
      - name: revenue_by_sales_channel
        business_name: Revenue By Sales Channel
        description: >-
          Revenue by sales channel. Calculated as the sum of total_amount from orders grouped by sales_channel.
          Result grain: one row per sales channel.
        return_type: decimal
        result_grain: one row per sales channel
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    orders.sales_channel,
                    SUM(orders.total_amount) AS revenue_by_sales_channel
                FROM ecom_bronze.orders AS orders
                GROUP BY orders.sales_channel
              columns_used:
                - orders.sales_channel
                - orders.total_amount
      
      - name: revenue_by_order_status
        business_name: Revenue By Order Status
        description: >-
          Revenue by order status. Calculated as the sum of total_amount from orders grouped by order_status.
          Result grain: one row per order status.
        return_type: decimal
        result_grain: one row per order status
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    orders.order_status,
                    SUM(orders.total_amount) AS revenue_by_order_status
                FROM ecom_bronze.orders AS orders
                GROUP BY orders.order_status
              columns_used:
                - orders.order_status
                - orders.total_amount
      
      - name: revenue_by_customer_segment
        business_name: Revenue By Customer Segment
        description: >-
          Revenue by customer segment. Calculated as the sum of total_amount from orders
          joined to customers, grouped by customer_segment.
          Result grain: one row per customer segment.
        return_type: decimal
        result_grain: one row per customer segment
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    customers.customer_segment,
                    SUM(orders.total_amount) AS revenue_by_customer_segment
                FROM ecom_bronze.orders AS orders
                JOIN ecom_bronze.customers AS customers
                    ON orders.customer_id = customers.customer_id
                GROUP BY customers.customer_segment
              columns_used:
                - orders.total_amount
                - orders.customer_id
                - customers.customer_id
                - customers.customer_segment
      
      - name: payment_amount_by_method
        business_name: Payment Amount By Method
        description: >-
          Payment amount by payment method. Calculated as the sum of amount from payments
          grouped by payment_method.
          Result grain: one row per payment method.
        return_type: decimal
        result_grain: one row per payment method
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    payments.payment_method,
                    SUM(payments.amount) AS payment_amount_by_method
                FROM ecom_bronze.payments AS payments
                GROUP BY payments.payment_method
              columns_used:
                - payments.payment_method
                - payments.amount
      
      - name: completed_payment_count
        business_name: Completed Payment Count
        description: >-
          Count of completed payments. Calculated as the count of payments where payment_status is 'Completed'.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(payments.payment_id) AS completed_payment_count
                FROM ecom_bronze.payments AS payments
                WHERE payments.payment_status = 'Completed'
              columns_used:
                - payments.payment_id
                - payments.payment_status
      
      - name: shipment_count
        business_name: Shipment Count
        description: >-
          Total count of shipments. Calculated as the count of shipment IDs.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(shipments.shipment_id) AS shipment_count
                FROM ecom_bronze.shipments AS shipments
              columns_used:
                - shipments.shipment_id
      
      - name: delivered_shipment_count
        business_name: Delivered Shipment Count
        description: >-
          Count of delivered shipments. Calculated as the count of shipments where shipment_status is 'Delivered'.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(shipments.shipment_id) AS delivered_shipment_count
                FROM ecom_bronze.shipments AS shipments
                WHERE shipments.shipment_status = 'Delivered'
              columns_used:
                - shipments.shipment_id
                - shipments.shipment_status
      
      - name: average_delivery_time_days
        business_name: Average Delivery Time Days
        description: >-
          Average delivery time in days. Calculated as the average difference between delivered_at
          and shipped_at for delivered shipments. Only includes shipments where both timestamps exist.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    AVG(DATEDIFF(shipments.delivered_at, shipments.shipped_at)) AS average_delivery_time_days
                FROM ecom_bronze.shipments AS shipments
                WHERE shipments.shipped_at IS NOT NULL
                    AND shipments.delivered_at IS NOT NULL
                    AND shipments.shipment_status = 'Delivered'
              columns_used:
                - shipments.delivered_at
                - shipments.shipped_at
                - shipments.shipment_status
      
      - name: monthly_revenue
        business_name: Monthly Revenue
        description: >-
          Revenue by month. Calculated as the sum of total_amount from orders grouped by month.
          Uses order_date for time grouping.
          Result grain: one row per month.
        return_type: decimal
        result_grain: one row per month
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    DATE_TRUNC('MONTH', orders.order_date) AS order_month,
                    SUM(orders.total_amount) AS monthly_revenue
                FROM ecom_bronze.orders AS orders
                GROUP BY DATE_TRUNC('MONTH', orders.order_date)
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.total_amount
      
      - name: monthly_order_count
        business_name: Monthly Order Count
        description: >-
          Order count by month. Calculated as the count of orders grouped by month.
          Uses order_date for time grouping.
          Result grain: one row per month.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    DATE_TRUNC('MONTH', orders.order_date) AS order_month,
                    COUNT(orders.order_id) AS monthly_order_count
                FROM ecom_bronze.orders AS orders
                GROUP BY DATE_TRUNC('MONTH', orders.order_date)
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.order_id
      
      - name: line_item_revenue
        business_name: Line Item Revenue
        description: >-
          Derived line item revenue calculated from quantity, unit_price, and discount_pct.
          Formula: quantity * unit_price * (1 - discount_pct / 100).
          This represents the calculated line total and should match the stored line_total field.
          Result grain: one row per order item.
        return_type: decimal
        result_grain: one row per order item
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    order_items.order_item_id,
                    order_items.quantity * order_items.unit_price * (1 - order_items.discount_pct / 100) AS line_item_revenue
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.order_item_id
                - order_items.quantity
                - order_items.unit_price
                - order_items.discount_pct
      
      - name: product_profit_margin
        business_name: Product Profit Margin
        description: >-
          Product profit margin calculated as (unit_price - cost_price) / unit_price * 100.
          Represents the profit margin percentage for each product based on list prices.
          Handles division by zero. Only includes products where cost_price is available.
          Result grain: one row per product.
        return_type: decimal
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    products.product_id,
                    products.product_name,
                    CASE
                        WHEN products.unit_price = 0 THEN 0
                        ELSE ((products.unit_price - products.cost_price) / products.unit_price) * 100
                    END AS product_profit_margin
                FROM ecom_bronze.products AS products
                WHERE products.cost_price IS NOT NULL
              columns_used:
                - products.product_id
                - products.product_name
                - products.unit_price
                - products.cost_price
      
      - name: revenue_by_country
        business_name: Revenue By Country
        description: >-
          Revenue by customer country. Calculated as the sum of total_amount from orders
          joined to customers, grouped by country.
          Result grain: one row per country.
        return_type: decimal
        result_grain: one row per country
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    customers.country,
                    SUM(orders.total_amount) AS revenue_by_country
                FROM ecom_bronze.orders AS orders
                JOIN ecom_bronze.customers AS customers
                    ON orders.customer_id = customers.customer_id
                GROUP BY customers.country
              columns_used:
                - orders.total_amount
                - orders.customer_id
                - customers.customer_id
                - customers.country
      
      - name: revenue_by_state
        business_name: Revenue By State
        description: >-
          Revenue by customer state. Calculated as the sum of total_amount from orders
          joined to customers, grouped by state.
          Result grain: one row per state.
        return_type: decimal
        result_grain: one row per state
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    customers.state,
                    SUM(orders.total_amount) AS revenue_by_state
                FROM ecom_bronze.orders AS orders
                JOIN ecom_bronze.customers AS customers
                    ON orders.customer_id = customers.customer_id
                GROUP BY customers.state
              columns_used:
                - orders.total_amount
                - orders.customer_id
                - customers.customer_id
                - customers.state
      
      - name: product_units_sold
        business_name: Product Units Sold
        description: >-
          Units sold by product. Calculated as the sum of quantity from order_items grouped by product.
          Result grain: one row per product.
        return_type: integer
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    products.product_id,
                    products.product_name,
                    SUM(order_items.quantity) AS product_units_sold
                FROM ecom_bronze.order_items AS order_items
                JOIN ecom_bronze.products AS products
                    ON order_items.product_id = products.product_id
                GROUP BY products.product_id, products.product_name
              columns_used:
                - order_items.quantity
                - order_items.product_id
                - products.product_id
                - products.product_name
      
      - name: average_unit_price_by_product
        business_name: Average Unit Price By Product
        description: >-
          Average unit price by product from order items. Calculated as the average of unit_price
          from order_items grouped by product. This represents the average selling price.
          Result grain: one row per product.
        return_type: decimal
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    products.product_id,
                    products.product_name,
                    AVG(order_items.unit_price) AS average_unit_price_by_product
                FROM ecom_bronze.order_items AS order_items
                JOIN ecom_bronze.products AS products
                    ON order_items.product_id = products.product_id
                GROUP BY products.product_id, products.product_name
              columns_used:
                - order_items.unit_price
                - order_items.product_id
                - products.product_id
                - products.product_name
      
      - name: shipment_count_by_carrier
        business_name: Shipment Count By Carrier
        description: >-
          Shipment count by carrier. Calculated as the count of shipments grouped by carrier.
          Result grain: one row per carrier.
        return_type: integer
        result_grain: one row per carrier
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    shipments.carrier,
                    COUNT(shipments.shipment_id) AS shipment_count_by_carrier
                FROM ecom_bronze.shipments AS shipments
                GROUP BY shipments.carrier
              columns_used:
                - shipments.carrier
                - shipments.shipment_id
      
      - name: on_time_delivery_rate
        business_name: On Time Delivery Rate
        description: >-
          Percentage of shipments delivered on time. Calculated as the count of delivered shipments
          divided by total shipments with delivery information, expressed as a percentage.
          Only includes shipments where delivered_at exists.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(shipments.shipment_id) = 0 THEN 0
                        ELSE (CAST(SUM(CASE WHEN shipments.shipment_status = 'Delivered' THEN 1 ELSE 0 END) AS DECIMAL) 
                              / COUNT(shipments.shipment_id)) * 100
                    END AS on_time_delivery_rate
                FROM ecom_bronze.shipments AS shipments
                WHERE shipments.delivered_at IS NOT NULL
              columns_used:
                - shipments.shipment_id
                - shipments.shipment_status
                - shipments.delivered_at