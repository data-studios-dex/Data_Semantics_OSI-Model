version: "1.0"

semantic_model:
  - name: retail_analytics_model
    description: >-
      Comprehensive semantic model for retail analytics covering customer relationship management,
      sales transactions, order fulfillment, payments, product catalog, and shipment operations.
      This model supports end-to-end analytical queries across the retail value chain including
      customer behavior analysis, sales performance, product profitability, payment processing,
      and logistics operations.
    
    ai_context:
      instructions: >-
        This semantic model represents a retail analytics domain with the following key datasets and analytical grains:
        
        DATASET GRAINS:
        - CUSTOMERS: One row per customer. Use for customer-level analysis and customer segmentation.
        - ORDERS: One row per order. Use for order-level revenue, cost, and transaction analysis.
        - ORDER_ITEMS: One row per order line item. Use for product-level sales analysis within orders.
        - PAYMENTS: One row per payment transaction. Use for payment method analysis and payment status tracking.
        - PRODUCTS: One row per product. Use for product catalog analysis, pricing, and inventory.
        - PRODUCT_CATEGORIES: One row per product category. Contains hierarchical category structure with parent-child relationships.
        - SHIPMENTS: One row per shipment. Use for logistics analysis and delivery performance.
        
        RELATIONSHIP GUIDANCE:
        - ORDERS to CUSTOMERS: Many-to-one relationship via customer_id. One customer can have many orders.
        - ORDER_ITEMS to ORDERS: Many-to-one relationship via order_id. One order can have many line items.
        - ORDER_ITEMS to PRODUCTS: Many-to-one relationship via product_id. One product can appear in many order items.
        - PAYMENTS to ORDERS: Many-to-one relationship via order_id. One order can have multiple payment transactions.
        - PRODUCTS to PRODUCT_CATEGORIES: Many-to-one relationship via category_id. One category contains many products.
        - PRODUCT_CATEGORIES to PRODUCT_CATEGORIES: Recursive relationship via parent_category_id. Represents category hierarchy.
        - SHIPMENTS to ORDERS: Many-to-one relationship via order_id. One order can have multiple shipments.
        
        DOUBLE-COUNTING PREVENTION:
        - CRITICAL: ORDERS.total_amount, ORDERS.subtotal, ORDERS.discount_amount, ORDERS.tax_amount, and ORDERS.shipping_fee are order-level measures.
          Do NOT sum these fields after joining ORDERS to ORDER_ITEMS, as this will multiply the order totals by the number of line items.
        - For order-level revenue analysis, query ORDERS directly or use DISTINCT order_id when joining to ORDER_ITEMS.
        - For product-level revenue analysis within orders, use ORDER_ITEMS.line_total which represents line-item-level revenue.
        - For payment analysis, use PAYMENTS.amount which represents payment-level amounts.
        - When analyzing products sold, use ORDER_ITEMS.quantity and ORDER_ITEMS.line_total, not ORDERS.total_amount.
        
        METRIC SELECTION GUIDANCE:
        - Total Revenue: Use SUM(ORDERS.total_amount) for order-level revenue. Query ORDERS dataset directly.
        - Product Revenue: Use SUM(ORDER_ITEMS.line_total) for product-level revenue analysis. Query ORDER_ITEMS dataset.
        - Customer Revenue: Join ORDERS to CUSTOMERS and sum ORDERS.total_amount grouped by customer.
        - Order Count: Use COUNT(DISTINCT ORDERS.order_id).
        - Average Order Value: Use SUM(ORDERS.total_amount) / COUNT(DISTINCT ORDERS.order_id).
        - Units Sold: Use SUM(ORDER_ITEMS.quantity) from ORDER_ITEMS dataset.
        - Product Profit: Calculate as (ORDER_ITEMS.unit_price - PRODUCTS.cost_price) * ORDER_ITEMS.quantity.
        
        TIME ANALYSIS GUIDANCE:
        - For sales trends over time, use ORDERS.order_date as the primary time dimension.
        - For customer acquisition analysis, use CUSTOMERS.registration_date.
        - For shipment performance analysis, use SHIPMENTS.shipped_at and SHIPMENTS.delivered_at.
        - For payment timing analysis, use PAYMENTS.paid_at.
        - For product catalog changes, use PRODUCTS.created_at.
        - All timestamp fields support date truncation for daily, monthly, quarterly, and yearly aggregations.
        
        HIERARCHICAL ANALYSIS:
        - PRODUCT_CATEGORIES contains a recursive hierarchy via parent_category_id.
        - To analyze category hierarchies, use recursive CTEs to traverse parent-child relationships.
        - Category rollups require joining PRODUCT_CATEGORIES to itself to aggregate child category metrics to parent categories.
        
        DIMENSIONAL ANALYSIS:
        - Customer Segment: Use CUSTOMERS.customer_segment for customer segmentation analysis (e.g., Premium, Standard).
        - Order Status: Use ORDERS.order_status for order lifecycle analysis (e.g., Shipped, Delivered, Cancelled).
        - Sales Channel: Use ORDERS.sales_channel for channel performance analysis (e.g., Online, In-Store).
        - Payment Method: Use PAYMENTS.payment_method for payment method analysis (e.g., Credit Card, PayPal).
        - Shipment Status: Use SHIPMENTS.shipment_status for logistics performance (e.g., In Transit, Delivered).
        - Geographic Analysis: Use CUSTOMERS.country, CUSTOMERS.state, CUSTOMERS.city for customer geography.
        - Product Brand: Use PRODUCTS.brand for brand performance analysis.
        
        QUERY RESTRICTIONS:
        - PII fields are marked with Is PII = Yes. Handle with appropriate data governance controls.
        - Inactive records: Filter by is_active = true for current customers, products, and categories.
        - Currency: All monetary amounts are in the currency specified in the currency field. Ensure currency consistency in cross-currency analysis.
        - Null handling: Some optional fields may contain NULL values. Use COALESCE or NULL-safe operations where appropriate.

    datasets:
      - name: customers
        business_name: Customers
        description: >-
          Stores comprehensive customer profiles including personal information, contact details,
          geographic location, customer segmentation, and registration history. Analytical grain
          is one row per customer. Use this dataset for customer-level analysis, customer segmentation,
          geographic distribution, and customer acquisition trends.
        source: CRM_PROD
        primary_key:
          - customer_id
        fields:
          - name: customer_id
            business_name: Customer Identifier
            description: Unique identifier for a customer.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: customer_code
            business_name: Customer Code
            description: Business reference code assigned to the customer.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: first_name
            business_name: First Name
            description: First name of the customer. PII field requiring restricted access.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: last_name
            business_name: Last Name
            description: Last name of the customer. PII field requiring restricted access.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: email
            business_name: Email
            description: Email address of the customer. PII field requiring restricted access.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: phone
            business_name: Phone
            description: Phone number of the customer. PII field requiring restricted access.
            sql_type: STRING
          
          - name: gender
            business_name: Gender
            description: Gender of the customer.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: date_of_birth
            business_name: Date Of Birth
            description: Date of birth of the customer. PII field requiring restricted access.
            sql_type: DATE
          
          - name: city
            business_name: City
            description: City where the customer resides.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: state
            business_name: State
            description: State or province where the customer resides.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: country
            business_name: Country
            description: Country where the customer resides.
            sql_type: STRING
            dimension:
              is_categorical: true
            constraints:
              - NOT NULL
          
          - name: postal_code
            business_name: Postal Code
            description: Postal or ZIP code of the customer's address.
            sql_type: STRING
          
          - name: customer_segment
            business_name: Customer Segment
            description: Indicates the current segment classification of the customer (e.g., Premium, Standard).
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: registration_date
            business_name: Registration Date
            description: Date when the customer registered.
            sql_type: DATE
            dimension:
              is_time: true
          
          - name: is_active
            business_name: Is Active
            description: Indicates whether the customer account is currently active.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

      - name: orders
        business_name: Orders
        description: >-
          Records end-to-end sales transactions including order header information, customer references,
          order dates, status, sales channel, shipping details, and monetary totals. Analytical grain
          is one row per order. Use this dataset for order-level revenue analysis, order status tracking,
          sales channel performance, and customer order behavior.
        source: ORDER_MGMT
        primary_key:
          - order_id
        fields:
          - name: order_id
            business_name: Order Identifier
            description: Unique identifier for an order.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_number
            business_name: Order Number
            description: Business reference number assigned to the order.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: customer_id
            business_name: Customer ID
            description: References the related customer record.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: order_date
            business_name: Order Date
            description: Timestamp recording when the order was placed.
            sql_type: TIMESTAMP
            dimension:
              is_time: true
            constraints:
              - NOT NULL
          
          - name: order_status
            business_name: Order Status
            description: Indicates the current status of the order (e.g., Shipped, Delivered, Cancelled).
            sql_type: STRING
            dimension:
              is_categorical: true
            constraints:
              - NOT NULL
          
          - name: sales_channel
            business_name: Sales Channel
            description: Indicates the channel through which the order was placed (e.g., Online, In-Store).
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: ship_city
            business_name: Ship City
            description: City to which the order is shipped.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: ship_state
            business_name: Ship State
            description: State or province to which the order is shipped.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: Postal or ZIP code to which the order is shipped.
            sql_type: STRING
          
          - name: subtotal
            business_name: Subtotal
            description: Monetary amount representing the order subtotal before discounts and taxes.
            sql_type: DECIMAL(14,2)
            measure:
              aggregation: SUM
            constraints:
              - NOT NULL
          
          - name: discount_amount
            business_name: Discount Amount
            description: Monetary amount representing the total discount applied to the order.
            sql_type: DECIMAL(14,2)
            measure:
              aggregation: SUM
            constraints:
              - NOT NULL
          
          - name: tax_amount
            business_name: Tax Amount
            description: Monetary amount representing the tax charged on the order. PII field requiring restricted access.
            sql_type: DECIMAL(14,2)
            measure:
              aggregation: SUM
            constraints:
              - NOT NULL
          
          - name: shipping_fee
            business_name: Shipping Fee
            description: Monetary amount representing the shipping cost for the order.
            sql_type: DECIMAL(14,2)
            measure:
              aggregation: SUM
            constraints:
              - NOT NULL
          
          - name: total_amount
            business_name: Total Amount
            description: Monetary amount representing the final total of the order.
            sql_type: DECIMAL(14,2)
            measure:
              aggregation: SUM
            constraints:
              - NOT NULL
          
          - name: currency
            business_name: Currency
            description: Currency code for the order amounts.
            sql_type: STRING
            dimension:
              is_categorical: true
            constraints:
              - NOT NULL
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

      - name: order_items
        business_name: Order Items
        description: >-
          Records individual line items within sales orders including product references, quantities,
          unit prices, discounts, and line totals. Analytical grain is one row per order line item.
          Use this dataset for product-level sales analysis, product performance within orders,
          discount analysis at the line level, and units sold analysis.
        source: ORDER_MGMT
        primary_key:
          - order_item_id
        fields:
          - name: order_item_id
            business_name: Order Item Identifier
            description: Unique identifier for an order line item.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: References the related order record.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: line_number
            business_name: Line Number
            description: Sequential line number within the order.
            sql_type: INT
            constraints:
              - NOT NULL
          
          - name: product_id
            business_name: Product ID
            description: References the related product record.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: quantity
            business_name: Quantity
            description: Number of units ordered for this line item.
            sql_type: INT
            measure:
              aggregation: SUM
            constraints:
              - NOT NULL
          
          - name: unit_price
            business_name: Unit Price
            description: Monetary amount representing the price per unit.
            sql_type: DECIMAL(12,2)
            measure:
              aggregation: AVG
            constraints:
              - NOT NULL
          
          - name: discount_pct
            business_name: Discount Pct
            description: Percentage discount applied to the line item.
            sql_type: DECIMAL(5,2)
            measure:
              aggregation: AVG
            constraints:
              - NOT NULL
          
          - name: line_total
            business_name: Line Total
            description: Monetary amount representing the total for this line item.
            sql_type: DECIMAL(14,2)
            measure:
              aggregation: SUM
            constraints:
              - NOT NULL
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

      - name: payments
        business_name: Payments
        description: >-
          Contains payment transaction records including payment methods, status, amounts, currency,
          transaction references, and gateway information. Analytical grain is one row per payment
          transaction. Use this dataset for payment method analysis, payment status tracking,
          payment gateway performance, and payment timing analysis.
        source: PAYMENT_SYS
        primary_key:
          - payment_id
        fields:
          - name: payment_id
            business_name: Payment Identifier
            description: Unique identifier for a payment transaction.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: References the related order record.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: payment_method
            business_name: Payment Method
            description: Indicates the method used for payment (e.g., Credit Card, PayPal).
            sql_type: STRING
            dimension:
              is_categorical: true
            constraints:
              - NOT NULL
          
          - name: payment_status
            business_name: Payment Status
            description: Indicates the current status of the payment (e.g., Completed, Pending, Failed).
            sql_type: STRING
            dimension:
              is_categorical: true
            constraints:
              - NOT NULL
          
          - name: amount
            business_name: Amount
            description: Monetary amount representing the payment value.
            sql_type: DECIMAL(14,2)
            measure:
              aggregation: SUM
            constraints:
              - NOT NULL
          
          - name: currency
            business_name: Currency
            description: Currency code for the payment amount.
            sql_type: STRING
            dimension:
              is_categorical: true
            constraints:
              - NOT NULL
          
          - name: transaction_ref
            business_name: Transaction Ref
            description: External reference number for the payment transaction. PII field requiring restricted access.
            sql_type: STRING
          
          - name: gateway
            business_name: Gateway
            description: Name of the payment gateway used to process the transaction.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: paid_at
            business_name: Paid At
            description: Timestamp recording when the payment was completed.
            sql_type: TIMESTAMP
            dimension:
              is_time: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

      - name: products
        business_name: Products
        description: >-
          Contains product catalog information including SKU, product names, category references,
          brand, descriptions, pricing, cost, and inventory levels. Analytical grain is one row
          per product. Use this dataset for product catalog analysis, pricing strategy, inventory
          management, product profitability, and brand performance.
        source: PRODUCT_CATALOG
        primary_key:
          - product_id
        fields:
          - name: product_id
            business_name: Product Identifier
            description: Unique identifier for a product.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: sku
            business_name: Sku
            description: Stock keeping unit code for the product.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: product_name
            business_name: Product Name
            description: Name of the product.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: category_id
            business_name: Category ID
            description: References the related product category record.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: brand
            business_name: Brand
            description: Brand name of the product.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: description
            business_name: Description
            description: Detailed description of the product.
            sql_type: STRING
          
          - name: unit_price
            business_name: Unit Price
            description: Monetary amount representing the selling price per unit.
            sql_type: DECIMAL(12,2)
            measure:
              aggregation: AVG
            constraints:
              - NOT NULL
          
          - name: cost_price
            business_name: Cost Price
            description: Monetary amount representing the cost per unit.
            sql_type: DECIMAL(12,2)
            measure:
              aggregation: AVG
          
          - name: currency
            business_name: Currency
            description: Currency code for the product prices.
            sql_type: STRING
            dimension:
              is_categorical: true
            constraints:
              - NOT NULL
          
          - name: stock_quantity
            business_name: Stock Quantity
            description: Current inventory quantity available for the product.
            sql_type: INT
            measure:
              aggregation: SUM
            constraints:
              - NOT NULL
          
          - name: is_active
            business_name: Is Active
            description: Indicates whether the product is currently active for sale.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
          
          - name: created_at
            business_name: Created At
            description: Timestamp recording when the product was created in the system.
            sql_type: TIMESTAMP
            dimension:
              is_time: true
            constraints:
              - NOT NULL
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

      - name: product_categories
        business_name: Product Categories
        description: >-
          Contains product category definitions and hierarchical category structure with parent-child
          relationships. Analytical grain is one row per product category. Use this dataset for
          category hierarchy analysis, category performance rollups, and category management.
          Contains recursive relationship via parent_category_id for multi-level category hierarchies.
        source: PRODUCT_CATALOG
        primary_key:
          - category_id
        fields:
          - name: category_id
            business_name: Category Identifier
            description: Unique identifier for a product category.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: category_name
            business_name: Category Name
            description: Name of the product category.
            sql_type: STRING
            dimension:
              is_categorical: true
            constraints:
              - NOT NULL
          
          - name: parent_category_id
            business_name: Parent Category ID
            description: References the parent category in the hierarchy. Enables recursive category hierarchy traversal.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
          
          - name: description
            business_name: Description
            description: Detailed description of the product category.
            sql_type: STRING
          
          - name: is_active
            business_name: Is Active
            description: Indicates whether the category is currently active.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

      - name: shipments
        business_name: Shipments
        description: >-
          Contains shipment records including carrier information, tracking numbers, shipment status,
          shipping and delivery timestamps, and destination details. Analytical grain is one row
          per shipment. Use this dataset for logistics performance analysis, delivery time analysis,
          carrier performance, and shipment status tracking.
        source: LOGISTICS_SYS
        primary_key:
          - shipment_id
        fields:
          - name: shipment_id
            business_name: Shipment Identifier
            description: Unique identifier for a shipment.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: References the related order record.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: carrier
            business_name: Carrier
            description: Name of the shipping carrier handling the shipment.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: tracking_number
            business_name: Tracking Number
            description: Tracking number assigned by the carrier for the shipment.
            sql_type: STRING
          
          - name: shipment_status
            business_name: Shipment Status
            description: Indicates the current status of the shipment (e.g., In Transit, Delivered).
            sql_type: STRING
            dimension:
              is_categorical: true
            constraints:
              - NOT NULL
          
          - name: shipped_at
            business_name: Shipped At
            description: Timestamp recording when the shipment was dispatched.
            sql_type: TIMESTAMP
            dimension:
              is_time: true
          
          - name: delivered_at
            business_name: Delivered At
            description: Timestamp recording when the shipment was delivered.
            sql_type: TIMESTAMP
            dimension:
              is_time: true
          
          - name: ship_city
            business_name: Ship City
            description: City to which the shipment is being sent.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: ship_state
            business_name: Ship State
            description: State or province to which the shipment is being sent.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: Postal or ZIP code to which the shipment is being sent.
            sql_type: STRING
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

    relationships:
      - name: orders_to_customers
        left_dataset: orders
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Each order is associated with exactly one customer via the customer_id foreign key.
          One customer can place multiple orders over time. Use this relationship to analyze
          customer order behavior, customer lifetime value, orders per customer, and customer
          segmentation analysis. Join orders to customers to enrich order data with customer
          attributes such as customer_segment, country, state, city, and registration_date.

      - name: order_items_to_orders
        left_dataset: order_items
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Each order line item belongs to exactly one order via the order_id foreign key.
          One order can contain multiple line items. CRITICAL: When joining order_items to orders,
          do NOT sum order-level measures such as orders.total_amount, orders.subtotal,
          orders.discount_amount, orders.tax_amount, or orders.shipping_fee, as this will
          multiply these values by the number of line items in each order. For order-level
          revenue analysis, query orders directly. For product-level revenue analysis, use
          order_items.line_total. Use this relationship to enrich order items with order-level
          attributes such as order_date, order_status, sales_channel, and customer_id.

      - name: order_items_to_products
        left_dataset: order_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        resolution: >-
          Each order line item references exactly one product via the product_id foreign key.
          One product can appear in multiple order line items across different orders. Use this
          relationship to analyze product sales performance, product revenue, units sold per product,
          product profitability, and to enrich order items with product attributes such as
          product_name, brand, category_id, unit_price, and cost_price.

      - name: payments_to_orders
        left_dataset: payments
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Each payment transaction is associated with exactly one order via the order_id foreign key.
          One order can have multiple payment transactions (e.g., partial payments, refunds, or
          payment retries). Use this relationship to analyze payment methods by order, payment
          status tracking, payment timing relative to order placement, and to enrich payment data
          with order attributes such as order_date, customer_id, and total_amount.

      - name: products_to_product_categories
        left_dataset: products
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Each product belongs to exactly one product category via the category_id foreign key.
          One category can contain multiple products. Use this relationship to analyze product
          performance by category, category revenue, category profitability, and to enrich product
          data with category attributes such as category_name and parent_category_id for hierarchical
          category analysis.

      - name: product_categories_hierarchy
        left_dataset: product_categories
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - parent_category_id
          right:
            - category_id
        join_type: recursive
        resolution: >-
          This is a recursive self-referencing relationship representing the product category hierarchy.
          Each category can have a parent category via the parent_category_id foreign key, enabling
          multi-level category hierarchies. Top-level categories have NULL parent_category_id.
          Use recursive CTEs to traverse the category hierarchy for category rollup analysis,
          hierarchical category reporting, and parent-child category relationships. For example,
          to calculate total revenue for a parent category including all descendant categories,
          use a recursive query to identify all child categories and aggregate product sales
          across the entire category subtree.

      - name: shipments_to_orders
        left_dataset: shipments
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Each shipment is associated with exactly one order via the order_id foreign key.
          One order can have multiple shipments (e.g., partial shipments or multiple packages).
          Use this relationship to analyze shipment performance by order, delivery times relative
          to order placement, carrier performance, and to enrich shipment data with order attributes
          such as order_date, customer_id, ship_city, ship_state, and ship_postal_code.

    metrics:
      - name: total_revenue
        business_name: Total Revenue
        description: >-
          Total revenue across all orders calculated as the sum of order total amounts.
          This is an order-level metric representing the final revenue including discounts,
          taxes, and shipping fees. Query the orders dataset directly to avoid double-counting
          when orders contain multiple line items.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.total_amount) AS total_revenue
                FROM orders
                WHERE orders.order_status NOT IN ('Cancelled', 'Refunded')
              columns_used:
                - orders.total_amount
                - orders.order_status

      - name: total_orders
        business_name: Total Orders
        description: >-
          Total count of distinct orders. Use this metric to track order volume over time,
          by customer segment, by sales channel, or by geographic region.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT orders.order_id) AS total_orders
                FROM orders
              columns_used:
                - orders.order_id

      - name: average_order_value
        business_name: Average Order Value
        description: >-
          Average revenue per order calculated as total revenue divided by total order count.
          This metric represents the typical order size and is useful for analyzing customer
          purchasing behavior and sales channel performance.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT orders.order_id) = 0 THEN 0
                    ELSE SUM(orders.total_amount) / COUNT(DISTINCT orders.order_id)
                  END AS average_order_value
                FROM orders
                WHERE orders.order_status NOT IN ('Cancelled', 'Refunded')
              columns_used:
                - orders.total_amount
                - orders.order_id
                - orders.order_status

      - name: total_units_sold
        business_name: Total Units Sold
        description: >-
          Total quantity of units sold across all order line items. This metric represents
          the total volume of products sold and is useful for inventory planning, product
          demand analysis, and sales volume tracking.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.quantity) AS total_units_sold
                FROM order_items
                INNER JOIN orders ON order_items.order_id = orders.order_id
                WHERE orders.order_status NOT IN ('Cancelled', 'Refunded')
              columns_used:
                - order_items.quantity
                - order_items.order_id
                - orders.order_id
                - orders.order_status

      - name: product_revenue
        business_name: Product Revenue
        description: >-
          Total revenue at the product line item level calculated as the sum of line totals.
          This metric represents product-level revenue and should be used for product performance
          analysis, product profitability, and product ranking. This is different from total_revenue
          which is calculated at the order level.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.line_total) AS product_revenue
                FROM order_items
                INNER JOIN orders ON order_items.order_id = orders.order_id
                WHERE orders.order_status NOT IN ('Cancelled', 'Refunded')
              columns_used:
                - order_items.line_total
                - order_items.order_id
                - orders.order_id
                - orders.order_status

      - name: total_discount_amount
        business_name: Total Discount Amount
        description: >-
          Total discount amount applied across all orders. This is an order-level metric
          representing the total value of discounts given to customers. Use this metric
          to analyze discount effectiveness and promotional impact.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.discount_amount) AS total_discount_amount
                FROM orders
                WHERE orders.order_status NOT IN ('Cancelled', 'Refunded')
              columns_used:
                - orders.discount_amount
                - orders.order_status

      - name: average_discount_percentage
        business_name: Average Discount Percentage
        description: >-
          Average discount percentage applied at the order line item level. This metric
          represents the typical discount rate offered on products and is useful for
          pricing strategy analysis and promotional effectiveness.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(order_items.discount_pct) AS average_discount_percentage
                FROM order_items
                INNER JOIN orders ON order_items.order_id = orders.order_id
                WHERE orders.order_status NOT IN ('Cancelled', 'Refunded')
              columns_used:
                - order_items.discount_pct
                - order_items.order_id
                - orders.order_id
                - orders.order_status

      - name: total_shipping_revenue
        business_name: Total Shipping Revenue
        description: >-
          Total shipping fees collected across all orders. This metric represents revenue
          generated from shipping charges and is useful for analyzing shipping cost recovery
          and shipping pricing strategy.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.shipping_fee) AS total_shipping_revenue
                FROM orders
                WHERE orders.order_status NOT IN ('Cancelled', 'Refunded')
              columns_used:
                - orders.shipping_fee
                - orders.order_status

      - name: total_customers
        business_name: Total Customers
        description: >-
          Total count of distinct customers. Use this metric to track customer base growth,
          customer acquisition, and customer segmentation analysis.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT customers.customer_id) AS total_customers
                FROM customers
                WHERE customers.is_active = true
              columns_used:
                - customers.customer_id
                - customers.is_active

      - name: orders_per_customer
        business_name: Orders Per Customer
        description: >-
          Average number of orders per customer calculated as total orders divided by
          total customers. This metric represents customer purchase frequency and is
          useful for customer loyalty analysis and retention strategies.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT customers.customer_id) = 0 THEN 0
                    ELSE CAST(COUNT(DISTINCT orders.order_id) AS DECIMAL) / COUNT(DISTINCT customers.customer_id)
                  END AS orders_per_customer
                FROM customers
                LEFT JOIN orders ON customers.customer_id = orders.customer_id
                WHERE customers.is_active = true
                  AND (orders.order_status IS NULL OR orders.order_status NOT IN ('Cancelled', 'Refunded'))
              columns_used:
                - customers.customer_id
                - customers.is_active
                - orders.order_id
                - orders.customer_id
                - orders.order_status

      - name: revenue_per_customer
        business_name: Revenue Per Customer
        description: >-
          Average revenue per customer calculated as total revenue divided by total customers.
          This metric represents customer value and is useful for customer segmentation,
          customer lifetime value estimation, and marketing ROI analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT customers.customer_id) = 0 THEN 0
                    ELSE SUM(orders.total_amount) / COUNT(DISTINCT customers.customer_id)
                  END AS revenue_per_customer
                FROM customers
                LEFT JOIN orders ON customers.customer_id = orders.customer_id
                WHERE customers.is_active = true
                  AND (orders.order_status IS NULL OR orders.order_status NOT IN ('Cancelled', 'Refunded'))
              columns_used:
                - customers.customer_id
                - customers.is_active
                - orders.total_amount
                - orders.customer_id
                - orders.order_status

      - name: total_products
        business_name: Total Products
        description: >-
          Total count of distinct active products in the catalog. Use this metric to
          track catalog size, product portfolio growth, and product assortment analysis.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT products.product_id) AS total_products
                FROM products
                WHERE products.is_active = true
              columns_used:
                - products.product_id
                - products.is_active

      - name: total_inventory_value
        business_name: Total Inventory Value
        description: >-
          Total value of current inventory calculated as the sum of stock quantity
          multiplied by cost price for all active products. This metric represents
          the total capital invested in inventory and is useful for inventory management
          and working capital analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(products.stock_quantity * COALESCE(products.cost_price, 0)) AS total_inventory_value
                FROM products
                WHERE products.is_active = true
              columns_used:
                - products.stock_quantity
                - products.cost_price
                - products.is_active

      - name: average_product_price
        business_name: Average Product Price
        description: >-
          Average selling price across all active products. This metric represents
          the typical product price point and is useful for pricing strategy analysis
          and product portfolio positioning.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(products.unit_price) AS average_product_price
                FROM products
                WHERE products.is_active = true
              columns_used:
                - products.unit_price
                - products.is_active

      - name: total_payment_amount
        business_name: Total Payment Amount
        description: >-
          Total payment amount collected across all completed payment transactions.
          This metric represents actual cash collected and is useful for cash flow
          analysis and payment reconciliation.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(payments.amount) AS total_payment_amount
                FROM payments
                WHERE payments.payment_status = 'Completed'
              columns_used:
                - payments.amount
                - payments.payment_status

      - name: total_shipments
        business_name: Total Shipments
        description: >-
          Total count of distinct shipments. Use this metric to track shipment volume,
          logistics performance, and carrier workload analysis.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT shipments.shipment_id) AS total_shipments
                FROM shipments
              columns_used:
                - shipments.shipment_id

      - name: delivered_shipments
        business_name: Delivered Shipments
        description: >-
          Total count of shipments with delivered status. Use this metric to track
          successful delivery completion and logistics performance.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT shipments.shipment_id) AS delivered_shipments
                FROM shipments
                WHERE shipments.shipment_status = 'Delivered'
              columns_used:
                - shipments.shipment_id
                - shipments.shipment_status

      - name: on_time_delivery_rate
        business_name: On Time Delivery Rate
        description: >-
          Percentage of shipments delivered on time calculated as delivered shipments
          divided by total shipments. This metric represents logistics performance and
          customer satisfaction with delivery service. Note: This calculation assumes
          delivered status indicates on-time delivery. Enhance with actual delivery
          date comparison if service level agreement dates are available.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT shipments.shipment_id) = 0 THEN 0
                    ELSE (
                      CAST(COUNT(DISTINCT CASE WHEN shipments.shipment_status = 'Delivered' THEN shipments.shipment_id END) AS DECIMAL)
                      / COUNT(DISTINCT shipments.shipment_id)
                    ) * 100
                  END AS on_time_delivery_rate
                FROM shipments
              columns_used:
                - shipments.shipment_id
                - shipments.shipment_status

      - name: average_delivery_time_days
        business_name: Average Delivery Time Days
        description: >-
          Average number of days between shipment dispatch and delivery for completed
          shipments. This metric represents logistics efficiency and is useful for
          carrier performance analysis and customer delivery expectations management.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(DATEDIFF(shipments.delivered_at, shipments.shipped_at)) AS average_delivery_time_days
                FROM shipments
                WHERE shipments.shipped_at IS NOT NULL
                  AND shipments.delivered_at IS NOT NULL
                  AND shipments.shipment_status = 'Delivered'
              columns_used:
                - shipments.delivered_at
                - shipments.shipped_at
                - shipments.shipment_status

      - name: monthly_revenue
        business_name: Monthly Revenue
        description: >-
          Total revenue aggregated by month based on order date. This time-series metric
          is useful for revenue trend analysis, seasonality detection, and month-over-month
          growth tracking. Result grain is one row per month.
        return_type: DECIMAL
        result_grain: one row per month
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  DATE_TRUNC('MONTH', orders.order_date) AS order_month,
                  SUM(orders.total_amount) AS monthly_revenue
                FROM orders
                WHERE orders.order_status NOT IN ('Cancelled', 'Refunded')
                GROUP BY DATE_TRUNC('MONTH', orders.order_date)
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.total_amount
                - orders.order_status

      - name: revenue_by_customer_segment
        business_name: Revenue By Customer Segment
        description: >-
          Total revenue aggregated by customer segment. This metric is useful for
          customer segmentation analysis, segment profitability, and targeted marketing
          strategies. Result grain is one row per customer segment.
        return_type: DECIMAL
        result_grain: one row per customer segment
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  customers.customer_segment,
                  SUM(orders.total_amount) AS revenue_by_segment
                FROM orders
                INNER JOIN customers ON orders.customer_id = customers.customer_id
                WHERE orders.order_status NOT IN ('Cancelled', 'Refunded')
                  AND customers.customer_segment IS NOT NULL
                GROUP BY customers.customer_segment
                ORDER BY revenue_by_segment DESC
              columns_used:
                - customers.customer_segment
                - customers.customer_id
                - orders.customer_id
                - orders.total_amount
                - orders.order_status

      - name: revenue_by_sales_channel
        business_name: Revenue By Sales Channel
        description: >-
          Total revenue aggregated by sales channel. This metric is useful for
          channel performance analysis, omnichannel strategy, and channel investment
          decisions. Result grain is one row per sales channel.
        return_type: DECIMAL
        result_grain: one row per sales channel
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  orders.sales_channel,
                  SUM(orders.total_amount) AS revenue_by_channel
                FROM orders
                WHERE orders.order_status NOT IN ('Cancelled', 'Refunded')
                  AND orders.sales_channel IS NOT NULL
                GROUP BY orders.sales_channel
                ORDER BY revenue_by_channel DESC
              columns_used:
                - orders.sales_channel
                - orders.total_amount
                - orders.order_status

      - name: revenue_by_product
        business_name: Revenue By Product
        description: >-
          Total revenue aggregated by product based on order line items. This metric
          is useful for product performance ranking, product profitability analysis,
          and inventory optimization. Result grain is one row per product.
        return_type: DECIMAL
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  products.product_id,
                  products.product_name,
                  SUM(order_items.line_total) AS revenue_by_product
                FROM order_items
                INNER JOIN products ON order_items.product_id = products.product_id
                INNER JOIN orders ON order_items.order_id = orders.order_id
                WHERE orders.order_status NOT IN ('Cancelled', 'Refunded')
                GROUP BY products.product_id, products.product_name
                ORDER BY revenue_by_product DESC
              columns_used:
                - products.product_id
                - products.product_name
                - order_items.product_id
                - order_items.line_total
                - order_items.order_id
                - orders.order_id
                - orders.order_status

      - name: revenue_by_brand
        business_name: Revenue By Brand
        description: >-
          Total revenue aggregated by product brand. This metric is useful for
          brand performance analysis, brand portfolio management, and brand investment
          decisions. Result grain is one row per brand.
        return_type: DECIMAL
        result_grain: one row per brand
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  products.brand,
                  SUM(order_items.line_total) AS revenue_by_brand
                FROM order_items
                INNER JOIN products ON order_items.product_id = products.product_id
                INNER JOIN orders ON order_items.order_id = orders.order_id
                WHERE orders.order_status NOT IN ('Cancelled', 'Refunded')
                  AND products.brand IS NOT NULL
                GROUP BY products.brand
                ORDER BY revenue_by_brand DESC
              columns_used:
                - products.brand
                - products.product_id
                - order_items.product_id
                - order_items.line_total
                - order_items.order_id
                - orders.order_id
                - orders.order_status

      - name: revenue_by_category
        business_name: Revenue By Category
        description: >-
          Total revenue aggregated by product category. This metric is useful for
          category performance analysis, category management, and merchandising decisions.
          Result grain is one row per category.
        return_type: DECIMAL
        result_grain: one row per category
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  product_categories.category_id,
                  product_categories.category_name,
                  SUM(order_items.line_total) AS revenue_by_category
                FROM order_items
                INNER JOIN products ON order_items.product_id = products.product_id
                INNER JOIN product_categories ON products.category_id = product_categories.category_id
                INNER JOIN orders ON order_items.order_id = orders.order_id
                WHERE orders.order_status NOT IN ('Cancelled', 'Refunded')
                GROUP BY product_categories.category_id, product_categories.category_name
                ORDER BY revenue_by_category DESC
              columns_used:
                - product_categories.category_id
                - product_categories.category_name
                - products.category_id
                - products.product_id
                - order_items.product_id
                - order_items.line_total
                - order_items.order_id
                - orders.order_id
                - orders.order_status

      - name: revenue_by_payment_method
        business_name: Revenue By Payment Method
        description: >-
          Total payment amount aggregated by payment method for completed payments.
          This metric is useful for payment method preference analysis, payment gateway
          optimization, and payment processing cost analysis. Result grain is one row
          per payment method.
        return_type: DECIMAL
        result_grain: one row per payment method
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  payments.payment_method,
                  SUM(payments.amount) AS revenue_by_payment_method
                FROM payments
                WHERE payments.payment_status = 'Completed'
                GROUP BY payments.payment_method
                ORDER BY revenue_by_payment_method DESC
              columns_used:
                - payments.payment_method
                - payments.amount
                - payments.payment_status

      - name: product_profit_margin
        business_name: Product Profit Margin
        description: >-
          Profit margin percentage by product calculated as (unit_price - cost_price) / unit_price * 100.
          This metric represents product profitability and is useful for pricing strategy,
          product portfolio optimization, and margin management. Result grain is one row per product.
        return_type: DECIMAL
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  products.product_id,
                  products.product_name,
                  CASE
                    WHEN products.unit_price = 0 THEN 0
                    WHEN products.cost_price IS NULL THEN NULL
                    ELSE ((products.unit_price - products.cost_price) / products.unit_price) * 100
                  END AS product_profit_margin
                FROM products
                WHERE products.is_active = true
                ORDER BY product_profit_margin DESC
              columns_used:
                - products.product_id
                - products.product_name
                - products.unit_price
                - products.cost_price
                - products.is_active

      - name: top_customers_by_revenue
        business_name: Top Customers By Revenue
        description: >-
          Ranking of customers by total revenue with revenue amount and customer details.
          This metric is useful for identifying high-value customers, VIP customer programs,
          and targeted retention strategies. Result grain is one row per customer ranked
          by revenue.
        return_type: DECIMAL
        result_grain: one row per customer
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  customers.customer_id,
                  customers.customer_code,
                  customers.customer_segment,
                  SUM(orders.total_amount) AS customer_revenue,
                  RANK() OVER (ORDER BY SUM(orders.total_amount) DESC) AS revenue_rank
                FROM customers
                INNER JOIN orders ON customers.customer_id = orders.customer_id
                WHERE orders.order_status NOT IN ('Cancelled', 'Refunded')
                  AND customers.is_active = true
                GROUP BY customers.customer_id, customers.customer_code, customers.customer_segment
                ORDER BY customer_revenue DESC
              columns_used:
                - customers.customer_id
                - customers.customer_code
                - customers.customer_segment
                - customers.is_active
                - orders.customer_id
                - orders.total_amount
                - orders.order_status

      - name: top_products_by_units_sold
        business_name: Top Products By Units Sold
        description: >-
          Ranking of products by total units sold with quantity and product details.
          This metric is useful for identifying best-selling products, inventory planning,
          and product demand forecasting. Result grain is one row per product ranked
          by units sold.
        return_type: BIGINT
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  products.product_id,
                  products.product_name,
                  products.brand,
                  SUM(order_items.quantity) AS units_sold,
                  RANK() OVER (ORDER BY SUM(order_items.quantity) DESC) AS units_rank
                FROM order_items
                INNER JOIN products ON order_items.product_id = products.product_id
                INNER JOIN orders ON order_items.order_id = orders.order_id
                WHERE orders.order_status NOT IN ('Cancelled', 'Refunded')
                  AND products.is_active = true
                GROUP BY products.product_id, products.product_name, products.brand
                ORDER BY units_sold DESC
              columns_used:
                - products.product_id
                - products.product_name
                - products.brand
                - products.is_active
                - order_items.product_id
                - order_items.quantity
                - order_items.order_id
                - orders.order_id
                - orders.order_status