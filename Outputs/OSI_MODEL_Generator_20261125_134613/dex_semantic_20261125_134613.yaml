          - name: ship_city
            business_name: Ship City
            description: >-
              City to which the shipment is being sent. Used for shipping destination analysis. May be null.
            sql_type: STRING
            constraints: []
            dimension:
              is_categorical: true
          
          - name: ship_state
            business_name: Ship State
            description: >-
              State or province to which the shipment is being sent. Used for shipping destination analysis. May be null.
            sql_type: STRING
            constraints: []
            dimension:
              is_categorical: true
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: >-
              Postal or ZIP code to which the shipment is being sent. Used for shipping destination analysis. May be null.
            sql_type: STRING
            constraints: []
          
          - name: _source_system
            business_name: Source System
            description: >-
              Name of the source system from which the record originated. Technical metadata field.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ETL batch that loaded this record. Technical metadata field. May be null.
            sql_type: BIGINT
            constraints: []
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp recording when the record was loaded into the table. Technical metadata field.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

    relationships:
      - name: orders_to_customers
        left_dataset: orders
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship from orders to customers. Each order is placed by exactly one customer, 
          but a customer can place multiple orders. Join on orders.customer_id = customers.customer_id. Use this 
          relationship to enrich order analysis with customer demographics, customer segment, and customer location.

      - name: order_items_to_orders
        left_dataset: order_items
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship from order_items to orders. Each order item belongs to exactly one order, 
          but an order can contain multiple order items. Join on order_items.order_id = orders.order_id. 
          CRITICAL WARNING: Do NOT sum order-level amounts (orders.total_amount, orders.subtotal, orders.discount_amount, 
          orders.tax_amount, orders.shipping_fee) after performing this join, as this will cause double-counting. 
          Each order-level amount will be duplicated for every line item in the order. Use order_items.line_total 
          for line-item-level revenue analysis instead.

      - name: order_items_to_products
        left_dataset: order_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship from order_items to products. Each order item references exactly one product, 
          but a product can appear in multiple order items. Join on order_items.product_id = products.product_id. 
          Use this relationship to enrich order item analysis with product attributes (name, brand, category), 
          current pricing (products.unit_price), and cost information (products.cost_price) for margin calculations.

      - name: products_to_product_categories
        left_dataset: products
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship from products to product_categories. Each product belongs to exactly one 
          category, but a category can contain multiple products. Join on products.category_id = product_categories.category_id. 
          Use this relationship to aggregate product and sales metrics by category. For hierarchical category analysis, 
          combine this with the product_categories self-referencing relationship.

      - name: product_categories_hierarchy
        left_dataset: product_categories
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - parent_category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Self-referencing hierarchical relationship within product_categories. Each category can have a parent category, 
          creating a multi-level category hierarchy. Join on child.parent_category_id = parent.category_id. 
          Root-level categories have parent_category_id = NULL. Use recursive CTEs to traverse the full hierarchy 
          and aggregate metrics up the category tree. Example hierarchy: Electronics (root) → Consumer Electronics → 
          Headphones. Databricks recursive CTE syntax: WITH RECURSIVE category_hierarchy AS (SELECT category_id, 
          category_name, parent_category_id, 0 as level FROM product_categories WHERE parent_category_id IS NULL 
          UNION ALL SELECT c.category_id, c.category_name, c.parent_category_id, ch.level + 1 FROM product_categories c 
          INNER JOIN category_hierarchy ch ON c.parent_category_id = ch.category_id) SELECT * FROM category_hierarchy.

      - name: payments_to_orders
        left_dataset: payments
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship from payments to orders. Each payment transaction is associated with exactly 
          one order, but an order can have multiple payment transactions in split-payment or partial-payment scenarios. 
          Join on payments.order_id = orders.order_id. Use this relationship to analyze payment methods, payment success 
          rates, and payment timing by order. Note that payments.amount may differ from orders.total_amount in cases of 
          partial payments, refunds, or payment failures. Filter by payments.payment_status = 'Completed' for successful 
          payment analysis.

      - name: shipments_to_orders
        left_dataset: shipments
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship from shipments to orders. Each shipment is associated with exactly one order, 
          but an order can have multiple shipments in split-shipment scenarios. Join on shipments.order_id = orders.order_id. 
          Use this relationship to analyze shipment tracking, delivery performance, carrier performance, and order fulfillment 
          timing. Calculate order-to-ship time as shipments.shipped_at - orders.order_date. Calculate delivery time as 
          shipments.delivered_at - shipments.shipped_at.

    metrics:
      - name: total_revenue
        business_name: Total Revenue
        description: >-
          Total revenue across all orders, calculated as the sum of order total amounts. This represents the final 
          revenue including all discounts, taxes, and shipping fees. Use this metric for overall revenue analysis 
          at the order level.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(orders.total_amount) AS total_revenue
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.total_amount

      - name: total_orders
        business_name: Total Orders
        description: >-
          Total count of orders. Use this metric for order volume analysis.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(orders.order_id) AS total_orders
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.order_id

      - name: total_customers
        business_name: Total Customers
        description: >-
          Total count of unique customers. Use this metric for customer base analysis.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(DISTINCT customers.customer_id) AS total_customers
                FROM ecom_bronze.customers AS customers
              columns_used:
                - customers.customer_id

      - name: active_customers
        business_name: Active Customers
        description: >-
          Count of customers with active accounts. Use this metric for active customer base analysis.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(customers.customer_id) AS active_customers
                FROM ecom_bronze.customers AS customers
                WHERE customers.is_active = true
              columns_used:
                - customers.customer_id
                - customers.is_active

      - name: average_order_value
        business_name: Average Order Value
        description: >-
          Average revenue per order, calculated as total revenue divided by total orders. Use this metric to 
          understand typical order size and track changes in order value over time.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(orders.order_id) = 0 THEN 0
                        ELSE SUM(orders.total_amount) / COUNT(orders.order_id)
                    END AS average_order_value
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.order_id
                - orders.total_amount

      - name: total_line_item_revenue
        business_name: Total Line Item Revenue
        description: >-
          Total revenue across all order line items, calculated as the sum of line totals. This represents 
          product-level revenue after line-item discounts. Use this metric for product-level revenue analysis. 
          This metric should equal total order revenue (excluding order-level adjustments).
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(order_items.line_total) AS total_line_item_revenue
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.line_total

      - name: total_units_sold
        business_name: Total Units Sold
        description: >-
          Total quantity of units sold across all order line items. Use this metric for volume analysis.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(order_items.quantity) AS total_units_sold
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.quantity

      - name: total_discount_amount
        business_name: Total Discount Amount
        description: >-
          Total discount amount applied across all orders at the order level. Use this metric for discount 
          effectiveness analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(orders.discount_amount) AS total_discount_amount
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.discount_amount

      - name: total_shipping_revenue
        business_name: Total Shipping Revenue
        description: >-
          Total shipping fees collected across all orders. Use this metric for shipping revenue analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(orders.shipping_fee) AS total_shipping_revenue
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.shipping_fee

      - name: total_tax_collected
        business_name: Total Tax Collected
        description: >-
          Total tax amount collected across all orders. Use this metric for tax revenue analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(orders.tax_amount) AS total_tax_collected
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.tax_amount

      - name: product_revenue
        business_name: Product Revenue
        description: >-
          Revenue by product, calculated as the sum of line totals for each product. Use this metric for 
          product performance analysis. Result grain is one row per product.
        return_type: DECIMAL
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    products.product_id,
                    products.product_name,
                    SUM(order_items.line_total) AS product_revenue
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                    ON order_items.product_id = products.product_id
                GROUP BY products.product_id, products.product_name
              columns_used:
                - order_items.product_id
                - order_items.line_total
                - products.product_id
                - products.product_name

      - name: product_units_sold
        business_name: Product Units Sold
        description: >-
          Units sold by product, calculated as the sum of quantities for each product. Use this metric for 
          product volume analysis. Result grain is one row per product.
        return_type: BIGINT
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    products.product_id,
                    products.product_name,
                    SUM(order_items.quantity) AS product_units_sold
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                    ON order_items.product_id = products.product_id
                GROUP BY products.product_id, products.product_name
              columns_used:
                - order_items.product_id
                - order_items.quantity
                - products.product_id
                - products.product_name

      - name: product_cost_of_goods_sold
        business_name: Product Cost of Goods Sold
        description: >-
          Cost of goods sold by product, calculated as the sum of (quantity * cost_price) for each product. 
          Use this metric for product cost analysis and margin calculations. Only includes products with 
          documented cost_price.
        return_type: DECIMAL
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    products.product_id,
                    products.product_name,
                    SUM(order_items.quantity * products.cost_price) AS product_cost_of_goods_sold
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                    ON order_items.product_id = products.product_id
                WHERE products.cost_price IS NOT NULL
                GROUP BY products.product_id, products.product_name
              columns_used:
                - order_items.product_id
                - order_items.quantity
                - products.product_id
                - products.product_name
                - products.cost_price

      - name: product_gross_profit
        business_name: Product Gross Profit
        description: >-
          Gross profit by product, calculated as product revenue minus cost of goods sold. Use this metric 
          for product profitability analysis. Only includes products with documented cost_price.
        return_type: DECIMAL
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    products.product_id,
                    products.product_name,
                    SUM(order_items.line_total) - SUM(order_items.quantity * products.cost_price) AS product_gross_profit
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                    ON order_items.product_id = products.product_id
                WHERE products.cost_price IS NOT NULL
                GROUP BY products.product_id, products.product_name
              columns_used:
                - order_items.product_id
                - order_items.line_total
                - order_items.quantity
                - products.product_id
                - products.product_name
                - products.cost_price

      - name: product_gross_margin_pct
        business_name: Product Gross Margin Percentage
        description: >-
          Gross margin percentage by product, calculated as (product revenue - cost of goods sold) / product revenue * 100. 
          Use this metric for product profitability analysis. Only includes products with documented cost_price and 
          non-zero revenue.
        return_type: DECIMAL
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    products.product_id,
                    products.product_name,
                    CASE
                        WHEN SUM(order_items.line_total) = 0 THEN 0
                        ELSE (SUM(order_items.line_total) - SUM(order_items.quantity * products.cost_price)) 
                             / SUM(order_items.line_total) * 100
                    END AS product_gross_margin_pct
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                    ON order_items.product_id = products.product_id
                WHERE products.cost_price IS NOT NULL
                GROUP BY products.product_id, products.product_name
              columns_used:
                - order_items.product_id
                - order_items.line_total
                - order_items.quantity
                - products.product_id
                - products.product_name
                - products.cost_price

      - name: category_revenue
        business_name: Category Revenue
        description: >-
          Revenue by product category, calculated as the sum of line totals for products in each category. 
          Use this metric for category performance analysis. Result grain is one row per category.
        return_type: DECIMAL
        result_grain: one row per category
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    product_categories.category_id,
                    product_categories.category_name,
                    SUM(order_items.line_total) AS category_revenue
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                    ON order_items.product_id = products.product_id
                INNER JOIN ecom_bronze.product_categories AS product_categories
                    ON products.category_id = product_categories.category_id
                GROUP BY product_categories.category_id, product_categories.category_name
              columns_used:
                - order_items.product_id
                - order_items.line_total
                - products.product_id
                - products.category_id
                - product_categories.category_id
                - product_categories.category_name

      - name: customer_revenue
        business_name: Customer Revenue
        description: >-
          Revenue by customer, calculated as the sum of order total amounts for each customer. Use this metric 
          for customer value analysis and customer segmentation. Result grain is one row per customer.
        return_type: DECIMAL
        result_grain: one row per customer
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    customers.customer_id,
                    customers.customer_code,
                    SUM(orders.total_amount) AS customer_revenue
                FROM ecom_bronze.orders AS orders
                INNER JOIN ecom_bronze.customers AS customers
                    ON orders.customer_id = customers.customer_id
                GROUP BY customers.customer_id, customers.customer_code
              columns_used:
                - orders.customer_id
                - orders.total_amount
                - customers.customer_id
                - customers.customer_code

      - name: customer_order_count
        business_name: Customer Order Count
        description: >-
          Number of orders by customer. Use this metric for customer purchase frequency analysis. 
          Result grain is one row per customer.
        return_type: BIGINT
        result_grain: one row per customer
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    customers.customer_id,
                    customers.customer_code,
                    COUNT(orders.order_id) AS customer_order_count
                FROM ecom_bronze.orders AS orders
                INNER JOIN ecom_bronze.customers AS customers
                    ON orders.customer_id = customers.customer_id
                GROUP BY customers.customer_id, customers.customer_code
              columns_used:
                - orders.customer_id
                - orders.order_id
                - customers.customer_id
                - customers.customer_code

      - name: customer_average_order_value
        business_name: Customer Average Order Value
        description: >-
          Average order value by customer, calculated as total customer revenue divided by number of orders. 
          Use this metric to understand typical order size by customer. Result grain is one row per customer.
        return_type: DECIMAL
        result_grain: one row per customer
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    customers.customer_id,
                    customers.customer_code,
                    CASE
                        WHEN COUNT(orders.order_id) = 0 THEN 0
                        ELSE SUM(orders.total_amount) / COUNT(orders.order_id)
                    END AS customer_average_order_value
                FROM ecom_bronze.orders AS orders
                INNER JOIN ecom_bronze.customers AS customers
                    ON orders.customer_id = customers.customer_id
                GROUP BY customers.customer_id, customers.customer_code
              columns_used:
                - orders.customer_id
                - orders.order_id
                - orders.total_amount
                - customers.customer_id
                - customers.customer_code

      - name: customer_segment_revenue
        business_name: Customer Segment Revenue
        description: >-
          Revenue by customer segment, calculated as the sum of order total amounts for customers in each segment. 
          Use this metric for segment performance analysis. Result grain is one row per segment.
        return_type: DECIMAL
        result_grain: one row per segment
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    customers.customer_segment,
                    SUM(orders.total_amount) AS customer_segment_revenue
                FROM ecom_bronze.orders AS orders
                INNER JOIN ecom_bronze.customers AS customers
                    ON orders.customer_id = customers.customer_id
                WHERE customers.customer_segment IS NOT NULL
                GROUP BY customers.customer_segment
              columns_used:
                - orders.customer_id
                - orders.total_amount
                - customers.customer_id
                - customers.customer_segment

      - name: monthly_revenue
        business_name: Monthly Revenue
        description: >-
          Revenue by month, calculated as the sum of order total amounts grouped by month. Use this metric 
          for time-series revenue analysis. Result grain is one row per month.
        return_type: DECIMAL
        result_grain: one row per month
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    DATE_TRUNC('month', orders.order_date) AS order_month,
                    SUM(orders.total_amount) AS monthly_revenue
                FROM ecom_bronze.orders AS orders
                GROUP BY DATE_TRUNC('month', orders.order_date)
              columns_used:
                - orders.order_date
                - orders.total_amount

      - name: daily_revenue
        business_name: Daily Revenue
        description: >-
          Revenue by day, calculated as the sum of order total amounts grouped by day. Use this metric 
          for daily revenue tracking. Result grain is one row per day.
        return_type: DECIMAL
        result_grain: one row per day
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    DATE_TRUNC('day', orders.order_date) AS order_day,
                    SUM(orders.total_amount) AS daily_revenue
                FROM ecom_bronze.orders AS orders
                GROUP BY DATE_TRUNC('day', orders.order_date)
              columns_used:
                - orders.order_date
                - orders.total_amount

      - name: payment_method_revenue
        business_name: Payment Method Revenue
        description: >-
          Revenue by payment method, calculated as the sum of completed payment amounts for each payment method. 
          Use this metric for payment method performance analysis. Result grain is one row per payment method.
        return_type: DECIMAL
        result_grain: one row per payment method
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    payments.payment_method,
                    SUM(payments.amount) AS payment_method_revenue
                FROM ecom_bronze.payments AS payments
                WHERE payments.payment_status = 'Completed'
                GROUP BY payments.payment_method
              columns_used:
                - payments.payment_method
                - payments.payment_status
                - payments.amount

      - name: payment_success_rate
        business_name: Payment Success Rate
        description: >-
          Payment success rate by payment method, calculated as the percentage of completed payments out of 
          all payment attempts. Use this metric for payment method reliability analysis. Result grain is one 
          row per payment method.
        return_type: DECIMAL
        result_grain: one row per payment method
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    payments.payment_method,
                    CASE
                        WHEN COUNT(payments.payment_id) = 0 THEN 0
                        ELSE SUM(CASE WHEN payments.payment_status = 'Completed' THEN 1 ELSE 0 END) 
                             / CAST(COUNT(payments.payment_id) AS DECIMAL) * 100
                    END AS payment_success_rate
                FROM ecom_bronze.payments AS payments
                GROUP BY payments.payment_method
              columns_used:
                - payments.payment_method
                - payments.payment_status
                - payments.payment_id

      - name: shipment_count
        business_name: Shipment Count
        description: >-
          Total count of shipments. Use this metric for shipment volume analysis.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(shipments.shipment_id) AS shipment_count
                FROM ecom_bronze.shipments AS shipments
              columns_used:
                - shipments.shipment_id

      - name: delivered_shipment_count
        business_name: Delivered Shipment Count
        description: >-
          Count of shipments with delivered status. Use this metric for delivery completion analysis.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(shipments.shipment_id) AS delivered_shipment_count
                FROM ecom_bronze.shipments AS shipments
                WHERE shipments.shipment_status = 'Delivered'
              columns_used:
                - shipments.shipment_id
                - shipments.shipment_status

      - name: carrier_shipment_count
        business_name: Carrier Shipment Count
        description: >-
          Shipment count by carrier. Use this metric for carrier volume analysis. Result grain is one row per carrier.
        return_type: BIGINT
        result_grain: one row per carrier
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    shipments.carrier,
                    COUNT(shipments.shipment_id) AS carrier_shipment_count
                FROM ecom_bronze.shipments AS shipments
                WHERE shipments.carrier IS NOT NULL
                GROUP BY shipments.carrier
              columns_used:
                - shipments.carrier
                - shipments.shipment_id

      - name: average_delivery_time_days
        business_name: Average Delivery Time (Days)
        description: >-
          Average delivery time in days, calculated as the average difference between delivered_at and shipped_at 
          timestamps for delivered shipments. Use this metric for delivery performance analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    AVG(DATEDIFF(shipments.delivered_at, shipments.shipped_at)) AS average_delivery_time_days
                FROM ecom_bronze.shipments AS shipments
                WHERE shipments.shipment_status = 'Delivered'
                  AND shipments.shipped_at IS NOT NULL
                  AND shipments.delivered_at IS NOT NULL
              columns_used:
                - shipments.shipment_status
                - shipments.shipped_at
                - shipments.delivered_at

      - name: order_status_count
        business_name: Order Status Count
        description: >-
          Order count by order status. Use this metric for order lifecycle analysis. Result grain is one row per status.
        return_type: BIGINT
        result_grain: one row per status
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    orders.order_status,
                    COUNT(orders.order_id) AS order_status_count
                FROM ecom_bronze.orders AS orders
                GROUP BY orders.order_status
              columns_used:
                - orders.order_status
                - orders.order_id

      - name: sales_channel_revenue
        business_name: Sales Channel Revenue
        description: >-
          Revenue by sales channel, calculated as the sum of order total amounts for each channel. Use this metric 
          for channel performance analysis. Result grain is one row per channel.
        return_type: DECIMAL
        result_grain: one row per channel
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    orders.sales_channel,
                    SUM(orders.total_amount) AS sales_channel_revenue
                FROM ecom_bronze.orders AS orders
                WHERE orders.sales_channel IS NOT NULL
                GROUP BY orders.sales_channel
              columns_used:
                - orders.sales_channel
                - orders.total_amount

      - name: average_discount_percentage
        business_name: Average Discount Percentage
        description: >-
          Average discount percentage across all order line items. Use this metric for discount strategy analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    AVG(order_items.discount_pct) AS average_discount_percentage
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.discount_pct

      - name: total_inventory_value
        business_name: Total Inventory Value
        description: >-
          Total inventory value, calculated as the sum of (stock_quantity * unit_price) for all active products. 
          Use this metric for inventory valuation analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(products.stock_quantity * products.unit_price) AS total_inventory_value
                FROM ecom_bronze.products AS products
                WHERE products.is_active = true
              columns_used:
                - products.stock_quantity
                - products.unit_price
                - products.is_active

      - name: total_inventory_cost
        business_name: Total Inventory Cost
        description: >-
          Total inventory cost, calculated as the sum of (stock_quantity * cost_price) for all active products 
          with documented cost. Use this metric for inventory cost analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(products.stock_quantity * products.cost_price) AS total_inventory_cost
                FROM ecom_bronze.products AS products
                WHERE products.is_active = true
                  AND products.cost_price IS NOT NULL
              columns_used:
                - products.stock_quantity
                - products.cost_price
                - products.is_active