              is_additive: true
          
          - name: is_active
            business_name: Is Active
            description: >-
              Indicates whether the product is currently active for sale. Use to filter for active products.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: created_at
            business_name: Created At
            description: >-
              Timestamp recording when the product was created in the system. Used for product lifecycle analysis.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: _source_system
            business_name: Source System
            description: >-
              Name of the source system from which the record originated. Technical metadata field.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ETL batch that loaded this record. Technical metadata field. May be null.
            sql_type: BIGINT
            constraints: []
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
