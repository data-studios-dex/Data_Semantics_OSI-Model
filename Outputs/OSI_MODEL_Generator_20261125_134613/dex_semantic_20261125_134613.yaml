version: "1.0"

semantic_model:
  - name: ecom_retail_analytics
    description: >-
      Comprehensive semantic model for e-commerce retail analytics covering customers, orders, products, 
      payments, and shipments. This model supports analytical queries across customer behavior, order fulfillment, 
      product performance, payment processing, and logistics operations. The model is derived from the ecom_bronze 
      schema containing transactional and master data for retail operations.
    
    ai_context:
      instructions: >-
        ## Dataset Grain Reference
        
        - **customers**: One row per customer. Contains customer master data including demographics, contact information, 
          and customer segment classification.
        
        - **orders**: One row per order. Contains order header information including customer reference, order dates, 
          status, shipping destination, and order-level financial totals (subtotal, discount, tax, shipping, total).
        
        - **order_items**: One row per order line item. Contains product-level detail for each order including product 
          reference, quantity, unit price, discount percentage, and line total. Multiple order items can exist for a 
          single order.
        
        - **products**: One row per product. Contains product master data including SKU, name, category reference, 
          brand, pricing, cost, and inventory levels.
        
        - **product_categories**: One row per product category. Contains category hierarchy with self-referencing 
          parent_category_id enabling multi-level category hierarchies.
        
        - **payments**: One row per payment transaction. Contains payment processing information including payment 
          method, status, amount, currency, gateway, and transaction reference. Multiple payments can exist for a 
          single order in split-payment scenarios.
        
        - **shipments**: One row per shipment. Contains shipment tracking and delivery information including carrier, 
          tracking number, status, and shipment/delivery timestamps. Multiple shipments can exist for a single order 
          in split-shipment scenarios.
        
        ## Metric Selection and Aggregation Guidance
        
        **Order-Level Revenue Metrics:**
        - Use `orders.total_amount` for order-level revenue analysis
        - Use `orders.subtotal` for pre-tax, pre-shipping revenue
        - Use `orders.discount_amount` for order-level discount analysis
        - Use `orders.tax_amount` for tax analysis
        - Use `orders.shipping_fee` for shipping revenue analysis
        - **CRITICAL**: Do NOT sum order-level amounts after joining orders to order_items - this will cause 
          double-counting. Order-level amounts are already aggregated at the order grain.
        
        **Line-Item-Level Revenue Metrics:**
        - Use `order_items.line_total` for product-level or line-item-level revenue analysis
        - Use `order_items.quantity * order_items.unit_price * (1 - order_items.discount_pct / 100)` for 
          calculated line revenue
        - Line-item metrics can be safely aggregated across products, categories, or time periods
        
        **Product Cost and Margin Analysis:**
        - Use `products.cost_price` joined to order_items via product_id to calculate cost of goods sold
        - Calculate line-level cost as: `order_items.quantity * products.cost_price`
        - Calculate line-level profit as: `order_items.line_total - (order_items.quantity * products.cost_price)`
        - **IMPORTANT**: Product cost must be joined at the order_items grain, not at the orders grain
        
        **Payment Metrics:**
        - Use `payments.amount` for payment transaction analysis
        - Payment amounts can differ from order totals in partial payment or refund scenarios
        - Filter by `payments.payment_status = 'Completed'` for successful payment analysis
        
        **Customer Metrics:**
        - Use `COUNT(DISTINCT customers.customer_id)` for customer counts
        - Use `customers.customer_segment` for segment-based analysis
        - Filter by `customers.is_active = true` for active customer analysis
        
        **Product Metrics:**
        - Use `products.stock_quantity` for inventory analysis
        - Use `products.unit_price` for current pricing analysis
        - Filter by `products.is_active = true` for active product analysis
        
        ## Join Guidance
        
        **Standard Relationships:**
        
        1. **orders → customers** (many-to-one):
           - Join: `orders.customer_id = customers.customer_id`
           - Use for customer demographic analysis of orders
        
        2. **order_items → orders** (many-to-one):
           - Join: `order_items.order_id = orders.order_id`
           - Use for order header information in line-item analysis
           - **WARNING**: Do NOT aggregate order-level amounts after this join
        
        3. **order_items → products** (many-to-one):
           - Join: `order_items.product_id = products.product_id`
           - Use for product attributes, pricing, and cost in line-item analysis
        
        4. **products → product_categories** (many-to-one):
           - Join: `products.category_id = product_categories.category_id`
           - Use for category-based product analysis
        
        5. **payments → orders** (many-to-one):
           - Join: `payments.order_id = orders.order_id`
           - Use for payment method and status analysis by order
           - Note: Multiple payments can exist per order
        
        6. **shipments → orders** (many-to-one):
           - Join: `shipments.order_id = orders.order_id`
           - Use for shipment tracking and delivery analysis by order
           - Note: Multiple shipments can exist per order
        
        **Hierarchical Relationship:**
        
        7. **product_categories → product_categories (self-referencing)** (many-to-one):
           - Join: `child.parent_category_id = parent.category_id`
           - Use recursive CTEs for full category hierarchy traversal
           - Example: Electronics → Consumer Electronics → Headphones
        
        ## Double-Counting Prevention
        
        **Critical Rule**: The orders table contains pre-aggregated order-level totals. When joining orders to 
        order_items, each order row will duplicate for every line item in that order.
        
        **Incorrect Query Pattern** (causes double-counting):
        ```sql
        SELECT 
            SUM(orders.total_amount) as total_revenue
        FROM orders
        JOIN order_items ON orders.order_id = order_items.order_id
        ```
        This will multiply each order's total_amount by the number of line items in that order.
        
        **Correct Query Patterns**:
        
        1. **For order-level metrics**, query orders directly:
        ```sql
        SELECT 
            SUM(orders.total_amount) as total_revenue
        FROM orders
        ```
        
        2. **For line-item metrics**, use order_items:
        ```sql
        SELECT 
            SUM(order_items.line_total) as total_line_revenue
        FROM order_items
        ```
        
        3. **For mixed-grain analysis**, use subqueries or window functions:
        ```sql
        SELECT 
            products.product_name,
            SUM(order_items.line_total) as product_revenue,
            COUNT(DISTINCT order_items.order_id) as order_count
        FROM order_items
        JOIN products ON order_items.product_id = products.product_id
        GROUP BY products.product_name
        ```
        
        ## Time Analysis Guidance
        
        **Order Date Fields:**
        - `orders.order_date`: Use for order placement time analysis (primary date for order metrics)
        - `orders.order_date` is a TIMESTAMP - use date truncation functions for daily/monthly/yearly aggregation
        
        **Payment Date Fields:**
        - `payments.paid_at`: Use for payment completion time analysis
        - May differ from order_date if payment is delayed
        
        **Shipment Date Fields:**
        - `shipments.shipped_at`: Use for shipment dispatch time analysis
        - `shipments.delivered_at`: Use for delivery completion time analysis
        - Calculate delivery time as: `delivered_at - shipped_at`
        - Calculate order-to-ship time as: `shipments.shipped_at - orders.order_date`
        
        **Product Date Fields:**
        - `products.created_at`: Use for product lifecycle analysis
        
        **Customer Date Fields:**
        - `customers.registration_date`: Use for customer acquisition analysis
        - `customers.date_of_birth`: Use for age-based demographic analysis (PII - handle with care)
        
        **Date Truncation in Databricks:**
        - Daily: `DATE_TRUNC('day', timestamp_column)`
        - Monthly: `DATE_TRUNC('month', timestamp_column)`
        - Quarterly: `DATE_TRUNC('quarter', timestamp_column)`
        - Yearly: `DATE_TRUNC('year', timestamp_column)`
        
        ## Query Restrictions and Limitations
        
        1. **PII Fields**: The following fields contain personally identifiable information and are redacted in 
           sample data. Use appropriate data governance controls:
           - customers.first_name, last_name, email, phone, date_of_birth
           - orders.tax_amount (marked as PII in glossary)
           - payments.transaction_ref
        
        2. **Currency Handling**: All monetary amounts are stored in their respective currency codes. The model 
           currently contains USD transactions. For multi-currency analysis, join to exchange rate tables using 
           currency code and transaction date.
        
        3. **Inactive Records**: Use is_active flags to filter for current/active records:
           - customers.is_active
           - products.is_active
           - product_categories.is_active
        
        4. **Status Fields**: Filter by status for specific analytical scenarios:
           - orders.order_status (e.g., 'Shipped', 'Delivered', 'Cancelled')
           - payments.payment_status (e.g., 'Completed', 'Pending', 'Failed')
           - shipments.shipment_status (e.g., 'In Transit', 'Delivered')
        
        5. **Multiple Payments/Shipments**: Be aware that orders can have multiple payment or shipment records. 
           Use appropriate aggregation or filtering when analyzing these relationships.
        
        6. **Category Hierarchy Depth**: The product_categories table supports unlimited hierarchy depth via 
           parent_category_id. Use recursive CTEs with appropriate depth limits to prevent infinite loops.
        
        7. **Null Handling**: Several optional fields may contain nulls:
           - customers.phone, gender, date_of_birth, postal_code, customer_segment
           - orders.sales_channel, ship_city, ship_state, ship_postal_code
           - products.brand, description, cost_price
           - product_categories.parent_category_id (null for root categories)
           - payments.transaction_ref, gateway, paid_at
           - shipments.carrier, tracking_number, shipped_at, delivered_at
        
        ## Recommended Analytical Patterns
        
        **Customer Lifetime Value Analysis:**
        - Aggregate orders.total_amount by customer_id
        - Consider time period filters on orders.order_date
        - Join to customers for segmentation
        
        **Product Performance Analysis:**
        - Aggregate order_items.line_total by product_id
        - Join to products for product attributes
        - Join to product_categories for category-level analysis
        - Calculate profit using products.cost_price
        
        **Order Fulfillment Analysis:**
        - Join orders → shipments
        - Calculate time-to-ship: shipments.shipped_at - orders.order_date
        - Calculate time-to-deliver: shipments.delivered_at - shipments.shipped_at
        - Filter by shipment_status for delivery performance
        
        **Payment Success Analysis:**
        - Aggregate payments by payment_method and payment_status
        - Calculate success rate: COUNT(status='Completed') / COUNT(*)
        - Join to orders for order context
        
        **Category Hierarchy Analysis:**
        - Use recursive CTE to traverse product_categories hierarchy
        - Aggregate product/order_items metrics up the hierarchy
        - Example: Total revenue for Electronics and all subcategories

    datasets:
      - name: customers
        business_name: Customers
        description: >-
          Customer master data containing one row per customer. Includes customer demographics, contact information, 
          geographic location, customer segment classification, registration information, and account status. This 
          dataset represents the analytical grain of individual customers and supports customer-level analysis, 
          segmentation, and demographic reporting.
        source: ecom_bronze.customers
        primary_key:
          - customer_id
        fields:
          - name: customer_id
            business_name: Customer Identifier
            description: >-
              Unique identifier for a customer. Primary key for the customers table.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: customer_code
            business_name: Customer Code
            description: >-
              Business reference code assigned to the customer. Used for external customer identification.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: first_name
            business_name: First Name
            description: >-
              First name of the customer. Contains personally identifiable information (PII).
            sql_type: STRING
            constraints:
              - NOT NULL
              - PII
          
          - name: last_name
            business_name: Last Name
            description: >-
              Last name of the customer. Contains personally identifiable information (PII).
            sql_type: STRING
            constraints:
              - NOT NULL
              - PII
          
          - name: email
            business_name: Email
            description: >-
              Email address of the customer. Contains personally identifiable information (PII).
            sql_type: STRING
            constraints:
              - NOT NULL
              - PII
          
          - name: phone
            business_name: Phone
            description: >-
              Phone number of the customer. Contains personally identifiable information (PII). May be null.
            sql_type: STRING
            constraints:
              - PII
          
          - name: gender
            business_name: Gender
            description: >-
              Gender of the customer. Used for demographic analysis. May be null.
            sql_type: STRING
            constraints: []
            dimension:
              is_categorical: true
          
          - name: date_of_birth
            business_name: Date Of Birth
            description: >-
              Date of birth of the customer. Contains personally identifiable information (PII). Used for age-based 
              demographic analysis. May be null.
            sql_type: DATE
            constraints:
              - PII
            dimension:
              is_time: true
          
          - name: city
            business_name: City
            description: >-
              City where the customer resides. Used for geographic analysis. May be null.
            sql_type: STRING
            constraints: []
            dimension:
              is_categorical: true
          
          - name: state
            business_name: State
            description: >-
              State or province where the customer resides. Used for geographic analysis. May be null.
            sql_type: STRING
            constraints: []
            dimension:
              is_categorical: true
          
          - name: country
            business_name: Country
            description: >-
              Country where the customer resides. Used for geographic analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: postal_code
            business_name: Postal Code
            description: >-
              Postal or ZIP code of the customer's address. Used for geographic analysis. May be null.
            sql_type: STRING
            constraints: []
          
          - name: customer_segment
            business_name: Customer Segment
            description: >-
              Indicates the current segment classification of the customer (e.g., Premium, Standard, Basic). 
              Used for customer segmentation analysis. May be null.
            sql_type: STRING
            constraints: []
            dimension:
              is_categorical: true
          
          - name: registration_date
            business_name: Registration Date
            description: >-
              Date when the customer registered. Used for customer acquisition and cohort analysis. May be null.
            sql_type: DATE
            constraints: []
            dimension:
              is_time: true
          
          - name: is_active
            business_name: Is Active
            description: >-
              Indicates whether the customer account is currently active. Use to filter for active customers.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: >-
              Name of the source system from which the record originated. Technical metadata field.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ETL batch that loaded this record. Technical metadata field. May be null.
            sql_type: BIGINT
            constraints: []
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp recording when the record was loaded into the table. Technical metadata field.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

      - name: orders
        business_name: Orders
        description: >-
          Order header data containing one row per order. Includes customer reference, order timing, order status, 
          sales channel, shipping destination, and order-level financial totals (subtotal, discount, tax, shipping, 
          and total amount). This dataset represents the analytical grain of individual orders and supports order-level 
          analysis. IMPORTANT: Order-level financial amounts (subtotal, discount_amount, tax_amount, shipping_fee, 
          total_amount) are pre-aggregated at the order level and must NOT be summed after joining to order_items 
          to avoid double-counting.
        source: ecom_bronze.orders
        primary_key:
          - order_id
        fields:
          - name: order_id
            business_name: Order Identifier
            description: >-
              Unique identifier for an order. Primary key for the orders table.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_number
            business_name: Order Number
            description: >-
              Business reference number assigned to the order. Used for external order identification.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: customer_id
            business_name: Customer ID
            description: >-
              References the related customer record. Foreign key to customers.customer_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: order_date
            business_name: Order Date
            description: >-
              Timestamp recording when the order was placed. Primary date field for order time-series analysis.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: order_status
            business_name: Order Status
            description: >-
              Indicates the current status of the order (e.g., Shipped, Delivered, Cancelled, Pending). 
              Used for order lifecycle and fulfillment analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: sales_channel
            business_name: Sales Channel
            description: >-
              Indicates the channel through which the order was placed (e.g., Online, Mobile, In-Store). 
              Used for channel performance analysis. May be null.
            sql_type: STRING
            constraints: []
            dimension:
              is_categorical: true
          
          - name: ship_city
            business_name: Ship City
            description: >-
              City to which the order is shipped. Used for shipping destination analysis. May be null.
            sql_type: STRING
            constraints: []
            dimension:
              is_categorical: true
          
          - name: ship_state
            business_name: Ship State
            description: >-
              State or province to which the order is shipped. Used for shipping destination analysis. May be null.
            sql_type: STRING
            constraints: []
            dimension:
              is_categorical: true
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: >-
              Postal or ZIP code to which the order is shipped. Used for shipping destination analysis. May be null.
            sql_type: STRING
            constraints: []
          
          - name: subtotal
            business_name: Subtotal
            description: >-
              Monetary amount representing the order subtotal before discounts and taxes. Pre-aggregated at order level.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              is_additive: true
          
          - name: discount_amount
            business_name: Discount Amount
            description: >-
              Monetary amount representing the total discount applied to the order. Pre-aggregated at order level.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              is_additive: true
          
          - name: tax_amount
            business_name: Tax Amount
            description: >-
              Monetary amount representing the tax charged on the order. Pre-aggregated at order level. 
              Marked as PII in source glossary.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
              - PII
            measure:
              aggregation: SUM
              is_additive: true
          
          - name: shipping_fee
            business_name: Shipping Fee
            description: >-
              Monetary amount representing the shipping cost for the order. Pre-aggregated at order level.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              is_additive: true
          
          - name: total_amount
            business_name: Total Amount
            description: >-
              Monetary amount representing the final total of the order. Pre-aggregated at order level. 
              This is the primary revenue measure for order-level analysis.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              is_additive: true
          
          - name: currency
            business_name: Currency
            description: >-
              Currency code for the order amounts (e.g., USD, EUR, GBP). Used for multi-currency analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: >-
              Name of the source system from which the record originated. Technical metadata field.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ETL batch that loaded this record. Technical metadata field. May be null.
            sql_type: BIGINT
            constraints: []
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp recording when the record was loaded into the table. Technical metadata field.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

      - name: order_items
        business_name: Order Items
        description: >-
          Order line item data containing one row per order line item. Includes order reference, line sequence, 
          product reference, quantity, unit pricing, discount percentage, and line-level total. This dataset 
          represents the analytical grain of individual order line items and supports product-level order analysis. 
          Multiple order items can exist for a single order. Use this dataset for product-level revenue analysis 
          and cost of goods sold calculations.
        source: ecom_bronze.order_items
        primary_key:
          - order_item_id
        fields:
          - name: order_item_id
            business_name: Order Item Identifier
            description: >-
              Unique identifier for an order line item. Primary key for the order_items table.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: >-
              References the related order record. Foreign key to orders.order_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: line_number
            business_name: Line Number
            description: >-
              Sequential line number within the order. Used for line item ordering and identification.
            sql_type: INT
            constraints:
              - NOT NULL
          
          - name: product_id
            business_name: Product ID
            description: >-
              References the related product record. Foreign key to products.product_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: quantity
            business_name: Quantity
            description: >-
              Number of units ordered for this line item. Used for volume analysis and inventory calculations.
            sql_type: INT
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              is_additive: true
          
          - name: unit_price
            business_name: Unit Price
            description: >-
              Monetary amount representing the price per unit at the time of order. Used for pricing analysis.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
              is_additive: false
          
          - name: discount_pct
            business_name: Discount Pct
            description: >-
              Percentage discount applied to the line item. Used for discount analysis and revenue calculations.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
              is_additive: false
          
          - name: line_total
            business_name: Line Total
            description: >-
              Monetary amount representing the total for this line item after discount. Calculated as 
              quantity * unit_price * (1 - discount_pct / 100). This is the primary revenue measure for 
              line-item-level and product-level analysis.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              is_additive: true
          
          - name: _source_system
            business_name: Source System
            description: >-
              Name of the source system from which the record originated. Technical metadata field.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ETL batch that loaded this record. Technical metadata field. May be null.
            sql_type: BIGINT
            constraints: []
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp recording when the record was loaded into the table. Technical metadata field.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

      - name: products
        business_name: Products
        description: >-
          Product master data containing one row per product. Includes product identification (SKU), product name, 
          category reference, brand, description, pricing (unit price and cost price), currency, inventory levels, 
          and product status. This dataset represents the analytical grain of individual products and supports 
          product-level analysis, pricing analysis, inventory management, and cost of goods sold calculations.
        source: ecom_bronze.products
        primary_key:
          - product_id
        fields:
          - name: product_id
            business_name: Product Identifier
            description: >-
              Unique identifier for a product. Primary key for the products table.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: sku
            business_name: SKU
            description: >-
              Stock keeping unit code for the product. Used for product identification and inventory management.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: product_name
            business_name: Product Name
            description: >-
              Name of the product. Used for product identification and reporting.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: category_id
            business_name: Category ID
            description: >-
              References the related product category record. Foreign key to product_categories.category_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: brand
            business_name: Brand
            description: >-
              Brand name of the product. Used for brand-level analysis. May be null.
            sql_type: STRING
            constraints: []
            dimension:
              is_categorical: true
          
          - name: description
            business_name: Description
            description: >-
              Detailed description of the product. May be null.
            sql_type: STRING
            constraints: []
          
          - name: unit_price
            business_name: Unit Price
            description: >-
              Monetary amount representing the current selling price per unit. Used for pricing analysis.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
              is_additive: false
          
          - name: cost_price
            business_name: Cost Price
            description: >-
              Monetary amount representing the cost per unit. Used for cost of goods sold and margin calculations. 
              May be null.
            sql_type: DECIMAL
            constraints: []
            measure:
              aggregation: AVG
              is_additive: false
          
          - name: currency
            business_name: Currency
            description: >-
              Currency code for the product prices (e.g., USD, EUR, GBP). Used for multi-currency analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: stock_quantity
            business_name: Stock Quantity
            description: >-
              Current inventory quantity available for the product. Used for inventory analysis and stock management.
            sql_type: INT
            constraints:
              - NOT NULL
            measure:
