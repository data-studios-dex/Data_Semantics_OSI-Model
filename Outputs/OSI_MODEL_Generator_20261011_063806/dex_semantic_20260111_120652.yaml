version: "1.0"

semantic_model:
  - name: retail_change_management_semantic_model
    description: >-
      Semantic model for retail change management and modification tracking system.
      This model supports analytical queries across modifications, tasks, impacts, 
      baselines, completion gates, subtasks, and audit events. The model enables 
      tracking of change requests, task execution, impact assessments, and audit trails 
      within a retail operational environment.
    
    ai_context:
      instructions: >-
        ## Dataset Grain
        
        - **mod_record**: One row per modification. Each modification represents a change request 
          with approval workflow, classification, and associated documentation references.
        
        - **task_record**: One row per task. Tasks are associated with modifications and represent 
          work items that must be completed to implement a modification.
        
        - **subtask**: One row per subtask. Subtasks are ordered components of a parent task, 
          identified by sequence number.
        
        - **impact_record**: One row per impact assessment. Impact records document the effect 
          of modifications on baseline items and include ownership and selection status.
        
        - **completion_gate**: One row per completion gate checkpoint. Gates represent quality 
          or approval checkpoints associated with tasks.
        
        - **baseline_record**: One row per baseline configuration record. Baseline records 
          document standard configurations, policies, or reference items.
        
        - **audit_event**: One row per audit event. Audit events track actions performed on 
          records throughout the system.
        
        ## Metric Selection
        
        - Use **total_modification_count** to count all modifications in the system.
        
        - Use **active_modification_count** to count only currently active modifications.
        
        - Use **approved_modification_count** to count modifications with approved status.
        
        - Use **total_task_count** to count all tasks.
        
        - Use **in_progress_task_count** to count tasks currently in progress.
        
        - Use **total_impact_count** to count all impact assessments.
        
        - Use **selected_impact_count** to count impact records marked as selected for action.
        
        - Use **total_completion_gate_count** to count all completion gates.
        
        - Use **checked_completion_gate_count** to count gates that have been checked off.
        
        - Use **completion_rate_pct** to calculate the percentage of completion gates that 
          have been checked.
        
        - Use **total_subtask_count** to count all subtasks.
        
        - Use **total_audit_event_count** to count all audit events.
        
        - Use **tasks_per_modification** to calculate the average number of tasks per modification.
        
        - Use **impacts_per_modification** to calculate the average number of impact assessments 
          per modification.
        
        ## Join Guidance
        
        ### Standard Relationships
        
        - **task_record to mod_record**: Join task_record.mod_id = mod_record.mod_id to associate 
          tasks with their parent modification. This is a many-to-one relationship.
        
        - **subtask to task_record**: Join subtask.task_id = task_record.task_id to associate 
          subtasks with their parent task. This is a many-to-one relationship.
        
        - **completion_gate to task_record**: Join completion_gate.task_id = task_record.task_id 
          to associate completion gates with their parent task. This is a many-to-one relationship.
        
        - **impact_record to mod_record**: Join impact_record.mod_id = mod_record.mod_id to 
          associate impact assessments with their parent modification. This is a many-to-one 
          relationship.
        
        ### Reference Relationships
        
        - **impact_record to baseline_record**: Join impact_record.baseline_ref = baseline_record.section_ref 
          to link impact assessments to baseline items. Note that baseline_ref in impact_record 
          references section_ref in baseline_record, not baseline_id.
        
        ## Double Counting Prevention
        
        ### Modification-Level Measures
        
        When analyzing modifications:
        
        - Do NOT join to task_record, impact_record, completion_gate, or subtask and then 
          aggregate modification-level fields, as this will cause duplication.
        
        - To count modifications, query mod_record directly.
        
        - To analyze modification attributes (class, status, dates), query mod_record directly 
          or use appropriate aggregation after joining.
        
        ### Task-Level Measures
        
        When analyzing tasks:
        
        - Do NOT join to subtask or completion_gate and then aggregate task-level fields 
          without handling duplication.
        
        - To count tasks, query task_record directly or use COUNT(DISTINCT task_id) after joining.
        
        - To analyze task attributes, query task_record directly or use appropriate aggregation.
        
        ### Subtask and Completion Gate Analysis
        
        - Subtasks and completion gates are detail-level entities.
        
        - When counting subtasks or gates, query their respective tables directly.
        
        - When joining back to task_record or mod_record, use COUNT(DISTINCT) or aggregate 
          appropriately to avoid double counting.
        
        ## Time Analysis
        
        ### Modification Timeline
        
        - Use **mod_record.created_date** to analyze when modifications were created.
        
        - Use **mod_record.updated_date** to analyze when modifications were last updated.
        
        - The difference between created_date and updated_date can indicate modification 
          processing time.
        
        ### Task Timeline
        
        - Use **task_record.created_date** to analyze when tasks were created.
        
        - Use **task_record.updated_date** to analyze when tasks were last updated.
        
        - The difference between created_date and updated_date can indicate task processing time.
        
        ### Audit Timeline
        
        - Use **audit_event.event_ts** to analyze when audit events occurred.
        
        - Audit events provide a temporal record of actions performed across the system.
        
        ## Query Restrictions
        
        - **PII Handling**: The field impact_record.owner_name contains personally identifiable 
          information. Queries returning this field should apply appropriate access controls 
          and data masking where required.
        
        - **Reference Integrity**: When joining impact_record to baseline_record, use 
          impact_record.baseline_ref = baseline_record.section_ref, not baseline_id.
        
        - **Active vs. Historical**: The mod_record.is_active field indicates whether a 
          modification is currently active. Filter by is_active = 1 to exclude historical 
          or inactive modifications.
        
        - **Status Filtering**: Task status and approval status are text fields. Ensure 
          consistent case-sensitive or case-insensitive matching depending on the database 
          collation settings.
        
        - **Sequence Ordering**: Subtasks should be ordered by subtask.seq_no to maintain 
          the correct execution sequence within a task.
    
    datasets:
      - name: mod_record
        business_name: Modification Record
        description: >-
          Contains modification records representing change requests within the retail 
          change management system. Each row represents one modification with associated 
          classification, approval status, references to supporting documentation, and 
          activity status. Modifications are the primary entity for tracking changes 
          and are associated with tasks and impact assessments.
        source: staging.mod_record
        primary_key:
          - mod_id
        fields:
          - name: mod_id
            business_name: Modification Identifier
            description: Unique identifier for the modification record.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - PRIMARY KEY
          
          - name: mod_ref
            business_name: Modification Reference
            description: Reference code assigned to the modification for external identification.
            sql_type: VARCHAR(50)
            constraints:
              - NOT NULL
          
          - name: title
            business_name: Title
            description: Title or short description of the modification.
            sql_type: VARCHAR(200)
            constraints: []
            dimension:
              is_categorical: true
          
          - name: mod_class
            business_name: Modification Class
            description: Classification or category of the modification (e.g., Minor Change, Major Change).
            sql_type: VARCHAR(50)
            constraints: []
            dimension:
              is_categorical: true
          
          - name: applicability
            business_name: Applicability
            description: Description of where or to which items the modification applies.
            sql_type: TEXT
            constraints: []
          
          - name: approved_data_ref
            business_name: Approved Data Reference
            description: Reference to the approved data or documentation supporting the modification.
            sql_type: VARCHAR(200)
            constraints: []
          
          - name: approval_status
            business_name: Approval Status
            description: Indicates the current approval status of the modification (e.g., Approved, Pending, Rejected).
            sql_type: VARCHAR(100)
            constraints: []
            dimension:
              is_categorical: true
          
          - name: drawing_ref
            business_name: Drawing Reference
            description: Reference identifier for any related drawings or schematics.
            sql_type: VARCHAR(200)
            constraints: []
          
          - name: ica_ref
            business_name: ICA Reference
            description: Reference identifier for related internal change authorization or similar document.
            sql_type: VARCHAR(200)
            constraints: []
          
          - name: change_desc
            business_name: Change Description
            description: Detailed description of the change introduced by the modification.
            sql_type: TEXT
            constraints: []
          
          - name: safety_classification
            business_name: Safety Classification
            description: Classification describing any safety implications of the modification.
            sql_type: VARCHAR(150)
            constraints: []
            dimension:
              is_categorical: true
          
          - name: cert_basis
            business_name: Certification Basis
            description: Certification or regulatory basis on which the modification is justified.
            sql_type: TEXT
            constraints: []
          
          - name: release_authorities
            business_name: Release Authorities
            description: Authorities or roles authorized to release the modification.
            sql_type: VARCHAR(300)
            constraints: []
          
          - name: target_revision
            business_name: Target Revision
            description: Target revision or version that the modification is associated with.
            sql_type: VARCHAR(100)
            constraints: []
          
          - name: is_active
            business_name: Is Active
            description: Indicates whether the modification record is currently active (1 = active, 0 = inactive).
            sql_type: BIT
            constraints: []
            dimension:
              is_categorical: true
          
          - name: created_date
            business_name: Created Date
            description: Timestamp recording when the modification record was created.
            sql_type: DATETIME
            constraints: []
            dimension:
              is_time: true
          
          - name: updated_date
            business_name: Updated Date
            description: Timestamp recording when the modification record was last updated.
            sql_type: DATETIME
            constraints: []
            dimension:
              is_time: true
      
      - name: task_record
        business_name: Task Record
        description: >-
          Contains task records representing work items that must be completed to implement 
          modifications. Each row represents one task associated with a modification. Tasks 
          have status, effectivity, requirements, and associated subtasks and completion gates.
        source: staging.task_record
        primary_key:
          - task_id
        fields:
          - name: task_id
            business_name: Task Identifier
            description: Unique identifier for the task record.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - PRIMARY KEY
          
          - name: mod_id
            business_name: Modification Identifier
            description: Identifier of the modification associated with this task. Foreign key to mod_record.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: task_ref
            business_name: Task Reference
            description: Reference code assigned to the task for external identification.
            sql_type: VARCHAR(50)
            constraints: []
          
          - name: title
            business_name: Title
            description: Title or short description of the task.
            sql_type: VARCHAR(300)
            constraints: []
            dimension:
              is_categorical: true
          
          - name: source_ref
            business_name: Source Reference
            description: Reference to the originating source document or requirement.
            sql_type: VARCHAR(20)
            constraints: []
          
          - name: effectivity
            business_name: Effectivity
            description: Description of when or where the task becomes effective.
            sql_type: TEXT
            constraints: []
          
          - name: preliminary_requirements
            business_name: Preliminary Requirements
            description: List of prerequisites that must be met before the task can start.
            sql_type: TEXT
            constraints: []
          
          - name: safety_text
            business_name: Safety Text
            description: Safety-related instructions or warnings associated with the task.
            sql_type: TEXT
            constraints: []
          
          - name: status
            business_name: Status
            description: Indicates the current status of the task (e.g., In Progress, Completed, Pending).
            sql_type: VARCHAR(30)
            constraints: []
            dimension:
              is_categorical: true
          
          - name: created_date
            business_name: Created Date
            description: Timestamp recording when the task record was created.
            sql_type: DATETIME
            constraints: []
            dimension:
              is_time: true
          
          - name: updated_date
            business_name: Updated Date
            description: Timestamp recording when the task record was last updated.
            sql_type: DATETIME
            constraints: []
            dimension:
              is_time: true
      
      - name: subtask
        business_name: Subtask
        description: >-
          Contains subtask records representing ordered components of parent tasks. Each row 
          represents one subtask with a sequence number defining its order within the task. 
          Subtasks provide detailed breakdown of task execution steps.
        source: staging.subtask
        primary_key:
          - subtask_id
        fields:
          - name: subtask_id
            business_name: Subtask Identifier
            description: Unique identifier for the subtask record.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - PRIMARY KEY
          
          - name: task_id
            business_name: Task Identifier
            description: Identifier of the parent task associated with this subtask. Foreign key to task_record.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: seq_no
            business_name: Sequence Number
            description: Sequence number defining the order of the subtask within the task.
            sql_type: BIGINT
            constraints: []
            dimension:
              is_categorical: true
          
          - name: description
            business_name: Description
            description: Detailed description of the subtask to be performed.
            sql_type: TEXT
            constraints: []
      
      - name: completion_gate
        business_name: Completion Gate
        description: >-
          Contains completion gate records representing quality or approval checkpoints 
          associated with tasks. Each row represents one completion gate with a checked 
          status indicating whether the gate has been passed.
        source: staging.completion_gate
        primary_key:
          - gate_id
        fields:
          - name: gate_id
            business_name: Gate Identifier
            description: Unique identifier for the completion gate record.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - PRIMARY KEY
          
          - name: task_id
            business_name: Task Identifier
            description: Identifier of the task associated with this completion gate. Foreign key to task_record.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: gate_name
            business_name: Gate Name
            description: Name or label of the completion gate checkpoint.
            sql_type: VARCHAR(200)
            constraints: []
            dimension:
              is_categorical: true
          
          - name: is_checked
            business_name: Is Checked
            description: Indicates whether the completion gate has been checked off (1 = checked, 0 = not checked).
            sql_type: BIT
            constraints: []
            dimension:
              is_categorical: true
      
      - name: impact_record
        business_name: Impact Record
        description: >-
          Contains impact assessment records documenting the effect of modifications on 
          baseline items. Each row represents one impact assessment with rationale, change 
          type, ownership, and selection status. Impact records link modifications to 
          affected baseline configurations.
        source: staging.impact_record
        primary_key:
          - impact_id
        fields:
          - name: impact_id
            business_name: Impact Identifier
            description: Unique identifier for the impact record.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - PRIMARY KEY
          
          - name: mod_id
            business_name: Modification Identifier
            description: Identifier of the modification associated with this impact. Foreign key to mod_record.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: baseline_ref
            business_name: Baseline Reference
            description: Reference code for the baseline item impacted by the modification. References baseline_record.section_ref.
            sql_type: VARCHAR(20)
            constraints: []
          
          - name: rationale
            business_name: Rationale
            description: Explanation of the rationale for the impact assessment.
            sql_type: TEXT
            constraints: []
          
          - name: change_type
            business_name: Change Type
            description: Indicates the type or category of change being recorded (e.g., Process Update, Configuration Change).
            sql_type: VARCHAR(30)
            constraints: []
            dimension:
              is_categorical: true
          
          - name: owner_name
            business_name: Owner Name
            description: Name of the owner responsible for the impact record. Contains PII.
            sql_type: VARCHAR(150)
            constraints:
              - PII
          
          - name: is_selected
            business_name: Is Selected
            description: Indicates whether this impact record has been selected for action or inclusion (1 = selected, 0 = not selected).
            sql_type: BIT
            constraints: []
            dimension:
              is_categorical: true
      
      - name: baseline_record
        business_name: Baseline Record
        description: >-
          Contains baseline configuration records documenting standard configurations, 
          policies, or reference items. Each row represents one baseline record with 
          section reference, title, topic, and sensitivity classification.
        source: staging.baseline_record
        primary_key:
          - baseline_id
        fields:
          - name: baseline_id
            business_name: Baseline Identifier
            description: Unique identifier for the baseline record.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - PRIMARY KEY
          
          - name: section_ref
            business_name: Section Reference
            description: Reference code identifying the related baseline section. Used by impact_record.baseline_ref.
            sql_type: VARCHAR(20)
            constraints: []
          
          - name: title
            business_name: Title
            description: Title or short name of the baseline record.
            sql_type: VARCHAR(200)
            constraints: []
            dimension:
              is_categorical: true
          
          - name: topic
            business_name: Topic
            description: Topic or subject area covered by the baseline record.
            sql_type: VARCHAR(300)
            constraints: []
            dimension:
              is_categorical: true
          
          - name: sensitivity
            business_name: Sensitivity
            description: Indicates the sensitivity classification of the baseline record (e.g., Confidential, Public).
            sql_type: VARCHAR(50)
            constraints: []
            dimension:
              is_categorical: true
      
      - name: audit_event
        business_name: Audit Event
        description: >-
          Contains audit event records tracking actions performed on records throughout 
          the system. Each row represents one audit event with timestamp, action type, 
          record reference, and event details. Audit events provide a temporal record 
          of system activity.
        source: staging.audit_event
        primary_key:
          - audit_id
        fields:
          - name: audit_id
            business_name: Audit Identifier
            description: Unique identifier for the audit event record.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - PRIMARY KEY
          
          - name: event_ts
            business_name: Event Timestamp
            description: Timestamp recording when the audit event occurred.
            sql_type: DATETIME
            constraints: []
            dimension:
              is_time: true
          
          - name: action
            business_name: Action
            description: Type of action that was performed and recorded by the audit event (e.g., UPDATE_RECORD, CREATE_RECORD).
            sql_type: VARCHAR(150)
            constraints: []
            dimension:
              is_categorical: true
          
          - name: record_ref
            business_name: Record Reference
            description: Reference identifier of the record affected by the audit event.
            sql_type: VARCHAR(150)
            constraints: []
          
          - name: details
            business_name: Details
            description: Free-text details describing the audit event.
            sql_type: TEXT
            constraints: []
    
    relationships:
      - name: task_to_modification
        left_dataset: task_record
        right_dataset: mod_record
        relationship_type: many_to_one
        join:
          left:
            - mod_id
          right:
            - mod_id
        join_type: inner
        resolution: >-
          Each task is associated with exactly one modification. Multiple tasks may be 
          associated with the same modification. Join task_record.mod_id to mod_record.mod_id 
          to associate tasks with their parent modification.
      
      - name: subtask_to_task
        left_dataset: subtask
        right_dataset: task_record
        relationship_type: many_to_one
        join:
          left:
            - task_id
          right:
            - task_id
        join_type: inner
        resolution: >-
          Each subtask is associated with exactly one parent task. Multiple subtasks may be 
          associated with the same task. Join subtask.task_id to task_record.task_id to 
          associate subtasks with their parent task. Subtasks should be ordered by seq_no 
          to maintain execution sequence.
      
      - name: completion_gate_to_task
        left_dataset: completion_gate
        right_dataset: task_record
        relationship_type: many_to_one
        join:
          left:
            - task_id
          right:
            - task_id
        join_type: inner
        resolution: >-
          Each completion gate is associated with exactly one task. Multiple completion gates 
          may be associated with the same task. Join completion_gate.task_id to task_record.task_id 
          to associate completion gates with their parent task.
      
      - name: impact_to_modification
        left_dataset: impact_record
        right_dataset: mod_record
        relationship_type: many_to_one
        join:
          left:
            - mod_id
          right:
            - mod_id
        join_type: inner
        resolution: >-
          Each impact assessment is associated with exactly one modification. Multiple impact 
          assessments may be associated with the same modification. Join impact_record.mod_id 
          to mod_record.mod_id to associate impact assessments with their parent modification.
      
      - name: impact_to_baseline
        left_dataset: impact_record
        right_dataset: baseline_record
        relationship_type: many_to_one
        join:
          left:
            - baseline_ref
          right:
            - section_ref
        join_type: left
        resolution: >-
          Each impact assessment may reference a baseline item. The relationship uses 
          impact_record.baseline_ref joined to baseline_record.section_ref (not baseline_id). 
          This is a left join because not all impact records may reference a baseline item. 
          Multiple impact records may reference the same baseline item.
    
    metrics:
      - name: total_modification_count
        business_name: Total Modification Count
        description: >-
          Total count of all modification records in the system, regardless of status or activity.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    COUNT(*) AS total_modification_count
                FROM staging.mod_record AS mod_record
              columns_used:
                - mod_record.mod_id
      
      - name: active_modification_count
        business_name: Active Modification Count
        description: >-
          Count of modification records that are currently active (is_active = 1).
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    COUNT(*) AS active_modification_count
                FROM staging.mod_record AS mod_record
                WHERE mod_record.is_active = 1
              columns_used:
                - mod_record.mod_id
                - mod_record.is_active
      
      - name: approved_modification_count
        business_name: Approved Modification Count
        description: >-
          Count of modification records with approval status equal to 'Approved'.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    COUNT(*) AS approved_modification_count
                FROM staging.mod_record AS mod_record
                WHERE mod_record.approval_status = 'Approved'
              columns_used:
                - mod_record.mod_id
                - mod_record.approval_status
      
      - name: total_task_count
        business_name: Total Task Count
        description: >-
          Total count of all task records in the system, regardless of status.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    COUNT(*) AS total_task_count
                FROM staging.task_record AS task_record
              columns_used:
                - task_record.task_id
      
      - name: in_progress_task_count
        business_name: In Progress Task Count
        description: >-
          Count of task records with status equal to 'In Progress'.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    COUNT(*) AS in_progress_task_count
                FROM staging.task_record AS task_record
                WHERE task_record.status = 'In Progress'
              columns_used:
                - task_record.task_id
                - task_record.status
      
      - name: total_impact_count
        business_name: Total Impact Count
        description: >-
          Total count of all impact assessment records in the system.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    COUNT(*) AS total_impact_count
                FROM staging.impact_record AS impact_record
              columns_used:
                - impact_record.impact_id
      
      - name: selected_impact_count
        business_name: Selected Impact Count
        description: >-
          Count of impact assessment records that have been selected for action (is_selected = 1).
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    COUNT(*) AS selected_impact_count
                FROM staging.impact_record AS impact_record
                WHERE impact_record.is_selected = 1
              columns_used:
                - impact_record.impact_id
                - impact_record.is_selected
      
      - name: total_completion_gate_count
        business_name: Total Completion Gate Count
        description: >-
          Total count of all completion gate records in the system.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    COUNT(*) AS total_completion_gate_count
                FROM staging.completion_gate AS completion_gate
              columns_used:
                - completion_gate.gate_id
      
      - name: checked_completion_gate_count
        business_name: Checked Completion Gate Count
        description: >-
          Count of completion gate records that have been checked off (is_checked = 1).
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    COUNT(*) AS checked_completion_gate_count
                FROM staging.completion_gate AS completion_gate
                WHERE completion_gate.is_checked = 1
              columns_used:
                - completion_gate.gate_id
                - completion_gate.is_checked
      
      - name: completion_rate_pct
        business_name: Completion Rate Percentage
        description: >-
          Percentage of completion gates that have been checked off, calculated as 
          (checked gates / total gates) * 100. Returns 0 if no gates exist.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(*) = 0 THEN 0
                        ELSE (SUM(CASE WHEN completion_gate.is_checked = 1 THEN 1 ELSE 0 END) * 100.0) / COUNT(*)
                    END AS completion_rate_pct
                FROM staging.completion_gate AS completion_gate
              columns_used:
                - completion_gate.gate_id
                - completion_gate.is_checked
      
      - name: total_subtask_count
        business_name: Total Subtask Count
        description: >-
          Total count of all subtask records in the system.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    COUNT(*) AS total_subtask_count
                FROM staging.subtask AS subtask
              columns_used:
