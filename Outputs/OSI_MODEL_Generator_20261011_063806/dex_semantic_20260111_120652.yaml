      - name: modification_count_by_created_month
        business_name: Modification Count By Created Month
        description: >-
          Count of modifications grouped by the month they were created. Returns one row 
          per year-month combination.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    YEAR(mod_record.created_date) AS created_year,
                    MONTH(mod_record.created_date) AS created_month,
                    COUNT(*) AS modification_count
                FROM staging.mod_record AS mod_record
                WHERE mod_record.created_date IS NOT NULL
                GROUP BY YEAR(mod_record.created_date), MONTH(mod_record.created_date)
                ORDER BY created_year, created_month
              columns_used:
                - mod_record.mod_id
                - mod_record.created_date
      
      - name: task_count_by_created_month
        business_name: Task Count By Created Month
        description: >-
          Count of tasks grouped by the month they were created. Returns one row per 
          year-month combination.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    YEAR(task_record.created_date) AS created_year,
                    MONTH(task_record.created_date) AS created_month,
                    COUNT(*) AS task_count
                FROM staging.task_record AS task_record
                WHERE task_record.created_date IS NOT NULL
                GROUP BY YEAR(task_record.created_date), MONTH(task_record.created_date)
                ORDER BY created_year, created_month
              columns_used:
                - task_record.task_id
                - task_record.created_date
      
      - name: audit_event_count_by_event_month
        business_name: Audit Event Count By Event Month
        description: >-
          Count of audit events grouped by the month they occurred. Returns one row per 
          year-month combination.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    YEAR(audit_event.event_ts) AS event_year,
                    MONTH(audit_event.event_ts) AS event_month,
                    COUNT(*) AS audit_event_count
                FROM staging.audit_event AS audit_event
                WHERE audit_event.event_ts IS NOT NULL
                GROUP BY YEAR(audit_event.event_ts), MONTH(audit_event.event_ts)
                ORDER BY event_year, event_month
              columns_used:
                - audit_event.audit_id
                - audit_event.event_ts