      - name: tasks_per_modification
        business_name: Tasks Per Modification
        description: >-
          Average number of tasks per modification, calculated as total task count divided 
          by total modification count. Returns 0 if no modifications exist.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT mod_record.mod_id) = 0 THEN 0
                        ELSE CAST(COUNT(task_record.task_id) AS DECIMAL(10,2)) / COUNT(DISTINCT mod_record.mod_id)
                    END AS tasks_per_modification
                FROM staging.mod_record AS mod_record
                LEFT JOIN staging.task_record AS task_record
                    ON task_record.mod_id = mod_record.mod_id
              columns_used:
                - mod_record.mod_id
                - task_record.task_id
                - task_record.mod_id
      
      - name: impacts_per_modification
        business_name: Impacts Per Modification
        description: >-
          Average number of impact assessments per modification, calculated as total impact 
          count divided by total modification count. Returns 0 if no modifications exist.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT mod_record.mod_id) = 0 THEN 0
                        ELSE CAST(COUNT(impact_record.impact_id) AS DECIMAL(10,2)) / COUNT(DISTINCT mod_record.mod_id)
                    END AS impacts_per_modification
                FROM staging.mod_record AS mod_record
                LEFT JOIN staging.impact_record AS impact_record
                    ON impact_record.mod_id = mod_record.mod_id
              columns_used:
                - mod_record.mod_id
                - impact_record.impact_id
                - impact_record.mod_id
      
      - name: modification_count_by_class
        business_name: Modification Count By Class
        description: >-
          Count of modifications grouped by modification class (mod_class). Returns one row 
          per modification class.
        return_type: integer
        result_grain: one row per modification class
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    mod_record.mod_class,
                    COUNT(*) AS modification_count
                FROM staging.mod_record AS mod_record
                GROUP BY mod_record.mod_class
              columns_used:
