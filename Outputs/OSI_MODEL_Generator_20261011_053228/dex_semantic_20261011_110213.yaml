      - name: modifications_created_by_month
        business_name: Modifications Created By Month
        description: >-
          Count of modifications created, grouped by month. This metric supports time-series analysis
          of modification creation trends.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    YEAR(mod_record.created_date) AS year,
                    MONTH(mod_record.created_date) AS month,
                    COUNT(DISTINCT mod_record.mod_id) AS modification_count
                FROM staging.mod_record AS mod_record
                WHERE mod_record.created_date IS NOT NULL
                GROUP BY YEAR(mod_record.created_date), MONTH(mod_record.created_date)
                ORDER BY year, month
              columns_used:
                - mod_record.created_date
                - mod_record.mod_id
      
      - name: tasks_created_by_month
        business_name: Tasks Created By Month
        description: >-
          Count of tasks created, grouped by month. This metric supports time-series analysis of task
          creation trends.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    YEAR(task_record.created_date) AS year,
                    MONTH(task_record.created_date) AS month,
                    COUNT(DISTINCT task_record.task_id) AS task_count
                FROM staging.task_record AS task_record
                WHERE task_record.created_date IS NOT NULL
                GROUP BY YEAR(task_record.created_date), MONTH(task_record.created_date)
                ORDER BY year, month
              columns_used:
                - task_record.created_date
                - task_record.task_id
