version: "1.0"

semantic_model:
  - name: retail_analytics_model
    description: >-
      Comprehensive semantic model for retail analytics covering customer relationship management,
      sales transactions, product catalog, inventory, payments, and shipment operations.
      This model supports end-to-end retail analytics from customer acquisition through order
      fulfillment and payment processing.
    
    ai_context:
      instructions: >-
        This semantic model represents a retail analytics domain with the following key datasets and relationships:
        
        DATASET GRAIN:
        - CUSTOMERS: One row per customer. Use customer_id as the primary key.
        - ORDERS: One row per order. Use order_id as the primary key.
        - ORDER_ITEMS: One row per order line item. Use order_item_id as the primary key. Multiple items per order.
        - PRODUCTS: One row per product. Use product_id as the primary key.
        - PRODUCT_CATEGORIES: One row per product category. Use category_id as the primary key.
        - PAYMENTS: One row per payment transaction. Use payment_id as the primary key.
        - SHIPMENTS: One row per shipment. Use shipment_id as the primary key.
        
        RELATIONSHIP GRAPH:
        CUSTOMERS (1) --< ORDERS (customer_id)
        ORDERS (1) --< ORDER_ITEMS (order_id)
        ORDERS (1) --< PAYMENTS (order_id)
        ORDERS (1) --< SHIPMENTS (order_id)
        PRODUCTS (1) --< ORDER_ITEMS (product_id)
        PRODUCT_CATEGORIES (1) --< PRODUCTS (category_id)
        PRODUCT_CATEGORIES (1) --< PRODUCT_CATEGORIES (parent_category_id) [RECURSIVE HIERARCHY]
        
        DOUBLE-COUNTING PREVENTION:
        - Use orders.total_amount for order-level revenue analysis.
        - Use orders.subtotal for order-level subtotal analysis.
        - Use order_items.line_total for product-level or line-item-level revenue analysis.
        - Do NOT sum orders.total_amount after joining orders to order_items, as this will multiply the order total by the number of line items.
        - Do NOT sum orders.subtotal after joining orders to order_items.
        - When analyzing revenue by product, use order_items.line_total.
        - When analyzing revenue by customer or order, use orders.total_amount.
        - When analyzing revenue by order and product together, use order_items.line_total.
        
        MEASURE SELECTION BY GRAIN:
        - Order-level metrics: Use orders.total_amount, orders.subtotal, orders.discount_amount, orders.tax_amount, orders.shipping_fee
        - Line-item-level metrics: Use order_items.line_total, order_items.quantity, order_items.unit_price
        - Product-level metrics: Use products.unit_price, products.cost_price, products.stock_quantity
        - Payment-level metrics: Use payments.amount
        
        TIME ANALYSIS:
        - Use orders.order_date for order transaction time analysis.
        - Use customers.registration_date for customer acquisition time analysis.
        - Use payments.paid_at for payment transaction time analysis.
        - Use shipments.shipped_at for shipment dispatch time analysis.
        - Use shipments.delivered_at for delivery completion time analysis.
        - Use products.created_at for product creation time analysis.
        
        JOIN GUIDANCE:
        - Join ORDERS to CUSTOMERS using orders.customer_id = customers.customer_id (many-to-one).
        - Join ORDER_ITEMS to ORDERS using order_items.order_id = orders.order_id (many-to-one).
        - Join ORDER_ITEMS to PRODUCTS using order_items.product_id = products.product_id (many-to-one).
        - Join PRODUCTS to PRODUCT_CATEGORIES using products.category_id = product_categories.category_id (many-to-one).
        - Join PAYMENTS to ORDERS using payments.order_id = orders.order_id (many-to-one).
        - Join SHIPMENTS to ORDERS using shipments.order_id = orders.order_id (many-to-one).
        
        RECURSIVE HIERARCHY:
        - PRODUCT_CATEGORIES contains a self-referencing hierarchy via parent_category_id.
        - To traverse the category hierarchy, use recursive queries starting from category_id and following parent_category_id.
        - Root categories have parent_category_id = NULL.
        - Use recursive CTEs to compute category hierarchy depth, path, or rollup aggregations.
        
        METRIC INTERPRETATION:
        - Total Revenue: Sum of orders.total_amount across all orders.
        - Gross Profit: Sum of (order_items.line_total - (order_items.quantity * products.cost_price)).
        - Average Order Value: Total Revenue / Order Count.
        - Units Sold: Sum of order_items.quantity.
        - Discount Amount: Sum of orders.discount_amount at order level, or computed from order_items.discount_pct at line level.
        - Shipping Revenue: Sum of orders.shipping_fee.
        - Tax Revenue: Sum of orders.tax_amount.
        
        QUERY RESTRICTIONS:
        - Do not join orders to order_items and then sum order-level measures without proper grain handling.
        - Always consider the grain of the measure before aggregating.
        - Use DISTINCT or proper grouping when counting across different grains.
        - When computing profit, ensure cost_price is available and joined correctly to order_items via products.
    
    datasets:
      - name: customers
        business_name: Customers
        description: >-
          Stores comprehensive customer profiles, accounts, contact details, communication logs, and associated
          relationship history. One row per customer. Primary key: customer_id.
        source: CRM_PROD
        primary_key:
          - customer_id
        fields:
          - name: customer_id
            business_name: Customer Identifier
            description: Unique identifier for a customer.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: customer_code
            business_name: Customer Code
            description: Business reference code assigned to the customer.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: first_name
            business_name: First Name
            description: First name of the customer.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: last_name
            business_name: Last Name
            description: Last name of the customer.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: email
            business_name: Email
            description: Email address of the customer.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: phone
            business_name: Phone
            description: Phone number of the customer.
            sql_type: STRING(255)
          
          - name: gender
            business_name: Gender
            description: Gender of the customer.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: date_of_birth
            business_name: Date Of Birth
            description: Date of birth of the customer.
            sql_type: DATE
          
          - name: city
            business_name: City
            description: City where the customer resides.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: state
            business_name: State
            description: State or province where the customer resides.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: country
            business_name: Country
            description: Country where the customer resides.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: postal_code
            business_name: Postal Code
            description: Postal or ZIP code of the customer's address.
            sql_type: STRING(255)
          
          - name: customer_segment
            business_name: Customer Segment
            description: Indicates the current segment classification of the customer.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: registration_date
            business_name: Registration Date
            description: Date when the customer registered.
            sql_type: DATE
            dimension:
              is_time: true
          
          - name: is_active
            business_name: Is Active
            description: Indicates whether the customer account is currently active.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL
      
      - name: orders
        business_name: Orders
        description: >-
          Records end-to-end sales transactions, including order line items, transaction dates, customer identifiers,
          contact details, and monetary sums. One row per order. Primary key: order_id.
        source: ORDER_MGMT
        primary_key:
          - order_id
        fields:
          - name: order_id
            business_name: Order Identifier
            description: Unique identifier for an order.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_number
            business_name: Order Number
            description: Business reference number assigned to the order.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: customer_id
            business_name: Customer ID
            description: References the related customer record.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: order_date
            business_name: Order Date
            description: Timestamp recording when the order was placed.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: order_status
            business_name: Order Status
            description: Indicates the current status of the order.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: sales_channel
            business_name: Sales Channel
            description: Indicates the channel through which the order was placed.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: ship_city
            business_name: Ship City
            description: City to which the order is shipped.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: ship_state
            business_name: Ship State
            description: State or province to which the order is shipped.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: Postal or ZIP code to which the order is shipped.
            sql_type: STRING(255)
          
          - name: subtotal
            business_name: Subtotal
            description: Monetary amount representing the order subtotal before discounts and taxes.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: discount_amount
            business_name: Discount Amount
            description: Monetary amount representing the total discount applied to the order.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: tax_amount
            business_name: Tax Amount
            description: Monetary amount representing the tax charged on the order.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: shipping_fee
            business_name: Shipping Fee
            description: Monetary amount representing the shipping cost for the order.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: total_amount
            business_name: Total Amount
            description: Monetary amount representing the final total of the order.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: currency
            business_name: Currency
            description: Currency code for the order amounts.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL
      
      - name: order_items
        business_name: Order Items
        description: >-
          Records end-to-end sales transactions, including order line items, transaction dates, customer identifiers,
          contact details, and monetary sums. One row per order line item. Primary key: order_item_id.
        source: ORDER_MGMT
        primary_key:
          - order_item_id
        fields:
          - name: order_item_id
            business_name: Order Item Identifier
            description: Unique identifier for an order line item.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: References the related order record.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: line_number
            business_name: Line Number
            description: Sequential line number within the order.
            sql_type: INT
            constraints:
              - NOT NULL
          
          - name: product_id
            business_name: Product ID
            description: References the related product record.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: quantity
            business_name: Quantity
            description: Number of units ordered for this line item.
            sql_type: INT
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: unit_price
            business_name: Unit Price
            description: Monetary amount representing the price per unit.
            sql_type: DECIMAL(12,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
          
          - name: discount_pct
            business_name: Discount Pct
            description: Percentage discount applied to the line item.
            sql_type: DECIMAL(5,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
          
          - name: line_total
            business_name: Line Total
            description: Monetary amount representing the total for this line item.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL
      
      - name: products
        business_name: Products
        description: >-
          Contains definitions and specifications of product stock, catalog items, pricing structures, and inventory levels.
          One row per product. Primary key: product_id.
        source: PRODUCT_CATALOG
        primary_key:
          - product_id
        fields:
          - name: product_id
            business_name: Product Identifier
            description: Unique identifier for a product.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: sku
            business_name: Sku
            description: Stock keeping unit code for the product.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: product_name
            business_name: Product Name
            description: Name of the product.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: category_id
            business_name: Category ID
            description: References the related product category record.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: brand
            business_name: Brand
            description: Brand name of the product.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: description
            business_name: Description
            description: Detailed description of the product.
            sql_type: STRING(255)
          
          - name: unit_price
            business_name: Unit Price
            description: Monetary amount representing the selling price per unit.
            sql_type: DECIMAL(12,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
          
          - name: cost_price
            business_name: Cost Price
            description: Monetary amount representing the cost per unit.
            sql_type: DECIMAL(12,2)
            measure:
              aggregation: AVG
          
          - name: currency
            business_name: Currency
            description: Currency code for the product prices.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: stock_quantity
            business_name: Stock Quantity
            description: Current inventory quantity available for the product.
            sql_type: INT
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: is_active
            business_name: Is Active
            description: Indicates whether the product is currently active for sale.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: created_at
            business_name: Created At
            description: Timestamp recording when the product was created in the system.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL
      
      - name: product_categories
        business_name: Product Categories
        description: >-
          Contains definitions and specifications of product stock, catalog items, pricing structures, and inventory levels.
          One row per product category. Primary key: category_id. Contains a self-referencing hierarchy via parent_category_id.
        source: PRODUCT_CATALOG
        primary_key:
          - category_id
        fields:
          - name: category_id
            business_name: Category Identifier
            description: Unique identifier for a product category.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: category_name
            business_name: Category Name
            description: Name of the product category.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: parent_category_id
            business_name: Parent Category ID
            description: References the parent category in the hierarchy.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
          
          - name: description
            business_name: Description
            description: Detailed description of the product category.
            sql_type: STRING(255)
          
          - name: is_active
            business_name: Is Active
            description: Indicates whether the category is currently active.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL
      
      - name: payments
        business_name: Payments
        description: >-
          Contains schema metadata, system-level attributes, and attribute definitions associated with the payments
          dataset to support indexing and lookup. One row per payment transaction. Primary key: payment_id.
        source: PAYMENT_SYS
        primary_key:
          - payment_id
        fields:
          - name: payment_id
            business_name: Payment Identifier
            description: Unique identifier for a payment transaction.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: References the related order record.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: payment_method
            business_name: Payment Method
            description: Indicates the method used for payment.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: payment_status
            business_name: Payment Status
            description: Indicates the current status of the payment.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: amount
            business_name: Amount
            description: Monetary amount representing the payment value.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: currency
            business_name: Currency
            description: Currency code for the payment amount.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: transaction_ref
            business_name: Transaction Ref
            description: External reference number for the payment transaction.
            sql_type: STRING(255)
          
          - name: gateway
            business_name: Gateway
            description: Name of the payment gateway used to process the transaction.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: paid_at
            business_name: Paid At
            description: Timestamp recording when the payment was completed.
            sql_type: TIMESTAMP(29,9)
            dimension:
              is_time: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL
      
      - name: shipments
        business_name: Shipments
        description: >-
          Contains schema metadata, system-level attributes, and attribute definitions associated with the shipments
          dataset to support indexing and lookup. One row per shipment. Primary key: shipment_id.
        source: LOGISTICS_SYS
        primary_key:
          - shipment_id
        fields:
          - name: shipment_id
            business_name: Shipment Identifier
            description: Unique identifier for a shipment.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: References the related order record.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: carrier
            business_name: Carrier
            description: Name of the shipping carrier handling the shipment.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: tracking_number
            business_name: Tracking Number
            description: Tracking number assigned by the carrier for the shipment.
            sql_type: STRING(255)
          
          - name: shipment_status
            business_name: Shipment Status
            description: Indicates the current status of the shipment.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: shipped_at
            business_name: Shipped At
            description: Timestamp recording when the shipment was dispatched.
            sql_type: TIMESTAMP(29,9)
            dimension:
              is_time: true
          
          - name: delivered_at
            business_name: Delivered At
            description: Timestamp recording when the shipment was delivered.
            sql_type: TIMESTAMP(29,9)
            dimension:
              is_time: true
          
          - name: ship_city
            business_name: Ship City
            description: City to which the shipment is being sent.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: ship_state
            business_name: Ship State
            description: State or province to which the shipment is being sent.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: Postal or ZIP code to which the shipment is being sent.
            sql_type: STRING(255)
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL
    
    relationships:
      - name: orders_to_customers
        left_dataset: orders
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Each order is placed by exactly one customer. Multiple orders can be placed by the same customer.
          Join orders to customers using orders.customer_id = customers.customer_id.
      
      - name: order_items_to_orders
        left_dataset: order_items
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Each order line item belongs to exactly one order. An order can have multiple line items.
          Join order_items to orders using order_items.order_id = orders.order_id.
          IMPORTANT: Do not sum order-level measures (orders.total_amount, orders.subtotal, orders.discount_amount, 
          orders.tax_amount, orders.shipping_fee) after this join, as it will multiply the order total by the number of line items.
      
      - name: order_items_to_products
        left_dataset: order_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        resolution: >-
          Each order line item references exactly one product. A product can appear in multiple order line items.
          Join order_items to products using order_items.product_id = products.product_id.
      
      - name: products_to_product_categories
        left_dataset: products
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Each product belongs to exactly one product category. A product category can contain multiple products.
          Join products to product_categories using products.category_id = product_categories.category_id.
      
      - name: product_categories_hierarchy
        left_dataset: product_categories
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - parent_category_id
          right:
            - category_id
        join_type: recursive
        resolution: >-
          Product categories form a hierarchical structure where each category can have a parent category.
          Root categories have parent_category_id = NULL.
          To traverse the hierarchy, use a recursive CTE:
          WITH RECURSIVE category_hierarchy AS (
            SELECT category_id, category_name, parent_category_id, 1 AS level
            FROM product_categories
            WHERE parent_category_id IS NULL
            UNION ALL
            SELECT pc.category_id, pc.category_name, pc.parent_category_id, ch.level + 1
            FROM product_categories pc
            INNER JOIN category_hierarchy ch ON pc.parent_category_id = ch.category_id
          )
          SELECT * FROM category_hierarchy;
      
      - name: payments_to_orders
        left_dataset: payments
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Each payment transaction is associated with exactly one order. An order can have multiple payment transactions.
          Join payments to orders using payments.order_id = orders.order_id.
      
      - name: shipments_to_orders
        left_dataset: shipments
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Each shipment is associated with exactly one order. An order can have multiple shipments.
          Join shipments to orders using shipments.order_id = orders.order_id.
    
    metrics:
      - name: total_revenue
        business_name: Total Revenue
        description: >-
          Total revenue from all orders, calculated as the sum of the final order total amounts.
          This metric represents the total monetary value of all orders placed.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.total_amount) AS total_revenue
                FROM orders
              columns_used:
                - orders.total_amount
      
      - name: total_subtotal
        business_name: Total Subtotal
        description: >-
          Total subtotal from all orders before discounts and taxes, calculated as the sum of order subtotals.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.subtotal) AS total_subtotal
                FROM orders
              columns_used:
                - orders.subtotal
      
      - name: total_discount_amount
        business_name: Total Discount Amount
        description: >-
          Total discount amount applied across all orders, calculated as the sum of order-level discount amounts.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.discount_amount) AS total_discount_amount
                FROM orders
              columns_used:
                - orders.discount_amount
      
      - name: total_tax_amount
        business_name: Total Tax Amount
        description: >-
          Total tax amount charged across all orders, calculated as the sum of order-level tax amounts.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.tax_amount) AS total_tax_amount
                FROM orders
              columns_used:
                - orders.tax_amount
      
      - name: total_shipping_fee
        business_name: Total Shipping Fee
        description: >-
          Total shipping fees collected across all orders, calculated as the sum of order-level shipping fees.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.shipping_fee) AS total_shipping_fee
                FROM orders
              columns_used:
                - orders.shipping_fee
      
      - name: order_count
        business_name: Order Count
        description: >-
          Total number of orders placed, calculated as the count of distinct order IDs.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT orders.order_id) AS order_count
                FROM orders
              columns_used:
                - orders.order_id
      
      - name: customer_count
        business_name: Customer Count
        description: >-
          Total number of customers, calculated as the count of distinct customer IDs.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT customers.customer_id) AS customer_count
                FROM customers
              columns_used:
                - customers.customer_id
      
      - name: active_customer_count
        business_name: Active Customer Count
        description: >-
          Total number of active customers, calculated as the count of distinct customer IDs where is_active is true.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT customers.customer_id) AS active_customer_count
                FROM customers
                WHERE customers.is_active = true
              columns_used:
                - customers.customer_id
                - customers.is_active
      
      - name: product_count
        business_name: Product Count
        description: >-
          Total number of products, calculated as the count of distinct product IDs.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT products.product_id) AS product_count
                FROM products
              columns_used:
                - products.product_id
      
      - name: units_sold
        business_name: Units Sold
        description: >-
          Total number of units sold across all order line items, calculated as the sum of quantities.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.quantity) AS units_sold
                FROM order_items
              columns_used:
                - order_items.quantity
      
      - name: line_item_revenue
        business_name: Line Item Revenue
        description: >-
          Total revenue from all order line items, calculated as the sum of line totals.
          Use this metric for product-level or line-item-level revenue analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.line_total) AS line_item_revenue
                FROM order_items
              columns_used:
                - order_items.line_total
      
      - name: average_order_value
        business_name: Average Order Value
        description: >-
          Average monetary value per order, calculated as total revenue divided by order count.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT orders.order_id) = 0 THEN 0
                    ELSE SUM(orders.total_amount) / COUNT(DISTINCT orders.order_id)
                  END AS average_order_value
                FROM orders
              columns_used:
                - orders.total_amount
                - orders.order_id
      
      - name: average_unit_price
        business_name: Average Unit Price
        description: >-
          Average price per unit across all order line items, calculated as the weighted average of unit prices by quantity.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN SUM(order_items.quantity) = 0 THEN 0
                    ELSE SUM(order_items.unit_price * order_items.quantity) / SUM(order_items.quantity)
                  END AS average_unit_price
                FROM order_items
              columns_used:
                - order_items.unit_price
                - order_items.quantity
      
      - name: average_discount_pct
        business_name: Average Discount Percentage
        description: >-
          Average discount percentage across all order line items, calculated as the weighted average of discount percentages by line total.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN SUM(order_items.line_total) = 0 THEN 0
                    ELSE SUM(order_items.discount_pct * order_items.line_total) / SUM(order_items.line_total)
                  END AS average_discount_pct
                FROM order_items
              columns_used:
                - order_items.discount_pct
                - order_items.line_total
      
      - name: gross_profit
        business_name: Gross Profit
        description: >-
          Gross profit calculated as the difference between line item revenue and line item cost.
          Line item cost is computed as quantity multiplied by product cost price.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.line_total) - SUM(order_items.quantity * products.cost_price) AS gross_profit
                FROM order_items
                INNER JOIN products ON order_items.product_id = products.product_id
              columns_used:
                - order_items.line_total
                - order_items.quantity
                - products.cost_price
      
      - name: gross_margin_pct
        business_name: Gross Margin Percentage
        description: >-
          Gross margin percentage calculated as gross profit divided by line item revenue, expressed as a percentage.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN SUM(order_items.line_total) = 0 THEN 0
                    ELSE (SUM(order_items.line_total) - SUM(order_items.quantity * products.cost_price)) / SUM(order_items.line_total) * 100
                  END AS gross_margin_pct
                FROM order_items
                INNER JOIN products ON order_items.product_id = products.product_id
              columns_used:
                - order_items.line_total
                - order_items.quantity
                - products.cost_price
      
      - name: revenue_per_customer
        business_name: Revenue Per Customer
        description: >-
          Average revenue per customer, calculated as total revenue divided by the number of distinct customers who placed orders.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT orders.customer_id) = 0 THEN 0
                    ELSE SUM(orders.total_amount) / COUNT(DISTINCT orders.customer_id)
                  END AS revenue_per_customer
                FROM orders
              columns_used:
                - orders.total_amount
                - orders.customer_id
      
      - name: orders_per_customer
        business_name: Orders Per Customer
        description: >-
          Average number of orders per customer, calculated as total order count divided by the number of distinct customers who placed orders.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT orders.customer_id) = 0 THEN 0
                    ELSE CAST(COUNT(DISTINCT orders.order_id) AS DECIMAL) / COUNT(DISTINCT orders.customer_id)
                  END AS orders_per_customer
                FROM orders
              columns_used:
                - orders.order_id
                - orders.customer_id
      
      - name: payment_count
        business_name: Payment Count
        description: >-
          Total number of payment transactions, calculated as the count of distinct payment IDs.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT payments.payment_id) AS payment_count
                FROM payments
              columns_used:
                - payments.payment_id
      
      - name: total_payment_amount
        business_name: Total Payment Amount
        description: >-
          Total payment amount collected across all payment transactions, calculated as the sum of payment amounts.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(payments.amount) AS total_payment_amount
                FROM payments
              columns_used:
                - payments.amount
      
      - name: shipment_count
        business_name: Shipment Count
        description: >-
          Total number of shipments, calculated as the count of distinct shipment IDs.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT shipments.shipment_id) AS shipment_count
                FROM shipments
              columns_used:
                - shipments.shipment_id
      
      - name: delivered_shipment_count
        business_name: Delivered Shipment Count
        description: >-
          Total number of delivered shipments, calculated as the count of distinct shipment IDs where delivered_at is not null.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT shipments.shipment_id) AS delivered_shipment_count
                FROM shipments
                WHERE shipments.delivered_at IS NOT NULL
              columns_used:
                - shipments.shipment_id
                - shipments.delivered_at
      
      - name: revenue_by_customer
        business_name: Revenue By Customer
        description: >-
          Total revenue per customer, calculated as the sum of order total amounts grouped by customer.
        return_type: DECIMAL
        result_grain: one row per customer
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  orders.customer_id,
                  SUM(orders.total_amount) AS revenue_by_customer
                FROM orders
                GROUP BY orders.customer_id
              columns_used:
                - orders.customer_id
                - orders.total_amount
      
      - name: revenue_by_product
        business_name: Revenue By Product
        description: >-
          Total revenue per product, calculated as the sum of line totals grouped by product.
        return_type: DECIMAL
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  order_items.product_id,
                  SUM(order_items.line_total) AS revenue_by_product
                FROM order_items
                GROUP BY order_items.product_id
              columns_used:
                - order_items.product_id
                - order_items.line_total
      
      - name: revenue_by_category
        business_name: Revenue By Category
        description: >-
          Total revenue per product category, calculated as the sum of line totals grouped by product category.
        return_type: DECIMAL
        result_grain: one row per category
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  products.category_id,
                  SUM(order_items.line_total) AS revenue_by_category
                FROM order_items
                INNER JOIN products ON order_items.product_id = products.product_id
                GROUP BY products.category_id
              columns_used:
                - products.category_id
                - order_items.line_total
      
      - name: revenue_by_order_date
        business_name: Revenue By Order Date
        description: >-
          Total revenue per order date, calculated as the sum of order total amounts grouped by order date.
        return_type: DECIMAL
        result_grain: one row per order date
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  DATE(orders.order_date) AS order_date,
                  SUM(orders.total_amount) AS revenue_by_order_date
                FROM orders
                GROUP BY DATE(orders.order_date)
              columns_used:
                - orders.order_date
                - orders.total_amount
      
      - name: revenue_by_month
        business_name: Revenue By Month
        description: >-
          Total revenue per month, calculated as the sum of order total amounts grouped by year and month.
        return_type: DECIMAL
        result_grain: one row per month
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  DATE_TRUNC('MONTH', orders.order_date) AS order_month,
                  SUM(orders.total_amount) AS revenue_by_month
                FROM orders
                GROUP BY DATE_TRUNC('MONTH', orders.order_date)
              columns_used:
                - orders.order_date
                - orders.total_amount
      
      - name: revenue_by_sales_channel
        business_name: Revenue By Sales Channel
        description: >-
          Total revenue per sales channel, calculated as the sum of order total amounts grouped by sales channel.
        return_type: DECIMAL
        result_grain: one row per sales channel
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  orders.sales_channel,
                  SUM(orders.total_amount) AS revenue_by_sales_channel
                FROM orders
                GROUP BY orders.sales_channel
              columns_used:
                - orders.sales_channel
                - orders.total_amount
      
      - name: revenue_by_customer_segment
        business_name: Revenue By Customer Segment
        description: >-
          Total revenue per customer segment, calculated as the sum of order total amounts grouped by customer segment.
        return_type: DECIMAL
        result_grain: one row per customer segment
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  customers.customer_segment,
                  SUM(orders.total_amount) AS revenue_by_customer_segment
                FROM orders
                INNER JOIN customers ON orders.customer_id = customers.customer_id
                GROUP BY customers.customer_segment
              columns_used:
                - customers.customer_segment
                - orders.total_amount
      
      - name: total_inventory_value
        business_name: Total Inventory Value
        description: >-
          Total value of current inventory, calculated as the sum of stock quantity multiplied by unit price for all products.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(products.stock_quantity * products.unit_price) AS total_inventory_value
                FROM products
              columns_used:
                - products.stock_quantity
                - products.unit_price
      
      - name: total_inventory_cost
        business_name: Total Inventory Cost
        description: >-
          Total cost of current inventory, calculated as the sum of stock quantity multiplied by cost price for all products.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(products.stock_quantity * products.cost_price) AS total_inventory_cost
                FROM products
              columns_used:
                - products.stock_quantity
                - products.cost_price