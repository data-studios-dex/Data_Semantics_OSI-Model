version: "1.0"

semantic_model:
  - name: ecom_retail_analytics
    description: >-
      Comprehensive semantic model for retail e-commerce analytics covering customers, orders, products, 
      payments, and shipments. This model supports analytical queries across customer behavior, sales performance, 
      product analytics, payment processing, and fulfillment operations. The model is designed for Databricks 
      SQL dialect and supports time-series analysis, hierarchical product categorization, and multi-grain 
      revenue analysis.
    
    ai_context:
      instructions: >-
        ## Dataset Grain Reference
        
        - **customers**: One row per customer. Use for customer-level analysis and customer counts.
        
        - **orders**: One row per order. Use for order-level metrics such as total order amount, order count, 
          and average order value. Contains order header information including subtotal, discount, tax, 
          shipping fee, and total amount.
        
        - **order_items**: One row per order line item (product within an order). Use for product-level 
          analysis within orders. Multiple order items can belong to a single order.
        
        - **products**: One row per product. Use for product catalog analysis and product-level metrics.
        
        - **product_categories**: One row per product category. Supports hierarchical category structure 
          through parent_category_id self-reference.
        
        - **payments**: One row per payment transaction. Multiple payments can exist for a single order 
          in split-payment scenarios.
        
        - **shipments**: One row per shipment. Use for fulfillment and logistics analysis.
        
        ## Critical Double-Counting Prevention
        
        **Order-Level vs Line-Level Revenue:**
        
        - Use `orders.total_amount` for order-level revenue analysis. This represents the final order total 
          including discounts, taxes, and shipping.
        
        - Use `order_items.line_total` for product-level or line-item revenue analysis.
        
        - **NEVER sum orders.total_amount after joining orders to order_items** - this will multiply the 
          order total by the number of line items and produce incorrect results.
        
        - **NEVER sum orders.subtotal, orders.discount_amount, orders.tax_amount, or orders.shipping_fee 
          after joining to order_items** - these are order-level amounts that will be duplicated.
        
        - When analyzing revenue by product, use order_items.line_total.
        
        - When analyzing total order revenue, use orders.total_amount and avoid joining to order_items 
          unless you aggregate at the order level first.
        
        **Correct Pattern for Product Revenue:**
        ```sql
        SELECT 
            p.product_name,
            SUM(oi.line_total) AS product_revenue
        FROM order_items oi
        JOIN products p ON oi.product_id = p.product_id
        GROUP BY p.product_name
        ```
        
        **Correct Pattern for Order Revenue:**
        ```sql
        SELECT 
            o.order_date,
            SUM(o.total_amount) AS total_revenue
        FROM orders o
        GROUP BY o.order_date
        ```
        
        **Incorrect Pattern (Double Counting):**
        ```sql
        -- DO NOT DO THIS - will multiply order totals by line item count
        SELECT 
            SUM(o.total_amount) AS total_revenue
        FROM orders o
        JOIN order_items oi ON o.order_id = oi.order_id
        ```
        
        ## Relationship and Join Guidance
        
        **Standard Relationships:**
        
        - customers → orders (one-to-many): Join on customer_id
        - orders → order_items (one-to-many): Join on order_id
        - products → order_items (one-to-many): Join on product_id
        - product_categories → products (one-to-many): Join on category_id
        - orders → payments (one-to-many): Join on order_id
        - orders → shipments (one-to-many): Join on order_id
        
        **Hierarchical Relationship:**
        
        - product_categories → product_categories (self-referencing): Join on parent_category_id = category_id
          This represents the category hierarchy where categories can have parent categories.
        
        **Multi-Hop Relationships:**
        
        - customers → orders → order_items → products: For customer product purchase analysis
        - products → product_categories → parent categories: For hierarchical category analysis
        
        ## Time-Based Analysis
        
        **Primary Date Fields:**
        
        - `orders.order_date`: Use for sales trends, revenue over time, order volume analysis
        - `customers.registration_date`: Use for customer acquisition analysis
        - `payments.paid_at`: Use for payment processing and cash flow analysis
        - `shipments.shipped_at`: Use for fulfillment timing analysis
        - `shipments.delivered_at`: Use for delivery performance analysis
        - `products.created_at`: Use for product launch and catalog growth analysis
        
        **Time-Series Queries:**
        
        For monthly revenue trends, use orders.order_date and aggregate by month:
        ```sql
        SELECT 
            DATE_TRUNC('month', order_date) AS month,
            SUM(total_amount) AS monthly_revenue
        FROM orders
        GROUP BY DATE_TRUNC('month', order_date)
        ```
        
        ## Metric Calculation Guidance
        
        **Revenue Metrics:**
        
        - Total Revenue: SUM(orders.total_amount) - order-level aggregation
        - Product Revenue: SUM(order_items.line_total) - line-level aggregation
        - Average Order Value: SUM(orders.total_amount) / COUNT(DISTINCT orders.order_id)
        
        **Margin Metrics:**
        
        - Product-level margin requires joining order_items to products to access cost_price
        - Line-level profit: (order_items.quantity * order_items.unit_price * (1 - order_items.discount_pct / 100.0)) 
          - (order_items.quantity * products.cost_price)
        
        **Discount Metrics:**
        
        - Order-level discount: orders.discount_amount
        - Line-level discount: order_items.quantity * order_items.unit_price * (order_items.discount_pct / 100.0)
        
        **Customer Metrics:**
        
        - Customer Count: COUNT(DISTINCT customers.customer_id)
        - Active Customers: COUNT(DISTINCT customers.customer_id) WHERE customers.is_active = true
        - Orders per Customer: COUNT(orders.order_id) / COUNT(DISTINCT customers.customer_id)
        
        **Fulfillment Metrics:**
        
        - Delivery Time: DATEDIFF(day, shipments.shipped_at, shipments.delivered_at)
        - On-Time Delivery requires business rule for expected delivery date (not available in current schema)
        
        ## Hierarchical Category Analysis
        
        The product_categories table supports hierarchical categorization through parent_category_id.
        
        To traverse the category hierarchy, use recursive queries:
        ```sql
        WITH RECURSIVE category_hierarchy AS (
            SELECT 
                category_id,
                category_name,
                parent_category_id,
                category_name AS root_category,
                1 AS level
            FROM product_categories
            WHERE parent_category_id IS NULL
            
            UNION ALL
            
            SELECT 
                pc.category_id,
                pc.category_name,
                pc.parent_category_id,
                ch.root_category,
                ch.level + 1
            FROM product_categories pc
            JOIN category_hierarchy ch ON pc.parent_category_id = ch.category_id
        )
        SELECT * FROM category_hierarchy
        ```
        
        ## Customer Segmentation
        
        The customers.customer_segment field contains business-defined customer segments (e.g., Premium).
        Use this field for segment-based analysis and customer stratification.
        
        ## Currency Handling
        
        All monetary amounts in orders, order_items, products, and payments are denominated in the currency 
        specified in their respective currency fields. The sample data shows USD as the primary currency.
        For multi-currency analysis, ensure proper currency conversion or filter by specific currency codes.
        
        ## Status Field Interpretation
        
        - orders.order_status: Current order state (e.g., Shipped, Pending, Delivered, Cancelled)
        - payments.payment_status: Payment transaction state (e.g., Completed, Pending, Failed)
        - shipments.shipment_status: Shipment state (e.g., In Transit, Delivered, Returned)
        
        Filter by status fields to analyze orders, payments, or shipments in specific states.
        
        ## Sales Channel Analysis
        
        Use orders.sales_channel to analyze performance across different sales channels (e.g., Online, Store, Mobile).
        
        ## Query Restrictions and Limitations
        
        - Cost data (products.cost_price) may not be available for all products
        - Shipment tracking information may be incomplete for orders not yet shipped
        - Payment gateway information is stored but may vary by payment method
        - Parent category references may be NULL for root-level categories
        - Delivery timestamps are only available for completed shipments
    
    datasets:
      - name: customers
        business_name: Customers
        description: >-
          Customer master data containing one row per customer. Includes customer identification, 
          contact information, demographic data, geographic location, customer segmentation, 
          registration information, and account status. This dataset represents the analytical 
          grain of one customer per row and should be used for customer-level analysis, customer 
          counts, and customer demographic segmentation.
        source: ecom_bronze.customers
        primary_key:
          - customer_id
        fields:
          - name: customer_id
            business_name: Customer Identifier
            description: >-
              Unique identifier for a customer. Primary key for the customers dataset.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: customer_code
            business_name: Customer Code
            description: >-
              Business reference code assigned to the customer. Used for external customer identification.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: first_name
            business_name: First Name
            description: >-
              First name of the customer. Contains personally identifiable information (PII).
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: last_name
            business_name: Last Name
            description: >-
              Last name of the customer. Contains personally identifiable information (PII).
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: email
            business_name: Email
            description: >-
              Email address of the customer. Contains personally identifiable information (PII).
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: phone
            business_name: Phone
            description: >-
              Phone number of the customer. Contains personally identifiable information (PII).
            sql_type: STRING
          
          - name: gender
            business_name: Gender
            description: >-
              Gender of the customer. Categorical dimension for demographic analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: date_of_birth
            business_name: Date Of Birth
            description: >-
              Date of birth of the customer. Contains personally identifiable information (PII). 
              Can be used to derive customer age for demographic analysis.
            sql_type: DATE
            dimension:
              is_time: true
          
          - name: city
            business_name: City
            description: >-
              City where the customer resides. Geographic dimension for location-based analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: state
            business_name: State
            description: >-
              State or province where the customer resides. Geographic dimension for regional analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: country
            business_name: Country
            description: >-
              Country where the customer resides. Geographic dimension for country-level analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: postal_code
            business_name: Postal Code
            description: >-
              Postal or ZIP code of the customer's address. Geographic dimension for postal-level analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: customer_segment
            business_name: Customer Segment
            description: >-
              Indicates the current segment classification of the customer (e.g., Premium, Standard, VIP). 
              Business dimension for customer segmentation and stratification analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: registration_date
            business_name: Registration Date
            description: >-
              Date when the customer registered. Time dimension for customer acquisition and cohort analysis.
            sql_type: DATE
            dimension:
              is_time: true
          
          - name: is_active
            business_name: Is Active
            description: >-
              Indicates whether the customer account is currently active. Boolean dimension for 
              filtering active vs inactive customers.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: >-
              Name of the source system from which the record originated (e.g., CRM_PROD).
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ETL batch that loaded this record. Used for data lineage and ETL tracking.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp recording when the record was loaded into the table. Used for data freshness tracking.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: orders
        business_name: Orders
        description: >-
          Order header data containing one row per order. Includes order identification, customer reference, 
          order timing, order status, sales channel, shipping destination, and complete order-level financial 
          amounts including subtotal, discounts, taxes, shipping fees, and total amount. This dataset represents 
          the analytical grain of one order per row. Use this dataset for order-level revenue analysis, order 
          counts, and average order value calculations. Do not sum order-level amounts after joining to 
          order_items to avoid double-counting.
        source: ecom_bronze.orders
        primary_key:
          - order_id
        fields:
          - name: order_id
            business_name: Order Identifier
            description: >-
              Unique identifier for an order. Primary key for the orders dataset.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_number
            business_name: Order Number
            description: >-
              Business reference number assigned to the order. Used for external order identification.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: customer_id
            business_name: Customer ID
            description: >-
              References the related customer record. Foreign key to customers.customer_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: order_date
            business_name: Order Date
            description: >-
              Timestamp recording when the order was placed. Primary time dimension for sales trend analysis, 
              revenue over time, and order volume analysis.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: order_status
            business_name: Order Status
            description: >-
              Indicates the current status of the order (e.g., Shipped, Pending, Delivered, Cancelled). 
              Categorical dimension for order state analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: sales_channel
            business_name: Sales Channel
            description: >-
              Indicates the channel through which the order was placed (e.g., Online, Store, Mobile). 
              Categorical dimension for sales channel analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: ship_city
            business_name: Ship City
            description: >-
              City to which the order is shipped. Geographic dimension for shipping destination analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: ship_state
            business_name: Ship State
            description: >-
              State or province to which the order is shipped. Geographic dimension for regional shipping analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: >-
              Postal or ZIP code to which the order is shipped. Geographic dimension for postal-level shipping analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: subtotal
            business_name: Subtotal
            description: >-
              Monetary amount representing the order subtotal before discounts and taxes. Order-level measure. 
              Do not sum after joining to order_items.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              aggregation_grain: order
          
          - name: discount_amount
            business_name: Discount Amount
            description: >-
              Monetary amount representing the total discount applied to the order. Order-level measure. 
              Do not sum after joining to order_items.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              aggregation_grain: order
          
          - name: tax_amount
            business_name: Tax Amount
            description: >-
              Monetary amount representing the tax charged on the order. Order-level measure. 
              Do not sum after joining to order_items. Contains PII indicator.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              aggregation_grain: order
          
          - name: shipping_fee
            business_name: Shipping Fee
            description: >-
              Monetary amount representing the shipping cost for the order. Order-level measure. 
              Do not sum after joining to order_items.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              aggregation_grain: order
          
          - name: total_amount
            business_name: Total Amount
            description: >-
              Monetary amount representing the final total of the order including subtotal, discounts, 
              taxes, and shipping. Order-level measure representing complete order revenue. 
              Use for order-level revenue analysis. Do not sum after joining to order_items.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              aggregation_grain: order
          
          - name: currency
            business_name: Currency
            description: >-
              Currency code for the order amounts (e.g., USD). Categorical dimension for currency analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: >-
              Name of the source system from which the record originated (e.g., ORDER_MGMT).
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ETL batch that loaded this record. Used for data lineage and ETL tracking.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp recording when the record was loaded into the table. Used for data freshness tracking.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: order_items
        business_name: Order Items
        description: >-
          Order line item data containing one row per order line item (product within an order). 
          Includes line item identification, order reference, product reference, line sequencing, 
          quantity, unit pricing, discount percentage, and line-level total. This dataset represents 
          the analytical grain of one line item per row. Multiple line items can belong to a single order. 
          Use this dataset for product-level revenue analysis within orders and product sales analysis. 
          For line-level revenue, use line_total. For order-level revenue, use orders.total_amount 
          without joining to this dataset.
        source: ecom_bronze.order_items
        primary_key:
          - order_item_id
        fields:
          - name: order_item_id
            business_name: Order Item Identifier
            description: >-
              Unique identifier for an order line item. Primary key for the order_items dataset.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: >-
              References the related order record. Foreign key to orders.order_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: line_number
            business_name: Line Number
            description: >-
              Sequential line number within the order. Used for line item ordering and sequencing.
            sql_type: INT
            constraints:
              - NOT NULL
          
          - name: product_id
            business_name: Product ID
            description: >-
              References the related product record. Foreign key to products.product_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: quantity
            business_name: Quantity
            description: >-
              Number of units ordered for this line item. Quantitative measure for units sold analysis.
            sql_type: INT
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: unit_price
            business_name: Unit Price
            description: >-
              Monetary amount representing the price per unit for this line item. 
              Use for average selling price analysis.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
          
          - name: discount_pct
            business_name: Discount Pct
            description: >-
              Percentage discount applied to the line item. Used for discount analysis and 
              line-level discount amount calculation.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
          
          - name: line_total
            business_name: Line Total
            description: >-
              Monetary amount representing the total for this line item after applying quantity, 
              unit price, and discount. Derived as: quantity * unit_price * (1 - discount_pct / 100.0). 
              Use for product-level and line-level revenue analysis.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              is_derived: true
          
          - name: _source_system
            business_name: Source System
            description: >-
              Name of the source system from which the record originated (e.g., ORDER_MGMT).
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ETL batch that loaded this record. Used for data lineage and ETL tracking.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp recording when the record was loaded into the table. Used for data freshness tracking.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: products
        business_name: Products
        description: >-
          Product master data containing one row per product. Includes product identification, 
          SKU, product naming, category reference, brand, description, pricing (unit price and cost price), 
          currency, inventory quantity, active status, and creation timestamp. This dataset represents 
          the analytical grain of one product per row and should be used for product catalog analysis, 
          product-level metrics, and product profitability analysis.
        source: ecom_bronze.products
        primary_key:
          - product_id
        fields:
          - name: product_id
            business_name: Product Identifier
            description: >-
              Unique identifier for a product. Primary key for the products dataset.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: sku
            business_name: Sku
            description: >-
              Stock keeping unit code for the product. Business identifier for product tracking.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: product_name
            business_name: Product Name
            description: >-
              Name of the product. Categorical dimension for product identification.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: category_id
            business_name: Category ID
            description: >-
              References the related product category record. Foreign key to product_categories.category_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: brand
            business_name: Brand
            description: >-
              Brand name of the product. Categorical dimension for brand analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: description
            business_name: Description
            description: >-
              Detailed description of the product. Used for product information and search.
            sql_type: STRING
          
          - name: unit_price
            business_name: Unit Price
            description: >-
              Monetary amount representing the selling price per unit. Use for product pricing analysis.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
          
          - name: cost_price
            business_name: Cost Price
            description: >-
              Monetary amount representing the cost per unit. Use for product cost and margin analysis. 
              May not be available for all products.
            sql_type: DECIMAL
            measure:
              aggregation: AVG
          
          - name: currency
            business_name: Currency
            description: >-
              Currency code for the product prices (e.g., USD). Categorical dimension for currency analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: stock_quantity
            business_name: Stock Quantity
            description: >-
              Current inventory quantity available for the product. Quantitative measure for inventory analysis.
            sql_type: INT
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: is_active
            business_name: Is Active
            description: >-
              Indicates whether the product is currently active for sale. Boolean dimension for 
              filtering active vs inactive products.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: created_at
            business_name: Created At
            description: >-
              Timestamp recording when the product was created in the system. Time dimension for 
              product launch and catalog growth analysis.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: _source_system
            business_name: Source System
            description: >-
              Name of the source system from which the record originated (e.g., PRODUCT_CATALOG).
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ETL batch that loaded this record. Used for data lineage and ETL tracking.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp recording when the record was loaded into the table. Used for data freshness tracking.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: product_categories
        business_name: Product Categories
        description: >-
          Product category master data containing one row per product category. Includes category 
          identification, category naming, parent category reference for hierarchical categorization, 
          category description, and active status. This dataset represents the analytical grain of 
          one category per row and supports hierarchical category structures through the self-referencing 
          parent_category_id field. Use this dataset for category-level analysis and hierarchical 
          category traversal.
        source: ecom_bronze.product_categories
        primary_key:
          - category_id
        fields:
          - name: category_id
            business_name: Category Identifier
            description: >-
              Unique identifier for a product category. Primary key for the product_categories dataset.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: category_name
            business_name: Category Name
            description: >-
              Name of the product category. Categorical dimension for category identification.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: parent_category_id
            business_name: Parent Category ID
            description: >-
              References the parent category in the hierarchy. Self-referencing foreign key to 
              product_categories.category_id. NULL for root-level categories. Enables hierarchical 
              category analysis and recursive category traversal.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
          
          - name: description
            business_name: Description
            description: >-
              Detailed description of the product category. Used for category information.
            sql_type: STRING
          
          - name: is_active
            business_name: Is Active
            description: >-
              Indicates whether the category is currently active. Boolean dimension for filtering 
              active vs inactive categories.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: >-
              Name of the source system from which the record originated (e.g., PRODUCT_CATALOG).
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ETL batch that loaded this record. Used for data lineage and ETL tracking.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp recording when the record was loaded into the table. Used for data freshness tracking.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: payments
        business_name: Payments
        description: >-
          Payment transaction data containing one row per payment transaction. Includes payment identification, 
          order reference, payment method, payment status, payment amount, currency, transaction reference, 
          payment gateway, and payment completion timestamp. This dataset represents the analytical grain 
          of one payment per row. Multiple payments can exist for a single order in split-payment scenarios. 
          Use this dataset for payment processing analysis, payment method analysis, and cash flow analysis.
        source: ecom_bronze.payments
        primary_key:
          - payment_id
        fields:
          - name: payment_id
            business_name: Payment Identifier
            description: >-
              Unique identifier for a payment transaction. Primary key for the payments dataset.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: >-
              References the related order record. Foreign key to orders.order_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: payment_method
            business_name: Payment Method
            description: >-
              Indicates the method used for payment (e.g., Credit Card, PayPal, Bank Transfer). 
              Categorical dimension for payment method analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: payment_status
            business_name: Payment Status
            description: >-
              Indicates the current status of the payment (e.g., Completed, Pending, Failed). 
              Categorical dimension for payment state analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: amount
            business_name: Amount
            description: >-
              Monetary amount representing the payment value. Use for payment amount analysis.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: currency
            business_name: Currency
            description: >-
              Currency code for the payment amount (e.g., USD). Categorical dimension for currency analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: transaction_ref
            business_name: Transaction Ref
            description: >-
              External reference number for the payment transaction. Contains personally identifiable 
              information (PII). Used for payment reconciliation.
            sql_type: STRING
          
          - name: gateway
            business_name: Gateway
            description: >-
              Name of the payment gateway used to process the transaction (e.g., Stripe, PayPal). 
              Categorical dimension for payment gateway analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: paid_at
            business_name: Paid At
            description: >-
              Timestamp recording when the payment was completed. Time dimension for payment timing 
              and cash flow analysis.
            sql_type: TIMESTAMP
            dimension:
              is_time: true
          
          - name: _source_system
            business_name: Source System
            description: >-
              Name of the source system from which the record originated (e.g., PAYMENT_SYS).
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ETL batch that loaded this record. Used for data lineage and ETL tracking.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp recording when the record was loaded into the table. Used for data freshness tracking.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: shipments
        business_name: Shipments
        description: >-
          Shipment data containing one row per shipment. Includes shipment identification, order reference, 
          carrier information, tracking number, shipment status, shipping and delivery timestamps, and 
          shipping destination. This dataset represents the analytical grain of one shipment per row. 
          Use this dataset for fulfillment analysis, logistics analysis, delivery performance analysis, 
          and carrier performance analysis.
        source: ecom_bronze.shipments
        primary_key:
          - shipment_id
        fields:
          - name: shipment_id
            business_name: Shipment Identifier
            description: >-
              Unique identifier for a shipment. Primary key for the shipments dataset.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: >-
              References the related order record. Foreign key to orders.order_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: carrier
            business_name: Carrier
            description: >-
              Name of the shipping carrier handling the shipment (e.g., FedEx, UPS, USPS). 
              Categorical dimension for carrier analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: tracking_number
            business_name: Tracking Number
            description: >-
              Tracking number assigned by the carrier for the shipment. Used for shipment tracking.
            sql_type: STRING
          
          - name: shipment_status
            business_name: Shipment Status
            description: >-
              Indicates the current status of the shipment (e.g., In Transit, Delivered, Returned). 
              Categorical dimension for shipment state analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: shipped_at
            business_name: Shipped At
            description: >-
              Timestamp recording when the shipment was dispatched. Time dimension for fulfillment 
              timing analysis.
            sql_type: TIMESTAMP
            dimension:
              is_time: true
          
          - name: delivered_at
            business_name: Delivered At
            description: >-
              Timestamp recording when the shipment was delivered. Time dimension for delivery 
              performance analysis. Only available for completed shipments.
            sql_type: TIMESTAMP
            dimension:
              is_time: true
          
          - name: ship_city
            business_name: Ship City
            description: >-
              City to which the shipment is being sent. Geographic dimension for shipping destination analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: ship_state
            business_name: Ship State
            description: >-
              State or province to which the shipment is being sent. Geographic dimension for 
              regional shipping analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: >-
              Postal or ZIP code to which the shipment is being sent. Geographic dimension for 
              postal-level shipping analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: >-
              Name of the source system from which the record originated (e.g., LOGISTICS_SYS).
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ETL batch that loaded this record. Used for data lineage and ETL tracking.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp recording when the record was loaded into the table. Used for data freshness tracking.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
    
    relationships:
      - name: orders_to_customers
        left_dataset: orders
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship from orders to customers. Each order belongs to exactly 
          one customer, while a customer can have multiple orders. Join on customer_id to associate 
          orders with customer attributes such as customer segment, location, and registration date.
      
      - name: order_items_to_orders
        left_dataset: order_items
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship from order_items to orders. Each order item belongs to 
          exactly one order, while an order can have multiple order items (line items). Join on order_id 
          to associate line items with order header information. CRITICAL: Do not sum order-level amounts 
          (total_amount, subtotal, discount_amount, tax_amount, shipping_fee) after this join as it will 
          cause double-counting by multiplying order amounts by the number of line items.
      
      - name: order_items_to_products
        left_dataset: order_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship from order_items to products. Each order item references 
          exactly one product, while a product can appear in multiple order items. Join on product_id 
          to associate line items with product attributes such as product name, brand, category, 
          and cost price for margin analysis.
      
      - name: products_to_product_categories
        left_dataset: products
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship from products to product_categories. Each product belongs 
          to exactly one category, while a category can contain multiple products. Join on category_id 
          to associate products with category attributes and enable category-level analysis.
      
      - name: product_categories_hierarchy
        left_dataset: product_categories
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - parent_category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Self-referencing hierarchical relationship within product_categories. Each category can have 
          a parent category, creating a category hierarchy. Join on parent_category_id = category_id 
          to traverse the category tree. Root-level categories have NULL parent_category_id. Use recursive 
          queries to traverse the complete hierarchy from leaf categories to root categories or vice versa. 
          This enables hierarchical category analysis such as rolling up product sales from subcategories 
          to parent categories.
      
      - name: payments_to_orders
        left_dataset: payments
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship from payments to orders. Each payment belongs to exactly 
          one order, while an order can have multiple payments in split-payment scenarios. Join on 
          order_id to associate payments with order information for payment reconciliation and analysis.
      
      - name: shipments_to_orders
        left_dataset: shipments
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship from shipments to orders. Each shipment belongs to exactly 
          one order, while an order can have multiple shipments if items are shipped separately. 
          Join on order_id to associate shipments with order information for fulfillment analysis.
    
    metrics:
      - name: total_revenue
        business_name: Total Revenue
        description: >-
          Total revenue across all orders calculated as the sum of order total amounts. This represents 
          the complete order revenue including subtotal, discounts, taxes, and shipping fees. Use this 
          metric for overall revenue analysis and revenue trending. This is an order-level metric and 
          should be calculated directly from the orders dataset without joining to order_items.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(o.total_amount) AS total_revenue
                FROM ecom_bronze.orders AS o
              columns_used:
                - orders.total_amount
      
      - name: total_orders
        business_name: Total Orders
        description: >-
          Total count of orders. Use this metric for order volume analysis and order count trending.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(o.order_id) AS total_orders
                FROM ecom_bronze.orders AS o
              columns_used:
                - orders.order_id
      
      - name: average_order_value
        business_name: Average Order Value
        description: >-
          Average revenue per order calculated as total revenue divided by total order count. 
          This metric represents the typical order size and is useful for understanding customer 
          purchasing behavior and order value trends.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(o.order_id) = 0 THEN 0
                        ELSE SUM(o.total_amount) / COUNT(o.order_id)
                    END AS average_order_value
                FROM ecom_bronze.orders AS o
              columns_used:
                - orders.total_amount
                - orders.order_id
      
      - name: total_customers
        business_name: Total Customers
        description: >-
          Total count of unique customers. Use this metric for customer base size analysis.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(c.customer_id) AS total_customers
                FROM ecom_bronze.customers AS c
              columns_used:
                - customers.customer_id
      
      - name: active_customers
        business_name: Active Customers
        description: >-
          Count of customers with active account status. Use this metric for active customer 
          base analysis and customer retention monitoring.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(c.customer_id) AS active_customers
                FROM ecom_bronze.customers AS c
                WHERE c.is_active = true
              columns_used:
                - customers.customer_id
                - customers.is_active
      
      - name: product_revenue
        business_name: Product Revenue
        description: >-
          Total revenue by product calculated as the sum of line totals from order items. 
          This is a line-level metric that aggregates revenue at the product level. Use this 
          metric for product performance analysis and product revenue ranking.
        return_type: DECIMAL
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    p.product_id,
                    p.product_name,
                    SUM(oi.line_total) AS product_revenue
                FROM ecom_bronze.order_items AS oi
                JOIN ecom_bronze.products AS p ON oi.product_id = p.product_id
                GROUP BY p.product_id, p.product_name
              columns_used:
                - order_items.line_total
                - order_items.product_id
                - products.product_id
                - products.product_name
      
      - name: units_sold
        business_name: Units Sold
        description: >-
          Total quantity of units sold across all order items. Use this metric for volume 
          analysis and inventory planning.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(oi.quantity) AS units_sold
                FROM ecom_bronze.order_items AS oi
              columns_used:
                - order_items.quantity
      
      - name: product_units_sold
        business_name: Product Units Sold
        description: >-
          Total quantity of units sold by product. Use this metric for product volume analysis 
          and product popularity ranking.
        return_type: INTEGER
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    p.product_id,
                    p.product_name,
                    SUM(oi.quantity) AS product_units_sold
                FROM ecom_bronze.order_items AS oi
                JOIN ecom_bronze.products AS p ON oi.product_id = p.product_id
                GROUP BY p.product_id, p.product_name
              columns_used:
                - order_items.quantity
                - order_items.product_id
                - products.product_id
                - products.product_name
      
      - name: average_selling_price
        business_name: Average Selling Price
        description: >-
          Average unit price across all order items weighted by quantity. This represents the 
          typical selling price per unit and is useful for pricing analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    CASE
                        WHEN SUM(oi.quantity) = 0 THEN 0
                        ELSE SUM(oi.quantity * oi.unit_price) / NULLIF(SUM(oi.quantity), 0)
                    END AS average_selling_price
                FROM ecom_bronze.order_items AS oi
              columns_used:
                - order_items.quantity
                - order_items.unit_price
      
      - name: total_discount_amount
        business_name: Total Discount Amount
        description: >-
          Total discount amount across all orders. This is an order-level metric representing 
          the sum of discounts applied to orders. Use for discount impact analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(o.discount_amount) AS total_discount_amount
                FROM ecom_bronze.orders AS o
              columns_used:
                - orders.discount_amount
      
      - name: average_discount_percentage
        business_name: Average Discount Percentage
        description: >-
          Average discount percentage across all order items. This represents the typical 
          discount rate applied at the line item level.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    AVG(oi.discount_pct) AS average_discount_percentage
                FROM ecom_bronze.order_items AS oi
              columns_used:
                - order_items.discount_pct
      
      - name: line_level_discount_amount
        business_name: Line Level Discount Amount
        description: >-
          Total discount amount calculated at the line item level as quantity * unit_price * 
          (discount_pct / 100.0). This represents the monetary discount applied to individual 
          line items and can be aggregated for line-level discount analysis.
        return_type: DECIMAL
        result_grain: one row per order item
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    oi.order_item_id,
                    oi.quantity * oi.unit_price * (oi.discount_pct / 100.0) AS line_level_discount_amount
                FROM ecom_bronze.order_items AS oi
              columns_used:
                - order_items.order_item_id
                - order_items.quantity
                - order_items.unit_price
                - order_items.discount_pct
      
      - name: product_profit
        business_name: Product Profit
        description: >-
          Total profit by product calculated as the difference between line revenue and line cost. 
          Line revenue is calculated as quantity * unit_price * (1 - discount_pct / 100.0). 
          Line cost is calculated as quantity * cost_price. This metric requires joining order_items 
          to products to access cost_price. Use for product profitability analysis.
        return_type: DECIMAL
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    p.product_id,
                    p.product_name,
                    SUM(
                        (oi.quantity * oi.unit_price * (1 - oi.discount_pct / 100.0))
                        - (oi.quantity * COALESCE(p.cost_price, 0))
                    ) AS product_profit
                FROM ecom_bronze.order_items AS oi
                JOIN ecom_bronze.products AS p ON oi.product_id = p.product_id
                GROUP BY p.product_id, p.product_name
              columns_used:
                - order_items.quantity
                - order_items.unit_price
                - order_items.discount_pct
                - order_items.product_id
                - products.product_id
                - products.product_name
                - products.cost_price
      
      - name: product_margin_percentage
        business_name: Product Margin Percentage
        description: >-
          Product profit margin percentage calculated as (product_profit / product_revenue) * 100. 
          This represents the profitability rate for each product. Use for product margin analysis 
          and product profitability ranking.
        return_type: DECIMAL
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    p.product_id,
                    p.product_name,
                    CASE
                        WHEN SUM(oi.line_total) = 0 THEN 0
                        ELSE (
                            SUM(
                                (oi.quantity * oi.unit_price * (1 - oi.discount_pct / 100.0))
                                - (oi.quantity * COALESCE(p.cost_price, 0))
                            ) / NULLIF(SUM(oi.line_total), 0)
                        ) * 100
                    END AS product_margin_percentage
                FROM ecom_bronze.order_items AS oi
                JOIN ecom_bronze.products AS p ON oi.product_id = p.product_id
                GROUP BY p.product_id, p.product_name
              columns_used:
                - order_items.quantity
                - order_items.unit_price
                - order_items.discount_pct
                - order_items.line_total
                - order_items.product_id
                - products.product_id
                - products.product_name
                - products.cost_price
      
      - name: monthly_revenue
        business_name: Monthly Revenue
        description: >-
          Total revenue aggregated by month based on order_date. Use this metric for monthly 
          revenue trending and time-series revenue analysis.
        return_type: DECIMAL
        result_grain: one row per month
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    DATE_TRUNC('month', o.order_date) AS month,
                    SUM(o.total_amount) AS monthly_revenue
                FROM ecom_bronze.orders AS o
                GROUP BY DATE_TRUNC('month', o.order_date)
                ORDER BY month
              columns_used:
                - orders.order_date
                - orders.total_amount
      
      - name: revenue_by_customer_segment
        business_name: Revenue by Customer Segment
        description: >-
          Total revenue aggregated by customer segment. Use this metric for customer segment 
          performance analysis and segment-based revenue comparison.
        return_type: DECIMAL
        result_grain: one row per customer segment
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    c.customer_segment,
                    SUM(o.total_amount) AS revenue_by_customer_segment
                FROM ecom_bronze.orders AS o
                JOIN ecom_bronze.customers AS c ON o.customer_id = c.customer_id
                GROUP BY c.customer_segment
              columns_used:
                - orders.total_amount
                - orders.customer_id
                - customers.customer_id
                - customers.customer_segment
      
      - name: revenue_by_sales_channel
        business_name: Revenue by Sales Channel
        description: >-
          Total revenue aggregated by sales channel. Use this metric for sales channel performance 
          analysis and channel comparison.
        return_type: DECIMAL
        result_grain: one row per sales channel
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    o.sales_channel,
                    SUM(o.total_amount) AS revenue_by_sales_channel
                FROM ecom_bronze.orders AS o
                GROUP BY o.sales_channel
              columns_used:
                - orders.sales_channel
                - orders.total_amount
      
      - name: orders_by_status
        business_name: Orders by Status
        description: >-
          Count of orders aggregated by order status. Use this metric for order status distribution 
          analysis and order pipeline monitoring.
        return_type: INTEGER
        result_grain: one row per order status
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    o.order_status,
                    COUNT(o.order_id) AS orders_by_status
                FROM ecom_bronze.orders AS o
                GROUP BY o.order_status
              columns_used:
                - orders.order_status
                - orders.order_id
      
      - name: total_payments
        business_name: Total Payments
        description: >-
          Total payment amount across all payment transactions. Use this metric for payment 
          volume analysis and payment reconciliation.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(p.amount) AS total_payments
                FROM ecom_bronze.payments AS p
              columns_used:
                - payments.amount
      
      - name: payments_by_method
        business_name: Payments by Method
        description: >-
          Total payment amount aggregated by payment method. Use this metric for payment method 
          preference analysis and payment method performance comparison.
        return_type: DECIMAL
        result_grain: one row per payment method
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    p.payment_method,
                    SUM(p.amount) AS payments_by_method
                FROM ecom_bronze.payments AS p
                GROUP BY p.payment_method
              columns_used:
                - payments.payment_method
                - payments.amount
      
      - name: completed_payments
        business_name: Completed Payments
        description: >-
          Total payment amount for payments with completed status. Use this metric for actual 
          cash received analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(p.amount) AS completed_payments
                FROM ecom_bronze.payments AS p
                WHERE p.payment_status = 'Completed'
              columns_used:
                - payments.amount
                - payments.payment_status
      
      - name: total_shipments
        business_name: Total Shipments
        description: >-
          Total count of shipments. Use this metric for shipment volume analysis.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(s.shipment_id) AS total_shipments
                FROM ecom_bronze.shipments AS s
              columns_used:
                - shipments.shipment_id
      
      - name: shipments_by_status
        business_name: Shipments by Status
        description: >-
          Count of shipments aggregated by shipment status. Use this metric for shipment status 
          distribution analysis and fulfillment pipeline monitoring.
        return_type: INTEGER
        result_grain: one row per shipment status
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    s.shipment_status,
                    COUNT(s.shipment_id) AS shipments_by_status
                FROM ecom_bronze.shipments AS s
                GROUP BY s.shipment_status
              columns_used:
                - shipments.shipment_status
                - shipments.shipment_id
      
      - name: shipments_by_carrier
        business_name: Shipments by Carrier
        description: >-
          Count of shipments aggregated by carrier. Use this metric for carrier utilization 
          analysis and carrier performance comparison.
        return_type: INTEGER
        result_grain: one row per carrier
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    s.carrier,
                    COUNT(s.shipment_id) AS shipments_by_carrier
                FROM ecom_bronze.shipments AS s
                GROUP BY s.carrier
              columns_used:
                - shipments.carrier
                - shipments.shipment_id
      
      - name: average_delivery_time_days
        business_name: Average Delivery Time Days
        description: >-
          Average number of days between shipment dispatch and delivery. Calculated as the 
          average of DATEDIFF(day, shipped_at, delivered_at) for completed shipments. 
          Use this metric for delivery performance analysis and carrier performance evaluation.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    AVG(DATEDIFF(day, s.shipped_at, s.delivered_at)) AS average_delivery_time_days
                FROM ecom_bronze.shipments AS s
                WHERE s.shipped_at IS NOT NULL
                  AND s.delivered_at IS NOT NULL
              columns_used:
                - shipments.shipped_at
                - shipments.delivered_at
      
      - name: category_revenue
        business_name: Category Revenue
        description: >-
          Total revenue by product category. Calculated by joining order_items to products 
          to product_categories and aggregating line_total by category. Use this metric for 
          category performance analysis and category revenue ranking.
        return_type: DECIMAL
        result_grain: one row per category
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    pc.category_id,
                    pc.category_name,
                    SUM(oi.line_total) AS category_revenue
                FROM ecom_bronze.order_items AS oi
                JOIN ecom_bronze.products AS p ON oi.product_id = p.product_id
                JOIN ecom_bronze.product_categories AS pc ON p.category_id = pc.category_id
                GROUP BY pc.category_id, pc.category_name
              columns_used:
                - order_items.line_total
                - order_items.product_id
                - products.product_id
                - products.category_id
                - product_categories.category_id
                - product_categories.category_name
      
      - name: orders_per_customer
        business_name: Orders per Customer
        description: >-
          Average number of orders per customer. Calculated as total order count divided by 
          total customer count. Use this metric for customer engagement analysis and customer 
          purchase frequency evaluation.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT c.customer_id) = 0 THEN 0
                        ELSE CAST(COUNT(o.order_id) AS DECIMAL) / NULLIF(COUNT(DISTINCT c.customer_id), 0)
                    END AS orders_per_customer
                FROM ecom_bronze.customers AS c
                LEFT JOIN ecom_bronze.orders AS o ON c.customer_id = o.customer_id
              columns_used:
                - customers.customer_id
                - orders.order_id
                - orders.customer_id
      
      - name: revenue_per_customer
        business_name: Revenue per Customer
        description: >-
          Average revenue per customer. Calculated as total revenue divided by total customer count. 
          Use this metric for customer value analysis and customer lifetime value estimation.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT c.customer_id) = 0 THEN 0
                        ELSE SUM(o.total_amount) / NULLIF(COUNT(DISTINCT c.customer_id), 0)
                    END AS revenue_per_customer
                FROM ecom_bronze.customers AS c
                LEFT JOIN ecom_bronze.orders AS o ON c.customer_id = o.customer_id
              columns_used:
                - customers.customer_id
                - orders.total_amount
                - orders.customer_id
      
      - name: total_shipping_fees
        business_name: Total Shipping Fees
        description: >-
          Total shipping fees across all orders. This is an order-level metric representing 
          the sum of shipping fees charged. Use for shipping revenue analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(o.shipping_fee) AS total_shipping_fees
                FROM ecom_bronze.orders AS o
              columns_used:
                - orders.shipping_fee
      
      - name: total_tax_collected
        business_name: Total Tax Collected
        description: >-
          Total tax amount collected across all orders. This is an order-level metric representing 
          the sum of taxes charged. Use for tax collection analysis and tax reporting.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(o.tax_amount) AS total_tax_collected
                FROM ecom_bronze.orders AS o
              columns_used:
                - orders.tax_amount