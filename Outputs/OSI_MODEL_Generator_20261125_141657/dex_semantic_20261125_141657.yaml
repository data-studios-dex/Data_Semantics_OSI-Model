version: "1.0"

semantic_model:
  - name: retail_analytics_model
    description: >-
      Comprehensive semantic model for retail analytics covering customer relationship management,
      sales transactions, order fulfillment, product catalog, inventory, payments, and shipment operations.
      This model supports analytical queries across customer behavior, sales performance, product analytics,
      order fulfillment metrics, and operational KPIs.
    
    ai_context:
      instructions: >-
        ## Dataset Grain Reference
        
        - CUSTOMERS: One row per customer. Contains customer profile, demographics, and account status.
        - ORDERS: One row per order. Contains order header information including totals, dates, and shipping details.
        - ORDER_ITEMS: One row per order line item. Contains product-level detail for each order.
        - PRODUCTS: One row per product. Contains product catalog information, pricing, and inventory.
        - PRODUCT_CATEGORIES: One row per product category. Contains category hierarchy with self-referencing parent relationship.
        - PAYMENTS: One row per payment transaction. Contains payment method, status, and transaction details.
        - SHIPMENTS: One row per shipment. Contains carrier, tracking, and delivery information.
        
        ## Metric Selection Guidance
        
        ### Order-Level Metrics
        Use ORDERS dataset for order-level aggregations:
        - Total order count: COUNT(DISTINCT orders.order_id)
        - Total order revenue: SUM(orders.total_amount)
        - Average order value: SUM(orders.total_amount) / COUNT(DISTINCT orders.order_id)
        - Order subtotal, discount, tax, shipping aggregations
        
        ### Order-Item-Level Metrics
        Use ORDER_ITEMS dataset for product-level or line-item-level aggregations:
        - Total units sold: SUM(order_items.quantity)
        - Line-level revenue: SUM(order_items.line_total)
        - Product-level analysis requires joining ORDER_ITEMS to PRODUCTS
        
        ### Customer Metrics
        Use CUSTOMERS dataset for customer counts and demographics:
        - Customer count: COUNT(DISTINCT customers.customer_id)
        - Active customers: COUNT(DISTINCT customers.customer_id) WHERE customers.is_active = true
        - Customer segmentation analysis
        
        ### Product Metrics
        Use PRODUCTS dataset for product catalog metrics:
        - Product count: COUNT(DISTINCT products.product_id)
        - Active products: COUNT(DISTINCT products.product_id) WHERE products.is_active = true
        - Inventory value: SUM(products.stock_quantity * products.unit_price)
        
        ## Join Guidance
        
        ### Standard Relationships
        - ORDERS to CUSTOMERS: orders.customer_id = customers.customer_id (many-to-one)
        - ORDER_ITEMS to ORDERS: order_items.order_id = orders.order_id (many-to-one)
        - ORDER_ITEMS to PRODUCTS: order_items.product_id = products.product_id (many-to-one)
        - PRODUCTS to PRODUCT_CATEGORIES: products.category_id = product_categories.category_id (many-to-one)
        - PAYMENTS to ORDERS: payments.order_id = orders.order_id (many-to-one)
        - SHIPMENTS to ORDERS: shipments.order_id = orders.order_id (many-to-one)
        
        ### Hierarchical Relationship
        - PRODUCT_CATEGORIES self-reference: product_categories.parent_category_id = product_categories.category_id
        - This creates a category hierarchy that may require recursive queries for full hierarchy traversal
        - Use recursive CTEs when analyzing complete category trees
        
        ## Double-Counting Prevention
        
        ### Critical: Order-Level vs Order-Item-Level Measures
        When joining ORDERS to ORDER_ITEMS, order-level measures will be duplicated for each line item.
        
        INCORRECT:
        ```sql
        SELECT SUM(orders.total_amount)
        FROM orders
        JOIN order_items ON orders.order_id = order_items.order_id
        -- This will sum orders.total_amount multiple times per order
        ```
        
        CORRECT for order-level revenue:
        ```sql
        SELECT SUM(orders.total_amount)
        FROM orders
        -- No join to order_items
        ```
        
        CORRECT for line-level revenue:
        ```sql
        SELECT SUM(order_items.line_total)
        FROM order_items
        ```
        
        CORRECT for combined analysis:
        ```sql
        SELECT 
          COUNT(DISTINCT orders.order_id) AS order_count,
          SUM(order_items.line_total) AS line_revenue
        FROM orders
        JOIN order_items ON orders.order_id = order_items.order_id
        ```
        
        ### Payment and Shipment Relationships
        - Multiple payments may exist per order (one-to-many)
        - Multiple shipments may exist per order (one-to-many)
        - When aggregating payment or shipment data with orders, use DISTINCT or appropriate aggregation
        
        ## Time Analysis Guidance
        
        ### Available Date/Time Fields
        - customers.registration_date: Customer registration date (DATE)
        - customers.date_of_birth: Customer birth date (DATE) - PII
        - orders.order_date: Order placement timestamp (TIMESTAMP)
        - payments.paid_at: Payment completion timestamp (TIMESTAMP)
        - shipments.shipped_at: Shipment dispatch timestamp (TIMESTAMP)
        - shipments.delivered_at: Shipment delivery timestamp (TIMESTAMP)
        - products.created_at: Product creation timestamp (TIMESTAMP)
        
        ### Time-Based Analysis
        - Order trends: Use orders.order_date
        - Customer acquisition: Use customers.registration_date
        - Payment timing: Use payments.paid_at
        - Fulfillment timing: Use shipments.shipped_at and shipments.delivered_at
        - Product catalog growth: Use products.created_at
        
        ### Delivery Performance
        Calculate delivery time using:
        - Order to shipment: shipments.shipped_at - orders.order_date
        - Shipment to delivery: shipments.delivered_at - shipments.shipped_at
        - Order to delivery: shipments.delivered_at - orders.order_date
        
        ## Hierarchical Category Analysis
        
        The PRODUCT_CATEGORIES table contains a self-referencing hierarchy via parent_category_id.
        
        To analyze complete category trees, use recursive CTEs:
        
        ```sql
        WITH RECURSIVE category_hierarchy AS (
          SELECT 
            category_id,
            category_name,
            parent_category_id,
            0 AS level,
            CAST(category_name AS STRING) AS path
          FROM product_categories
          WHERE parent_category_id IS NULL
          
          UNION ALL
          
          SELECT 
            pc.category_id,
            pc.category_name,
            pc.parent_category_id,
            ch.level + 1,
            CONCAT(ch.path, ' > ', pc.category_name)
          FROM product_categories pc
          JOIN category_hierarchy ch ON pc.parent_category_id = ch.category_id
        )
        SELECT * FROM category_hierarchy
        ```
        
        ## Computed Fields and Formulas
        
        ### ORDER_ITEMS Computed Fields
        - line_total: Calculated as quantity * unit_price * (1 - discount_pct / 100)
        - This represents the net line amount after applying the line-level discount
        
        ### ORDERS Computed Fields
        - total_amount: Final order total calculated as subtotal - discount_amount + tax_amount + shipping_fee
        - This represents the complete order value including all adjustments
        
        ### PRODUCTS Profit Calculation
        - Product profit margin: (unit_price - cost_price) / unit_price * 100
        - Product profit per unit: unit_price - cost_price
        
        ## Currency Handling
        
        All monetary amounts in ORDERS, ORDER_ITEMS, PRODUCTS, and PAYMENTS use USD currency.
        The currency field is present for reference but all amounts are in USD.
        
        ## Status Field Guidance
        
        ### Order Status
        Available values include: Shipped, Pending, Delivered, Cancelled
        Use for order lifecycle analysis and fulfillment metrics
        
        ### Payment Status
        Available values include: Completed, Pending, Failed, Refunded
        Use for payment success rate and financial reconciliation
        
        ### Shipment Status
        Available values include: In Transit, Delivered, Pending, Returned
        Use for logistics performance and delivery tracking
        
        ## Query Restrictions and Considerations
        
        ### PII Fields
        The following fields contain personally identifiable information and may require special handling:
        - customers.first_name, last_name, email, phone, date_of_birth
        - orders.tax_amount (may be considered sensitive)
        - payments.transaction_ref
        
        ### NULL Handling
        - Optional fields may contain NULL values
        - Use COALESCE or NULL-safe operations when aggregating
        - parent_category_id is NULL for root categories
        - delivered_at is NULL for shipments not yet delivered
        
        ### Active Records
        - customers.is_active: Filter for active customers
        - products.is_active: Filter for active products in catalog
        - product_categories.is_active: Filter for active categories
        
        ### Data Quality
        - All primary keys are NOT NULL
        - Foreign keys are NOT NULL where relationships are mandatory
        - Monetary amounts use DECIMAL(14,2) or DECIMAL(12,2) for precision
        - Timestamps include nanosecond precision TIMESTAMP(29,9)
    
    datasets:
      - name: customers
        business_name: Customers
        description: >-
          Contains comprehensive customer profiles including demographics, contact information,
          account status, and registration details. Grain: One row per customer.
          Primary analytical entity for customer-centric analysis, segmentation, and lifetime value calculations.
        source: CRM_PROD
        primary_key:
          - customer_id
        fields:
          - name: customer_id
            business_name: Customer Identifier
            description: Unique identifier for a customer
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: customer_code
            business_name: Customer Code
            description: Business reference code assigned to the customer
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: first_name
            business_name: First Name
            description: First name of the customer
            sql_type: STRING(255)
            constraints:
              - NOT NULL
              - PII
          
          - name: last_name
            business_name: Last Name
            description: Last name of the customer
            sql_type: STRING(255)
            constraints:
              - NOT NULL
              - PII
          
          - name: email
            business_name: Email
            description: Email address of the customer
            sql_type: STRING(255)
            constraints:
              - NOT NULL
              - PII
          
          - name: phone
            business_name: Phone
            description: Phone number of the customer
            sql_type: STRING(255)
            constraints:
              - PII
          
          - name: gender
            business_name: Gender
            description: Gender of the customer
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: date_of_birth
            business_name: Date Of Birth
            description: Date of birth of the customer
            sql_type: DATE
            constraints:
              - PII
            dimension:
              is_time: true
          
          - name: city
            business_name: City
            description: City where the customer resides
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: state
            business_name: State
            description: State or province where the customer resides
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: country
            business_name: Country
            description: Country where the customer resides
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: postal_code
            business_name: Postal Code
            description: Postal or ZIP code of the customer's address
            sql_type: STRING(255)
          
          - name: customer_segment
            business_name: Customer Segment
            description: Indicates the current segment classification of the customer
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: registration_date
            business_name: Registration Date
            description: Date when the customer registered
            sql_type: DATE
            dimension:
              is_time: true
          
          - name: is_active
            business_name: Is Active
            description: Indicates whether the customer account is currently active
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL
      
      - name: orders
        business_name: Orders
        description: >-
          Records complete order transactions including order header information, customer references,
          order dates, shipping details, and financial totals. Grain: One row per order.
          Central fact table for order-level sales analysis, revenue reporting, and fulfillment tracking.
        source: ORDER_MGMT
        primary_key:
          - order_id
        fields:
          - name: order_id
            business_name: Order Identifier
            description: Unique identifier for an order
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_number
            business_name: Order Number
            description: Business reference number assigned to the order
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: customer_id
            business_name: Customer ID
            description: References the related customer record
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: order_date
            business_name: Order Date
            description: Timestamp recording when the order was placed
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: order_status
            business_name: Order Status
            description: Indicates the current status of the order
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: sales_channel
            business_name: Sales Channel
            description: Indicates the channel through which the order was placed
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: ship_city
            business_name: Ship City
            description: City to which the order is shipped
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: ship_state
            business_name: Ship State
            description: State or province to which the order is shipped
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: Postal or ZIP code to which the order is shipped
            sql_type: STRING(255)
          
          - name: subtotal
            business_name: Subtotal
            description: Monetary amount representing the order subtotal before discounts and taxes
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: discount_amount
            business_name: Discount Amount
            description: Monetary amount representing the total discount applied to the order
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: tax_amount
            business_name: Tax Amount
            description: Monetary amount representing the tax charged on the order
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
              - PII
            measure:
              aggregation: SUM
          
          - name: shipping_fee
            business_name: Shipping Fee
            description: Monetary amount representing the shipping cost for the order
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: total_amount
            business_name: Total Amount
            description: Monetary amount representing the final total of the order
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: currency
            business_name: Currency
            description: Currency code for the order amounts
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL
      
      - name: order_items
        business_name: Order Items
        description: >-
          Records individual line items for each order including product references, quantities,
          pricing, discounts, and line totals. Grain: One row per order line item.
          Detailed fact table for product-level sales analysis, SKU performance, and order composition analysis.
        source: ORDER_MGMT
        primary_key:
          - order_item_id
        fields:
          - name: order_item_id
            business_name: Order Item Identifier
            description: Unique identifier for an order line item
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: References the related order record
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: line_number
            business_name: Line Number
            description: Sequential line number within the order
            sql_type: INT
            constraints:
              - NOT NULL
          
          - name: product_id
            business_name: Product ID
            description: References the related product record
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: quantity
            business_name: Quantity
            description: Number of units ordered for this line item
            sql_type: INT
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: unit_price
            business_name: Unit Price
            description: Monetary amount representing the price per unit
            sql_type: DECIMAL(12,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
          
          - name: discount_pct
            business_name: Discount Pct
            description: Percentage discount applied to the line item
            sql_type: DECIMAL(5,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
          
          - name: line_total
            business_name: Line Total
            description: Monetary amount representing the total for this line item
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL
      
      - name: products
        business_name: Products
        description: >-
          Contains product catalog information including SKU, product names, category assignments,
          brand, pricing, cost, and inventory levels. Grain: One row per product.
          Master dimension for product analysis, inventory management, and profitability calculations.
        source: PRODUCT_CATALOG
        primary_key:
          - product_id
        fields:
          - name: product_id
            business_name: Product Identifier
            description: Unique identifier for a product
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: sku
            business_name: Sku
            description: Stock keeping unit code for the product
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: product_name
            business_name: Product Name
            description: Name of the product
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: category_id
            business_name: Category ID
            description: References the related product category record
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: brand
            business_name: Brand
            description: Brand name of the product
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: description
            business_name: Description
            description: Detailed description of the product
            sql_type: STRING(255)
          
          - name: unit_price
            business_name: Unit Price
            description: Monetary amount representing the selling price per unit
            sql_type: DECIMAL(12,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
          
          - name: cost_price
            business_name: Cost Price
            description: Monetary amount representing the cost per unit
            sql_type: DECIMAL(12,2)
            measure:
              aggregation: AVG
          
          - name: currency
            business_name: Currency
            description: Currency code for the product prices
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: stock_quantity
            business_name: Stock Quantity
            description: Current inventory quantity available for the product
            sql_type: INT
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: is_active
            business_name: Is Active
            description: Indicates whether the product is currently active for sale
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: created_at
            business_name: Created At
            description: Timestamp recording when the product was created in the system
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL
      
      - name: product_categories
        business_name: Product Categories
        description: >-
          Contains product category definitions with hierarchical structure via self-referencing
          parent category relationships. Grain: One row per product category.
          Hierarchical dimension supporting category-based product analysis and multi-level aggregations.
        source: PRODUCT_CATALOG
        primary_key:
          - category_id
        fields:
          - name: category_id
            business_name: Category Identifier
            description: Unique identifier for a product category
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: category_name
            business_name: Category Name
            description: Name of the product category
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: parent_category_id
            business_name: Parent Category ID
            description: References the parent category in the hierarchy
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
          
          - name: description
            business_name: Description
            description: Detailed description of the product category
            sql_type: STRING(255)
          
          - name: is_active
            business_name: Is Active
            description: Indicates whether the category is currently active
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL
      
      - name: payments
        business_name: Payments
        description: >-
          Contains payment transaction records including payment method, status, amount, gateway,
          and transaction references. Grain: One row per payment transaction.
          Fact table for payment analysis, financial reconciliation, and payment method performance.
        source: PAYMENT_SYS
        primary_key:
          - payment_id
        fields:
          - name: payment_id
            business_name: Payment Identifier
            description: Unique identifier for a payment transaction
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: References the related order record
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: payment_method
            business_name: Payment Method
            description: Indicates the method used for payment
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: payment_status
            business_name: Payment Status
            description: Indicates the current status of the payment
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: amount
            business_name: Amount
            description: Monetary amount representing the payment value
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: currency
            business_name: Currency
            description: Currency code for the payment amount
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: transaction_ref
            business_name: Transaction Ref
            description: External reference number for the payment transaction
            sql_type: STRING(255)
            constraints:
              - PII
          
          - name: gateway
            business_name: Gateway
            description: Name of the payment gateway used to process the transaction
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: paid_at
            business_name: Paid At
            description: Timestamp recording when the payment was completed
            sql_type: TIMESTAMP(29,9)
            dimension:
              is_time: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL
      
      - name: shipments
        business_name: Shipments
        description: >-
          Contains shipment records including carrier information, tracking numbers, shipment status,
          and delivery timestamps. Grain: One row per shipment.
          Fact table for logistics analysis, delivery performance, and fulfillment tracking.
        source: LOGISTICS_SYS
        primary_key:
          - shipment_id
        fields:
          - name: shipment_id
            business_name: Shipment Identifier
            description: Unique identifier for a shipment
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: References the related order record
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: carrier
            business_name: Carrier
            description: Name of the shipping carrier handling the shipment
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: tracking_number
            business_name: Tracking Number
            description: Tracking number assigned by the carrier for the shipment
            sql_type: STRING(255)
          
          - name: shipment_status
            business_name: Shipment Status
            description: Indicates the current status of the shipment
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: shipped_at
            business_name: Shipped At
            description: Timestamp recording when the shipment was dispatched
            sql_type: TIMESTAMP(29,9)
            dimension:
              is_time: true
          
          - name: delivered_at
            business_name: Delivered At
            description: Timestamp recording when the shipment was delivered
            sql_type: TIMESTAMP(29,9)
            dimension:
              is_time: true
          
          - name: ship_city
            business_name: Ship City
            description: City to which the shipment is being sent
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: ship_state
            business_name: Ship State
            description: State or province to which the shipment is being sent
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: Postal or ZIP code to which the shipment is being sent
            sql_type: STRING(255)
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL
    
    relationships:
      - name: orders_to_customers
        left_dataset: orders
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship linking orders to their associated customers.
          Each order belongs to exactly one customer, while a customer may have multiple orders.
          Use this relationship for customer-level aggregations and customer demographic analysis of orders.
      
      - name: order_items_to_orders
        left_dataset: order_items
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship linking order line items to their parent orders.
          Each order item belongs to exactly one order, while an order may contain multiple line items.
          CRITICAL: When joining order_items to orders, order-level measures (total_amount, discount_amount, etc.)
          will be duplicated for each line item. Use DISTINCT aggregations or aggregate at the appropriate grain.
      
      - name: order_items_to_products
        left_dataset: order_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship linking order line items to products.
          Each order item references exactly one product, while a product may appear in multiple order items.
          Use this relationship for product-level sales analysis and SKU performance metrics.
      
      - name: products_to_product_categories
        left_dataset: products
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship linking products to their assigned categories.
          Each product belongs to exactly one category, while a category may contain multiple products.
          Use this relationship for category-level product analysis and hierarchical aggregations.
      
      - name: product_categories_hierarchy
        left_dataset: product_categories
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - parent_category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Self-referencing hierarchical relationship within product_categories.
          Each category may reference a parent category, creating a category hierarchy tree.
          Root categories have NULL parent_category_id. This relationship enables multi-level
          category analysis and requires recursive CTEs for complete hierarchy traversal.
          Use recursive queries to analyze complete category paths and aggregate metrics
          across category levels.
      
      - name: payments_to_orders
        left_dataset: payments
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship linking payments to orders.
          Each payment references exactly one order. Note that an order may have multiple payments
          (partial payments, refunds, etc.), creating a one-to-many relationship from orders to payments.
          When aggregating payment amounts with order data, ensure appropriate handling of multiple payments per order.
      
      - name: shipments_to_orders
        left_dataset: shipments
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship linking shipments to orders.
          Each shipment references exactly one order. Note that an order may have multiple shipments
          (split shipments, partial fulfillment), creating a one-to-many relationship from orders to shipments.
          When analyzing shipment data with orders, use appropriate aggregations to handle multiple shipments per order.
    
    metrics:
      - name: total_order_count
        business_name: Total Order Count
        description: >-
          Total number of orders placed. Counts distinct order identifiers from the orders dataset.
          Use for overall sales volume analysis and order trend tracking.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT orders.order_id) AS total_order_count
                FROM orders
              columns_used:
                - orders.order_id
      
      - name: total_revenue
        business_name: Total Revenue
        description: >-
          Total revenue from all orders. Sums the total_amount field from orders dataset.
          Represents complete order value including subtotal, taxes, shipping, and discounts.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.total_amount) AS total_revenue
                FROM orders
              columns_used:
                - orders.total_amount
      
      - name: total_subtotal
        business_name: Total Subtotal
        description: >-
          Total order subtotal before discounts, taxes, and shipping fees.
          Sums the subtotal field from orders dataset.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.subtotal) AS total_subtotal
                FROM orders
              columns_used:
                - orders.subtotal
      
      - name: total_discount_amount
        business_name: Total Discount Amount
        description: >-
          Total discount amount applied across all orders.
          Sums the discount_amount field from orders dataset.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.discount_amount) AS total_discount_amount
                FROM orders
              columns_used:
                - orders.discount_amount
      
      - name: total_tax_amount
        business_name: Total Tax Amount
        description: >-
          Total tax amount collected across all orders.
          Sums the tax_amount field from orders dataset.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.tax_amount) AS total_tax_amount
                FROM orders
              columns_used:
                - orders.tax_amount
      
      - name: total_shipping_fees
        business_name: Total Shipping Fees
        description: >-
          Total shipping fees collected across all orders.
          Sums the shipping_fee field from orders dataset.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.shipping_fee) AS total_shipping_fees
                FROM orders
              columns_used:
                - orders.shipping_fee
      
      - name: average_order_value
        business_name: Average Order Value
        description: >-
          Average revenue per order. Calculated as total revenue divided by total order count.
          Represents the mean order value across all orders.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT orders.order_id) = 0 THEN 0
                    ELSE SUM(orders.total_amount) / COUNT(DISTINCT orders.order_id)
                  END AS average_order_value
                FROM orders
              columns_used:
                - orders.order_id
                - orders.total_amount
      
      - name: total_units_sold
        business_name: Total Units Sold
        description: >-
          Total number of product units sold across all order line items.
          Sums the quantity field from order_items dataset.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.quantity) AS total_units_sold
                FROM order_items
              columns_used:
                - order_items.quantity
      
      - name: total_line_revenue
        business_name: Total Line Revenue
        description: >-
          Total revenue at order line item level. Sums the line_total field from order_items dataset.
          Represents net line revenue after applying line-level discounts.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.line_total) AS total_line_revenue
                FROM order_items
              columns_used:
                - order_items.line_total
      
      - name: average_unit_price
        business_name: Average Unit Price
        description: >-
          Average selling price per unit across all order line items.
          Calculated as weighted average using quantity as weight.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN SUM(order_items.quantity) = 0 THEN 0
                    ELSE SUM(order_items.unit_price * order_items.quantity) / SUM(order_items.quantity)
                  END AS average_unit_price
                FROM order_items
              columns_used:
                - order_items.unit_price
                - order_items.quantity
      
      - name: average_line_discount_pct
        business_name: Average Line Discount Percentage
        description: >-
          Average discount percentage applied at line item level.
          Calculated as simple average of discount_pct across all order items.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(order_items.discount_pct) AS average_line_discount_pct
                FROM order_items
              columns_used:
                - order_items.discount_pct
      
      - name: total_customer_count
        business_name: Total Customer Count
        description: >-
          Total number of customers in the system. Counts distinct customer identifiers.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT customers.customer_id) AS total_customer_count
                FROM customers
              columns_used:
                - customers.customer_id
      
      - name: active_customer_count
        business_name: Active Customer Count
        description: >-
          Number of customers with active accounts. Counts distinct customer identifiers
          where is_active flag is true.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT customers.customer_id) AS active_customer_count
                FROM customers
                WHERE customers.is_active = true
              columns_used:
                - customers.customer_id
                - customers.is_active
      
      - name: total_product_count
        business_name: Total Product Count
        description: >-
          Total number of products in the catalog. Counts distinct product identifiers.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT products.product_id) AS total_product_count
                FROM products
              columns_used:
                - products.product_id
      
      - name: active_product_count
        business_name: Active Product Count
        description: >-
          Number of products currently active for sale. Counts distinct product identifiers
          where is_active flag is true.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT products.product_id) AS active_product_count
                FROM products
                WHERE products.is_active = true
              columns_used:
                - products.product_id
                - products.is_active
      
      - name: total_inventory_value
        business_name: Total Inventory Value
        description: >-
          Total value of current inventory at selling price. Calculated as sum of
          stock_quantity multiplied by unit_price for all products.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(products.stock_quantity * products.unit_price) AS total_inventory_value
                FROM products
              columns_used:
                - products.stock_quantity
                - products.unit_price
      
      - name: total_inventory_cost
        business_name: Total Inventory Cost
        description: >-
          Total cost value of current inventory. Calculated as sum of stock_quantity
          multiplied by cost_price for all products where cost_price is available.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(products.stock_quantity * COALESCE(products.cost_price, 0)) AS total_inventory_cost
                FROM products
              columns_used:
                - products.stock_quantity
                - products.cost_price
      
      - name: total_payment_amount
        business_name: Total Payment Amount
        description: >-
          Total amount of all payments processed. Sums the amount field from payments dataset.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(payments.amount) AS total_payment_amount
                FROM payments
              columns_used:
                - payments.amount
      
      - name: completed_payment_count
        business_name: Completed Payment Count
        description: >-
          Number of successfully completed payments. Counts distinct payment identifiers
          where payment_status is 'Completed'.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT payments.payment_id) AS completed_payment_count
                FROM payments
                WHERE payments.payment_status = 'Completed'
              columns_used:
                - payments.payment_id
                - payments.payment_status
      
      - name: total_shipment_count
        business_name: Total Shipment Count
        description: >-
          Total number of shipments. Counts distinct shipment identifiers.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT shipments.shipment_id) AS total_shipment_count
                FROM shipments
              columns_used:
                - shipments.shipment_id
      
      - name: delivered_shipment_count
        business_name: Delivered Shipment Count
        description: >-
          Number of shipments that have been delivered. Counts distinct shipment identifiers
          where delivered_at timestamp is not null.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT shipments.shipment_id) AS delivered_shipment_count
                FROM shipments
                WHERE shipments.delivered_at IS NOT NULL
              columns_used:
                - shipments.shipment_id
                - shipments.delivered_at
      
      - name: revenue_by_customer
        business_name: Revenue By Customer
        description: >-
          Total revenue aggregated by customer. Returns one row per customer with their total order revenue.
        return_type: decimal
        result_grain: one row per customer
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  orders.customer_id,
                  SUM(orders.total_amount) AS revenue_by_customer
                FROM orders
                GROUP BY orders.customer_id
              columns_used:
                - orders.customer_id
                - orders.total_amount
      
      - name: revenue_by_product
        business_name: Revenue By Product
        description: >-
          Total line revenue aggregated by product. Returns one row per product with their total sales revenue.
        return_type: decimal
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  order_items.product_id,
                  SUM(order_items.line_total) AS revenue_by_product
                FROM order_items
                GROUP BY order_items.product_id
              columns_used:
                - order_items.product_id
                - order_items.line_total
      
      - name: units_sold_by_product
        business_name: Units Sold By Product
        description: >-
          Total units sold aggregated by product. Returns one row per product with their total quantity sold.
        return_type: integer
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  order_items.product_id,
                  SUM(order_items.quantity) AS units_sold_by_product
                FROM order_items
                GROUP BY order_items.product_id
              columns_used:
                - order_items.product_id
                - order_items.quantity
      
      - name: order_count_by_customer
        business_name: Order Count By Customer
        description: >-
          Number of orders placed by each customer. Returns one row per customer with their order count.
        return_type: integer
        result_grain: one row per customer
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  orders.customer_id,
                  COUNT(DISTINCT orders.order_id) AS order_count_by_customer
                FROM orders
                GROUP BY orders.customer_id
              columns_used:
                - orders.customer_id
                - orders.order_id
      
      - name: revenue_by_order_date
        business_name: Revenue By Order Date
        description: >-
          Total revenue aggregated by order date. Returns one row per date with daily revenue.
          Uses date truncation to group orders by calendar date.
        return_type: decimal
        result_grain: one row per date
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  DATE(orders.order_date) AS order_date,
                  SUM(orders.total_amount) AS revenue_by_order_date
                FROM orders
                GROUP BY DATE(orders.order_date)
              columns_used:
                - orders.order_date
                - orders.total_amount
      
      - name: revenue_by_customer_segment
        business_name: Revenue By Customer Segment
        description: >-
          Total revenue aggregated by customer segment. Returns one row per segment with segment revenue.
          Joins orders to customers to access segment classification.
        return_type: decimal
        result_grain: one row per customer segment
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  customers.customer_segment,
                  SUM(orders.total_amount) AS revenue_by_customer_segment
                FROM orders
                JOIN customers ON orders.customer_id = customers.customer_id
                GROUP BY customers.customer_segment
              columns_used:
                - orders.customer_id
                - orders.total_amount
                - customers.customer_id
                - customers.customer_segment
      
      - name: revenue_by_sales_channel
        business_name: Revenue By Sales Channel
        description: >-
          Total revenue aggregated by sales channel. Returns one row per channel with channel revenue.
        return_type: decimal
        result_grain: one row per sales channel
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  orders.sales_channel,
                  SUM(orders.total_amount) AS revenue_by_sales_channel
                FROM orders
                GROUP BY orders.sales_channel
              columns_used:
                - orders.sales_channel
                - orders.total_amount
      
      - name: revenue_by_product_category
        business_name: Revenue By Product Category
        description: >-
          Total line revenue aggregated by product category. Returns one row per category with category revenue.
          Joins order_items to products to categories to access category classification.
        return_type: decimal
        result_grain: one row per product category
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  product_categories.category_id,
                  product_categories.category_name,
                  SUM(order_items.line_total) AS revenue_by_product_category
                FROM order_items
                JOIN products ON order_items.product_id = products.product_id
                JOIN product_categories ON products.category_id = product_categories.category_id
                GROUP BY product_categories.category_id, product_categories.category_name
              columns_used:
                - order_items.product_id
                - order_items.line_total
                - products.product_id
                - products.category_id
                - product_categories.category_id
                - product_categories.category_name
      
      - name: average_delivery_days
        business_name: Average Delivery Days
        description: >-
          Average number of days from order placement to delivery. Calculated using orders.order_date
          and shipments.delivered_at for delivered shipments only.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(DATEDIFF(DAY, orders.order_date, shipments.delivered_at)) AS average_delivery_days
                FROM orders
                JOIN shipments ON orders.order_id = shipments.order_id
                WHERE shipments.delivered_at IS NOT NULL
              columns_used:
                - orders.order_id
                - orders.order_date
                - shipments.order_id
                - shipments.delivered_at
      
      - name: product_profit_margin_pct
        business_name: Product Profit Margin Percentage
        description: >-
          Profit margin percentage for each product calculated as (unit_price - cost_price) / unit_price * 100.
          Returns one row per product. Only calculated for products with cost_price available.
        return_type: decimal
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  products.product_id,
                  products.product_name,
                  CASE
                    WHEN products.unit_price = 0 THEN 0
                    WHEN products.cost_price IS NULL THEN NULL
                    ELSE ((products.unit_price - products.cost_price) / products.unit_price) * 100
                  END AS product_profit_margin_pct
                FROM products
              columns_used:
                - products.product_id
                - products.product_name
                - products.unit_price
                - products.cost_price
      
      - name: order_discount_rate_pct
        business_name: Order Discount Rate Percentage
        description: >-
          Overall discount rate as percentage of subtotal. Calculated as total discount amount
          divided by total subtotal multiplied by 100.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN SUM(orders.subtotal) = 0 THEN 0
                    ELSE (SUM(orders.discount_amount) / SUM(orders.subtotal)) * 100
                  END AS order_discount_rate_pct
                FROM orders
              columns_used:
                - orders.subtotal
                - orders.discount_amount
      
      - name: payment_success_rate_pct
        business_name: Payment Success Rate Percentage
        description: >-
          Percentage of payments that completed successfully. Calculated as count of completed payments
          divided by total payment count multiplied by 100.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(payments.payment_id) = 0 THEN 0
                    ELSE (SUM(CASE WHEN payments.payment_status = 'Completed' THEN 1 ELSE 0 END) / 
                          CAST(COUNT(payments.payment_id) AS DOUBLE)) * 100
                  END AS payment_success_rate_pct
                FROM payments
              columns_used:
                - payments.payment_id
                - payments.payment_status
      
      - name: on_time_delivery_rate_pct
        business_name: On Time Delivery Rate Percentage
        description: >-
          Percentage of shipments delivered on time. Calculated as count of delivered shipments
          divided by total shipment count multiplied by 100.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(shipments.shipment_id) = 0 THEN 0
                    ELSE (SUM(CASE WHEN shipments.delivered_at IS NOT NULL THEN 1 ELSE 0 END) / 
                          CAST(COUNT(shipments.shipment_id) AS DOUBLE)) * 100
                  END AS on_time_delivery_rate_pct
                FROM shipments
              columns_used:
                - shipments.shipment_id
                - shipments.delivered_at