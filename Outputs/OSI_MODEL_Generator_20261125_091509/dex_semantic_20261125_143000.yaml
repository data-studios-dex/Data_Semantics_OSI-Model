version: "1.0"

semantic_model:
  - name: retail_analytics_model
    description: >-
      Comprehensive semantic model for retail analytics covering customers, orders, products, 
      payments, and shipments. This model supports revenue analysis, customer analytics, 
      product performance, order fulfillment, and payment processing analytics.
      
      The model is derived from an Oracle database schema containing 7 core tables with 95 
      documented columns across the retail domain.
    
    ai_context:
      instructions: >-
        ## Dataset Grain Reference
        
        - **customers**: One row per customer. Contains customer demographic and registration information.
        
        - **orders**: One row per order. Contains order header information including totals, dates, and shipping details.
        
        - **order_items**: One row per order line item. Contains product-level detail for each item within an order.
        
        - **products**: One row per product. Contains product catalog information including pricing and inventory.
        
        - **product_categories**: One row per product category. Contains category hierarchy with self-referencing parent relationships.
        
        - **payments**: One row per payment transaction. Contains payment processing details linked to orders.
        
        - **shipments**: One row per shipment. Contains shipment tracking and delivery information linked to orders.
        
        
        ## Metric Selection and Grain Handling
        
        **Order-Level Metrics:**
        
        Use `orders.total_amount`, `orders.subtotal`, `orders.discount_amount`, `orders.tax_amount`, 
        and `orders.shipping_fee` for order-level revenue analysis.
        
        **Order-Item-Level Metrics:**
        
        Use `order_items.line_total`, `order_items.quantity`, and `order_items.unit_price` for 
        product-level or SKU-level analysis.
        
        **Critical Double-Counting Prevention:**
        
        - Do NOT sum `orders.total_amount` after joining orders to order_items. This will multiply 
          order totals by the number of line items.
        
        - When analyzing revenue by product, use `order_items.line_total`.
        
        - When analyzing revenue by customer or order date, use `orders.total_amount`.
        
        - When analyzing both order and item dimensions together, aggregate at the appropriate grain 
          or use window functions to avoid duplication.
        
        
        ## Join Guidance
        
        **Standard Relationships:**
        
        - `orders.customer_id = customers.customer_id` (many-to-one)
        
        - `order_items.order_id = orders.order_id` (many-to-one)
        
        - `order_items.product_id = products.product_id` (many-to-one)
        
        - `products.category_id = product_categories.category_id` (many-to-one)
        
        - `payments.order_id = orders.order_id` (many-to-one)
        
        - `shipments.order_id = orders.order_id` (many-to-one)
        
        **Hierarchical Relationship:**
        
        - `product_categories.parent_category_id = product_categories.category_id` (self-referencing)
        
        This represents a category hierarchy. Use recursive queries to traverse the full hierarchy 
        when analyzing category rollups.
        
        
        ## Time Analysis
        
        **Order Analysis:**
        
        Use `orders.order_date` for order placement timing, revenue trends, and sales velocity.
        
        **Customer Registration:**
        
        Use `customers.registration_date` for customer acquisition analysis and cohort analysis.
        
        **Payment Processing:**
        
        Use `payments.paid_at` for payment timing and cash flow analysis.
        
        **Shipment Tracking:**
        
        Use `shipments.shipped_at` for shipment dispatch timing.
        
        Use `shipments.delivered_at` for delivery timing and fulfillment performance.
        
        **Delivery Performance:**
        
        Calculate delivery time as the difference between `shipments.delivered_at` and `shipments.shipped_at`.
        
        
        ## Recursive Hierarchies
        
        **Product Category Hierarchy:**
        
        The `product_categories` table contains a self-referencing foreign key `parent_category_id` 
        pointing to `category_id`. This represents a hierarchical category structure.
        
        To traverse the full hierarchy, use Oracle recursive queries with CONNECT BY:
        
        ```sql
        SELECT 
            category_id,
            category_name,
            parent_category_id,
            LEVEL as hierarchy_level,
            SYS_CONNECT_BY_PATH(category_name, ' > ') as category_path
        FROM product_categories
        START WITH parent_category_id IS NULL
        CONNECT BY PRIOR category_id = parent_category_id
        ```
        
        For category rollup metrics, aggregate child category values up to parent categories.
        
        
        ## Metrics and Formulas
        
        **Revenue Metrics:**
        
        - **Total Revenue**: Sum of `orders.total_amount` at order grain
        
        - **Subtotal Revenue**: Sum of `orders.subtotal` before discounts and fees
        
        - **Line Revenue**: Sum of `order_items.line_total` at item grain
        
        **Discount Metrics:**
        
        - **Total Discount Amount**: Sum of `orders.discount_amount`
        
        - **Average Discount Percentage**: Calculated from `order_items.discount_pct`
        
        - **Discount Rate**: `SUM(orders.discount_amount) / SUM(orders.subtotal) * 100`
        
        **Profit Metrics:**
        
        - **Gross Profit**: `SUM(order_items.quantity * (order_items.unit_price - products.cost_price))`
        
        - **Gross Margin %**: `(Gross Profit / Line Revenue) * 100`
        
        **Customer Metrics:**
        
        - **Customer Count**: `COUNT(DISTINCT customers.customer_id)`
        
        - **Active Customer Count**: Count where `customers.is_active = true`
        
        - **Average Order Value**: `SUM(orders.total_amount) / COUNT(DISTINCT orders.order_id)`
        
        - **Orders per Customer**: `COUNT(orders.order_id) / COUNT(DISTINCT customers.customer_id)`
        
        **Product Metrics:**
        
        - **Units Sold**: `SUM(order_items.quantity)`
        
        - **Average Selling Price**: `SUM(order_items.line_total) / SUM(order_items.quantity)`
        
        - **Product Revenue**: `SUM(order_items.line_total)` grouped by product
        
        **Fulfillment Metrics:**
        
        - **Shipment Count**: `COUNT(DISTINCT shipments.shipment_id)`
        
        - **Average Delivery Days**: `AVG(shipments.delivered_at - shipments.shipped_at)` in days
        
        - **On-Time Delivery Rate**: Requires business rule for expected delivery timeframe
        
        
        ## Query Restrictions and Ambiguity
        
        **Payment-to-Order Relationship:**
        
        The data model shows a many-to-one relationship from payments to orders. In practice, 
        an order may have multiple payment transactions (partial payments, refunds). When 
        calculating total payment amount per order, sum all related payment records.
        
        **Shipment-to-Order Relationship:**
        
        The data model shows a many-to-one relationship from shipments to orders. An order 
        may have multiple shipments if items are shipped separately. When analyzing shipment 
        metrics, be aware of potential one-to-many scenarios.
        
        **Currency Handling:**
        
        All monetary amounts in the sample data use USD. The currency field is present in 
        orders, products, and payments tables. For multi-currency analysis, currency conversion 
        logic would be required but is not present in the current data model.
        
        **Null Handling:**
        
        - `shipments.delivered_at` may be NULL for shipments not yet delivered
        
        - `product_categories.parent_category_id` is NULL for root-level categories
        
        - Use `NVL()` or `COALESCE()` for Oracle NULL handling in calculations
        
        **Status Field Analysis:**
        
        - `orders.order_status`: Filter for 'Completed' orders for revenue recognition
        
        - `payments.payment_status`: Filter for 'Settled' payments for cash flow analysis
        
        - `shipments.shipment_status`: Use for fulfillment pipeline analysis
        
        - `customers.is_active`: Filter for active customers in customer analytics
        
        - `products.is_active`: Filter for active products in product catalog analysis
        
        - `product_categories.is_active`: Filter for active categories
    
    datasets:
      - name: customers
        business_name: Customers
        description: >-
          Contains customer master data including demographic information, contact details, 
          and registration information. One row per customer. Primary key is customer_id.
          Supports customer segmentation, geographic analysis, and customer lifecycle analytics.
        source: APPUSER.CUSTOMERS
        primary_key:
          - customer_id
        fields:
          - name: customer_id
            business_name: Customer Identifier
            description: Unique identifier for a customer.
            sql_type: NUMBER(38,0)
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: customer_code
            business_name: Customer Code
            description: Business reference code used to uniquely identify the customer in source systems.
            sql_type: VARCHAR2(255)
            constraints:
              - UNIQUE
          
          - name: first_name
            business_name: First Name
            description: Given name of the customer.
            sql_type: VARCHAR2(255)
            constraints:
              - PII
          
          - name: last_name
            business_name: Last Name
            description: Family name or surname of the customer.
            sql_type: VARCHAR2(255)
            constraints:
              - PII
          
          - name: email
            business_name: Email
            description: Email address used to contact the customer.
            sql_type: VARCHAR2(255)
            constraints:
              - PII
              - UNIQUE
          
          - name: phone
            business_name: Phone
            description: Primary phone number of the customer.
            sql_type: VARCHAR2(255)
            constraints:
              - PII
          
          - name: gender
            business_name: Gender
            description: Recorded gender of the customer.
            sql_type: VARCHAR2(255)
            constraints:
              - PII
            dimension:
              is_categorical: true
          
          - name: date_of_birth
            business_name: Date Of Birth
            description: Date of birth of the customer.
            sql_type: DATE
            constraints:
              - PII
          
          - name: city
            business_name: City
            description: City of the customer's primary address.
            sql_type: VARCHAR2(255)
            constraints:
              - PII
            dimension:
              is_categorical: true
          
          - name: state
            business_name: State
            description: State or region of the customer's primary address.
            sql_type: VARCHAR2(255)
            constraints:
              - PII
            dimension:
              is_categorical: true
          
          - name: country
            business_name: Country
            description: Country of the customer's primary address.
            sql_type: VARCHAR2(255)
            constraints:
              - PII
            dimension:
              is_categorical: true
          
          - name: postal_code
            business_name: Postal Code
            description: Postal or ZIP code of the customer's primary address.
            sql_type: VARCHAR2(255)
            constraints:
              - PII
          
          - name: customer_segment
            business_name: Customer Segment
            description: Commercial segment or classification assigned to the customer.
            sql_type: VARCHAR2(255)
            dimension:
              is_categorical: true
          
          - name: registration_date
            business_name: Registration Date
            description: Date when the customer was first registered in the system.
            sql_type: DATE
            dimension:
              is_time: true
          
          - name: is_active
            business_name: Is Active
            description: Indicates whether the customer account is currently active.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: Identifier of the source system from which the customer record was loaded.
            sql_type: VARCHAR2(255)
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ingestion batch that loaded the customer record.
            sql_type: NUMBER(38,0)
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the customer record was loaded into the data store.
            sql_type: TIMESTAMP(6)
            constraints:
              - NOT NULL
      
      - name: orders
        business_name: Orders
        description: >-
          Contains order header information including order totals, dates, status, and shipping details.
          One row per order. Primary key is order_id. Supports order-level revenue analysis, 
          order status tracking, and sales channel analysis.
        source: APPUSER.ORDERS
        primary_key:
          - order_id
        fields:
          - name: order_id
            business_name: Order Identifier
            description: Unique identifier for an order.
            sql_type: NUMBER(38,0)
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: order_number
            business_name: Order Number
            description: Business-facing order number used to reference the order.
            sql_type: VARCHAR2(255)
            constraints:
              - UNIQUE
          
          - name: customer_id
            business_name: Customer Reference
            description: References the related customer record that placed the order.
            sql_type: NUMBER(38,0)
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: order_date
            business_name: Order Date
            description: Timestamp recording when the order was created.
            sql_type: TIMESTAMP(6)
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: order_status
            business_name: Order Status
            description: Indicates the current processing status of the order.
            sql_type: VARCHAR2(255)
            dimension:
              is_categorical: true
          
          - name: sales_channel
            business_name: Sales Channel
            description: Channel through which the order was placed, such as online or in-store.
            sql_type: VARCHAR2(255)
            dimension:
              is_categorical: true
          
          - name: ship_city
            business_name: Ship City
            description: City for the order's shipping address.
            sql_type: VARCHAR2(255)
            constraints:
              - PII
            dimension:
              is_categorical: true
          
          - name: ship_state
            business_name: Ship State
            description: State or region for the order's shipping address.
            sql_type: VARCHAR2(255)
            constraints:
              - PII
            dimension:
              is_categorical: true
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: Postal or ZIP code for the order's shipping address.
            sql_type: VARCHAR2(255)
            constraints:
              - PII
          
          - name: subtotal
            business_name: Subtotal
            description: Monetary amount representing the pre-discount total of items in the order.
            sql_type: NUMBER(14,2)
            measure:
              aggregation: SUM
          
          - name: discount_amount
            business_name: Discount Amount
            description: Monetary amount representing discounts applied to the order.
            sql_type: NUMBER(14,2)
            measure:
              aggregation: SUM
          
          - name: tax_amount
            business_name: Tax Amount
            description: Monetary amount representing tax charged on the order.
            sql_type: NUMBER(14,2)
            constraints:
              - PII
            measure:
              aggregation: SUM
          
          - name: shipping_fee
            business_name: Shipping Fee
            description: Monetary amount representing shipping charges for the order.
            sql_type: NUMBER(14,2)
            measure:
              aggregation: SUM
          
          - name: total_amount
            business_name: Total Amount
            description: Monetary amount representing the final total charged for the order.
            sql_type: NUMBER(14,2)
            measure:
              aggregation: SUM
          
          - name: currency
            business_name: Currency
            description: Currency code used for monetary amounts in the order.
            sql_type: VARCHAR2(255)
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: Identifier of the source system from which the order record was loaded.
            sql_type: VARCHAR2(255)
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ingestion batch that loaded the order record.
            sql_type: NUMBER(38,0)
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the order record was loaded into the data store.
            sql_type: TIMESTAMP(6)
            constraints:
              - NOT NULL
      
      - name: order_items
        business_name: Order Items
        description: >-
          Contains order line item details including product references, quantities, pricing, 
          and line totals. One row per order line item. Primary key is order_item_id. 
          Supports product-level revenue analysis and SKU-level analytics.
        source: APPUSER.ORDER_ITEMS
        primary_key:
          - order_item_id
        fields:
          - name: order_item_id
            business_name: Order Item Identifier
            description: Unique identifier for an order line item.
            sql_type: NUMBER(38,0)
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: order_id
            business_name: Order Reference
            description: References the related order to which this line item belongs.
            sql_type: NUMBER(38,0)
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: line_number
            business_name: Line Number
            description: Sequential line number of the item within the order.
            sql_type: NUMBER(38,0)
            constraints:
              - NOT NULL
          
          - name: product_id
            business_name: Product Reference
            description: References the product associated with this order line item.
            sql_type: NUMBER(38,0)
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: quantity
            business_name: Quantity
            description: Number of units of the product ordered in this line item.
            sql_type: NUMBER(38,0)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: unit_price
            business_name: Unit Price
            description: Monetary price per single unit of the product at the time of order.
            sql_type: NUMBER(12,2)
          
          - name: discount_pct
            business_name: Discount Percentage
            description: Percentage discount applied to the unit price for this line item.
            sql_type: NUMBER(5,2)
          
          - name: line_total
            business_name: Line Total
            description: Monetary amount representing the total value of the line item after discounts.
            sql_type: NUMBER(14,2)
            measure:
              aggregation: SUM
          
          - name: _source_system
            business_name: Source System
            description: Identifier of the source system from which the order item record was loaded.
            sql_type: VARCHAR2(255)
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ingestion batch that loaded the order item record.
            sql_type: NUMBER(38,0)
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the order item record was loaded into the data store.
            sql_type: TIMESTAMP(6)
            constraints:
              - NOT NULL
      
      - name: payments
        business_name: Payments
        description: >-
          Contains payment transaction details including payment methods, amounts, status, 
          and gateway information. One row per payment transaction. Primary key is payment_id.
          Supports payment processing analysis and cash flow analytics.
        source: APPUSER.PAYMENTS
        primary_key:
          - payment_id
        fields:
          - name: payment_id
            business_name: Payment Identifier
            description: Unique identifier for a payment transaction.
            sql_type: NUMBER(38,0)
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: order_id
            business_name: Order Reference
            description: References the order that the payment is applied to.
            sql_type: NUMBER(38,0)
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: payment_method
            business_name: Payment Method
            description: Type of payment method used, such as credit card, PayPal, or bank transfer.
            sql_type: VARCHAR2(255)
            constraints:
              - PII
            dimension:
              is_categorical: true
          
          - name: payment_status
            business_name: Payment Status
            description: Indicates the current processing status of the payment.
            sql_type: VARCHAR2(255)
            dimension:
              is_categorical: true
          
          - name: amount
            business_name: Amount
            description: Monetary amount representing the value of the payment.
            sql_type: NUMBER(14,2)
            measure:
              aggregation: SUM
          
          - name: currency
            business_name: Currency
            description: Currency code used for the payment amount.
            sql_type: VARCHAR2(255)
            dimension:
              is_categorical: true
          
          - name: transaction_ref
            business_name: Transaction Reference
            description: Reference code provided by the payment gateway for the transaction.
            sql_type: VARCHAR2(255)
            constraints:
              - PII
              - UNIQUE
          
          - name: gateway
            business_name: Gateway
            description: Name of the payment gateway or processor handling the transaction.
            sql_type: VARCHAR2(255)
            dimension:
              is_categorical: true
          
          - name: paid_at
            business_name: Paid At
            description: Timestamp recording when the payment was completed.
            sql_type: TIMESTAMP(6)
            dimension:
              is_time: true
          
          - name: _source_system
            business_name: Source System
            description: Identifier of the source system from which the payment record was loaded.
            sql_type: VARCHAR2(255)
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ingestion batch that loaded the payment record.
            sql_type: NUMBER(38,0)
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the payment record was loaded into the data store.
            sql_type: TIMESTAMP(6)
            constraints:
              - NOT NULL
      
      - name: products
        business_name: Products
        description: >-
          Contains product catalog information including SKU, pricing, cost, inventory, 
          and category references. One row per product. Primary key is product_id.
          Supports product performance analysis, inventory analytics, and margin analysis.
        source: APPUSER.PRODUCTS
        primary_key:
          - product_id
        fields:
          - name: product_id
            business_name: Product Identifier
            description: Unique identifier for a product.
            sql_type: NUMBER(38,0)
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: sku
            business_name: SKU
            description: Stock keeping unit code used to uniquely identify the product.
            sql_type: VARCHAR2(255)
            constraints:
              - UNIQUE
          
          - name: product_name
            business_name: Product Name
            description: Marketing or display name of the product.
            sql_type: VARCHAR2(255)
          
          - name: category_id
            business_name: Category Reference
            description: References the product category to which the product belongs.
            sql_type: NUMBER(38,0)
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: brand
            business_name: Brand
            description: Brand or manufacturer associated with the product.
            sql_type: VARCHAR2(255)
            dimension:
              is_categorical: true
          
          - name: description
            business_name: Description
            description: Text description summarizing the product features.
            sql_type: VARCHAR2(255)
          
          - name: unit_price
            business_name: Unit Price
            description: Standard selling price per unit of the product.
            sql_type: NUMBER(12,2)
          
          - name: cost_price
            business_name: Cost Price
            description: Internal cost per unit incurred by the retailer to purchase or produce the product.
            sql_type: NUMBER(12,2)
          
          - name: currency
            business_name: Currency
            description: Currency code used for all monetary prices associated with the product.
            sql_type: VARCHAR2(255)
            dimension:
              is_categorical: true
          
          - name: stock_quantity
            business_name: Stock Quantity
            description: Current on-hand inventory quantity available for sale.
            sql_type: NUMBER(38,0)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: is_active
            business_name: Is Active
            description: Indicates whether the product is active and available for sale.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: created_at
            business_name: Created At
            description: Timestamp recording when the product record was first created.
            sql_type: TIMESTAMP(6)
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: _source_system
            business_name: Source System
            description: Identifier of the source system from which the product record was loaded.
            sql_type: VARCHAR2(255)
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ingestion batch that loaded the product record.
            sql_type: NUMBER(38,0)
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the product record was loaded into the data store.
            sql_type: TIMESTAMP(6)
            constraints:
              - NOT NULL
      
      - name: product_categories
        business_name: Product Categories
        description: >-
          Contains product category master data with hierarchical parent-child relationships.
          One row per product category. Primary key is category_id. The parent_category_id 
          field creates a self-referencing hierarchy enabling category rollup analytics.
        source: APPUSER.PRODUCT_CATEGORIES
        primary_key:
          - category_id
        fields:
          - name: category_id
            business_name: Category Identifier
            description: Unique identifier for a product category.
            sql_type: NUMBER(38,0)
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: category_name
            business_name: Category Name
            description: Name of the product category.
            sql_type: VARCHAR2(255)
          
          - name: parent_category_id
            business_name: Parent Category Identifier
            description: References the parent category in the category hierarchy, if applicable.
            sql_type: NUMBER(38,0)
            constraints:
              - FOREIGN KEY
          
          - name: description
            business_name: Description
            description: Text description explaining the scope of the category.
            sql_type: VARCHAR2(255)
          
          - name: is_active
            business_name: Is Active
            description: Indicates whether the product category is active and in use.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: Identifier of the source system from which the product category record was loaded.
            sql_type: VARCHAR2(255)
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ingestion batch that loaded the product category record.
            sql_type: NUMBER(38,0)
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the product category record was loaded into the data store.
            sql_type: TIMESTAMP(6)
            constraints:
              - NOT NULL
      
      - name: shipments
        business_name: Shipments
        description: >-
          Contains shipment tracking and delivery information including carrier details, 
          tracking numbers, status, and delivery timestamps. One row per shipment. 
          Primary key is shipment_id. Supports fulfillment analytics and delivery performance tracking.
        source: APPUSER.SHIPMENTS
        primary_key:
          - shipment_id
        fields:
          - name: shipment_id
            business_name: Shipment Identifier
            description: Unique identifier for a shipment.
            sql_type: NUMBER(38,0)
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: order_id
            business_name: Order Reference
            description: References the order associated with the shipment.
            sql_type: NUMBER(38,0)
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: carrier
            business_name: Carrier
            description: Name of the logistics carrier responsible for delivering the shipment.
            sql_type: VARCHAR2(255)
            dimension:
              is_categorical: true
          
          - name: tracking_number
            business_name: Tracking Number
            description: Tracking number assigned by the carrier to follow the shipment.
            sql_type: VARCHAR2(255)
            constraints:
              - PII
              - UNIQUE
          
          - name: shipment_status
            business_name: Shipment Status
            description: Indicates the current status of the shipment.
            sql_type: VARCHAR2(255)
            dimension:
              is_categorical: true
          
          - name: shipped_at
            business_name: Shipped At
            description: Timestamp recording when the shipment was dispatched.
            sql_type: TIMESTAMP(6)
            dimension:
              is_time: true
          
          - name: delivered_at
            business_name: Delivered At
            description: Timestamp recording when the shipment was delivered to the customer.
            sql_type: TIMESTAMP(6)
            dimension:
              is_time: true
          
          - name: ship_city
            business_name: Ship City
            description: City for the shipment delivery address.
            sql_type: VARCHAR2(255)
            constraints:
              - PII
            dimension:
              is_categorical: true
          
          - name: ship_state
            business_name: Ship State
            description: State or region for the shipment delivery address.
            sql_type: VARCHAR2(255)
            constraints:
              - PII
            dimension:
              is_categorical: true
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: Postal or ZIP code for the shipment delivery address.
            sql_type: VARCHAR2(255)
            constraints:
              - PII
          
          - name: _source_system
            business_name: Source System
            description: Identifier of the source system from which the shipment record was loaded.
            sql_type: VARCHAR2(255)
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ingestion batch that loaded the shipment record.
            sql_type: NUMBER(38,0)
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the shipment record was loaded into the data store.
            sql_type: TIMESTAMP(6)
            constraints:
              - NOT NULL
    
    relationships:
      - name: orders_to_customers
        left_dataset: orders
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: inner
        resolution: >-
          Each order is placed by exactly one customer. Multiple orders can belong to the same customer.
          Join orders to customers using customer_id to analyze orders by customer attributes such as 
          segment, geography, or registration cohort.
      
      - name: order_items_to_orders
        left_dataset: order_items
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: inner
        resolution: >-
          Each order line item belongs to exactly one order. An order can contain multiple line items.
          Join order_items to orders to access order-level attributes such as order_date, customer_id, 
          or order_status. CRITICAL: Do not sum order-level measures (total_amount, subtotal, discount_amount, 
          tax_amount, shipping_fee) after this join as it will multiply values by the number of line items.
      
      - name: order_items_to_products
        left_dataset: order_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: inner
        resolution: >-
          Each order line item references exactly one product. The same product can appear in multiple 
          order line items. Join order_items to products to analyze sales by product attributes such as 
          product_name, brand, category, or to calculate profit using cost_price.
      
      - name: products_to_product_categories
        left_dataset: products
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - category_id
          right:
            - category_id
        join_type: inner
        resolution: >-
          Each product belongs to exactly one product category. Multiple products can belong to the same 
          category. Join products to product_categories to analyze products by category or to traverse 
          the category hierarchy using parent_category_id.
      
      - name: payments_to_orders
        left_dataset: payments
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: inner
        resolution: >-
          Each payment transaction is applied to exactly one order. An order may have multiple payment 
          transactions (e.g., partial payments, refunds, split payments). Join payments to orders to 
          analyze payment behavior by order attributes or to reconcile payment amounts with order totals.
      
      - name: shipments_to_orders
        left_dataset: shipments
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: inner
        resolution: >-
          Each shipment is associated with exactly one order. An order may have multiple shipments if 
          items are shipped separately or in multiple packages. Join shipments to orders to analyze 
          fulfillment performance by order attributes or to track delivery status.
      
      - name: product_categories_hierarchy
        left_dataset: product_categories
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - parent_category_id
          right:
            - category_id
        join_type: left_outer
        resolution: >-
          Self-referencing hierarchical relationship representing the product category hierarchy. 
          Each category may have a parent category referenced by parent_category_id. Root-level 
          categories have NULL parent_category_id. Use Oracle CONNECT BY syntax to traverse the 
          full hierarchy:
          
          SELECT category_id, category_name, parent_category_id, LEVEL as hierarchy_level,
                 SYS_CONNECT_BY_PATH(category_name, ' > ') as category_path
          FROM product_categories
          START WITH parent_category_id IS NULL
          CONNECT BY PRIOR category_id = parent_category_id
          
          For category rollup metrics, aggregate child category values to parent categories using 
          recursive queries.
    
    metrics:
      - name: total_revenue
        business_name: Total Revenue
        description: >-
          Total revenue from all orders calculated as the sum of order total amounts. 
          This metric represents the final charged amount including all discounts, taxes, and fees.
          Use this metric for order-level revenue analysis.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    SUM(o.total_amount) AS total_revenue
                FROM APPUSER.ORDERS o
              columns_used:
                - orders.total_amount
      
      - name: total_subtotal
        business_name: Total Subtotal
        description: >-
          Total pre-discount revenue from all orders calculated as the sum of order subtotals.
          This represents the total value before discounts, taxes, and shipping fees are applied.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    SUM(o.subtotal) AS total_subtotal
                FROM APPUSER.ORDERS o
              columns_used:
                - orders.subtotal
      
      - name: total_discount_amount
        business_name: Total Discount Amount
        description: >-
          Total discount amount applied across all orders. Represents the monetary value of 
          all discounts given to customers.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    SUM(o.discount_amount) AS total_discount_amount
                FROM APPUSER.ORDERS o
              columns_used:
                - orders.discount_amount
      
      - name: total_tax_amount
        business_name: Total Tax Amount
        description: >-
          Total tax amount collected across all orders.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    SUM(o.tax_amount) AS total_tax_amount
                FROM APPUSER.ORDERS o
              columns_used:
                - orders.tax_amount
      
      - name: total_shipping_fee
        business_name: Total Shipping Fee
        description: >-
          Total shipping fees collected across all orders.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    SUM(o.shipping_fee) AS total_shipping_fee
                FROM APPUSER.ORDERS o
              columns_used:
                - orders.shipping_fee
      
      - name: discount_rate
        business_name: Discount Rate
        description: >-
          Percentage of subtotal revenue given as discounts. Calculated as total discount amount 
          divided by total subtotal, expressed as a percentage. Measures the overall discount 
          intensity across all orders.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    CASE
                        WHEN SUM(o.subtotal) = 0 THEN 0
                        ELSE (SUM(o.discount_amount) / NULLIF(SUM(o.subtotal), 0)) * 100
                    END AS discount_rate_pct
                FROM APPUSER.ORDERS o
              columns_used:
                - orders.discount_amount
                - orders.subtotal
      
      - name: order_count
        business_name: Order Count
        description: >-
          Total number of orders placed.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    COUNT(o.order_id) AS order_count
                FROM APPUSER.ORDERS o
              columns_used:
                - orders.order_id
      
      - name: customer_count
        business_name: Customer Count
        description: >-
          Total number of unique customers.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    COUNT(DISTINCT c.customer_id) AS customer_count
                FROM APPUSER.CUSTOMERS c
              columns_used:
                - customers.customer_id
      
      - name: active_customer_count
        business_name: Active Customer Count
        description: >-
          Total number of customers with active status. Filters for customers where is_active is true.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    COUNT(c.customer_id) AS active_customer_count
                FROM APPUSER.CUSTOMERS c
                WHERE c.is_active = 1
              columns_used:
                - customers.customer_id
                - customers.is_active
      
      - name: average_order_value
        business_name: Average Order Value
        description: >-
          Average revenue per order calculated as total revenue divided by number of orders.
          Measures the typical order size.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    SUM(o.total_amount) / NULLIF(COUNT(o.order_id), 0) AS average_order_value
                FROM APPUSER.ORDERS o
              columns_used:
                - orders.total_amount
                - orders.order_id
      
      - name: orders_per_customer
        business_name: Orders per Customer
        description: >-
          Average number of orders per customer calculated as total order count divided by 
          unique customer count. Measures customer purchase frequency.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    COUNT(o.order_id) / NULLIF(COUNT(DISTINCT o.customer_id), 0) AS orders_per_customer
                FROM APPUSER.ORDERS o
              columns_used:
                - orders.order_id
                - orders.customer_id
      
      - name: line_item_revenue
        business_name: Line Item Revenue
        description: >-
          Total revenue from order line items calculated as the sum of line totals. 
          Use this metric for product-level or SKU-level revenue analysis. This should equal 
          total order subtotal when aggregated across all orders.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    SUM(oi.line_total) AS line_item_revenue
                FROM APPUSER.ORDER_ITEMS oi
              columns_used:
                - order_items.line_total
      
      - name: units_sold
        business_name: Units Sold
        description: >-
          Total number of product units sold across all order line items.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    SUM(oi.quantity) AS units_sold
                FROM APPUSER.ORDER_ITEMS oi
              columns_used:
                - order_items.quantity
      
      - name: average_selling_price
        business_name: Average Selling Price
        description: >-
          Average price per unit sold calculated as total line item revenue divided by total units sold.
          Represents the weighted average selling price across all products and quantities.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    SUM(oi.line_total) / NULLIF(SUM(oi.quantity), 0) AS average_selling_price
                FROM APPUSER.ORDER_ITEMS oi
              columns_used:
                - order_items.line_total
                - order_items.quantity
      
      - name: average_discount_percentage
        business_name: Average Discount Percentage
        description: >-
          Average discount percentage applied across all order line items. Calculated as the 
          simple average of discount_pct values.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    AVG(oi.discount_pct) AS average_discount_percentage
                FROM APPUSER.ORDER_ITEMS oi
              columns_used:
                - order_items.discount_pct
      
      - name: gross_profit
        business_name: Gross Profit
        description: >-
          Total gross profit calculated as the sum of (quantity * (unit_price - cost_price)) 
          across all order line items. Represents profit before operating expenses. Requires 
          joining order_items to products to access cost_price.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    SUM(oi.quantity * (oi.unit_price - p.cost_price)) AS gross_profit
                FROM APPUSER.ORDER_ITEMS oi
                INNER JOIN APPUSER.PRODUCTS p ON oi.product_id = p.product_id
              columns_used:
                - order_items.quantity
                - order_items.unit_price
                - products.cost_price
      
      - name: gross_margin_percentage
        business_name: Gross Margin Percentage
        description: >-
          Gross profit as a percentage of line item revenue. Calculated as 
          (gross profit / line item revenue) * 100. Measures profitability efficiency.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    CASE
                        WHEN SUM(oi.line_total) = 0 THEN 0
                        ELSE (SUM(oi.quantity * (oi.unit_price - p.cost_price)) / 
                              NULLIF(SUM(oi.line_total), 0)) * 100
                    END AS gross_margin_percentage
                FROM APPUSER.ORDER_ITEMS oi
                INNER JOIN APPUSER.PRODUCTS p ON oi.product_id = p.product_id
              columns_used:
                - order_items.quantity
                - order_items.unit_price
                - order_items.line_total
                - products.cost_price
      
      - name: product_count
        business_name: Product Count
        description: >-
          Total number of unique products in the catalog.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    COUNT(p.product_id) AS product_count
                FROM APPUSER.PRODUCTS p
              columns_used:
                - products.product_id
      
      - name: active_product_count
        business_name: Active Product Count
        description: >-
          Total number of products with active status. Filters for products where is_active is true.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    COUNT(p.product_id) AS active_product_count
                FROM APPUSER.PRODUCTS p
                WHERE p.is_active = 1
              columns_used:
                - products.product_id
                - products.is_active
      
      - name: total_inventory_value
        business_name: Total Inventory Value
        description: >-
          Total value of current inventory calculated as sum of (stock_quantity * cost_price) 
          across all products. Represents the total cost value of on-hand inventory.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    SUM(p.stock_quantity * p.cost_price) AS total_inventory_value
                FROM APPUSER.PRODUCTS p
              columns_used:
                - products.stock_quantity
                - products.cost_price
      
      - name: total_payment_amount
        business_name: Total Payment Amount
        description: >-
          Total amount of all payment transactions. Sum of payment amounts across all payments.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    SUM(pm.amount) AS total_payment_amount
                FROM APPUSER.PAYMENTS pm
              columns_used:
                - payments.amount
      
      - name: payment_count
        business_name: Payment Count
        description: >-
          Total number of payment transactions.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    COUNT(pm.payment_id) AS payment_count
                FROM APPUSER.PAYMENTS pm
              columns_used:
                - payments.payment_id
      
      - name: shipment_count
        business_name: Shipment Count
        description: >-
          Total number of shipments.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    COUNT(s.shipment_id) AS shipment_count
                FROM APPUSER.SHIPMENTS s
              columns_used:
                - shipments.shipment_id
      
      - name: delivered_shipment_count
        business_name: Delivered Shipment Count
        description: >-
          Total number of shipments that have been delivered. Filters for shipments where 
          delivered_at is not null.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    COUNT(s.shipment_id) AS delivered_shipment_count
                FROM APPUSER.SHIPMENTS s
                WHERE s.delivered_at IS NOT NULL
              columns_used:
                - shipments.shipment_id
                - shipments.delivered_at
      
      - name: average_delivery_days
        business_name: Average Delivery Days
        description: >-
          Average number of days between shipment dispatch and delivery. Calculated as the 
          average of (delivered_at - shipped_at) for delivered shipments. Measures fulfillment speed.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    AVG(s.delivered_at - s.shipped_at) AS average_delivery_days
                FROM APPUSER.SHIPMENTS s
                WHERE s.delivered_at IS NOT NULL
                  AND s.shipped_at IS NOT NULL
              columns_used:
                - shipments.delivered_at
                - shipments.shipped_at
      
      - name: revenue_by_customer
        business_name: Revenue by Customer
        description: >-
          Total revenue grouped by customer. One row per customer showing their total order value.
        return_type: currency_usd
        result_grain: one row per customer
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    o.customer_id,
                    c.first_name,
                    c.last_name,
                    SUM(o.total_amount) AS revenue
                FROM APPUSER.ORDERS o
                INNER JOIN APPUSER.CUSTOMERS c ON o.customer_id = c.customer_id
                GROUP BY o.customer_id, c.first_name, c.last_name
              columns_used:
                - orders.customer_id
                - orders.total_amount
                - customers.first_name
                - customers.last_name
      
      - name: revenue_by_product
        business_name: Revenue by Product
        description: >-
          Total revenue grouped by product. One row per product showing total line item revenue.
          Uses order_items.line_total for product-level revenue calculation.
        return_type: currency_usd
        result_grain: one row per product
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    oi.product_id,
                    p.product_name,
                    p.sku,
                    SUM(oi.line_total) AS revenue
                FROM APPUSER.ORDER_ITEMS oi
                INNER JOIN APPUSER.PRODUCTS p ON oi.product_id = p.product_id
                GROUP BY oi.product_id, p.product_name, p.sku
              columns_used:
                - order_items.product_id
                - order_items.line_total
                - products.product_name
                - products.sku
      
      - name: revenue_by_category
        business_name: Revenue by Category
        description: >-
          Total revenue grouped by product category. One row per category showing total line item 
          revenue for products in that category. Requires joining order_items to products to categories.
        return_type: currency_usd
        result_grain: one row per category
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    pc.category_id,
                    pc.category_name,
                    SUM(oi.line_total) AS revenue
                FROM APPUSER.ORDER_ITEMS oi
                INNER JOIN APPUSER.PRODUCTS p ON oi.product_id = p.product_id
                INNER JOIN APPUSER.PRODUCT_CATEGORIES pc ON p.category_id = pc.category_id
                GROUP BY pc.category_id, pc.category_name
              columns_used:
                - order_items.line_total
                - products.category_id
                - product_categories.category_id
                - product_categories.category_name
      
      - name: revenue_by_month
        business_name: Revenue by Month
        description: >-
          Total revenue grouped by month. One row per month showing total order revenue for that month.
          Uses TRUNC function to extract month from order_date.
        return_type: currency_usd
        result_grain: one row per month
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    TRUNC(o.order_date, 'MM') AS order_month,
                    SUM(o.total_amount) AS revenue
                FROM APPUSER.ORDERS o
                GROUP BY TRUNC(o.order_date, 'MM')
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.total_amount
      
      - name: revenue_by_sales_channel
        business_name: Revenue by Sales Channel
        description: >-
          Total revenue grouped by sales channel. One row per channel showing total order revenue.
        return_type: currency_usd
        result_grain: one row per sales channel
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    o.sales_channel,
                    SUM(o.total_amount) AS revenue
                FROM APPUSER.ORDERS o
                GROUP BY o.sales_channel
              columns_used:
                - orders.sales_channel
                - orders.total_amount
      
      - name: revenue_by_customer_segment
        business_name: Revenue by Customer Segment
        description: >-
          Total revenue grouped by customer segment. One row per segment showing total order revenue 
          from customers in that segment. Requires joining orders to customers.
        return_type: currency_usd
        result_grain: one row per customer segment
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    c.customer_segment,
                    SUM(o.total_amount) AS revenue
                FROM APPUSER.ORDERS o
                INNER JOIN APPUSER.CUSTOMERS c ON o.customer_id = c.customer_id
                GROUP BY c.customer_segment
              columns_used:
                - orders.total_amount
                - customers.customer_segment
