version: "1.0"

semantic_model:
  - name: food_delivery_semantic_model
    description: >-
      Comprehensive semantic model for food delivery operations covering customers, restaurants, 
      orders, deliveries, payments, promotions, reviews, and support. This model enables analytical 
      queries across the complete food delivery lifecycle including order fulfillment, agent performance, 
      restaurant operations, customer behavior, and financial metrics.
    
    ai_context:
      instructions: >-
        ## Dataset Grain Guide
        
        - **customers**: One row per customer. Use for customer-level analysis.
        - **customer_addresses**: One row per customer address. Multiple addresses per customer possible.
        - **restaurants**: One row per restaurant. Use for restaurant-level analysis.
        - **restaurant_categories**: One row per category. Use for category-level analysis.
        - **restaurant_category_map**: One row per restaurant-category assignment. Many-to-many mapping.
        - **menu_sections**: One row per menu section within a restaurant.
        - **menu_items**: One row per menu item. Use for item-level analysis.
        - **orders**: One row per order. Primary transactional grain for order analysis.
        - **order_items**: One row per item within an order. Use for item-level order analysis.
        - **order_promotions**: One row per promotion applied to an order.
        - **promotions**: One row per promotion definition.
        - **deliveries**: One row per delivery. Use for delivery performance analysis.
        - **delivery_agents**: One row per delivery agent. Use for agent-level analysis.
        - **agent_payouts**: One row per agent payout for a delivery.
        - **payments**: One row per payment transaction for an order.
        - **reviews**: One row per review. Can review food, delivery, and overall experience.
        - **support_tickets**: One row per support ticket raised by a customer.
        - **operating_hours**: One row per restaurant per day of week.
        
        ## Metric Selection Guide
        
        ### Order-Level Revenue
        Use `orders.total_amount` for order-level revenue analysis. This includes subtotal, delivery fee, tax, and tip.
        Use `orders.subtotal` for product revenue before fees and taxes.
        
        ### Item-Level Revenue
        Use `order_items.line_total` for item-level revenue analysis when analyzing by product or menu item.
        
        ### Agent Compensation
        Use `agent_payouts.total_payout` for agent compensation analysis.
        Use `agent_payouts.base_pay`, `agent_payouts.distance_bonus`, and `agent_payouts.tip_amount` for detailed payout breakdown.
        
        ### Delivery Performance
        Use `deliveries.actual_time_min` for actual delivery time.
        Use `deliveries.estimated_time_min` for estimated delivery time.
        Compare these to calculate delivery accuracy and delays.
        
        ## Join Guidance
        
        ### Customer to Orders
        Join `customers.customer_id = orders.customer_id` (one-to-many).
        
        ### Orders to Order Items
        Join `orders.order_id = order_items.order_id` (one-to-many).
        **IMPORTANT**: Do not sum `orders.total_amount` after joining to `order_items` as this will duplicate order-level totals.
        Use `order_items.line_total` for item-level analysis.
        
        ### Orders to Deliveries
        Join `orders.order_id = deliveries.order_id` (one-to-one typically, but model as one-to-many for flexibility).
        
        ### Deliveries to Delivery Agents
        Join `deliveries.agent_id = delivery_agents.agent_id` (many-to-one).
        
        ### Deliveries to Agent Payouts
        Join `deliveries.delivery_id = agent_payouts.delivery_id` (one-to-one typically).
        
        ### Orders to Restaurants
        Join `orders.restaurant_id = restaurants.restaurant_id` (many-to-one).
        
        ### Menu Items to Restaurants
        Join `menu_items.restaurant_id = restaurants.restaurant_id` (many-to-one).
        
        ### Menu Items to Menu Sections
        Join `menu_items.section_id = menu_sections.section_id` (many-to-one).
        
        ### Order Items to Menu Items
        Join `order_items.item_id = menu_items.item_id` (many-to-one).
        
        ### Restaurants to Categories (Many-to-Many)
        Join `restaurants.restaurant_id = restaurant_category_map.restaurant_id`
        then `restaurant_category_map.category_id = restaurant_categories.category_id`.
        
        ### Orders to Promotions (Many-to-Many)
        Join `orders.order_id = order_promotions.order_id`
        then `order_promotions.promotion_id = promotions.promotion_id`.
        
        ### Orders to Payments
        Join `orders.order_id = payments.order_id` (one-to-many, though typically one-to-one).
        
        ### Orders to Reviews
        Join `orders.order_id = reviews.order_id` (one-to-one typically).
        
        ### Customer Addresses to Customers
        Join `customer_addresses.customer_id = customers.customer_id` (many-to-one).
        
        ### Support Tickets to Orders
        Join `support_tickets.order_id = orders.order_id` (many-to-one).
        
        ### Support Tickets to Customers
        Join `support_tickets.customer_id = customers.customer_id` (many-to-one).
        
        ## Double-Counting Prevention
        
        ### Orders to Order Items
        When joining `orders` to `order_items`, do NOT sum order-level fields like `orders.total_amount`, 
        `orders.subtotal`, `orders.delivery_fee`, `orders.tax`, or `orders.tip` as these will be multiplied 
        by the number of items in each order.
        
        For order-level metrics, query `orders` directly.
        For item-level metrics, use `order_items.line_total` or `order_items.quantity`.
        
        ### Restaurants to Restaurant Categories
        When analyzing restaurant metrics by category through the many-to-many relationship, be aware that 
        restaurants can belong to multiple categories. Aggregating restaurant-level metrics after joining 
        through `restaurant_category_map` may duplicate restaurant totals if a restaurant has multiple categories.
        
        Use DISTINCT or appropriate grouping to avoid duplication.
        
        ### Orders to Promotions
        When analyzing order metrics with promotions, note that multiple promotions can be applied to a single order.
        Summing order totals after joining to `order_promotions` may duplicate order amounts.
        
        ## Time Analysis
        
        ### Order Analysis
        Use `orders.ordered_at` for order placement time analysis.
        Use `orders.delivered_at` for delivery completion time analysis.
        Use `orders.cancelled_at` for cancellation time analysis (when applicable).
        
        ### Delivery Analysis
        Use `deliveries.pickup_time` for pickup time analysis.
        Use `deliveries.delivered_time` for delivery completion time analysis.
        
        ### Agent Payout Analysis
        Use `agent_payouts.payout_date` for payout time analysis.
        
        ### Payment Analysis
        Use `payments.processed_at` for payment processing time analysis.
        
        ### Review Analysis
        Use `reviews.reviewed_at` for review submission time analysis.
        
        ### Support Ticket Analysis
        Use `support_tickets.created_at` for ticket creation time analysis.
        Use `support_tickets.resolved_at` for ticket resolution time analysis.
        
        ### Customer Registration
        Use `customers.registered_at` for customer registration time analysis.
        
        ### Restaurant Onboarding
        Use `restaurants.created_at` for restaurant onboarding time analysis.
        
        ### Agent Onboarding
        Use `delivery_agents.joined_at` for agent onboarding time analysis.
        
        ## Query Restrictions
        
        ### PII Fields
        Many fields are marked as PII including customer names, addresses, emails, phone numbers, 
        payment details, and financial amounts. Ensure appropriate access controls and data masking 
        are applied when querying these fields.
        
        ### Cancelled Orders
        When analyzing order metrics, consider filtering by `orders.order_status` to exclude cancelled orders 
        unless cancellation analysis is the goal. Check `orders.cancelled_at IS NULL` or 
        `orders.order_status != 'Cancelled'`.
        
        ### Active Entities
        Filter by `is_active = true` when analyzing current customers, restaurants, agents, or promotions 
        unless historical analysis is required.
        
        ### Date Ranges
        Always apply appropriate date filters when analyzing time-series metrics to ensure query performance 
        and relevance.
    
    datasets:
      - name: customers
        business_name: Customers
        description: >-
          Contains customer master data. One row per customer. Includes customer profile information, 
          contact details, registration date, and account status. Use for customer-level analysis and 
          customer segmentation.
        source: food_delivery.customers
        primary_key:
          - customer_id
        fields:
          - name: customer_id
            business_name: Customer Identifier
            description: Unique identifier for a customer.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - PRIMARY KEY
          
          - name: first_name
            business_name: First Name
            description: Given name of the customer.
            sql_type: STRING(255)
            constraints:
              - PII
          
          - name: last_name
            business_name: Last Name
            description: Family name of the customer.
            sql_type: STRING(255)
            constraints:
              - PII
          
          - name: email
            business_name: Email
            description: Email address used to contact or authenticate the customer.
            sql_type: STRING(255)
            constraints:
              - PII
          
          - name: phone
            business_name: Phone
            description: Phone number used to contact the customer.
            sql_type: STRING(255)
            constraints:
              - PII
          
          - name: date_of_birth
            business_name: Date Of Birth
            description: Date of birth of the customer.
            sql_type: DATE
            constraints:
              - PII
          
          - name: registered_at
            business_name: Registered At
            description: Timestamp recording when the customer registered for the service.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: is_active
            business_name: Is Active
            description: Indicates whether the customer account is currently active.
            sql_type: BOOLEAN
            dimension:
              is_dimension: true
          
          - name: is_premium
            business_name: Is Premium
            description: Indicates whether the customer is enrolled in a premium program.
            sql_type: BOOLEAN
            dimension:
              is_dimension: true
          
          - name: preferred_language
            business_name: Preferred Language
            description: Language preference used for communications with the customer.
            sql_type: STRING(255)
            dimension:
              is_dimension: true
      
      - name: customer_addresses
        business_name: Customer Addresses
        description: >-
          Contains customer delivery addresses. One row per address. Multiple addresses can be associated 
          with a single customer. Includes address details, geographic coordinates, and default address indicator.
        source: food_delivery.customer_addresses
        primary_key:
          - address_id
        fields:
          - name: address_id
            business_name: Address Identifier
            description: Unique identifier for a customer address record.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - PRIMARY KEY
          
          - name: customer_id
            business_name: Customer Reference
            description: References the customer associated with the address.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: address_type
            business_name: Address Type
            description: Indicates the type of address, such as Home or Work.
            sql_type: STRING(255)
            dimension:
              is_dimension: true
          
          - name: street_address
            business_name: Street Address
            description: Street address where the customer receives deliveries.
            sql_type: STRING(255)
            constraints:
              - PII
          
          - name: apt_unit
            business_name: Apartment Unit
            description: Apartment, unit, or suite designation for the customer address.
            sql_type: STRING(255)
            constraints:
              - PII
          
          - name: city
            business_name: City
            description: City where the customer address is located.
            sql_type: STRING(255)
            dimension:
              is_dimension: true
          
          - name: state
            business_name: State
            description: State or region where the customer address is located.
            sql_type: STRING(255)
            dimension:
              is_dimension: true
          
          - name: zip_code
            business_name: Zip Code
            description: Postal or ZIP code for the customer address.
            sql_type: STRING(255)
            dimension:
              is_dimension: true
          
          - name: latitude
            business_name: Latitude
            description: Geographic latitude coordinate of the customer address.
            sql_type: DOUBLE
          
          - name: longitude
            business_name: Longitude
            description: Geographic longitude coordinate of the customer address.
            sql_type: DOUBLE
          
          - name: is_default
            business_name: Is Default
            description: Indicates whether this is the customer's default delivery address.
            sql_type: BOOLEAN
            dimension:
              is_dimension: true
      
      - name: restaurants
        business_name: Restaurants
        description: >-
          Contains restaurant master data. One row per restaurant. Includes restaurant profile, 
          contact information, location, ratings, delivery settings, and operational status. 
          Use for restaurant-level analysis and performance evaluation.
        source: food_delivery.restaurants
        primary_key:
          - restaurant_id
        fields:
          - name: restaurant_id
            business_name: Restaurant Identifier
            description: Unique identifier for a restaurant.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - PRIMARY KEY
          
          - name: name
            business_name: Name
            description: Display name of the restaurant.
            sql_type: STRING(255)
            dimension:
              is_dimension: true
          
          - name: description
            business_name: Description
            description: Text description of the restaurant and its offerings.
            sql_type: STRING(255)
          
          - name: phone
            business_name: Phone
            description: Contact phone number for the restaurant.
            sql_type: STRING(255)
            constraints:
              - PII
          
          - name: email
            business_name: Email
            description: Contact email address for the restaurant.
            sql_type: STRING(255)
            constraints:
              - PII
          
          - name: street_address
            business_name: Street Address
            description: Street address where the restaurant is located.
            sql_type: STRING(255)
            constraints:
              - PII
          
          - name: city
            business_name: City
            description: City where the restaurant operates.
            sql_type: STRING(255)
            dimension:
              is_dimension: true
          
          - name: state
            business_name: State
            description: State or region where the restaurant operates.
            sql_type: STRING(255)
            dimension:
              is_dimension: true
          
          - name: zip_code
            business_name: Zip Code
            description: Postal or ZIP code for the restaurant location.
            sql_type: STRING(255)
            dimension:
              is_dimension: true
          
          - name: latitude
            business_name: Latitude
            description: Geographic latitude coordinate of the restaurant location.
            sql_type: DOUBLE
          
          - name: longitude
            business_name: Longitude
            description: Geographic longitude coordinate of the restaurant location.
            sql_type: DOUBLE
          
          - name: avg_rating
            business_name: Average Rating
            description: Average rating the restaurant has received from customer reviews.
            sql_type: DOUBLE
            measure:
              aggregation: AVG
          
          - name: total_reviews
            business_name: Total Reviews
            description: Total number of reviews the restaurant has received.
            sql_type: BIGINT
            measure:
              aggregation: SUM
          
          - name: avg_delivery_time_min
            business_name: Average Delivery Time Minutes
            description: Average delivery time in minutes for orders fulfilled by the restaurant.
            sql_type: BIGINT
            measure:
              aggregation: AVG
          
          - name: min_order_amount
            business_name: Minimum Order Amount
            description: Minimum monetary order amount required by the restaurant.
            sql_type: DOUBLE
          
          - name: delivery_fee
            business_name: Delivery Fee
            description: Standard delivery fee charged by the restaurant.
            sql_type: DOUBLE
            measure:
              aggregation: AVG
          
          - name: is_active
            business_name: Is Active
            description: Indicates whether the restaurant is currently active on the platform.
            sql_type: BOOLEAN
            dimension:
              is_dimension: true
          
          - name: created_at
            business_name: Created At
            description: Timestamp recording when the restaurant record was created on the platform.
            sql_type: TIMESTAMP
            dimension:
              is_time: true
      
      - name: restaurant_categories
        business_name: Restaurant Categories
        description: >-
          Contains restaurant category definitions. One row per category. Categories classify 
          restaurants by cuisine type or food style (e.g., Italian, Fast Food, Asian).
        source: food_delivery.restaurant_categories
        primary_key:
          - category_id
        fields:
          - name: category_id
            business_name: Category Identifier
            description: Unique identifier for a restaurant category.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - PRIMARY KEY
          
          - name: category_name
            business_name: Category Name
            description: Name of the restaurant category, such as Italian or Fast Food.
            sql_type: STRING(255)
            dimension:
              is_dimension: true
          
          - name: description
            business_name: Description
            description: Text description of the restaurant category.
            sql_type: STRING(255)
      
      - name: restaurant_category_map
        business_name: Restaurant Category Map
        description: >-
          Contains many-to-many mapping between restaurants and categories. One row per 
          restaurant-category assignment. A restaurant can belong to multiple categories.
        source: food_delivery.restaurant_category_map
        primary_key:
          - mapping_id
        fields:
          - name: mapping_id
            business_name: Mapping Identifier
            description: Unique identifier for a restaurant-to-category mapping.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - PRIMARY KEY
          
          - name: restaurant_id
            business_name: Restaurant Reference
            description: References the restaurant being categorized.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: category_id
            business_name: Category Reference
            description: References the category assigned to the restaurant.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - FOREIGN KEY
      
      - name: menu_sections
        business_name: Menu Sections
        description: >-
          Contains menu section definitions for restaurants. One row per section per restaurant. 
          Sections organize menu items into groups like Appetizers, Entrees, Desserts.
        source: food_delivery.menu_sections
        primary_key:
          - section_id
        fields:
          - name: section_id
            business_name: Section Identifier
            description: Unique identifier for a menu section.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - PRIMARY KEY
          
          - name: restaurant_id
            business_name: Restaurant Reference
            description: References the restaurant to which the menu section belongs.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: name
            business_name: Name
            description: Display name of the menu section, such as Appetizers or Desserts.
            sql_type: STRING(255)
            dimension:
              is_dimension: true
          
          - name: display_order
            business_name: Display Order
            description: Numeric value indicating the order in which the section appears in the menu.
            sql_type: BIGINT
          
          - name: is_available
            business_name: Is Available
            description: Indicates whether the menu section is currently available.
            sql_type: BOOLEAN
            dimension:
              is_dimension: true
      
      - name: menu_items
        business_name: Menu Items
        description: >-
          Contains menu item master data. One row per menu item. Includes item details, pricing, 
          dietary attributes, nutritional information, and availability status. Use for item-level 
          analysis and menu optimization.
        source: food_delivery.menu_items
        primary_key:
          - item_id
        fields:
          - name: item_id
            business_name: Item Identifier
            description: Unique identifier for a menu item.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - PRIMARY KEY
          
          - name: section_id
            business_name: Section Reference
            description: References the menu section to which the item belongs.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: restaurant_id
            business_name: Restaurant Reference
            description: References the restaurant offering the menu item.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: name
            business_name: Name
            description: Display name of the menu item shown to customers.
            sql_type: STRING(255)
            dimension:
              is_dimension: true
          
          - name: description
            business_name: Description
            description: Text description of the menu item and its ingredients.
            sql_type: STRING(255)
          
          - name: price
            business_name: Price
            description: Monetary price of the menu item.
            sql_type: DOUBLE
            measure:
              aggregation: AVG
          
          - name: is_vegetarian
            business_name: Is Vegetarian
            description: Indicates whether the menu item is suitable for vegetarians.
            sql_type: BOOLEAN
            dimension:
              is_dimension: true
          
          - name: is_vegan
            business_name: Is Vegan
            description: Indicates whether the menu item is suitable for vegans.
            sql_type: BOOLEAN
            dimension:
              is_dimension: true
          
          - name: is_gluten_free
            business_name: Is Gluten Free
            description: Indicates whether the menu item is gluten free.
            sql_type: BOOLEAN
            dimension:
              is_dimension: true
          
          - name: spice_level
            business_name: Spice Level
            description: Indicates the spice level of the menu item, such as Mild or Spicy.
            sql_type: STRING(255)
            dimension:
              is_dimension: true
          
          - name: calories
            business_name: Calories
            description: Estimated number of calories contained in the menu item.
            sql_type: BIGINT
            measure:
              aggregation: AVG
          
          - name: is_available
            business_name: Is Available
            description: Indicates whether the menu item is currently available to order.
            sql_type: BOOLEAN
            dimension:
              is_dimension: true
          
          - name: is_popular
            business_name: Is Popular
            description: Indicates whether the menu item is marked as popular based on demand.
            sql_type: BOOLEAN
            dimension:
              is_dimension: true
      
      - name: orders
        business_name: Orders
        description: >-
          Contains order transaction data. One row per order. This is the primary transactional 
          grain for order analysis. Includes order status, financial totals, payment method, 
          timestamps, and channel information. Use for order-level revenue and operational analysis.
        source: food_delivery.orders
        primary_key:
          - order_id
        fields:
          - name: order_id
            business_name: Order Identifier
            description: Unique identifier for a customer order.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - PRIMARY KEY
          
          - name: customer_id
            business_name: Customer Reference
            description: References the customer who placed the order.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: restaurant_id
            business_name: Restaurant Reference
            description: References the restaurant fulfilling the order.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: order_status
            business_name: Order Status
            description: Indicates the current status of the order, such as Placed, Delivered, or Cancelled.
            sql_type: STRING(255)
            dimension:
              is_dimension: true
          
          - name: subtotal
            business_name: Subtotal
            description: Monetary subtotal of the order before fees, taxes, and tips.
            sql_type: DOUBLE
            measure:
              aggregation: SUM
          
          - name: delivery_fee
            business_name: Delivery Fee
            description: Monetary fee charged for delivery.
            sql_type: DOUBLE
            measure:
              aggregation: SUM
          
          - name: tax
            business_name: Tax
            description: Monetary amount of tax applied to the order.
            sql_type: DOUBLE
            constraints:
              - PII
            measure:
              aggregation: SUM
          
          - name: tip
            business_name: Tip
            description: Monetary amount of tip provided by the customer.
            sql_type: DOUBLE
            constraints:
              - PII
            measure:
              aggregation: SUM
          
          - name: total_amount
            business_name: Total Amount
            description: Total monetary amount charged for the order including all fees, taxes, and tips.
            sql_type: DOUBLE
            constraints:
              - PII
            measure:
              aggregation: SUM
          
          - name: payment_method
            business_name: Payment Method
            description: Payment method used for the order, such as Credit Card or Digital Wallet.
            sql_type: STRING(255)
            constraints:
              - PII
            dimension:
              is_dimension: true
          
          - name: ordered_at
            business_name: Ordered At
            description: Timestamp recording when the order was placed.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: estimated_delivery_at
            business_name: Estimated Delivery At
            description: Timestamp indicating the estimated delivery time communicated to the customer.
            sql_type: TIMESTAMP
            dimension:
              is_time: true
          
          - name: delivered_at
            business_name: Delivered At
            description: Timestamp recording when the order was actually delivered.
            sql_type: TIMESTAMP
            dimension:
              is_time: true
          
          - name: cancelled_at
            business_name: Cancelled At
            description: Timestamp recording when the order was cancelled, if applicable.
            sql_type: TIMESTAMP
            dimension:
              is_time: true
          
          - name: cancellation_reason
            business_name: Cancellation Reason
            description: Text describing the reason the order was cancelled.
            sql_type: STRING(255)
            dimension:
              is_dimension: true
          
          - name: is_scheduled
            business_name: Is Scheduled
            description: Indicates whether the order was scheduled for a future time.
            sql_type: BOOLEAN
            dimension:
              is_dimension: true
          
          - name: channel
            business_name: Channel
            description: Order channel used, such as Mobile App, Web, or Partner Platform.
            sql_type: STRING(255)
            dimension:
              is_dimension: true
      
      - name: order_items
        business_name: Order Items
        description: >-
          Contains order line item details. One row per item within an order. Multiple items 
          can belong to a single order. Includes item identification, quantity, pricing, and 
          special instructions. Use for item-level order analysis and product performance.
        source: food_delivery.order_items
        primary_key:
          - order_item_id
        fields:
          - name: order_item_id
            business_name: Order Item Identifier
            description: Unique identifier for an item within a customer order.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - PRIMARY KEY
          
          - name: order_id
            business_name: Order Reference
            description: References the order that the item belongs to.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: item_id
            business_name: Item Reference
            description: References the menu item included in the order.
            sql_type: BIGINT
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: item_name
            business_name: Item Name
