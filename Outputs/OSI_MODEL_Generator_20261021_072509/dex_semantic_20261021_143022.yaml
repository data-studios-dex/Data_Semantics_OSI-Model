    relationships:
      - name: customers_to_orders
        left_dataset: customers
        right_dataset: orders
        relationship_type: one_to_many
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: left
        resolution: >-
          One customer can place multiple orders. Join customers to orders to analyze 
          customer ordering behavior, customer lifetime value, and order frequency.
      
      - name: customers_to_customer_addresses
        left_dataset: customers
        right_dataset: customer_addresses
        relationship_type: one_to_many
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: left
        resolution: >-
          One customer can have multiple delivery addresses. Join customers to customer_addresses 
          to analyze delivery locations and address preferences.
      
      - name: customers_to_reviews
        left_dataset: customers
        right_dataset: reviews
        relationship_type: one_to_many
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: left
        resolution: >-
          One customer can submit multiple reviews. Join customers to reviews to analyze 
          customer satisfaction and feedback patterns.
      
      - name: customers_to_support_tickets
        left_dataset: customers
        right_dataset: support_tickets
        relationship_type: one_to_many
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: left
        resolution: >-
          One customer can raise multiple support tickets. Join customers to support_tickets 
          to analyze customer service issues and support needs.
      
      - name: restaurants_to_orders
        left_dataset: restaurants
        right_dataset: orders
        relationship_type: one_to_many
        join:
          left:
            - restaurant_id
          right:
            - restaurant_id
        join_type: left
        resolution: >-
          One restaurant can fulfill multiple orders. Join restaurants to orders to analyze 
          restaurant order volume, revenue, and operational performance.
      
      - name: restaurants_to_menu_sections
        left_dataset: restaurants
        right_dataset: menu_sections
        relationship_type: one_to_many
        join:
          left:
            - restaurant_id
          right:
            - restaurant_id
        join_type: left
        resolution: >-
          One restaurant can have multiple menu sections. Join restaurants to menu_sections 
          to analyze menu structure and organization.
      
      - name: restaurants_to_menu_items
        left_dataset: restaurants
        right_dataset: menu_items
        relationship_type: one_to_many
        join:
          left:
            - restaurant_id
          right:
            - restaurant_id
        join_type: left
        resolution: >-
          One restaurant can offer multiple menu items. Join restaurants to menu_items 
          to analyze menu offerings and item availability.
      
      - name: restaurants_to_reviews
        left_dataset: restaurants
        right_dataset: reviews
        relationship_type: one_to_many
        join:
          left:
            - restaurant_id
          right:
            - restaurant_id
        join_type: left
        resolution: >-
          One restaurant can receive multiple reviews. Join restaurants to reviews to analyze 
          restaurant ratings and customer feedback.
      
      - name: restaurants_to_operating_hours
        left_dataset: restaurants
        right_dataset: operating_hours
        relationship_type: one_to_many
        join:
          left:
            - restaurant_id
          right:
            - restaurant_id
        join_type: left
        resolution: >-
          One restaurant has multiple operating hour records (one per day of week). 
          Join restaurants to operating_hours to analyze restaurant availability and operating schedules.
      
      - name: restaurants_to_restaurant_category_map
        left_dataset: restaurants
        right_dataset: restaurant_category_map
        relationship_type: one_to_many
        join:
          left:
            - restaurant_id
          right:
            - restaurant_id
        join_type: left
        resolution: >-
          One restaurant can belong to multiple categories through the mapping table. 
          Join restaurants to restaurant_category_map to analyze restaurant categorization.
      
      - name: restaurant_categories_to_restaurant_category_map
        left_dataset: restaurant_categories
        right_dataset: restaurant_category_map
        relationship_type: one_to_many
        join:
          left:
            - category_id
          right:
            - category_id
        join_type: left
        resolution: >-
          One category can be assigned to multiple restaurants through the mapping table. 
          Join restaurant_categories to restaurant_category_map to analyze category assignments.
      
      - name: menu_sections_to_menu_items
        left_dataset: menu_sections
        right_dataset: menu_items
        relationship_type: one_to_many
        join:
          left:
            - section_id
          right:
            - section_id
        join_type: left
        resolution: >-
          One menu section can contain multiple menu items. Join menu_sections to menu_items 
          to analyze menu organization and item grouping.
      
      - name: orders_to_order_items
        left_dataset: orders
        right_dataset: order_items
        relationship_type: one_to_many
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: left
        resolution: >-
          One order can contain multiple order items. Join orders to order_items to analyze 
          item-level order details. IMPORTANT: Do not sum order-level fields like total_amount, 
          subtotal, delivery_fee, tax, or tip after this join as they will be duplicated by 
          the number of items in each order.
      
      - name: orders_to_deliveries
        left_dataset: orders
        right_dataset: deliveries
        relationship_type: one_to_many
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: left
        resolution: >-
          One order typically has one delivery, but modeled as one-to-many for flexibility. 
          Join orders to deliveries to analyze delivery performance and fulfillment.
      
      - name: orders_to_payments
        left_dataset: orders
        right_dataset: payments
        relationship_type: one_to_many
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: left
        resolution: >-
          One order can have multiple payment transactions (though typically one). 
          Join orders to payments to analyze payment processing and reconciliation.
      
      - name: orders_to_reviews
        left_dataset: orders
        right_dataset: reviews
        relationship_type: one_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: left
        resolution: >-
          One order typically has one review (if reviewed). Join orders to reviews to analyze 
          order satisfaction and feedback.
      
      - name: orders_to_support_tickets
        left_dataset: orders
        right_dataset: support_tickets
        relationship_type: one_to_many
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: left
        resolution: >-
          One order can have multiple support tickets. Join orders to support_tickets to analyze 
          order-related issues and support needs.
      
      - name: orders_to_order_promotions
        left_dataset: orders
        right_dataset: order_promotions
        relationship_type: one_to_many
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: left
        resolution: >-
          One order can have multiple promotions applied. Join orders to order_promotions to analyze 
          promotion usage and discount impact. Be careful when aggregating order totals after this join 
          as multiple promotions per order can cause duplication.
      
      - name: menu_items_to_order_items
        left_dataset: menu_items
        right_dataset: order_items
        relationship_type: one_to_many
        join:
          left:
            - item_id
          right:
            - item_id
        join_type: left
        resolution: >-
          One menu item can appear in multiple order items. Join menu_items to order_items to analyze 
          menu item popularity and sales performance.
      
      - name: promotions_to_order_promotions
        left_dataset: promotions
        right_dataset: order_promotions
        relationship_type: one_to_many
        join:
          left:
            - promotion_id
          right:
            - promotion_id
        join_type: left
        resolution: >-
          One promotion can be applied to multiple orders. Join promotions to order_promotions to analyze 
          promotion effectiveness and usage patterns.
      
      - name: delivery_agents_to_deliveries
        left_dataset: delivery_agents
        right_dataset: deliveries
        relationship_type: one_to_many
        join:
          left:
            - agent_id
          right:
            - agent_id
        join_type: left
        resolution: >-
          One delivery agent can handle multiple deliveries. Join delivery_agents to deliveries to analyze 
          agent performance and delivery volume.
      
      - name: delivery_agents_to_agent_payouts
        left_dataset: delivery_agents
        right_dataset: agent_payouts
        relationship_type: one_to_many
        join:
          left:
            - agent_id
          right:
            - agent_id
        join_type: left
        resolution: >-
          One delivery agent can receive multiple payouts. Join delivery_agents to agent_payouts to analyze 
          agent compensation and earnings.
      
      - name: delivery_agents_to_reviews
        left_dataset: delivery_agents
        right_dataset: reviews
        relationship_type: one_to_many
        join:
          left:
            - agent_id
          right:
            - agent_id
        join_type: left
        resolution: >-
          One delivery agent can receive multiple reviews. Join delivery_agents to reviews to analyze 
          agent ratings and customer feedback.
      
      - name: deliveries_to_agent_payouts
        left_dataset: deliveries
        right_dataset: agent_payouts
        relationship_type: one_to_one
        join:
          left:
            - delivery_id
          right:
            - delivery_id
        join_type: left
        resolution: >-
          One delivery typically has one payout record. Join deliveries to agent_payouts to analyze 
          delivery compensation and payout details.
    
    metrics:
      - name: total_orders
        business_name: Total Orders
        description: >-
          Total count of orders placed. Use for order volume analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(orders.order_id) AS total_orders
                FROM food_delivery.orders AS orders
              columns_used:
                - orders.order_id
      
      - name: total_revenue
        business_name: Total Revenue
        description: >-
          Total revenue from all orders including subtotal, delivery fees, taxes, and tips. 
          Use for overall revenue analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.total_amount) AS total_revenue
                FROM food_delivery.orders AS orders
                WHERE orders.order_status != 'Cancelled'
              columns_used:
                - orders.total_amount
                - orders.order_status
      
      - name: total_subtotal_revenue
        business_name: Total Subtotal Revenue
        description: >-
          Total product revenue from orders before fees, taxes, and tips. 
          Use for product revenue analysis excluding service charges.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.subtotal) AS total_subtotal_revenue
                FROM food_delivery.orders AS orders
                WHERE orders.order_status != 'Cancelled'
              columns_used:
                - orders.subtotal
                - orders.order_status
      
      - name: total_delivery_fees
        business_name: Total Delivery Fees
        description: >-
          Total delivery fees collected from orders. Use for delivery fee revenue analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.delivery_fee) AS total_delivery_fees
                FROM food_delivery.orders AS orders
                WHERE orders.order_status != 'Cancelled'
              columns_used:
                - orders.delivery_fee
                - orders.order_status
      
      - name: total_tax
        business_name: Total Tax
        description: >-
          Total tax collected from orders. Use for tax revenue analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.tax) AS total_tax
                FROM food_delivery.orders AS orders
                WHERE orders.order_status != 'Cancelled'
              columns_used:
                - orders.tax
                - orders.order_status
      
      - name: total_tips
        business_name: Total Tips
        description: >-
          Total tips provided by customers. Use for tip revenue analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.tip) AS total_tips
                FROM food_delivery.orders AS orders
                WHERE orders.order_status != 'Cancelled'
              columns_used:
                - orders.tip
                - orders.order_status
      
      - name: average_order_value
        business_name: Average Order Value
        description: >-
          Average total amount per order including all fees, taxes, and tips. 
          Use for order value analysis and customer spending patterns.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(orders.total_amount) AS average_order_value
                FROM food_delivery.orders AS orders
                WHERE orders.order_status != 'Cancelled'
              columns_used:
                - orders.total_amount
                - orders.order_status
      
      - name: total_customers
        business_name: Total Customers
        description: >-
          Total count of unique customers. Use for customer base size analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT customers.customer_id) AS total_customers
                FROM food_delivery.customers AS customers
              columns_used:
                - customers.customer_id
      
      - name: active_customers
        business_name: Active Customers
        description: >-
          Count of customers with active accounts. Use for active customer base analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT customers.customer_id) AS active_customers
                FROM food_delivery.customers AS customers
                WHERE customers.is_active = true
              columns_used:
                - customers.customer_id
                - customers.is_active
      
      - name: premium_customers
        business_name: Premium Customers
        description: >-
          Count of customers enrolled in premium program. Use for premium membership analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT customers.customer_id) AS premium_customers
                FROM food_delivery.customers AS customers
                WHERE customers.is_premium = true
              columns_used:
                - customers.customer_id
                - customers.is_premium
      
      - name: orders_per_customer
        business_name: Orders Per Customer
        description: >-
          Average number of orders per customer. Use for customer engagement and 
          order frequency analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CAST(COUNT(orders.order_id) AS DOUBLE) / 
                  NULLIF(COUNT(DISTINCT orders.customer_id), 0) AS orders_per_customer
                FROM food_delivery.orders AS orders
                WHERE orders.order_status != 'Cancelled'
              columns_used:
                - orders.order_id
                - orders.customer_id
                - orders.order_status
      
      - name: revenue_per_customer
        business_name: Revenue Per Customer
        description: >-
          Average revenue per customer. Use for customer value analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.total_amount) / 
                  NULLIF(COUNT(DISTINCT orders.customer_id), 0) AS revenue_per_customer
                FROM food_delivery.orders AS orders
                WHERE orders.order_status != 'Cancelled'
              columns_used:
                - orders.total_amount
                - orders.customer_id
                - orders.order_status
      
      - name: total_restaurants
        business_name: Total Restaurants
        description: >-
          Total count of restaurants on the platform. Use for restaurant network size analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT restaurants.restaurant_id) AS total_restaurants
                FROM food_delivery.restaurants AS restaurants
              columns_used:
                - restaurants.restaurant_id
      
      - name: active_restaurants
        business_name: Active Restaurants
        description: >-
          Count of restaurants currently active on the platform. Use for active restaurant 
          network analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT restaurants.restaurant_id) AS active_restaurants
                FROM food_delivery.restaurants AS restaurants
                WHERE restaurants.is_active = true
              columns_used:
                - restaurants.restaurant_id
                - restaurants.is_active
      
      - name: average_restaurant_rating
        business_name: Average Restaurant Rating
        description: >-
          Average rating across all restaurants. Use for overall restaurant quality analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(restaurants.avg_rating) AS average_restaurant_rating
                FROM food_delivery.restaurants AS restaurants
                WHERE restaurants.is_active = true
              columns_used:
                - restaurants.avg_rating
                - restaurants.is_active
      
      - name: total_menu_items
        business_name: Total Menu Items
        description: >-
          Total count of menu items across all restaurants. Use for menu breadth analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT menu_items.item_id) AS total_menu_items
                FROM food_delivery.menu_items AS menu_items
              columns_used:
                - menu_items.item_id
      
      - name: available_menu_items
        business_name: Available Menu Items
        description: >-
          Count of menu items currently available for ordering. Use for available 
          menu inventory analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT menu_items.item_id) AS available_menu_items
                FROM food_delivery.menu_items AS menu_items
                WHERE menu_items.is_available = true
              columns_used:
                - menu_items.item_id
                - menu_items.is_available
      
      - name: total_order_items
        business_name: Total Order Items
        description: >-
          Total count of order line items. Use for item-level order volume analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(order_items.order_item_id) AS total_order_items
                FROM food_delivery.order_items AS order_items
              columns_used:
                - order_items.order_item_id
      
      - name: total_units_ordered
        business_name: Total Units Ordered
        description: >-
          Total quantity of items ordered across all orders. Use for unit volume analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.quantity) AS total_units_ordered
                FROM food_delivery.order_items AS order_items
              columns_used:
                - order_items.quantity
      
      - name: average_items_per_order
        business_name: Average Items Per Order
        description: >-
          Average number of distinct items per order. Use for order composition analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CAST(COUNT(order_items.order_item_id) AS DOUBLE) / 
                  NULLIF(COUNT(DISTINCT order_items.order_id), 0) AS average_items_per_order
                FROM food_delivery.order_items AS order_items
              columns_used:
                - order_items.order_item_id
                - order_items.order_id
      
      - name: average_units_per_order
        business_name: Average Units Per Order
        description: >-
          Average total quantity of items per order. Use for order size analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CAST(SUM(order_items.quantity) AS DOUBLE) / 
                  NULLIF(COUNT(DISTINCT order_items.order_id), 0) AS average_units_per_order
                FROM food_delivery.order_items AS order_items
              columns_used:
                - order_items.quantity
                - order_items.order_id
      
      - name: item_level_revenue
        business_name: Item Level Revenue
        description: >-
          Total revenue from order items. Use for item-level revenue analysis. 
          This should match order subtotal revenue when aggregated.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.line_total) AS item_level_revenue
                FROM food_delivery.order_items AS order_items
              columns_used:
                - order_items.line_total
      
      - name: average_item_price
        business_name: Average Item Price
        description: >-
          Average unit price across all order items. Use for pricing analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(order_items.unit_price) AS average_item_price
                FROM food_delivery.order_items AS order_items
              columns_used:
                - order_items.unit_price
      
      - name: total_deliveries
        business_name: Total Deliveries
        description: >-
          Total count of deliveries. Use for delivery volume analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(deliveries.delivery_id) AS total_deliveries
                FROM food_delivery.deliveries AS deliveries
              columns_used:
                - deliveries.delivery_id
      
      - name: completed_deliveries
        business_name: Completed Deliveries
        description: >-
          Count of deliveries with status Delivered. Use for completed delivery volume analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(deliveries.delivery_id) AS completed_deliveries
                FROM food_delivery.deliveries AS deliveries
                WHERE deliveries.delivery_status = 'Delivered'
              columns_used:
                - deliveries.delivery_id
                - deliveries.delivery_status
      
      - name: total_delivery_distance_km
        business_name: Total Delivery Distance Km
        description: >-
          Total distance traveled across all deliveries in kilometers. 
          Use for delivery distance analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(deliveries.distance_km) AS total_delivery_distance_km
                FROM food_delivery.deliveries AS deliveries
              columns_used:
                - deliveries.distance_km
      
      - name: average_delivery_distance_km
        business_name: Average Delivery Distance Km
        description: >-
          Average distance per delivery in kilometers. Use for delivery distance analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(deliveries.distance_km) AS average_delivery_distance_km
                FROM food_delivery.deliveries AS deliveries
              columns_used:
                - deliveries.distance_km
      
      - name: average_estimated_delivery_time_min
        business_name: Average Estimated Delivery Time Minutes
        description: >-
          Average estimated delivery time in minutes. Use for delivery time estimation analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(deliveries.estimated_time_min) AS average_estimated_delivery_time_min
                FROM food_delivery.deliveries AS deliveries
              columns_used:
                - deliveries.estimated_time_min
      
      - name: average_actual_delivery_time_min
        business_name: Average Actual Delivery Time Minutes
        description: >-
          Average actual delivery time in minutes. Use for delivery performance analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(deliveries.actual_time_min) AS average_actual_delivery_time_min
                FROM food_delivery.deliveries AS deliveries
                WHERE deliveries.delivery_status = 'Delivered'
              columns_used:
                - deliveries.actual_time_min
                - deliveries.delivery_status
      
      - name: delivery_time_variance_min
        business_name: Delivery Time Variance Minutes
        description: >-
          Average difference between actual and estimated delivery time in minutes. 
          Positive values indicate delays, negative values indicate early deliveries. 
          Use for delivery accuracy analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(deliveries.actual_time_min - deliveries.estimated_time_min) AS delivery_time_variance_min
                FROM food_delivery.deliveries AS deliveries
                WHERE deliveries.delivery_status = 'Delivered'
                  AND deliveries.actual_time_min IS NOT NULL
                  AND deliveries.estimated_time_min IS NOT NULL
              columns_used:
                - deliveries.actual_time_min
                - deliveries.estimated_time_min
                - deliveries.delivery_status
      
      - name: on_time_delivery_rate
        business_name: On Time Delivery Rate
        description: >-
          Percentage of deliveries completed within or before estimated time. 
          Use for delivery performance and SLA compliance analysis.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(deliveries.delivery_id) = 0 THEN 0
                    ELSE
                      (SUM(CASE 
                        WHEN deliveries.actual_time_min <= deliveries.estimated_time_min 
                        THEN 1 
                        ELSE 0 
                      END) * 100.0) / COUNT(deliveries.delivery_id)
                  END AS on_time_delivery_rate
                FROM food_delivery.deliveries AS deliveries
                WHERE deliveries.delivery_status = 'Delivered'
                  AND deliveries.actual_time_min IS NOT NULL
                  AND deliveries.estimated_time_min IS NOT NULL
              columns_used:
                - deliveries.delivery_id
                - deliveries.actual_time_min
                - deliveries.estimated_time_min
                - deliveries.delivery_status
      
      - name: total_delivery_agents
        business_name: Total Delivery Agents
        description: >-
          Total count of delivery agents on the platform. Use for agent network size analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT delivery_agents.agent_id) AS total_delivery_agents
                FROM food_delivery.delivery_agents AS delivery_agents
              columns_used:
                - delivery_agents.agent_id
      
      - name: active_delivery_agents
        business_name: Active Delivery Agents
        description: >-
          Count of delivery agents currently active on the platform. 
          Use for active agent network analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT delivery_agents.agent_id) AS active_delivery_agents
                FROM food_delivery.delivery_agents AS delivery_agents
                WHERE delivery_agents.is_active = true
              columns_used:
                - delivery_agents.agent_id
                - delivery_agents.is_active
      
      - name: average_agent_rating
        business_name: Average Agent Rating
        description: >-
          Average rating across all delivery agents. Use for overall agent quality analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(delivery_agents.avg_rating) AS average_agent_rating
                FROM food_delivery.delivery_agents AS delivery_agents
                WHERE delivery_agents.is_active = true
              columns_used:
                - delivery_agents.avg_rating
                - delivery_agents.is_active
      
      - name: deliveries_per_agent
        business_name: Deliveries Per Agent
        description: >-
          Average number of deliveries per agent. Use for agent productivity analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CAST(COUNT(deliveries.delivery_id) AS DOUBLE) / 
                  NULLIF(COUNT(DISTINCT deliveries.agent_id), 0) AS deliveries_per_agent
                FROM food_delivery.deliveries AS deliveries
              columns_used:
                - deliveries.delivery_id
                - deliveries.agent_id
      
      - name: total_agent_payouts
        business_name: Total Agent Payouts
        description: >-
          Total amount paid to delivery agents. Use for agent compensation analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(agent_payouts.total_payout) AS total_agent_payouts
                FROM food_delivery.agent_payouts AS agent_payouts
                WHERE agent_payouts.payout_status = 'Completed'
              columns_used:
                - agent_payouts.total_payout
                - agent_payouts.payout_status
      
      - name: total_base_pay
        business_name: Total Base Pay
        description: >-
          Total base pay paid to delivery agents. Use for base compensation analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(agent_payouts.base_pay) AS total_base_pay
                FROM food_delivery.agent_payouts AS agent_payouts
                WHERE agent_payouts.payout_status = 'Completed'
              columns_used:
                - agent_payouts.base_pay
                - agent_payouts.payout_status
      
      - name: total_distance_bonus
        business_name: Total Distance Bonus
        description: >-
          Total distance bonus paid to delivery agents. Use for distance incentive analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(agent_payouts.distance_bonus) AS total_distance_bonus
                FROM food_delivery.agent_payouts AS agent_payouts
                WHERE agent_payouts.payout_status = 'Completed'
              columns_used:
                - agent_payouts.distance_bonus
                - agent_payouts.payout_status
      
      - name: total_agent_tips
        business_name: Total Agent Tips
        description: >-
          Total tips received by delivery agents. Use for tip income analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(agent_payouts.tip_amount) AS total_agent_tips
                FROM food_delivery.agent_payouts AS agent_payouts
                WHERE agent_payouts.payout_status = 'Completed'
              columns_used:
                - agent_payouts.tip_amount
                - agent_payouts.payout_status
      
      - name: average_payout_per_delivery
        business_name: Average Payout Per Delivery
        description: >-
          Average total payout per delivery. Use for delivery compensation analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(agent_payouts.total_payout) AS average_payout_per_delivery
                FROM food_delivery.agent_payouts AS agent_payouts
                WHERE agent_payouts.payout_status = 'Completed'
              columns_used:
                - agent_payouts.total_payout
                - agent_payouts.payout_status
      
      - name: total_promotions
        business_name: Total Promotions
        description: >-
          Total count of promotion definitions. Use for promotion inventory analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT promotions.promotion_id) AS total_promotions
                FROM food_delivery.promotions AS promotions
              columns_used:
                - promotions.promotion_id
      
      - name: active_promotions
        business_name: Active Promotions
        description: >-
          Count of currently active promotions. Use for active promotion analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT promotions.promotion_id) AS active_promotions
                FROM food_delivery.promotions AS promotions
                WHERE promotions.is_active = true
              columns_used:
                - promotions.promotion_id
                - promotions.is_active
      
      - name: total_promotion_usage
        business_name: Total Promotion Usage
        description: >-
          Total number of times promotions have been used. Use for promotion usage analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(promotions.times_used) AS total_promotion_usage
                FROM food_delivery.promotions AS promotions
              columns_used:
                - promotions.times_used
      
      - name: total_discount_amount
        business_name: Total Discount Amount
        description: >-
          Total discount amount applied through promotions. Use for promotion cost analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_promotions.discount_amount) AS total_discount_amount
                FROM food_delivery.order_promotions AS order_promotions
              columns_used:
                - order_promotions.discount_amount
      
      - name: average_discount_per_order
        business_name: Average Discount Per Order
        description: >-
          Average discount amount per order that used a promotion. 
          Use for promotion impact analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(order_promotions.discount_amount) AS average_discount_per_order
                FROM food_delivery.order_promotions AS order_promotions
              columns_used:
                - order_promotions.discount_amount
      
      - name: orders_with_promotions
        business_name: Orders With Promotions
        description: >-
          Count of orders that had at least one promotion applied. 
          Use for promotion adoption analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT order_promotions.order_id) AS orders_with_promotions
                FROM food_delivery.order_promotions AS order_promotions
              columns_used:
                - order_promotions.order_id
      
      - name: promotion_usage_rate
        business_name: Promotion Usage Rate
        description: >-
          Percentage of orders that used a promotion. Use for promotion penetration analysis.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT orders.order_id) = 0 THEN 0
                    ELSE
                      (COUNT(DISTINCT order_promotions.order_id) * 100.0) / 
                      COUNT(DISTINCT orders.order_id)
                  END AS promotion_usage_rate
                FROM food_delivery.orders AS orders
                LEFT JOIN food_delivery.order_promotions AS order_promotions
                  ON orders.order_id = order_promotions.order_id
                WHERE orders.order_status != 'Cancelled'
              columns_used:
                - orders.order_id
                - orders.order_status
                - order_promotions.order_id
      
      - name: total_reviews
        business_name: Total Reviews
        description: >-
          Total count of customer reviews. Use for review volume analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(reviews.review_id) AS total_reviews
                FROM food_delivery.reviews AS reviews
              columns_used:
                - reviews.review_id
      
      - name: average_food_rating
        business_name: Average Food Rating
        description: >-
          Average food quality rating across all reviews. Use for food quality analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(reviews.food_rating) AS average_food_rating
                FROM food_delivery.reviews AS reviews
              columns_used:
                - reviews.food_rating
      
      - name: average_delivery_rating
        business_name: Average Delivery Rating
        description: >-
          Average delivery experience rating across all reviews. 
          Use for delivery quality analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(reviews.delivery_rating) AS average_delivery_rating
                FROM food_delivery.reviews AS reviews
              columns_used:
                - reviews.delivery_rating
      
      - name: average_overall_rating
        business_name: Average Overall Rating
        description: >-
          Average overall experience rating across all reviews. 
          Use for overall satisfaction analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(reviews.overall_rating) AS average_overall_rating
                FROM food_delivery.reviews AS reviews
              columns_used:
                - reviews.overall_rating
      
      - name: review_rate
        business_name: Review Rate
        description: >-
          Percentage of delivered orders that received a review. 
          Use for review engagement analysis.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT orders.order_id) = 0 THEN 0
                    ELSE
                      (COUNT(DISTINCT reviews.order_id) * 100.0) / 
                      COUNT(DISTINCT orders.order_id)
                  END AS review_rate
                FROM food_delivery.orders AS orders
                LEFT JOIN food_delivery.reviews AS reviews
                  ON orders.order_id = reviews.order_id
                WHERE orders.order_status = 'Delivered'
              columns_used:
                - orders.order_id
                - orders.order_status
                - reviews.order_id
      
      - name: total_support_tickets
        business_name: Total Support Tickets
        description: >-
          Total count of support tickets raised. Use for support volume analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(support_tickets.ticket_id) AS total_support_tickets
                FROM food_delivery.support_tickets AS support_tickets
              columns_used:
                - support_tickets.ticket_id
      
      - name: resolved_support_tickets
        business_name: Resolved Support Tickets
        description: >-
          Count of support tickets with status Resolved. Use for support resolution analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(support_tickets.ticket_id) AS resolved_support_tickets
                FROM food_delivery.support_tickets AS support_tickets
                WHERE support_tickets.status = 'Resolved'
              columns_used:
                - support_tickets.ticket_id
                - support_tickets.status
      
      - name: support_ticket_resolution_rate
        business_name: Support Ticket Resolution Rate
        description: >-
          Percentage of support tickets that have been resolved. 
          Use for support efficiency analysis.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(support_tickets.ticket_id) = 0 THEN 0
                    ELSE
                      (SUM(CASE 
                        WHEN support_tickets.status = 'Resolved' 
                        THEN 1 
                        ELSE 0 
                      END) * 100.0) / COUNT(support_tickets.ticket_id)
                  END AS support_ticket_resolution_rate
                FROM food_delivery.support_tickets AS support_tickets
              columns_used:
                - support_tickets.ticket_id
                - support_tickets.status
      
      - name: average_ticket_resolution_time_hours
        business_name: Average Ticket Resolution Time Hours
        description: >-
          Average time in hours to resolve support tickets. Use for support efficiency analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(
                    (UNIX_TIMESTAMP(support_tickets.resolved_at) - 
                     UNIX_TIMESTAMP(support_tickets.created_at)) / 3600.0
                  ) AS average_ticket_resolution_time_hours
                FROM food_delivery.support_tickets AS support_tickets
                WHERE support_tickets.status = 'Resolved'
                  AND support_tickets.resolved_at IS NOT NULL
                  AND support_tickets.created_at IS NOT NULL
              columns_used:
                - support_tickets.resolved_at
                - support_tickets.created_at
                - support_tickets.status
      
      - name: support_tickets_per_order
        business_name: Support Tickets Per Order
        description: >-
          Average number of support tickets per order. Use for order quality and 
          issue rate analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CAST(COUNT(support_tickets.ticket_id) AS DOUBLE) / 
                  NULLIF(COUNT(DISTINCT orders.order_id), 0) AS support_tickets_per_order
                FROM food_delivery.orders AS orders
                LEFT JOIN food_delivery.support_tickets AS support_tickets
                  ON orders.order_id = support_tickets.order_id
                WHERE orders.order_status != 'Cancelled'
              columns_used:
                - support_tickets.ticket_id
                - orders.order_id
                - orders.order_status
      
      - name: cancelled_orders
        business_name: Cancelled Orders
        description: >-
          Count of orders with status Cancelled. Use for cancellation analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(orders.order_id) AS cancelled_orders
                FROM food_delivery.orders AS orders
                WHERE orders.order_status = 'Cancelled'
              columns_used:
                - orders.order_id
                - orders.order_status
      
      - name: order_cancellation_rate
        business_name: Order Cancellation Rate
        description: >-
          Percentage of orders that were cancelled. Use for order fulfillment quality analysis.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(orders.order_id) = 0 THEN 0
                    ELSE
                      (SUM(CASE 
                        WHEN orders.order_status = 'Cancelled' 
                        THEN 1 
                        ELSE 0 
                      END) * 100.0) / COUNT(orders.order_id)
                  END AS order_cancellation_rate
                FROM food_delivery.orders AS orders
              columns_used:
                - orders.order_id
                - orders.order_status