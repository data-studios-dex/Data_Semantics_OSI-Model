version: 1.1

comment: |-
  Databricks Unity Catalog Metric View
  Generated from OSI Semantic Model: ecom_retail_semantic_model
  
  Spine Dataset: order_items (grain: one row per order line item)
  Catalog: dex-demo
  Schema: ecom_bronze
  
  Relationships Implemented (7):
  1. orders_to_customers: orders.customer_id = customers.customer_id
  2. order_items_to_orders: order_items.order_id = orders.order_id
  3. order_items_to_products: order_items.product_id = products.product_id
  4. products_to_product_categories: products.category_id = product_categories.category_id
  5. product_categories_hierarchy: product_categories.parent_category_id = parent_categories.category_id
  6. payments_to_orders: payments.order_id = orders.order_id
  7. shipments_to_orders: shipments.order_id = orders.order_id
  
  Grouped Metrics (measure + dimension pairings):
  - revenue_by_customer: total_line_item_revenue + customer_id
  - revenue_by_product: total_line_item_revenue + product_id
  - revenue_by_category: total_line_item_revenue + category_name
  - revenue_by_sales_channel: total_line_item_revenue + sales_channel
  - revenue_by_customer_segment: total_line_item_revenue + customer_segment
  - revenue_by_payment_method: total_payment_amount + payment_method
  - orders_by_status: order_count + order_status
  - shipments_by_status: shipment_count + shipment_status
  - payments_by_status: payment_transaction_count + payment_status
  - revenue_by_month: total_line_item_revenue + order_month
  - orders_by_month: order_count + order_month
  - customers_by_month: customer_count + order_month (counts only customers who ordered in that month)
  
  PII Mode: restricted
  Fields excluded: first_name, last_name, email, phone, date_of_birth, postal_code, ship_postal_code, transaction_ref, tracking_number
  Fields with PII restriction: gender, city, state, ship_city, ship_state
  
  DEDUP_MODE: off
  Order-level measures NOT REPRESENTED (require DEDUP_MODE on):
  - total_revenue (orders.total_amount)
  - total_subtotal_revenue (orders.subtotal)
  - total_discount_amount (orders.discount_amount)
  - total_tax_amount (orders.tax_amount)
  - total_shipping_fee (orders.shipping_fee)
  
  Product-grain measures NOT REPRESENTED (require product table as spine):
  - total_inventory_value
  - stock_quantity aggregations
  - average_cost_price
  - catalog_unit_price aggregations

source: '`dex-demo`.ecom_bronze.order_items'

joins:
  - name: orders
    source: '`dex-demo`.ecom_bronze.orders'
    "on": source.order_id = orders.order_id
    joins:
      - name: customers
        source: '`dex-demo`.ecom_bronze.customers'
        "on": orders.customer_id = customers.customer_id
        rely:
          at_most_one_match: true
      - name: payments
        source: '`dex-demo`.ecom_bronze.payments'
        "on": orders.order_id = payments.order_id
      - name: shipments
        source: '`dex-demo`.ecom_bronze.shipments'
        "on": orders.order_id = shipments.order_id
    rely:
      at_most_one_match: true
  - name: products
    source: '`dex-demo`.ecom_bronze.products'
    "on": source.product_id = products.product_id
    joins:
      - name: product_categories
        source: '`dex-demo`.ecom_bronze.product_categories'
        "on": products.category_id = product_categories.category_id
        joins:
          - name: parent_categories
            source: '`dex-demo`.ecom_bronze.product_categories'
            "on": product_categories.parent_category_id = parent_categories.category_id
            rely:
              at_most_one_match: true
        rely:
          at_most_one_match: true
    rely:
      at_most_one_match: true

dimensions:
  - name: order_item_id
    expr: source.order_item_id
    display_name: Order Item ID
    comment: Unique identifier for an order line item. Primary key for order_items.
    synonyms:
      - line item id
      - item id

  - name: order_id
    expr: source.order_id
    display_name: Order ID
    comment: References the related order record. Foreign key to orders.
    synonyms:
      - order identifier
      - order number

  - name: line_number
    expr: source.line_number
    display_name: Line Number
    comment: Sequential line number of the item within the order.
    synonyms:
      - line sequence
      - item sequence

  - name: product_id
    expr: source.product_id
    display_name: Product ID
    comment: References the related product record. Foreign key to products.
    synonyms:
      - product identifier

  - name: order_date
    expr: orders.order_date
    display_name: Order Date
    comment: Timestamp recording when the order was placed. Primary date dimension for sales and revenue analysis.
    synonyms:
      - order timestamp
      - purchase date
      - order time

  - name: order_month
    expr: DATE_TRUNC('MONTH', orders.order_date)
    display_name: Order Month
    comment: Derived dimension representing the month of the order date. Used for monthly time-series analysis.
    synonyms:
      - order period
      - sales month

  - name: order_status
    expr: orders.order_status
    display_name: Order Status
    comment: Current processing status of the order. Common values include Pending, Processing, Completed, Cancelled, Refunded.
    synonyms:
      - status
      - order state

  - name: sales_channel
    expr: orders.sales_channel
    display_name: Sales Channel
    comment: Channel through which the order was placed, such as Online, Mobile App, Marketplace, Partner.
    synonyms:
      - channel
      - sales source

  - name: order_ship_city
    expr: orders.ship_city
    display_name: Order Ship City
    comment: Destination city for shipping the order. PII - restrict access
    synonyms:
      - order destination city

  - name: order_ship_state
    expr: orders.ship_state
    display_name: Order Ship State
    comment: Destination state or province for shipping the order. PII - restrict access
    synonyms:
      - order destination state

  - name: order_currency
    expr: orders.currency
    display_name: Order Currency
    comment: Currency code used for the order amounts. All amounts in this model are in USD.
    synonyms:
      - currency code

  - name: customer_id
    expr: orders.customers.customer_id
    display_name: Customer ID
    comment: Unique identifier for a customer. Primary key for customers.
    synonyms:
      - customer identifier

  - name: customer_code
    expr: orders.customers.customer_code
    display_name: Customer Code
    comment: Business-assigned code used to identify the customer in source systems.
    synonyms:
      - customer reference

  - name: gender
    expr: orders.customers.gender
    display_name: Gender
    comment: Self-reported gender classification of the customer. Used for demographic analysis. PII - restrict access
    synonyms:
      - customer gender

  - name: customer_city
    expr: orders.customers.city
    display_name: Customer City
    comment: City of the customer's primary address. Used for geographic analysis. PII - restrict access
    synonyms:
      - city

  - name: state
    expr: orders.customers.state
    display_name: State
    comment: State or province of the customer's primary address. Used for regional segmentation. PII - restrict access
    synonyms:
      - customer state
      - province

  - name: country
    expr: orders.customers.country
    display_name: Country
    comment: Country of the customer's primary address. Used for international market analysis.
    synonyms:
      - customer country

  - name: customer_segment
    expr: orders.customers.customer_segment
    display_name: Customer Segment
    comment: Segment classification assigned to the customer. Examples include Premium, Standard, Budget, VIP.
    synonyms:
      - segment
      - customer tier

  - name: registration_date
    expr: orders.customers.registration_date
    display_name: Registration Date
    comment: Date when the customer registered on the platform. Used for customer acquisition analysis.
    synonyms:
      - signup date
      - join date

  - name: customer_registration_month
    expr: DATE_TRUNC('MONTH', orders.customers.registration_date)
    display_name: Customer Registration Month
    comment: Derived dimension representing the month of customer registration. Used for cohort analysis.
    synonyms:
      - signup month
      - registration period

  - name: is_active_customer
    expr: orders.customers.is_active
    display_name: Is Active Customer
    comment: Indicates whether the customer account is currently active.
    synonyms:
      - customer active
      - active status

  - name: payment_id
    expr: orders.payments.payment_id
    display_name: Payment ID
    comment: Unique identifier for a payment transaction. Primary key for payments.
    synonyms:
      - payment identifier
      - transaction id

  - name: payment_method
    expr: orders.payments.payment_method
    display_name: Payment Method
    comment: Method used to make the payment. Examples include Credit Card, Debit Card, PayPal, Apple Pay.
    synonyms:
      - payment type
      - payment channel

  - name: payment_status
    expr: orders.payments.payment_status
    display_name: Payment Status
    comment: Current processing status of the payment. Common values include Pending, Authorized, Captured, Failed, Refunded.
    synonyms:
      - payment state

  - name: payment_currency
    expr: orders.payments.currency
    display_name: Payment Currency
    comment: Currency code used for the payment amount. All amounts in this model are in USD.
    synonyms:
      - payment currency code

  - name: gateway
    expr: orders.payments.gateway
    display_name: Gateway
    comment: Name of the payment gateway or processor handling the transaction. Examples include Stripe, PayPal, Square.
    synonyms:
      - payment gateway
      - processor

  - name: paid_at
    expr: orders.payments.paid_at
    display_name: Paid At
    comment: Timestamp recording when the payment was completed. Used for payment timing analysis.
    synonyms:
      - payment date
      - payment time

  - name: paid_month
    expr: DATE_TRUNC('MONTH', orders.payments.paid_at)
    display_name: Paid Month
    comment: Derived dimension representing the month of payment completion. Used for cash flow analysis.
    synonyms:
      - payment month
      - payment period

  - name: shipment_id
    expr: orders.shipments.shipment_id
    display_name: Shipment ID
    comment: Unique identifier for a shipment. Primary key for shipments.
    synonyms:
      - shipment identifier

  - name: carrier
    expr: orders.shipments.carrier
    display_name: Carrier
    comment: Name of the shipping carrier responsible for delivering the order. Examples include UPS, FedEx, USPS, DHL.
    synonyms:
      - shipping carrier
      - delivery carrier

  - name: shipment_status
    expr: orders.shipments.shipment_status
    display_name: Shipment Status
    comment: Current status of the shipment. Common values include Pending, In Transit, Delivered, Returned, Lost.
    synonyms:
      - shipping status
      - delivery status

  - name: shipped_at
    expr: orders.shipments.shipped_at
    display_name: Shipped At
    comment: Timestamp recording when the order was shipped. Used for shipment timing analysis.
    synonyms:
      - ship date
      - dispatch time

  - name: shipped_month
    expr: DATE_TRUNC('MONTH', orders.shipments.shipped_at)
    display_name: Shipped Month
    comment: Derived dimension representing the month of shipment. Used for fulfillment analysis.
    synonyms:
      - ship month
      - dispatch period

  - name: delivered_at
    expr: orders.shipments.delivered_at
    display_name: Delivered At
    comment: Timestamp recording when the shipment was delivered to the customer. Used for delivery timing analysis.
    synonyms:
      - delivery date
      - delivery time

  - name: shipment_ship_city
    expr: orders.shipments.ship_city
    display_name: Shipment Ship City
    comment: Destination city for the shipment. PII - restrict access
    synonyms:
      - delivery city

  - name: shipment_ship_state
    expr: orders.shipments.ship_state
    display_name: Shipment Ship State
    comment: Destination state or province for the shipment. PII - restrict access
    synonyms:
      - delivery state

  - name: sku
    expr: products.sku
    display_name: SKU
    comment: Stock keeping unit code used to track the product in inventory and ordering.
    synonyms:
      - product sku
      - stock code

  - name: product_name
    expr: products.product_name
    display_name: Product Name
    comment: Name of the product as displayed to customers.
    synonyms:
      - product title
      - item name

  - name: category_id
    expr: products.category_id
    display_name: Category ID
    comment: References the category associated with the product. Foreign key to product_categories.
    synonyms:
      - category identifier

  - name: product_brand
    expr: products.brand
    display_name: Product Brand
    comment: Brand name under which the product is marketed. Used for brand performance analysis.
    synonyms:
      - brand
      - brand name

  - name: product_currency
    expr: products.currency
    display_name: Product Currency
    comment: Currency code used for product pricing. All amounts in this model are in USD.
    synonyms:
      - product currency code

  - name: is_active_product
    expr: products.is_active
    display_name: Is Active Product
    comment: Indicates whether the product is currently active and available for sale.
    synonyms:
      - product active
      - available

  - name: product_created_at
    expr: products.created_at
    display_name: Product Created At
    comment: Timestamp when the product record was first created in the system. Used for product lifecycle analysis.
    synonyms:
      - product creation date

  - name: category_name
    expr: products.product_categories.category_name
    display_name: Category Name
    comment: Name of the product category. Used for category identification and product organization.
    synonyms:
      - category
      - product category

  - name: parent_category_id
    expr: products.product_categories.parent_category_id
    display_name: Parent Category ID
    comment: References the parent category in the category hierarchy. NULL indicates a top-level category.
    synonyms:
      - parent category identifier

  - name: is_active_category
    expr: products.product_categories.is_active
    display_name: Is Active Category
    comment: Indicates whether the product category is currently active.
    synonyms:
      - category active

  - name: parent_category_name
    expr: products.product_categories.parent_categories.category_name
    display_name: Parent Category Name
    comment: Name of the parent category in the category hierarchy. Used for hierarchical category analysis.
    synonyms:
      - parent category

measures:
  - name: total_line_item_revenue
    expr: SUM(source.line_total)
    display_name: Total Line Item Revenue
    comment: Total revenue from all order line items. This is the correct field for product-level revenue analysis.
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - line revenue
      - product revenue
      - item revenue
      - sales revenue

  - name: total_units_sold
    expr: SUM(source.quantity)
    display_name: Total Units Sold
    comment: Total quantity of product units sold across all order items.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - units sold
      - quantity sold
      - volume

  - name: average_unit_price
    expr: AVG(source.unit_price)
    display_name: Average Unit Price
    comment: Average selling price per unit across all order items.
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - avg unit price
      - mean price

  - name: average_discount_pct
    expr: ROUND(AVG(source.discount_pct), 2)
    display_name: Average Discount Percentage
    comment: Average discount percentage applied to order line items.
    format:
      type: number
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - avg discount
      - mean discount

  - name: average_line_item_value
    expr: ROUND(MEASURE(total_line_item_revenue) / NULLIF(COUNT(source.order_item_id), 0), 2)
    display_name: Average Line Item Value
    comment: Average revenue per order line item.
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - avg line value
      - mean item value

  - name: total_cogs
    expr: SUM(source.quantity * products.cost_price)
    display_name: Total Cost of Goods Sold
    comment: Total cost of goods sold across all order items. Lines whose product has no cost_price are excluded from COGS, which overstates gross profit.
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - cogs
      - total cost
      - product cost

  - name: gross_profit
    expr: MEASURE(total_line_item_revenue) - MEASURE(total_cogs)
    display_name: Gross Profit
    comment: Total gross profit calculated as revenue minus cost of goods sold. Lines whose product has no cost_price are excluded from COGS, which overstates gross profit.
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - profit
      - margin dollars

  - name: gross_margin_pct
    expr: MEASURE(gross_profit) / NULLIF(MEASURE(total_line_item_revenue), 0)
    display_name: Gross Margin Percentage
    comment: Gross margin percentage calculated as gross profit divided by revenue. Expressed as a fraction (0.25 = 25%).
    format:
      type: percentage
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - margin percent
      - profit margin

  - name: order_count
    expr: COUNT(DISTINCT orders.order_id)
    display_name: Order Count
    comment: Count of distinct orders. Counts only orders with at least one line item.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - total orders
      - order volume
      - number of orders

  - name: average_order_value
    expr: ROUND(MEASURE(total_line_item_revenue) / NULLIF(MEASURE(order_count), 0), 2)
    display_name: Average Order Value
    comment: Average revenue per order. Based on line item revenue, so it excludes order-level tax, shipping and order discounts.
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - aov
      - avg order value
      - mean order value

  - name: average_units_per_order
    expr: ROUND(CAST(MEASURE(total_units_sold) AS DOUBLE) / NULLIF(MEASURE(order_count), 0), 2)
    display_name: Average Units Per Order
    comment: Average number of units per order.
    format:
      type: number
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - avg units per order
      - units per order

  - name: customer_count
    expr: COUNT(DISTINCT orders.customers.customer_id)
    display_name: Customer Count
    comment: Count of distinct customers. Counts only customers that appear on orders with at least one line item.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - total customers
      - customer volume

  - name: active_customer_count
    expr: COUNT(DISTINCT CASE WHEN orders.customers.is_active = TRUE THEN orders.customers.customer_id END)
    display_name: Active Customer Count
    comment: Count of distinct active customers. Counts only customers that appear on orders with at least one line item.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - active customers

  - name: product_count
    expr: COUNT(DISTINCT products.product_id)
    display_name: Product Count
    comment: Count of distinct products. Counts only products that appear on at least one order line item.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - total products
      - product volume

  - name: payment_transaction_count
    expr: COUNT(DISTINCT orders.payments.payment_id)
    display_name: Payment Transaction Count
    comment: Count of distinct payment transactions. Payments and shipments are joined many-to-one; if an order has more than one, only the first match is used, so these undercount.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - payment count
      - transaction count

  - name: total_payment_amount
    expr: SUM(orders.payments.amount)
    display_name: Total Payment Amount
    comment: Total payment amount across all payment transactions. WARNING - order payments repeat once per order line, so this total is inflated unless the query groups by order_id. Use payment_transaction_count for counts.
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - payment amount
      - payment total

  - name: shipment_count
    expr: COUNT(DISTINCT orders.shipments.shipment_id)
    display_name: Shipment Count
    comment: Count of distinct shipments. Payments and shipments are joined many-to-one; if an order has more than one, only the first match is used, so these undercount.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - total shipments
      - shipment volume

  - name: delivery_time_days
    expr: ROUND(AVG(DATEDIFF(orders.shipments.delivered_at, orders.shipments.shipped_at)), 2)
    display_name: Delivery Time Days
    comment: Average delivery time in days calculated as the difference between delivered and shipped timestamps. Payments and shipments are joined many-to-one; if an order has more than one, only the first match is used, so these undercount.
    format:
      type: number
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - avg delivery time
      - delivery days
