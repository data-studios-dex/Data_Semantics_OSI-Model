version: "1.0"

semantic_model:
  - name: ecom_retail_analytics
    description: >-
      Comprehensive semantic model for retail e-commerce analytics covering customers, orders, products, 
      payments, and shipments. This model supports customer analytics, order fulfillment analysis, 
      product performance tracking, payment processing analysis, and logistics operations.
    
    ai_context:
      instructions: >-
        ## Dataset Grain Overview
        
        - **customers**: One row per customer. Contains customer demographic and registration information.
        
        - **orders**: One row per order. Contains order-level aggregated amounts including subtotal, 
          discount_amount, tax_amount, shipping_fee, and total_amount.
        
        - **order_items**: One row per order line item. Multiple rows per order. Contains line-level 
          details including quantity, unit_price, discount_pct, and line_total.
        
        - **products**: One row per product. Contains product catalog information including pricing 
          and inventory.
        
        - **product_categories**: One row per product category. Supports hierarchical category structure 
          via self-referencing parent_category_id.
        
        - **payments**: One row per payment transaction. Multiple payments may exist per order.
        
        - **shipments**: One row per shipment. Multiple shipments may exist per order.
        
        
        ## Critical Grain Differences and Double-Counting Prevention
        
        **IMPORTANT**: orders and order_items have different analytical grains.
        
        - **orders.subtotal**, **orders.discount_amount**, **orders.tax_amount**, **orders.shipping_fee**, 
          and **orders.total_amount** are ORDER-LEVEL aggregated amounts.
        
        - **order_items.line_total** is a LINE-ITEM-LEVEL amount.
        
        **Double-Counting Rule**:
        
        - When analyzing at ORDER level, use orders.total_amount, orders.subtotal, orders.discount_amount, 
          orders.tax_amount, orders.shipping_fee.
        
        - When analyzing at LINE-ITEM level or PRODUCT level, use order_items.line_total, 
          order_items.quantity, order_items.unit_price.
        
        - **DO NOT** sum orders.total_amount after joining orders to order_items. This will multiply 
          the order total by the number of line items in each order.
        
        - **DO NOT** sum order_items.line_total at the order level without understanding that it 
          represents line-level revenue, not order-level revenue including tax and shipping.
        
        - To calculate total order revenue at the order level, use orders.total_amount.
        
        - To calculate product-level revenue, use order_items.line_total aggregated by product.
        
        
        ## Metric Selection Guidance
        
        **Order-Level Metrics**:
        - Total Order Revenue → SUM(orders.total_amount)
        - Total Order Subtotal → SUM(orders.subtotal)
        - Total Discount Amount → SUM(orders.discount_amount)
        - Total Tax Amount → SUM(orders.tax_amount)
        - Total Shipping Fees → SUM(orders.shipping_fee)
        - Order Count → COUNT(DISTINCT orders.order_id)
        - Average Order Value → SUM(orders.total_amount) / COUNT(DISTINCT orders.order_id)
        
        **Line-Item-Level Metrics**:
        - Total Line Revenue → SUM(order_items.line_total)
        - Total Units Sold → SUM(order_items.quantity)
        - Line Item Count → COUNT(order_items.order_item_id)
        - Average Line Item Value → SUM(order_items.line_total) / COUNT(order_items.order_item_id)
        
        **Product-Level Metrics**:
        - Product Revenue → SUM(order_items.line_total) grouped by product_id
        - Units Sold by Product → SUM(order_items.quantity) grouped by product_id
        - Average Selling Price → SUM(order_items.line_total) / SUM(order_items.quantity)
        
        **Customer-Level Metrics**:
        - Customer Count → COUNT(DISTINCT customers.customer_id)
        - Revenue per Customer → SUM(orders.total_amount) / COUNT(DISTINCT customers.customer_id)
        - Orders per Customer → COUNT(DISTINCT orders.order_id) / COUNT(DISTINCT customers.customer_id)
        
        
        ## Join Guidance
        
        **Standard Relationships**:
        
        1. **customers → orders**: Join on customers.customer_id = orders.customer_id (one-to-many)
        
        2. **orders → order_items**: Join on orders.order_id = order_items.order_id (one-to-many)
        
        3. **products → order_items**: Join on products.product_id = order_items.product_id (one-to-many)
        
        4. **product_categories → products**: Join on product_categories.category_id = products.category_id (one-to-many)
        
        5. **orders → payments**: Join on orders.order_id = payments.order_id (one-to-many, multiple payments per order possible)
        
        6. **orders → shipments**: Join on orders.order_id = shipments.order_id (one-to-many, multiple shipments per order possible)
        
        
        **Hierarchical Relationship**:
        
        7. **product_categories → product_categories (parent)**: Self-referencing hierarchy via 
           product_categories.parent_category_id = product_categories.category_id. Use recursive 
           queries to traverse the full category hierarchy.
        
        
        ## Time Analysis Guidance
        
        **Order Analysis**:
        - Use **orders.order_date** for order placement time analysis
        - Supports daily, monthly, quarterly, yearly aggregations
        - Use for order trends, seasonality analysis, period-over-period comparisons
        
        **Payment Analysis**:
        - Use **payments.paid_at** for payment completion time analysis
        - May differ from order_date due to payment processing delays
        
        **Shipment Analysis**:
        - Use **shipments.shipped_at** for shipment dispatch time analysis
        - Use **shipments.delivered_at** for delivery completion time analysis
        - Calculate delivery time as delivered_at - shipped_at
        - Calculate order-to-ship time as shipped_at - orders.order_date
        
        **Customer Analysis**:
        - Use **customers.registration_date** for customer acquisition analysis
        - Use **customers.date_of_birth** for age-based segmentation (PII field)
        
        **Product Analysis**:
        - Use **products.created_at** for product launch analysis
        
        
        ## Hierarchical Queries
        
        **Product Category Hierarchy**:
        
        The product_categories table contains a self-referencing foreign key (parent_category_id) 
        that creates a hierarchical category structure.
        
        To query the full category hierarchy, use recursive CTEs in Databricks:
        
        ```sql
        WITH RECURSIVE category_hierarchy AS (
          SELECT 
            category_id,
            category_name,
            parent_category_id,
            category_name AS category_path,
            0 AS level
          FROM ecom_bronze.product_categories
          WHERE parent_category_id IS NULL
          
          UNION ALL
          
          SELECT 
            c.category_id,
            c.category_name,
            c.parent_category_id,
            CONCAT(ch.category_path, ' > ', c.category_name) AS category_path,
            ch.level + 1 AS level
          FROM ecom_bronze.product_categories c
          INNER JOIN category_hierarchy ch
            ON c.parent_category_id = ch.category_id
        )
        SELECT * FROM category_hierarchy
        ```
        
        Use this pattern to:
        - Roll up product sales to parent categories
        - Calculate category-level metrics at any hierarchy level
        - Analyze category performance across hierarchy levels
        
        
        ## Payment and Shipment Multiplicity
        
        **Multiple Payments per Order**:
        
        An order may have multiple payment transactions (e.g., partial payments, split payments, 
        refunds). When calculating payment metrics:
        
        - Total Payment Amount per Order → SUM(payments.amount) grouped by order_id
        - Payment Count per Order → COUNT(payments.payment_id) grouped by order_id
        - Compare SUM(payments.amount) to orders.total_amount to identify discrepancies
        
        **Multiple Shipments per Order**:
        
        An order may have multiple shipments (e.g., split shipments, partial fulfillment). 
        When calculating shipment metrics:
        
        - Shipment Count per Order → COUNT(shipments.shipment_id) grouped by order_id
        - Average Delivery Time → AVG(shipments.delivered_at - shipments.shipped_at)
        - On-Time Delivery analysis requires business rules for expected delivery dates
        
        
        ## Dimensional Analysis
        
        **Customer Dimensions**:
        - customer_segment (Premium, Standard, etc.)
        - city, state, country (geographic analysis)
        - gender (demographic analysis)
        - is_active (active vs. inactive customers)
        
        **Order Dimensions**:
        - order_status (Shipped, Pending, Delivered, Cancelled, etc.)
        - sales_channel (Online, In-Store, Mobile, etc.)
        - currency (multi-currency support)
        
        **Product Dimensions**:
        - category_id / category_name (via product_categories)
        - brand (brand analysis)
        - is_active (active vs. discontinued products)
        
        **Payment Dimensions**:
        - payment_method (Credit Card, PayPal, Bank Transfer, etc.)
        - payment_status (Completed, Pending, Failed, Refunded, etc.)
        - gateway (payment processor analysis)
        
        **Shipment Dimensions**:
        - carrier (FedEx, UPS, USPS, etc.)
        - shipment_status (In Transit, Delivered, Delayed, etc.)
        
        
        ## Computed Fields and Formulas
        
        **Order Items**:
        - **line_total** is computed as: quantity * unit_price * (1 - discount_pct / 100)
        - This represents the line-level revenue after applying the line-item discount
        
        **Profit Calculations**:
        - Line-level profit: (order_items.unit_price - products.cost_price) * order_items.quantity * (1 - order_items.discount_pct / 100)
        - Product margin: (products.unit_price - products.cost_price) / products.unit_price * 100
        
        **Delivery Time Calculations**:
        - Delivery duration: shipments.delivered_at - shipments.shipped_at
        - Order-to-ship duration: shipments.shipped_at - orders.order_date
        - Order-to-delivery duration: shipments.delivered_at - orders.order_date
        
        
        ## Query Restrictions and Considerations
        
        1. **PII Fields**: The following fields contain personally identifiable information and may 
           require special handling:
           - customers.first_name, last_name, email, phone, date_of_birth
           - orders.tax_amount (marked as PII in glossary)
           - payments.transaction_ref
        
        2. **Currency Handling**: All monetary amounts are stored in their respective currency. 
           Orders, products, and payments include currency fields. Multi-currency analysis requires 
           currency conversion logic.
        
        3. **Active Records**: Use is_active flags to filter active customers, products, and categories.
        
        4. **Source System Tracking**: All tables include _source_system, _batch_id, and _loaded_at 
           for data lineage and ETL tracking.
        
        5. **Null Handling**: Some fields allow NULL values (e.g., parent_category_id for top-level 
           categories, shipment timestamps before shipment occurs). Handle NULLs appropriately in 
           calculations and joins.
        
        6. **Status Fields**: order_status, payment_status, and shipment_status are categorical fields. 
           Ensure queries filter or group by appropriate status values for accurate analysis.

    datasets:
      - name: customers
        business_name: Customers
        description: >-
          Contains customer master data including demographic information, contact details, 
          geographic location, customer segmentation, and registration information. 
          Grain: One row per customer.
        source: ecom_bronze.customers
        primary_key:
          - customer_id
        fields:
          - name: customer_id
            business_name: Customer Identifier
            description: Unique identifier for a customer.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: customer_code
            business_name: Customer Code
            description: Business reference code assigned to the customer.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: first_name
            business_name: First Name
            description: First name of the customer. PII field.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: last_name
            business_name: Last Name
            description: Last name of the customer. PII field.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: email
            business_name: Email
            description: Email address of the customer. PII field.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: phone
            business_name: Phone
            description: Phone number of the customer. PII field.
            sql_type: STRING
          
          - name: gender
            business_name: Gender
            description: Gender of the customer. Dimension for demographic analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: date_of_birth
            business_name: Date Of Birth
            description: Date of birth of the customer. PII field. Can be used for age-based segmentation.
            sql_type: DATE
            dimension:
              is_time: true
          
          - name: city
            business_name: City
            description: City where the customer resides. Geographic dimension.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: state
            business_name: State
            description: State or province where the customer resides. Geographic dimension.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: country
            business_name: Country
            description: Country where the customer resides. Geographic dimension.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: postal_code
            business_name: Postal Code
            description: Postal or ZIP code of the customer's address.
            sql_type: STRING
          
          - name: customer_segment
            business_name: Customer Segment
            description: >-
              Indicates the current segment classification of the customer (e.g., Premium, Standard). 
              Key dimension for customer segmentation analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: registration_date
            business_name: Registration Date
            description: >-
              Date when the customer registered. Time dimension for customer acquisition analysis.
            sql_type: DATE
            dimension:
              is_time: true
          
          - name: is_active
            business_name: Is Active
            description: Indicates whether the customer account is currently active. Boolean dimension.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

      - name: orders
        business_name: Orders
        description: >-
          Contains order header information including customer reference, order timing, status, 
          shipping destination, and order-level financial aggregates (subtotal, discount, tax, 
          shipping fee, total amount). 
          Grain: One row per order.
        source: ecom_bronze.orders
        primary_key:
          - order_id
        fields:
          - name: order_id
            business_name: Order Identifier
            description: Unique identifier for an order.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_number
            business_name: Order Number
            description: Business reference number assigned to the order.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: customer_id
            business_name: Customer ID
            description: References the related customer record. Foreign key to customers.customer_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: order_date
            business_name: Order Date
            description: >-
              Timestamp recording when the order was placed. Primary time dimension for order analysis.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: order_status
            business_name: Order Status
            description: >-
              Indicates the current status of the order (e.g., Shipped, Pending, Delivered, Cancelled). 
              Key dimension for order lifecycle analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: sales_channel
            business_name: Sales Channel
            description: >-
              Indicates the channel through which the order was placed (e.g., Online, In-Store, Mobile). 
              Key dimension for channel analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: ship_city
            business_name: Ship City
            description: City to which the order is shipped. Geographic dimension.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: ship_state
            business_name: Ship State
            description: State or province to which the order is shipped. Geographic dimension.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: Postal or ZIP code to which the order is shipped.
            sql_type: STRING
          
          - name: subtotal
            business_name: Subtotal
            description: >-
              Monetary amount representing the order subtotal before discounts and taxes. 
              Order-level measure.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: discount_amount
            business_name: Discount Amount
            description: >-
              Monetary amount representing the total discount applied to the order. 
              Order-level measure.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: tax_amount
            business_name: Tax Amount
            description: >-
              Monetary amount representing the tax charged on the order. Order-level measure. 
              Marked as PII in glossary.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: shipping_fee
            business_name: Shipping Fee
            description: >-
              Monetary amount representing the shipping cost for the order. Order-level measure.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: total_amount
            business_name: Total Amount
            description: >-
              Monetary amount representing the final total of the order. Order-level measure. 
              Primary revenue metric at order grain.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: currency
            business_name: Currency
            description: Currency code for the order amounts (e.g., USD). Dimension for multi-currency analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

      - name: order_items
        business_name: Order Items
        description: >-
          Contains order line item details including product reference, quantity, pricing, 
          discounts, and line-level totals. Multiple line items per order. 
          Grain: One row per order line item.
        source: ecom_bronze.order_items
        primary_key:
          - order_item_id
        fields:
          - name: order_item_id
            business_name: Order Item Identifier
            description: Unique identifier for an order line item.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: References the related order record. Foreign key to orders.order_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: line_number
            business_name: Line Number
            description: Sequential line number within the order.
            sql_type: INT
            constraints:
              - NOT NULL
          
          - name: product_id
            business_name: Product ID
            description: References the related product record. Foreign key to products.product_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: quantity
            business_name: Quantity
            description: Number of units ordered for this line item. Line-level measure.
            sql_type: INT
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: unit_price
            business_name: Unit Price
            description: Monetary amount representing the price per unit. Line-level measure.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
          
          - name: discount_pct
            business_name: Discount Pct
            description: Percentage discount applied to the line item. Line-level measure.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
          
          - name: line_total
            business_name: Line Total
            description: >-
              Monetary amount representing the total for this line item. 
              Computed as: quantity * unit_price * (1 - discount_pct / 100). 
              Line-level revenue measure.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              is_computed: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

      - name: products
        business_name: Products
        description: >-
          Contains product catalog information including SKU, product name, category reference, 
          brand, pricing, cost, inventory, and product lifecycle status. 
          Grain: One row per product.
        source: ecom_bronze.products
        primary_key:
          - product_id
        fields:
          - name: product_id
            business_name: Product Identifier
            description: Unique identifier for a product.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: sku
            business_name: Sku
            description: Stock keeping unit code for the product.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: product_name
            business_name: Product Name
            description: Name of the product.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: category_id
            business_name: Category ID
            description: References the related product category record. Foreign key to product_categories.category_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: brand
            business_name: Brand
            description: Brand name of the product. Dimension for brand analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: description
            business_name: Description
            description: Detailed description of the product.
            sql_type: STRING
          
          - name: unit_price
            business_name: Unit Price
            description: Monetary amount representing the selling price per unit. Product-level measure.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
          
          - name: cost_price
            business_name: Cost Price
            description: Monetary amount representing the cost per unit. Product-level measure.
            sql_type: DECIMAL
            measure:
              aggregation: AVG
          
          - name: currency
            business_name: Currency
            description: Currency code for the product prices (e.g., USD). Dimension for multi-currency analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: stock_quantity
            business_name: Stock Quantity
            description: Current inventory quantity available for the product. Inventory measure.
            sql_type: INT
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: is_active
            business_name: Is Active
            description: Indicates whether the product is currently active for sale. Boolean dimension.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: created_at
            business_name: Created At
            description: Timestamp recording when the product was created in the system. Time dimension for product launch analysis.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

      - name: product_categories
        business_name: Product Categories
        description: >-
          Contains product category master data including category name, hierarchical parent reference, 
          and category status. Supports hierarchical category structure via self-referencing parent_category_id. 
          Grain: One row per product category.
        source: ecom_bronze.product_categories
        primary_key:
          - category_id
        fields:
          - name: category_id
            business_name: Category Identifier
            description: Unique identifier for a product category.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: category_name
            business_name: Category Name
            description: Name of the product category. Primary dimension for category analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: parent_category_id
            business_name: Parent Category ID
            description: >-
              References the parent category in the hierarchy. Self-referencing foreign key to 
              product_categories.category_id. NULL for top-level categories.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
          
          - name: description
            business_name: Description
            description: Detailed description of the product category.
            sql_type: STRING
          
          - name: is_active
            business_name: Is Active
            description: Indicates whether the category is currently active. Boolean dimension.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

      - name: payments
        business_name: Payments
        description: >-
          Contains payment transaction information including order reference, payment method, 
          payment status, amount, gateway, and payment timing. Multiple payments may exist per order. 
          Grain: One row per payment transaction.
        source: ecom_bronze.payments
        primary_key:
          - payment_id
        fields:
          - name: payment_id
            business_name: Payment Identifier
            description: Unique identifier for a payment transaction.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: References the related order record. Foreign key to orders.order_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: payment_method
            business_name: Payment Method
            description: >-
              Indicates the method used for payment (e.g., Credit Card, PayPal, Bank Transfer). 
              Key dimension for payment method analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: payment_status
            business_name: Payment Status
            description: >-
              Indicates the current status of the payment (e.g., Completed, Pending, Failed, Refunded). 
              Key dimension for payment lifecycle analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: amount
            business_name: Amount
            description: Monetary amount representing the payment value. Payment-level measure.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: currency
            business_name: Currency
            description: Currency code for the payment amount (e.g., USD). Dimension for multi-currency analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: transaction_ref
            business_name: Transaction Ref
            description: External reference number for the payment transaction. PII field.
            sql_type: STRING
          
          - name: gateway
            business_name: Gateway
            description: Name of the payment gateway used to process the transaction (e.g., Stripe). Dimension for gateway analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: paid_at
            business_name: Paid At
            description: Timestamp recording when the payment was completed. Time dimension for payment timing analysis.
            sql_type: TIMESTAMP
            dimension:
              is_time: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

      - name: shipments
        business_name: Shipments
        description: >-
          Contains shipment information including order reference, carrier, tracking, shipment status, 
          timing, and destination. Multiple shipments may exist per order. 
          Grain: One row per shipment.
        source: ecom_bronze.shipments
        primary_key:
          - shipment_id
        fields:
          - name: shipment_id
            business_name: Shipment Identifier
            description: Unique identifier for a shipment.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: References the related order record. Foreign key to orders.order_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: carrier
            business_name: Carrier
            description: Name of the shipping carrier handling the shipment (e.g., FedEx, UPS). Dimension for carrier analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: tracking_number
            business_name: Tracking Number
            description: Tracking number assigned by the carrier for the shipment.
            sql_type: STRING
          
          - name: shipment_status
            business_name: Shipment Status
            description: >-
              Indicates the current status of the shipment (e.g., In Transit, Delivered, Delayed). 
              Key dimension for shipment lifecycle analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: shipped_at
            business_name: Shipped At
            description: Timestamp recording when the shipment was dispatched. Time dimension for shipment timing analysis.
            sql_type: TIMESTAMP
            dimension:
              is_time: true
          
          - name: delivered_at
            business_name: Delivered At
            description: Timestamp recording when the shipment was delivered. Time dimension for delivery timing analysis.
            sql_type: TIMESTAMP
            dimension:
              is_time: true
          
          - name: ship_city
            business_name: Ship City
            description: City to which the shipment is being sent. Geographic dimension.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: ship_state
            business_name: Ship State
            description: State or province to which the shipment is being sent. Geographic dimension.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: Postal or ZIP code to which the shipment is being sent.
            sql_type: STRING
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL

    relationships:
      - name: orders_to_customers
        left_dataset: orders
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship from orders to customers. Each order belongs to exactly 
          one customer. A customer may have zero or more orders. Join on orders.customer_id = customers.customer_id.
      
      - name: order_items_to_orders
        left_dataset: order_items
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship from order_items to orders. Each order line item belongs 
          to exactly one order. An order may have one or more line items. Join on order_items.order_id = orders.order_id. 
          IMPORTANT: When joining orders to order_items, do not sum order-level measures (orders.total_amount, 
          orders.subtotal, orders.discount_amount, orders.tax_amount, orders.shipping_fee) as this will 
          multiply the order total by the number of line items.
      
      - name: order_items_to_products
        left_dataset: order_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship from order_items to products. Each order line item references 
          exactly one product. A product may appear in zero or more order line items. Join on 
          order_items.product_id = products.product_id.
      
      - name: products_to_product_categories
        left_dataset: products
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship from products to product_categories. Each product belongs 
          to exactly one category. A category may contain zero or more products. Join on 
          products.category_id = product_categories.category_id.
      
      - name: product_categories_hierarchy
        left_dataset: product_categories
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - parent_category_id
          right:
            - category_id
        join_type: recursive
        resolution: >-
          Recursive self-referencing relationship within product_categories. Each category may have a 
          parent category, creating a hierarchical category structure. Top-level categories have 
          parent_category_id = NULL. Join on product_categories.parent_category_id = product_categories.category_id. 
          Use recursive CTEs to traverse the full category hierarchy. Example Databricks SQL:
          
          WITH RECURSIVE category_hierarchy AS (
            SELECT 
              category_id,
              category_name,
              parent_category_id,
              category_name AS category_path,
              0 AS level
            FROM ecom_bronze.product_categories
            WHERE parent_category_id IS NULL
            
            UNION ALL
            
            SELECT 
              c.category_id,
              c.category_name,
              c.parent_category_id,
              CONCAT(ch.category_path, ' > ', c.category_name) AS category_path,
              ch.level + 1 AS level
            FROM ecom_bronze.product_categories c
            INNER JOIN category_hierarchy ch
              ON c.parent_category_id = ch.category_id
          )
          SELECT * FROM category_hierarchy
      
      - name: payments_to_orders
        left_dataset: payments
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship from payments to orders. Each payment transaction belongs 
          to exactly one order. An order may have one or more payment transactions (e.g., partial payments, 
          split payments, refunds). Join on payments.order_id = orders.order_id. When analyzing payment 
          amounts, be aware that multiple payments may exist per order.
      
      - name: shipments_to_orders
        left_dataset: shipments
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship from shipments to orders. Each shipment belongs to exactly 
          one order. An order may have one or more shipments (e.g., split shipments, partial fulfillment). 
          Join on shipments.order_id = orders.order_id. When analyzing shipment metrics, be aware that 
          multiple shipments may exist per order.

    metrics:
      - name: total_order_revenue
        business_name: Total Order Revenue
        description: >-
          Total revenue from all orders calculated as the sum of order total amounts. This is the 
          primary revenue metric at order grain, including subtotal, tax, and shipping fees, minus discounts.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.total_amount) AS total_order_revenue
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.total_amount
      
      - name: total_order_subtotal
        business_name: Total Order Subtotal
        description: >-
          Total order subtotal before discounts and taxes. Sum of all order subtotals.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.subtotal) AS total_order_subtotal
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.subtotal
      
      - name: total_discount_amount
        business_name: Total Discount Amount
        description: >-
          Total discount amount applied across all orders. Sum of all order-level discounts.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.discount_amount) AS total_discount_amount
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.discount_amount
      
      - name: total_tax_amount
        business_name: Total Tax Amount
        description: >-
          Total tax amount charged across all orders. Sum of all order-level taxes.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.tax_amount) AS total_tax_amount
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.tax_amount
      
      - name: total_shipping_fees
        business_name: Total Shipping Fees
        description: >-
          Total shipping fees charged across all orders. Sum of all order-level shipping fees.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.shipping_fee) AS total_shipping_fees
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.shipping_fee
      
      - name: order_count
        business_name: Order Count
        description: >-
          Total number of orders. Count of distinct order identifiers.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT orders.order_id) AS order_count
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.order_id
      
      - name: average_order_value
        business_name: Average Order Value
        description: >-
          Average order value calculated as total order revenue divided by order count. 
          Represents the average total amount per order.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT orders.order_id) = 0 THEN 0
                    ELSE SUM(orders.total_amount) / COUNT(DISTINCT orders.order_id)
                  END AS average_order_value
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.total_amount
                - orders.order_id
      
      - name: total_line_revenue
        business_name: Total Line Revenue
        description: >-
          Total revenue from all order line items calculated as the sum of line totals. This represents 
          line-level revenue after line-item discounts, but does not include order-level tax and shipping fees.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.line_total) AS total_line_revenue
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.line_total
      
      - name: total_units_sold
        business_name: Total Units Sold
        description: >-
          Total number of product units sold across all order line items. Sum of all line item quantities.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.quantity) AS total_units_sold
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.quantity
      
      - name: line_item_count
        business_name: Line Item Count
        description: >-
          Total number of order line items. Count of distinct order item identifiers.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(order_items.order_item_id) AS line_item_count
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.order_item_id
      
      - name: average_line_item_value
        business_name: Average Line Item Value
        description: >-
          Average line item value calculated as total line revenue divided by line item count.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(order_items.order_item_id) = 0 THEN 0
                    ELSE SUM(order_items.line_total) / COUNT(order_items.order_item_id)
                  END AS average_line_item_value
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.line_total
                - order_items.order_item_id
      
      - name: average_selling_price
        business_name: Average Selling Price
        description: >-
          Average selling price per unit calculated as total line revenue divided by total units sold. 
          This represents the weighted average price per unit across all line items after discounts.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN SUM(order_items.quantity) = 0 THEN 0
                    ELSE SUM(order_items.line_total) / SUM(order_items.quantity)
                  END AS average_selling_price
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.line_total
                - order_items.quantity
      
      - name: customer_count
        business_name: Customer Count
        description: >-
          Total number of customers. Count of distinct customer identifiers.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT customers.customer_id) AS customer_count
                FROM ecom_bronze.customers AS customers
              columns_used:
                - customers.customer_id
      
      - name: active_customer_count
        business_name: Active Customer Count
        description: >-
          Total number of active customers. Count of distinct customer identifiers where is_active = true.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT customers.customer_id) AS active_customer_count
                FROM ecom_bronze.customers AS customers
                WHERE customers.is_active = true
              columns_used:
                - customers.customer_id
                - customers.is_active
      
      - name: revenue_per_customer
        business_name: Revenue per Customer
        description: >-
          Average revenue per customer calculated as total order revenue divided by customer count. 
          Represents the average total order value per customer across all customers.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT customers.customer_id) = 0 THEN 0
                    ELSE SUM(orders.total_amount) / COUNT(DISTINCT customers.customer_id)
                  END AS revenue_per_customer
                FROM ecom_bronze.orders AS orders
                INNER JOIN ecom_bronze.customers AS customers
                  ON orders.customer_id = customers.customer_id
              columns_used:
                - orders.total_amount
                - customers.customer_id
      
      - name: orders_per_customer
        business_name: Orders per Customer
        description: >-
          Average number of orders per customer calculated as order count divided by customer count.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT customers.customer_id) = 0 THEN 0
                    ELSE CAST(COUNT(DISTINCT orders.order_id) AS DECIMAL) / COUNT(DISTINCT customers.customer_id)
                  END AS orders_per_customer
                FROM ecom_bronze.orders AS orders
                INNER JOIN ecom_bronze.customers AS customers
                  ON orders.customer_id = customers.customer_id
              columns_used:
                - orders.order_id
                - customers.customer_id
      
      - name: product_count
        business_name: Product Count
        description: >-
          Total number of products in the catalog. Count of distinct product identifiers.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT products.product_id) AS product_count
                FROM ecom_bronze.products AS products
              columns_used:
                - products.product_id
      
      - name: active_product_count
        business_name: Active Product Count
        description: >-
          Total number of active products in the catalog. Count of distinct product identifiers where is_active = true.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT products.product_id) AS active_product_count
                FROM ecom_bronze.products AS products
                WHERE products.is_active = true
              columns_used:
                - products.product_id
                - products.is_active
      
      - name: product_revenue
        business_name: Product Revenue
        description: >-
          Total revenue by product calculated as the sum of line totals grouped by product. 
          Result grain: one row per product.
        return_type: DECIMAL
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  products.product_id,
                  products.product_name,
                  SUM(order_items.line_total) AS product_revenue
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
                GROUP BY products.product_id, products.product_name
              columns_used:
                - order_items.line_total
                - products.product_id
                - products.product_name
      
      - name: product_units_sold
        business_name: Product Units Sold
        description: >-
          Total units sold by product calculated as the sum of quantities grouped by product. 
          Result grain: one row per product.
        return_type: INTEGER
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  products.product_id,
                  products.product_name,
                  SUM(order_items.quantity) AS product_units_sold
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
                GROUP BY products.product_id, products.product_name
              columns_used:
                - order_items.quantity
                - products.product_id
                - products.product_name
      
      - name: line_item_profit
        business_name: Line Item Profit
        description: >-
          Profit per line item calculated as (unit_price - cost_price) * quantity * (1 - discount_pct / 100). 
          Represents the gross profit for each order line item after applying line-item discounts. 
          Result grain: one row per order line item.
        return_type: DECIMAL
        result_grain: one row per order line item
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  order_items.order_item_id,
                  order_items.order_id,
                  order_items.product_id,
                  (order_items.unit_price - products.cost_price) 
                    * order_items.quantity 
                    * (1 - order_items.discount_pct / 100) AS line_item_profit
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
              columns_used:
                - order_items.order_item_id
                - order_items.order_id
                - order_items.product_id
                - order_items.unit_price
                - order_items.quantity
                - order_items.discount_pct
                - products.cost_price
      
      - name: total_profit
        business_name: Total Profit
        description: >-
          Total gross profit across all order line items calculated as the sum of line item profits.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(
                    (order_items.unit_price - products.cost_price) 
                    * order_items.quantity 
                    * (1 - order_items.discount_pct / 100)
                  ) AS total_profit
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
              columns_used:
                - order_items.unit_price
                - order_items.quantity
                - order_items.discount_pct
                - products.cost_price
      
      - name: product_margin_pct
        business_name: Product Margin Percentage
        description: >-
          Product margin percentage calculated as (unit_price - cost_price) / unit_price * 100. 
          Represents the gross margin percentage for each product based on catalog prices. 
          Result grain: one row per product.
        return_type: DECIMAL
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  products.product_id,
                  products.product_name,
                  CASE
                    WHEN products.unit_price = 0 THEN 0
                    ELSE (products.unit_price - products.cost_price) / products.unit_price * 100
                  END AS product_margin_pct
                FROM ecom_bronze.products AS products
                WHERE products.cost_price IS NOT NULL
              columns_used:
                - products.product_id
                - products.product_name
                - products.unit_price
                - products.cost_price
      
      - name: payment_count
        business_name: Payment Count
        description: >-
          Total number of payment transactions. Count of distinct payment identifiers.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(payments.payment_id) AS payment_count
                FROM ecom_bronze.payments AS payments
              columns_used:
                - payments.payment_id
      
      - name: total_payment_amount
        business_name: Total Payment Amount
        description: >-
          Total payment amount across all payment transactions. Sum of all payment amounts.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(payments.amount) AS total_payment_amount
                FROM ecom_bronze.payments AS payments
              columns_used:
                - payments.amount
      
      - name: shipment_count
        business_name: Shipment Count
        description: >-
          Total number of shipments. Count of distinct shipment identifiers.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(shipments.shipment_id) AS shipment_count
                FROM ecom_bronze.shipments AS shipments
              columns_used:
                - shipments.shipment_id
      
      - name: delivered_shipment_count
        business_name: Delivered Shipment Count
        description: >-
          Total number of delivered shipments. Count of shipments where delivered_at is not null.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(shipments.shipment_id) AS delivered_shipment_count
                FROM ecom_bronze.shipments AS shipments
                WHERE shipments.delivered_at IS NOT NULL
              columns_used:
                - shipments.shipment_id
                - shipments.delivered_at
      
      - name: average_delivery_time_days
        business_name: Average Delivery Time (Days)
        description: >-
          Average delivery time in days calculated as the average difference between delivered_at 
          and shipped_at timestamps. Only includes shipments that have been delivered.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(
                    DATEDIFF(
                      DAY,
                      shipments.shipped_at,
                      shipments.delivered_at
                    )
                  ) AS average_delivery_time_days
                FROM ecom_bronze.shipments AS shipments
                WHERE shipments.shipped_at IS NOT NULL
                  AND shipments.delivered_at IS NOT NULL
              columns_used:
                - shipments.shipped_at
                - shipments.delivered_at
      
      - name: monthly_order_revenue
        business_name: Monthly Order Revenue
        description: >-
          Total order revenue by month calculated as the sum of order total amounts grouped by 
          order month. Result grain: one row per month.
        return_type: DECIMAL
        result_grain: one row per month
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  DATE_TRUNC('MONTH', orders.order_date) AS order_month,
                  SUM(orders.total_amount) AS monthly_order_revenue
                FROM ecom_bronze.orders AS orders
                GROUP BY DATE_TRUNC('MONTH', orders.order_date)
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.total_amount
      
      - name: monthly_order_count
        business_name: Monthly Order Count
        description: >-
          Total order count by month calculated as the count of distinct orders grouped by 
          order month. Result grain: one row per month.
        return_type: INTEGER
        result_grain: one row per month
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  DATE_TRUNC('MONTH', orders.order_date) AS order_month,
                  COUNT(DISTINCT orders.order_id) AS monthly_order_count
                FROM ecom_bronze.orders AS orders
                GROUP BY DATE_TRUNC('MONTH', orders.order_date)
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.order_id
      
      - name: revenue_by_customer_segment
        business_name: Revenue by Customer Segment
        description: >-
          Total order revenue by customer segment calculated as the sum of order total amounts 
          grouped by customer segment. Result grain: one row per customer segment.
        return_type: DECIMAL
        result_grain: one row per customer segment
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  customers.customer_segment,
                  SUM(orders.total_amount) AS revenue_by_customer_segment
                FROM ecom_bronze.orders AS orders
                INNER JOIN ecom_bronze.customers AS customers
                  ON orders.customer_id = customers.customer_id
                GROUP BY customers.customer_segment
              columns_used:
                - orders.total_amount
                - customers.customer_segment
      
      - name: revenue_by_sales_channel
        business_name: Revenue by Sales Channel
        description: >-
          Total order revenue by sales channel calculated as the sum of order total amounts 
          grouped by sales channel. Result grain: one row per sales channel.
        return_type: DECIMAL
        result_grain: one row per sales channel
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  orders.sales_channel,
                  SUM(orders.total_amount) AS revenue_by_sales_channel
                FROM ecom_bronze.orders AS orders
                GROUP BY orders.sales_channel
              columns_used:
                - orders.sales_channel
                - orders.total_amount
      
      - name: revenue_by_product_category
        business_name: Revenue by Product Category
        description: >-
          Total line revenue by product category calculated as the sum of line totals grouped by 
          product category. Result grain: one row per product category.
        return_type: DECIMAL
        result_grain: one row per product category
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  product_categories.category_id,
                  product_categories.category_name,
                  SUM(order_items.line_total) AS revenue_by_product_category
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
                INNER JOIN ecom_bronze.product_categories AS product_categories
                  ON products.category_id = product_categories.category_id
                GROUP BY product_categories.category_id, product_categories.category_name
              columns_used:
                - order_items.line_total
                - products.category_id
                - product_categories.category_id
                - product_categories.category_name
      
      - name: revenue_by_brand
        business_name: Revenue by Brand
        description: >-
          Total line revenue by product brand calculated as the sum of line totals grouped by 
          product brand. Result grain: one row per brand.
        return_type: DECIMAL
        result_grain: one row per brand
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  products.brand,
                  SUM(order_items.line_total) AS revenue_by_brand
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
                WHERE products.brand IS NOT NULL
                GROUP BY products.brand
              columns_used:
                - order_items.line_total
                - products.brand