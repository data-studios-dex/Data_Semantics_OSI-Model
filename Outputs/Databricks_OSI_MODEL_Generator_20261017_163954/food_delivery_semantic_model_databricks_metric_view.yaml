    format:
      type: number
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - avg estimated time
  
  - name: agent_count
    expr: COUNT(DISTINCT orders.deliveries.delivery_agents.agent_id)
    display_name: Delivery Agent Count
    comment: Total number of distinct delivery agents who have completed deliveries
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - total agents
      - driver count
  
  - name: active_agent_count
    expr: COUNT(DISTINCT CASE WHEN orders.deliveries.delivery_agents.is_active = TRUE THEN orders.deliveries.delivery_agents.agent_id END)
    display_name: Active Agent Count
    comment: Total number of active delivery agents
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - active agents
      - active drivers
  
  - name: average_agent_rating
    expr: ROUND(AVG(orders.deliveries.delivery_agents.avg_rating), 2)
    display_name: Average Agent Rating
    comment: Average customer rating received by delivery agents
    format:
      type: number
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - avg agent rating
      - driver rating
  
  - name: total_discount_amount
    expr: SUM(orders.order_promotions.discount_amount)
    display_name: Total Discount Amount
    comment: Total discount amount given through promotions across all orders
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - total discounts
      - discount value
  
  - name: promotion_usage_count
    expr: COUNT(orders.order_promotions.order_promotion_id)
    display_name: Promotion Usage Count
    comment: Total number of times promotions have been applied to orders
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - promo usage
      - coupon usage
  
  - name: average_food_rating
    expr: ROUND(AVG(orders.reviews.food_rating), 2)
    display_name: Average Food Rating
    comment: Average food quality rating from customer reviews
    format:
      type: number
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - avg food rating
      - food score
  
  - name: average_delivery_rating
    expr: ROUND(AVG(orders.reviews.delivery_rating), 2)
    display_name: Average Delivery Rating
    comment: Average delivery experience rating from customer reviews
    format:
      type: number
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - avg delivery rating
      - delivery score
  
  - name: average_overall_rating
    expr: ROUND(AVG(orders.reviews.overall_rating), 2)
    display_name: Average Overall Rating
    comment: Average overall experience rating from customer reviews
    format:
      type: number
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - avg rating
      - overall score
  
  - name: review_count
    expr: COUNT(DISTINCT orders.reviews.review_id)
    display_name: Review Count
    comment: Total number of customer reviews submitted
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - total reviews
      - number of reviews
  
  - name: support_ticket_count
    expr: COUNT(DISTINCT orders.support_tickets.ticket_id)
    display_name: Support Ticket Count
    comment: Total number of customer support tickets created
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - total tickets
      - ticket volume
  
  - name: resolved_ticket_count
    expr: COUNT(DISTINCT CASE WHEN orders.support_tickets.status = 'Resolved' THEN orders.support_tickets.ticket_id END)
    display_name: Resolved Ticket Count
    comment: Total number of resolved customer support tickets
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - resolved tickets
  
  - name: open_ticket_count
    expr: COUNT(DISTINCT CASE WHEN orders.support_tickets.status = 'Open' THEN orders.support_tickets.ticket_id END)
    display_name: Open Ticket Count
    comment: Total number of open customer support tickets
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - open tickets
  
  - name: orders_per_customer
    expr: ROUND(CAST(MEASURE(order_count) AS DOUBLE) / NULLIF(MEASURE(customer_count), 0), 2)
    display_name: Orders Per Customer
    comment: Average number of orders per customer
    format:
      type: number
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - avg orders per customer
  
  - name: revenue_per_customer
    expr: ROUND(MEASURE(total_item_revenue) / NULLIF(MEASURE(customer_count), 0), 2)
    display_name: Revenue Per Customer
    comment: Average revenue per customer based on item-level revenue
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - avg revenue per customer
      - customer value
  
  - name: cancellation_rate_pct
    expr: MEASURE(cancelled_order_count) / NULLIF(MEASURE(order_count), 0)
    display_name: Cancellation Rate
    comment: Percentage of orders that were cancelled, expressed as a fraction (0.25 = 25%)
    format:
      type: percentage
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - cancel rate
      - cancellation percentage
