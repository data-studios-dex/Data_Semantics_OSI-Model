version: "1.0"

semantic_model:
  - name: ecom_retail_analytics
    description: >-
      Comprehensive semantic model for e-commerce retail analytics derived from the ecom_bronze schema.
      This model supports analytical queries across customers, orders, products, payments, and shipments.
      The model enables revenue analysis, customer behavior analysis, product performance analysis,
      fulfillment tracking, and payment processing analytics.
    
    ai_context:
      instructions: >-
        ## Dataset Grain Overview
        
        - **customers**: One row per customer. Contains customer demographic and registration information.
        
        - **orders**: One row per order. Contains order header information including totals, dates, and shipping details.
        
        - **order_items**: One row per order line item. Contains product-level order details with quantities and pricing.
        
        - **products**: One row per product. Contains product catalog information including pricing and inventory.
        
        - **product_categories**: One row per product category. Contains category hierarchy with self-referencing parent relationships.
        
        - **payments**: One row per payment transaction. Contains payment method, status, and transaction details.
        
        - **shipments**: One row per shipment. Contains carrier, tracking, and delivery information.
        
        
        ## Metric Selection and Grain Guidance
        
        **Order-Level Metrics**: Use orders dataset fields for order-level aggregations:
        - orders.total_amount for total order revenue
        - orders.subtotal for pre-tax, pre-shipping revenue
        - orders.discount_amount for order-level discounts
        - orders.tax_amount for order-level taxes
        - orders.shipping_fee for shipping revenue
        
        **Order-Item-Level Metrics**: Use order_items dataset fields for product-level or line-item aggregations:
        - order_items.line_total for line-item revenue
        - order_items.quantity for units sold
        - order_items.unit_price for product pricing analysis
        - order_items.discount_pct for line-item discount analysis
        
        **CRITICAL**: Do not sum order-level measures (orders.total_amount, orders.subtotal, orders.discount_amount, 
        orders.tax_amount, orders.shipping_fee) after joining orders to order_items. This will cause double-counting 
        because each order has multiple order items.
        
        
        ## Join Guidance
        
        **Standard Relationships**:
        
        1. **orders → customers**: Many orders to one customer via orders.customer_id = customers.customer_id
        
        2. **order_items → orders**: Many order items to one order via order_items.order_id = orders.order_id
        
        3. **order_items → products**: Many order items to one product via order_items.product_id = products.product_id
        
        4. **products → product_categories**: Many products to one category via products.category_id = product_categories.category_id
        
        5. **payments → orders**: Many payments to one order via payments.order_id = orders.order_id
        
        6. **shipments → orders**: Many shipments to one order via shipments.order_id = orders.order_id
        
        
        **Hierarchical Relationship**:
        
        7. **product_categories → product_categories (self-referencing)**: Each category may have a parent category 
        via product_categories.parent_category_id = product_categories.category_id. This creates a category hierarchy 
        that can be traversed using recursive queries.
        
        
        ## Double-Counting Prevention
        
        **Order-to-Order-Items Join**:
        When joining orders to order_items, be aware that:
        - Each order has multiple order items
        - Summing orders.total_amount after the join will multiply the order total by the number of items
        - Use orders.total_amount only when aggregating at order grain
        - Use order_items.line_total when aggregating at order-item or product grain
        
        **Example - CORRECT**:
        ```
        -- Order-level revenue (correct)
        SELECT SUM(orders.total_amount) AS total_revenue
        FROM orders
        
        -- Product-level revenue (correct)
        SELECT products.product_name, SUM(order_items.line_total) AS product_revenue
        FROM order_items
        JOIN products ON order_items.product_id = products.product_id
        GROUP BY products.product_name
        ```
        
        **Example - INCORRECT**:
        ```
        -- This will double-count order totals
        SELECT SUM(orders.total_amount) AS total_revenue
        FROM orders
        JOIN order_items ON orders.order_id = order_items.order_id
        ```
        
        
        ## Time Analysis Guidance
        
        **Primary Date Fields**:
        
        - **orders.order_date**: Use for order placement analysis, revenue trending, and sales performance over time
        
        - **payments.paid_at**: Use for payment timing analysis and cash flow analysis
        
        - **shipments.shipped_at**: Use for fulfillment timing analysis and warehouse performance
        
        - **shipments.delivered_at**: Use for delivery performance analysis and customer satisfaction metrics
        
        - **customers.registration_date**: Use for customer acquisition analysis and cohort analysis
        
        - **products.created_at**: Use for product launch analysis and catalog growth
        
        
        **Date Selection for Business Questions**:
        
        - "What is our revenue by month?" → Use orders.order_date
        - "When did customers pay?" → Use payments.paid_at
        - "How long does fulfillment take?" → Compare orders.order_date to shipments.shipped_at
        - "What is our delivery performance?" → Compare shipments.shipped_at to shipments.delivered_at
        - "How many customers registered this quarter?" → Use customers.registration_date
        
        
        ## Hierarchical Queries
        
        **Product Category Hierarchy**:
        
        The product_categories table contains a self-referencing relationship via parent_category_id.
        To traverse the full category hierarchy, use recursive CTEs:
        
        ```
        WITH RECURSIVE category_hierarchy AS (
          -- Base case: root categories (no parent)
          SELECT 
            category_id,
            category_name,
            parent_category_id,
            category_name AS category_path,
            0 AS level
          FROM product_categories
          WHERE parent_category_id IS NULL
          
          UNION ALL
          
          -- Recursive case: child categories
          SELECT 
            c.category_id,
            c.category_name,
            c.parent_category_id,
            h.category_path || ' > ' || c.category_name AS category_path,
            h.level + 1 AS level
          FROM product_categories c
          JOIN category_hierarchy h ON c.parent_category_id = h.category_id
        )
        SELECT * FROM category_hierarchy
        ```
        
        
        ## Query Restrictions and Important Notes
        
        1. **PII Fields**: Many fields are marked as PII (customer names, addresses, payment references, tracking numbers).
           Ensure appropriate access controls and masking when querying these fields.
        
        2. **Currency Handling**: All monetary amounts use currency codes (USD). When analyzing multi-currency data,
           ensure proper currency conversion if needed.
        
        3. **Active Status Filters**: customers.is_active, products.is_active, and product_categories.is_active 
           indicate whether records are currently active. Apply appropriate filters based on analytical needs.
        
        4. **Order Status**: orders.order_status indicates processing status (e.g., Completed, Pending, Cancelled).
           Filter appropriately for revenue analysis (typically include only Completed orders).
        
        5. **Payment Status**: payments.payment_status indicates payment processing status (e.g., Captured, Pending, Failed).
           Filter appropriately for cash flow analysis (typically include only Captured payments).
        
        6. **Shipment Status**: shipments.shipment_status indicates delivery status (e.g., In Transit, Delivered, Returned).
           Filter appropriately for fulfillment analysis.
        
        7. **Metadata Fields**: Fields prefixed with underscore (_source_system, _batch_id, _loaded_at) are 
           technical metadata fields used for data lineage and should not be used in business analytics.

    datasets:
      - name: customers
        business_name: Customers
        description: >-
          Contains customer master data with one row per customer.
          Includes customer demographics, contact information, address details, segmentation, and registration information.
          This dataset represents the analytical grain of individual customers and supports customer-level analysis.
        source: ecom_bronze.customers
        primary_key:
          - customer_id
        fields:
          - name: customer_id
            business_name: Customer Identifier
            description: >-
              Unique identifier for a customer. Primary key for the customers dataset.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: customer_code
            business_name: Customer Code
            description: >-
              Business-assigned code used to reference the customer in source systems.
              Provides a human-readable customer identifier for operational use.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
              - UNIQUE
          
          - name: first_name
            business_name: First Name
            description: >-
              Given name of the customer. Marked as PII.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
              - PII
          
          - name: last_name
            business_name: Last Name
            description: >-
              Family name or surname of the customer. Marked as PII.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
              - PII
          
          - name: email
            business_name: Email
            description: >-
              Email address used to contact the customer. Marked as PII.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
              - UNIQUE
              - PII
          
          - name: phone
            business_name: Phone
            description: >-
              Primary phone number for contacting the customer. Marked as PII.
            sql_type: STRING(255)
            constraints:
              - PII
          
          - name: gender
            business_name: Gender
            description: >-
              Reported gender of the customer. Analytical dimension for demographic analysis. Marked as PII.
            sql_type: STRING(255)
            constraints:
              - PII
            dimension:
              is_categorical: true
          
          - name: date_of_birth
            business_name: Date Of Birth
            description: >-
              Date of birth of the customer. Can be used to derive customer age for demographic analysis. Marked as PII.
            sql_type: DATE
            constraints:
              - PII
            dimension:
              is_time: true
          
          - name: city
            business_name: City
            description: >-
              City of the customer's primary address. Analytical dimension for geographic analysis. Marked as PII.
            sql_type: STRING(255)
            constraints:
              - PII
            dimension:
              is_categorical: true
          
          - name: state
            business_name: State
            description: >-
              State or region of the customer's primary address. Analytical dimension for geographic analysis. Marked as PII.
            sql_type: STRING(255)
            constraints:
              - PII
            dimension:
              is_categorical: true
          
          - name: country
            business_name: Country
            description: >-
              Country of the customer's primary address. Analytical dimension for geographic analysis. Marked as PII.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
              - PII
            dimension:
              is_categorical: true
          
          - name: postal_code
            business_name: Postal Code
            description: >-
              Postal or ZIP code of the customer's primary address. Marked as PII.
            sql_type: STRING(255)
            constraints:
              - PII
          
          - name: customer_segment
            business_name: Customer Segment
            description: >-
              Segment classification assigned to the customer for marketing or analysis.
              Analytical dimension for customer segmentation analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: registration_date
            business_name: Registration Date
            description: >-
              Date when the customer registered or was first created in the system.
              Time dimension for customer acquisition analysis and cohort analysis.
            sql_type: DATE
            dimension:
              is_time: true
          
          - name: is_active
            business_name: Is Active
            description: >-
              Indicates whether the customer account is currently active.
              Boolean dimension for filtering active vs inactive customers.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: >-
              Identifier of the source system from which the customer record was ingested.
              Technical metadata field for data lineage.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Id
            description: >-
              Identifier of the data load batch that ingested this customer record.
              Technical metadata field for data lineage.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp when the customer record was loaded into the data platform.
              Technical metadata field for data lineage.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: orders
        business_name: Orders
        description: >-
          Contains order header data with one row per order.
          Includes order identification, customer reference, order dates, status, sales channel, shipping address,
          and order-level financial totals (subtotal, discounts, taxes, shipping, total amount).
          This dataset represents the analytical grain of individual orders and supports order-level revenue analysis.
        source: ecom_bronze.orders
        primary_key:
          - order_id
        fields:
          - name: order_id
            business_name: Order Identifier
            description: >-
              Unique identifier for a customer order. Primary key for the orders dataset.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: order_number
            business_name: Order Number
            description: >-
              Business-facing order number presented to customers and used for tracking.
              Provides a human-readable order identifier for operational use.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
              - UNIQUE
          
          - name: customer_id
            business_name: Customer Identifier
            description: >-
              References the customer who placed the order. Foreign key to customers.customer_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: order_date
            business_name: Order Date
            description: >-
              Timestamp recording when the order was placed.
              Primary time dimension for order and revenue analysis.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: order_status
            business_name: Order Status
            description: >-
              Indicates the current processing status of the order (e.g., Completed, Pending, Cancelled).
              Analytical dimension for order status analysis and filtering.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: sales_channel
            business_name: Sales Channel
            description: >-
              Sales channel through which the order was placed, such as online or in-store.
              Analytical dimension for sales channel analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: ship_city
            business_name: Ship City
            description: >-
              City of the shipping address for the order. Analytical dimension for geographic analysis. Marked as PII.
            sql_type: STRING(255)
            constraints:
              - PII
            dimension:
              is_categorical: true
          
          - name: ship_state
            business_name: Ship State
            description: >-
              State or region of the shipping address for the order. Analytical dimension for geographic analysis. Marked as PII.
            sql_type: STRING(255)
            constraints:
              - PII
            dimension:
              is_categorical: true
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: >-
              Postal or ZIP code of the shipping address for the order. Marked as PII.
            sql_type: STRING(255)
            constraints:
              - PII
          
          - name: subtotal
            business_name: Subtotal
            description: >-
              Monetary amount representing the pre-tax, pre-shipping value of the order.
              Order-level measure for revenue analysis before taxes and shipping.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: discount_amount
            business_name: Discount Amount
            description: >-
              Total monetary discount applied to the order.
              Order-level measure for discount analysis.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: tax_amount
            business_name: Tax Amount
            description: >-
              Total tax amount applied to the order.
              Order-level measure for tax analysis. Marked as PII.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
              - PII
            measure:
              aggregation: SUM
          
          - name: shipping_fee
            business_name: Shipping Fee
            description: >-
              Monetary amount charged for shipping the order.
              Order-level measure for shipping revenue analysis.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: total_amount
            business_name: Total Amount
            description: >-
              Total monetary amount charged for the order including discounts, taxes, and shipping.
              Order-level measure for total revenue analysis.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: currency
            business_name: Currency
            description: >-
              Currency code used for the monetary amounts on the order.
              Analytical dimension for currency analysis.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: >-
              Identifier of the source system from which the order record was ingested.
              Technical metadata field for data lineage.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Id
            description: >-
              Identifier of the data load batch that ingested this order record.
              Technical metadata field for data lineage.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp when the order record was loaded into the data platform.
              Technical metadata field for data lineage.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: order_items
        business_name: Order Items
        description: >-
          Contains order line item data with one row per order line item.
          Includes order reference, product reference, line sequencing, quantities, unit pricing, discounts, and line totals.
          This dataset represents the analytical grain of individual order line items and supports product-level and line-item revenue analysis.
        source: ecom_bronze.order_items
        primary_key:
          - order_item_id
        fields:
          - name: order_item_id
            business_name: Order Item Identifier
            description: >-
              Unique identifier for an order line item. Primary key for the order_items dataset.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: order_id
            business_name: Order Identifier
            description: >-
              References the related order record containing this line item. Foreign key to orders.order_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: line_number
            business_name: Line Number
            description: >-
              Sequential number of the item within the order. Used for line ordering and display.
            sql_type: INT
            constraints:
              - NOT NULL
          
          - name: product_id
            business_name: Product Identifier
            description: >-
              References the related product being ordered. Foreign key to products.product_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: quantity
            business_name: Quantity
            description: >-
              Number of product units ordered for this line item.
              Measure for units sold analysis.
            sql_type: INT
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: unit_price
            business_name: Unit Price
            description: >-
              Unit selling price of the product at the time of order.
              Measure for pricing analysis. Can be used to calculate average selling price.
            sql_type: DECIMAL(12,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
          
          - name: discount_pct
            business_name: Discount Pct
            description: >-
              Percentage discount applied to this order line.
              Measure for discount analysis. Can be used to calculate average discount percentage.
            sql_type: DECIMAL(5,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
          
          - name: line_total
            business_name: Line Total
            description: >-
              Monetary amount representing the total value of the line item after discounts.
              Line-item-level measure for product-level revenue analysis.
              This is a computed field: quantity * unit_price * (1 - discount_pct / 100).
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: _source_system
            business_name: Source System
            description: >-
              Identifier of the source system from which the order item record was ingested.
              Technical metadata field for data lineage.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Id
            description: >-
              Identifier of the data load batch that ingested this order item record.
              Technical metadata field for data lineage.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp when the order item record was loaded into the data platform.
              Technical metadata field for data lineage.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: products
        business_name: Products
        description: >-
          Contains product catalog data with one row per product.
          Includes product identification, SKU, naming, category reference, brand, description, pricing, cost, inventory, and status.
          This dataset represents the analytical grain of individual products and supports product-level analysis.
        source: ecom_bronze.products
        primary_key:
          - product_id
        fields:
          - name: product_id
            business_name: Product Identifier
            description: >-
              Unique identifier for a product. Primary key for the products dataset.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: sku
            business_name: Sku
            description: >-
              Stock keeping unit code used to uniquely identify the product in inventory and sales systems.
              Provides a human-readable product identifier for operational use.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
              - UNIQUE
          
          - name: product_name
            business_name: Product Name
            description: >-
              Descriptive name of the product. Analytical dimension for product analysis.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: category_id
            business_name: Category Identifier
            description: >-
              References the category to which the product belongs. Foreign key to product_categories.category_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: brand
            business_name: Brand
            description: >-
              Brand or manufacturer of the product. Analytical dimension for brand analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: description
            business_name: Description
            description: >-
              Marketing or technical description of the product.
            sql_type: STRING(255)
          
          - name: unit_price
            business_name: Unit Price
            description: >-
              Standard selling price for a single unit of the product.
              Measure for product pricing analysis.
            sql_type: DECIMAL(12,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
          
          - name: cost_price
            business_name: Cost Price
            description: >-
              Internal cost price for a single unit of the product.
              Measure for cost analysis and margin calculation. Marked as PII.
            sql_type: DECIMAL(12,2)
            constraints:
              - PII
            measure:
              aggregation: AVG
          
          - name: currency
            business_name: Currency
            description: >-
              Currency code used for the product pricing.
              Analytical dimension for currency analysis.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: stock_quantity
            business_name: Stock Quantity
            description: >-
              Current on-hand inventory quantity for the product.
              Measure for inventory analysis.
            sql_type: INT
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: is_active
            business_name: Is Active
            description: >-
              Indicates whether the product is currently active and available for sale.
              Boolean dimension for filtering active vs inactive products.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: created_at
            business_name: Created At
            description: >-
              Timestamp when the product record was created in the source system.
              Time dimension for product launch analysis and catalog growth.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: _source_system
            business_name: Source System
            description: >-
              Identifier of the source system from which the product record was ingested.
              Technical metadata field for data lineage.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Id
            description: >-
              Identifier of the data load batch that ingested this product record.
              Technical metadata field for data lineage.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp when the product record was loaded into the data platform.
              Technical metadata field for data lineage.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: product_categories
        business_name: Product Categories
        description: >-
          Contains product category data with one row per product category.
          Includes category identification, naming, parent category reference (for hierarchy), description, and status.
          This dataset represents the analytical grain of individual product categories and supports category hierarchy analysis.
          The parent_category_id creates a self-referencing hierarchical relationship.
        source: ecom_bronze.product_categories
        primary_key:
          - category_id
        fields:
          - name: category_id
            business_name: Category Identifier
            description: >-
              Unique identifier for a product category. Primary key for the product_categories dataset.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: category_name
            business_name: Category Name
            description: >-
              Descriptive name of the product category. Analytical dimension for category analysis.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: parent_category_id
            business_name: Parent Category Identifier
            description: >-
              References the parent category in the category hierarchy.
              Foreign key to product_categories.category_id (self-referencing).
              NULL indicates a root-level category with no parent.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
          
          - name: description
            business_name: Description
            description: >-
              Text description providing additional details about the product category.
            sql_type: STRING(255)
          
          - name: is_active
            business_name: Is Active
            description: >-
              Indicates whether the product category is currently active for use.
              Boolean dimension for filtering active vs inactive categories.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: >-
              Identifier of the source system from which the product category record was ingested.
              Technical metadata field for data lineage.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Id
            description: >-
              Identifier of the data load batch that ingested this product category record.
              Technical metadata field for data lineage.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp when the product category record was loaded into the data platform.
              Technical metadata field for data lineage.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: payments
        business_name: Payments
        description: >-
          Contains payment transaction data with one row per payment transaction.
          Includes payment identification, order reference, payment method, status, amount, currency, transaction reference, gateway, and payment timestamp.
          This dataset represents the analytical grain of individual payment transactions and supports payment and cash flow analysis.
        source: ecom_bronze.payments
        primary_key:
          - payment_id
        fields:
          - name: payment_id
            business_name: Payment Identifier
            description: >-
              Unique identifier for a payment transaction. Primary key for the payments dataset.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: order_id
            business_name: Order Identifier
            description: >-
              References the related order for which the payment was made. Foreign key to orders.order_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: payment_method
            business_name: Payment Method
            description: >-
              Method used to pay for the order, such as credit card, PayPal, or bank transfer.
              Analytical dimension for payment method analysis.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: payment_status
            business_name: Payment Status
            description: >-
              Indicates the current processing status of the payment (e.g., Captured, Pending, Failed).
              Analytical dimension for payment status analysis and filtering.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: amount
            business_name: Amount
            description: >-
              Monetary amount paid in the transaction.
              Measure for payment amount analysis.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: currency
            business_name: Currency
            description: >-
              Currency code used for the payment amount.
              Analytical dimension for currency analysis.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: transaction_ref
            business_name: Transaction Ref
            description: >-
              Reference identifier provided by the payment gateway or processor for the transaction. Marked as PII.
            sql_type: STRING(255)
            constraints:
              - PII
          
          - name: gateway
            business_name: Gateway
            description: >-
              Name of the payment gateway or processor handling the transaction.
              Analytical dimension for payment gateway analysis.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: paid_at
            business_name: Paid At
            description: >-
              Timestamp recording when the payment was completed.
              Time dimension for payment timing analysis and cash flow analysis.
            sql_type: TIMESTAMP(29,9)
            dimension:
              is_time: true
          
          - name: _source_system
            business_name: Source System
            description: >-
              Identifier of the source system from which the payment record was ingested.
              Technical metadata field for data lineage.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Id
            description: >-
              Identifier of the data load batch that ingested this payment record.
              Technical metadata field for data lineage.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp when the payment record was loaded into the data platform.
              Technical metadata field for data lineage.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: shipments
        business_name: Shipments
        description: >-
          Contains shipment data with one row per shipment.
          Includes shipment identification, order reference, carrier, tracking number, status, shipment and delivery timestamps, and delivery address.
          This dataset represents the analytical grain of individual shipments and supports fulfillment and delivery performance analysis.
        source: ecom_bronze.shipments
        primary_key:
