          - name: _batch_id
            business_name: Batch Id
            description: >-
              Identifier of the data load batch that ingested this shipment record.
              Technical metadata field for data lineage.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp when the shipment record was loaded into the data platform.
              Technical metadata field for data lineage.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

    relationships:
      - name: orders_to_customers
        left_dataset: orders
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Many orders belong to one customer. Join orders to customers using orders.customer_id = customers.customer_id.
          This relationship enables customer-level analysis of orders and revenue.
      
      - name: order_items_to_orders
        left_dataset: order_items
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Many order items belong to one order. Join order_items to orders using order_items.order_id = orders.order_id.
          This relationship enables order-level context for line items.
          CRITICAL: When joining order_items to orders, do not sum order-level measures (orders.total_amount, orders.subtotal, 
          orders.discount_amount, orders.tax_amount, orders.shipping_fee) as this will cause double-counting.
          Use order_items.line_total for product-level revenue analysis.
      
      - name: order_items_to_products
        left_dataset: order_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        resolution: >-
          Many order items reference one product. Join order_items to products using order_items.product_id = products.product_id.
          This relationship enables product-level analysis of sales and revenue.
      
      - name: products_to_product_categories
        left_dataset: products
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Many products belong to one product category. Join products to product_categories using products.category_id = product_categories.category_id.
          This relationship enables category-level analysis of products and sales.
      
      - name: product_categories_hierarchy
        left_dataset: product_categories
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - parent_category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Self-referencing hierarchical relationship. Each product category may have a parent category.
          Join product_categories to itself using product_categories.parent_category_id = product_categories.category_id.
          Root-level categories have NULL parent_category_id.
          This relationship enables category hierarchy traversal using recursive queries.
          Use recursive CTEs to build the full category hierarchy path and calculate hierarchy levels.
      
      - name: payments_to_orders
        left_dataset: payments
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Many payments can be associated with one order. Join payments to orders using payments.order_id = orders.order_id.
          This relationship enables payment analysis in the context of orders.
      
      - name: shipments_to_orders
        left_dataset: shipments
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Many shipments can be associated with one order. Join shipments to orders using shipments.order_id = orders.order_id.
          This relationship enables shipment and fulfillment analysis in the context of orders.

    metrics:
      - name: total_revenue
        business_name: Total Revenue
        description: >-
          Total revenue from all orders including taxes, shipping, and after discounts.
          Calculated as the sum of orders.total_amount.
          This is an order-level metric and should be calculated from the orders dataset.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.total_amount) AS total_revenue
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.total_amount
      
      - name: total_subtotal
        business_name: Total Subtotal
        description: >-
          Total pre-tax, pre-shipping revenue from all orders before discounts are applied.
          Calculated as the sum of orders.subtotal.
          This is an order-level metric.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.subtotal) AS total_subtotal
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.subtotal
      
      - name: total_discount_amount
        business_name: Total Discount Amount
        description: >-
          Total monetary discounts applied across all orders.
          Calculated as the sum of orders.discount_amount.
          This is an order-level metric.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.discount_amount) AS total_discount_amount
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.discount_amount
      
      - name: total_tax_amount
        business_name: Total Tax Amount
        description: >-
          Total tax collected across all orders.
          Calculated as the sum of orders.tax_amount.
          This is an order-level metric.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.tax_amount) AS total_tax_amount
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.tax_amount
      
      - name: total_shipping_fee
        business_name: Total Shipping Fee
        description: >-
          Total shipping fees collected across all orders.
          Calculated as the sum of orders.shipping_fee.
          This is an order-level metric.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(orders.shipping_fee) AS total_shipping_fee
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.shipping_fee
      
      - name: order_count
        business_name: Order Count
        description: >-
          Total number of orders.
          Calculated as the count of distinct orders.order_id.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT orders.order_id) AS order_count
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.order_id
      
      - name: customer_count
        business_name: Customer Count
        description: >-
          Total number of customers.
          Calculated as the count of distinct customers.customer_id.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT customers.customer_id) AS customer_count
                FROM ecom_bronze.customers AS customers
              columns_used:
                - customers.customer_id
      
      - name: product_count
        business_name: Product Count
        description: >-
          Total number of products in the catalog.
          Calculated as the count of distinct products.product_id.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT products.product_id) AS product_count
                FROM ecom_bronze.products AS products
              columns_used:
                - products.product_id
      
      - name: units_sold
        business_name: Units Sold
        description: >-
          Total number of product units sold across all order items.
          Calculated as the sum of order_items.quantity.
          This is an order-item-level metric.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.quantity) AS units_sold
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.quantity
      
      - name: average_order_value
        business_name: Average Order Value
        description: >-
          Average total amount per order.
          Calculated as total revenue divided by order count.
          Uses orders.total_amount and orders.order_id.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT orders.order_id) = 0 THEN 0
                    ELSE SUM(orders.total_amount) / COUNT(DISTINCT orders.order_id)
                  END AS average_order_value
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.total_amount
                - orders.order_id
      
      - name: average_discount_percentage
        business_name: Average Discount Percentage
        description: >-
          Average discount percentage applied across all order items.
          Calculated as the average of order_items.discount_pct.
          This is an order-item-level metric.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(order_items.discount_pct) AS average_discount_percentage
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.discount_pct
      
      - name: product_line_revenue
        business_name: Product Line Revenue
        description: >-
          Total revenue at the order line item level.
          Calculated as the sum of order_items.line_total.
          This is an order-item-level metric and should be used for product-level revenue analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(order_items.line_total) AS product_line_revenue
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.line_total
      
      - name: revenue_by_customer
        business_name: Revenue By Customer
        description: >-
          Total revenue per customer.
          Calculated as the sum of orders.total_amount grouped by customer.
          Result grain is one row per customer.
        return_type: DECIMAL
        result_grain: one row per customer
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  customers.customer_id,
                  customers.first_name,
                  customers.last_name,
                  SUM(orders.total_amount) AS revenue_by_customer
                FROM ecom_bronze.orders AS orders
                JOIN ecom_bronze.customers AS customers
                  ON orders.customer_id = customers.customer_id
                GROUP BY
                  customers.customer_id,
                  customers.first_name,
                  customers.last_name
              columns_used:
                - orders.total_amount
                - orders.customer_id
                - customers.customer_id
                - customers.first_name
                - customers.last_name
      
      - name: revenue_by_product
        business_name: Revenue By Product
        description: >-
          Total revenue per product.
          Calculated as the sum of order_items.line_total grouped by product.
          Result grain is one row per product.
        return_type: DECIMAL
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  products.product_id,
                  products.product_name,
                  SUM(order_items.line_total) AS revenue_by_product
                FROM ecom_bronze.order_items AS order_items
                JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
                GROUP BY
                  products.product_id,
                  products.product_name
              columns_used:
                - order_items.line_total
                - order_items.product_id
                - products.product_id
                - products.product_name
      
      - name: revenue_by_category
        business_name: Revenue By Category
        description: >-
          Total revenue per product category.
          Calculated as the sum of order_items.line_total grouped by product category.
          Result grain is one row per category.
        return_type: DECIMAL
        result_grain: one row per category
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  product_categories.category_id,
                  product_categories.category_name,
                  SUM(order_items.line_total) AS revenue_by_category
                FROM ecom_bronze.order_items AS order_items
                JOIN ecom_bronze.products AS products
                  ON order_items.product_id = products.product_id
                JOIN ecom_bronze.product_categories AS product_categories
                  ON products.category_id = product_categories.category_id
                GROUP BY
                  product_categories.category_id,
                  product_categories.category_name
              columns_used:
                - order_items.line_total
                - order_items.product_id
                - products.product_id
                - products.category_id
                - product_categories.category_id
                - product_categories.category_name
      
      - name: orders_per_customer
        business_name: Orders Per Customer
        description: >-
          Average number of orders per customer.
          Calculated as total order count divided by total customer count.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  CASE
                    WHEN COUNT(DISTINCT customers.customer_id) = 0 THEN 0
                    ELSE CAST(COUNT(DISTINCT orders.order_id) AS DECIMAL) / COUNT(DISTINCT customers.customer_id)
                  END AS orders_per_customer
                FROM ecom_bronze.orders AS orders
                JOIN ecom_bronze.customers AS customers
                  ON orders.customer_id = customers.customer_id
              columns_used:
                - orders.order_id
                - orders.customer_id
                - customers.customer_id
      
      - name: revenue_by_sales_channel
        business_name: Revenue By Sales Channel
        description: >-
          Total revenue per sales channel.
          Calculated as the sum of orders.total_amount grouped by sales channel.
          Result grain is one row per sales channel.
        return_type: DECIMAL
        result_grain: one row per sales channel
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  orders.sales_channel,
                  SUM(orders.total_amount) AS revenue_by_sales_channel
                FROM ecom_bronze.orders AS orders
                GROUP BY orders.sales_channel
              columns_used:
                - orders.sales_channel
                - orders.total_amount
      
      - name: revenue_by_order_status
        business_name: Revenue By Order Status
        description: >-
          Total revenue per order status.
          Calculated as the sum of orders.total_amount grouped by order status.
          Result grain is one row per order status.
        return_type: DECIMAL
        result_grain: one row per order status
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  orders.order_status,
                  SUM(orders.total_amount) AS revenue_by_order_status
                FROM ecom_bronze.orders AS orders
                GROUP BY orders.order_status
              columns_used:
                - orders.order_status
                - orders.total_amount
      
      - name: payment_count
        business_name: Payment Count
        description: >-
          Total number of payment transactions.
          Calculated as the count of distinct payments.payment_id.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT payments.payment_id) AS payment_count
                FROM ecom_bronze.payments AS payments
              columns_used:
                - payments.payment_id
      
      - name: total_payment_amount
        business_name: Total Payment Amount
        description: >-
          Total payment amount across all payment transactions.
          Calculated as the sum of payments.amount.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(payments.amount) AS total_payment_amount
                FROM ecom_bronze.payments AS payments
              columns_used:
                - payments.amount
      
      - name: payment_amount_by_method
        business_name: Payment Amount By Method
        description: >-
          Total payment amount per payment method.
          Calculated as the sum of payments.amount grouped by payment method.
          Result grain is one row per payment method.
        return_type: DECIMAL
        result_grain: one row per payment method
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  payments.payment_method,
                  SUM(payments.amount) AS payment_amount_by_method
                FROM ecom_bronze.payments AS payments
                GROUP BY payments.payment_method
              columns_used:
                - payments.payment_method
                - payments.amount
      
      - name: shipment_count
        business_name: Shipment Count
        description: >-
          Total number of shipments.
          Calculated as the count of distinct shipments.shipment_id.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  COUNT(DISTINCT shipments.shipment_id) AS shipment_count
                FROM ecom_bronze.shipments AS shipments
              columns_used:
                - shipments.shipment_id
      
      - name: shipment_count_by_carrier
        business_name: Shipment Count By Carrier
        description: >-
          Total number of shipments per carrier.
          Calculated as the count of distinct shipments.shipment_id grouped by carrier.
          Result grain is one row per carrier.
        return_type: INTEGER
        result_grain: one row per carrier
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  shipments.carrier,
                  COUNT(DISTINCT shipments.shipment_id) AS shipment_count_by_carrier
                FROM ecom_bronze.shipments AS shipments
                GROUP BY shipments.carrier
              columns_used:
                - shipments.carrier
                - shipments.shipment_id
      
      - name: shipment_count_by_status
        business_name: Shipment Count By Status
        description: >-
          Total number of shipments per shipment status.
          Calculated as the count of distinct shipments.shipment_id grouped by shipment status.
          Result grain is one row per shipment status.
        return_type: INTEGER
        result_grain: one row per shipment status
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  shipments.shipment_status,
                  COUNT(DISTINCT shipments.shipment_id) AS shipment_count_by_status
                FROM ecom_bronze.shipments AS shipments
                GROUP BY shipments.shipment_status
              columns_used:
                - shipments.shipment_status
                - shipments.shipment_id
      
      - name: monthly_revenue
        business_name: Monthly Revenue
        description: >-
          Total revenue per month based on order date.
          Calculated as the sum of orders.total_amount grouped by month.
          Result grain is one row per month.
        return_type: DECIMAL
        result_grain: one row per month
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  DATE_TRUNC('MONTH', orders.order_date) AS order_month,
                  SUM(orders.total_amount) AS monthly_revenue
                FROM ecom_bronze.orders AS orders
                GROUP BY DATE_TRUNC('MONTH', orders.order_date)
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.total_amount
      
      - name: revenue_by_customer_segment
        business_name: Revenue By Customer Segment
        description: >-
          Total revenue per customer segment.
          Calculated as the sum of orders.total_amount grouped by customer segment.
          Result grain is one row per customer segment.
        return_type: DECIMAL
        result_grain: one row per customer segment
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  customers.customer_segment,
                  SUM(orders.total_amount) AS revenue_by_customer_segment
                FROM ecom_bronze.orders AS orders
                JOIN ecom_bronze.customers AS customers
                  ON orders.customer_id = customers.customer_id
                GROUP BY customers.customer_segment
              columns_used:
                - orders.total_amount
                - orders.customer_id
                - customers.customer_id
                - customers.customer_segment
      
      - name: average_delivery_time_days
        business_name: Average Delivery Time Days
        description: >-
          Average number of days between shipment and delivery.
          Calculated as the average difference in days between shipments.delivered_at and shipments.shipped_at.
          Only includes shipments where both shipped_at and delivered_at are not null.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  AVG(DATEDIFF(shipments.delivered_at, shipments.shipped_at)) AS average_delivery_time_days
                FROM ecom_bronze.shipments AS shipments
                WHERE shipments.shipped_at IS NOT NULL
                  AND shipments.delivered_at IS NOT NULL
              columns_used:
                - shipments.shipped_at
                - shipments.delivered_at
      
      - name: total_inventory_value
        business_name: Total Inventory Value
        description: >-
          Total value of current inventory based on cost price.
          Calculated as the sum of (products.stock_quantity * products.cost_price).
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                  SUM(products.stock_quantity * products.cost_price) AS total_inventory_value
                FROM ecom_bronze.products AS products
                WHERE products.cost_price IS NOT NULL
              columns_used:
                - products.stock_quantity
                - products.cost_price