      - name: average_delivery_time_days
        business_name: Average Delivery Time (Days)
        description: >-
          Average delivery time in days from shipment to delivery. Calculated as the average of 
          (shipments.delivered_at - shipments.shipped_at) converted to days. Only includes completed 
          shipments with both shipped_at and delivered_at timestamps. Use this metric for delivery 
          performance tracking and customer satisfaction analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    AVG(DATEDIFF(shipments.delivered_at, shipments.shipped_at)) AS average_delivery_time_days
                FROM ecom_bronze.shipments AS shipments
                WHERE shipments.shipped_at IS NOT NULL
                    AND shipments.delivered_at IS NOT NULL
              columns_used:
                - shipments.delivered_at
                - shipments.shipped_at
      
      - name: product_count
        business_name: Product Count
        description: >-
          Total number of products in the catalog. Calculated as the count of distinct products.product_id. 
          Use this metric for catalog size tracking and product portfolio management.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(DISTINCT products.product_id) AS product_count
                FROM ecom_bronze.products AS products
              columns_used:
