      - name: shipments_by_carrier
        business_name: Shipments by Carrier
        description: >-
          Shipment count grouped by carrier. Calculated as the count of distinct shipments.shipment_id 
          grouped by shipments.carrier. Use this metric for carrier performance analysis and 
          logistics partner optimization.
        return_type: BIGINT
        result_grain: one row per carrier
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    shipments.carrier,
                    COUNT(DISTINCT shipments.shipment_id) AS shipment_count
                FROM ecom_bronze.shipments AS shipments
                GROUP BY shipments.carrier
              columns_used:
