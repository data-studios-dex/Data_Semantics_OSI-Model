      - name: shipments_by_status
        business_name: Shipments by Status
        description: >-
          Shipment count grouped by shipment status. Calculated as the count of distinct 
          shipments.shipment_id grouped by shipments.shipment_status. Use this metric for 
          fulfillment pipeline tracking and delivery performance monitoring.
        return_type: BIGINT
        result_grain: one row per shipment status
        expression:
