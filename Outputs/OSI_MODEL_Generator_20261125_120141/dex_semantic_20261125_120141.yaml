      - name: total_inventory_value
        business_name: Total Inventory Value
        description: >-
          Total value of inventory at cost. Calculated as the sum of (products.stock_quantity * products.cost_price). 
          Use this metric for inventory valuation and working capital analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(products.stock_quantity * products.cost_price) AS total_inventory_value
                FROM ecom_bronze.products AS products
              columns_used:
                - products.stock_quantity
                - products.cost_price