version: "1.0"

semantic_model:
  - name: retail_ecommerce_semantic_model
    description: >-
      Comprehensive semantic model for retail e-commerce analytics covering customers, orders, products, 
      payments, and shipments. This model supports revenue analysis, customer segmentation, product performance, 
      order fulfillment, and payment processing analytics. The model is designed for analytical querying 
      across the complete order-to-cash lifecycle.
    
    ai_context:
      instructions: >-
        # Retail E-Commerce Semantic Model - Query Generation Guide
        
        ## Dataset Grain Reference
        
        - **customers**: One row per customer. Contains customer demographic and segmentation data.
        - **orders**: One row per order. Contains order-level totals and shipping information.
        - **order_items**: One row per order line item. Contains product-level order details.
        - **products**: One row per product. Contains product catalog information.
        - **product_categories**: One row per product category. Contains hierarchical category structure.
        - **payments**: One row per payment transaction. Contains payment processing details.
        - **shipments**: One row per shipment. Contains shipping and delivery tracking information.
        
        ## Critical Double-Counting Prevention
        
        ### Order-Level vs Line-Level Metrics
        
        **IMPORTANT**: Orders and order_items have different grains. An order can have multiple order items.
        
        - **Order-level revenue**: Use `orders.total_amount` - represents the complete order total including all items, taxes, shipping, and discounts.
        - **Line-level revenue**: Use `order_items.line_total` - represents revenue for individual product lines.
        
        **DO NOT** sum `orders.total_amount` after joining orders to order_items. This will duplicate the order total for each line item.
        
        **DO NOT** sum `orders.subtotal`, `orders.discount_amount`, `orders.tax_amount`, or `orders.shipping_fee` after joining to order_items.
        
        ### Correct Usage Patterns
        
        - For **total revenue by customer**: Join customers to orders, sum `orders.total_amount`.
        - For **revenue by product**: Join order_items to products, sum `order_items.line_total`.
        - For **revenue by product category**: Join order_items to products to product_categories, sum `order_items.line_total`.
        - For **order count**: Count distinct `orders.order_id`.
        - For **items sold**: Sum `order_items.quantity`.
        
        ## Join Guidance
        
        ### Standard Relationships
        
        - **customers → orders**: `customers.customer_id = orders.customer_id` (one-to-many)
        - **orders → order_items**: `orders.order_id = order_items.order_id` (one-to-many)
        - **orders → payments**: `orders.order_id = payments.order_id` (one-to-many, typically one-to-one)
        - **orders → shipments**: `orders.order_id = shipments.order_id` (one-to-many, typically one-to-one)
        - **order_items → products**: `order_items.product_id = products.product_id` (many-to-one)
        - **products → product_categories**: `products.category_id = product_categories.category_id` (many-to-one)
        
        ### Hierarchical Relationship
        
        - **product_categories → product_categories (parent)**: `product_categories.parent_category_id = product_categories.category_id`
        
        This is a self-referencing hierarchy. To traverse the complete category hierarchy, use recursive queries.
        
        ## Time Analysis Guidance
        
        ### Date Fields and Their Usage
        
        - **customers.registration_date**: Use for customer acquisition analysis, cohort analysis.
        - **orders.order_date**: Primary date for revenue, order, and sales analysis. Use for time-series revenue metrics.
        - **payments.paid_at**: Use for payment processing and cash flow analysis.
        - **shipments.shipped_at**: Use for fulfillment and shipping performance analysis.
        - **shipments.delivered_at**: Use for delivery performance and customer satisfaction analysis.
        - **products.created_at**: Use for product launch and catalog growth analysis.
        
        ### Time-Series Analysis
        
        For period-based analysis (monthly, quarterly, yearly), use `DATE_TRUNC()` or equivalent Databricks functions 
        on the appropriate date field.
        
        ## Metric Selection Guidance
        
        ### Revenue Metrics
        
        - **Total Revenue**: Sum of `orders.total_amount` - includes all order components.
        - **Subtotal Revenue**: Sum of `orders.subtotal` - excludes taxes and shipping.
        - **Line Revenue**: Sum of `order_items.line_total` - product-level revenue.
        - **Gross Profit**: Sum of `order_items.line_total` - sum of (`order_items.quantity` * `products.cost_price`).
        
        ### Customer Metrics
        
        - **Customer Count**: Count distinct `customers.customer_id`.
        - **Active Customer Count**: Count distinct `customers.customer_id` where `customers.is_active = true`.
        - **Orders per Customer**: Count of orders / count of distinct customers.
        
        ### Product Metrics
        
        - **Units Sold**: Sum of `order_items.quantity`.
        - **Average Selling Price**: Sum of `order_items.line_total` / sum of `order_items.quantity`.
        - **Product Count**: Count distinct `products.product_id`.
        
        ### Order Metrics
        
        - **Order Count**: Count distinct `orders.order_id`.
        - **Average Order Value**: Sum of `orders.total_amount` / count distinct `orders.order_id`.
        
        ### Fulfillment Metrics
        
        - **Shipment Count**: Count distinct `shipments.shipment_id`.
        - **Delivery Time**: `shipments.delivered_at` - `shipments.shipped_at`.
        
        ## Dimensional Analysis
        
        ### Customer Segmentation
        
        Use `customers.customer_segment` to analyze revenue, orders, and behavior by customer tier (Premium, Standard, etc.).
        
        ### Geographic Analysis
        
        - Customer location: `customers.city`, `customers.state`, `customers.country`
        - Shipping destination: `orders.ship_city`, `orders.ship_state` or `shipments.ship_city`, `shipments.ship_state`
        
        ### Product Analysis
        
        - By category: Join through `products.category_id` to `product_categories.category_name`
        - By brand: Use `products.brand`
        - By category hierarchy: Use recursive traversal of `product_categories.parent_category_id`
        
        ### Channel Analysis
        
        Use `orders.sales_channel` to analyze performance by sales channel (Online, Store, Mobile, etc.).
        
        ### Status Analysis
        
        - Order status: `orders.order_status` (Shipped, Pending, Cancelled, Delivered, etc.)
        - Payment status: `payments.payment_status` (Completed, Pending, Failed, etc.)
        - Shipment status: `shipments.shipment_status` (In Transit, Delivered, Pending, etc.)
        
        ## Formula and Calculation Guidance
        
        ### Discount Calculations
        
        - **Line-level discount amount**: `order_items.quantity` * `order_items.unit_price` * (`order_items.discount_pct` / 100)
        - **Order-level discount**: Use `orders.discount_amount` directly.
        
        ### Profit Calculations
        
        - **Line-level profit**: `order_items.line_total` - (`order_items.quantity` * `products.cost_price`)
        - **Gross margin %**: (Revenue - Cost) / Revenue * 100
        
        ### Average Calculations
        
        - **Average Order Value**: Total revenue / order count (use ratio of aggregates, not AVG of order amounts)
        - **Average Selling Price**: Total line revenue / total quantity sold
        
        ## Query Restrictions and Considerations
        
        ### PII Fields
        
        The following fields contain personally identifiable information and may require special handling:
        - `customers.first_name`, `customers.last_name`, `customers.email`, `customers.phone`, `customers.date_of_birth`
        - `payments.transaction_ref`
        - `orders.tax_amount`
        
        ### Currency Handling
        
        All monetary amounts in this model are in the currency specified by the `currency` field (typically USD). 
        Multi-currency analysis requires currency conversion logic not included in this base model.
        
        ### Active Records
        
        - Filter `customers.is_active = true` for current active customer analysis.
        - Filter `products.is_active = true` for current product catalog analysis.
        - Filter `product_categories.is_active = true` for current category analysis.
        
        ### Null Handling
        
        - Optional fields may contain NULL values. Use appropriate NULL handling in aggregations.
        - `product_categories.parent_category_id` is NULL for top-level categories.
        
        ## Recommended Query Patterns
        
        ### Revenue by Customer Segment
        ```
        SELECT 
            c.customer_segment,
            SUM(o.total_amount) as total_revenue
        FROM customers c
        JOIN orders o ON c.customer_id = o.customer_id
        GROUP BY c.customer_segment
        ```
        
        ### Revenue by Product Category
        ```
        SELECT 
            pc.category_name,
            SUM(oi.line_total) as total_revenue
        FROM order_items oi
        JOIN products p ON oi.product_id = p.product_id
        JOIN product_categories pc ON p.category_id = pc.category_id
        GROUP BY pc.category_name
        ```
        
        ### Monthly Revenue Trend
        ```
        SELECT 
            DATE_TRUNC('month', o.order_date) as order_month,
            SUM(o.total_amount) as total_revenue
        FROM orders o
        GROUP BY DATE_TRUNC('month', o.order_date)
        ORDER BY order_month
        ```
    
    datasets:
      - name: customers
        business_name: Customers
        description: >-
          Customer master data containing one row per customer. Includes customer demographics, 
          contact information, geographic location, segmentation, and account status. 
          This dataset is the foundation for customer-centric analysis including customer acquisition, 
          retention, segmentation, and lifetime value analysis.
        source: ecom_bronze.customers
        primary_key:
          - customer_id
        fields:
          - name: customer_id
            business_name: Customer Identifier
            description: >-
              Unique identifier for a customer. Primary key for the customers dataset.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: customer_code
            business_name: Customer Code
            description: >-
              Business reference code assigned to the customer. Used for external system integration 
              and customer identification in business processes.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: first_name
            business_name: First Name
            description: >-
              First name of the customer. Contains personally identifiable information (PII).
            sql_type: STRING
            constraints:
              - NOT NULL
              - PII
          
          - name: last_name
            business_name: Last Name
            description: >-
              Last name of the customer. Contains personally identifiable information (PII).
            sql_type: STRING
            constraints:
              - NOT NULL
              - PII
          
          - name: email
            business_name: Email
            description: >-
              Email address of the customer. Contains personally identifiable information (PII). 
              Used for customer communication and account identification.
            sql_type: STRING
            constraints:
              - NOT NULL
              - PII
          
          - name: phone
            business_name: Phone
            description: >-
              Phone number of the customer. Contains personally identifiable information (PII).
            sql_type: STRING
            constraints:
              - PII
          
          - name: gender
            business_name: Gender
            description: >-
              Gender of the customer. Categorical dimension for demographic analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: date_of_birth
            business_name: Date Of Birth
            description: >-
              Date of birth of the customer. Contains personally identifiable information (PII). 
              Can be used to derive customer age for demographic analysis.
            sql_type: DATE
            constraints:
              - PII
            dimension:
              is_time: true
          
          - name: city
            business_name: City
            description: >-
              City where the customer resides. Geographic dimension for location-based analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: state
            business_name: State
            description: >-
              State or province where the customer resides. Geographic dimension for regional analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: country
            business_name: Country
            description: >-
              Country where the customer resides. Geographic dimension for international analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: postal_code
            business_name: Postal Code
            description: >-
              Postal or ZIP code of the customer's address. Geographic dimension for detailed location analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: customer_segment
            business_name: Customer Segment
            description: >-
              Indicates the current segment classification of the customer (e.g., Premium, Standard, Basic). 
              Key dimension for customer segmentation analysis and targeted marketing.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: registration_date
            business_name: Registration Date
            description: >-
              Date when the customer registered. Time dimension for customer acquisition analysis, 
              cohort analysis, and customer lifecycle tracking.
            sql_type: DATE
            dimension:
              is_time: true
          
          - name: is_active
            business_name: Is Active
            description: >-
              Indicates whether the customer account is currently active. Boolean dimension for 
              filtering active vs inactive customers.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: >-
              Name of the source system from which the record originated. Metadata field for data lineage.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ETL batch that loaded this record. Metadata field for data lineage and debugging.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp recording when the record was loaded into the table. Metadata field for data freshness tracking.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: orders
        business_name: Orders
        description: >-
          Order header data containing one row per order. Includes order identification, customer reference, 
          order date, status, sales channel, shipping destination, and order-level financial totals 
          (subtotal, discounts, taxes, shipping fees, and total amount). This dataset is the primary fact table 
          for order-level revenue analysis, order fulfillment tracking, and customer purchasing behavior analysis. 
          IMPORTANT: Order-level totals should not be summed after joining to order_items to avoid double-counting.
        source: ecom_bronze.orders
        primary_key:
          - order_id
        fields:
          - name: order_id
            business_name: Order Identifier
            description: >-
              Unique identifier for an order. Primary key for the orders dataset.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_number
            business_name: Order Number
            description: >-
              Business reference number assigned to the order. Human-readable order identifier used in 
              customer communications and business processes.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: customer_id
            business_name: Customer ID
            description: >-
              References the related customer record. Foreign key to customers.customer_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: order_date
            business_name: Order Date
            description: >-
              Timestamp recording when the order was placed. Primary time dimension for order and revenue analysis. 
              Use this field for time-series revenue metrics, period-based aggregations, and trend analysis.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: order_status
            business_name: Order Status
            description: >-
              Indicates the current status of the order (e.g., Shipped, Pending, Cancelled, Delivered). 
              Key dimension for order lifecycle analysis and fulfillment tracking.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: sales_channel
            business_name: Sales Channel
            description: >-
              Indicates the channel through which the order was placed (e.g., Online, Store, Mobile, Phone). 
              Key dimension for channel performance analysis and omnichannel strategy.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: ship_city
            business_name: Ship City
            description: >-
              City to which the order is shipped. Geographic dimension for shipping destination analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: ship_state
            business_name: Ship State
            description: >-
              State or province to which the order is shipped. Geographic dimension for regional shipping analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: >-
              Postal or ZIP code to which the order is shipped. Geographic dimension for detailed shipping location analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: subtotal
            business_name: Subtotal
            description: >-
              Monetary amount representing the order subtotal before discounts and taxes. 
              Order-level measure. Do not sum after joining to order_items.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              aggregation_grain: order
          
          - name: discount_amount
            business_name: Discount Amount
            description: >-
              Monetary amount representing the total discount applied to the order. 
              Order-level measure. Do not sum after joining to order_items.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              aggregation_grain: order
          
          - name: tax_amount
            business_name: Tax Amount
            description: >-
              Monetary amount representing the tax charged on the order. Contains PII in some jurisdictions. 
              Order-level measure. Do not sum after joining to order_items.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
              - PII
            measure:
              aggregation: SUM
              aggregation_grain: order
          
          - name: shipping_fee
            business_name: Shipping Fee
            description: >-
              Monetary amount representing the shipping cost for the order. 
              Order-level measure. Do not sum after joining to order_items.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              aggregation_grain: order
          
          - name: total_amount
            business_name: Total Amount
            description: >-
              Monetary amount representing the final total of the order including all items, discounts, taxes, and shipping. 
              This is the primary revenue measure at order grain. Order-level measure. Do not sum after joining to order_items.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              aggregation_grain: order
          
          - name: currency
            business_name: Currency
            description: >-
              Currency code for the order amounts (e.g., USD, EUR, GBP). Dimension for multi-currency analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: >-
              Name of the source system from which the record originated. Metadata field for data lineage.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ETL batch that loaded this record. Metadata field for data lineage and debugging.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp recording when the record was loaded into the table. Metadata field for data freshness tracking.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: order_items
        business_name: Order Items
        description: >-
          Order line item data containing one row per order line item. Includes order reference, product reference, 
          line number, quantity, unit price, discount percentage, and line total. This dataset represents the 
          product-level detail of orders and is the primary fact table for product-level revenue analysis, 
          units sold analysis, and product performance tracking. Use this dataset for product and category analysis.
        source: ecom_bronze.order_items
        primary_key:
          - order_item_id
        fields:
          - name: order_item_id
            business_name: Order Item Identifier
            description: >-
              Unique identifier for an order line item. Primary key for the order_items dataset.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: >-
              References the related order record. Foreign key to orders.order_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: line_number
            business_name: Line Number
            description: >-
              Sequential line number within the order. Indicates the position of this item in the order.
            sql_type: INT
            constraints:
              - NOT NULL
          
          - name: product_id
            business_name: Product ID
            description: >-
              References the related product record. Foreign key to products.product_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: quantity
            business_name: Quantity
            description: >-
              Number of units ordered for this line item. Measure for units sold analysis.
            sql_type: INT
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: unit_price
            business_name: Unit Price
            description: >-
              Monetary amount representing the price per unit. Used for pricing analysis and 
              average selling price calculations.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
          
          - name: discount_pct
            business_name: Discount Pct
            description: >-
              Percentage discount applied to the line item. Used for discount analysis and 
              promotional effectiveness tracking.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
          
          - name: line_total
            business_name: Line Total
            description: >-
              Monetary amount representing the total for this line item after applying discounts. 
              This is the primary revenue measure at line item grain. Use this for product-level and 
              category-level revenue analysis.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: _source_system
            business_name: Source System
            description: >-
              Name of the source system from which the record originated. Metadata field for data lineage.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ETL batch that loaded this record. Metadata field for data lineage and debugging.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp recording when the record was loaded into the table. Metadata field for data freshness tracking.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: products
        business_name: Products
        description: >-
          Product master data containing one row per product. Includes product identification, SKU, name, 
          category reference, brand, description, pricing (unit price and cost price), currency, inventory quantity, 
          and active status. This dataset is the foundation for product catalog analysis, pricing analysis, 
          inventory management, and product profitability analysis.
        source: ecom_bronze.products
        primary_key:
          - product_id
        fields:
          - name: product_id
            business_name: Product Identifier
            description: >-
              Unique identifier for a product. Primary key for the products dataset.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: sku
            business_name: SKU
            description: >-
              Stock keeping unit code for the product. Business identifier used for inventory management 
              and product identification.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: product_name
            business_name: Product Name
            description: >-
              Name of the product. Primary product descriptor for reporting and analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: category_id
            business_name: Category ID
            description: >-
              References the related product category record. Foreign key to product_categories.category_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: brand
            business_name: Brand
            description: >-
              Brand name of the product. Dimension for brand performance analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: description
            business_name: Description
            description: >-
              Detailed description of the product. Provides additional product context.
            sql_type: STRING
          
          - name: unit_price
            business_name: Unit Price
            description: >-
              Monetary amount representing the selling price per unit. Current list price for the product.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
          
          - name: cost_price
            business_name: Cost Price
            description: >-
              Monetary amount representing the cost per unit. Used for profitability and margin analysis.
            sql_type: DECIMAL
            measure:
              aggregation: AVG
          
          - name: currency
            business_name: Currency
            description: >-
              Currency code for the product prices (e.g., USD, EUR, GBP). Dimension for multi-currency analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: stock_quantity
            business_name: Stock Quantity
            description: >-
              Current inventory quantity available for the product. Measure for inventory analysis.
            sql_type: INT
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: is_active
            business_name: Is Active
            description: >-
              Indicates whether the product is currently active for sale. Boolean dimension for 
              filtering active vs discontinued products.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: created_at
            business_name: Created At
            description: >-
              Timestamp recording when the product was created in the system. Time dimension for 
              product launch analysis and catalog growth tracking.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: _source_system
            business_name: Source System
            description: >-
              Name of the source system from which the record originated. Metadata field for data lineage.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ETL batch that loaded this record. Metadata field for data lineage and debugging.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp recording when the record was loaded into the table. Metadata field for data freshness tracking.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: product_categories
        business_name: Product Categories
        description: >-
          Product category master data containing one row per product category. Includes category identification, 
          name, parent category reference (for hierarchical structure), description, and active status. 
          This dataset supports hierarchical product categorization and enables category-level product analysis. 
          The parent_category_id creates a self-referencing hierarchy allowing multi-level category structures.
        source: ecom_bronze.product_categories
        primary_key:
          - category_id
        fields:
          - name: category_id
            business_name: Category Identifier
            description: >-
              Unique identifier for a product category. Primary key for the product_categories dataset.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: category_name
            business_name: Category Name
            description: >-
              Name of the product category. Primary category descriptor for reporting and analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: parent_category_id
            business_name: Parent Category ID
            description: >-
              References the parent category in the hierarchy. Foreign key to product_categories.category_id. 
              NULL for top-level categories. This self-referencing relationship enables hierarchical category structures.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
          
          - name: description
            business_name: Description
            description: >-
              Detailed description of the product category. Provides additional category context.
            sql_type: STRING
          
          - name: is_active
            business_name: Is Active
            description: >-
              Indicates whether the category is currently active. Boolean dimension for filtering 
              active vs inactive categories.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: >-
              Name of the source system from which the record originated. Metadata field for data lineage.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ETL batch that loaded this record. Metadata field for data lineage and debugging.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp recording when the record was loaded into the table. Metadata field for data freshness tracking.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: payments
        business_name: Payments
        description: >-
          Payment transaction data containing one row per payment transaction. Includes payment identification, 
          order reference, payment method, payment status, amount, currency, transaction reference, payment gateway, 
          and payment timestamp. This dataset supports payment processing analysis, payment method performance, 
          and cash flow analysis. Typically one-to-one with orders but can be one-to-many for split payments.
        source: ecom_bronze.payments
        primary_key:
          - payment_id
        fields:
          - name: payment_id
            business_name: Payment Identifier
            description: >-
              Unique identifier for a payment transaction. Primary key for the payments dataset.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: >-
              References the related order record. Foreign key to orders.order_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: payment_method
            business_name: Payment Method
            description: >-
              Indicates the method used for payment (e.g., Credit Card, Debit Card, PayPal, Bank Transfer). 
              Key dimension for payment method analysis and payment processing optimization.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: payment_status
            business_name: Payment Status
            description: >-
              Indicates the current status of the payment (e.g., Completed, Pending, Failed, Refunded). 
              Key dimension for payment processing analysis and failure tracking.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: amount
            business_name: Amount
            description: >-
              Monetary amount representing the payment value. Measure for payment and cash flow analysis.
            sql_type: DECIMAL
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
          
          - name: currency
            business_name: Currency
            description: >-
              Currency code for the payment amount (e.g., USD, EUR, GBP). Dimension for multi-currency analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: transaction_ref
            business_name: Transaction Ref
            description: >-
              External reference number for the payment transaction. Contains PII. Used for payment reconciliation 
              and dispute resolution.
            sql_type: STRING
            constraints:
              - PII
          
          - name: gateway
            business_name: Gateway
            description: >-
              Name of the payment gateway used to process the transaction (e.g., Stripe, PayPal, Square). 
              Dimension for payment gateway performance analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: paid_at
            business_name: Paid At
            description: >-
              Timestamp recording when the payment was completed. Time dimension for payment processing 
              and cash flow analysis.
            sql_type: TIMESTAMP
            dimension:
              is_time: true
          
          - name: _source_system
            business_name: Source System
            description: >-
              Name of the source system from which the record originated. Metadata field for data lineage.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ETL batch that loaded this record. Metadata field for data lineage and debugging.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp recording when the record was loaded into the table. Metadata field for data freshness tracking.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: shipments
        business_name: Shipments
        description: >-
          Shipment tracking data containing one row per shipment. Includes shipment identification, order reference, 
          carrier, tracking number, shipment status, shipped timestamp, delivered timestamp, and shipping destination. 
          This dataset supports fulfillment analysis, delivery performance tracking, carrier performance analysis, 
          and customer satisfaction metrics. Typically one-to-one with orders but can be one-to-many for split shipments.
        source: ecom_bronze.shipments
        primary_key:
          - shipment_id
        fields:
          - name: shipment_id
            business_name: Shipment Identifier
            description: >-
              Unique identifier for a shipment. Primary key for the shipments dataset.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: >-
              References the related order record. Foreign key to orders.order_id.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: carrier
            business_name: Carrier
            description: >-
              Name of the shipping carrier handling the shipment (e.g., FedEx, UPS, USPS, DHL). 
              Dimension for carrier performance analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: tracking_number
            business_name: Tracking Number
            description: >-
              Tracking number assigned by the carrier for the shipment. Used for shipment tracking 
              and customer service.
            sql_type: STRING
          
          - name: shipment_status
            business_name: Shipment Status
            description: >-
              Indicates the current status of the shipment (e.g., In Transit, Delivered, Pending, Cancelled). 
              Key dimension for fulfillment tracking and delivery performance analysis.
            sql_type: STRING
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: shipped_at
            business_name: Shipped At
            description: >-
              Timestamp recording when the shipment was dispatched. Time dimension for fulfillment 
              and shipping performance analysis.
            sql_type: TIMESTAMP
            dimension:
              is_time: true
          
          - name: delivered_at
            business_name: Delivered At
            description: >-
              Timestamp recording when the shipment was delivered. Time dimension for delivery performance 
              and customer satisfaction analysis.
            sql_type: TIMESTAMP
            dimension:
              is_time: true
          
          - name: ship_city
            business_name: Ship City
            description: >-
              City to which the shipment is being sent. Geographic dimension for shipping destination analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: ship_state
            business_name: Ship State
            description: >-
              State or province to which the shipment is being sent. Geographic dimension for regional shipping analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: >-
              Postal or ZIP code to which the shipment is being sent. Geographic dimension for detailed 
              shipping location analysis.
            sql_type: STRING
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: >-
              Name of the source system from which the record originated. Metadata field for data lineage.
            sql_type: STRING
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: >-
              Identifier of the ETL batch that loaded this record. Metadata field for data lineage and debugging.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: >-
              Timestamp recording when the record was loaded into the table. Metadata field for data freshness tracking.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
    
    relationships:
      - name: orders_to_customers
        left_dataset: orders
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each order belongs to exactly one customer. 
          A customer can have zero or many orders. Join orders to customers to analyze 
          revenue by customer, customer segment, customer location, or customer demographics.
      
      - name: order_items_to_orders
        left_dataset: order_items
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each order item belongs to exactly one order. 
          An order can have one or many order items. CRITICAL: When joining order_items to orders, 
          do NOT sum order-level measures (orders.total_amount, orders.subtotal, orders.discount_amount, 
          orders.tax_amount, orders.shipping_fee) as this will duplicate the order total for each line item. 
          Use order_items.line_total for product-level revenue analysis.
      
      - name: order_items_to_products
        left_dataset: order_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each order item references exactly one product. 
          A product can appear in zero or many order items. Join order_items to products to analyze 
          revenue by product, product brand, product pricing, or to calculate product profitability 
          using products.cost_price.
      
      - name: products_to_product_categories
        left_dataset: products
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each product belongs to exactly one product category. 
          A product category can contain zero or many products. Join products to product_categories 
          to analyze revenue by category or to traverse the category hierarchy.
      
      - name: product_categories_to_parent_category
        left_dataset: product_categories
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - parent_category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Self-referencing hierarchical relationship. Each product category can have a parent category, 
          creating a hierarchical category structure. Top-level categories have parent_category_id = NULL. 
          To traverse the complete category hierarchy, use recursive queries with Databricks recursive CTE syntax. 
          This enables multi-level category rollup analysis (e.g., Electronics > Computers > Laptops).
      
      - name: payments_to_orders
        left_dataset: payments
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each payment transaction references exactly one order. 
          An order can have one or many payment transactions (for split payments or refunds). 
          Typically one-to-one. Join payments to orders to analyze payment methods, payment status, 
          or payment timing relative to order placement.
      
      - name: shipments_to_orders
        left_dataset: shipments
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each shipment references exactly one order. 
          An order can have one or many shipments (for split shipments). Typically one-to-one. 
          Join shipments to orders to analyze fulfillment performance, delivery times, 
          carrier performance, or shipping costs.
    
    metrics:
      - name: total_revenue
        business_name: Total Revenue
        description: >-
          Total revenue across all orders including all order components (items, taxes, shipping, discounts). 
          Calculated as the sum of orders.total_amount. This is the primary top-line revenue metric. 
          Use this metric for overall business performance, revenue trends, and executive reporting.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(orders.total_amount) AS total_revenue
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.total_amount
      
      - name: total_order_count
        business_name: Total Order Count
        description: >-
          Total number of orders placed. Calculated as the count of distinct orders.order_id. 
          Use this metric for order volume analysis, conversion tracking, and operational planning.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(DISTINCT orders.order_id) AS total_order_count
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.order_id
      
      - name: total_units_sold
        business_name: Total Units Sold
        description: >-
          Total number of product units sold across all order items. Calculated as the sum of 
          order_items.quantity. Use this metric for inventory planning, demand forecasting, 
          and product performance analysis.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(order_items.quantity) AS total_units_sold
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.quantity
      
      - name: average_order_value
        business_name: Average Order Value
        description: >-
          Average monetary value per order. Calculated as total revenue divided by total order count. 
          This is a ratio of aggregates, not an average of order amounts. Use this metric for 
          customer value analysis, pricing strategy, and marketing effectiveness.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT orders.order_id) = 0 THEN 0
                        ELSE SUM(orders.total_amount) / COUNT(DISTINCT orders.order_id)
                    END AS average_order_value
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.total_amount
                - orders.order_id
      
      - name: total_line_revenue
        business_name: Total Line Revenue
        description: >-
          Total revenue at order line item grain. Calculated as the sum of order_items.line_total. 
          Use this metric for product-level and category-level revenue analysis. This metric excludes 
          order-level taxes and shipping fees which are not allocated to individual line items.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(order_items.line_total) AS total_line_revenue
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.line_total
      
      - name: total_discount_amount
        business_name: Total Discount Amount
        description: >-
          Total monetary discount amount applied across all orders. Calculated as the sum of 
          orders.discount_amount. Use this metric for promotional effectiveness analysis and 
          margin impact assessment.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(orders.discount_amount) AS total_discount_amount
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.discount_amount
      
      - name: total_shipping_fees
        business_name: Total Shipping Fees
        description: >-
          Total shipping fees collected across all orders. Calculated as the sum of orders.shipping_fee. 
          Use this metric for shipping revenue analysis and logistics cost recovery tracking.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(orders.shipping_fee) AS total_shipping_fees
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.shipping_fee
      
      - name: total_tax_amount
        business_name: Total Tax Amount
        description: >-
          Total tax amount collected across all orders. Calculated as the sum of orders.tax_amount. 
          Use this metric for tax reporting and compliance analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(orders.tax_amount) AS total_tax_amount
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.tax_amount
      
      - name: gross_profit
        business_name: Gross Profit
        description: >-
          Total gross profit calculated as line revenue minus product cost. Calculated as the sum of 
          order_items.line_total minus the sum of (order_items.quantity * products.cost_price). 
          This metric requires joining order_items to products. Use this metric for profitability analysis, 
          product mix optimization, and margin management.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(oi.line_total) - SUM(oi.quantity * p.cost_price) AS gross_profit
                FROM ecom_bronze.order_items AS oi
                INNER JOIN ecom_bronze.products AS p
                    ON oi.product_id = p.product_id
              columns_used:
                - order_items.line_total
                - order_items.quantity
                - products.cost_price
      
      - name: gross_margin_pct
        business_name: Gross Margin Percentage
        description: >-
          Gross margin as a percentage of revenue. Calculated as (line revenue - product cost) / line revenue * 100. 
          Safe division handles zero revenue. This metric requires joining order_items to products. 
          Use this metric for profitability benchmarking, pricing strategy, and product portfolio analysis.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    CASE
                        WHEN SUM(oi.line_total) = 0 THEN 0
                        ELSE (SUM(oi.line_total) - SUM(oi.quantity * p.cost_price)) / SUM(oi.line_total) * 100
                    END AS gross_margin_pct
                FROM ecom_bronze.order_items AS oi
                INNER JOIN ecom_bronze.products AS p
                    ON oi.product_id = p.product_id
              columns_used:
                - order_items.line_total
                - order_items.quantity
                - products.cost_price
      
      - name: average_selling_price
        business_name: Average Selling Price
        description: >-
          Average selling price per unit across all order items. Calculated as total line revenue 
          divided by total quantity sold. This is a ratio of aggregates representing the weighted 
          average selling price. Use this metric for pricing analysis and revenue per unit tracking.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    CASE
                        WHEN SUM(order_items.quantity) = 0 THEN 0
                        ELSE SUM(order_items.line_total) / SUM(order_items.quantity)
                    END AS average_selling_price
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.line_total
                - order_items.quantity
      
      - name: average_discount_pct
        business_name: Average Discount Percentage
        description: >-
          Average discount percentage applied across all order items. Calculated as the average of 
          order_items.discount_pct weighted by line value. Use this metric for promotional analysis 
          and discount strategy optimization.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    AVG(order_items.discount_pct) AS average_discount_pct
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.discount_pct
      
      - name: total_customer_count
        business_name: Total Customer Count
        description: >-
          Total number of customers in the system. Calculated as the count of distinct customers.customer_id. 
          Use this metric for customer base size tracking and market penetration analysis.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(DISTINCT customers.customer_id) AS total_customer_count
                FROM ecom_bronze.customers AS customers
              columns_used:
                - customers.customer_id
      
      - name: active_customer_count
        business_name: Active Customer Count
        description: >-
          Number of active customers. Calculated as the count of distinct customers.customer_id 
          where customers.is_active = true. Use this metric for active customer base tracking 
          and retention analysis.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(DISTINCT customers.customer_id) AS active_customer_count
                FROM ecom_bronze.customers AS customers
                WHERE customers.is_active = true
              columns_used:
                - customers.customer_id
                - customers.is_active
      
      - name: revenue_by_customer_segment
        business_name: Revenue by Customer Segment
        description: >-
          Total revenue grouped by customer segment. Calculated as the sum of orders.total_amount 
          grouped by customers.customer_segment. Use this metric for customer segmentation analysis 
          and targeted marketing strategy.
        return_type: DECIMAL
        result_grain: one row per customer segment
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    c.customer_segment,
                    SUM(o.total_amount) AS revenue
                FROM ecom_bronze.customers AS c
                INNER JOIN ecom_bronze.orders AS o
                    ON c.customer_id = o.customer_id
                GROUP BY c.customer_segment
              columns_used:
                - customers.customer_segment
                - orders.total_amount
      
      - name: revenue_by_product_category
        business_name: Revenue by Product Category
        description: >-
          Total line revenue grouped by product category. Calculated as the sum of order_items.line_total 
          grouped by product_categories.category_name. Use this metric for category performance analysis 
          and product portfolio optimization.
        return_type: DECIMAL
        result_grain: one row per product category
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    pc.category_name,
                    SUM(oi.line_total) AS revenue
                FROM ecom_bronze.order_items AS oi
                INNER JOIN ecom_bronze.products AS p
                    ON oi.product_id = p.product_id
                INNER JOIN ecom_bronze.product_categories AS pc
                    ON p.category_id = pc.category_id
                GROUP BY pc.category_name
              columns_used:
                - order_items.line_total
                - product_categories.category_name
      
      - name: revenue_by_sales_channel
        business_name: Revenue by Sales Channel
        description: >-
          Total revenue grouped by sales channel. Calculated as the sum of orders.total_amount 
          grouped by orders.sales_channel. Use this metric for channel performance analysis 
          and omnichannel strategy optimization.
        return_type: DECIMAL
        result_grain: one row per sales channel
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    orders.sales_channel,
                    SUM(orders.total_amount) AS revenue
                FROM ecom_bronze.orders AS orders
                GROUP BY orders.sales_channel
              columns_used:
                - orders.sales_channel
                - orders.total_amount
      
      - name: monthly_revenue
        business_name: Monthly Revenue
        description: >-
          Total revenue grouped by month. Calculated as the sum of orders.total_amount grouped by 
          month of orders.order_date using DATE_TRUNC. Use this metric for revenue trend analysis, 
          seasonality detection, and forecasting.
        return_type: DECIMAL
        result_grain: one row per month
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    DATE_TRUNC('month', orders.order_date) AS order_month,
                    SUM(orders.total_amount) AS revenue
                FROM ecom_bronze.orders AS orders
                GROUP BY DATE_TRUNC('month', orders.order_date)
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.total_amount
      
      - name: orders_by_status
        business_name: Orders by Status
        description: >-
          Order count grouped by order status. Calculated as the count of distinct orders.order_id 
          grouped by orders.order_status. Use this metric for order lifecycle tracking and 
          fulfillment pipeline analysis.
        return_type: BIGINT
        result_grain: one row per order status
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    orders.order_status,
                    COUNT(DISTINCT orders.order_id) AS order_count
                FROM ecom_bronze.orders AS orders
                GROUP BY orders.order_status
              columns_used:
                - orders.order_status
                - orders.order_id
      
      - name: total_payment_amount
        business_name: Total Payment Amount
        description: >-
          Total payment amount processed. Calculated as the sum of payments.amount. 
          Use this metric for cash flow analysis and payment processing volume tracking.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(payments.amount) AS total_payment_amount
                FROM ecom_bronze.payments AS payments
              columns_used:
                - payments.amount
      
      - name: payments_by_method
        business_name: Payments by Method
        description: >-
          Payment count and amount grouped by payment method. Calculated as count and sum of 
          payments grouped by payments.payment_method. Use this metric for payment method 
          preference analysis and payment processing optimization.
        return_type: DECIMAL
        result_grain: one row per payment method
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
