      - name: active_product_count
        business_name: Active Product Count
        description: >-
          Number of active products available for sale. Calculated as the count of distinct 
          products.product_id where products.is_active = true. Use this metric for active catalog 
          tracking and product availability analysis.
        return_type: BIGINT
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(DISTINCT products.product_id) AS active_product_count
                FROM ecom_bronze.products AS products
                WHERE products.is_active = true
              columns_used:
