      - name: revenue_by_customer
        business_name: Revenue By Customer
        description: >-
          Total revenue generated by each customer. Calculated as the sum of order totals 
          grouped by customer.
        return_type: decimal
        result_grain: one row per customer
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    c.customer_id,
                    c.name AS customer_name,
                    SUM(o.total) AS revenue_by_customer
                FROM ecom_bronze.customer AS c
                LEFT JOIN ecom_bronze.order_tbl AS o
                    ON c.customer_id = o.customer_id
                GROUP BY c.customer_id, c.name
              columns_used:
                - customer.customer_id
                - customer.name
                - order_tbl.total
                - order_tbl.customer_id
      
      - name: revenue_by_store
        business_name: Revenue By Store
        description: >-
          Total revenue generated by each store. Calculated as the sum of order totals 
          grouped by store.
        return_type: decimal
        result_grain: one row per store
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    s.store_id,
                    s.name AS store_name,
                    SUM(o.total) AS revenue_by_store
                FROM ecom_bronze.store AS s
                LEFT JOIN ecom_bronze.order_tbl AS o
                    ON s.store_id = o.store_id
                GROUP BY s.store_id, s.name
              columns_used:
                - store.store_id
                - store.name
                - order_tbl.total
                - order_tbl.store_id
      
      - name: revenue_by_loyalty_tier
        business_name: Revenue By Loyalty Tier
        description: >-
          Total revenue generated by customers in each loyalty tier. Calculated as the sum 
