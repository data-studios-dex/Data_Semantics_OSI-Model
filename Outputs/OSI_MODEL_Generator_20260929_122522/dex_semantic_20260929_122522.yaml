        return_type: decimal
        result_grain: one row per loyalty tier
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    c.loyalty_tier,
                    SUM(o.total) AS revenue_by_loyalty_tier
                FROM ecom_bronze.customer AS c
                LEFT JOIN ecom_bronze.order_tbl AS o
                    ON c.customer_id = o.customer_id
                GROUP BY c.loyalty_tier
              columns_used:
                - customer.loyalty_tier
                - customer.customer_id
                - order_tbl.total
                - order_tbl.customer_id
      
      - name: revenue_by_payment_method
        business_name: Revenue By Payment Method
        description: >-
