      - name: monthly_modification_creation_count
        business_name: Monthly Modification Creation Count
        description: >-
          Count of modifications created per month. This time-series metric groups modifications by their
          creation month, enabling trend analysis of modification creation activity over time.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    YEAR(mod_record.created_date) AS creation_year,
                    MONTH(mod_record.created_date) AS creation_month,
                    COUNT(mod_record.mod_id) AS modification_count
                FROM staging.mod_record AS mod_record
                GROUP BY YEAR(mod_record.created_date), MONTH(mod_record.created_date)
                ORDER BY creation_year, creation_month
              columns_used:
                - mod_record.mod_id
                - mod_record.created_date

      - name: monthly_task_creation_count
        business_name: Monthly Task Creation Count
        description: >-
          Count of tasks created per month. This time-series metric groups tasks by their creation month,
          enabling trend analysis of task creation activity over time.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    YEAR(task_record.created_date) AS creation_year,
                    MONTH(task_record.created_date) AS creation_month,
                    COUNT(task_record.task_id) AS task_count
                FROM staging.task_record AS task_record
                GROUP BY YEAR(task_record.created_date), MONTH(task_record.created_date)
                ORDER BY creation_year, creation_month
              columns_used:
                - task_record.task_id
                - task_record.created_date

      - name: monthly_audit_event_count
        business_name: Monthly Audit Event Count
        description: >-
          Count of audit events per month. This time-series metric groups audit events by their event month,
          enabling trend analysis of audit activity over time.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    YEAR(audit_event.event_ts) AS event_year,
                    MONTH(audit_event.event_ts) AS event_month,
                    COUNT(audit_event.audit_id) AS audit_event_count
                FROM staging.audit_event AS audit_event
                GROUP BY YEAR(audit_event.event_ts), MONTH(audit_event.event_ts)
                ORDER BY event_year, event_month
              columns_used:
                - audit_event.audit_id
                - audit_event.event_ts
