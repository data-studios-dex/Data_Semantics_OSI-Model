version: "1.0"

semantic_model:
  - name: ecom_retail_analytics
    description: >-
      Comprehensive semantic model for retail e-commerce analytics covering customers, orders, products, 
      payments, and shipments. This model supports analytical queries across customer behavior, order fulfillment, 
      product performance, payment processing, and logistics operations.
    
    ai_context:
      instructions: >-
        ## Dataset Grain Guide
        
        - **customers**: One row per customer. Use for customer-level analysis and customer attributes.
        - **orders**: One row per order. Use for order-level revenue, order counts, and order-level aggregations.
        - **order_items**: One row per order line item. Use for product-level analysis within orders. Multiple rows per order.
        - **products**: One row per product. Use for product catalog analysis and product attributes.
        - **product_categories**: One row per product category. Supports hierarchical category structure via parent_category_id.
        - **payments**: One row per payment transaction. Use for payment-level analysis. May have multiple payments per order.
        - **shipments**: One row per shipment. Use for shipment and logistics analysis. Typically one shipment per order.
        
        ## Critical Double-Counting Prevention
        
        **IMPORTANT**: The orders and order_items tables have different grains. This creates a critical double-counting risk.
        
        - **orders.subtotal**, **orders.discount_amount**, **orders.tax_amount**, **orders.shipping_fee**, and **orders.total_amount** 
          are ORDER-LEVEL aggregated amounts. These represent the complete order totals.
        - **order_items.line_total** is a LINE-ITEM-LEVEL amount. Multiple line items exist per order.
        
        **Double-Counting Rules**:
        
        1. **NEVER sum orders.total_amount or orders.subtotal after joining orders to order_items**. 
           This will multiply the order total by the number of line items.
        
        2. For **order-level revenue analysis**, use:
           - `SUM(orders.total_amount)` directly from the orders table
           - `SUM(orders.subtotal)` directly from the orders table
           - Do NOT join to order_items when calculating order-level totals
        
        3. For **product-level or line-item-level revenue analysis**, use:
           - `SUM(order_items.line_total)` from order_items
           - Join order_items to products for product-level analysis
           - Join order_items to orders only for order attributes (status, date, customer)
        
        4. For **customer-level revenue**, use orders.total_amount aggregated by customer:
           - `SUM(orders.total_amount)` grouped by orders.customer_id
           - Do NOT join through order_items
        
        5. When analyzing **both order-level and product-level metrics together**:
           - Use separate queries or CTEs
           - Use window functions to avoid duplication
           - Use DISTINCT aggregation where appropriate
        
        ## Join Guidance
        
        **Standard Relationships**:
        
        - **customers → orders**: Join on customers.customer_id = orders.customer_id (one-to-many)
        - **orders → order_items**: Join on orders.order_id = order_items.order_id (one-to-many)
        - **orders → payments**: Join on orders.order_id = payments.order_id (one-to-many, may have multiple payments per order)
        - **orders → shipments**: Join on orders.order_id = shipments.order_id (one-to-one or one-to-many)
        - **order_items → products**: Join on order_items.product_id = products.product_id (many-to-one)
        - **products → product_categories**: Join on products.category_id = product_categories.category_id (many-to-one)
        
        **Hierarchical Relationship**:
        
        - **product_categories → product_categories (self-join)**: Join on product_categories.parent_category_id = product_categories.category_id
          This represents the category hierarchy. Use recursive CTEs for full hierarchy traversal.
        
        ## Time Analysis Guidance
        
        **Primary Date Fields**:
        
        - **orders.order_date**: Use for order placement analysis, sales trends, and revenue by order date
        - **customers.registration_date**: Use for customer acquisition analysis and cohort analysis
        - **products.created_at**: Use for product launch analysis and product lifecycle
        - **payments.paid_at**: Use for payment timing analysis and cash flow analysis
        - **shipments.shipped_at**: Use for shipment dispatch analysis
        - **shipments.delivered_at**: Use for delivery completion analysis and delivery performance
        
        **Time-Based Analysis**:
        
        - For **revenue by order date**, use orders.order_date
        - For **revenue by payment date**, use payments.paid_at
        - For **delivery performance**, calculate difference between shipments.delivered_at and shipments.shipped_at
        - For **order-to-ship time**, calculate difference between shipments.shipped_at and orders.order_date
        
        ## Metric Selection Guidance
        
        **Revenue Metrics**:
        
        - **Total Revenue**: Use `SUM(orders.total_amount)` from orders table
        - **Subtotal Revenue**: Use `SUM(orders.subtotal)` from orders table
        - **Product Revenue**: Use `SUM(order_items.line_total)` from order_items table
        - **Average Order Value**: Use `AVG(orders.total_amount)` or `SUM(orders.total_amount) / COUNT(DISTINCT orders.order_id)`
        
        **Cost and Profit Metrics**:
        
        - **Product Cost**: Use `SUM(order_items.quantity * products.cost_price)` joining order_items to products
        - **Gross Profit**: Revenue minus cost at appropriate grain
        - **Gross Margin %**: (Revenue - Cost) / Revenue * 100
        
        **Order Metrics**:
        
        - **Order Count**: Use `COUNT(DISTINCT orders.order_id)`
        - **Line Item Count**: Use `COUNT(order_items.order_item_id)` or `SUM(order_items.quantity)`
        - **Units Sold**: Use `SUM(order_items.quantity)`
        
        **Customer Metrics**:
        
        - **Customer Count**: Use `COUNT(DISTINCT customers.customer_id)`
        - **Active Customer Count**: Use `COUNT(DISTINCT customers.customer_id)` with `customers.is_active = true`
        - **Orders per Customer**: Total orders / Total customers
        - **Revenue per Customer**: Total revenue / Total customers
        
        **Payment Metrics**:
        
        - **Payment Count**: Use `COUNT(payments.payment_id)`
        - **Payment Amount**: Use `SUM(payments.amount)`
        - **Completed Payments**: Filter by `payments.payment_status = 'Completed'`
        
        **Shipment Metrics**:
        
        - **Shipment Count**: Use `COUNT(shipments.shipment_id)`
        - **Delivered Shipments**: Filter by `shipments.shipment_status = 'Delivered'`
        - **Average Delivery Time**: Calculate using delivered_at - shipped_at for delivered shipments
        
        ## Category Hierarchy Guidance
        
        The product_categories table contains a self-referencing hierarchy via parent_category_id.
        
        - **Leaf categories** have parent_category_id pointing to a parent
        - **Root categories** have parent_category_id = NULL or pointing to themselves
        - Use **recursive CTEs** to traverse the full category hierarchy
        - When aggregating by category, decide whether to include subcategories or only direct assignments
        
        Example recursive query pattern for Databricks:
        
        ```sql
        WITH RECURSIVE category_hierarchy AS (
          SELECT category_id, category_name, parent_category_id, 0 AS level
          FROM ecom_bronze.product_categories
          WHERE parent_category_id IS NULL
          
          UNION ALL
          
          SELECT c.category_id, c.category_name, c.parent_category_id, ch.level + 1
          FROM ecom_bronze.product_categories c
          INNER JOIN category_hierarchy ch ON c.parent_category_id = ch.category_id
        )
        SELECT * FROM category_hierarchy
        ```
        
        ## Query Restrictions and Considerations
        
        1. **Currency**: All monetary amounts in orders, order_items, products, and payments are in the currency specified 
           in the currency field. Currently USD. Multi-currency analysis requires currency conversion logic.
        
        2. **Active Records**: Both customers and products have is_active flags. Consider filtering by is_active = true 
           for current/active analysis.
        
        3. **Order Status**: orders.order_status indicates order lifecycle stage. Filter appropriately for completed orders.
        
        4. **Payment Status**: payments.payment_status indicates payment completion. Use 'Completed' for confirmed revenue.
        
        5. **Shipment Status**: shipments.shipment_status tracks delivery progress. Use for logistics KPIs.
        
        6. **PII Fields**: Several fields contain PII (first_name, last_name, email, phone, date_of_birth, transaction_ref). 
           Handle according to privacy policies.
        
        7. **Discount Calculations**: 
           - Order-level discount: orders.discount_amount
           - Line-level discount: order_items.discount_pct applied to order_items.unit_price * order_items.quantity
        
        8. **Line Total Calculation**: order_items.line_total represents quantity * unit_price * (1 - discount_pct/100)

    datasets:
      - name: customers
        business_name: Customers
        description: >-
          Customer master data containing one row per customer. Includes customer demographics, contact information, 
          segmentation, registration details, and account status. This is the primary dimension for customer-level analysis.
        source: ecom_bronze.customers
        primary_key:
          - customer_id
        fields:
          - name: customer_id
            business_name: Customer Identifier
            description: Unique identifier for a customer.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: customer_code
            business_name: Customer Code
            description: Business reference code assigned to the customer.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: first_name
            business_name: First Name
            description: First name of the customer. Contains PII.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
              - PII
          
          - name: last_name
            business_name: Last Name
            description: Last name of the customer. Contains PII.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
              - PII
          
          - name: email
            business_name: Email
            description: Email address of the customer. Contains PII.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
              - PII
          
          - name: phone
            business_name: Phone
            description: Phone number of the customer. Contains PII.
            sql_type: STRING(255)
            constraints:
              - PII
          
          - name: gender
            business_name: Gender
            description: Gender of the customer.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: date_of_birth
            business_name: Date Of Birth
            description: Date of birth of the customer. Contains PII.
            sql_type: DATE
            constraints:
              - PII
          
          - name: city
            business_name: City
            description: City where the customer resides.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: state
            business_name: State
            description: State or province where the customer resides.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: country
            business_name: Country
            description: Country where the customer resides.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: postal_code
            business_name: Postal Code
            description: Postal or ZIP code of the customer's address.
            sql_type: STRING(255)
          
          - name: customer_segment
            business_name: Customer Segment
            description: Indicates the current segment classification of the customer.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: registration_date
            business_name: Registration Date
            description: Date when the customer registered.
            sql_type: DATE
            dimension:
              is_time: true
          
          - name: is_active
            business_name: Is Active
            description: Indicates whether the customer account is currently active.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: orders
        business_name: Orders
        description: >-
          Order header data containing one row per order. Includes order identification, customer reference, 
          order timing, status, shipping destination, and order-level financial totals (subtotal, discounts, tax, 
          shipping, and total amount). This is the primary fact table for order-level revenue analysis.
        source: ecom_bronze.orders
        primary_key:
          - order_id
        fields:
          - name: order_id
            business_name: Order Identifier
            description: Unique identifier for an order.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_number
            business_name: Order Number
            description: Business reference number assigned to the order.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: customer_id
            business_name: Customer ID
            description: References the related customer record.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: order_date
            business_name: Order Date
            description: Timestamp recording when the order was placed.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: order_status
            business_name: Order Status
            description: Indicates the current status of the order.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: sales_channel
            business_name: Sales Channel
            description: Indicates the channel through which the order was placed.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: ship_city
            business_name: Ship City
            description: City to which the order is shipped.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: ship_state
            business_name: Ship State
            description: State or province to which the order is shipped.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: Postal or ZIP code to which the order is shipped.
            sql_type: STRING(255)
          
          - name: subtotal
            business_name: Subtotal
            description: Monetary amount representing the order subtotal before discounts and taxes.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              is_additive: true
          
          - name: discount_amount
            business_name: Discount Amount
            description: Monetary amount representing the total discount applied to the order.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              is_additive: true
          
          - name: tax_amount
            business_name: Tax Amount
            description: Monetary amount representing the tax charged on the order. Contains PII.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
              - PII
            measure:
              aggregation: SUM
              is_additive: true
          
          - name: shipping_fee
            business_name: Shipping Fee
            description: Monetary amount representing the shipping cost for the order.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              is_additive: true
          
          - name: total_amount
            business_name: Total Amount
            description: Monetary amount representing the final total of the order.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              is_additive: true
          
          - name: currency
            business_name: Currency
            description: Currency code for the order amounts.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: order_items
        business_name: Order Items
        description: >-
          Order line item detail containing one row per order line item. Multiple line items can exist per order. 
          Includes product reference, quantity, unit pricing, line-level discount, and line total. This is the 
          primary fact table for product-level sales analysis within orders.
        source: ecom_bronze.order_items
        primary_key:
          - order_item_id
        fields:
          - name: order_item_id
            business_name: Order Item Identifier
            description: Unique identifier for an order line item.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: References the related order record.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: line_number
            business_name: Line Number
            description: Sequential line number within the order.
            sql_type: INT
            constraints:
              - NOT NULL
          
          - name: product_id
            business_name: Product ID
            description: References the related product record.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: quantity
            business_name: Quantity
            description: Number of units ordered for this line item.
            sql_type: INT
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              is_additive: true
          
          - name: unit_price
            business_name: Unit Price
            description: Monetary amount representing the price per unit.
            sql_type: DECIMAL(12,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
              is_additive: false
          
          - name: discount_pct
            business_name: Discount Pct
            description: Percentage discount applied to the line item.
            sql_type: DECIMAL(5,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
              is_additive: false
          
          - name: line_total
            business_name: Line Total
            description: Monetary amount representing the total for this line item.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              is_additive: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: products
        business_name: Products
        description: >-
          Product master data containing one row per product. Includes product identification, SKU, naming, 
          category assignment, brand, pricing (unit price and cost price), inventory levels, and product status. 
          This is the primary dimension for product-level analysis.
        source: ecom_bronze.products
        primary_key:
          - product_id
        fields:
          - name: product_id
            business_name: Product Identifier
            description: Unique identifier for a product.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: sku
            business_name: Sku
            description: Stock keeping unit code for the product.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: product_name
            business_name: Product Name
            description: Name of the product.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: category_id
            business_name: Category ID
            description: References the related product category record.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: brand
            business_name: Brand
            description: Brand name of the product.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: description
            business_name: Description
            description: Detailed description of the product.
            sql_type: STRING(255)
          
          - name: unit_price
            business_name: Unit Price
            description: Monetary amount representing the selling price per unit.
            sql_type: DECIMAL(12,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: AVG
              is_additive: false
          
          - name: cost_price
            business_name: Cost Price
            description: Monetary amount representing the cost per unit.
            sql_type: DECIMAL(12,2)
            measure:
              aggregation: AVG
              is_additive: false
          
          - name: currency
            business_name: Currency
            description: Currency code for the product prices.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: stock_quantity
            business_name: Stock Quantity
            description: Current inventory quantity available for the product.
            sql_type: INT
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              is_additive: true
          
          - name: is_active
            business_name: Is Active
            description: Indicates whether the product is currently active for sale.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: created_at
            business_name: Created At
            description: Timestamp recording when the product was created in the system.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: product_categories
        business_name: Product Categories
        description: >-
          Product category master data containing one row per category. Includes category identification, naming, 
          hierarchical parent reference, and category status. Supports hierarchical category structure through 
          self-referencing parent_category_id for multi-level category analysis.
        source: ecom_bronze.product_categories
        primary_key:
          - category_id
        fields:
          - name: category_id
            business_name: Category Identifier
            description: Unique identifier for a product category.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: category_name
            business_name: Category Name
            description: Name of the product category.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: parent_category_id
            business_name: Parent Category ID
            description: References the parent category in the hierarchy. Self-referencing foreign key for hierarchical structure.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
          
          - name: description
            business_name: Description
            description: Detailed description of the product category.
            sql_type: STRING(255)
          
          - name: is_active
            business_name: Is Active
            description: Indicates whether the category is currently active.
            sql_type: BOOLEAN
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: payments
        business_name: Payments
        description: >-
          Payment transaction data containing one row per payment. Multiple payments may exist per order. 
          Includes payment method, status, amount, currency, transaction reference, gateway information, 
          and payment timestamp. This is the primary fact table for payment and cash flow analysis.
        source: ecom_bronze.payments
        primary_key:
          - payment_id
        fields:
          - name: payment_id
            business_name: Payment Identifier
            description: Unique identifier for a payment transaction.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: References the related order record.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: payment_method
            business_name: Payment Method
            description: Indicates the method used for payment.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: payment_status
            business_name: Payment Status
            description: Indicates the current status of the payment.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: amount
            business_name: Amount
            description: Monetary amount representing the payment value.
            sql_type: DECIMAL(14,2)
            constraints:
              - NOT NULL
            measure:
              aggregation: SUM
              is_additive: true
          
          - name: currency
            business_name: Currency
            description: Currency code for the payment amount.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: transaction_ref
            business_name: Transaction Ref
            description: External reference number for the payment transaction. Contains PII.
            sql_type: STRING(255)
            constraints:
              - PII
          
          - name: gateway
            business_name: Gateway
            description: Name of the payment gateway used to process the transaction.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: paid_at
            business_name: Paid At
            description: Timestamp recording when the payment was completed.
            sql_type: TIMESTAMP(29,9)
            dimension:
              is_time: true
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

      - name: shipments
        business_name: Shipments
        description: >-
          Shipment tracking data containing one row per shipment. Typically one shipment per order. 
          Includes carrier information, tracking number, shipment status, shipping and delivery timestamps, 
          and destination details. This is the primary fact table for logistics and delivery analysis.
        source: ecom_bronze.shipments
        primary_key:
          - shipment_id
        fields:
          - name: shipment_id
            business_name: Shipment Identifier
            description: Unique identifier for a shipment.
            sql_type: BIGINT
            constraints:
              - PRIMARY KEY
              - NOT NULL
          
          - name: order_id
            business_name: Order ID
            description: References the related order record.
            sql_type: BIGINT
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: carrier
            business_name: Carrier
            description: Name of the shipping carrier handling the shipment.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: tracking_number
            business_name: Tracking Number
            description: Tracking number assigned by the carrier for the shipment.
            sql_type: STRING(255)
          
          - name: shipment_status
            business_name: Shipment Status
            description: Indicates the current status of the shipment.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: shipped_at
            business_name: Shipped At
            description: Timestamp recording when the shipment was dispatched.
            sql_type: TIMESTAMP(29,9)
            dimension:
              is_time: true
          
          - name: delivered_at
            business_name: Delivered At
            description: Timestamp recording when the shipment was delivered.
            sql_type: TIMESTAMP(29,9)
            dimension:
              is_time: true
          
          - name: ship_city
            business_name: Ship City
            description: City to which the shipment is being sent.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: ship_state
            business_name: Ship State
            description: State or province to which the shipment is being sent.
            sql_type: STRING(255)
            dimension:
              is_categorical: true
          
          - name: ship_postal_code
            business_name: Ship Postal Code
            description: Postal or ZIP code to which the shipment is being sent.
            sql_type: STRING(255)
          
          - name: _source_system
            business_name: Source System
            description: Name of the source system from which the record originated.
            sql_type: STRING(255)
            constraints:
              - NOT NULL
          
          - name: _batch_id
            business_name: Batch Identifier
            description: Identifier of the ETL batch that loaded this record.
            sql_type: BIGINT
          
          - name: _loaded_at
            business_name: Loaded At
            description: Timestamp recording when the record was loaded into the table.
            sql_type: TIMESTAMP(29,9)
            constraints:
              - NOT NULL

    relationships:
      - name: orders_to_customers
        left_dataset: orders
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship from orders to customers. Each order is placed by exactly one customer, 
          but a customer may place multiple orders. Join on orders.customer_id = customers.customer_id.
      
      - name: order_items_to_orders
        left_dataset: order_items
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship from order_items to orders. Each order line item belongs to exactly one order, 
          but an order contains multiple line items. Join on order_items.order_id = orders.order_id. 
          CRITICAL: When using this join, do NOT sum order-level amounts (orders.total_amount, orders.subtotal, etc.) 
          as this will cause double-counting by multiplying the order total by the number of line items.
      
      - name: order_items_to_products
        left_dataset: order_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship from order_items to products. Each order line item references exactly one product, 
          but a product may appear in multiple order line items. Join on order_items.product_id = products.product_id.
      
      - name: products_to_product_categories
        left_dataset: products
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship from products to product_categories. Each product belongs to exactly one category, 
          but a category may contain multiple products. Join on products.category_id = product_categories.category_id.
      
      - name: product_categories_hierarchy
        left_dataset: product_categories
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - parent_category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Hierarchical self-referencing relationship within product_categories. Each category may have a parent category, 
          creating a multi-level category hierarchy. Join on product_categories.parent_category_id = parent.category_id. 
          Root categories have parent_category_id = NULL. Use recursive CTEs to traverse the full hierarchy tree. 
          Example: Electronics (root) -> Consumer Electronics (child) -> Headphones (grandchild).
      
      - name: payments_to_orders
        left_dataset: payments
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship from payments to orders. Each payment is associated with exactly one order, 
          but an order may have multiple payments (e.g., split payments, partial payments). 
          Join on payments.order_id = orders.order_id.
      
      - name: shipments_to_orders
        left_dataset: shipments
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship from shipments to orders. Each shipment is associated with exactly one order. 
          Typically one shipment per order, but an order may have multiple shipments if items are shipped separately. 
          Join on shipments.order_id = orders.order_id.

    metrics:
      - name: total_revenue
        business_name: Total Revenue
        description: >-
          Total revenue across all orders, calculated as the sum of order total amounts. 
          This represents the complete revenue including product costs, taxes, shipping fees, and after discounts.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(orders.total_amount) AS total_revenue
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.total_amount
      
      - name: total_subtotal_revenue
        business_name: Total Subtotal Revenue
        description: >-
          Total subtotal revenue across all orders before discounts and taxes. 
          Represents the gross merchandise value before any adjustments.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(orders.subtotal) AS total_subtotal_revenue
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.subtotal
      
      - name: total_discount_amount
        business_name: Total Discount Amount
        description: >-
          Total discount amount applied across all orders. Represents the total value of discounts given to customers.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(orders.discount_amount) AS total_discount_amount
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.discount_amount
      
      - name: total_tax_amount
        business_name: Total Tax Amount
        description: >-
          Total tax amount collected across all orders.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(orders.tax_amount) AS total_tax_amount
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.tax_amount
      
      - name: total_shipping_fees
        business_name: Total Shipping Fees
        description: >-
          Total shipping fees collected across all orders.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(orders.shipping_fee) AS total_shipping_fees
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.shipping_fee
      
      - name: order_count
        business_name: Order Count
        description: >-
          Total number of orders placed.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(orders.order_id) AS order_count
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.order_id
      
      - name: average_order_value
        business_name: Average Order Value
        description: >-
          Average order value calculated as total revenue divided by number of orders. 
          Represents the typical order size in monetary terms.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(orders.order_id) = 0 THEN 0
                        ELSE SUM(orders.total_amount) / COUNT(orders.order_id)
                    END AS average_order_value
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.total_amount
                - orders.order_id
      
      - name: product_line_revenue
        business_name: Product Line Revenue
        description: >-
          Total revenue at the product line item level, calculated as the sum of line totals. 
          Use this metric for product-level revenue analysis. This is different from order-level revenue 
          as it represents the sum of individual line items.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(order_items.line_total) AS product_line_revenue
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.line_total
      
      - name: units_sold
        business_name: Units Sold
        description: >-
          Total number of product units sold across all order line items.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(order_items.quantity) AS units_sold
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.quantity
      
      - name: line_item_count
        business_name: Line Item Count
        description: >-
          Total number of order line items across all orders.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(order_items.order_item_id) AS line_item_count
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.order_item_id
      
      - name: average_unit_price
        business_name: Average Unit Price
        description: >-
          Average unit price across all order line items, weighted by line items not by quantity.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    AVG(order_items.unit_price) AS average_unit_price
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.unit_price
      
      - name: average_line_discount_pct
        business_name: Average Line Discount Percentage
        description: >-
          Average discount percentage applied across all order line items.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    AVG(order_items.discount_pct) AS average_line_discount_pct
                FROM ecom_bronze.order_items AS order_items
              columns_used:
                - order_items.discount_pct
      
      - name: product_cost
        business_name: Product Cost
        description: >-
          Total product cost calculated as the sum of (quantity * cost_price) for all sold products. 
          Requires joining order_items to products to access cost_price.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(order_items.quantity * products.cost_price) AS product_cost
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                    ON order_items.product_id = products.product_id
              columns_used:
                - order_items.quantity
                - products.cost_price
                - order_items.product_id
                - products.product_id
      
      - name: gross_profit
        business_name: Gross Profit
        description: >-
          Gross profit calculated as product line revenue minus product cost. 
          Represents profit before operating expenses.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(order_items.line_total) - SUM(order_items.quantity * products.cost_price) AS gross_profit
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                    ON order_items.product_id = products.product_id
              columns_used:
                - order_items.line_total
                - order_items.quantity
                - products.cost_price
                - order_items.product_id
                - products.product_id
      
      - name: gross_margin_pct
        business_name: Gross Margin Percentage
        description: >-
          Gross margin percentage calculated as (product line revenue - product cost) / product line revenue * 100. 
          Represents the percentage of revenue retained as gross profit.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    CASE
                        WHEN SUM(order_items.line_total) = 0 THEN 0
                        ELSE (SUM(order_items.line_total) - SUM(order_items.quantity * products.cost_price)) 
                             / SUM(order_items.line_total) * 100
                    END AS gross_margin_pct
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                    ON order_items.product_id = products.product_id
              columns_used:
                - order_items.line_total
                - order_items.quantity
                - products.cost_price
                - order_items.product_id
                - products.product_id
      
      - name: customer_count
        business_name: Customer Count
        description: >-
          Total number of customers in the customer master data.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(customers.customer_id) AS customer_count
                FROM ecom_bronze.customers AS customers
              columns_used:
                - customers.customer_id
      
      - name: active_customer_count
        business_name: Active Customer Count
        description: >-
          Total number of active customers, filtered by is_active = true.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(customers.customer_id) AS active_customer_count
                FROM ecom_bronze.customers AS customers
                WHERE customers.is_active = true
              columns_used:
                - customers.customer_id
                - customers.is_active
      
      - name: revenue_per_customer
        business_name: Revenue Per Customer
        description: >-
          Average revenue per customer calculated as total revenue divided by number of distinct customers who placed orders.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT orders.customer_id) = 0 THEN 0
                        ELSE SUM(orders.total_amount) / COUNT(DISTINCT orders.customer_id)
                    END AS revenue_per_customer
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.total_amount
                - orders.customer_id
      
      - name: orders_per_customer
        business_name: Orders Per Customer
        description: >-
          Average number of orders per customer calculated as total orders divided by number of distinct customers who placed orders.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT orders.customer_id) = 0 THEN 0
                        ELSE CAST(COUNT(orders.order_id) AS DECIMAL) / COUNT(DISTINCT orders.customer_id)
                    END AS orders_per_customer
                FROM ecom_bronze.orders AS orders
              columns_used:
                - orders.order_id
                - orders.customer_id
      
      - name: product_count
        business_name: Product Count
        description: >-
          Total number of products in the product catalog.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(products.product_id) AS product_count
                FROM ecom_bronze.products AS products
              columns_used:
                - products.product_id
      
      - name: active_product_count
        business_name: Active Product Count
        description: >-
          Total number of active products available for sale, filtered by is_active = true.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(products.product_id) AS active_product_count
                FROM ecom_bronze.products AS products
                WHERE products.is_active = true
              columns_used:
                - products.product_id
                - products.is_active
      
      - name: total_inventory_value
        business_name: Total Inventory Value
        description: >-
          Total value of current inventory calculated as sum of (stock_quantity * cost_price) for all products.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(products.stock_quantity * products.cost_price) AS total_inventory_value
                FROM ecom_bronze.products AS products
                WHERE products.cost_price IS NOT NULL
              columns_used:
                - products.stock_quantity
                - products.cost_price
      
      - name: payment_count
        business_name: Payment Count
        description: >-
          Total number of payment transactions.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(payments.payment_id) AS payment_count
                FROM ecom_bronze.payments AS payments
              columns_used:
                - payments.payment_id
      
      - name: completed_payment_count
        business_name: Completed Payment Count
        description: >-
          Total number of completed payment transactions, filtered by payment_status = 'Completed'.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(payments.payment_id) AS completed_payment_count
                FROM ecom_bronze.payments AS payments
                WHERE payments.payment_status = 'Completed'
              columns_used:
                - payments.payment_id
                - payments.payment_status
      
      - name: total_payment_amount
        business_name: Total Payment Amount
        description: >-
          Total payment amount across all payment transactions.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    SUM(payments.amount) AS total_payment_amount
                FROM ecom_bronze.payments AS payments
              columns_used:
                - payments.amount
      
      - name: shipment_count
        business_name: Shipment Count
        description: >-
          Total number of shipments.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(shipments.shipment_id) AS shipment_count
                FROM ecom_bronze.shipments AS shipments
              columns_used:
                - shipments.shipment_id
      
      - name: delivered_shipment_count
        business_name: Delivered Shipment Count
        description: >-
          Total number of delivered shipments where delivered_at is not null.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    COUNT(shipments.shipment_id) AS delivered_shipment_count
                FROM ecom_bronze.shipments AS shipments
                WHERE shipments.delivered_at IS NOT NULL
              columns_used:
                - shipments.shipment_id
                - shipments.delivered_at
      
      - name: average_delivery_time_days
        business_name: Average Delivery Time (Days)
        description: >-
          Average delivery time in days calculated as the difference between delivered_at and shipped_at 
          for shipments that have been delivered.
        return_type: DECIMAL
        result_grain: single value
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    AVG(DATEDIFF(shipments.delivered_at, shipments.shipped_at)) AS average_delivery_time_days
                FROM ecom_bronze.shipments AS shipments
                WHERE shipments.shipped_at IS NOT NULL
                  AND shipments.delivered_at IS NOT NULL
              columns_used:
                - shipments.delivered_at
                - shipments.shipped_at
      
      - name: revenue_by_order_date
        business_name: Revenue By Order Date
        description: >-
          Total revenue aggregated by order date. Use for time-series revenue analysis and trend identification.
        return_type: DECIMAL
        result_grain: one row per order date
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    DATE(orders.order_date) AS order_date,
                    SUM(orders.total_amount) AS revenue
                FROM ecom_bronze.orders AS orders
                GROUP BY DATE(orders.order_date)
                ORDER BY DATE(orders.order_date)
              columns_used:
                - orders.order_date
                - orders.total_amount
      
      - name: revenue_by_customer_segment
        business_name: Revenue By Customer Segment
        description: >-
          Total revenue aggregated by customer segment. Use for segment performance analysis.
        return_type: DECIMAL
        result_grain: one row per customer segment
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    customers.customer_segment,
                    SUM(orders.total_amount) AS revenue
                FROM ecom_bronze.orders AS orders
                INNER JOIN ecom_bronze.customers AS customers
                    ON orders.customer_id = customers.customer_id
                GROUP BY customers.customer_segment
                ORDER BY SUM(orders.total_amount) DESC
              columns_used:
                - customers.customer_segment
                - orders.total_amount
                - orders.customer_id
                - customers.customer_id
      
      - name: revenue_by_product
        business_name: Revenue By Product
        description: >-
          Total revenue aggregated by product. Use for product performance analysis.
        return_type: DECIMAL
        result_grain: one row per product
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    products.product_id,
                    products.product_name,
                    SUM(order_items.line_total) AS revenue
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                    ON order_items.product_id = products.product_id
                GROUP BY products.product_id, products.product_name
                ORDER BY SUM(order_items.line_total) DESC
              columns_used:
                - products.product_id
                - products.product_name
                - order_items.line_total
                - order_items.product_id
      
      - name: revenue_by_category
        business_name: Revenue By Category
        description: >-
          Total revenue aggregated by product category. Use for category performance analysis.
        return_type: DECIMAL
        result_grain: one row per category
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    product_categories.category_id,
                    product_categories.category_name,
                    SUM(order_items.line_total) AS revenue
                FROM ecom_bronze.order_items AS order_items
                INNER JOIN ecom_bronze.products AS products
                    ON order_items.product_id = products.product_id
                INNER JOIN ecom_bronze.product_categories AS product_categories
                    ON products.category_id = product_categories.category_id
                GROUP BY product_categories.category_id, product_categories.category_name
                ORDER BY SUM(order_items.line_total) DESC
              columns_used:
                - product_categories.category_id
                - product_categories.category_name
                - order_items.line_total
                - order_items.product_id
                - products.product_id
                - products.category_id
                - product_categories.category_id
      
      - name: revenue_by_sales_channel
        business_name: Revenue By Sales Channel
        description: >-
          Total revenue aggregated by sales channel. Use for channel performance analysis.
        return_type: DECIMAL
        result_grain: one row per sales channel
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    orders.sales_channel,
                    SUM(orders.total_amount) AS revenue
                FROM ecom_bronze.orders AS orders
                GROUP BY orders.sales_channel
                ORDER BY SUM(orders.total_amount) DESC
              columns_used:
                - orders.sales_channel
                - orders.total_amount
      
      - name: top_customers_by_revenue
        business_name: Top Customers By Revenue
        description: >-
          Customers ranked by total revenue. Use for identifying high-value customers.
        return_type: DECIMAL
        result_grain: one row per customer
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: |
                SELECT
                    customers.customer_id,
                    customers.customer_code,
                    customers.customer_segment,
                    SUM(orders.total_amount) AS total_revenue,
                    COUNT(orders.order_id) AS order_count,
                    RANK() OVER (ORDER BY SUM(orders.total_amount) DESC) AS revenue_rank
                FROM ecom_bronze.orders AS orders
                INNER JOIN ecom_bronze.customers AS customers
                    ON orders.customer_id = customers.customer_id
                GROUP BY customers.customer_id, customers.customer_code, customers.customer_segment
                ORDER BY SUM(orders.total_amount) DESC
              columns_used:
                - customers.customer_id
                - customers.customer_code
                - customers.customer_segment
                - orders.total_amount
                - orders.order_id
                - orders.customer_id
