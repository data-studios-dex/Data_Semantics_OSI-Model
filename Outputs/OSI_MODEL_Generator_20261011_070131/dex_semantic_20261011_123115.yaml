      - name: tasks_per_modification
        business_name: Tasks per Modification
        description: >-
          Average number of tasks per modification. Calculated as total tasks divided by total
          modifications. This metric provides insight into the average work breakdown per change request.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT mod_record.mod_id) = 0 THEN 0
                        ELSE
                            CAST(COUNT(task_record.task_id) AS DECIMAL(18,2))
                            / CAST(COUNT(DISTINCT mod_record.mod_id) AS DECIMAL(18,2))
                    END AS tasks_per_modification
                FROM staging.task_record AS task_record
                INNER JOIN staging.mod_record AS mod_record
                    ON task_record.mod_id = mod_record.mod_id
              columns_used:
                - task_record.task_id
                - task_record.mod_id
                - mod_record.mod_id

      - name: impact_assessments_per_modification
        business_name: Impact Assessments per Modification
        description: >-
          Average number of impact assessments per modification. Calculated as total impact
          assessments divided by total modifications. This metric provides insight into the
          average compliance evaluation workload per change request.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT mod_record.mod_id) = 0 THEN 0
                        ELSE
                            CAST(COUNT(impact_record.impact_id) AS DECIMAL(18,2))
                            / CAST(COUNT(DISTINCT mod_record.mod_id) AS DECIMAL(18,2))
                    END AS impact_assessments_per_modification
                FROM staging.impact_record AS impact_record
                INNER JOIN staging.mod_record AS mod_record
                    ON impact_record.mod_id = mod_record.mod_id
              columns_used:
                - impact_record.impact_id
                - impact_record.mod_id
                - mod_record.mod_id

      - name: modifications_by_month
        business_name: Modifications by Month
        description: >-
          Count of modifications created, grouped by month. This time-series metric enables
          trend analysis of modification creation activity over time.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    DATEPART(YEAR, mod_record.created_date) AS year,
                    DATEPART(MONTH, mod_record.created_date) AS month,
                    COUNT(mod_record.mod_id) AS modifications_by_month
                FROM staging.mod_record AS mod_record
                GROUP BY
                    DATEPART(YEAR, mod_record.created_date),
                    DATEPART(MONTH, mod_record.created_date)
                ORDER BY
                    year,
                    month
              columns_used:
                - mod_record.created_date
                - mod_record.mod_id

      - name: tasks_by_month
        business_name: Tasks by Month
        description: >-
          Count of tasks created, grouped by month. This time-series metric enables trend
          analysis of task creation activity over time.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    DATEPART(YEAR, task_record.created_date) AS year,
                    DATEPART(MONTH, task_record.created_date) AS month,
                    COUNT(task_record.task_id) AS tasks_by_month
                FROM staging.task_record AS task_record
                GROUP BY
                    DATEPART(YEAR, task_record.created_date),
                    DATEPART(MONTH, task_record.created_date)
                ORDER BY
                    year,
                    month
              columns_used:
                - task_record.created_date
                - task_record.task_id

