      - name: monthly_revenue
        business_name: Monthly Revenue
        description: >-
          Total revenue by month. Calculated by summing completed order totals grouped by order month. 
          Grain: one row per month.
        return_type: NUMERIC
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('month', order_tbl.timestamp) AS order_month,
                    SUM(order_tbl.total) AS monthly_revenue
                FROM ecom_bronze.order_tbl AS order_tbl
                WHERE order_tbl.status = 'Completed'
                GROUP BY DATE_TRUNC('month', order_tbl.timestamp)
                ORDER BY order_month
              columns_used:
                - order_tbl.timestamp
                - order_tbl.total
                - order_tbl.status
      
      - name: monthly_order_count
        business_name: Monthly Order Count
        description: >-
          Number of orders by month. Represents monthly transaction volume. Grain: one row per month.
        return_type: INTEGER
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('month', order_tbl.timestamp) AS order_month,
                    COUNT(order_tbl.order_id) AS monthly_order_count
                FROM ecom_bronze.order_tbl AS order_tbl
                GROUP BY DATE_TRUNC('month', order_tbl.timestamp)
                ORDER BY order_month
              columns_used:
                - order_tbl.timestamp
                - order_tbl.order_id
      
      - name: products_by_supplier
        business_name: Products by Supplier
        description: >-
          Number of products provided by each supplier. Represents supplier product portfolio size. 
          Grain: one row per supplier.
        return_type: INTEGER
        result_grain: one row per supplier
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    product.supplier_id,
                    COUNT(product.product_id) AS products_by_supplier
                FROM ecom_bronze.product AS product
                GROUP BY product.supplier_id
              columns_used:
                - product.supplier_id
                - product.product_id
      
      - name: shipments_by_supplier
        business_name: Shipments by Supplier
        description: >-
          Number of shipments sent by each supplier. Represents supplier shipment frequency. 
          Grain: one row per supplier.
        return_type: INTEGER
        result_grain: one row per supplier
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    shipment.supplier_id,
                    COUNT(shipment.shipment_id) AS shipments_by_supplier
                FROM ecom_bronze.shipment AS shipment
                GROUP BY shipment.supplier_id
              columns_used:
                - shipment.supplier_id
                - shipment.shipment_id
      
      - name: shipment_weight_by_supplier
        business_name: Shipment Weight by Supplier
        description: >-
          Total shipment weight by supplier. Represents supplier logistics volume. Grain: one row per supplier.
        return_type: NUMERIC
        result_grain: one row per supplier
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    shipment.supplier_id,
                    SUM(shipment.weight) AS shipment_weight_by_supplier
                FROM ecom_bronze.shipment AS shipment
                GROUP BY shipment.supplier_id
              columns_used:
                - shipment.supplier_id
