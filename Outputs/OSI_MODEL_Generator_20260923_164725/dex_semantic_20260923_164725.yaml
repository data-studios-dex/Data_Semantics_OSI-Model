      - name: monthly_prescription_volume
        business_name: Monthly Prescription Volume
        description: >-
          Count of prescriptions grouped by month. Provides time-series view of prescription volume trends.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('month', prescription.rx_timestamp) AS month,
                    COUNT(prescription.prescription_id) AS prescription_count
                FROM pharma_bronze.prescription AS prescription
                GROUP BY DATE_TRUNC('month', prescription.rx_timestamp)
                ORDER BY month
              columns_used:
                - prescription.rx_timestamp
                - prescription.prescription_id

      - name: monthly_prescription_revenue
        business_name: Monthly Prescription Revenue
        description: >-
          Total prescription revenue grouped by month. Provides time-series view of revenue trends.
        return_type: currency_usd
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('month', prescription.rx_timestamp) AS month,
                    SUM(prescription.total_amount) AS total_revenue
                FROM pharma_bronze.prescription AS prescription
                GROUP BY DATE_TRUNC('month', prescription.rx_timestamp)
                ORDER BY month
              columns_used:
                - prescription.rx_timestamp
                - prescription.total_amount

      - name: prescriptions_requiring_prior_auth
        business_name: Prescriptions Requiring Prior Authorization
        description: >-
          Count of prescriptions for drugs that require prior authorization. Filters prescriptions 
          where drug.requires_prior_auth is true.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(prescription.prescription_id) AS prescriptions_requiring_prior_auth
                FROM pharma_bronze.prescription AS prescription
                INNER JOIN pharma_bronze.drug AS drug
                    ON prescription.drug_id = drug.drug_id
                WHERE drug.requires_prior_auth = true
              columns_used:
                - prescription.prescription_id
                - prescription.drug_id
                - drug.drug_id
                - drug.requires_prior_auth

      - name: prior_auth_rate
        business_name: Prior Authorization Rate
        description: >-
          Percentage of prescriptions requiring prior authorization. Calculated as count of prescriptions 
          for drugs requiring prior auth divided by total prescription count times 100.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(prescription.prescription_id) = 0 THEN 0
                        ELSE (COUNT(CASE WHEN drug.requires_prior_auth = true THEN 1 END)::DECIMAL / COUNT(prescription.prescription_id)) * 100
                    END AS prior_auth_rate
                FROM pharma_bronze.prescription AS prescription
                INNER JOIN pharma_bronze.drug AS drug
                    ON prescription.drug_id = drug.drug_id
              columns_used:
                - prescription.prescription_id
                - prescription.drug_id
                - drug.drug_id
                - drug.requires_prior_auth
