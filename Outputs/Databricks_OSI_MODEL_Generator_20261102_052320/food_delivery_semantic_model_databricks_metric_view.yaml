version: 1.1

comment: |-
  Databricks Unity Catalog Metric View for Food Delivery Platform Analytics
  
  Generated from OSI Semantic Model: food_delivery_semantic_model
  Spine Dataset: order_items (one row per order item)
  Warehouse: dex-demo
  Schema: food_delivery
  
  This metric view provides comprehensive analytics for a food delivery platform including:
  - Customer behavior and lifetime value analysis
  - Order fulfillment and revenue metrics
  - Restaurant performance tracking
  - Delivery operations and agent performance
  - Payment transaction monitoring
  - Promotion effectiveness analysis
  - Customer satisfaction and review metrics
  - Support ticket tracking
  
  RELATIONSHIPS REPRESENTED:
  - order_items_to_orders: Each order item belongs to exactly one order
  - orders_to_customers: Each order is placed by exactly one customer
  - orders_to_restaurants: Each order is fulfilled by exactly one restaurant
  - order_items_to_menu_items: Each order item references exactly one menu item
  - deliveries_to_orders: Each delivery is associated with exactly one order (one-to-one)
  - deliveries_to_delivery_agents: Each delivery is handled by exactly one agent
  - payments_to_orders: Each payment is associated with exactly one order (one-to-one)
  - reviews_to_orders: Each review is associated with exactly one order (one-to-one)
  
  DEDUP_MODE: off (default)
  Order-level measures (total_amount, subtotal, delivery_fee, tax, tip) are NOT included
  as separate measures because they would be inflated when joined to order_items.
  Use item_revenue (sum of order_items.line_total) for item-level revenue analysis.
  
  PII_MODE: restricted (default)
  PII fields (first_name, last_name, email, phone, date_of_birth, street_address,
  apt_unit, zip_code, transaction_id, card_last_four, license_plate) are excluded.
  Geographic fields (city, state) are exposed with PII restriction notice.
  
  NOT REPRESENTED (require different grain or DEDUP_MODE on):
  - total_revenue (orders.total_amount) - would inflate when joined to order_items
  - subtotal_revenue (orders.subtotal) - would inflate when joined to order_items
  - delivery_fee_revenue (orders.delivery_fee) - would inflate when joined to order_items
  - tax_revenue (orders.tax) - would inflate when joined to order_items
  - tip_revenue (orders.tip) - would inflate when joined to order_items
  
  GROUPED METRICS (measure + dimension combinations):
  - monthly_revenue: item_revenue + order_month dimension
  - monthly_order_count: order_count + order_month dimension
  - revenue_by_restaurant: item_revenue + restaurant_name dimension
  - revenue_by_customer: item_revenue + customer_id dimension
  - revenue_by_menu_item: item_revenue + item_name dimension
  - deliveries_by_agent: delivery_count + agent_id dimension

source: '`dex-demo`.food_delivery.order_items'

joins:
  - name: orders
    source: '`dex-demo`.food_delivery.orders'
    "on": source.order_id = orders.order_id
    joins:
      - name: customers
        source: '`dex-demo`.food_delivery.customers'
        "on": orders.customer_id = customers.customer_id
        rely:
          at_most_one_match: true
      - name: restaurants
        source: '`dex-demo`.food_delivery.restaurants'
        "on": orders.restaurant_id = restaurants.restaurant_id
        rely:
          at_most_one_match: true
      - name: deliveries
        source: '`dex-demo`.food_delivery.deliveries'
        "on": orders.order_id = deliveries.order_id
        joins:
          - name: delivery_agents
            source: '`dex-demo`.food_delivery.delivery_agents'
            "on": deliveries.agent_id = delivery_agents.agent_id
            rely:
              at_most_one_match: true
          - name: agent_payouts
            source: '`dex-demo`.food_delivery.agent_payouts'
            "on": deliveries.delivery_id = agent_payouts.delivery_id
            rely:
              at_most_one_match: true
        rely:
          at_most_one_match: true
      - name: payments
        source: '`dex-demo`.food_delivery.payments'
        "on": orders.order_id = payments.order_id
        rely:
          at_most_one_match: true
      - name: reviews
        source: '`dex-demo`.food_delivery.reviews'
        "on": orders.order_id = reviews.order_id
        rely:
          at_most_one_match: true
      - name: support_tickets
        source: '`dex-demo`.food_delivery.support_tickets'
        "on": orders.order_id = support_tickets.order_id
    rely:
      at_most_one_match: true
  - name: menu_items
    source: '`dex-demo`.food_delivery.menu_items'
    "on": source.item_id = menu_items.item_id
    joins:
      - name: menu_sections
        source: '`dex-demo`.food_delivery.menu_sections'
        "on": menu_items.section_id = menu_sections.section_id
        rely:
          at_most_one_match: true
    rely:
      at_most_one_match: true

dimensions:
  - name: order_item_id
    expr: source.order_item_id
    display_name: Order Item ID
    comment: Unique identifier for an item within a customer order.
    synonyms:
      - line item id
      - item id
      - order line id

  - name: order_id
    expr: source.order_id
    display_name: Order ID
    comment: References the order that the item belongs to.
    synonyms:
      - order number
      - order reference

  - name: item_id
    expr: source.item_id
    display_name: Menu Item ID
    comment: References the menu item included in the order.
    synonyms:
      - menu item id
      - product id

  - name: item_name
    expr: source.item_name
    display_name: Item Name
    comment: Name of the item as recorded on the order.
    synonyms:
      - product name
      - menu item name

  - name: quantity
    expr: source.quantity
    display_name: Quantity
    comment: Number of units of the item ordered.
    synonyms:
      - qty
      - units ordered

  - name: unit_price
    expr: source.unit_price
    display_name: Unit Price
    comment: Monetary price per unit of the item at the time of order.
    synonyms:
      - item price
      - price per unit

  - name: line_total
    expr: source.line_total
    display_name: Line Total
    comment: Total monetary amount for the item line, including quantity.
    synonyms:
      - line amount
      - item total

  - name: customer_id
    expr: orders.customers.customer_id
    display_name: Customer ID
    comment: Unique identifier for a customer.
    synonyms:
      - customer number
      - customer reference

  - name: customer_registered_at
    expr: orders.customers.registered_at
    display_name: Customer Registered At
    comment: Timestamp recording when the customer registered for the service.
    synonyms:
      - registration date
      - signup date

  - name: customer_registration_month
    expr: DATE_TRUNC('MONTH', orders.customers.registered_at)
    display_name: Customer Registration Month
    comment: Month when the customer registered, derived from registered_at timestamp.
    synonyms:
      - signup month
      - registration month

  - name: customer_is_active
    expr: orders.customers.is_active
    display_name: Customer Is Active
    comment: Indicates whether the customer account is currently active.
    synonyms:
      - active customer
      - customer active status

  - name: customer_is_premium
    expr: orders.customers.is_premium
    display_name: Customer Is Premium
    comment: Indicates whether the customer is enrolled in a premium program.
    synonyms:
      - premium member
      - premium customer

  - name: customer_preferred_language
    expr: orders.customers.preferred_language
    display_name: Customer Preferred Language
    comment: Language preference used for communications with the customer.
    synonyms:
      - language preference
      - preferred language

  - name: restaurant_id
    expr: orders.restaurants.restaurant_id
    display_name: Restaurant ID
    comment: Unique identifier for a restaurant.
    synonyms:
      - restaurant number
      - restaurant reference

  - name: restaurant_name
    expr: orders.restaurants.name
    display_name: Restaurant Name
    comment: Display name of the restaurant.
    synonyms:
      - restaurant
      - vendor name

  - name: restaurant_city
    expr: orders.restaurants.city
    display_name: Restaurant City
    comment: City where the restaurant operates. PII - restrict access
    synonyms:
      - restaurant location
      - vendor city

  - name: restaurant_state
    expr: orders.restaurants.state
    display_name: Restaurant State
    comment: State or region where the restaurant operates. PII - restrict access
    synonyms:
      - restaurant region
      - vendor state

  - name: restaurant_is_active
    expr: orders.restaurants.is_active
    display_name: Restaurant Is Active
    comment: Indicates whether the restaurant is currently active on the platform.
    synonyms:
      - active restaurant
      - restaurant active status

  - name: restaurant_created_at
    expr: orders.restaurants.created_at
    display_name: Restaurant Created At
    comment: Timestamp recording when the restaurant record was created on the platform.
    synonyms:
      - restaurant onboarded
      - restaurant joined

  - name: order_status
    expr: orders.order_status
    display_name: Order Status
    comment: Indicates the current status of the order, such as Placed, Delivered, or Cancelled.
    synonyms:
      - status
      - order state

  - name: order_payment_method
    expr: orders.payment_method
    display_name: Order Payment Method
    comment: Payment method used for the order, such as Credit Card or Digital Wallet. PII - restrict access
    synonyms:
      - payment type
      - payment method

  - name: order_ordered_at
    expr: orders.ordered_at
    display_name: Order Ordered At
    comment: Timestamp recording when the order was placed.
    synonyms:
      - order date
      - order time
      - placed at

  - name: order_month
    expr: DATE_TRUNC('MONTH', orders.ordered_at)
    display_name: Order Month
    comment: Month when the order was placed, derived from ordered_at timestamp.
    synonyms:
      - order period
      - order month

  - name: order_estimated_delivery_at
    expr: orders.estimated_delivery_at
    display_name: Order Estimated Delivery At
    comment: Timestamp indicating the estimated delivery time communicated to the customer.
