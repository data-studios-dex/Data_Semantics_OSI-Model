version: 1.1

comment: |-
  Databricks Unity Catalog Metric View for retail e-commerce analytics.
  
  Spine: order_items (one row per order line item).
  
  Relationships represented (7):
    - orders_to_customers: orders.customer_id = customers.customer_id
    - order_items_to_orders: order_items.order_id = orders.order_id
    - order_items_to_products: order_items.product_id = products.product_id
    - products_to_product_categories: products.category_id = product_categories.category_id
    - product_categories_hierarchy: product_categories.parent_category_id = parent_categories.category_id
    - payments_to_orders: payments.order_id = orders.order_id
    - shipments_to_orders: shipments.order_id = orders.order_id
  
  Grouped metrics (dimension pairings):
    - revenue_by_customer: total_line_item_revenue + customer_id
    - revenue_by_product: total_line_item_revenue + product_id
    - revenue_by_category: total_line_item_revenue + category_name
    - revenue_by_sales_channel: total_line_item_revenue + sales_channel
    - revenue_by_customer_segment: total_line_item_revenue + customer_segment
    - revenue_by_payment_method: total_payment_amount + payment_method
    - orders_by_status: order_count + order_status
    - shipments_by_status: shipment_count + shipment_status
    - payments_by_status: payment_transaction_count + payment_status
    - revenue_by_month: total_line_item_revenue + order_month
    - orders_by_month: order_count + order_month
    - customers_by_month: customer_count + customer_registration_month (counts only customers who ordered)
  
  NOT REPRESENTED (DEDUP_MODE off):
    - total_revenue (order-level, requires deduplication)
    - total_subtotal_revenue (order-level, requires deduplication)
    - total_discount_amount (order-level, requires deduplication)
    - total_tax_amount (order-level, requires deduplication)
    - total_shipping_fee (order-level, requires deduplication)
    - total_inventory_value (requires product table as grain)
    - stock_quantity (requires product table as grain)
    - average_cost_price (requires product table as grain)
    - catalog_unit_price (requires product table as grain)
  
  PII_MODE: restricted (excludes first_name, last_name, email, phone, date_of_birth, postal_code, ship_postal_code, transaction_ref, tracking_number)

source: '`dex-demo`.ecom_bronze.order_items'

joins:
  - name: orders
    source: '`dex-demo`.ecom_bronze.orders'
    "on": source.order_id = orders.order_id
    joins:
      - name: customers
        source: '`dex-demo`.ecom_bronze.customers'
        "on": orders.customer_id = customers.customer_id
        rely:
          at_most_one_match: true
      - name: payments
        source: '`dex-demo`.ecom_bronze.payments'
        "on": orders.order_id = payments.order_id
      - name: shipments
        source: '`dex-demo`.ecom_bronze.shipments'
        "on": orders.order_id = shipments.order_id
    rely:
      at_most_one_match: true
  - name: products
    source: '`dex-demo`.ecom_bronze.products'
    "on": source.product_id = products.product_id
    joins:
      - name: product_categories
        source: '`dex-demo`.ecom_bronze.product_categories'
        "on": products.category_id = product_categories.category_id
        joins:
          - name: parent_categories
            source: '`dex-demo`.ecom_bronze.product_categories'
            "on": product_categories.parent_category_id = parent_categories.category_id
            rely:
              at_most_one_match: true
        rely:
          at_most_one_match: true
    rely:
      at_most_one_match: true

dimensions:
  - name: order_item_id
    expr: source.order_item_id
    display_name: Order Item ID
    comment: Unique identifier for an order line item.
    synonyms:
      - line item id
      - order line id
  - name: order_id
    expr: source.order_id
    display_name: Order ID
    comment: References the related customer order record.
    synonyms:
      - order identifier
  - name: line_number
    expr: source.line_number
    display_name: Line Number
    comment: Sequential line number of the item within the order.
  - name: product_id
    expr: source.product_id
    display_name: Product ID
    comment: References the product associated with the order line.
    synonyms:
      - product identifier
  - name: order_number
    expr: orders.order_number
    display_name: Order Number
    comment: Business-facing order number assigned to the customer purchase.
  - name: customer_id
    expr: orders.customers.customer_id
    display_name: Customer ID
    comment: Unique identifier for a retail customer.
    synonyms:
      - customer identifier
  - name: customer_code
    expr: orders.customers.customer_code
    display_name: Customer Code
    comment: Business-defined code used to uniquely reference the customer.
  - name: gender
    expr: orders.customers.gender
    display_name: Gender
    comment: Indicates the gender of the customer as provided. PII - restrict access
  - name: customer_city
    expr: orders.customers.city
    display_name: Customer City
    comment: City of the customer's primary address. PII - restrict access
    synonyms:
      - city
  - name: state
    expr: orders.customers.state
    display_name: State
    comment: State or province of the customer's primary address. PII - restrict access
  - name: country
    expr: orders.customers.country
    display_name: Country
    comment: Country of the customer's primary address.
  - name: customer_segment
    expr: orders.customers.customer_segment
    display_name: Customer Segment
    comment: Marketing or business segment classification of the customer.
    synonyms:
      - segment
  - name: registration_date
    expr: orders.customers.registration_date
    display_name: Registration Date
    comment: Date when the customer registered with the retail channel.
  - name: customer_registration_month
    expr: DATE_TRUNC('MONTH', orders.customers.registration_date)
    display_name: Customer Registration Month
    comment: Month when the customer registered, derived from registration date.
  - name: is_active_customer
    expr: orders.customers.is_active
    display_name: Is Active Customer
    comment: Indicates whether the customer account is currently active.
  - name: order_date
    expr: orders.order_date
    display_name: Order Date
    comment: Timestamp recording when the order was placed.
  - name: order_month
    expr: DATE_TRUNC('MONTH', orders.order_date)
    display_name: Order Month
    comment: Month when the order was placed, derived from order date.
  - name: order_status
    expr: orders.order_status
    display_name: Order Status
    comment: Indicates the current lifecycle status of the order.
    synonyms:
      - status
  - name: sales_channel
    expr: orders.sales_channel
    display_name: Sales Channel
    comment: Channel through which the order was placed, such as online or store.
    synonyms:
      - channel
  - name: order_ship_city
    expr: orders.ship_city
    display_name: Order Ship City
    comment: City component of the shipping address for the order. PII - restrict access
  - name: order_ship_state
    expr: orders.ship_state
    display_name: Order Ship State
    comment: State or province component of the shipping address for the order. PII - restrict access
  - name: order_currency
    expr: orders.currency
    display_name: Order Currency
    comment: Currency code in which the order amounts are denominated.
  - name: payment_id
    expr: orders.payments.payment_id
    display_name: Payment ID
    comment: Unique identifier for a payment transaction.
    synonyms:
      - payment identifier
  - name: payment_method
    expr: orders.payments.payment_method
    display_name: Payment Method
    comment: Method used to settle the payment, such as card or PayPal.
  - name: payment_status
    expr: orders.payments.payment_status
    display_name: Payment Status
    comment: Indicates the current processing status of the payment.
  - name: payment_currency
    expr: orders.payments.currency
    display_name: Payment Currency
    comment: Currency code in which the payment amount is denominated.
  - name: gateway
    expr: orders.payments.gateway
    display_name: Gateway
    comment: Name of the payment gateway or processor handling the transaction.
  - name: paid_at
    expr: orders.payments.paid_at
    display_name: Paid At
    comment: Timestamp when the payment was captured or confirmed.
  - name: paid_month
    expr: DATE_TRUNC('MONTH', orders.payments.paid_at)
    display_name: Paid Month
    comment: Month when the payment was captured, derived from paid at timestamp.
  - name: shipment_id
    expr: orders.shipments.shipment_id
    display_name: Shipment ID
    comment: Unique identifier for a shipment record.
    synonyms:
      - shipment identifier
  - name: carrier
    expr: orders.shipments.carrier
    display_name: Carrier
    comment: Name of the shipping carrier handling the shipment.
  - name: shipment_status
    expr: orders.shipments.shipment_status
    display_name: Shipment Status
    comment: Indicates the current delivery status of the shipment.
  - name: shipped_at
    expr: orders.shipments.shipped_at
    display_name: Shipped At
    comment: Timestamp when the shipment left the fulfillment location.
  - name: shipped_month
    expr: DATE_TRUNC('MONTH', orders.shipments.shipped_at)
    display_name: Shipped Month
    comment: Month when the shipment was dispatched, derived from shipped at timestamp.
  - name: delivered_at
    expr: orders.shipments.delivered_at
    display_name: Delivered At
    comment: Timestamp when the shipment was delivered to the customer.
  - name: shipment_ship_city
    expr: orders.shipments.ship_city
    display_name: Shipment Ship City
    comment: City component of the shipment destination address. PII - restrict access
  - name: shipment_ship_state
    expr: orders.shipments.ship_state
    display_name: Shipment Ship State
    comment: State or province component of the shipment destination address. PII - restrict access
  - name: sku
    expr: products.sku
    display_name: SKU
    comment: Stock keeping unit code used to uniquely identify the product.
  - name: product_name
    expr: products.product_name
    display_name: Product Name
    comment: Descriptive name of the product.
  - name: category_id
    expr: products.category_id
    display_name: Category ID
    comment: References the category under which the product is classified.
    synonyms:
      - category identifier
  - name: product_brand
    expr: products.brand
    display_name: Product Brand
    comment: Brand or manufacturer of the product.
    synonyms:
      - brand
  - name: product_currency
    expr: products.currency
    display_name: Product Currency
    comment: Currency code in which product prices are denominated.
  - name: is_active_product
    expr: products.is_active
    display_name: Is Active Product
    comment: Indicates whether the product is currently active for sale.
  - name: product_created_at
    expr: products.created_at
    display_name: Product Created At
    comment: Timestamp when the product record was initially created.
  - name: category_name
    expr: products.product_categories.category_name
    display_name: Category Name
    comment: Descriptive name of the product category.
  - name: parent_category_id
    expr: products.product_categories.parent_category_id
    display_name: Parent Category ID
    comment: Identifier of the parent category for hierarchical grouping.
  - name: is_active_category
    expr: products.product_categories.is_active
    display_name: Is Active Category
    comment: Indicates whether the product category is currently active for use.
  - name: parent_category_name
    expr: products.product_categories.parent_categories.category_name
    display_name: Parent Category Name
    comment: Descriptive name of the parent product category.

measures:
  - name: total_line_item_revenue
    expr: SUM(source.line_total)
    display_name: Total Line Item Revenue
    comment: Total revenue from all order line items, calculated as the sum of line totals after line-level discounts. This metric is used for product-level revenue analysis.
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - line item revenue
      - line revenue
      - product revenue
  - name: total_units_sold
    expr: SUM(source.quantity)
    display_name: Total Units Sold
    comment: Total number of product units sold across all order line items, calculated as the sum of quantities.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - units sold
      - quantity sold
  - name: average_unit_price
    expr: AVG(source.unit_price)
    display_name: Average Unit Price
    comment: Average selling price per unit of products at the time of order.
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - avg unit price
      - mean unit price
  - name: average_discount_pct
    expr: ROUND(AVG(source.discount_pct), 2)
    display_name: Average Discount Percentage
    comment: Average discount percentage applied to order line items, calculated as the average of line-level discount percentages.
    format:
      type: number
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - avg discount
      - mean discount
  - name: average_line_item_value
    expr: ROUND(MEASURE(total_line_item_revenue) / NULLIF(COUNT(source.order_item_id), 0), 2)
    display_name: Average Line Item Value
    comment: Average line item value, calculated as the total line item revenue divided by the number of line items.
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - avg line value
      - mean line value
  - name: total_cogs
    expr: SUM(source.quantity * products.cost_price)
    display_name: Total Cost of Goods Sold
    comment: Total cost of goods sold. Lines whose product has no cost_price are excluded from COGS, which overstates gross profit.
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - COGS
      - cost of goods sold
  - name: gross_profit
    expr: MEASURE(total_line_item_revenue) - MEASURE(total_cogs)
    display_name: Gross Profit
    comment: Gross profit calculated as the difference between line item revenue and cost of goods sold. Lines whose product has no cost_price are excluded from COGS, which overstates gross profit.
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - profit
      - margin
  - name: gross_margin_pct
    expr: MEASURE(gross_profit) / NULLIF(MEASURE(total_line_item_revenue), 0)
    display_name: Gross Margin Percentage
    comment: Gross margin percentage calculated as gross profit divided by line item revenue, expressed as a fraction (0.25 = 25%). This represents the percentage of revenue retained after deducting cost of goods sold.
    format:
      type: percentage
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - margin percentage
      - profit margin
  - name: order_count
    expr: COUNT(DISTINCT orders.order_id)
    display_name: Order Count
    comment: Total number of orders. Counts only orders with at least one line item.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - number of orders
      - order total
  - name: average_order_value
    expr: ROUND(MEASURE(total_line_item_revenue) / NULLIF(MEASURE(order_count), 0), 2)
    display_name: Average Order Value
    comment: Average order value, calculated as total line item revenue divided by order count. Based on line item revenue, so it excludes order-level tax, shipping and order discounts.
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - AOV
      - avg order value
  - name: average_units_per_order
    expr: ROUND(CAST(MEASURE(total_units_sold) AS DOUBLE) / NULLIF(MEASURE(order_count), 0), 2)
    display_name: Average Units Per Order
    comment: Average number of units per order, calculated as the total units sold divided by the number of orders.
    format:
      type: number
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - avg units per order
  - name: customer_count
    expr: COUNT(DISTINCT orders.customers.customer_id)
    display_name: Customer Count
    comment: Total number of customers. Counts only customers that appear on at least one order with line items.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - number of customers
      - customer total
  - name: active_customer_count
    expr: COUNT(DISTINCT CASE WHEN orders.customers.is_active = TRUE THEN orders.customers.customer_id END)
    display_name: Active Customer Count
    comment: Total number of active customers. Counts only customers that appear on at least one order with line items.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - active customers
  - name: product_count
    expr: COUNT(DISTINCT products.product_id)
    display_name: Product Count
    comment: Total number of products. Counts only products that appear on at least one order line item.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - number of products
      - product total
  - name: payment_transaction_count
    expr: COUNT(DISTINCT orders.payments.payment_id)
    display_name: Payment Transaction Count
    comment: Total number of payment transactions. Payments and shipments are joined many-to-one; if an order has more than one, only the first match is used, so these undercount.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - payment count
      - transactions
  - name: total_payment_amount
    expr: SUM(orders.payments.amount)
    display_name: Total Payment Amount
    comment: Total payment amount across all transactions. WARNING - order payments repeat once per order line, so this total is inflated unless the query groups by order_id. Use payment_transaction_count for counts.
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - payment total
      - payment revenue
  - name: shipment_count
    expr: COUNT(DISTINCT orders.shipments.shipment_id)
    display_name: Shipment Count
    comment: Total number of shipments. Payments and shipments are joined many-to-one; if an order has more than one, only the first match is used, so these undercount.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - number of shipments
  - name: delivery_time_days
    expr: ROUND(AVG(DATEDIFF(orders.shipments.delivered_at, orders.shipments.shipped_at)), 2)
    display_name: Delivery Time Days
    comment: Average delivery time in days, calculated as the average difference between delivered and shipped timestamps. Payments and shipments are joined many-to-one; if an order has more than one, only the first match is used, so these undercount.
    format:
      type: number
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - avg delivery time
      - delivery days
